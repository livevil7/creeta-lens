<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lens — Documentation Board</title>
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">

<style>
/* ════ Light design tokens (cloned from livevil-contents/docs/board.html) ════ */
:root {
  --bg: #fafafa;
  --card: #ffffff;
  --fg: #18181b;
  --fg-2: #3f3f46;
  --fg-mute: #71717a;
  --line: #e4e4e7;
  --line-soft: #f1f1f3;
  --accent: #2563eb;
  --accent-soft: rgba(37, 99, 235, 0.08);
  --warn: #b91c1c;
  --stale: #b45309;
  --stale-soft: rgba(180, 83, 9, 0.12);
  --good: #16a34a;
  --rules: #7c3aed;
  --rules-soft: rgba(124, 58, 237, 0.10);
}

* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
html, body { margin: 0; padding: 0; min-height: 100%; background: var(--bg); color: var(--fg); }

body {
  font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.55;
  font-feature-settings: "tnum";
}

::selection { background: var(--accent-soft); }

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

button {
  font: inherit; cursor: pointer;
  background: var(--card); color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 6px 12px;
  letter-spacing: -0.005em;
  transition: border-color 120ms, background 120ms, color 120ms;
}
button:hover { border-color: var(--fg-mute); }
button:active { transform: translateY(1px); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500; }
button.primary:hover { background: #1d4fd4; border-color: #1d4fd4; }
button.ghost { border-color: transparent; color: var(--fg-mute); }
button.ghost:hover { color: var(--fg); background: var(--line-soft); }

code, .mono {
  font-family: "Pretendard Variable", monospace;
  font-variant-numeric: tabular-nums;
}
code {
  font-size: 0.92em;
  background: var(--line-soft);
  padding: 1px 5px;
  border-radius: 3px;
  color: var(--accent);
}

/* ════ Top bar ════ */
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: rgba(250, 250, 250, 0.9);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  padding: 12px 24px;
  display: flex; align-items: center; gap: 16px;
}
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand .repo { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
.brand .repo .dim { color: var(--fg-mute); font-weight: 400; }
.brand .title { font-size: 12px; color: var(--fg-mute); }

.topbar .grow { flex: 1; }
.topbar .stats {
  display: flex; gap: 14px;
  font-size: 11px; color: var(--fg-mute);
  font-variant-numeric: tabular-nums;
}
.topbar .stats b { color: var(--fg); font-weight: 500; }
.topbar .stats .sep { color: var(--line); }

.search input {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 6px 12px;
  width: 240px;
  font: inherit;
  color: var(--fg);
}
.search input:focus { outline: none; border-color: var(--accent); }

/* ════ Board grid ════ */
.board {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  padding: 12px;
  min-height: calc(100vh - 53px);
}
.column {
  display: flex; flex-direction: column;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 6px;
  min-width: 0;
}
.col-head {
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
}
.col-head .label {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-mute);
  font-weight: 500;
}
.col-head .label .pip { width: 6px; height: 6px; border-radius: 50%; }
.column[data-column="tasks"]   .pip { background: var(--accent); }
.column[data-column="history"] .pip { background: var(--good); }
.column[data-column="rules"]   .pip { background: var(--rules); }
/* Rules column reads as "reference docs" — muted purple header accent. */
.column[data-column="rules"] .col-head { background: var(--rules-soft); }
.column[data-column="rules"] .col-head .label { color: var(--rules); }
.col-head .count {
  font-size: 11px;
  color: var(--fg-mute);
  font-variant-numeric: tabular-nums;
}

.cards {
  flex: 1;
  overflow-y: auto;
  display: flex; flex-direction: column;
  gap: 8px;
  padding: 10px;
}

/* ════ Card ════ */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 14px 16px;
  cursor: pointer;
  user-select: none;
  transition: border-color 120ms;
}
.card:hover { border-color: var(--fg-mute); }

.card h3.tt {
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: -0.01em;
  margin: 0;
  color: var(--fg);
  text-wrap: balance;
  word-break: break-word;
}

.card .meta-row {
  display: flex; flex-wrap: wrap; gap: 7px; align-items: center;
  margin-top: 9px;
  font-size: 11px;
  color: var(--fg-mute);
  font-variant-numeric: tabular-nums;
}
.card .meta-row .date { color: var(--fg-mute); }
.badge {
  font-size: 9.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 1.5px 6px;
  border-radius: 3px;
  font-weight: 600;
  line-height: 1.6;
}
.badge.html  { background: var(--accent-soft); color: var(--accent); }
.badge.md    { background: var(--line-soft); color: var(--fg-mute); }
.badge.stale { background: var(--stale-soft); color: var(--stale); }

.empty {
  padding: 32px 16px;
  text-align: center;
  color: var(--fg-mute);
  font-size: 12px;
  font-style: italic;
}

/* ════ Slide-over panel (cloned from reference) ════ */
.scrim {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(24, 24, 27, 0.4);
  opacity: 0; pointer-events: none;
  transition: opacity 200ms;
}
.scrim.open { opacity: 1; pointer-events: auto; }

.panel {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(860px, 62vw);
  background: var(--bg);
  border-left: 1px solid var(--line);
  z-index: 100;
  transform: translateX(100%);
  transition: transform 240ms cubic-bezier(0.22, 1, 0.36, 1);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.panel.open { transform: translateX(0); }

.panel header {
  padding: 18px 28px 14px;
  border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: flex-start; gap: 14px;
  background: var(--card);
}
.panel header .info { min-width: 0; }
.panel header .id-row {
  font-size: 11px;
  color: var(--fg-mute);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
  margin-bottom: 4px;
}
.panel header h2 {
  margin: 0;
  font-size: 22px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--fg);
  text-wrap: balance;
  max-width: 56ch;
  word-break: break-word;
}
.panel header .top-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }

.panel .notes {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  padding: 10px 28px;
  font-size: 11.5px;
  border-bottom: 1px solid var(--line);
  background: var(--card);
}
.panel .notes:empty { display: none; }
.panel .notes .trunc { color: var(--warn); }
.panel .notes .trunc a { color: var(--warn); text-decoration: underline; }

.panel .scroll { flex: 1; overflow: hidden; position: relative; }

.report-frame {
  width: 100%; height: 100%;
  border: 0; display: block;
  background: #fff;
}

.md-scroll { width: 100%; height: 100%; overflow: auto; }
.md-pre {
  margin: 0;
  padding: 24px 28px 48px;
  font-family: "Pretendard Variable", ui-monospace, monospace;
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--fg-2);
  white-space: pre-wrap;
  word-break: break-word;
  tab-size: 2;
}

/* ════ Toast ════ */
.toast {
  position: fixed;
  bottom: 24px; left: 50%; transform: translateX(-50%) translateY(12px);
  background: var(--fg);
  color: var(--card);
  border-radius: 4px;
  padding: 11px 18px;
  font-size: 12.5px;
  line-height: 1.5;
  z-index: 300;
  opacity: 0;
  transition: all 200ms;
  pointer-events: none;
  max-width: 520px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
}
.toast .cmd {
  font-family: "Pretendard Variable", ui-monospace, monospace;
  font-size: 11.5px;
  color: #93c5fd;
  word-break: break-all;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ════ Modal (clipboard fallback) ════ */
.modal-scrim {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(24, 24, 27, 0.45);
  display: none;
  align-items: center; justify-content: center;
  padding: 24px;
}
.modal-scrim.open { display: flex; }
.modal {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 22px 24px 20px;
  width: min(560px, 100%);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
}
.modal h3 {
  margin: 0 0 6px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.modal p {
  margin: 0 0 14px;
  font-size: 12.5px;
  color: var(--fg-mute);
  line-height: 1.55;
}
.modal textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 10px 12px;
  color: var(--fg);
  font-family: "Pretendard Variable", ui-monospace, monospace;
  font-size: 12.5px;
  resize: none;
  min-height: 64px;
}
.modal textarea:focus { outline: none; border-color: var(--accent); }
.modal .modal-actions {
  display: flex; justify-content: flex-end; gap: 8px;
  margin-top: 16px;
}

/* ════ Print ════ */
@media print {
  .topbar, .scrim, .toast, .modal-scrim { display: none !important; }
  .panel { position: static; transform: none; width: 100%; }
  body { background: #fff; }
}

/* ════ Responsive ════ */
@media (max-width: 980px) {
  .board { grid-template-columns: 1fr; }
  .panel { width: 100vw; }
  .topbar { flex-wrap: wrap; }
  .search input { width: 180px; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="repo" id="repo-name">repo<span class="dim"> / docs</span></div>
    <div class="title">· Documentation Board</div>
  </div>
  <div class="search">
    <input id="search" type="search" placeholder="Search titles…" spellcheck="false">
  </div>
  <div class="grow"></div>
  <div class="stats" id="stats"></div>
</div>

<main class="board" id="board">
  <section class="column" data-column="tasks">
    <div class="col-head">
      <div class="label"><span class="pip"></span>Tasks</div>
      <div class="count" data-count="tasks">0</div>
    </div>
    <div class="cards" data-col="tasks"></div>
  </section>
  <section class="column" data-column="history">
    <div class="col-head">
      <div class="label"><span class="pip"></span>History</div>
      <div class="count" data-count="history">0</div>
    </div>
    <div class="cards" data-col="history"></div>
  </section>
  <section class="column" data-column="rules">
    <div class="col-head">
      <div class="label"><span class="pip"></span>Rules</div>
      <div class="count" data-count="rules">0</div>
    </div>
    <div class="cards" data-col="rules"></div>
  </section>
</main>

<div class="scrim" id="scrim"></div>

<aside class="panel" id="panel" aria-hidden="true">
  <header>
    <div class="info">
      <div class="id-row" id="p-id"></div>
      <h2 id="p-title"></h2>
    </div>
    <div class="top-actions" id="p-actions">
      <button class="ghost" id="p-close">close</button>
    </div>
  </header>
  <div class="notes" id="p-notes"></div>
  <div class="scroll" id="p-body"></div>
</aside>

<div class="toast" id="toast"></div>

<div class="modal-scrim" id="modal-scrim">
  <div class="modal" role="dialog" aria-modal="true">
    <h3>Copy this command manually</h3>
    <p>Clipboard access was blocked. Select the command below and copy it, then paste it into Claude Code.</p>
    <textarea id="modal-cmd" readonly spellcheck="false"></textarea>
    <div class="modal-actions">
      <button class="primary" id="modal-close">Done</button>
    </div>
  </div>
</div>

<script>
(() => {
  "use strict";

  // The builder string-replaces the placeholder below with a schema-v3 JSON object.
  const BOARD = {{BOARD_DATA}};

  const $ = (s, p = document) => p.querySelector(s);
  const $$ = (s, p = document) => Array.from(p.querySelectorAll(s));
  const el = (tag, attrs, ...children) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;        // always textContent — never innerHTML
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else if (v !== undefined && v !== null) e.setAttribute(k, v);
    }
    for (const c of children) {
      if (c == null) continue;
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return e;
  };

  const GROUP_LABELS = { tasks: "Tasks", history: "History", rules: "Rules" };
  const GROUP_ORDER = ["tasks", "history", "rules"];

  const repo = BOARD.repo || "repo";
  const groups = BOARD.groups || { tasks: [], history: [], rules: [] };
  let viewing = null;     // active doc id
  let filterText = "";

  // index docs by id for O(1) lookup
  const byId = {};
  for (const g of GROUP_ORDER) for (const d of (groups[g] || [])) byId[d.id] = d;
  const total = GROUP_ORDER.reduce((n, g) => n + (groups[g] || []).length, 0);

  // ── header ──
  $("#repo-name").textContent = repo;
  $("#repo-name").appendChild(el("span", { class: "dim", text: " / docs" }));

  // ── render board ──
  function renderBoard() {
    const f = filterText.trim().toLowerCase();
    let shown = 0;
    for (const g of GROUP_ORDER) {
      const all = groups[g] || [];
      const docs = f ? all.filter(d => (d.title || d.id).toLowerCase().includes(f)) : all;
      shown += docs.length;
      const wrap = $(`[data-col="${g}"]`);
      wrap.replaceChildren();
      if (docs.length === 0) {
        wrap.appendChild(el("div", { class: "empty", text: "empty" }));
      } else {
        for (const d of docs) wrap.appendChild(renderCard(d));
      }
      $(`[data-count="${g}"]`).textContent = String(docs.length).padStart(2, "0");
    }
    const statsEl = $("#stats");
    statsEl.replaceChildren();
    statsEl.appendChild(el("span", null, "showing ", el("b", { text: String(shown) }), " / ", el("b", { text: String(total) })));
    if (BOARD.generatedAt) {
      statsEl.appendChild(el("span", { class: "sep" }, "·"));
      const gen = BOARD.generatedAt.replace("T", " ").replace(/\.\d+Z$/, "Z");
      statsEl.appendChild(el("span", null, "generated ", el("b", { text: gen })));
    }
  }

  function renderCard(doc) {
    const card = el("article", { class: "card", "data-id": doc.id, onclick: () => openPanel(doc.id) });
    card.appendChild(el("h3", { class: "tt", text: doc.title || doc.id }));

    const meta = el("div", { class: "meta-row" });
    if (doc.date) meta.appendChild(el("span", { class: "date", text: doc.date }));
    meta.appendChild(el("span", { class: "badge " + (doc.hasHtml ? "html" : "md"), text: doc.hasHtml ? "HTML" : "MD" }));
    if (doc.stale) meta.appendChild(el("span", { class: "badge stale", text: "stale" }));
    card.appendChild(meta);
    return card;
  }

  // ── panel ──
  function openPanel(id) {
    viewing = id;
    $("#scrim").classList.add("open");
    $("#panel").classList.add("open");
    $("#panel").setAttribute("aria-hidden", "false");
    renderPanel();
  }
  function closePanel() {
    $("#scrim").classList.remove("open");
    $("#panel").classList.remove("open");
    $("#panel").setAttribute("aria-hidden", "true");
    viewing = null;
  }

  function renderPanel() {
    const doc = byId[viewing];
    if (!doc) { closePanel(); return; }

    $("#p-id").textContent = doc.id + (doc.date ? "  ·  " + doc.date : "") + "  ·  " + (GROUP_LABELS[doc.folder] || doc.folder);
    $("#p-title").textContent = doc.title || doc.id;

    // actions: "Open in new tab" for html docs, "Convert to HTML" for md-only
    const actions = $("#p-actions");
    actions.replaceChildren();
    if (doc.hasHtml && doc.htmlPath) {
      actions.appendChild(el("button", {
        class: "ghost",
        text: "Open in new tab",
        onclick: () => window.open(doc.htmlPath, "_blank", "noopener"),
      }));
    } else {
      actions.appendChild(el("button", {
        class: "primary",
        text: "Convert to HTML",
        onclick: () => convert(doc),
      }));
    }
    actions.appendChild(el("button", { class: "ghost", text: "close", onclick: closePanel }));

    // notes (truncated md)
    const notes = $("#p-notes");
    notes.replaceChildren();
    if (doc.truncated) {
      const span = el("span", { class: "trunc" });
      span.appendChild(document.createTextNode("⚠ truncated — "));
      if (doc.mdPath) {
        span.appendChild(el("a", { href: doc.mdPath, target: "_blank", rel: "noopener", text: "open original" }));
      } else {
        span.appendChild(document.createTextNode("open original"));
      }
      notes.appendChild(span);
    }

    // body: iframe for html report, raw md (textContent) otherwise
    const body = $("#p-body");
    body.replaceChildren();
    if (doc.hasHtml && doc.htmlPath) {
      body.appendChild(el("iframe", {
        class: "report-frame",
        src: doc.htmlPath,
        title: doc.title || doc.id,
        loading: "lazy",
      }));
    } else {
      const scroll = el("div", { class: "md-scroll" });
      const pre = el("pre", { class: "md-pre" });
      // HARD SECURITY REQUIREMENT: md is untrusted — render via textContent ONLY.
      pre.textContent = doc.mdInline || "(empty)";
      scroll.appendChild(pre);
      body.appendChild(scroll);
    }
  }

  // ── convert to html (clipboard + fallback) ──
  function convert(doc) {
    const cmd = "/cp html docs/" + doc.mdPath;
    const ok = () => toast("Command copied — paste into Claude Code:", cmd);
    const fail = () => openModal(cmd);
    // file:// is not a secure context — navigator.clipboard is blocked there and
    // writeText can hang silently. Gate on isSecureContext so file:// goes straight
    // to the modal (which shows the command for manual copy).
    if (window.isSecureContext && navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(cmd).then(ok, fail);
    } else {
      fail();
    }
  }

  // ── toast ──
  function toast(msg, cmd, ms = 4000) {
    const t = $("#toast");
    t.replaceChildren(document.createTextNode(msg));
    if (cmd) {
      t.appendChild(document.createElement("br"));
      t.appendChild(el("span", { class: "cmd", text: cmd }));
    }
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove("show"), ms);
  }

  // ── modal (manual copy fallback — must NOT look successful) ──
  function openModal(cmd) {
    const ta = $("#modal-cmd");
    ta.value = cmd;
    $("#modal-scrim").classList.add("open");
    ta.focus();
    ta.select();
    try { ta.setSelectionRange(0, cmd.length); } catch (_) {}
  }
  function closeModal() { $("#modal-scrim").classList.remove("open"); }

  // ── events ──
  $("#search").addEventListener("input", (e) => { filterText = e.target.value; renderBoard(); });
  $("#p-close").addEventListener("click", closePanel);
  $("#scrim").addEventListener("click", closePanel);
  $("#modal-close").addEventListener("click", closeModal);
  $("#modal-scrim").addEventListener("click", (e) => { if (e.target === $("#modal-scrim")) closeModal(); });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if ($("#modal-scrim").classList.contains("open")) { closeModal(); return; }
    if (viewing) closePanel();
  });

  // ── init ──
  renderBoard();
})();
</script>
</body>
</html>
