<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lens — Documentation Board</title>
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">

<style>
/* ════ Light design tokens ════ */
:root {
  --bg: #fafafa;
  --card: #ffffff;
  --fg: #18181b;
  --fg-2: #3f3f46;
  --fg-mute: #71717a;
  --line: #e4e4e7;
  --line-soft: #f1f1f3;
  --accent: #2563eb;
  --accent-soft: rgba(37, 99, 235, 0.08);
  --warn: #b91c1c;
  --stale: #b45309;
  --stale-soft: rgba(180, 83, 9, 0.12);
  --good: #16a34a;
  --rules: #7c3aed;
  --rules-soft: rgba(124, 58, 237, 0.10);
}

* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
html, body { margin: 0; padding: 0; min-height: 100%; background: var(--bg); color: var(--fg); }

body {
  font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.55;
  font-feature-settings: "tnum";
}

::selection { background: var(--accent-soft); }

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

button {
  font: inherit; cursor: pointer;
  background: var(--card); color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 6px 12px;
  letter-spacing: -0.005em;
  transition: border-color 120ms, background 120ms, color 120ms;
}
button:hover { border-color: var(--fg-mute); }
button:active { transform: translateY(1px); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500; }
button.primary:hover { background: #1d4fd4; border-color: #1d4fd4; }
button.ghost { border-color: transparent; color: var(--fg-mute); }
button.ghost:hover { color: var(--fg); background: var(--line-soft); }

code, .mono {
  font-family: "Pretendard Variable", monospace;
  font-variant-numeric: tabular-nums;
}
code {
  font-size: 0.92em;
  background: var(--line-soft);
  padding: 1px 5px;
  border-radius: 3px;
  color: var(--accent);
}

/* ════ Top bar ════ */
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: rgba(250, 250, 250, 0.9);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  padding: 12px 24px;
  display: flex; align-items: center; gap: 16px;
}
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand .repo { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
.brand .repo .dim { color: var(--fg-mute); font-weight: 400; }
.brand .title { font-size: 12px; color: var(--fg-mute); }

.topbar .grow { flex: 1; }
.topbar .stats {
  display: flex; gap: 14px;
  font-size: 11px; color: var(--fg-mute);
  font-variant-numeric: tabular-nums;
}
.topbar .stats b { color: var(--fg); font-weight: 500; }
.topbar .stats .sep { color: var(--line); }

.search input {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 6px 12px;
  width: 240px;
  font: inherit;
  color: var(--fg);
}
.search input:focus { outline: none; border-color: var(--accent); }

/* ════ Board grid ════ */
.board {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  padding: 12px;
  min-height: calc(100vh - 53px);
}
.column {
  display: flex; flex-direction: column;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 6px;
  min-width: 0;
}
.col-head {
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
}
.col-head .label {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-mute);
  font-weight: 500;
}
.col-head .label .pip { width: 6px; height: 6px; border-radius: 50%; }
.column[data-column="tasks"]   .pip { background: var(--accent); }
.column[data-column="history"] .pip { background: var(--good); }
.column[data-column="rules"]   .pip { background: var(--rules); }
/* Rules column reads as "reference docs" — muted purple header accent. */
.column[data-column="rules"] .col-head { background: var(--rules-soft); }
.column[data-column="rules"] .col-head .label { color: var(--rules); }
.col-head .count {
  font-size: 11px;
  color: var(--fg-mute);
  font-variant-numeric: tabular-nums;
}

.cards {
  flex: 1;
  overflow-y: auto;
  display: flex; flex-direction: column;
  gap: 8px;
  padding: 10px;
}

/* ════ Card ════ */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 14px 16px;
  cursor: pointer;
  user-select: none;
  transition: border-color 120ms;
}
.card:hover { border-color: var(--fg-mute); }

.card h3.tt {
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: -0.01em;
  margin: 0;
  color: var(--fg);
  text-wrap: balance;
  word-break: break-word;
}

.card .meta-row {
  display: flex; flex-wrap: wrap; gap: 7px; align-items: center;
  margin-top: 9px;
  font-size: 11px;
  color: var(--fg-mute);
  font-variant-numeric: tabular-nums;
}
.card .meta-row .date { color: var(--fg-mute); }
.badge {
  font-size: 9.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 1.5px 6px;
  border-radius: 3px;
  font-weight: 600;
  line-height: 1.6;
}
.badge.html  { background: var(--accent-soft); color: var(--accent); }
.badge.md    { background: var(--line-soft); color: var(--fg-mute); }
.badge.stale { background: var(--stale-soft); color: var(--stale); }

.empty {
  padding: 32px 16px;
  text-align: center;
  color: var(--fg-mute);
  font-size: 12px;
  font-style: italic;
}

/* ════ Slide-over panel (cloned from reference) ════ */
.scrim {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(24, 24, 27, 0.4);
  opacity: 0; pointer-events: none;
  transition: opacity 200ms;
}
.scrim.open { opacity: 1; pointer-events: auto; }

.panel {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(860px, 62vw);
  background: var(--bg);
  border-left: 1px solid var(--line);
  z-index: 100;
  transform: translateX(100%);
  transition: transform 240ms cubic-bezier(0.22, 1, 0.36, 1);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.panel.open { transform: translateX(0); }

.panel header {
  padding: 18px 28px 14px;
  border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: flex-start; gap: 14px;
  background: var(--card);
}
.panel header .info { min-width: 0; }
.panel header .id-row {
  font-size: 11px;
  color: var(--fg-mute);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
  margin-bottom: 4px;
}
.panel header h2 {
  margin: 0;
  font-size: 22px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--fg);
  text-wrap: balance;
  max-width: 56ch;
  word-break: break-word;
}
.panel header .top-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }

.panel .notes {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  padding: 10px 28px;
  font-size: 11.5px;
  border-bottom: 1px solid var(--line);
  background: var(--card);
}
.panel .notes:empty { display: none; }
.panel .notes .trunc { color: var(--warn); }
.panel .notes .trunc a { color: var(--warn); text-decoration: underline; }

.panel .scroll { flex: 1; overflow: hidden; position: relative; }

.report-frame {
  width: 100%; height: 100%;
  border: 0; display: block;
  background: #fff;
}

.md-scroll { width: 100%; height: 100%; overflow: auto; }
.md-pre {
  margin: 0;
  padding: 24px 28px 48px;
  font-family: "Pretendard Variable", ui-monospace, monospace;
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--fg-2);
  white-space: pre-wrap;
  word-break: break-word;
  tab-size: 2;
}

/* ════ Toast ════ */
.toast {
  position: fixed;
  bottom: 24px; left: 50%; transform: translateX(-50%) translateY(12px);
  background: var(--fg);
  color: var(--card);
  border-radius: 4px;
  padding: 11px 18px;
  font-size: 12.5px;
  line-height: 1.5;
  z-index: 300;
  opacity: 0;
  transition: all 200ms;
  pointer-events: none;
  max-width: 520px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
}
.toast .cmd {
  font-family: "Pretendard Variable", ui-monospace, monospace;
  font-size: 11.5px;
  color: #93c5fd;
  word-break: break-all;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ════ Modal (clipboard fallback) ════ */
.modal-scrim {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(24, 24, 27, 0.45);
  display: none;
  align-items: center; justify-content: center;
  padding: 24px;
}
.modal-scrim.open { display: flex; }
.modal {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 22px 24px 20px;
  width: min(560px, 100%);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
}
.modal h3 {
  margin: 0 0 6px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.modal p {
  margin: 0 0 14px;
  font-size: 12.5px;
  color: var(--fg-mute);
  line-height: 1.55;
}
.modal textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 10px 12px;
  color: var(--fg);
  font-family: "Pretendard Variable", ui-monospace, monospace;
  font-size: 12.5px;
  resize: none;
  min-height: 64px;
}
.modal textarea:focus { outline: none; border-color: var(--accent); }
.modal .modal-actions {
  display: flex; justify-content: flex-end; gap: 8px;
  margin-top: 16px;
}

/* ════ Print ════ */
@media print {
  .topbar, .scrim, .toast, .modal-scrim { display: none !important; }
  .panel { position: static; transform: none; width: 100%; }
  body { background: #fff; }
}

/* ════ Responsive ════ */
@media (max-width: 980px) {
  .board { grid-template-columns: 1fr; }
  .panel { width: 100vw; }
  .topbar { flex-wrap: wrap; }
  .search input { width: 180px; }
}
</style>
</head>

    <div class="modal-actions">
      <button class="primary" id="modal-close">Done</button>
    </div>
  </div>
</div>

  const BOARD = {"schemaVersion":3,"repo":"creeta-lens","generatedAt":"2026-07-01T02:49:29.262Z","groups":{"tasks":[{"id":"2026-07-01-ci-creeta-install","folder":"tasks","title":"`/ci` — Creeta Install (설치목록 동기화 스킬)","date":"2026-07-01","hasMd":true,"hasHtml":false,"mdPath":"tasks/2026-07-01-ci-creeta-install.md","htmlPath":null,"mdInline":"---\nplanner: cpp\nplan_id: ci-creeta-install\ndate: 2026-07-01\nrefs: [live-research-substrate]\n---\n\n# `/ci` — Creeta Install (설치목록 동기화 스킬)\n\n> 사용자가 \"내가 원하는 스킬 목록\"을 적어두면, 이 스킬이 실제 설치 상태와 대조해 없으면 깔고 필요없는 건(명시적으로만) 지워 목록에 맞춘다. 누구나 자기 목록을 관리하는 범용 기능.\n\n## 🎯 What — 목표 (사람 언어)\n\n- 사용자가 **\"내가 쓰는 스킬/플러그인 목록\"을 한 파일**에 적어두면, `/ci` 한 번으로 이 PC가 그 목록에 맞춰진다 — 목록엔 있는데 안 깔린 건 설치, **목록이 \"빼라\"고 명시한 건** 제거.\n- 목록을 **언제든 쉽게 고칠 수 있고**(파일 편집 or `/ci add`·`/ci remove`), **어떤 사용자든** 자기 목록을 갖는다(내 livevil 전용 아님).\n- **실수로 남의 플러그인을 지우지 않는다** — 제거는 \"빼라\"고 명시한 것만, 그것도 항목별 확인 + 백업 후.\n\n**🎬 사용 장면:** 새 PC나 정리 후, 사용자가 `/ci` 입력 → 스킬이 `~/.claude/lens/manifest.json`(내 목록)과 실제 설치현황을 대조해 **미리보기 표**를 띄운다(\"설치할 것 2 / 제거할 것 1 / 목록밖(그대로 둠) 3 / 이미 맞음 5\"). 사용자가 확인 → 마켓플레이스 추가·플러그인 설치가 돌고, 제거 대상은 백업 후 항목별 확인받아 삭제. 끝나면 \"목록과 일치\" 보고. 목록을 바꾸고 싶으면 `/ci add watch@claude-video` 하면 파일에 추가된다.\n\n**완료의 정의 (Done = ?):**\n> `/ci`를 실행하면, manifest에 있으나 미설치인 플러그인이 설치되고, manifest가 excluded로 지정한 설치 플러그인이 (백업+확인 후) 제거되며, manifest에 없지만 설치된 \"외부(foreign)\" 플러그인은 **건드리지 않고 보고만** 되고, 최종적으로 \"일치\" 상태가 출력된다.\n\n## ❓ Why — 왜 (6하원칙)\n\n- **왜 지금**: 이번 세션에서 \"설치돼 있어야 할 것 vs 실제\" 대조를 수동으로 했다(gstack 잔존·agentmemory 소실·understand-anything 드리프트). 이 반복 작업이 **스킬 하나면 1분**이 된다. 멀티머신·재부트스트랩 환경에서 드리프트는 상시 발생.\n- **무엇을**: per-user manifest ↔ 실제 설치 diff → 설치/제거(안전) 동기화 + 목록 관리 UX.\n- **누구를 위해**: 나(멀티머신) + **Lens를 쓰는 모든 사용자**(각자 자기 목록).\n- **어디서**: `~/.claude/lens/manifest.json`(목록, per-user) + `creeta-lens/skills/ci/SKILL.md`(스킬) + `creeta-lens/lib/install-sync.js`(결정론 diff/dry-run).\n- **어떻게**: 레포 기존 패턴(`scripts/cu.py`가 `installed_plugins.json`을 읽고 scope/projectPath 보정하는 방식, `lib/*.js` Node 헬퍼) 재사용. 신규 스킬 1 + lib 1.\n- **안 하면**: 매번 수동 대조(이번 세션처럼) + 머신마다 드리프트 방치.\n\n## 🧰 실행 전략 & 자원\n\n- **난이도**: medium (신규 스킬 + Node lib + 안전한 파괴적 연산).\n- **권장 모델**: sonnet (구현), 제거 승인 게이트는 사람.\n- **병렬 실행**: 단일 — lib와 SKILL.md는 강결합, 한 에이전트가 순차.\n- **활용 스킬**: 없음(코어). 단 diff 로직은 이 세션서 실측한 `claude plugin list --json`(작동 확인) 계약에 근거.\n- **기존 자원·시스템 (Codex 교정 — install-skills.ps1 아님, 이건 livevil-setting 소속)**:\n  - `creeta-lens/scripts/cu.py`(497줄) — `installed_plugins.json` 직접 읽기 + `_plugin_scope_info`(scope/projectPath 보정) + `_resolve()`(CLI 절대경로) 패턴 **재사용**.\n  - `creeta-lens/lib/board-builder.js`·`capability-audit.js` — Node lib 스타일 벤치마크.\n  - `claude plugin list --json`(설치현황, 이 세션 실측 OK) + `claude plugin marketplace add/list` + `install <p>@<mkt> --scope user` + `uninstall` + `prune`.\n  - `~/.claude/plugins/installed_plugins.json`(레지스트리, cu.py가 읽는 SoT — list --json 교차검증용).\n\n## 📜 Constitution (이 작업 불변 조항)\n\n1. **파괴적 연산 안전 우선 (Codex 핵심 교정)** — 제거는 **excluded 명시 항목만**. manifest에 없는 \"foreign\" 플러그인은 **절대 자동 삭제 금지**(보고만). 모든 uninstall은 **항목별 승인 + 백업 후**.\n2. **Lens 자기보호** — `lens@CreetaCorp`(자기 자신)은 절대 제거 후보에 넣지 않는다(하드 가드).\n3. **범용 (내 전용 아님)** — livevil-setting/skills.json·agentmemory 클라 배선 같은 **개인 특화 로직 금지**. manifest는 사용자가 채우는 빈 틀로 시작.\n4. **Surgical** — 기존 스킬·lib 무수정. 신규 `skills/ci/` + `lib/install-sync.js`만 추가. cu.py는 **읽어서 패턴 참고**(수정 아님).\n5. **크로스플랫폼** — deps는 OS별(winget/brew/apt). 스킬이 OS 감지해 명령 생성.\n\n## 🛠 How — 빌드레디 실행\n\n### 데이터 계약 — `~/.claude/lens/manifest.json` (per-user)\n\n```jsonc\n{\n  \"$schema\": \"lens-install-manifest/v1\",\n  \"marketplaces\": { \"<name>\": \"<owner/repo>\" },      // claude plugin marketplace add\n  \"plugins\": [                                         // 설치되어 있어야 할 것 (managed)\n    { \"spec\": \"lens@CreetaCorp\", \"what\": \"...\" }\n  ],\n  \"deps\": { \"yt-dlp\": { \"winget\": \"...\", \"brew\": \"...\", \"apt\": \"...\" } },\n  \"excluded\": { \"<plugin@mkt or name>\": \"제거 사유\" }  // 명시적 제거 대상만\n}\n```\n\n- [ ] **T1** manifest 스키마 + 로더 (없으면 빈 틀 생성)\n      파일: `creeta-lens/lib/install-sync.js`\n      변경: `loadManifest()` — `~/.claude/lens/manifest.json` 읽기, 없으면 `{marketplaces:{},plugins:[],deps:{},excluded:{}}` 빈 틀을 **생성**하고 안내. JSON 파싱 실패는 명확한 에러(줄 표기). 경로는 `os.homedir()` 기반(크로스플랫폼).\n      검증: `node lib/install-sync.js --manifest-path` → `~/.claude/lens/manifest.json` 출력, 없으면 생성됨\n      의존: 없음\n\n- [ ] **T2** 설치현황 수집 (list --json + installed_plugins.json 교차)\n      파일: `lib/install-sync.js`\n      변경: `readInstalled()` — 1차 `claude plugin list --json`(spawn, this-session 실측 스키마: `[{id,version,scope,enabled,installPath}]`). 실패/빈값이면 2차 `~/.claude/plugins/installed_plugins.json` 직접 파싱(cu.py 방식). `claude` 절대경로는 cu.py `_resolve()` 포팅. marketplaces는 `claude plugin marketplace list` 파싱.\n      검증: `node lib/install-sync.js --list-installed` → 현재 설치 플러그인 id 배열 출력(agentmemory@agentmemory 등)\n      의존: T1\n\n- [ ] **T3** diff 엔진 — managed / excluded / foreign / ok 4분류 (Codex 안전모델)\n      파일: `lib/install-sync.js`\n      변경: `diff(manifest, installed)` →\n      - `toInstall` = manifest.plugins 중 미설치 (+ 필요한 marketplace 미등록분)\n      - `toRemove` = manifest.excluded ∩ 설치됨 (**이것만 제거 후보**)\n      - `foreign` = 설치됨 − manifest.plugins − excluded (**보고만, 제거 안 함**)\n      - `ok` = manifest.plugins ∩ 설치됨\n      - **하드 가드**: `lens@CreetaCorp`는 toRemove/foreign에서 제외(자기보호).\n      검증: 단위테스트 `node lib/install-sync.test.js` — foreign 항목이 toRemove에 **절대 안 들어감** 케이스 통과\n      의존: T2\n\n- [ ] **T4** dry-run 프리뷰 렌더 (JSON + 사람용 표)\n      파일: `lib/install-sync.js`\n      변경: `preview(diff)` → `--json`이면 machine JSON, 아니면 표:\n      ```\n      설치할 것(2):  watch@claude-video, agent-reach@...\n      제거할 것(1):  gstack (excluded: \"안 씀\")   ← 백업+항목별 확인\n      목록밖·그대로 둠(3): sentry, foo, bar   ← 지우려면 manifest.excluded에 추가\n      이미 맞음(5): lens, context7, playwright, ui-ux-pro-max, agentmemory\n      ```\n      검증: `node lib/install-sync.js --dry-run` → 4구획 표 출력, exit 0\n      의존: T3\n\n- [ ] **T5** SKILL.md — 오케스트레이션 (동기화 흐름)\n      파일: `creeta-lens/skills/ci/SKILL.md`\n      변경: frontmatter(name: ci, user-invocable, triggers: `/ci`, 동기화, install sync, 설치 동기화, インストール同期, 安装同步…) + 본문 흐름:\n      1) `node ${CLAUDE_PLUGIN_ROOT}/lib/install-sync.js --dry-run --json` 실행 → diff 수거.\n      2) 사람용 프리뷰 표 출력.\n      3) **AskUserQuestion**(header \"Creeta Install\"): Approve(설치+제거 진행) / Install-only(제거 skip) / Cancel.\n      4) toInstall: marketplace add → `claude plugin install <spec> --scope user`(fail-soft, 항목별 OK/경고).\n      5) toRemove: **항목별로 다시 확인** + 백업(`~/.claude/lens/removed-backup-<ts>/`로 installPath 복사) 후 `claude plugin uninstall`.\n      6) foreign: 목록 + \"manifest.excluded에 추가하면 다음 /ci서 제거\" 안내(실행 안 함).\n      7) 최종 재-diff로 \"일치\" 확인 보고.\n      검증: `claude plugin validate skills/ci` 또는 SKILL.md frontmatter 파싱 OK + 세션 재시작 후 `/ci` 노출\n      의존: T4\n\n- [ ] **T6** 목록 관리 UX — `/ci edit` · `/ci add <spec>` · `/ci remove <spec>`\n      파일: `skills/ci/SKILL.md` (인자 분기) + `lib/install-sync.js`(`addPlugin`/`removePlugin`/`excludePlugin`)\n      변경: `/ci`(동기화) / `/ci edit`(manifest 경로 안내+열기) / `/ci add <spec> [what]`(plugins[]에 추가) / `/ci remove <spec>`(plugins[]서 빼고 excluded로 이동). manifest 편집은 원자적 write(temp→rename).\n      검증: `node lib/install-sync.js --add foo@bar` 후 `--list-manifest`에 foo 존재; `--remove foo@bar` 후 excluded로 이동\n      의존: T5\n\n- [ ] **T7** 릴리즈 배선 (신규 스킬 = bump-version.sh·START_HERE·CLAUDE·README 등록)\n      파일: `scripts/bump-version.sh`(스킬 목록 13→14단계에 skills/ci 추가), `docs/START_HERE.md`(스킬 목록), `CLAUDE.md`(스킬 표), `README.md`(사용법), `CHANGELOG.md`\n      변경: `/ci` 스킬을 버전-bearing 목록 + 사용자 문서에 등록. bump-version.sh는 `[N/총]` 카운트도 갱신.\n      검증: `bash scripts/bump-version.sh <dryrun 또는 next>` 실행 시 skills/ci/SKILL.md도 버전 치환 대상에 포함\n      의존: T5\n\n## 💡 시사점 · ⚠️ 주의점 · 🔀 Side Effect\n\n- **💡 시사점**: 이번 세션의 수동 대조가 재사용 가능한 도구가 된다. manifest를 livevil-setting/skills.json에서 export하면 내 목록 즉시 이식 가능(별도).\n- **⚠️ 주의점 (Codex)**: `claude plugin uninstall`은 되돌리기 번거로움 → **반드시 installPath 백업 선행 + 항목별 확인**. `claude plugin list --json` 스키마는 이 세션 실측이나 Claude Code 버전따라 변할 수 있음 → installed_plugins.json 폴백 필수. bump-version.sh `[N/13]` 카운트 안 늘리면 릴리즈 로그 어긋남.\n- **🔀 Side Effect**: 신규 스킬 추가 → 스킬 개수 1↑(세션 스킬표·board). marketplace add가 죽은 마켓플레이스(과거 awesome-claude-code-plugins 등) 재유입 유발 안 하도록 manifest에 **사용자가 넣은 것만** 처리. lens 자기 제거 하드가드 없으면 self-uninstall 재앙 → Constitution 2조로 차단.\n\n## ✅ Review — 검증 (EARS)\n\n**검증 전략**: lib는 단위테스트(`node lib/install-sync.test.js`)로 diff 4분류·foreign 불가침·lens 자기보호 검증. SKILL.md는 dry-run 실제 실행(설치·제거 없이 프리뷰만)으로 확인. 파괴적 경로(uninstall)는 **백업 존재 확인 후**에만. staging/Playwright 불필요(로컬 CLI 도구).\n\n| # | EARS | 확인 방법 | 통과 판정 | 종류 |\n|---|------|----------|----------|------|\n| 1 | WHEN manifest 없음, THEN 로더는 빈 틀을 SHALL 생성 | `rm 후 node install-sync.js --manifest-path` | 파일 생성됨 | auto |\n| 2 | WHEN 설치됐지만 manifest·excluded에 없음, THEN foreign으로 SHALL 분류(제거 안 함) | `node install-sync.test.js` foreign 케이스 | toRemove에 없음 | auto |\n| 3 | WHEN lens 자기 자신, THEN 제거후보에서 SHALL 제외 | 테스트: lens를 미등재로 두고 diff | foreign/toRemove 모두 없음 | auto |\n| 4 | WHEN `/ci --dry-run`, THEN 4구획 프리뷰를 SHALL 출력하고 아무것도 설치/제거 안 함 | `node install-sync.js --dry-run` + `claude plugin list` 전후 비교 | 목록 불변 | auto |\n| 5 | WHEN 제거 승인, THEN uninstall 전에 백업이 SHALL 존재 | 백업 폴더 확인 | `~/.claude/lens/removed-backup-*/` 존재 | manual |\n| 6 | WHEN 세션 재시작, THEN `/ci`가 스킬 목록에 SHALL 노출 | 세션 스킬표 | /ci 존재 | manual |\n\n## 🔀 Codex 교차 협의\n\n- **분기→해소**: 내 초안이 `install-skills.ps1`(livevil-setting)을 모델로 삼았으나 **Codex가 \"그건 creeta-lens에 없다\"고 정확히 지적** → 검증 결과 부재 확인 → 레포 내 `scripts/cu.py`(installed_plugins.json 직접읽기+scope 보정) 모델로 교체.\n- **합의(고신뢰)**: (a) manifest 미등재 자동 제거는 위험 → managed/excluded/foreign 분리 + 항목별 승인. (b) `claude plugin list --json` 계약은 레포 코드로 미검증 → installed_plugins.json 폴백 병행(단, 이 세션서 --json 실측 OK라 1차 채택).\n- **Codex 신규 리스크**: uninstall 되돌리기 어려움 → 백업 하드요구(반영 T5/EARS5).\n\n## 진행상황\n- **마지막 업데이트**: 2026-07-01\n- **현재 경로**: 계획 승인 대기\n- **재개 포인트**: 승인 시 T1(lib 로더)부터. substrate와 독립(병렬 가능).\n","truncated":false,"stale":false},{"id":"2026-07-01-cpp-live-research","folder":"tasks","title":"`/cpp` 라이브 리서치화 — S2 조사에 agent-reach + insane-search 주입","date":"2026-07-01","hasMd":true,"hasHtml":false,"mdPath":"tasks/2026-07-01-cpp-live-research.md","htmlPath":null,"mdInline":"---\nplanner: cpp\nplan_id: cpp-live-research\ndate: 2026-07-01\nrefs: [live-research-substrate]\n---\n\n# `/cpp` 라이브 리서치화 — S2 조사에 agent-reach + insane-search 주입\n\n> /cpp가 계획을 짤 때 훈련지식이 아니라 \"오늘의 릴리즈·트렌드·이슈·경쟁현황\"을 조사해 반영하게 만든다. 단, 강제가 아니라 **필요할 때만**(Codex 교정).\n\n## 🎯 What — 목표 (사람 언어)\n\n- `/cpp`로 계획을 짤 때, 주제가 **최신 정보에 민감하면**(새 라이브러리 버전, 요즘 뜨는 접근, 커뮤니티가 겪는 이슈, 경쟁 제품 현황) 계획이 **오늘의 실제 데이터**를 근거로 선다 — 작년치 지식으로 낡은 계획을 짜지 않는다.\n- 그 도구가 없는 사용자 환경에서도 `/cpp`는 멈추지 않고 **기존 수단(context7/deep-research/web)으로 조용히 대체**한다.\n\n**🎬 사용 장면:** 사용자가 `/cpp \"우리 앱에 최신 인증 라이브러리 붙이기\"` → /cpp의 S2 조사 단계에서 \"이건 라이브 신호가 필요\"라 판단 → `docs/rules/live-research.md`대로 Exa로 \"2026 최신 auth 라이브러리 비교\"·GitHub로 해당 repo 최근 이슈·Reddit/X 반응을 수집 → 조사보고에 \"오늘 기준 X가 정석, Y는 최근 deprecated\" 반영 → 그 위에 빌드레디 계획. agent-reach 없는 PC면 deep-research로 대체하고 \"라이브 채널 없음(폴백)\" 표기.\n\n**완료의 정의 (Done = ?):**\n> `/cpp` S2가, 라이브 신호가 유익한 주제에서 `live-research.md`를 참조해 agent-reach/insane-search 조사를 수행하고(도구 있을 때) 그 결과를 조사보고에 반영하며, 도구가 없으면 명시적으로 폴백한다. trivial·내부코드-only 주제에선 라이브 조사를 강요하지 않는다.\n\n## ❓ Why — 왜 (6하원칙)\n\n- **왜 지금**: /cpp의 강점은 S2 전방위 조사인데, 현재 축③은 \"context7 + deep-research\"뿐이라 **실시간 커뮤니티·트렌드·저장소 최신상태**를 못 본다. agent-reach(무키 라이브)·insane-search(차단우회)가 이번에 설치돼 이 공백을 메울 수 있다.\n- **무엇을**: S2 축③ 확장 + S0 실행전략의 \"활용 스킬 자동감지\"에 라이브채널 인지 + S7 self-check 정합 + 조건부 발동 규칙.\n- **누구를 위해**: /cpp로 계획 짜는 사용자.\n- **어디서**: `creeta-lens/skills/cpp/SKILL.md`(S0·S2·S7·산출물 조사보고 절).\n- **어떻게**: SKILL.md 외과적 편집(다른 스킬 무수정). substrate 문서 참조.\n- **안 하면**: /cpp 계획이 계속 \"작년 지식 + 코드\"에 갇혀, 빠르게 변하는 도메인에서 낡은 권장을 빌드레디로 정밀하게 만든다(잘못된 것을 잘 만듦).\n\n## 🧰 실행 전략 & 자원\n\n- **난이도**: small~medium (단일 SKILL.md 외과 편집 + substrate 참조).\n- **권장 모델**: sonnet.\n- **병렬 실행**: 단일. substrate(①)에 **의존**(참조 대상 문서가 먼저 있어야 함).\n- **활용 스킬**: `docs/rules/live-research.md`(①), 기존 context7/deep-research(폴백).\n- **기존 자원**: `skills/cpp/SKILL.md` S2 표(축①~⑥), S0 🧰실행전략 절, S7 self-check 리스트, 산출물 `## 🔬 조사 보고` 섹션.\n\n## 📜 Constitution (이 작업 불변 조항)\n\n1. **Surgical** — `skills/cpp/SKILL.md`만 편집. `/cp`·lib·다른 스킬 무수정.\n2. **조건부, 강제 아님 (Codex 핵심)** — 매 /cpp마다 라이브 조사 강제 금지(느림·취약). **URL/최신성/외부동향이 유익한 주제에서만** 발동. trivial·순수 내부코드 리팩토링은 skip.\n3. **폴백 명시** — 도구 미설치는 실패 아님. context7/deep-research/web/로컬조사로 degrade하고 조사보고에 한 줄 표기.\n4. **substrate 위임** — 호출 명령을 SKILL.md에 복붙하지 말고 `live-research.md` 참조(SoT 단일).\n\n## 🛠 How — 빌드레디 실행\n\n- [ ] **T1** S2 축③ 확장 (조사 표에 라이브채널 명시)\n      파일: `creeta-lens/skills/cpp/SKILL.md` (S2 표, 현재 축③ 행)\n      변경: 축③ 행을\n      `③ 도메인 정석 | 베스트 프랙티스 — 라이브러리 문서는 context7 MCP, 광범위 리서치는 deep-research`\n      → `③ 도메인 정석 & 라이브 신호 | 베스트 프랙티스(라이브러리=context7 MCP). **최신성/트렌드/저장소 현황/커뮤니티 반응이 유익하면** docs/rules/live-research.md 대로 agent-reach(Exa·GitHub·YouTube·V2EX·RSS)+insane-search(차단URL). 도구 없으면 deep-research/web 폴백.`\n      검증: `grep -n \"live-research\" skills/cpp/SKILL.md` → 축③ 근처 1행\n      의존: ①-substrate 완료\n\n- [ ] **T2** S2 발동 조건 문단 추가 (조건부 규칙 — Codex)\n      파일: `skills/cpp/SKILL.md` (S2 섹션, 표 아래)\n      변경: 한 문단 추가 — \"**라이브 조사 발동 조건**: 주제가 (a) 특정 URL/외부 리소스를 다루거나 (b) 최신 릴리즈·버전·트렌드에 민감하거나 (c) 커뮤니티가 겪는 실이슈가 계획에 중요할 때만 live-research 채널을 쓴다. 순수 내부코드·trivial은 ①②④⑤⑥로 충분(라이브 skip). 발동 시 `docs/rules/live-research.md`의 감지→호출→폴백 절차를 따른다.\"\n      검증: `grep -c \"발동 조건\\|라이브 조사\" skills/cpp/SKILL.md` → ≥1\n      의존: T1\n\n- [ ] **T3** S0 🧰 실행전략 \"활용 스킬 자동감지\"에 라이브채널 인지 추가\n      파일: `skills/cpp/SKILL.md` (S0 🧰 실행 전략 & 자원 bullet)\n      변경: \"활용할 설치 스킬\" 예시에 \"…라이브 트렌드·최신 릴리즈면 **agent-reach/insane-search**(live-research.md)…\" 한 구절 추가(자동감지 목록에 편입).\n      검증: `grep -n \"agent-reach\" skills/cpp/SKILL.md` → S0 근처 포함\n      의존: T1\n\n- [ ] **T4** S7 self-check + 산출물 조사보고 정합\n      파일: `skills/cpp/SKILL.md` (S7 체크리스트, 산출물 `## 🔬 조사 보고` 언급)\n      변경: S7에 체크 1줄 추가 — \"[ ] 라이브 신호가 유익한 주제였다면 live-research를 썼거나(또는 불필요/미설치로 폴백) 그 사유가 조사보고에 표기됐는가?\" + 조사보고 절에 \"라이브 출처는 URL+발행일 병기(live-research §4)\" 한 줄.\n      검증: `grep -c \"live-research\\|라이브\" skills/cpp/SKILL.md` S7 구간 ≥1\n      의존: T1\n\n- [ ] **T5** 버전 bump + CHANGELOG + 배포 태그\n      파일: `scripts/bump-version.sh` 실행, `CHANGELOG.md`\n      변경: `bash scripts/bump-version.sh <next>` (skills/cpp 배너 포함 13곳) → CHANGELOG에 \"/cpp S2 라이브리서치(agent-reach+insane-search) 조건부 주입\" → commit + `git tag v<next>` + push(마켓 source.ref 갱신 위해 **태그 필수**).\n      검증: `git tag` 에 새 버전 존재 + `grep cpp CHANGELOG.md` 최신행\n      의존: T1~T4 (+ ①,④ 함께 릴리즈 권장)\n\n## 💡 시사점 · ⚠️ 주의점 · 🔀 Side Effect\n\n- **💡 시사점**: /cpp가 \"오늘의 현실\" 위에 계획을 세우게 되어, 빠르게 변하는 도메인(프론트 라이브러리, AI 도구)에서 계획 신선도가 급상승. /cr(research)과 같은 substrate라 일관.\n- **⚠️ 주의점 (Codex)**: 라이브 조사를 **모든** /cpp에 강제하면 매 계획이 수십초 느려지고 네트워크 실패에 취약 → 반드시 조건부(T2). Codex 하드게이트(S4)와 라이브조사는 별개 축이니 S4 흐름은 건드리지 않는다.\n- **🔀 Side Effect**: `skills/cpp/SKILL.md`만 변경 → /cpp 동작에만 영향. 캐시(3.21.1)와 소스(3.21.2+) 드리프트 주의 — 태그 push 후 `/lens-upgrade` 해야 실제 반영. board·done-sweep 무영향(spine 불변).\n\n## ✅ Review — 검증 (EARS)\n\n**검증 전략**: SKILL.md 편집이라 grep으로 문구 반영 확인 + 실제 `/cpp`를 라이브민감 주제로 1회 돌려 조사보고에 라이브 출처가 들어오는지 관측(도구 있는 이 PC). 폴백은 agent-reach 임시 비활성 시나리오로 확인(수동).\n\n| # | EARS | 확인 방법 | 통과 판정 | 종류 |\n|---|------|----------|----------|------|\n| 1 | WHEN S2 표 편집, THEN 축③에 live-research 참조가 SHALL 존재 | `grep -n live-research skills/cpp/SKILL.md` | ≥1행 | auto |\n| 2 | WHEN 발동조건 문단, THEN 조건부(강제아님) 규칙이 SHALL 명시 | `grep \"발동 조건\" skills/cpp/SKILL.md` | 존재 | auto |\n| 3 | WHEN 라이브민감 주제로 /cpp 실행, THEN 조사보고에 라이브 출처(URL+날짜)가 SHALL 포함 | 실제 /cpp 1회 실행 관측 | 조사보고에 라이브 인용 | manual |\n| 4 | WHEN agent-reach 미설치 가정, THEN /cpp는 폴백하고 SHALL 멈추지 않음 | 폴백 경로 코드/문구 확인 | \"폴백\" 표기 존재 | manual |\n| 5 | WHEN 버전 배포, THEN 태그가 SHALL 존재 | `git tag \\| grep v<next>` | 존재 | auto |\n\n## 🔀 Codex 교차 협의\n\n- **합의(고신뢰)**: \"S2 축③만 고치면 부족\" — S0 실행전략·S7 self-check·조사보고 절까지 정합해야 일관(반영 T3/T4).\n- **Codex 신규 리스크→반영**: 매 /cpp 라이브조사 강제는 느리고 취약 → **조건부 발동**으로 설계(T2, Constitution 2조). 미설치 명시 degrade(context7/deep-research/web/로컬).\n- **분기 없음**: 주입 지점(S2 축③)에 이견 없음, 범위만 확장.\n\n## 진행상황\n- **마지막 업데이트**: 2026-07-01\n- **현재 경로**: 계획 승인 대기 (①-substrate 선행 의존)\n- **재개 포인트**: ① 완료 후 T1부터\n","truncated":false,"stale":false},{"id":"2026-07-01-cr-research-rename-crv","folder":"tasks","title":"`/cr` = Creeta Research 신설 + 기존 Lens Review → `/crv` 개명","date":"2026-07-01","hasMd":true,"hasHtml":false,"mdPath":"tasks/2026-07-01-cr-research-rename-crv.md","htmlPath":null,"mdInline":"---\nplanner: cpp\nplan_id: cr-research-rename-crv\ndate: 2026-07-01\nrefs: [live-research-substrate]\n---\n\n# `/cr` = Creeta Research 신설 + 기존 Lens Review → `/crv` 개명\n\n> 두 갈래: (A) 기존 /cr(Lens Review)를 /crv로 **깨끗이 개명**(11+파일 배선), (B) 비워진 /cr에 **creeta research**(라이브 다각도 딥리서치→대화 보고) 신설. 순서 중요: A 먼저(충돌 제거) → B.\n\n## 🎯 What — 목표 (사람 언어)\n\n- **A**: 지금 `/cr`이던 \"Lens 자가 현대화 감사\"가 **`/crv`**로 옮겨져, 예전처럼 SessionStart 알림·감사가 그대로 동작한다(이름만 바뀜).\n- **B**: 사용자가 `/cr <주제>`를 치면, agent-reach·insane-search로 그 주제를 **여러 각도(웹검색·GitHub·YouTube·커뮤니티·RSS)로 라이브 딥리서치**해서, **인용을 곁들인 보고를 대화로** 받는다(파일 저장 안 함).\n\n**🎬 사용 장면:**\n- (A) 세션 시작 → 예전 \"🩺 자가 감사 N일 경과 — `/crv` 재감사 권장\" 알림(문구가 /cr→/crv). 사용자 `/crv` → 기존 감사 파이프라인 그대로.\n- (B) 사용자 `/cr \"요즘 SolidJS vs Svelte 현업 반응\"` → 스킬이 live-research.md대로 Exa 검색 + GitHub 저장소 활동 + YouTube/Reddit/X 반응 + RSS를 **병렬 다각도** 수집 → \"오늘 기준 A진영은 …, B진영은 …(출처 URL·날짜)\" 형태로 **대화에 보고**(파일 안 남김). 도구 없으면 deep-research/web 폴백.\n\n**완료의 정의 (Done = ?):**\n> `/crv`가 기존 Lens Review와 동일하게 동작하고(알림·stamp·scope guard 포함, 문구가 crv), 새 `/cr`이 임의 주제를 라이브 다각도로 조사해 인용 포함 보고를 대화로 내며 파일을 저장하지 않고, 세션 스킬표에 /cr(research)·/crv(review)가 각각 노출된다.\n\n## ❓ Why — 왜 (6하원칙)\n\n- **왜 지금**: 사용자가 /cr을 \"creeta research\"로 쓰고 싶어함. 현재 /cr은 Lens Review로 점유 → 충돌. Review는 SessionStart nudge·capability-audit에 배선돼 있어 **깨끗한 개명**이 필요(방치하면 알림이 죽은 /cr을 가리킴).\n- **무엇을**: (A) 개명 전 배선 이전. (B) 라이브 리서치 스킬 신설(substrate 소비).\n- **누구를 위해**: Review는 Lens 유지보수자(나), Research는 모든 사용자.\n- **어디서**: `skills/cr`↔`skills/crv`, `lib/capability-audit.js`, `hooks/session-start.js`, `docs/rules/capability-assumptions.json`, `docs/START_HERE.md`, `scripts/bump-version.sh`, `CLAUDE.md`, `README.md`.\n- **어떻게**: git mv + 문자열 배선 이전(A) → 신규 skills/cr/SKILL.md(B).\n- **안 하면**: 이름 충돌로 둘 중 하나 안 뜸 + 알림이 존재하지 않는 명령 안내.\n\n## 🧰 실행 전략 & 자원\n\n- **난이도**: A=medium(배선 다수·정확도 요구), B=small~medium(신규 SKILL.md, substrate 소비).\n- **권장 모델**: sonnet. 개명은 grep 전수라 신중.\n- **병렬 실행**: A 먼저(직렬) → B. B는 ①-substrate 의존.\n- **활용 스킬**: `docs/rules/live-research.md`(①), 기존 deep-research(차별화 대상·폴백).\n- **기존 자원 (Codex가 밝힌 blast radius)**: `skills/cr/SKILL.md`(name·triggers·**scope guard**·**stamp** 문구), `lib/capability-audit.js`(상단주석·사용처주석·**nudge 3문자열** L114/119/124·CLI설명), `hooks/session-start.js`(주석 L58/118), `docs/rules/capability-assumptions.json`(description + **affects_lens에 신규행 필요** — 현재 skills/cr 미참조), `docs/START_HERE.md`(스킬 목록), `scripts/bump-version.sh`(버전-bearing 스킬 목록·카운트), `CLAUDE.md`(스킬표·설정설명·폴더구조), `README.md`(사용법).\n\n## 📜 Constitution (이 작업 불변 조항)\n\n1. **개명은 무손실** — Review 기능·알림·stamp·scope guard가 /crv로 **완전히** 이전. 죽은 /cr 참조 0 (전수 grep로 확인).\n2. **신규 /cr 안전 (Codex)** — creeta research는 (a) **파일 저장 안 함**(대화 보고만), (b) **출처(URL·날짜) 보고 의무**, (c) **로컬/비공개 코드를 외부 서비스로 유출 금지**(쿼리에 사내 코드·시크릿 넣지 않기), (d) **스코프 가드 없음**(아무 레포/컨텍스트서 동작 — Review와 반대).\n3. **deep-research와 차별** — 중복 아님을 명시: creeta research = 무키 라이브채널(agent-reach) + 차단우회(insane-search) 특화. 범용 웹리서치는 deep-research로 안내 가능.\n4. **Surgical** — 개명 외 다른 스킬 무수정. 신규 /cr은 substrate 참조(호출법 복붙 금지).\n5. **역사문서 불변** — `docs/history/2026-06-05-*audit*`는 과거 기록이라 개명 대상 아님(그대로 둠).\n\n## 🛠 How — 빌드레디 실행\n\n### Part A — 개명 /cr → /crv (충돌 제거, 먼저)\n\n- [ ] **A1** 스킬 폴더 이동 + 내부 식별자\n      파일: `skills/cr/` → `skills/crv/` (`git mv skills/cr skills/crv`), `skills/crv/SKILL.md`\n      변경: frontmatter `name: \"cr\"`→`\"crv\"`, `argument-hint` 유지, triggers의 `/cr`→`/crv`, 본문 `/cr`→`/crv`(scope guard·stamp 안내·\"You are Lens Review\" 유지). 배너 \"Lens Review\" 문자열은 유지(bump-version이 잡는 배너 패턴 확인).\n      검증: `grep -rn \"/cr\\b\" skills/crv/SKILL.md` → 0 (모두 /crv), `ls skills/cr` → 없음(이동됨)\n      의존: 없음 (Part A 시작점)\n\n- [ ] **A2** capability-audit.js nudge 3문자열 + 주석\n      파일: `lib/capability-audit.js`\n      변경: L114/119/124 nudge 문자열의 `` `/cr` ``→`` `/crv` `` (3곳), 상단 주석 L2/4/10 \"for /cr modernization\"·\"skills/cr/SKILL.md\"→crv, L67 \"Called by /cr\"→/crv. `stamp` CLI 계약 자체는 불변(경로만).\n      검증: `grep -n \"/cr\\b\" lib/capability-audit.js` → 0 (모두 /crv)\n      의존: A1\n\n- [ ] **A3** session-start.js nudge 주석\n      파일: `hooks/session-start.js`\n      변경: L58/118 주석 \"/cr capability-audit nudge\"→\"/crv …\". `formatAuditNudge` 호출 로직 불변(문구는 capability-audit.js가 생성 — A2에서 처리됨).\n      검증: `grep -n \"/cr\\b\" hooks/session-start.js` → 0\n      의존: A2\n\n- [ ] **A4** capability-assumptions.json — description + affects_lens 신규행\n      파일: `docs/rules/capability-assumptions.json`\n      변경: description의 \"/cr 가\"→\"/crv 가\". **Codex 지적**: affects_lens에 현재 skills/cr가 없음 → /crv(자가감사)를 감사 대상에 넣으려면 해당 capability 행의 affects_lens에 `skills/crv/SKILL.md` 추가(또는 신규 행). Review 스킬 자신을 audit 대상에 포함.\n      검증: `grep -c \"skills/cr\\b\" capability-assumptions.json` → 0, `grep -c \"crv\" ...` → ≥1\n      의존: A1\n\n- [ ] **A5** 사용자·릴리즈 문서 배선\n      파일: `docs/START_HERE.md`, `CLAUDE.md`, `README.md`, `scripts/bump-version.sh`\n      변경: 스킬 목록/표/사용법의 `/cr`(review)→`/crv`. bump-version.sh 스킬 목록에 skills/crv 반영(경로 변경) + 카운트 유지. (Review 배너 치환 라인이 있으면 경로 갱신.)\n      검증: `grep -rn \"skills/cr\\b\\|/cr\\b.*[Rr]eview\" docs/START_HERE.md CLAUDE.md README.md scripts/bump-version.sh` → 0 잔재\n      의존: A1\n\n- [ ] **A6** 전수 잔재 스캔 (개명 무손실 게이트)\n      파일: 레포 전체(역사문서 제외)\n      변경: 없음(검사). `grep -rn \"/cr\\b\" --include=*.md --include=*.js --include=*.json . | grep -v docs/history | grep -v skills/crv` → **/cr이 review를 뜻하는 잔재 0** 확인. (신규 /cr=research 도입 후엔 /cr이 research를 뜻하므로 이 스캔은 A 완료 직후·B 전에 수행.)\n      검증: 위 grep 결과 0행 (또는 전부 research 문맥)\n      의존: A1~A5\n\n### Part B — 신규 `/cr` = Creeta Research (개명 후)\n\n- [ ] **B1** skills/cr/SKILL.md 신설 — frontmatter + 정체성\n      파일: `creeta-lens/skills/cr/SKILL.md` (새 파일, 빈 폴더에)\n      변경: frontmatter `name: \"cr\"`, user-invocable, `argument-hint: \"<주제>\"`, triggers(`/cr`, creeta research, 딥리서치, 라이브 조사, research, 深度调研, リサーチ…). 본문: \"You are **Creeta Research** — 라이브 다각도 딥리서치\". 정체성: deep-research와 차별(무키 라이브채널+차단우회), **스코프 가드 없음**.\n      검증: frontmatter 파싱 OK, `grep -c \"creeta research\\|Creeta Research\" skills/cr/SKILL.md` ≥1\n      의존: A6 (개명 완료 후)\n\n- [ ] **B2** 리서치 파이프라인 절 (substrate 소비 + 다각도)\n      파일: `skills/cr/SKILL.md`\n      변경: 흐름 —\n      1) 주제 정제(모호하면 1질문).\n      2) `docs/rules/live-research.md` **Read** → 도구 감지.\n      3) **다각도 병렬 수집**(Task 도구 or 순차): Exa 시맨틱검색 / GitHub(관련 repo·이슈·PR) / YouTube(관련 영상 자막) / 커뮤니티(V2EX·Reddit via agent-reach) / RSS / 필요시 insane-search로 차단 URL. 각 축 1~2줄 요약+출처.\n      4) 교차·상충 정리(적대적: 열광 vs 회의 양면).\n      5) **대화로 보고**(파일 저장 안 함): 한 줄 결론 → 축별 발견(출처 URL+날짜) → 상충/합의 → 시사점.\n      검증: `grep -c \"live-research\\|다각도\\|출처\" skills/cr/SKILL.md` ≥2\n      의존: B1, ①-substrate\n\n- [ ] **B3** 안전·폴백·차별 절 (Codex)\n      파일: `skills/cr/SKILL.md`\n      변경: (a) **파일 저장 안 함** 명시(산출=대화). (b) **로컬/비공개 코드·시크릿을 외부 쿼리에 넣지 않기**(유출 금지). (c) 출처 URL+발행일 의무. (d) 도구 미설치 → deep-research/web 폴백 + 표기. (e) \"범용 웹리서치만이면 deep-research가 나을 수 있음\" 안내(중복 회피).\n      검증: `grep -c \"저장.*안\\|유출\\|폴백\\|deep-research\" skills/cr/SKILL.md` ≥3\n      의존: B1\n\n- [ ] **B4** 릴리즈 배선 (신규 스킬 등록)\n      파일: `scripts/bump-version.sh`(skills/cr 추가), `docs/START_HERE.md`·`CLAUDE.md`·`README.md`(스킬 목록에 /cr=research, /crv=review 둘 다), `CHANGELOG.md`\n      변경: /cr(research)·/crv(review)를 문서·버전목록에 등록. bump-version.sh 카운트 갱신(기존13 + ci + crv경로 + cr신규).\n      검증: `grep -c \"creeta research\\|/cr\\b\" README.md docs/START_HERE.md` ≥1, bump-version.sh에 skills/cr·skills/crv 모두 존재\n      의존: B1~B3\n\n- [ ] **B5** 버전 bump + 태그 (①③④ 통합 릴리즈 권장)\n      파일: `scripts/bump-version.sh` 실행, git\n      변경: `bash scripts/bump-version.sh <next>` → commit + `git tag v<next>` + push(**태그 필수** — 없으면 옛 코드 설치).\n      검증: `git tag \\| grep v<next>` 존재, `/lens-upgrade` 후 세션에 /cr·/crv 노출\n      의존: A·B 전부\n\n## 💡 시사점 · ⚠️ 주의점 · 🔀 Side Effect\n\n- **💡 시사점**: /cr(research)·/cpp(라이브화)가 같은 substrate라 라이브리서치 능력이 일관되게 성장. Review는 /crv로 안전 이전.\n- **⚠️ 주의점 (Codex)**: 개명은 **전수 grep 게이트(A6)** 없으면 죽은 /cr 참조가 알림·감사에 남는다. capability-assumptions affects_lens는 현재 skills/cr 미참조라 **신규행 추가** 안 하면 /crv가 자가감사 대상서 누락. 신규 /cr은 **로컬 코드 외부유출** 리스크 — 쿼리 위생 규칙 필수.\n- **🔀 Side Effect**: SessionStart 알림 문구·capability-audit 상태파일 경로가 /crv 기준으로. 스킬 개수 +1(research 신규, review는 이동). board·done-sweep 무영향. 캐시↔소스 드리프트 — 태그 push+upgrade 필요.\n\n## ✅ Review — 검증 (EARS)\n\n**검증 전략**: 개명은 grep 전수(잔재 0) + 세션 재시작 후 /crv 알림·동작 관측. 신규 /cr은 실제 주제로 1회 실행해 다각도 수집·대화보고·파일미저장 관측(도구 있는 이 PC). 폴백은 수동 시나리오.\n\n| # | EARS | 확인 방법 | 통과 판정 | 종류 |\n|---|------|----------|----------|------|\n| 1 | WHEN 개명 완료, THEN /cr(review) 잔재가 SHALL 0 | `grep -rn \"/cr\\b\" (역사·research 제외)` | 0행 | auto |\n| 2 | WHEN 세션 시작, THEN 자가감사 알림이 /crv를 SHALL 안내 | SessionStart additionalContext | \"/crv\" 문구 | manual |\n| 3 | WHEN /crv 실행, THEN 기존 Review 파이프라인이 SHALL 동작(stamp 포함) | /crv 실행 + `.lens/capability-audit-state.json` 갱신 | lastAuditAt 갱신 | manual |\n| 4 | WHEN /cr <주제> 실행, THEN 다각도 라이브 조사 + 출처 포함 보고를 SHALL 대화로 출력 | /cr 실제 실행 | 출처 URL+날짜 포함 보고, 파일 0 | manual |\n| 5 | WHEN 도구 미설치, THEN /cr은 deep-research/web으로 SHALL 폴백 | 폴백 문구/경로 확인 | \"폴백\" 표기 | manual |\n| 6 | WHEN affects_lens, THEN /crv가 감사대상으로 SHALL 등록 | `grep crv capability-assumptions.json` | ≥1 | auto |\n| 7 | WHEN 배포, THEN 태그 존재 + 세션에 /cr·/crv 둘 다 노출 | `git tag` + 세션 스킬표 | 둘 다 | manual |\n\n## 🔀 Codex 교차 협의\n\n- **합의(고신뢰)**: 개명 blast radius가 내 초안(skills/cr·capability-audit·session-start·capability-assumptions·README/CLAUDE)보다 넓음 — **bump-version.sh·docs/START_HERE.md·scope guard·stamp 문구·nudge 3문자열**까지 (반영 A1/A2/A5). affects_lens 신규행 필요(A4).\n- **Codex 신규 리스크→반영**: 신규 /cr에 **파일저장 금지·출처보고·로컬코드 유출금지**를 별도로 박아야 함(B3, Constitution 2조).\n- **분기 없음**: A→B 순서·개명 방식에 이견 없음.\n\n## 진행상황\n- **마지막 업데이트**: 2026-07-01\n- **현재 경로**: 계획 승인 대기 (①-substrate 선행, A→B 순서)\n- **재개 포인트**: 승인 시 Part A(A1 git mv)부터, A6 게이트 통과 후 Part B\n","truncated":false,"stale":false},{"id":"2026-07-01-live-research-substrate","folder":"tasks","title":"라이브 리서치 substrate — `docs/rules/live-research.md`","date":"2026-07-01","hasMd":true,"hasHtml":false,"mdPath":"tasks/2026-07-01-live-research-substrate.md","htmlPath":null,"mdInline":"---\nplanner: cpp\nplan_id: live-research-substrate\ndate: 2026-07-01\nrefs: [ci-creeta-install, cpp-live-research, cr-creeta-research-rename]\n---\n\n# 라이브 리서치 substrate — `docs/rules/live-research.md`\n\n> 4개 계획의 **토대**. /cpp(라이브화)와 /cr(creeta research)이 **똑같이 참조**하는 단일 규칙 문서. 이것부터 만들어야 B·C가 중복 없이 얹힌다.\n\n## 🎯 What — 목표 (사람 언어)\n\n- Lens 스킬이 \"오늘의 인터넷 정보\"(최신 릴리즈·트렌드·이슈·커뮤니티 반응)를 가져올 때 **어디를 어떻게 두드리는지가 한 곳에 정의**되어, 여러 스킬이 각자 재발명하지 않는다.\n- 그 도구(agent-reach·insane-search)가 **안 깔린 사용자 환경에서도**, 스킬이 멈추지 않고 기존 수단(deep-research·웹검색)으로 **조용히 폴백**한다.\n\n**🎬 사용 장면:** `/cpp`나 `/cr`이 조사 단계에서 이 문서를 Read → \"라이브 신호가 필요하네\" 판단 → 문서의 호출표대로 `mcporter call exa...` / `python -m engine <URL>` 실행 → 결과를 조사보고에 반영. agent-reach가 없는 남의 PC에서 같은 스킬을 돌리면, 문서의 폴백 절에 따라 `deep-research`로 대체하고 \"라이브 채널 없음(폴백)\" 한 줄을 남긴다.\n\n**완료의 정의 (Done = ?):**\n> `docs/rules/live-research.md`가 존재하고, /cpp·/cr SKILL.md가 그 문서를 참조하며, 문서만 읽고도 (도구 있음/없음) 두 경로의 정확한 명령을 골라낼 수 있다.\n\n## ❓ Why — 왜 (6하원칙)\n\n- **왜 지금**: B(/cpp 라이브화)와 C(/cr)가 **같은 호출법·같은 폴백 규칙**을 필요로 한다. 각 스킬에 복붙하면 드리프트(한쪽만 고쳐짐)가 확정된다. 규칙은 한 곳(SoT)에 두고 참조가 정석.\n- **무엇을**: agent-reach(무키 라이브 채널)·insane-search(WAF 우회 fetch) 호출법 + 미설치 감지·폴백 규칙 + 신선도 규율(출처·발행일 인용).\n- **누구를 위해**: /cpp·/cr을 실행하는 Claude(에이전트) 자신, 그리고 이 플러그인을 쓰는 **모든 사용자**(도구 유무 무관).\n- **어디서**: `creeta-lens/docs/rules/live-research.md`.\n- **어떻게**: 새 규칙 문서 1개 신설(순수 문서, 코드 0). 기존 스킬은 참조 한 줄만 추가(각자 계획서에서).\n- **안 하면**: /cpp와 /cr이 각자 다른 호출법을 갖게 되고, agent-reach 미설치 사용자에게서 두 스킬이 서로 다르게 깨진다.\n\n## 🧰 실행 전략 & 자원\n\n- **난이도**: small (순수 문서 1개, 코드 0).\n- **권장 모델**: sonnet (문서 작성).\n- **병렬 실행**: 단일 — 의존 없는 선행 토대라 가장 먼저 1개 에이전트.\n- **활용 스킬**: 없음(문서). 단 내용의 정확성은 이 세션에서 실측한 agent-reach 7/15 채널·insane-search engine 경로에 근거.\n- **기존 자원**: `~/.claude/skills/agent-reach/SKILL.md`(호출표 원본), insane-search `python -m engine`, 기존 `deep-research`·`context7`·네이티브 WebSearch/WebFetch(폴백 대상). `docs/rules/codex-integration.md`(규칙 문서 스타일 벤치마크).\n\n## 📜 Constitution (이 작업 불변 조항)\n\n1. **문서만** — 코드·스킬 로직 무수정(참조 추가는 각 스킬 계획서 소관).\n2. **폴백 필수** — 도구 미설치가 \"실패\"가 아니라 \"폴백\"이 되도록 규칙에 명시(dormant 스캐폴딩 금지 원칙).\n3. **위임 우선** — agent-reach가 이미 네이티브 스킬이므로, substrate는 호출법을 **재구현하지 말고 \"agent-reach 스킬을 쓰라\"**로 위임(중복 회피, surgical).\n4. **No-Site-Name 준수 안 함 대상 아님** — 이건 Lens 문서라 플랫폼명 예시 허용(agent-reach/insane-search는 도구명, 사이트 하드코딩 아님).\n\n## 🛠 How — 빌드레디 실행\n\n> 산출물 = `docs/rules/live-research.md` 1개. 아래 태스크가 그 문서의 **완성 내용**을 규정한다(실행=복사).\n\n- [ ] **T1** `docs/rules/live-research.md` 신설 — 헤더 + 목적 절\n      파일: `creeta-lens/docs/rules/live-research.md`\n      변경: 아래 구조로 작성 —\n      ```markdown\n      # Live Research substrate (agent-reach + insane-search)\n      > Lens 스킬(/cpp S2, /cr)이 \"현재 라이브 정보\"를 가져오는 표준 경로.\n      > 도구 미설치 시 폴백까지 규정. SoT — 스킬은 이 문서를 참조만 한다.\n      ```\n      검증: `test -f docs/rules/live-research.md` → 존재\n      의존: 없음\n\n- [ ] **T2** [P] 도구 감지 절 작성 (스킬이 실행 초입에 돌리는 판정)\n      파일: 위 문서에 `## 0. 감지 (호출 전 1회)` 섹션\n      변경: 정확한 감지 명령 —\n      - agent-reach: `command -v agent-reach || ls ~/.agent-reach-venv/Scripts/agent-reach.exe`(win) / `~/.agent-reach-venv/bin/agent-reach`(unix). 있으면 `agent-reach doctor --json`으로 채널별 active_backend 확인.\n      - insane-search: 플러그인 스킬 존재 확인(`ls ~/.claude/plugins/cache/*/insane-search/*/` 또는 스킬 목록). 있으면 `python -m engine <URL>` 사용 가능.\n      - 둘 다 없으면 → \"폴백 모드\"로 진행(T4).\n      검증: 문서에 win/unix 경로 + doctor 명령이 모두 명시됨\n      의존: T1\n\n- [ ] **T3** [P] 라이브 채널 호출표 작성 (agent-reach 위임 + 직접 명령)\n      파일: 위 문서 `## 1. 라이브 채널 (agent-reach)` + `## 2. 차단 우회 fetch (insane-search)`\n      변경: 실측 검증된 명령 그대로 —\n      | 의도 | 명령 |\n      |---|---|\n      | 시맨틱 웹검색(트렌드·최신) | `mcporter call 'exa.web_search_exa(query: \"...\", numResults: 5)'` |\n      | 웹페이지 읽기 | `curl -s \"https://r.jina.ai/<URL>\"` |\n      | GitHub 리포/이슈/PR | `gh search repos \"q\" --sort updated --limit N` / `gh search issues` |\n      | YouTube 자막 | `yt-dlp --write-auto-sub --sub-lang \"ko,en\" --skip-download -o \"/tmp/%(id)s\" \"<URL>\"` → json3/vtt 파싱 |\n      | V2EX 핫 | `curl -s https://www.v2ex.com/api/topics/hot.json -H \"User-Agent: lens/1.0\"` |\n      | RSS/Atom | `curl -s \"<feed>\"` 파싱 |\n      | 플랫폼 라우팅 일반 | **agent-reach 스킬에 위임**(로그인 채널·재시도 체인은 그쪽 references가 관리) |\n      | 차단(403/WAF)된 특정 URL | `python -m engine \"<URL>\"` (insane-search) |\n      + 규칙: **한글 content를 셸에 직접 넣지 말 것**(cp949 깨짐 — `--data-binary @file` 또는 파일 경유). 임시파일은 `/tmp/`.\n      검증: 각 행이 이 세션에서 실측된 명령과 일치(Exa·yt-dlp·engine)\n      의존: T1\n\n- [ ] **T4** 폴백 규칙 절 작성 (미설치 = 실패 아님)\n      파일: 위 문서 `## 3. 폴백 (도구 없을 때)`\n      변경: agent-reach 없음 → `deep-research` 스킬(있으면) → 없으면 네이티브 `WebSearch`/`WebFetch`. insane-search 없음 → `WebFetch`/jina(`r.jina.ai`). **폴백 시 조사보고에 \"라이브 채널 없음(폴백: X)\" 한 줄 남긴다.** 절대 \"라이브 조사 실패\"로 멈추지 않는다.\n      검증: 문서에 2단 폴백(agent-reach→deep-research→web / insane→webfetch)이 명시됨\n      의존: T1\n\n- [ ] **T5** 신선도 규율 절 + 참조 안내\n      파일: 위 문서 `## 4. 신선도 규율` + `## 5. 누가 참조하나`\n      변경: (a) 라이브 인용은 **출처 URL + 발행일** 병기, 발행일 오래된 소스는 \"라이브 아님\" 표기. (b) 이 문서를 참조하는 스킬 = `/cpp`(S2 축③), `/cr`(creeta research). 스킬 추가/변경 시 여기 목록 갱신.\n      검증: 문서에 인용 규율 + 참조 스킬 목록 존재\n      의존: T1\n\n- [ ] **T6** [Codex] WAF 우회 안전한계 절 추가 (insane-search 오남용 방지)\n      파일: 위 문서 `## 6. 안전 한계 (insane-search)`\n      변경: insane-search(`python -m engine`)는 **접근이 막힌 정당한 공개 정보 조회용**. 규칙: (a) 로그인/유료 페이월 우회 금지, (b) robots·ToS 위반 대량 크롤 금지, (c) 개인정보·비공개 리소스 조회 금지, (d) 실패(auth_required/paywall/404)는 terminal로 인정하고 멈춘다(무한 재시도 금지). 이 한계를 문서에 명시.\n      검증: `grep -c \"안전\\|페이월\\|robots\" docs/rules/live-research.md` → ≥1\n      의존: T1\n\n- [ ] **T7** [Codex] 배선 — 참조처 등록 (문서만 만들고 끝내지 않기)\n      파일: `creeta-lens/CLAUDE.md` (라이브러리/rules 섹션), `creeta-lens/docs/START_HERE.md` (rules 목록), `creeta-lens/docs/rules/release-guide.md` (rules 인벤토리에 있으면)\n      변경: 세 곳에 \"docs/rules/live-research.md — 라이브리서치 substrate(/cpp·/cr 참조)\" 한 줄씩 등록. (실제 /cpp·/cr SKILL.md의 참조 추가는 각 스킬 계획서 T에서.)\n      검증: `grep -rl \"live-research\" CLAUDE.md docs/START_HERE.md` → ≥1 파일\n      의존: T1~T5\n\n- [ ] **T8** CHANGELOG 한 줄 (버전 bump은 후속 계획들과 함께 — 여기선 문서만)\n      파일: `creeta-lens/CHANGELOG.md`\n      변경: 다음 버전 항목에 \"docs/rules/live-research.md 신설 — /cpp·/cr 공유 라이브리서치 규칙\" 한 줄.\n      검증: `grep -n live-research CHANGELOG.md` → 1행\n      의존: T1~T7\n\n## 💡 시사점 · ⚠️ 주의점 · 🔀 Side Effect\n\n- **💡 시사점**: 이후 어떤 Lens 스킬도 라이브 데이터가 필요하면 이 문서만 참조하면 된다(재발명 0). agent-reach 채널이 늘면 이 표 한 곳만 갱신.\n- **⚠️ 주의점**: agent-reach·insane-search는 **Lens 외부 플러그인** → Lens가 강제 설치하지 않는다(문서는 \"있으면 쓰고 없으면 폴백\"만 규정). 강제 의존으로 오해하면 남의 환경에서 스킬이 깨진다.\n- **🔀 Side Effect**: 이 문서 자체는 아무 코드도 안 건드림(blast radius 0). 실제 파급은 이를 **참조하는** /cpp·/cr 계획서에서 발생.\n\n## ✅ Review — 검증 (EARS)\n\n**검증 전략**: 로컬 파일 존재 + 내용 grep(문서 작업이라 실행 검증은 파일·grep). Playwright/staging 불필요.\n\n| # | EARS | 확인 방법 | 통과 판정 | 종류 |\n|---|------|----------|----------|------|\n| 1 | WHEN 문서 신설 완료, THEN 파일이 SHALL 존재 | `test -f docs/rules/live-research.md` | exit 0 | auto |\n| 2 | WHEN 도구 있음, THEN 문서는 Exa·engine 명령을 SHALL 제공 | `grep -c \"web_search_exa\\|python -m engine\" docs/rules/live-research.md` | ≥2 | auto |\n| 3 | WHEN 도구 없음, THEN 문서는 폴백 경로를 SHALL 명시 | `grep -c \"폴백\\|deep-research\\|WebFetch\" ...` | ≥2 | auto |\n| 4 | WHEN 스킬이 참조, THEN 참조 스킬 목록이 SHALL 존재 | `grep -n \"/cpp\\|/cr\" docs/rules/live-research.md` | ≥1 | auto |\n\n## 🔀 Codex 교차 협의\n\n- **합의(고신뢰)**: 문서만 만들면 부족 — /cpp·/cr SKILL.md가 명시 Read하도록 배선 + CLAUDE.md·START_HERE·release-guide 등록 필요(반영 T7).\n- **Codex 신규 리스크→반영**: (a) agent-reach/insane-search **설치 감지·명령경로·실패출력·출처표기** 누락 → T2/T3/T5로 보강. (b) **WAF 우회 안전한계**(페이월·robots·비공개 금지, terminal 실패 인정) 누락 → T6 신설.\n- **분기 없음**: substrate=단일 SoT 참조 방식에 이견 없음.\n\n## 진행상황\n- **마지막 업데이트**: 2026-07-01\n- **현재 경로**: 계획 승인 대기\n- **재개 포인트**: 승인 시 T1부터\n","truncated":false,"stale":false}],"history":[{"id":"2026-06-18-cu-scope-winget-cc-uiux-pro","folder":"history","title":"/cu plugin scope + winget UTF-8 + /cc UI/UX 스킬 의무 할당 — 완료","date":"2026-06-18","hasMd":true,"hasHtml":true,"mdPath":"history/2026-06-18-cu-scope-winget-cc-uiux-pro.md","htmlPath":"history/2026-06-18-cu-scope-winget-cc-uiux-pro.html","mdInline":"# /cu plugin scope + winget UTF-8 + /cc UI/UX 스킬 의무 할당 — 완료\r\n\r\n**완료일**: 2026-06-18\r\n\r\n## 요약\r\n`/cu`(Lens Update)가 local/project scope 플러그인을 user scope로만 갱신하려다 \"not installed at scope user\"로 실패하던 버그와, winget의 UTF-8 박스문자에서 리더 스레드가 cp949 디코드로 죽어 출력이 비어 gh를 \"winget 미감지\"로 오탐하던 버그를 한 번에 수정했다. 동시에 `/cc`(Lens Multi) Phase 1.3에 화면·UI 서브태스크의 ui-ux-pro-max 스킬 의무 할당을 추가했다. marketplace `source.ref`가 고정 태그라 소스 수정만으로는 dormant 상태가 되므로 v3.19.0 → v3.20.0 bump + commit + tag + push로 전파했고, 활성 캐시에도 핫미러해 즉시 적용했다.\r\n\r\n## 주요 결정 사항\r\n- **scope를 installed_plugins.json에서 실측해 전달**: `_plugin_scope_info()`로 각 플러그인의 실제 scope를 읽어 `--scope <scope>`로 넘기고, local/project scope는 `projectPath`를 cwd로 실행. user scope만 가정하던 기존 동작이 context7·playwright(local scope) 갱신을 깨던 원인이라 실측 기반으로 전환.\r\n- **run()에 UTF-8 강제 디코딩**: `encoding=\"utf-8\", errors=\"replace\"`를 추가. winget이 출력하는 UTF-8 박스문자(0xe2…)를 cp949로 읽던 리더 스레드가 UnicodeDecodeError로 죽어 winget 출력이 비고, 그 결과 gh가 \"winget 미감지—수동 안내\"로 오탐되던 연쇄를 끊음. scan stderr 노이즈도 함께 제거.\r\n- **ui-ux-pro-max는 재설치하지 않음**: 이미 `~/.claude/skills/ui-ux-pro-max`에 설치돼 있음을 확인. `/cc` SKILL.md Phase 1.3에 기존 \"필수 실행 스킬\" 메커니즘으로 의무 할당만 추가하고, 미설치 머신은 네이티브 UI/UX 베스트프랙티스로 graceful degrade하도록 설계.\r\n- **bump + 핫미러 동시 전파**: marketplace `source.ref`가 고정 태그라 소스 수정만으로는 휴면 상태이므로 3.19.0 → 3.20.0 bump·commit·tag·push로 정식 전파. 동시에 활성 캐시(`cache/CreetaCorp/lens/3.19.0`)의 `cu.py`·`cc/SKILL.md`를 핫미러해 이 PC에서 즉시 동작하게 함.\r\n\r\n## 변경 파일\r\n- `scripts/cu.py` — `_plugin_scope_info()` 추가, `_upgrade_plugin_generic()`의 scope/cwd 처리, `run()` UTF-8 디코딩\r\n- `skills/cc/SKILL.md` — Phase 1.3 화면·UI 서브태스크 ui-ux-pro-max 의무 할당\r\n- bump 13파일 — `plugin.json`, `marketplace.json`, `CHANGELOG.md`, `CLAUDE.md`, `README.md`, hooks ×2, skills SKILL.md ×6 배너\r\n- 메모리 — `cu-winget-false-negative-windows.md` + `MEMORY.md` 인덱스를 \"v3.20.0에서 코드 수정됨—수동 워크어라운드 불필요\"로 갱신\r\n\r\n## 테스트 & 검증\r\n실측으로 확인:\r\n- ✅ `/cu scan`에서 cp949 traceback 사라짐 + gh `can_auto=True` (winget 소스 감지)\r\n- ✅ `context7` plugin `update --scope local` exit 0 (local scope 갱신 정상)\r\n- ✅ GitHub Release `isLatest=true` (v3.20.0 commit 4f1f606, tag push, Latest 지정)\r\n\r\n## 추가 사항\r\n- (선택) Mac Mini 등 타 머신은 `/lens-upgrade`로 3.20.0 반영\r\n- (선택) 라벨 정리를 위해 이 PC도 `/lens-upgrade` + 재시작\r\n","truncated":false,"stale":true},{"id":"2026-06-11-ccp-power-verify","folder":"history","title":"/ccp (Lens Power Verify) 신설 + 5분 진행보고 규칙 — 완료","date":"2026-06-11","hasMd":true,"hasHtml":true,"mdPath":"history/2026-06-11-ccp-power-verify.md","htmlPath":"history/2026-06-11-ccp-power-verify.html","mdInline":"# /ccp (Lens Power Verify) 신설 + 5분 진행보고 규칙 — 완료\r\n\r\n**완료일**: 2026-06-11\r\n\r\n## 요약\r\n이미 만들어진 산출물(기능·PR·화면·방금 빌드)을 출처 불문 독립적으로 적대적 감사하고, Playwright 등으로 실제 실행해 \"진짜 작동하는가\"를 증거화하며 최소 수복까지 책임지는 `/ccp` (Lens Power Verify) 스킬을 신설했다. `/cc`(\"만들면서 검증\")와 `/ccp`(\"이미 만들어진 것을 독립 감사\")의 경계를 한 문장으로 명문화했고, 4 렌즈(기능·엣지·회귀·UX) 적대적 검증과 파괴적 변경 차단·무한루프 방지·정직한 종료 같은 안전장치를 함께 박았다. 더불어 `/cc`·`/cp`·`/cpp`·`/ccp` 네 스킬에 공통 5분 진행보고 규칙을 추가했다. v3.16.0으로 배포 완료(commit 1bb756b, tag v3.16.0).\r\n\r\n## 주요 결정 사항\r\n- **출처 불문 standalone 감사로 경계 확정** — Codex 교차 협의(S4)에서 `/cc`와 중복 리스크가 크다고 판단, `/cc`=\"만들면서 검증\" ↔ `/ccp`=\"이미 만들어진 것을 적대적으로 독립 감사해 증거화·수복\"으로 한 문장 차별화. 같은 작업이면 `/cc`를 권유하는 다운그레이드 가드도 둠.\r\n- **read-only 우선 · 파괴적 변경 차단** — \"무슨 수를 써서라도 검증\"을 read-only 범위까지로 한정. 배포·DB migration·대량삭제·외부 결제/메일은 dry-run 또는 승인 없이 금지(Codex critical 반영).\r\n- **만장일치 게이트** — 4 렌즈 중 blocking refute가 1개라도 있으면 done 선언 차단(과반이 아닌 만장일치).\r\n- **정직한 종료** — 못 끝내면 done 금지, `verified=false` + blocking + 다음 액션으로 마감.\r\n- **무한루프 방지 cap** — 5회 + 예산 + 동일 실패 2회 시 전략 전환 + 3회 승인 cap으로 무한 수복 방지.\r\n- **Surgical** — pass한 검증 축은 freeze, 실패 축만 수복. `/cc`·`/cp`는 5분 규칙 1줄 외 무수정.\r\n\r\n## 변경 파일\r\n- `skills/ccp/SKILL.md` (신설 — 배너 \"Lens Power Verify v3.16.0\", 증거수집→4렌즈 반박→최소수복→재검증→증거리포트 루프 + 안전장치 + 5분 보고)\r\n- `skills/cc/SKILL.md` (기본값 #2 \"2분\"→\"5분\")\r\n- `skills/cp/SKILL.md` (절대규칙에 5분 보고 1줄)\r\n- `skills/cpp/SKILL.md` (절대규칙에 5분 보고 1줄)\r\n- `scripts/bump-version.sh` (+ccp 배너, 12→13)\r\n- `CLAUDE.md` (Skills 표 +/ccp 행 + v3.16.0 feat)\r\n- `README.md` (/ccp 섹션)\r\n- `CHANGELOG.md` (v3.16.0)\r\n\r\n## 테스트 & 검증\r\nEARS 6항목 전부 auto 검증으로 통과:\r\n- ✅ 새 세션 시작 시 인벤토리에 `/ccp` 표시 (SKILL.md + SessionStart)\r\n- ✅ `/ccp` 검증 시 4 렌즈 적대적 검증 수행 (SKILL.md 렌즈 섹션)\r\n- ✅ blocking refute 1+ 시 done 선언 차단 (blocking=0만 pass)\r\n- ✅ 파괴적 변경(배포·DB·대량삭제·결제/메일) 승인 없이 금지 (SKILL.md 안전장치 명시)\r\n- ✅ 장시간 작업 시 4개 스킬 모두 5분 진행보고 (\"5분\" grep 4개 모두 적중)\r\n- ✅ 릴리즈 tag 푸시 후 재설치 cache에 ccp/ 포함 (cache 3.16.0/skills/ccp 존재 확인)\r\n\r\n배포 검증: commit 1bb756b, tag v3.16.0 push, 캐시 3.16.0 갱신에서 ccp/ + 5분 4스킬 모두 확인.\r\n\r\n## 추가 사항\r\n남은 후속(선택): gh release 생성, done-sweep의 cpp/ccp 마커 인식(v2). 둘 다 필수가 아니며 본 작업의 완료 정의에는 포함되지 않음.\r\n","truncated":false,"stale":true},{"id":"2026-06-11-cpp-power-plan","folder":"history","title":"/cpp (Lens Power Plan) 신설 — 빌드레디 심층 계획 엔진 — 완료","date":"2026-06-11","hasMd":true,"hasHtml":true,"mdPath":"history/2026-06-11-cpp-power-plan.md","htmlPath":"history/2026-06-11-cpp-power-plan.html","mdInline":"# /cpp (Lens Power Plan) 신설 — 빌드레디 심층 계획 엔진 — 완료\r\n\r\n**완료일**: 2026-06-11\r\n\r\n## 요약\r\n\r\n되묻기 0을 목표로 하는 빌드레디 심층 계획 엔진 `/cpp`(Lens Power Plan)를 신설했다. 사용자가 `/cpp <요청>`을 입력하면 그대로 실행만 하면 완성품이 나오는 계획서가 산출되며, 계획서 맨 앞에는 항상 \"이게 끝나면 무엇을 할 수 있게 되는가\"가 사용자 언어로 박힌다. 9스테이지 파이프라인(목표 잠금 → Clarify-to-Zero → 6축 fan-out 조사 → body-adaptive 딥스펙 → Codex 교차 협의 → 빌드레디 태스크 → EARS 검증 → self-check → /cc 핸드오프)을 SKILL.md 골격으로 구현했고, 기존 `/cp`는 한 줄도 건드리지 않은 채 신규 폴더로 격리했다. v3.15.0으로 배포 완료(commit 247dbc0, tag v3.15.0).\r\n\r\n## 주요 결정 사항\r\n\r\n- **`/cp` 무수정, 신규 폴더 격리**: 가벼운 계획은 `/cp`, \"끝장 계획\"은 `/cpp`로 역할을 분리. `/cp`·`lib/*`·기존 skill을 일절 수정하지 않는 surgical 원칙을 Constitution 3번으로 못 박았다.\r\n- **Codex 교차 협의를 양보 불가 하드게이트로**: graceful-degrade를 금지하고, Codex 미감지 시 조용히 진행하지 않고 정지·보고하도록 했다. 다만 Codex 일시 다운의 불편(R2)을 고려해 사용자가 1회성으로 명시 우회할 수 있는 문구를 남겼다.\r\n- **목표는 사용자 언어로 잠금(Goal-Locked)**: 목표 문장에 함수/HTTP/SQL/경로 같은 기술 토큰을 0개로 강제. 약한 목표는 승인 거부(`/cp` v3.8 계승).\r\n- **Body-Adaptive 구조**: spine(목표·Constitution·검증·실행·진행상황)만 고정하고 나머지는 주제가 구조를 정하게 했다. 도메인 라우터로 UI는 ASCII 와이어프레임+요소스펙+상태, API는 계약서를 산출.\r\n- **벤치마크 기반 채택**: Spec Kit(Constitution/clarify/analyze), Kiro(EARS/waves), Superpowers(빌드레디 태스크 포맷)에서 검증된 패턴만 채택. BMAD 다중 페르소나·별도 CLI·7-커맨드 분리는 과함으로 미채택(`/cpp`는 단일 명령).\r\n- **깊이 ≠ 장황(R1)**: power가 토큰 폭발로 변질되지 않도록 TL;DR 의무화와 \"불필요 섹션 금지\" 게이트를 SKILL.md에 명시. 깊이는 정보 밀도지 분량이 아니다.\r\n\r\n## 변경 파일\r\n\r\n- `skills/cpp/SKILL.md` (신규) — 배너 \"Lens Power Plan v3.15.0\", 9스테이지 파이프라인\r\n- `scripts/bump-version.sh` — cpp 배너 sed 라인 + 검증 목록 추가, 파일 카운트 11→12\r\n- `CLAUDE.md` — Skills 표에 `/cpp` 행 + v3.15.0 feat 노트\r\n- `README.md` — skills 섹션 `/cpp` 1줄\r\n- `CHANGELOG` — v3.15.0 항목\r\n\r\n## 테스트 & 검증\r\n\r\n6개 EARS 검증 항목(WHEN/THEN/SHALL)으로 됐다는 증거를 정의하고 충족 확인:\r\n\r\n- 새 세션 인벤토리에 `/cpp` 표시 — `skills/cpp/SKILL.md` 폴더만 생성하면 `plugin.json`의 `\"skills\": \"./skills/\"` 자동 등록으로 등장(cps가 hooks/scripts 하드코딩 0건인데도 인벤토리에 뜨는 것으로 확정).\r\n- `/cpp` 목표 문장에 기술 토큰 0개 — 목표 섹션 검사.\r\n- UI 요청 시 와이어프레임+요소스펙+상태+문구 4요소 포함.\r\n- Codex 미감지 시 진행 정지·보고 — SKILL.md Codex 게이트 명시.\r\n- 릴리즈 tag 푸시 후 재설치 cache가 `skills/cpp/` 포함 — `bump-version.sh 3.15.0`으로 12/12 파일 갱신·stale 0 확인, commit + `git tag v3.15.0` + push, `/lens-upgrade` 재설치로 캐시 3.15.0의 cpp/ 디렉토리 존재 확인.\r\n- `/cp`·board·`/cc` 핸드오프 회귀 0 — 기존 동작 점검.\r\n\r\n## 추가 사항\r\n\r\n남은 후속(모두 선택):\r\n\r\n- gh release 생성.\r\n- done-sweep의 cpp 마커 인식(v2) — cpp 문서가 `## Plan A` 부재로 \"수동확인필요\"로 분류될 수 있는 안전한 degrade를 보강.\r\n- UI 렌더 목업 — 현재는 ASCII 와이어프레임만 지원.\r\n","truncated":false,"stale":true},{"id":"2026-06-05-lens-capability-modernization-audit","folder":"history","title":"Lens 자가 현대화 감사 기능 (`/cr`) — 완료","date":"2026-06-05","hasMd":true,"hasHtml":true,"mdPath":"history/2026-06-05-lens-capability-modernization-audit.md","htmlPath":"history/2026-06-05-lens-capability-modernization-audit.html","mdInline":"# Lens 자가 현대화 감사 기능 (`/cr`) — 완료\r\n\r\n**완료일**: 2026-06-06\r\n\r\n## 요약\r\n\r\nLens가 자기 자신의 모든 기능을 Claude/Codex의 최근 네이티브 발전과 사용자 세션 패턴에 비춰 주기적으로 재평가하는 `/cr`(자가 현대화 감사) 스킬을 신설했다. 한 번의 명령으로 4차원 양면 감사 — 공급-드리프트(여전히 유효한가), 공급-업그레이드(더 좋게 만들 벡터), 편의(워크플로 마찰 제거), 수요-마이닝(반복 패턴 기반 net-new 제안) — 를 수행해 각 기능에 KEEP/UPGRADE/OBSOLETE/NEW 판정과 라이브 근거를 단 분류 리포트를 산출한다. 감사 로직은 머신 독립적인 온디맨드 스킬 + creeta-lens 레포 한정 SessionStart staleness 알림(네트워크 호출 0)으로 구현했고, OBSOLETE 자동삭제는 0건 — 죽음 판정은 사람이 결정할 제안으로만 남긴다. v3.13.0으로 배포 완료.\r\n\r\n## 주요 결정 사항\r\n\r\n- **온디맨드 스킬 + 세션 staleness 알림 (cron 아님)** — Lens는 여러 머신에 배포되는 플러그인이라 cron은 머신 의존적이다. 기존 `/cu`(per-machine, 필요할 때만) 패턴과 일치하는 온디맨드 방식을 채택해 포터빌리티를 확보했다.\r\n- **레지스트리 포맷 = JSON** — Claude(markdown 표) vs Codex(JSON) 분기에서 JSON(`docs/rules/capability-assumptions.json`)을 채택. 사용자가 \"machine-readable\"을 명시했고, 훅의 레지스트리-해시 staleness 트리거가 안정적 직렬화를 요구하기 때문(JSON이 해시하기 깔끔).\r\n- **staleness 상태 = 프로젝트-로컬** — 전역 `~/.claude` vs 프로젝트-로컬 분기에서 `.lens/capability-audit-state.json`(로컬)을 채택. 전역이면 모든 프로젝트에서 알림이 떠 nag가 발생하지만, `/cr`은 lens 레포에서만 의미 있으므로 로컬 상태가 알림 스코프를 자연히 한정한다. 덤으로 레지스트리 해시 변경 시 재감사 신호도 얻는다.\r\n- **fetch 실패 = UNKNOWN-default (버전-앵커 오프라인 판정 아님)** — 라이브 데이터가 없을 때 추측으로 OBSOLETE를 찍는 것이 최악(false-obsolete)이다. 더 단순하고 안전한 UNKNOWN 표기를 택했다. 그 회차는 덜 actionable하지만 틀리지 않는다.\r\n- **`probe` 신호 타입 허용** — 능력 신호 중 로컬 확정 가능한 것(네이티브 명령 존재, `codex --help` 노출 모델 등)은 `probe`, 로드맵/공식 발표는 `web`. Pre-mortem P1·P2 — \"체인지로그는 능력을 다 안 알려주고 실행 중인 환경 자체가 더 권위 있는 신호\" — 를 레지스트리 스키마(`signal_method`)에 반영했다.\r\n- **OBSOLETE 자동삭제 0, 모호하면 KEEP** — 고신뢰 건도 삭제가 아니라 `docs/tasks/`에 `/cp` task로 핸드오프. obsolete 안전장치로 코드/스킬 파일 자동삭제를 금지했다.\r\n- **수요 가치 재정의** — Pass 1 감사에서 신기능 제안은 0건(`/ch`·`/cx` 둘 다 사용자 리뷰 후 드롭). 수요 가치는 \"반복 명령을 스킬 기본값으로\"로 재정의돼 v3.14.0에 반영됐다.\r\n\r\n## 변경 파일\r\n\r\n- `skills/cr/SKILL.md` (신규) — `/cr` 스킬. Phase A 레지스트리+버전 로드 → Phase B 라이브 fetch(공식 allowlist) → Phase C 분류(KEEP/UPGRADE/OBSOLETE/NEW + confidence + evidence) → Phase D md 리포트 → Phase E HTML 덱+board → Phase F 고신뢰 건 `/cp` 핸드오프 → Phase G stamp. `Triggers:` 줄 포함(자동추천 노출용).\r\n- `docs/rules/capability-assumptions.json` (신규) — machine-readable 레지스트리. 기능별 `{id, kind, refs[], purpose, assumed_native_gap, gap_closed_signal, signal_method(probe|web|both), official_sources[], false_obsolete_risk, last_reviewed}`. Pass1 감사의 11행을 시드로 사용.\r\n- `lib/capability-audit.js` (신규) — `readAuditState()`, `isLensRepo(cwd)`, `computeRegistryHash()`, `formatAuditNudge()`, CLI `stamp` 서브커맨드.\r\n- `hooks/session-start.js` — `isLensRepo(cwd)` 이고 (감사 주기 초과 또는 레지스트리 해시 변경)이면 muted 한 줄 알림 주입. 네트워크 0, fail-soft.\r\n- `lens.config.json` — `capabilityAuditIntervalDays`(기본 30) + `capabilityAuditNudge`(기본 true) 추가.\r\n- `CLAUDE.md` / `README.md` — 스킬 표에 `/cr` 추가.\r\n- 릴리스 산출물 — `scripts/bump-version.sh 3.13.0`(11곳 일괄 범프) + CHANGELOG `Added` + 태그 + GitHub Release.\r\n\r\n## 테스트 & 검증\r\n\r\n8개 검증 신호(✅표) 기준:\r\n\r\n- **분류 완전성** — 리포트 분류 행 수가 레지스트리 항목 수와 일치, 누락 0.\r\n- **근거 부착** — 모든 비-KEEP(OBSOLETE/UPGRADE/NEW) 행에 공식 체인지로그 URL+버전 인용. 근거 없는 비-KEEP = 0.\r\n- **핸드오프** — 고신뢰 UPGRADE/OBSOLETE/NEW가 `docs/tasks/`에 대응 `/cp` task로 생성됨.\r\n- **3종 산출 + board** — `docs/history/<id>.md`·`.html` + board 카드 노출.\r\n- **알림 스코프** — creeta-lens 세션 시작 시 알림 출력, 타 레포에선 미출력.\r\n- **타이머 리셋** — stamp 후 `lastAuditAt` 갱신 → 재시작 시 알림 소멸.\r\n- **obsolete 안전장치** — OBSOLETE 판정이 있어도 `git status` 변경분 = 문서·신규파일만(코드/스킬 자동삭제 0).\r\n- **degrade 안전** — 네트워크 차단 시 비-KEEP을 UNKNOWN으로 표기, OBSOLETE 추측 0.\r\n\r\n실증 완료(Pass 1, 2026-06-05): 이 4차원 감사를 멀티에이전트 워크플로로 1회 실행해 `/cr`이 자동화할 패스를 입증했다. 결과 = `docs/history/2026-06-05-lens-modernization-audit.md`(0 OBSOLETE / 2 KEEP / 9 THIN + 14 우선조치 + 신기능 0건). 원자료 = `.lens/conv-mining/audit-supply.json`·`audit-demand.json`.\r\n\r\n## 추가 사항\r\n\r\n- **수요 가치 후속** — \"반복 명령을 스킬 기본값으로\"는 v3.14.0에서 별도 반영.\r\n- **남은 코어 리팩토링(본 task 범위 밖, 별도 `/cp` 계획으로 분리)** — #6 `/goal` 위임, #7 Monitor 제거, #12 `/cps`, #13 `/cp` 토큰, #14 lens-upgrade. 미완이 아니라 의도적으로 분리된 후속 항목.\r\n- **언급만 한 드리프트** — `docs/START_HERE.md`의 6스킬(/cu 누락) 구문, SessionStart \"Quick Commands\" 하드코딩(/cps·/cs·/cu 누락)은 본 작업 범위 밖으로 명시.\r\n- **수명 주의** — `/cr` 매 실행 = `docs/history/`에 새 감사 파일 1개. 의도된 audit trail이나 board 카드가 누적 증가한다.\r\n","truncated":false,"stale":true},{"id":"2026-06-05-lens-modernization-audit","folder":"history","title":"Lens 현대화 감사 — Pass 1 (2026-06-05)","date":"2026-06-05","hasMd":true,"hasHtml":true,"mdPath":"history/2026-06-05-lens-modernization-audit.md","htmlPath":"history/2026-06-05-lens-modernization-audit.html","mdInline":"---\r\ntitle: \"Lens 현대화 감사 — 11기능 재분석 + 대화 마이닝 신기능 제안 (Pass 1)\"\r\ndate: 2026-06-05\r\nkind: audit\r\nmethod: \"이종 멀티에이전트 워크플로 (공급 측 25 agents + 수요 측 19 agents, 듀얼 검증)\"\r\n---\r\n\r\n# Lens 현대화 감사 — Pass 1 (2026-06-05)\r\n\r\n> 이 문서는 `/cr`(자가 현대화 감사) 기능의 **첫 실증 실행** 결과이자, 그 기능이 매번 산출할 리포트의 양식 레퍼런스다. 두 축으로 감사했다:\r\n> - **공급 측** — Claude Code(v2.1.160) + Codex(0.137.0) 네이티브 능력이 어디까지 왔나 → 각 기능 노후도·업그레이드·편의\r\n> - **수요 측** — 사용자의 과거 세션 82개·954 발화에서 반복/불편/우회 패턴 → net-new 기능 제안\r\n>\r\n> 방법: 두 개의 멀티에이전트 워크플로(기능별 독립 분석 → 적대적 검증 → 종합). 라이브 CLI probe + 공식 문서 + 실제 소스 정독 기반. 근거 없는 OBSOLETE 금지, false-obsolete 적대 검증.\r\n\r\n---\r\n\r\n## 0. 한 줄 결론\r\n\r\n**2026-06 네이티브 Claude Code가 Lens 오케스트레이션 \"엔진\"의 대부분을 흡수했다 — 그러나 11기능 중 OBSOLETE는 0이다.** `/cs`(멀티레포 sweep)와 Codex 연동(cross-vendor 이종검증)은 네이티브가 직접 공백을 인정해 KEEP, 나머지 9개는 THIN(엔진은 네이티브에 위임해 얇게, 고유 코어만 생존). 살아남는 코어는 셋으로 수렴한다: **① 디스크 영속 산출물**(board HTML·docs 라이프사이클·감사로그 — 네이티브는 전부 세션 휘발), **② cross-vendor 이종검증**(codex/gpt-5.5 — 네이티브 평가자·워커가 전부 Anthropic 가족이라 구조적 비대체), **③ Worker 프롬프트에 박힌 Karpathy 4규칙 강제계약**.\r\n\r\n---\r\n\r\n## 1. 공급 측 — 11기능 노후도 판정\r\n\r\n| # | 기능 | 판정 | 한 줄 |\r\n|---|------|------|-------|\r\n| 1 | `/c` 단일 내비 | **THIN** | 모델배정·Monitor폴링·Supervisor·QA·5회게이트는 네이티브 흡수. 남는 코어=Worker의 Karpathy 4규칙 강제계약 + 추천 1개 확정 |\r\n| 2 | `/cc` 병렬 엔진 | **THIN** | 병렬 엔진은 Dynamic Workflows로 하강. 단 Codex AND-게이트 + /cp plan-binding + 한국어/Karpathy 규율은 생존 |\r\n| 3 | `/cp` 계획 엔진 | **THIN** | 실행·목표강제·프리모템은 네이티브(plan mode/goal/workflows) 위임 가능. 디스크 영속 문서 라이프사이클 + 작성시점 Goal 품질게이트는 비대체 |\r\n| 4 | `/cps` START_HERE | **THIN** | 네이티브 /init은 CLAUDE.md만, 라우팅 인덱스 아님. 비파괴 diff 게이트·(Not documented yet) 규율 비대체 |\r\n| 5 | `/cs` 멀티레포 동기화 | **KEEP** | 네이티브가 직접 인정한 공백 — EnterWorktree는 단일레포 멀티워크트리뿐. 워크스페이스 전 레포 sweep 무대체 |\r\n| 6 | `/cu` per-machine 업데이터 | **THIN** | 실행부는 네이티브 패스스루. cross-tool 열거 + staleness 플래깅(native는 'unknown') + multi-select는 비대체 |\r\n| 7 | `/lens-upgrade` | **THIN** | 버전올리기는 네이티브 흡수. 멀티스코프 dedup·stash·자동롤백·origin교정은 무노출 |\r\n| 8 | 발견/추천 레이어(훅) | **THIN** | 실측상 hollow(아래 §4). /command nag-차단 OVERRIDE + 세션 온보딩만 생존 |\r\n| 9 | 에이전트 대시보드(훅) | **THIN** | 쓰기 전용 텔레메트리(reader 0건). 세션 경계 영속 감사로그 + orphan 정합성은 비대체 |\r\n| 10 | plan-manager + board-builder | **THIN** | board-builder=KEEP급(5 호출처, 무대체). plan-manager 무거운 절반은 런타임 호출자 0 |\r\n| 11 | Codex 이종검증 연동 | **KEEP** | cross-vendor 이종검증은 구조적 비대체(네이티브 평가자·워커 전부 Anthropic). 개념층 KEEP / 배관층 THIN |\r\n\r\n**핵심 발견 (관통):** 네이티브 4종 — **Dynamic Workflows**(16동시·adversarial verify, v2.1.154+) + **per-agent 모델 서브에이전트**([sonnet,opus,haiku]) + **`/goal`**(매 턴 Haiku 평가자 재판정, v2.1.139+) + **plan mode** — 이 `/c`·`/cc`·`/cp`의 절차 분량 대부분을 네이티브 프리미티브의 prose 래퍼로 만들었다. 하지만 OBSOLETE 0 — 이유는 네이티브가 전부 **세션 휘발성**이고 **단일(Anthropic) 모델 가족**이며 **Karpathy 계약을 강제하지 않기** 때문.\r\n\r\n---\r\n\r\n## 2. 우선순위 실행목록 (임팩트 × 저비용)\r\n\r\n> 업그레이드·편의 개선을 임팩트/비용으로 랭킹. 각 항목은 `/cr`이 발견 시 `/cp` task로 핸드오프할 후보다.\r\n\r\n| # | 기능 | 조치 | 유형 | 임팩트 | 비용 |\r\n|---|------|------|------|--------|------|\r\n| 1 | codex / `/cc` | Codex 리뷰 게이트를 **`codex exec review --uncommitted --output-schema --ephemeral`**로 전환(bare `codex review` 아님 — exec review라야 schema 동시 노출). awk PASS/FAIL·수동 diff·orphan 의존 제거. 라이브 실측 통과·plan-tier 무의존 | upgrade | high | M |\r\n| 2 | 발견/추천 | UserPromptSubmit **매 메시지 자동제안 폐기**(autoRecommend 기본 off) + 죽은 `KNOWN_PLUGINS=[]` 디스커버리 제거 + CLAUDE.md:51 '60+ known plugins' 드리프트 수정 | deprecate | high | S |\r\n| 3 | `/cu` | vscode-번들 codex(0.137.0-alpha)를 GitHub stable과 비교하는 **오탐('항상 update available')** → `needs_update=null`. `_codex_install_kind`가 이미 vscode 구분 ~3줄 | fix | med | S |\r\n| 4 | codex SoT | `service_tier=priority` → 정식 **`service_tier=fast`+`features.fast_mode=true`**(priority는 레거시 별칭) + `gpt-5.5` 하드코딩 **버전무관 fallback**. SoT 1곳 갱신으로 /cp·/cc 전부 정합 | fix | med | S |\r\n| 5 | plan-board | plan-manager.js의 **런타임 호출자 0인 절반**(generatePlanContent 8개국어 dict·extractGoal·validate·save/loadPlanState) `@deprecated` 격리, 8개국어 dict 릴리스 동기화 의무 제거 | deprecate | med | S |\r\n| 6 | `/c`·`/cc` | Phase 4(Supervisor)+5(QA) 자작 점수제·5회 게이트를 **네이티브 `/goal` emit**으로 위임(/cp v3.7.0 선례). Supervisor/QA spawn 비용 제거 | adopt-native | high | M |\r\n| 7 | `/c`·`/cc` | **Monitor 폴링 에이전트 제거**(haiku 5분, ALWAYS deploy) → background exit 재호출+TodoWrite. 진행보고는 2분+ long-running만 | adopt-native | med | S |\r\n| 8 | 대시보드 | PostToolUse 훅이 `additionalContext`로 직전 Task status/실패사유 **모델 주입**(현 비스키마 필드는 모델에 안 닿음). write→consume 단절 해소 | upgrade | high | S |\r\n| 9 | `/cc`·`/cps` | 작업 종료 시 **자동 commit(+Co-Authored-By)+원격동기화** 기본화(더블게이트+QA 통과 시). **`.gitignore` 존중(시크릿 임의 제외 금지 — 사용자는 민감파일을 의도적으로 버전관리: `feedback_sensitive_files_to_livevil_setting`)**, default 브랜치면 먼저 브랜치, diverged면 보고만 | ergonomics | high | M |\r\n| 10 | `/cc`·`/c` | **헤드리스(cron/TTY없음) 감지 시 AskUserQuestion 폴백**(자동승인 or plan-only 종료). Mac Mini 무인 파이프라인 hang 방지 | ergonomics | med | M |\r\n| 11 | `/cs` | `git-sync-all.sh` `--json` 모드 + diverged/failed 최상단 강조 + SKILL.md:100 'Stop훅 auto-commit' 미구현 암시 제거(stop.js git 동작 0) | fix | med | S |\r\n| 12 | `/cps` | `/cs` 스윕에 **START_HERE 커버리지 체크** 끼워 '진입문서 없는 레포 N개' 일괄 보고+생성(14레포 수동 비현실적) | upgrade | high | M |\r\n| 13 | `/cp` | on-invoke 토큰(**~15.8k, Lens 최대**) 절감 — ORGANIZE/CONVERT·codex-integration·Karpathy 전문 인라인을 별도 참조로 분리, PLAN만 본문 | upgrade | high | M |\r\n| 14 | `/lens-upgrade` | Phase 1+4 정상경로를 `claude plugin marketplace update`+`plugin update --scope`로 위임, Lens는 백업·dedup·검증·롤백·origin교정만 | adopt-native | med | M |\r\n\r\n---\r\n\r\n## 3. 수요 측 — 대화 마이닝 신기능 제안\r\n\r\n> 82세션·954 발화에서 반복/불편/우회 패턴을 추출 → 신기능 제안 → 적대적 검증(근거 약하거나 기존 스킬 중복이면 DROP).\r\n\r\n**관통 테마:** ① claim-vs-reality(보고 전 라이브 미검증 단정 — 최빈 신뢰붕괴) ② 운영 파이프라인 '지금 정상?' 헬스체크 세션마다 반복 ③ 장시간 작업 진행보고 부재('2분마다 보고' 13회+) ④ 다중 세션·머신 핸드오프 부담('Continue from where you left off' 10회+) ⑤ 즉시·끝까지 실행 강박 ⑥ 시크릿 livevil-setting 중앙화.\r\n\r\n> **후속 정정 (2026-06-06, 사용자 리뷰 후):** Pass-1 은 `/ch`·`/cx` 2건을 KEEP 으로 제안했으나, 사용자 검토에서 **둘 다 드롭**으로 정정됐다(아래 ①②). 신기능 제안은 결국 **0건** — Pass-1 이 마이닝 5건 중 3건을 잘랐으나 사실 **5건 모두 잘랐어야 했다.** 대신 수요 측의 진짜 가치는 신기능이 아니라 **반복 명령을 기본값으로 박는 것**(아래 §3.5)으로 재정의됐고 v3.14.0 에 반영.\r\n\r\n### 신기능 제안 — 검토 후 0건 (모두 DROP)\r\n\r\n**① `/ch` 운영 헬스체크 디스패처 — DROP (2026-06-06 정정)**\r\n- Pass-1 제안: 사용자 기존 SoT(런북·체크스크립트·대시보드)를 발견·실행하는 얇은 디스패처.\r\n- **드롭 사유**: 범용 Lens 스킬로 **일반화 불가**. \"정상(healthy)\"의 정의는 레포 도메인마다 다르고 공통 불변식이 0이라(체크 로직이 환원 불가능하게 프로젝트별) — `/cs`(git 불변)·`/cu`(--version 불변)처럼 성립하지 않는다. 일반화 가능한 유일한 형태는 \"레포가 선언한 체크를 실행하는 러너\"인데 그건 이미 `make`/`npm run`/CI 가 하는 일이고, 사용자 14+ 레포에 그 선언 컨벤션이 균일하게 없다. 진짜 반복 실패는 \"구조 부재\"가 아니라 *런북을 무시하고 쿼리 재즉흥*하는 행동 문제 — 메모리 룰(`feedback_livevil_publishing_status_runbook_first`)이 이미 처리.\r\n\r\n**② `/cx` 세션 핸드오프 — DROP (2026-06-06 정정)**\r\n- Pass-1 제안: `initSession()` wipe 를 보존으로 고치고 Stop 훅이 산출물 경로 캡처 + 얇은 reader.\r\n- **드롭 사유**: 전제가 약하다. `initSession()` 의 wipe 는 **버그가 아니라 의도된 동작**일 가능성이 크다(세션마다 대시보드를 새로 시작하는 게 정상) — 그러면 고칠 건 동작이 아니라 *틀린 docstring 한 줄*뿐이다(별건 정정). 핸드오프 가치도 네이티브 `--resume`/`--continue` + `/cp` 의 \"재개 포인트\" 와 겹쳐 고유가치가 얇다. → 새 스킬 불요.\r\n\r\n### §3.5 수요 측의 진짜 가치 — 반복 명령 → 기본값 (v3.14.0 반영)\r\n\r\n신기능이 아니라, 사용자가 *매번 다시 치던 명령*을 스킬 기본 동작으로 박는 것이 실제 사용자-관점 개선이다. 마이닝 근거 → v3.14.0:\r\n- \"커밋하고 푸시해\"(다회) → `autoCommitOnComplete` **기본 on** (안전 레일).\r\n- \"N분마다 보고해\"(13회+) → `/c`·`/cc` 장시간 작업 자동 진행보고 기본.\r\n- \"어디 저장했어?\" → 산출물 풀 경로 자동 보고 기본.\r\n- \"지금 해 / 멀 기다려 / 니가 해\" → 즉시·끝까지 실행, 헤지·떠넘김 금지 기본.\r\n- \"보고 먼저 하고 적용\" → 위험·시각 변경은 보고-먼저 기본.\r\n\r\n### DROP — (Pass-1 원래 3건, 근거 강함)\r\n\r\n- **`/cv` 라이브 검증 게이트** → `/cc`·`/cp`로 MERGE. 문제는 절실하나 capability ~85%가 이미 `/cc` Phase 6 QA(verified=false 차단 + 4채널 라우팅)에 구현됨. 핵심 전제(보고 전 *자동* 게이트)는 invocable skill로 **구조적 불가** — un-invoked 주장에 게이트를 강제하려면 skill이 아니라 harness Stop-hook(settings.json). → `/cc` QA에 '생성물 factuality WebSearch 대조' 한 줄 + `/cp` 어휘 추가로 흡수.\r\n- **progress-pulse(자동 주기보고 훅)** → 빌트인 **`/loop` 중복**(DROP). 핵심 메커니즘이 기술적 불가 + 사용자 본인 메모리가 못박음: \"ScheduleWakeup은 /loop dynamic 컨텍스트 전용, 일반 훅에서 호출 불가\". 해법은 `/loop 2m <status check>`.\r\n- **`/cp` 라이브 임베드 뷰어** → **범위 밖**(DROP). 근거가 잘못된 대상에 붙음(grounded=false) — 인용은 전부 일반 UI 개발 워크플로지 /cp 요청 아님. /cp 핵심 아키텍처 4건 위반(코드 실행 금지·JS 제한·md=SoT·CSS 인라인 금지). 그 공백은 verify+Playwright+ui-ux-pro-max 영역.\r\n\r\n---\r\n\r\n## 4. 검증된 코드 드리프트 / 버그 (별건, 외과 수정 후보)\r\n\r\n감사 중 라이브 실측·소스 정독으로 확인된 사실(추측 아님):\r\n\r\n- **`lib/agent-tracker.js:163-168`** — docstring \"Preserves...\" ↔ 구현은 wipe. (직접 검증 ✅)\r\n- **발견/추천 레이어 hollow** — `KNOWN_PLUGINS=[]`(죽은 레지스트리), 481세션 빈 메모리(`recordSkillUsage` 호출 0), context7/playwright `triggers:[]`, 추천 score=`keyword.length` 노이즈. **CLAUDE.md:51 '60+ known plugins'는 드리프트**(실제 [] 비어있음).\r\n- **`skills/cs/SKILL.md:100`** — 'Stop 훅이 결국 auto-commit' 암시 ↔ `stop.js`는 git 동작 0 (미구현 드리프트).\r\n- **설치 origin 불일치** — 설치 origin=`CreetaCorp/lens` vs 스크립트=`livevil7/creeta-lens` → `/lens-upgrade` origin교정 필요.\r\n- **`/cu` codex 오탐** — vscode 번들(0.137.0-alpha.4) vs GitHub stable(0.137.0) 비교로 '항상 update available'.\r\n- (stale 제안 정정) `hook-utils.js:65`는 이미 `isTTY` 가드 적용됨 — stdin-hang은 해결된 상태.\r\n\r\n---\r\n\r\n## 5. 이 감사와 `/cr` 기능의 관계\r\n\r\n이 Pass 1은 `/cr`(자가 현대화 감사 스킬)이 **주기적으로 자동 생성할 리포트의 양식**이다. `/cr`은 4개 입력축으로 이 리포트를 만든다:\r\n\r\n1. **공급-드리프트** — 라이브 네이티브 능력(probe+web) vs 레지스트리의 \"공백 가정\" → 노후도(KEEP/THIN/OBSOLETE)\r\n2. **공급-업그레이드** — 새 네이티브를 써서 기존 기능을 더 강하게 (§2)\r\n3. **편의(ergonomics)** — 사용자 워크플로 기준 마찰 제거 (§2의 ergonomics 행)\r\n4. **수요-마이닝** — 세션 대화 패턴 → net-new 제안 (§3)\r\n\r\n`/cr` 레지스트리(`docs/rules/capability-assumptions.json`)의 **시드**는 이 감사의 `registry_seed` 11행(네이티브 능력별 gap_closed_signal + signal_method=probe/web/both + false_obsolete_risk)으로 채운다. `.lens/conv-mining/audit-supply.json`·`audit-demand.json`에 전체 원자료 보존.\r\n\r\n**다음 단계:** `/cr` 기능 자체의 구현 계획은 `docs/tasks/2026-06-05-lens-capability-modernization-audit.md` 참조. §2 상위 항목(특히 #1 Codex review, #2 추천기 폐기, #9 자동커밋)은 `/cr`이 아니어도 즉시 착수 가능한 독립 업그레이드다.\r\n","truncated":false,"stale":true},{"id":"2026-05-30-codex-call-deep-fast-upgrade","folder":"history","title":"Codex 호출 업그레이드 — 깊게(xhigh) + 빠르게(priority) + drift/잔재 정리 — 완료","date":"2026-05-30","hasMd":true,"hasHtml":true,"mdPath":"history/2026-05-30-codex-call-deep-fast-upgrade.md","htmlPath":"history/2026-05-30-codex-call-deep-fast-upgrade.html","mdInline":"# Codex 호출 업그레이드 — 깊게(xhigh) + 빠르게(priority) + drift/잔재 정리 — 완료\r\n\r\n**완료일**: 2026-05-30\r\n\r\n## 요약\r\nlens가 codex를 부를 때 항상 가장 깊은 추론(`model_reasoning_effort=xhigh`)과 가능한 한 빠른 처리(`service_tier=priority`)로, 깨짐 없는 본문 수거(`-o`)로 호출하도록 표준 호출을 고정했다. 동시에 문서에 남아 있던 모델 drift(GPT-5.2 표기 → 실제는 gpt-5.5)와 취약한 텍스트 파싱(`^codex$`~`^tokens used$` awk 추출)·숫자 timeout 잔재(`timeout 30`)를 제거했다. 또한 `/cc`의 Claude 역할(Worker·Supervisor·QA)을 opus로 상향하고 Monitor만 haiku로 남겼다. SoT는 `docs/rules/codex-integration.md` 한 곳에서 고치고 `cp`/`cc` SKILL.md는 \"§N 참조\"로 통일했다.\r\n\r\n## 주요 결정 사항\r\n- **SoT 단일화 (Plan A)**: 호출 패턴·파싱·에러처리를 중앙 규칙 `codex-integration.md` 한 곳에서만 고치고, SKILL.md에 흩어진 직접 인용은 \"§4/§5 참조\"로 바꿨다. 외과적 변경 + 버전 전파는 `bump-version.sh`가 11곳을 일괄 처리하므로 수동 편집 대상이 아니다.\r\n- **깊이·속도 우선 (토큰 비용 비고려)**: 사용자 방침에 따라 `gpt-5.5` + `xhigh`(깊게) + `priority`(빠르게) + `-o`(깨짐 없는 수거)로 고정. priority는 부하 시 큐 우선권일 뿐 소규모 작업엔 무효과일 수 있다는 점을 문서에 명시해 \"빨라진다\"는 오해를 방지했다.\r\n- **숫자 timeout 폐기**: codex 호출은 background 병렬이라 느려도 기다리지 않는다. gate에서 ready면 수거, 아니면 degrade하고 Claude가 단독으로 끝까지 진행한다. 영원히 hang해도 Claude를 막지 않으며 세션 종료(Stop 훅)가 orphan을 정리하므로 숫자 timeout이 불필요하다.\r\n- **`-o` 파일명 race 방지**: Phase 0.5·2.4·4.5가 background 병렬이라 같은 임시 파일을 쓰면 덮어쓰기 위험이 있다. `/tmp/codex_<phase>_<무작위>.txt` 고유 파일명 컨벤션을 §5 표준으로 박았다.\r\n- **Claude 역할 모델 상향 (opus 우선)**: substantive 작업(Worker Easy/Medium/Hard, Supervisor, QA)은 전부 opus로 매핑. Monitor만 haiku로 남겼다 — 대시보드 상태 폴링만 하므로 opus의 품질 이득이 0인 유일 예외다.\r\n- **죽은 설명 강등**: `-o`로 본문만 받으면 §5의 \"원본 출력 예시\"가 추출에 더는 안 쓰이므로 삭제 대신 \"참고용 — 추출은 -o 권장\"으로 강등해 오해를 막았다.\r\n\r\n## 변경 파일\r\n- `docs/rules/codex-integration.md` — 중앙 규칙(SoT): §4 표준 호출에 `-m gpt-5.5 -c model_reasoning_effort=xhigh -c service_tier=priority -o` 추가, §5 파싱을 `-o` 본문 수거+고유 파일명 규칙으로 교체, §7 timeout 행/스니펫 제거, 모델 표기 5.2→5.5, 성능 표 갱신\r\n- `skills/cp/SKILL.md` — Phase 0.5/2.4/3.2의 codex 인용을 §4/§5 참조로 통일, timeout 어휘 제거\r\n- `skills/cc/SKILL.md` — Phase 4.5 codex 인용을 §4/§5 참조로 통일 + Model Assignment Table(한글·영문 2곳)·난이도 매핑·ASCII 다이어그램을 opus 상향에 맞게 갱신\r\n- `CHANGELOG.md` — v3.11.0 항목 추가\r\n- `CLAUDE.md` (creeta-lens) — Version feat 1줄 추가\r\n- (일괄) `plugin.json` / marketplace / hooks / SKILL.md 등 11곳 — `bump-version.sh 3.11.0`\r\n\r\n## 테스트 & 검증\r\n✅검증표 7개 항목 중 자동 판정 5개(#1·#2·#3·#6·#7) 전부 통과:\r\n- **#1** 표준 호출 라인에 `-m gpt-5.5` + `model_reasoning_effort=xhigh` + `service_tier=priority` + `-o` 모두 존재\r\n- **#2** 세 파일의 활성 코드에 취약 파싱(`tokens used`, `awk '/^codex/'`)·`timeout 30` 잔재 0건 (설명 텍스트 제외)\r\n- **#3** 세 파일에서 모델 지칭 `5.2` 0건 (Phase 번호와 무관)\r\n- **#6** `cc/SKILL.md`에서 Worker(Easy/Medium/Hard)·Supervisor·QA = opus, Monitor만 haiku로 표기\r\n- **#7** `cp/SKILL.md` Phase 3.1 pre-mortem이 기존대로 opus 유지(다운그레이드 없음)\r\n\r\n배포·설치 검증(#5)도 통과: commit `b7c195f` + tag `v3.11.0` push → livevil7/creeta-lens(= CreetaCorp/lens, 동일 레포), `scripts/upgrade.sh`로 캐시 3.11.0 설치 및 `plugin list` v3.11.0 확인.\r\n\r\ncodex 미응답 degrade(#4, manual)는 본 작업 진행 중 실증됐다: Phase 0.5 Codex 독립조사가 sandbox 정책으로 `codex exec --help` 차단 + 한글 출력 mojibake로 degrade했고, Claude가 `-o` 동작을 직접 실측 검증(최종 답변 본문만 파일로 떨굼 확인)하며 단독으로 작업을 완료했다 — 본 작업이 인코딩하려던 graceful degrade의 실증 사례다.\r\n\r\n## 추가 사항\r\n- **머신 간 전파**: `bump-version.sh`는 이 레포만 갱신한다. 이 PC는 Claude Code 재시작 후 3.11.0이 활성화되며(작업 당시 세션은 3.10.0 캐시), Mac Mini 등 다른 머신은 push 후 `/lens-upgrade`로 반영해야 한다. 검증 #5는 이 PC 한정이다.\r\n- **호환성 fallback (Plan B, 미발동)**: `service_tier=priority` 또는 `-o`가 다른 codex 빌드/계정에서 거부·부재면 부가분만 빼고 핵심(xhigh 깊이 + 모델 drift 제거)은 살리는 경로를 문서화했으나, 이 머신에서는 실호출 검증을 통과해 발동하지 않았다.\r\n- **후속 진화 (별도, 미완 아님)**: 이후 v3.19.0에서 `priority` → `service_tier=fast`, `xhigh` → 입력 규모 분기(소규모 xhigh / 대규모 high)로 진화했다. 이는 본 작업의 후속 진화이지 미완 항목이 아니다.\r\n","truncated":false,"stale":true},{"id":"2026-05-27-cps-start-here-and-cp-done-sweep","folder":"history","title":"/cps (START_HERE 생성기) + /cp done 기존 task 전수 정리 — 완료","date":"2026-05-27","hasMd":true,"hasHtml":true,"mdPath":"history/2026-05-27-cps-start-here-and-cp-done-sweep.md","htmlPath":"history/2026-05-27-cps-start-here-and-cp-done-sweep.html","mdInline":"# /cps (START_HERE 생성기) + /cp done 기존 task 전수 정리 — 완료\r\n\r\n**완료일**: 2026-05-27 (대상: v3.10.0 — 소스 반영 완료, git tag/push는 사용자 release 단계)\r\n\r\n## 요약\r\n\r\nlens에 신규 skill `/cps`를 추가했다. 어떤 레포든 `/cps` 한 번이면 실제 docs를 스캔해 `docs/START_HERE.md`(레포 first-read 진입점 + 질문 라우팅)를 생성/갱신한다. 함께 `/cp done`을 강화해, 새 task만이 아니라 `docs/tasks/`에 쌓인 기존 task까지 전수 재평가해 완료분을 일괄 아카이브 제안하도록 했다. (이 sweep으로 본 task와 방치 2건을 정리한 것이 첫 실사용.)\r\n\r\n## 주요 결정 사항\r\n\r\n- **SKILL.md-only + 강제 evidence step** (Plan A): 인터랙티브 스킬이라 Claude의 Glob/Read가 곧 ground-truth. Codex가 권한 결정론적 `lib/start-here-builder.js`는 허구 경로 재발 시의 Plan B로 격하 — Plan B 미발동(허구 경로 0).\r\n- **비파괴 게이트**: 기존 START_HERE는 diff+승인 후에만 갱신. CLAUDE.md 포인터는 없을 때만 1줄 조건부 주입(있으면 무변경, CLAUDE.md 신규 생성 안 함). docs/ 없으면 생성.\r\n- **허구 경로 0 원칙**: Glob 미확인 경로 나열 금지, 근거 부족은 `(Not documented yet)`.\r\n- **/cp done 강한 완료 신호**: 출시 기록(CHANGELOG/CLAUDE.md Version)이 확인되면 체크박스 미체크·재개포인트 잔존이어도 완료 추정으로 승격(최종 아카이브는 사용자 승인). 그 외 신호 상충 시 안전쪽(진행중/수동확인) 우선. 자동삭제 금지.\r\n- **surgical**: DONE 모드 Phase 1만 강화, Phase 2~4 불변.\r\n\r\n## 변경 파일\r\n\r\n- `skills/cps/SKILL.md` — 신규 (5단계 절차)\r\n- `skills/cp/SKILL.md` — DONE 모드 Phase 1 강화 (전수 재평가 3분류 + 강한 완료 신호)\r\n- `.claude-plugin/{plugin,marketplace}.json`, `hooks/`, `skills/{c,cc,cp,cs}/SKILL.md`, `CLAUDE.md`, `README.md`, `CHANGELOG.md` — v3.9.0 → v3.10.0 범프 (11곳) + /cps 문서화\r\n- `docs/START_HERE.md` — 신규 (dogfood 산출물)\r\n\r\n## 테스트 & 검증\r\n\r\n- /cc 병렬 실행 (Worker #1 opus: cps, Worker #2 sonnet: cp DONE). 품질 게이트 더블 검증: Supervisor iter1 FAIL(72) → iter2 PASS(88), Codex iter1 FAIL(7건) → iter2 PASS. Codex 단독 발견 2건(CLAUDE.md 모순, START_HERE 자기참조)이 이종 검증 가치 입증.\r\n- dogfood: `docs/START_HERE.md` 생성 → 나열 경로 16/16 실존(허구 0, `ls` 대조). CLAUDE.md 포인터는 이미 참조 존재로 skip. `/cp done` 분류 검증(2026-05-16 → 완료추정, 출시 기록 근거).\r\n- Goal 4/4 ✓.\r\n\r\n## 추가 사항\r\n\r\n- **남은 release (사용자)**: `git commit + tag v3.10.0 + push` → `/lens-upgrade` 후 라이브 `/cps`·강화된 `/cp done` 사용 가능. (현재 소스만 반영, 설치 캐시는 3.9.0)\r\n- dogfood에서 tie-break이 출시된 옛 task를 완료추정에서 빼는 문제를 발견 → 사용자 결정으로 \"출시 기록=강한 완료 신호\" 예외 추가.\r\n- 계획 문서(Plan A/B + 듀얼 합성 + Pre-mortem): 이 history의 원본 task.\r\n","truncated":false,"stale":true},{"id":"2026-05-26-goal-human-centric-codex-dual-verification","folder":"history","title":"사람 중심 Goal 2층 구조 + Codex 듀얼 검증 — 완료","date":"2026-05-26","hasMd":true,"hasHtml":true,"mdPath":"history/2026-05-26-goal-human-centric-codex-dual-verification.md","htmlPath":"history/2026-05-26-goal-human-centric-codex-dual-verification.html","mdInline":"---\r\nname: goal-human-centric-codex-dual-verification\r\nplan_id: 2026-05-26-goal-human-centric-codex-dual-verification\r\ndescription: Lens v3.8.0+v3.9.0 — 사람 중심 Goal 2층 구조 + Codex 공동 조사·더블 검증 (한 릴리스로 배포) 완료\r\nstatus: done\r\ncompleted: 2026-05-26\r\n---\r\n\r\n# 사람 중심 Goal 2층 구조 + Codex 듀얼 검증 — 완료\r\n\r\n**완료일**: 2026-05-26 · **릴리스**: v3.9.0 (v3.8.0 작업 포함, 별도 릴리스 없이 묶음)\r\n\r\n## 요약\r\n\r\n`/cp` 의 Goal 을 **사람 중심 2층 구조**로 재설계하고(v3.8.0), Codex 를 \"Claude 결과의 부분 검토자\"에서 **공동 조사자·공동 검증자**로 격상(v3.9.0)했다. 두 작업은 한 세션에서 연속 진행되어 **v3.9.0 한 릴리스**로 묶여 배포됐고, `/lens-upgrade` 로 이 PC 설치본(3.6.5 → 3.9.0)까지 반영했다.\r\n\r\n- **v3.8.0**: Goal 문장에서 개발 검증어(`201`·`user row` 등)를 추방하고, 🎯 목표=\"무엇이 가능해지는가\"(사람 언어)와 ✅ 검증=\"이게 됐다는 증거\"(기계 언어)로 2층 분리. 기존엔 사용자가 자기 계획서를 읽고도 함수·HTTP 코드 때문에 판단할 수 없던 문제 해결.\r\n- **v3.9.0**: `/cp` 는 Claude‖Codex 병렬 독립 조사(Phase 0.5) + 합성·교차검증(Phase 2.4), `/cc` 는 매 반복 Codex 코드리뷰 게이트(Phase 4.5)로 모든 코드 변경을 이종 모델 더블 검증.\r\n\r\n## 주요 결정 사항\r\n\r\n- **Goal=사람 언어, 검증=기계 언어 (2층 완전 분리)** — 사용자 명시 요청(\"무슨 함수가 어쩌고 하면 내가 알아듣겠어?\"). 기술 토큰은 목표 문장에서 reject → ✅검증 표로 강제 이동. 이 매핑이 게이트가 됨: \"사람 목표 → 검증 ≥1행\" 매핑 안 되면 = 모호 = reject.\r\n- **검증어는 검증 표에만** (사용자 선택) — Goal 옆 괄호 병기·완전 제거 대신 \"검증 표에만 남긴다\" 선택. Goal 문장은 100% 사람 언어.\r\n- **더블 검증은 항상(trivial만 skip)** (사용자 선택) — 비용·속도보다 안전망 우선. trivial(오타·한 줄)·비-코드는 skip, Codex 부재/실패는 graceful degrade(블로킹 금지).\r\n- **/cc 형태 = Claude 구현 → Codex 리뷰 게이트** (사용자 선택) — 독립 구현 후 병합(머지 충돌·비용 큼) 대신 리뷰 루프. Supervisor pass + Codex pass 둘 다여야 진행.\r\n- **/cp 분기 = Claude가 근거와 함께 선택·기록** (사용자 선택) — 객관 판정 불가한 분기는 trade-off 근거와 함께 Claude가 결정하고 `🔀 듀얼 합성` 섹션에 기록(사용자가 승인 게이트에서 확인).\r\n- **plan-manager.js 전면 동기화** (사용자 선택) — 런타임은 SKILL.md 기반(코드 생성기는 백업)이지만, 백업 생성기·extractGoal·8-lang dict 까지 신구조로 일치시켜 latent drift 제거.\r\n- **Pre-mortem 중복 호출 회피** — Phase 0.5 에서 Codex 조사가 돌면 Phase 3 Codex 호출 skip(quota 절약), Opus 단독으로 통합안 점검.\r\n- **산출물 링크 풀 경로 강제** (사용자 요청) — 보고 시 bare 파일명 금지, 프로젝트 루트 기준 전체 경로 클릭 링크.\r\n- **v3.8.0 별도 릴리스 안 함** — 미커밋 상태에서 v3.9.0 작업이 이어져, 두 기능셋을 v3.9.0 한 커밋·태그로 묶음. CHANGELOG 는 [3.8.0]·[3.9.0] 항목 분리 유지.\r\n\r\n## 변경 파일 (commit `b27b2a6`, 13개)\r\n\r\n- **스킬**: `skills/cp/SKILL.md` (Phase 0 2층·0.0 인터뷰·0.2 서브골·0.5 Codex 조사·2.4 듀얼 합성·2.5 템플릿·5.0 게이트·핸드오프·절대규칙), `skills/cc/SKILL.md` (핸드오프 4칼럼·Phase 4.5 Codex 리뷰·Phase 5 더블 게이트·QA auto/manual·절대규칙)\r\n- **라이브러리**: `lib/plan-manager.js` (8-lang dict·generatePlanContent 2층+종류 칼럼·extractGoal 다국어·dualSynthesis 렌더링·JSDoc)\r\n- **규칙 문서**: `docs/rules/codex-integration.md` (사용지점 4곳·§8.5 듀얼 검증 호출 패턴)\r\n- **manifest/문서**: `.claude-plugin/plugin.json`·`marketplace.json`, `CLAUDE.md`, `CHANGELOG.md`, `README.md`, `hooks/hooks.json`·`session-start.js`, `skills/c|cs/SKILL.md`  + \"Convert to HTML\" 버튼(Claude 재생성 요청)으로 보여준다. `docs/reports/` 중간단계는 폐지(비파괴).\r\n\r\n## 주요 결정 사항\r\n\r\n- **전환 버튼 = Claude 재생성 요청**: 정적 `file://`는 폴더 읽기·Claude 호출·파일 쓰기가 모두 불가하므로, 버튼은 `/cp html docs/<경로>` 명령을 클립보드에 복사하고 사용자가 Claude Code에 붙여넣어 실행한다. 슬라이드 데크 품질은 Claude 재구성으로만 가능.\r\n- **전면 재설계 + 비파괴**: `reports/` 폐지, 3폴더 직접 인덱싱. 단 기존 `reports/`·`board.html`은 삭제하지 않음(다른 repo 호환).\r\n- **보드 기본 생성**(opt-in 해제), 파일명 `board_<repo>.html`.\r\n- **XSS 차단 = escape + `textContent`만**: md를 절대 `innerHTML`/파싱하지 않음 → 마크다운 라이브러리 불필요(단순성).\r\n- **디자인**: 초기 다크/사이드바 버전을 사용자가 반려 → `livevil-contents`의 기준 보드(라이트·3열 카드·slide-over)를 명시적 베이스로 클론. Rules 열은 보라 액센트로 \"참조 문서\" 구분.\r\n\r\n## 변경 파일\r\n\r\n- `lib/board-builder.js` — schema v3 재작성(3폴더 스캔, md inline·40KB 캡·stale 해시) + `$` replace 버그 픽스(함수 치환)\r\n- `templates/board.template.html` — 라이트 3열 + slide-over + 전환버튼/실패 모달\r\n- `skills/cp/SKILL.md` — CONVERT 모드(`/cp html`) 신설 + PLAN/DONE html 위치(reports/→폴더 옆) + 보드 기본 생성\r\n- `templates/report-conversion-spec.md` — `../_shared.css` + beside-md 위치\r\n- `lens.config.json` — `buildBoard: true`\r\n- `.claude-plugin/{plugin,marketplace}.json`, `CLAUDE.md`, `README.md`, `CHANGELOG.md` — v3.6.0\r\n\r\n## 테스트 & 검증\r\n\r\n- `node lib/board-builder.js` → `19 docs (tasks=3 history=11 rules=5)` 콘솔 출력\r\n- 브라우저(localhost http) 검증: 라이트 3열 카드 그리드, html 클릭→슬라이드 데크 iframe, md-only 클릭→원본+Convert 버튼(클립보드 토스트 `/cp html docs/...`), 콘솔 에러 0\r\n- XSS 픽스처(`<script>`, `<\/script>` breakout) → 보드 내 raw `<\/script>`=1(보드 자체뿐), 픽스처는 `<\\/` escape + textContent로 미실행 확인\r\n- **버그 발견·수정**: `tpl.replace('{{BOARD_DATA}}', payload)`가 md의 `` $` ``(codex-integration.md)를 replace 특수패턴으로 해석 → 템플릿 누출로 JSON 깨짐(콘솔 `Invalid or unexpected token`). 함수 치환 `() => payload`로 픽스. 브라우저 검증이 아니었으면 못 잡았을 통합 버그.\r\n- 배포: commit `c48fcf8` + tag `v3.6.0` → `origin(livevil7/creeta-lens)` push → `/lens-upgrade` exit 0 → `claude plugin list` = **v3.6.0**\r\n\r\n## 추가 사항\r\n\r\n- 새 스킬은 **Claude Code 재시작** 후 로드됨(현 세션은 v3.5.0 스킬로 동작 중에 작업).\r\n- 캐시 `3.
