<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lens — Documentation Board</title>
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">

<style>
/* ════ Light design tokens ════ */
:root {
  --bg: #fafafa;
  --card: #ffffff;
  --fg: #18181b;
  --fg-2: #3f3f46;
  --fg-mute: #71717a;
  --line: #e4e4e7;
  --line-soft: #f1f1f3;
  --accent: #2563eb;
  --accent-soft: rgba(37, 99, 235, 0.08);
  --warn: #b91c1c;
  --stale: #b45309;
  --stale-soft: rgba(180, 83, 9, 0.12);
  --good: #16a34a;
  --rules: #7c3aed;
  --rules-soft: rgba(124, 58, 237, 0.10);
}

* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
html, body { margin: 0; padding: 0; min-height: 100%; background: var(--bg); color: var(--fg); }

body {
  font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.55;
  font-feature-settings: "tnum";
}

::selection { background: var(--accent-soft); }

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

button {
  font: inherit; cursor: pointer;
  background: var(--card); color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 6px 12px;
  letter-spacing: -0.005em;
  transition: border-color 120ms, background 120ms, color 120ms;
}
button:hover { border-color: var(--fg-mute); }
button:active { transform: translateY(1px); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500; }
button.primary:hover { background: #1d4fd4; border-color: #1d4fd4; }
button.ghost { border-color: transparent; color: var(--fg-mute); }
button.ghost:hover { color: var(--fg); background: var(--line-soft); }

code, .mono {
  font-family: "Pretendard Variable", monospace;
  font-variant-numeric: tabular-nums;
}
code {
  font-size: 0.92em;
  background: var(--line-soft);
  padding: 1px 5px;
  border-radius: 3px;
  color: var(--accent);
}

/* ════ Top bar ════ */
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: rgba(250, 250, 250, 0.9);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  padding: 12px 24px;
  display: flex; align-items: center; gap: 16px;
}
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand .repo { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
.brand .repo .dim { color: var(--fg-mute); font-weight: 400; }
.brand .title { font-size: 12px; color: var(--fg-mute); }

.topbar .grow { flex: 1; }
.topbar .stats {
  display: flex; gap: 14px;
  font-size: 11px; color: var(--fg-mute);
  font-variant-numeric: tabular-nums;
}
.topbar .stats b { color: var(--fg); font-weight: 500; }
.topbar .stats .sep { color: var(--line); }

.search input {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 6px 12px;
  width: 240px;
  font: inherit;
  color: var(--fg);
}
.search input:focus { outline: none; border-color: var(--accent); }

/* ════ Board grid ════ */
.board {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  padding: 12px;
  min-height: calc(100vh - 53px);
}
.column {
  display: flex; flex-direction: column;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 6px;
  min-width: 0;
}
.col-head {
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
}
.col-head .label {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-mute);
  font-weight: 500;
}
.col-head .label .pip { width: 6px; height: 6px; border-radius: 50%; }
.column[data-column="tasks"]   .pip { background: var(--accent); }
.column[data-column="history"] .pip { background: var(--good); }
.column[data-column="rules"]   .pip { background: var(--rules); }
/* Rules column reads as "reference docs" — muted purple header accent. */
.column[data-column="rules"] .col-head { background: var(--rules-soft); }
.column[data-column="rules"] .col-head .label { color: var(--rules); }
.col-head .count {
  font-size: 11px;
  color: var(--fg-mute);
  font-variant-numeric: tabular-nums;
}

.cards {
  flex: 1;
  overflow-y: auto;
  display: flex; flex-direction: column;
  gap: 8px;
  padding: 10px;
}

/* ════ Card ════ */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 14px 16px;
  cursor: pointer;
  user-select: none;
  transition: border-color 120ms;
}
.card:hover { border-color: var(--fg-mute); }

.card h3.tt {
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: -0.01em;
  margin: 0;
  color: var(--fg);
  text-wrap: balance;
  word-break: break-word;
}

.card .meta-row {
  display: flex; flex-wrap: wrap; gap: 7px; align-items: center;
  margin-top: 9px;
  font-size: 11px;
  color: var(--fg-mute);
  font-variant-numeric: tabular-nums;
}
.card .meta-row .date { color: var(--fg-mute); }
.badge {
  font-size: 9.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 1.5px 6px;
  border-radius: 3px;
  font-weight: 600;
  line-height: 1.6;
}
.badge.html  { background: var(--accent-soft); color: var(--accent); }
.badge.md    { background: var(--line-soft); color: var(--fg-mute); }
.badge.stale { background: var(--stale-soft); color: var(--stale); }

.empty {
  padding: 32px 16px;
  text-align: center;
  color: var(--fg-mute);
  font-size: 12px;
  font-style: italic;
}

/* ════ Slide-over panel (cloned from reference) ════ */
.scrim {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(24, 24, 27, 0.4);
  opacity: 0; pointer-events: none;
  transition: opacity 200ms;
}
.scrim.open { opacity: 1; pointer-events: auto; }

.panel {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(860px, 62vw);
  background: var(--bg);
  border-left: 1px solid var(--line);
  z-index: 100;
  transform: translateX(100%);
  transition: transform 240ms cubic-bezier(0.22, 1, 0.36, 1);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.panel.open { transform: translateX(0); }

.panel header {
  padding: 18px 28px 14px;
  border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: flex-start; gap: 14px;
  background: var(--card);
}
.panel header .info { min-width: 0; }
.panel header .id-row {
  font-size: 11px;
  color: var(--fg-mute);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
  margin-bottom: 4px;
}
.panel header h2 {
  margin: 0;
  font-size: 22px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--fg);
  text-wrap: balance;
  max-width: 56ch;
  word-break: break-word;
}
.panel header .top-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }

.panel .notes {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  padding: 10px 28px;
  font-size: 11.5px;
  border-bottom: 1px solid var(--line);
  background: var(--card);
}
.panel .notes:empty { display: none; }
.panel .notes .trunc { color: var(--warn); }
.panel .notes .trunc a { color: var(--warn); text-decoration: underline; }

.panel .scroll { flex: 1; overflow: hidden; position: relative; }

.report-frame {
  width: 100%; height: 100%;
  border: 0; display: block;
  background: #fff;
}

.md-scroll { width: 100%; height: 100%; overflow: auto; }
.md-pre {
  margin: 0;
  padding: 24px 28px 48px;
  font-family: "Pretendard Variable", ui-monospace, monospace;
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--fg-2);
  white-space: pre-wrap;
  word-break: break-word;
  tab-size: 2;
}

/* ════ Toast ════ */
.toast {
  position: fixed;
  bottom: 24px; left: 50%; transform: translateX(-50%) translateY(12px);
  background: var(--fg);
  color: var(--card);
  border-radius: 4px;
  padding: 11px 18px;
  font-size: 12.5px;
  line-height: 1.5;
  z-index: 300;
  opacity: 0;
  transition: all 200ms;
  pointer-events: none;
  max-width: 520px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
}
.toast .cmd {
  font-family: "Pretendard Variable", ui-monospace, monospace;
  font-size: 11.5px;
  color: #93c5fd;
  word-break: break-all;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ════ Modal (clipboard fallback) ════ */
.modal-scrim {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(24, 24, 27, 0.45);
  display: none;
  align-items: center; justify-content: center;
  padding: 24px;
}
.modal-scrim.open { display: flex; }
.modal {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 22px 24px 20px;
  width: min(560px, 100%);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
}
.modal h3 {
  margin: 0 0 6px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.modal p {
  margin: 0 0 14px;
  font-size: 12.5px;
  color: var(--fg-mute);
  line-height: 1.55;
}
.modal textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 10px 12px;
  color: var(--fg);
  font-family: "Pretendard Variable", ui-monospace, monospace;
  font-size: 12.5px;
  resize: none;
  min-height: 64px;
}
.modal textarea:focus { outline: none; border-color: var(--accent); }
.modal .modal-actions {
  display: flex; justify-content: flex-end; gap: 8px;
  margin-top: 16px;
}

/* ════ Print ════ */
@media print {
  .topbar, .scrim, .toast, .modal-scrim { display: none !important; }
  .panel { position: static; transform: none; width: 100%; }
  body { background: #fff; }
}

/* ════ Responsive ════ */
@media (max-width: 980px) {
  .board { grid-template-columns: 1fr; }
  .panel { width: 100vw; }
  .topbar { flex-wrap: wrap; }
  .search input { width: 180px; }
}
</style>
</head>

    <div class="modal-actions">
      <button class="primary" id="modal-close">Done</button>
    </div>
  </div>
</div>

  const BOARD = {"schemaVersion":3,"repo":"creeta-lens","generatedAt":"2026-07-15T03:27:56.895Z","groups":{"tasks":[{"id":"2026-07-15-dynamic-top-model-policy","folder":"tasks","title":"Lens 모델 정책 전환 — 고정 모델명 폐지, \"항상 그 시점의 최고 모델\" 자동 추종","date":"2026-07-15","hasMd":true,"hasHtml":true,"mdPath":"tasks/2026-07-15-dynamic-top-model-policy.md","htmlPath":"tasks/2026-07-15-dynamic-top-model-policy.html","mdInline":"---\ntitle: Lens 모델 정책 전환 — 고정 모델명 폐지, \"항상 그 시점의 최고 모델\" 자동 추종\ndate: 2026-07-15\nplanner: cp\ngrade: standard\nstatus: in-progress\nrefs: [docs/rules/codex-integration.md, docs/rules/harness-rules.md, docs/rules/capability-assumptions.json]\n---\n\n# Lens 모델 정책 전환 — 고정 모델명 폐지, \"항상 그 시점의 최고 모델\" 자동 추종\n\n## 🎯 What — 목표 (무엇이 가능해지는가)\n\n**이 작업이 끝나면 가능해지는 것:**\n\n- Lens가 부리는 모든 일꾼(계획 조사·코드 작성·검토·품질 검증)이 **업무 난이도에 맞는 등급의 모델**로 일하되, **가장 어려운 업무는 항상 그 시점의 가장 똑똑한 모델**이 맡는다. 새 AI 모델이 출시되어도 **문서를 사람이 고치지 않아도** 이 배분이 자동으로 따라간다.\n- 오늘 기준으로는: 어려운 업무(설계·검토·검증)는 **Fable**(현재 1등)이, 중간 업무(코드 작성·분석)는 중간 모델이, 단순 업무(파일 읽기·상태 확인)는 경량 모델이 맡고, codex 검증 파트너는 **GPT-5.6-Sol**(현재 1등)로 실행된다. 지금은 최고 난이도 자리에 한 세대 전 모델(opus, gpt-5.5)이 이름으로 못박혀 있어 그보다 낮은 두뇌로 돌고 있다.\n- ⚠️ 사용자 정정 반영 (2026-07-15 Modify): \"최고 모델을 전 역할에 무차별 배정\"이 아니다 — **난이도별 배분이 원칙**이고, 사다리의 각 칸이 모델 세대와 함께 자동으로 올라가는 것이 이 작업의 본질이다.\n\n**완료의 정의 (Done = ?):**\n\n> 이 컴퓨터에서 Lens의 계획·실행·검증이 문서 수정 없이 난이도별 적정 모델(최고 난이도 = Fable, codex = GPT-5.6-Sol, 단순 업무 = 경량 모델)로 도는 것이 실제 실행으로 확인되고, 다음 세대 모델이 나와도 같은 배분 규칙이 자동 적용된다는 것이 새 버전(v3.24.0)으로 출시되어 있다.\n\n## ❓ Why — 왜 해야 하는가 (6하원칙)\n\n- **왜 지금**: 2026년 7월 현재 상위 모델 Fable(Claude 계열)과 GPT-5.6-Sol(OpenAI 계열)이 이미 출시되어 있는데, Lens의 지시문에는 한 세대 전 모델 이름(opus, gpt-5.5)이 못박혀 있다. gpt-5.5는 codex의 모델 순위표에서 이미 **7위까지 밀려난 상태**다. 즉 Lens의 모든 품질 검증이 지금 이 순간에도 한 단계 낮은 두뇌로 돌고 있다.\n- **무엇을**: 못박힌 모델 이름을 \"난이도별 모델 사다리\" 규칙으로 교체한다 — 사다리의 각 칸(경량/중간/최상위)은 이름이 아니라 상대 위치라서 모델 세대가 바뀌면 자동으로 올라가고, **최고 난이도 칸은 항상 그 시점의 1등 모델**이 된다.\n- **어떻게**: Claude 쪽은 \"난이도 사다리(Easy=경량/Medium=중간/Hard=최상위) + 최상위 칸은 세션 물려받기 우선\" 규칙으로, codex 쪽은 컴퓨터에 저장된 모델 순위표에서 1등을 자동으로 골라주는 한 줄짜리 자동 선택기(resolver)로 — codex는 이종 검증 파트너라 모델은 1등 고정이고 난이도는 추론 깊이 다이얼(소규모 xhigh/대규모 high, 기존 규칙)로 배분한다. (상세는 🛠 How)\n- **누구를 위해**: Lens를 쓰는 모든 작업 — 이 사용자의 전 프로젝트에서 이뤄지는 계획·실행·검증의 품질.\n- **어디서**: creeta-lens 리포를 고쳐 새 버전으로 출시 → 이 컴퓨터부터 적용, 다른 컴퓨터는 각자 업데이트 시 적용.\n- **안 하면**: 모델 세대가 바뀔 때마다 이번 같은 수동 개정 작업을 반복해야 하고, 누군가 알아차리고 고치기 전까지는 낮은 품질의 모델로 검증이 돈다. 이번에도 gpt-5.5가 7위로 밀릴 때까지 아무도 몰랐다.\n\n## 📖 용어 풀이 (운영자용 — 이 문서를 읽는 데 필요한 개념)\n\n| 용어 | 쉬운 설명 |\n|------|-----------|\n| **모델** | AI의 두뇌 등급. 높은 모델일수록 더 깊게 생각한다. Claude 계열은 haiku < sonnet < opus < **fable** 순, OpenAI 계열은 현재 **gpt-5.6-sol**이 1등. |\n| **하드코딩** | 문서나 프로그램에 이름을 \"못박아\" 둔 것. 세상이 바뀌어도 못박은 값은 스스로 안 바뀐다. |\n| **세션 모델** | 사용자가 지금 Claude Code를 켤 때 고른 모델. 이 사용자는 항상 최신 최고 모델로 켠다. |\n| **상속(물려받기)** | Lens가 일꾼을 띄울 때 모델을 따로 지정하지 않으면, 일꾼이 세션 모델을 그대로 물려받는 것. 세션이 1등 모델이면 일꾼도 자동으로 1등. |\n| **Task tool enum** | Claude가 부하 일꾼을 띄울 때 고를 수 있는 두뇌 목록. Claude Code 프로그램이 관리하며, 새 모델이 나오면 목록에 자동으로 추가된다. 현재: sonnet, opus, haiku, **fable**. |\n| **모델 순위표 (models_cache.json)** | codex 프로그램이 각 컴퓨터에 저장해 두는 \"지금 쓸 수 있는 모델 목록 + 순위\" 파일. OpenAI가 새 모델을 내면 이 파일이 자동 갱신된다. 실측: 1위 gpt-5.6-sol, 2위 gpt-5.6-terra, 3위 gpt-5.6-luna, 7위 gpt-5.5. |\n| **resolver(자동 선택기)** | 순위표에서 1등을 자동으로 골라주는 한 줄짜리 명령. 사람이 이름을 알 필요가 없다. |\n| **fallback(2안)** | 1안이 실패했을 때 자동으로 넘어가는 예비 경로. |\n| **marketplace 태그** | Lens 새 버전을 출시할 때 git에 붙이는 버전 꼬리표. **꼬리표를 안 올리면 다른 컴퓨터가 옛 버전을 설치**한다 (과거 실제 사고 이력 있음). |\n\n## 🧰 실행 전략 & 자원\n\n- **난이도**: medium — 파일 9개, 수정 지점 약 45곳 + 출시 절차. 단, 새로 만드는 로직은 자동 선택기 한 줄뿐이고 나머지는 지시문 텍스트 교체라 위험도는 낮은 편.\n- **권장 모델**: 이 세션(Fable)이 직접 실행. 계획 승인 후 /cc 핸드오프 시에도 새 규칙(최상위 상속) 그대로 적용됨.\n- **병렬 실행**: 파일 수정은 순차 (스킬 문서끼리 서로를 참조하므로 일관성 유지가 우선). 검증 7건 중 5건은 병렬 실행 가능. Pre-mortem은 ultracode 워크플로로 4명의 회의론자(skeptic)를 병렬 배포해 계획의 허점을 공격시킴.\n- **활용 도구**: node (Lens가 이미 board-builder로 의존 — 추가 설치 불필요), git, codex CLI. Playwright 불필요 (화면 작업 아님).\n  - ⚠️ 자동 선택기를 python으로 짜면 안 되는 이유: Windows에서 `python3` 명령은 Microsoft Store 안내 프로그램(가짜)이 가로채는 함정이 있다(실측 이력). node는 Lens가 이미 쓰고 있어 안전.\n- **기존 자원 재사용**:\n  - `scripts/bump-version.sh` — 버전 번호를 **14곳**에 일괄 갱신하는 출시 스크립트 (스크립트 직접 확인 실측 — 메모리의 \"11곳\"은 낡은 정보).\n  - `lib/board-builder.js` — 작업 보드 HTML 재생성.\n  - `docs/rules/capability-assumptions.json` + `/crv` 감사 — Lens가 스스로 낡은 부분을 감지하는 기존 체계. 여기에 \"모델 순위표 감시\"를 추가해 미래 드리프트를 자동 감지.\n  - `docs/rules/codex-integration.md`의 기존 400-fallback 설계 (모델 이름이 서버에서 거부되면 이름 없이 재시도) — 폐기하지 않고 유지.\n\n## 🛠 How — 어떻게 (Plan A / Plan B)\n\n### Plan A — 권장 경로\n\n#### 설계 원칙 (왜 이 방식이 1순위인가)\n\n1. **이름을 지우고 규칙을 남긴다.** \"opus를 써라\"(이름)가 아니라 \"목록의 1등을 써라\"(규칙)로 바꾸면, 목록은 Claude Code와 codex 프로그램이 알아서 갱신하므로 Lens는 영원히 고칠 필요가 없다.\n2. **Claude 쪽 — 난이도 사다리 + TOP 규칙 (사용자 Modify 반영 2026-07-15)**:\n   - **배분의 원칙은 업무 난이도다.** 최고 모델을 전 역할에 무차별 배정하지 않는다 (사용자 공식 지시 — 기존 /cc의 \"품질 우선, 토큰 비용 비고려로 전부 opus\" 철학은 이번에 폐기).\n   - **난이도 사다리 (각 칸은 이름이 아니라 상대 위치 — 모델 세대와 함께 자동 상승)**:\n     - **Easy** (파일 읽기·검색·자료 수집·단순 수정·상태 확인) = **경량 티어** (현재 haiku)\n     - **Medium** (코드 작성·분석·디버깅·콘텐츠 작성) = **중간 티어** (현재 sonnet)\n     - **Hard** (설계·복잡한 리팩토링·보안·계획·심층 검토·적대적 검증) = **최상위 티어 = TOP**\n   - **TOP의 판정 절차**: 세션 모델이 두뇌 목록(Task tool enum) 최상위와 같거나 상위(예: Fable)면 **모델 지정 생략(상속)**, 미만이면 **목록 최상위를 명시 지정** (현재 fable, 목록에 없으면 opus). 미래에 낯선 이름의 새 모델이 나와 우열 판별이 안 될 때는 상속이 안전 기본값.\n   - **Supervisor·QA는 \"최고 사용 티어와 동급\"**: TOP worker가 하나라도 있으면 Supervisor/QA도 TOP — \"주니어가 시니어 코드를 리뷰\"하는 역전 방지 (기존 /c의 승격 로직을 /cc에도 일반화). Monitor는 항상 haiku (단순 폴링 — 상위 모델 품질 이득 0, 실측 근거 기존 문서에 있음).\n   - 이 사다리로 /c(기존 경제 티어제)와 /cc(기존 전부-opus)가 **동일 규칙으로 통일**된다. harness-rules.md §4.1의 상속 조항은 Hard 티어의 기본 경로로 승격.\n3. **Codex 쪽 — 순위표 1등 자동 선택 (resolver, Pre-mortem 반영 강화판)**: 매 호출 직전에 컴퓨터의 모델 순위표에서 1등을 뽑아 `-m`으로 전달. **빈 값이 `-m \"\"`으로 흘러들어가지 않도록** 인자를 분기한다 (Pre-mortem blocker 2건의 해소책).\n   ```bash\n   CODEX_MODEL=$(node -e \"const p=require('path'),os=require('os');const d=require(p.join(os.homedir(),'.codex','models_cache.json'));const m=d.models.filter(x=>x.visibility==='list'&&x.supported_in_api!==false).sort((a,b)=>(a.priority??99)-(b.priority??99))[0];if(!m||!m.slug)process.exit(1);console.log(m.slug)\" 2>/dev/null) || CODEX_MODEL=\"\"\n   MODEL_ARG=(); if [ -n \"$CODEX_MODEL\" ]; then MODEL_ARG=(-m \"$CODEX_MODEL\"); else echo \"⚠️ 모델 resolver 실패 — codex config 기본 모델로 진행\"; fi\n   timeout 180 codex exec ... \"${MODEL_ARG[@]}\" ...   # 400 거부 시 → MODEL_ARG 비우고 1회 재시도 (기존 fallback 유지)\n   ```\n   - 강화 포인트 (Pre-mortem 27건 중 runtime 렌즈 반영): ① `path.join` — OS 무관 경로 정규화. ② `if(!m||!m.slug)process.exit(1)` — 빈 배열이면 명시적 실패 (TypeError로 비결정 종료 금지). ③ `|| CODEX_MODEL=\"\"` — 실패 시 항상 빈 값으로 확정. ④ `MODEL_ARG` 배열 분기 — 빈 값이 `-m \"\"`으로 전달되는 사고 원천 차단. ⑤ 플래그 echo가 스킬 실행 대화에 남아 결과 보고에 그대로 복사됨 (기록 위치 = codex 호출 직후 stdout → 각 스킬의 결과 문서/보고 상단에 복사 의무).\n   - 실측 완료 (2026-07-15, 이 컴퓨터): 성공 경로 → `gpt-5.6-sol` 반환 + 실호출 EXIT 0 (\"SOL-OK\") + `service_tier=fast` 통과. 실패 경로(파일 부재 모사) → 빈 값 + 플래그 경로 정상 작동.\n   - `supported_in_api` 필터는 Codex 듀얼트랙 조사가 제안한 것을 채택 (API로 못 쓰는 모델이 뽑히는 사고 방지).\n4. **조용한 강등 금지**: fallback으로 낮은 모델/기본 모델로 넘어가면 반드시 결과 문서에 \"⚠️ 모델 resolver 실패 — config 기본 모델로 진행\" 플래그를 남긴다. (Codex 조사가 지적한 \"몰래 낮은 모델로 도는\" 위험을 플래그 의무로 해소.)\n5. **깊이 다이얼은 안 건드린다**: 기존 규칙(소규모 xhigh / 대규모 high + timeout 180초)은 그대로 유효 — gpt-5.6-sol도 xhigh/high 단계를 동일하게 지원함을 실측 확인. (신설된 max/ultra 단계는 이번 범위 밖 — 후속 검토 과제.)\n6. **과거 기록은 안 고친다**: docs/history/, CHANGELOG.md의 과거 항목, CLAUDE.md 버전 히스토리, \"실측(gpt-5.5)\" 같은 측정 출처 표기는 역사적 사실이므로 그대로 둔다. 고치는 건 \"앞으로 이렇게 하라\"는 지시문만.\n\n#### 단계 (수정 지점 전량 — 파일별 inline)\n\n**[A] docs/rules/codex-integration.md — codex 호출 규칙의 원본(SoT), 7개 지점**\n\n- [ ] A1. 9행: \"(이 확장 빌드가 노출하는 모델: `gpt-5.5`)\" → \"(모델은 머신의 모델 순위표에서 최상위를 자동 선택 — §4 resolver)\"\n- [ ] A2. §4 표준 호출 블록(75~78행): 호출 앞에 위 resolver 한 줄 추가 + `-m gpt-5.5`를 `-m \"$CODEX_MODEL\"`로 교체. resolver 실패 시 `-m` 생략 + 플래그 규칙 명기.\n- [ ] A3. 91행: \"`-m gpt-5.5` — 모델 명시 고정. config 기본값에 의존하지 않고…\" → \"`-m \"$CODEX_MODEL\"` — 순위표 1등 동적 지정. 특정 이름에 의존하지 않으며, 데스크톱 앱에서 사용자가 바꾼 config 기본값에도 의존하지 않는다.\"\n- [ ] A4. §6(114~116행) fallback 규칙: 기존 \"4 "(상속)\"으로 교체.\n\n### 🔀 듀얼 합성 (Claude ‖ Codex gpt-5.6-sol — P0.5 병렬 독립 조사)\n\n**합의 (고신뢰 — 그대로 채택):**\n- 순위표(models_cache.json)에서 visibility=list 중 priority 최소를 뽑는 resolver 방식 — 양측 동일 결론. Codex의 `supported_in_api` 필터 추가 제안 채택.\n- 구모델명 정적 스윕(grep 0건 확인) + 실제 Task=fable·codex=gpt-5.6-sol 실행 통합시험 + capability-assumptions·릴리즈 버전 갱신 — 양측 동일.\n- 대상 파일: skills 5종(c/cc/ccp/cp/cpp) + rules 3종 + bump-version.sh — 거의 일치.\n\n**분기 → 해소 (4건):**\n1. **새 rule 문서(model-selection.md) 신설**(Codex) vs **기존 문서 확장**(Claude) → **기존 확장 채택**. 근거: 스킬이 실행 중 읽는 텍스트는 자기 SKILL.md뿐이고, codex 호출의 SoT는 이미 codex-integration.md로 확립돼 있다. 새 문서를 만들면 SoT가 분산되고 스킬은 어차피 그걸 안 읽는다.\n2. **`-m` 생략 fallback 폐기, 실패 시 중단(fail-closed)**(Codex) vs **fallback 유지**(Claude) → **유지 + 강등 플래그 의무** 절충. 근거: \"이종검증이 조용히 죽는 대신 기본값으로라도 돈다\"는 graceful degrade가 Lens의 확립 원칙(§7)이고, 순위표 파일이 없는 컴퓨터(데스크톱 앱 없이 CLI만 있는 서버)가 존재할 수 있다. Codex가 우려한 \"몰래 낮은 모델로 도는\" 위험은 플래그 의무로 해소.\n3. **Monitor까지 최고 모델**(Codex) vs **haiku 유지**(Claude) → **haiku 유지**. 근거: cc/SKILL.md 165행에 실측 사유 명문 (\"상태 폴링뿐이라 품질 이득 0\") — 기존 설계 의도가 명확.\n4. **skills/cr/SKILL.md 포함**(Codex) vs 제외 → **제외**. 근거: grep 실측 — cr에는 모델 배정이 한 건도 없음 (하네스 규칙 문구뿐).\n\n**Codex가 낸 리스크 중 계획에 반영된 것:**\n- \"캐시 누락·오염 → 잘못된 모델/호출 실패\" → fallback + 플래그 의무 + capability-assumptions 감시 (B5).\n- \"Claude enum에는 순위 정보가 없어 미래 이름의 우열 오판 가능\" → 인정. 판별 불확실 시 **상속이 안전 기본값**이라는 문구를 TOP 정의에 포함 + /crv의 enum drift 감사 (B2·B5). 완전 자동 보장은 불가함을 문서에 정직하게 명기.\n- \"분산된 예제·fallback에 옛 이름 잔존 → 특정 경로만 옛 모델로 실행\" → 검증 3번(정적 스윕 0건)으로 차단.\n\n### ⚠️ 사전 리스크 (Pre-mortem — 2026-07-15 수행)\n\n수행 방식: ① Claude Fable 세션 분석(컨텍스트 기반) + ② Codex gpt-5.6-sol 독립 조사(P0.5에서 통합) + ③ **ultracode 워크플로 — 4명의 적대적 회의론자(runtime·consistency·deploy·design 렌즈) 병렬 공격, 27건 수집** 후 중복 제거·계획 반영.\n\n#### Claude Fable 관점 (세션 컨텍스트 기반)\n\n- 컨벤션 위반 없음: resolver는 `os.homedir()` 기반 portable (머신 하드코딩 금지 원칙 준수). capability-assumptions.json은 필드 내 문자열만 교체하므로 /crv 호환.\n- 과거 결정과의 모순 없음: \"소규모 xhigh/대규모 high + 180s\" 규칙 유지, /cc \"품질 우선\" 철학은 TOP 규칙이 그대로 계승, /c 경제 티어는 설계 의도대로 보존.\n- 가장 막힐 가능성이 큰 지점: 리포를 고쳐도 이 컴퓨터의 실행은 플러그인 캐시(3.23.1)에서 나오므로 **I5(플러그인 업데이트) 전까지는 반영 안 됨** — 검증 7번이 이걸 잡는다.\n\n#### Skeptic 패널 핵심 발견 (27건 중 채택·반영 완료 — 계획 본문에 이미 흡수됨)\n\n| # | 렌즈 | 발견 (심각도) | 계획 반영 |\n|---|------|--------------|----------|\n| 1 | runtime | resolver 빈 결과가 `-m \"\"`으로 흘러 조용한 강등 (**blocker**) | Plan A-3 강화판: `process.exit(1)` + `MODEL_ARG` 배열 분기 + 실패 경로 실측 완료 |\n| 2 | runtime | 순위표 파일 부재(require 에러) 시 비결정 종료 (high) | `\\|\\| CODEX_MODEL=\"\"` 확정 처리 + path.join 정규화. 실패 경로 실측 통과 |\n| 3 | runtime·consistency | \"플래그 의무\"의 기록 위치 불명 (high) | 기록 위치 확정: 호출 직후 stdout echo → 각 스킬 결과 보고 상단 복사 의무 (A4에 명기) |\n| 4 | deploy | bump-version은 11곳이 아니라 **14곳** (high) | I3 수정 + \"14/14\" 검증 출력 확인 절차화 |\n| 5 | deploy | 커밋 전 태그 생성 시 marketplace ref가 옛 버전을 가리킴 (high) | I4 순서 엄수(①커밋→②태그→③push→④`git show` 검증) 명문화 |\n| 6 | deploy | capability-assumptions.json 라인 편집 시 JSON 파손 → /crv 사망 (high) | [B] 편집 안전 규칙: Edit 정밀 교체 + node 파싱 검증 의무 |\n| 7 | design | 세션이 낮은 모델일 때 상속이 품질을 낮춤 (high) | TOP 정의에 판정 절차 명시: \"세션 ≥ enum 최상위면 상속, 미만이면 enum 최상위 **명시**\" |\n| 8 | design | enum에 순위 정보 없음 — 미래 새 이름 우열 오판 가능 (high) | 수용된 한계로 정직하게 명기 + 판별 불확실 시 상속 = 안전 기본값 + /crv enum drift 감사(B5) |\n| 9 | design | 순위표 priority가 \"성능 순위\"가 아닐 가능성 (medium) | 실측 반박: 1위 설명 \"Latest frontier\" — 설명·순서 일치 확인. 잔여 위험은 /crv 감사로 커버 |\n| 10 | design | 신설 추론 단계(max/ultra) 미활용 (medium) | 범위 밖 명기 유지 + B5 감시에 \"reasoning_levels 확장 감지\" 포함 |\n| 11 | consistency | 검증 grep의 제외 규칙 모호 (medium) | 검증 3 명령을 호출형(`-m gpt-5.5`) 기준으로 명확화 + resolver 삽입 지점 전수 grep(검증 4) |\n| 12 | runtime | Mac Mini 등 타 OS에서 resolver 미검증 (medium) | 검증 8 신설: ssh macmini에서 resolver 실측 |\n\n기각한 발견: \"TOP 정의 중앙화(include 방식)\" — 스킬은 런타임에 자기 SKILL.md만 읽으므로 include 불가, 동일 문구 복붙 + /crv 불일치 감사가 현실적 방안 (듀얼 합성 분기 1과 동일 근거). \"fail-closed(-m 생략 fallback 폐기)\" — graceful degrade 원칙 유지 (듀얼 합성 분기 2에서 이미 해소).\n\n#### Trigger 매핑 (Pre-mortem 결과 → Plan B 전환점)\n\n- 발견 1·2·3 → Plan A 설계 보강으로 해소 (트리거 아님 — 사전 차단).\n- 발견 4·5·6 → 실행 절차 보강 (I3·I4·B 안전 규칙). T4(태그 사고)와 매핑.\n- 발견 7·8 → TOP 정의 문구 보강. T3(fable spawn 거부 → Plan B-2)와 매핑.\n- 발견 12 → 검증 8 신설. 실패 시 T1 계열 (resolver 크로스플랫폼) → Plan B-1.\n- **Blocker 판정**: 보안 치명·데이터 손실·비가역 단계 없음 — 발견된 blocker 2건은 구현 디테일이며 계획 반영으로 해소 완료. Modify 강제 사유 아님.\n\n## 💡 시사점 · ⚠️ 주의점 · 🔀 Side Effect\n\n- **💡 시사점**: 모델 세대 교체가 \"문서 개정 이벤트\"에서 \"무이벤트\"로 바뀐다. /c(경제 티어제)와 /cc(전부-opus)로 갈라져 있던 모델 정책이 **하나의 난이도 사다리로 통일**되고, /cc의 토큰 비용은 v3.11 \"전부 opus\" 대비 절감된다 (Easy/Medium 업무가 경량·중간 티어로 내려가므로). capability-assumptions 감시 체계가 기능 축에 이어 모델 축까지 커버하게 된다. 이후 gpt-5.6 세대의 신설 추론 단계(max, ultra — \"자동 작업 위임\" 포함)를 Lens 깊이 분기에 편입할지가 자연스러운 후속 과제.\n- **⚠️ 주의점**: ① 출시 시 태그 누락 = 다른 컴퓨터에 옛 코드 설치 (실측 사고 이력 — I4 절차 엄수). ② 이 계획은 지시문(문서) 교체라 되돌리기 쉽지만, 출시 후에는 버전이 박제되므로 되돌리려면 새 패치 버전이 필요. ③ Mac Mini 등 다른 컴퓨터의 codex에 순위표 파일이 없을 수 있음 — fallback이 커버하지만 플래그 발생 여부를 다음 사용 시 확인 권장.\n- **🔀 Side Effect (파급)**: /c·/cc·/ccp·/cp·/cpp 5개 스킬의 모델 배정 문구 전부, /crv 감사 항목 2건, harness-rules 심사 기록 1건. 다른 스킬(cr·cs·cu·ci·cps·crv 본문)은 무영향 (grep 실측 0건). 실행 중인 다른 프로젝트에는 영향 없음 (Lens 문서만 변경).\n\n## ✅ Review — 검증 (증거 + 어떻게 검증할지)\n\n**검증 전략**: 7건 전부 이 세션에서 직접 명령을 실행해 검증하고(대화에 증거 잔존), 각 행의 pass/fail을 최종 보고에 표로 제시한다. 범위: 이 컴퓨터에서의 실행 검증 + 리포·출시 상태 검증까지 (다른 컴퓨터 반영은 범위 밖 — 기록만).\n\n| # | 목표가 됐다는 신호 | 확인 방법 (명령/관측) | 통과 판정 | 종류 |\n|---|------------------|----------------------|----------|------|\n| 1 | codex가 쓸 모델을 스스로 1등으로 찾아낸다 | 문서에 적힌 resolver 한 줄을 bash로 실행 | 출력 = `gpt-5.6-sol` | auto |\n| 2 | codex 실호출이 그 모델로 성공한다 | §4 표준 호출(resolver 포함) 실행 | EXIT 0 + 본문 수신 | auto |\n| 3 | 옛 모델 이름이 지시문에 남아있지 않다 | `grep -rn \"m gpt-5.5\" skills/ docs/rules/` | 0건 (호출형 기준. 실측 표기 101행·역사 기록은 제외 대상) | auto |\n| 4 | Claude 일꾼 지시문이 난이도 사다리 + TOP 규칙으로 바뀌었다 | `grep -n \"TOP\\|fable\\|사다리\" skills/*/SKILL.md` 역할 테이블 | 5개 스킬 전부에서 사다리(경량/중간/TOP) 정의+테이블 확인, \"전부 opus\" 문구 0건 | auto |\n| 5 | 실제로 fable 일꾼이 뜬다 | Task tool로 model=fable 에이전트 1개 spawn (1문장 과제) | 정상 응답 수신 | auto |\n| 6 | 새 버전이 출시됐다 | `git tag --list v3.24.0` + `git status -sb` | 태그 존재 + 원격 push 완료 | auto |\n| 7 | 이 컴퓨터의 Lens가 새 버전이다 | installed_plugins 확인 (`claude plugin list` 또는 캐시 디렉토리) | 3.24.0 | auto |\n| 8 | 다른 OS에서도 자동 선택기가 안전하다 | `ssh macmini`로 resolver 한 줄 실행 (Pre-mortem 발견 12) | 1등 slug 반환 **또는** 빈 값+플래그 경로 (둘 다 pass — 조용한 오작동만 fail) | auto |\n| 9 | 감사 설정 파일이 깨지지 않았다 | `node -e \"require('./docs/rules/capability-assumptions.json')\"` (Pre-mortem 발견 6) | exit 0 | auto |\n\n## 진행상황\n\n- **마지막 업데이트**: 2026-07-15\n- **현재 경로**: Plan A\n- **완료**: Goal 정의 → Codex 듀얼트랙 조사·합성 → 계획 작성 → Pre-mortem(4-skeptic 27건 → 12건 채택 반영, blocker 2건 사전 해소) → 강화판 resolver 실측 통과\n- **Modify 이력 (2026-07-15)**: 사용자 정정 — \"최고 모델 무차별 배정 금지, 업무 난이도에 맞춰 배분\". Claude 축을 \"전 역할 TOP\" → \"난이도 사다리(Easy=경량/Medium=중간/Hard=TOP, 각 칸 자동 상승)\"로 재설계. /cc의 v3.11 \"전부 opus(품질 우선·비용 비고려)\" 철학 공식 폐기, /c와 사다리 통일. codex는 1등 모델 유지 + 난이도는 깊이 다이얼(기존 xhigh/high).\n- **실행 (2026-07-15, /cc)**: [A]~[H] 전 수정 완료 (rules 3종 + 스킬 5종 + cc P4.5 resolver 인라인 — Supervisor 지적 반영). Supervisor(fable) 82점 pass — fable spawn 실측 겸용. Codex 리뷰는 대형 diff로 180s 초과 → §7 degrade(Supervisor 단독 게이트, timeout 가드 라이브 실증). 검증: V1 resolver=gpt-5.6-sol ✓ / V2 §4 E2E EXIT 0+\"V324-OK\" ✓ / V3 옛 이름 호출형 0건 ✓ / V4 5개 스킬 사다리 반영 ✓ / V5 fable spawn ✓ / V8 Mac Mini 플래그 경로 정상 ✓ / V9 JSON 파싱 ✓. V6(태그)·V7(플러그인) 출시 단계에서.\n- **재개 포인트**: [I] 출시 — bump 14곳 완료, 커밋→태그→push→ref 검증→플러그인 업데이트\n","truncated":false,"stale":false}],"history":[{"id":"2026-07-04-cp-flow-mode","folder":"history","title":"Lens 3.23.x 통합 업그레이드 — `/cp flow` 신설 + Fable 하네스 규칙 이식 — 완료","date":"2026-07-04","hasMd":true,"hasHtml":true,"mdPath":"history/2026-07-04-cp-flow-mode.md","htmlPath":"history/2026-07-04-cp-flow-mode.html","mdInline":"# Lens 3.23.x 통합 업그레이드 — `/cp flow` 신설 + Fable 하네스 규칙 이식 — 완료\r\n\r\n**완료일**: 2026-07-04\r\n\r\n## 요약\r\n\r\n`/cp flow` FLOW 모드를 신설해 어떤 프로젝트든 \"이용자 관점 단계별 **화면** ↔ 받치는 엔진/모듈 ↔ 종속·재사용 관계\"를 한 장의 인터랙티브 Mermaid 플로우차트(`docs/rules/flow.md` SoT + `flow.html` 뷰, 05-dark-developer 토큰)로 그려 프로젝트의 Rule 로 저장하게 했다. 동시에 공개 추출본(asgeirtj/system_prompts_leaks 의 Claude Code 2.1.172 Fable 프롬프트)에서 하네스 isor 단독 게이트로 degrade(정직 기록).\r\n- QA 검증표 auto 6/6 pass: 산출물 존재(ls) / Playwright 실렌더(svg=true, err=none — 반려 전 21노드, 재생성 후 24노드) / board 카드(stale=false, 해시 일치) / 6개 스킬 grep 커버 / 설치본 3.23.x 버전 / CONVERT 가드(doc_kind 분기 선행 + 생성 html slide 클래스 0).\r\n- dogfood 2회: 1차(모듈 단위) 사용자 반려 → 스펙 수정 → 2차(화면 단위 — 대시보드 실존 화면 9 + 접점 2 + 엔진 12) 렌더 검증 통과.\r\n\r\n## 추가 사항\r\n\r\n- 후속 보류: board FLOW badge, loop-until-dry 의 /cc 반영, CHANGELOG 의 빈 `[3.22.0]` 중복 헤더 정리.\r\n- 한계 명시: board stale 은 md↔html 불일치만 감지 — 코드 변경은 `/cp flow` 재실행으로 갱신.\r\n- harness-rules.md 는 Claude Code 버전업 시 `/crv` 재대조 대상.\r\n","truncated":false,"stale":true},{"id":"2026-07-01-ci-creeta-install","folder":"history","title":"`/ci` — Creeta Install (설치목록 동기화 스킬) — 완료","date":"2026-07-01","hasMd":true,"hasHtml":true,"mdPath":"history/2026-07-01-ci-creeta-install.md","htmlPath":"history/2026-07-01-ci-creeta-install.html","mdInline":"# `/ci` — Creeta Install (설치목록 동기화 스킬) — 완료\r\n\r\n**완료일**: 2026-07-01\r\n\r\n## 요약\r\nper-user 설치목록(`~/.claude/lens/manifest.json`)과 이 머신의 실제 플러그인 설치현황을 대조해 4분류(설치할 것 / 제거할 것 / 목록밖 그대로둠 / 이미 맞음) 프리뷰 → 승인 → 설치·제거 동기화를 수행하는 신규 스킬 `/ci`를 만들었다. 결정론 백엔드 `lib/install-sync.js`(무의존, `claude plugin list --json` 1차 + `installed_plugins.json` 폴백) + 단위테스트 `lib/install-sync.test.js` + `skills/ci/SKILL.md`로 구성되며, **v3.22.0으로 출시**됐다(commit fe20cb2, tag v3.22.0).\r\n\r\n## 주요 결정 사항\r\n- **managed / excluded / foreign 3분리 안전모델 (Codex 핵심 교정)**: 제거는 `manifest.excluded`에 명시한 항목만. manifest에 없는 \"foreign\" 플러그인은 절대 자동 삭제하지 않고 보고만 한다. 모든 uninstall은 백업(`~/.claude/lens/removed-backup-<ts>/`) + 항목별 재확인 후에만.\r\n- **Lens 자기보호 하드가드**: `lens@CreetaCorp`(자기 자신)은 제거 후보에서 원천 배제 — self-uninstall 재앙 차단.\r\n- **cu.py 패턴 재사용 (Codex 교정)**: 초안이 모델로 삼은 `install-skills.ps1`은 livevil-setting 소속으로 이 레포에 없음 — Codex 지적으로 확인 후 레포 내 `scripts/cu.py`의 `installed_plugins.json` 직접 읽기 + scope 보정 패턴으로 교체.\r\n- **설치현황 이중 수집**: `claude plugin list --json`(이 세션 실측 스키마) 1차 + `~/.claude/plugins/installed_plugins.json` 직접 파싱 폴백 — CLI 스키마가 버전에 따라 변할 수 있어 dex가 blast radius를 초안보다 넓게 교정 — `lib/capability-audit.js`의 nudge 3문자열(L114/119/124)·주석, `hooks/session-start.js` 주석, `docs/rules/capability-assumptions.json`의 affects_lens에 crv 신규 등록(기존엔 skills/cr 미참조라 자가감사 대상 누락 위험)까지 포함.\r\n- **신규 /cr 안전 규칙 (Codex)**: (a) 파일 저장 안 함 — 산출은 대화 보고만, (b) 출처 URL + 발행일 보고 의무, (c) 로컬/비공개 코드·시크릿을 외부 쿼리에 넣지 않음(유출 금지), (d) 스코프 가드 없음 — 아무 레포/컨텍스트에서 동작(Review와 반대).\r\n- **deep-research와 차별**: creeta research = 무키 라이브채널(agent-reach) + WAF 차단우회(insane-search) 특화. 범용 웹리서치만이면 deep-research 폴백/안내.\r\n- **substrate 소비**: 호출 명령을 SKILL.md에 복붙하지 않고 `docs/rules/live-research.md`(단일 SoT)를 참조.\r\n- **역사문서 불변**: `docs/history/2026-06-05-*audit*`의 과거 `/cr` 표기는 개명 대상에서 제외.\r\n\r\n## 변경 파일\r\n- `skills/cr/` → `skills/crv/` — 기존 Lens Review 스킬 폴더 이동 + 내부 식별자(/crv) 전환\r\n- `skills/cr/SKILL.md` — 신규 Creeta Research 스킬 (다각도 파이프라인 + 안전·폴백·차별 절)\r\n- `lib/capability-audit.js` — nudge 3문자열 + 주석 /cr → /crv\r\n- `hooks/session-start.js` — nudge 주석 갱신\r\n- `docs/rules/capability-assumptions.json` — description 갱신 + affects_lens에 crv 등록\r\n- `docs/rules/codex-integration.md` — /crv 참조 갱신 (CHANGELOG 명시)\r\n- `CLAUDE.md` · `README.md` — 스킬 표/사용법에 /cr(research)·/crv(review) 반영\r\n- 릴리즈 배선 — `scripts/bump-version.sh`, `docs/START_HERE.md`, `CHANGELOG.md`\r\n\r\n## 테스트 & 검증\r\n- task 계획의 EARS 7건(개명 잔재 0 grep 게이트 / SessionStart 알림 /crv 문구 / /crv 감사 파이프라인 동작 / /cr 다각도 인용 보고 / 도구 미설치 폴백 / affects_lens 등록 / 태그 + 세션 노출) 중 개명 무손실은 전수 grep 게이트(A6), 신규 /cr은 실제 실행 관측으로 확인하도록 설계됐다.\r\n- 이 문서는 사후 아카이브라 당시 개별 검증 로그는 남아 있지 않다. 다만 **v3.22.0 릴리즈·설치로 최종 확인** — `skills/cr/`·`skills/crv/`가 레포에 실존하고, `/cr`(research)·`/crv`(review) 둘 다 세션 스킬 목록에 정상 노출된다(2026-07-04 확인).\r\n\r\n## 추가 사항\r\n- 신규 `/cr`은 외부 서비스로 쿼리를 보내는 스킬 — 로컬 코드 유출 금지 규칙이 SKILL.md에 박혀 있으나, 프롬프트 위생은 실행 시마다 준수 필요.\r\n","truncated":false,"stale":true},{"id":"2026-07-01-live-research-substrate","folder":"history","title":"라이브 리서치 substrate — `docs/rules/live-research.md` — 완료","date":"2026-07-01","hasMd":true,"hasHtml":true,"mdPath":"history/2026-07-01-live-research-substrate.md","htmlPath":"history/2026-07-01-live-research-substrate.html","mdInline":"# 라이브 리서치 substrate — `docs/rules/live-research.md` — 완료\r\n\r\n**완료일**: 2026-07-01\r\n\r\n## 요약\r\nLens 스킬(`/cpp` S2, `/cr`)이 \"현재 라이브 정보\"(최신 릴리즈·트렌드·이슈·커뮤니티 반응)를 가져오는 표준 경로를 단일 SoT 문서 `docs/rules/live-research.md`로 신설했다. agent-reach(무키 라이브 채널)·insane-search(WAF 우회 fetch)의 감지·호출법 + 미설치 시 폴백 규칙(deep-research → WebSearch/WebFetch) + 신선도 규율(출처 URL·발행일 병기) + insane-search 안전 한계를 규정하며, **v3.22.0으로 출시**됐다(commit fe20cb2, tag v3.22.0). 4개 계획(/ci·/cr·/cpp 라이브화)의 선행 토대.\r\n\r\n## 주요 결정 사항\r\n- **단일 SoT 참조 방식**: /cpp와 /cr이 같은 호출법·같은 폴백 규칙을 쓰므로 각 스킬에 복붙하면 드리프트 확정 — 규칙은 이 문서 한 곳에 두고 스킬은 참조만 한다(Codex 이견 없음).\r\n- **폴백 필수 = 미설치는 실패가 아님**: agent-reach 없음 → deep-research → 네이티브 WebSearch/WebFetch, insane-search 없음 → WebFetch/jina 2단 폴백. 폴백 시 조사보고에 \"라이브 채널 없음(폴백: X)\" 한 줄만 남기고 절대 멈추지 않는다(dormant 스캐폴딩 금지 원칙).\r\n- **위임 우선**: agent-reach는 이미 네이티브 스킬이므로 플랫폼 라우팅 일반은 재구현하지 않고 \"agent-reach 스킬에 위임\"(중복 회피).\r\n- **insane-search 안전 한계 (Codex 신규 리스크 반영)**: 로그인/유료 페이월 우회 금지, robots·ToS 위반 대량 크롤 금지, 개인정보·비공개 리소스 조회 금지, terminal 실패(auth_required/paywall/404)는 인정하고 멈춤(무한 재시도 금지).\r\n- **문서만 만들고 끝내지 않기 (Codex)**: `CLAUDE.md`·`docs/START_HERE.md`에 참조 등록. 실제 /cpp·/cr SKILL.md의 참조 배선은 각 스킬 계획 소관.\r\n- **문서 구조**: §0 감지(호출 전 1회, win/unix 경로 + doctor) → §1 라이브 채널 호출표(Exa·jina·GitHub·YouTube·V2EX·RSS) → §2 차단 우회 fetch → §3 폴백 → §4 신선도 규율 → §5 참조 스킬 목록 → §6 안전 한계 + 셸 규칙(Windows cp949 함정).\r\n\r\n## 변경 파일\r\n- `docs/rules/live-research.md` — 신규 (본 substrate 문서, 코드 0)\r\n- `CLAUDE.md` · `docs/START_HERE.md` — 참조 등록 한 줄씩\r\n- `CHANGELOG.md` — v3.22.0 Added 항목\r\n\r\n## 테스트 & 검증\r\n- task 계획의 EARS 4건(파일 존재 / Exa·engine 명령 제공 / 폴백 경로 명시 / 참조 스킬 목록 존재)은 전부 auto(파일 존재 + grep) 검증으로 설계됐다.\r\n- 이 문서는 사후 아카이브라 당시 grep 로그는 남아 있지 않다. 다만 **v3.22.0 릴리즈·설치로 최종 확인** — `docs/rules/live-research.md`가 레포에 실존하고 §0~§6 + 셸 규칙 절이 모두 존재하며, 소비자인 `/cr`·`/cpp`가 v3.22.0에 함께 출시돼 실사용 중이다(2026-07-04 확인).\r\n\r\n## 추가 사항\r\n- agent-reach·insane-search는 Lens 외부 플러그인 — Lens가 강제 설치하지 않는다(있으면 쓰고 없으면 폴백). 강제 의존으로 오해 금지.\r\n- agent-reach 채널이 늘거나 참조 스킬이 추가되면 이 문서의 호출표·§5 목록만 갱신하면 된다.\r\n","truncated":false,"stale":true},{"id":"2026-06-18-cu-scope-winget-cc-uiux-pro","folder":"history","title":"/cu plugin scope + winget UTF-8 + /cc UI/UX 스킬 의무 할당 — 완료","date":"2026-06-18","hasMd":true,"hasHtml":true,"mdPath":"history/2026-06-18-cu-scope-winget-cc-uiux-pro.md","htmlPath":"history/2026-06-18-cu-scope-winget-cc-uiux-pro.html","mdInline":"# /cu plugin scope + winget UTF-8 + /cc UI/UX 스킬 의무 할당 — 완료\r\n\r\n**완료일**: 2026-06-18\r\n\r\n## 요약\r\n`/cu`(Lens Update)가 local/project scope 플러그인을 user scope로만 갱신하려다 \"not installed at scope user\"로 실패하던 버그와, winget의 UTF-8 박스문자에서 리더 스레드가 cp949 디코드로 죽어 출력이 비어 gh를 \"winget 미감지\"로 오탐하던 버그를 한 번에 수정했다. 동시에 `/cc`(Lens Multi) Phase 1.3에 화면·UI 서브태스크의 ui-ux-pro-max 스킬 의무 할당을 추가했다. marketplace `source.ref`가 고정 태그라 소스 수정만으로는 dormant 상태가 되므로 v3.19.0 → v3.20.0 bump + commit + tag + push로 전파했고, 활성 캐시에도 핫미러해 즉시 적용했다.\r\n\r\n## 주요 결정 사항\r\n- **scope를 installed_plugins.json에서 실측해 전달**: `_plugin_scope_info()`로 각 플러그인의 실제 scope를 읽어 `--scope <scope>`로 넘기고, local/project scope는 `projectPath`를 cwd로 실행. user scope만 가정하던 기존 동작이 context7·playwright(local scope) 갱신을 깨던 원인이라 실측 기반으로 전환.\r\n- **run()에 UTF-8 강제 디코딩**: `encoding=\"utf-8\", errors=\"replace\"`를 추가. winget이 출력하는 UTF-8 박스문자(0xe2…)를 cp949로 읽던 리더 스레드가 UnicodeDecodeError로 죽어 winget 출력이 비고, 그 결과 gh가 \"winget 미감지—수동 안내\"로 오탐되던 연쇄를 끊음. scan stderr 노이즈도 함께 제거.\r\n- **ui-ux-pro-max는 재설치하지 않음**: 이미 `~/.claude/skills/ui-ux-pro-max`에 설치돼 있음을 확인. `/cc` SKILL.md Phase 1.3에 기존 \"필수 실행 스킬\" 메커니즘으로 의무 할당만 추가하고, 미설치 머신은 네이티브 UI/UX 베스트프랙티스로 graceful degrade하도록 설계.\r\n- **bump + 핫미러 동시 전파**: marketplace `source.ref`가 고정 태그라 소스 수정만으로는 휴면 상태이므로 3.19.0 → 3.20.0 bump·commit·tag·push로 정식 전파. 동시에 활성 캐시(`cache/CreetaCorp/lens/3.19.0`)의 `cu.py`·`cc/SKILL.md`를 핫미러해 이 PC에서 즉시 동작하게 함.\r\n\r\n## 변경 파일\r\n- `scripts/cu.py` — `_plugin_scope_info()` 추가, `_upgrade_plugin_generic()`의 scope/cwd 처리, `run()` UTF-8 디코딩\r\n- `skills/cc/SKILL.md` — Phase 1.3 화면·UI 서브태스크 ui-ux-pro-max 의무 할당\r\n- bump 13파일 — `plugin.json`, `marketplace.json`, `CHANGELOG.md`, `CLAUDE.md`, `README.md`, hooks ×2, skills SKILL.md ×6 배너\r\n- 메모리 — `cu-winget-false-negative-windows.md` + `MEMORY.md` 인덱스를 \"v3.20.0에서 코드 수정됨—수동 워크어라운드 불필요\"로 갱신\r\n\r\n## 테스트 & 검증\r\n실측으로 확인:\r\n- ✅ `/cu scan`에서 cp949 traceback 사라짐 + gh `can_auto=True` (winget 소스 감지)\r\n- ✅ `context7` plugin `update --scope local` exit 0 (local scope 갱신 정상)\r\n- ✅ GitHub Release `isLatest=true` (v3.20.0 commit 4f1f606, tag push, Latest 지정)\r\n\r\n## 추가 사항\r\n- (선택) Mac Mini 등 타 머신은 `/lens-upgrade`로 3.20.0 반영\r\n- (선택) 라벨 정리를 위해 이 PC도 `/lens-upgrade` + 재시작\r\n","truncated":false,"stale":true},{"id":"2026-06-11-ccp-power-verify","folder":"history","title":"/ccp (Lens Power Verify) 신설 + 5분 진행보고 규칙 — 완료","date":"2026-06-11","hasMd":true,"hasHtml":true,"mdPath":"history/2026-06-11-ccp-power-verify.md","htmlPath":"history/2026-06-11-ccp-power-verify.html","mdInline":"# /ccp (Lens Power Verify) 신설 + 5분 진행보고 규칙 — 완료\r\n\r\n**완료일**: 2026-06-11\r\n\r\n## 요약\r\n이미 만들어진 산출물(기능·PR·화면·방금 빌드)을 출처 불문 독립적으로 적대적 감사하고, Playwright 등으로 실제 실행해 \"진짜 작동하는가\"를 증거화하며 최소 수복까지 책임지는 `/ccp` (Lens Power Verify) 스킬을 신설했다. `/cc`(\"만들면서 검증\")와 `/ccp`(\"이미 만들어진 것을 독립 감사\")의 경계를 한 문장으로 명문화했고, 4 렌즈(기능·엣지·회귀·UX) 적대적 검증과 파괴적 변경 차단·무한루프 방지·정직한 종료 같은 안전장치를 함께 박았다. 더불어 `/cc`·`/cp`·`/cpp`·`/ccp` 네 스킬에 공통 5분 진행보고 규칙을 추가했다. v3.16.0으로 배포 완료(commit 1bb756b, tag v3.16.0).\r\n\r\n## 주요 결정 사항\r\n- **출처 불문 standalone 감사로 경계 확정** — Codex 교차 협의(S4)에서 `/cc`와 중복 리스크가 크다고 판단, `/cc`=\"만들면서 검증\" ↔ `/ccp`=\"이미 만들어진 것을 적대적으로 독립 감사해 증거화·수복\"으로 한 문장 차별화. 같은 작업이면 `/cc`를 권유하는 다운그레이드 가드도 둠.\r\n- **read-only 우선 · 파괴적 변경 차단** — \"무슨 수를 써서라도 검증\"을 read-only 범위까지로 한정. 배포·DB migration·대량삭제·외부 결제/메일은 dry-run 또는 승인 없이 금지(Codex critical 반영).\r\n- **만장일치 게이트** — 4 렌즈 중 blocking refute가 1개라도 있으면 done 선언 차단(과반이 아닌 만장일치).\r\n- **정직한 종료** — 못 끝내면 done 금지, `verified=false` + blocking + 다음 액션으로 마감.\r\n- **무한루프 방지 cap** — 5회 + 예산 + 동일 실패 2회 시 전략 전환 + 3회 승인 cap으로 무한 수복 방지.\r\n- **Surgical** — pass한 검증 축은 freeze, 실패 축만 수복. `/cc`·`/cp`는 5분 규칙 1줄 외 무수정.\r\n\r\n## 변경 파일\r\n- `skills/ccp/SKILL.md` (신설 — 배너 \"Lens Power Verify v3.16.0\", 증거수집→4렌즈 반박→최소수복→재검증→증거리포트 루프 + 안전장치 + 5분 보고)\r\n- `skills/cc/SKILL.md` (기본값 #2 \"2분\"→\"5분\")\r\n- `skills/cp/SKILL.md` (절대규칙에 5분 보고 1줄)\r\n- `skills/cpp/SKILL.md` (절대규칙에 5분 보고 1줄)\r\n- `scripts/bump-version.sh` (+ccp 배너, 12→13)\r\n- `CLAUDE.md` (Skills 표 +/ccp 행 + v3.16.0 feat)\r\n- `README.md` (/ccp 섹션)\r\n- `CHANGELOG.md` (v3.16.0)\r\n\r\n## 테스트 & 검증\r\nEARS 6항목 전부 auto 검증으로 통과:\r\n- ✅ 새 세션 시작 시 인벤토리에 `/ccp` 표시 (SKILL.md + SessionStart)\r\n- ✅ `/ccp` 검증 시 4 렌즈 적대적 검증 수행 (SKILL.md 렌즈 섹션)\r\n- ✅ blocking refute 1+ 시 done 선언 차단 (blocking=0만 pass)\r\n- ✅ 파괴적 변경(배포·DB·대량삭제·결제/메일) 승인 없이 금지 (SKILL.md 안전장치 명시)\r\n- ✅ 장시간 작업 시 4개 스킬 모두 5분 진행보고 (\"5분\" grep 4개 모두 적중)\r\n- ✅ 릴리즈 tag 푸시 후 재설치 cache에 ccp/ 포함 (cache 3.16.0/skills/ccp 존재 확인)\r\n\r\n배포 검증: commit 1bb756b, tag v3.16.0 push, 캐시 3.16.0 갱신에서 ccp/ + 5분 4스킬 모두 확인.\r\n\r\n## 추가 사항\r\n남은 후속(선택): gh release 생성, done-sweep의 cpp/ccp 마커 인식(v2). 둘 다 필수가 아니며 본 작업의 완료 정의에는 포함되지 않음.\r\n","truncated":false,"stale":true},{"id":"2026-06-11-cpp-power-plan","folder":"history","title":"/cpp (Lens Power Plan) 신설 — 빌드레디 심층 계획 엔진 — 완료","date":"2026-06-11","hasMd":true,"hasHtml":true,"mdPath":"history/2026-06-11-cpp-power-plan.md","htmlPath":"history/2026-06-11-cpp-power-plan.html","mdInline":"# /cpp (Lens Power Plan) 신설 — 빌드레디 심층 계획 엔진 — 완료\r\n\r\n**완료일**: 2026-06-11\r\n\r\n## 요약\r\n\r\n되묻기 0을 목표로 하는 빌드레디 심층 계획 엔진 `/cpp`(Lens Power Plan)를 신설했다. 사용자가 `/cpp <요청>`을 입력하면 그대로 실행만 하면 완성품이 나오는 계획서가 산출되며, 계획서 맨 앞에는 항상 \"이게 끝나면 무엇을 할 수 있게 되는가\"가 사용자 언어로 박힌다. 9스테이지 파이프라인(목표 잠금 → Clarify-to-Zero → 6축 fan-out 조사 → body-adaptive 딥스펙 → Codex 교차 협의 → 빌드레디 태스크 → EARS 검증 → self-check → /cc 핸드오프)을 SKILL.md 골격으로 구현했고, 기존 `/cp`는 한 줄도 건드리지 않은 채 신규 폴더로 격리했다. v3.15.0으로 배포 완료(commit 247dbc0, tag v3.15.0).\r\n\r\n## 주요 결정 사항\r\n\r\n- **`/cp` 무수정, 신규 폴더 격리**: 가벼운 계획은 `/cp`, \"끝장 계획\"은 `/cpp`로 역할을 분리. `/cp`·`lib/*`·기존 skill을 일절 수정하지 않는 surgical 원칙을 Constitution 3번으로 못 박았다.\r\n- **Codex 교차 협의를 양보 불가 하드게이트로**: graceful-degrade를 금지하고, Codex 미감지 시 조용히 진행하지 않고 정지·보고하도록 했다. 다만 Codex 일시 다운의 불편(R2)을 고려해 사용자가 1회성으로 명시 우회할 수 있는 문구를 남겼다.\r\n- **목표는 사용자 언어로 잠금(Goal-Locked)**: 목표 문장에 함수/HTTP/SQL/경로 같은 기술 토큰을 0개로 강제. 약한 목표는 승인 거부(`/cp` v3.8 계승).\r\n- **Body-Adaptive 구조**: spine(목표·Constitution·검증·실행·진행상황)만 고정하고 나머지는 주제가 구조를 정하게 했다. 도메인 라우터로 UI는 ASCII 와이어프레임+요소스펙+상태, API는 계약서를 산출.\r\n- **벤치마크 기반 채택**: Spec Kit(Constitution/clarify/analyze), Kiro(EARS/waves), Superpowers(빌드레디 태스크 포맷)에서 검증된 패턴만 채택. BMAD 다중 페르소나·별도 CLI·7-커맨드 분리는 과함으로 미채택(`/cpp`는 단일 명령).\r\n- **깊이 ≠ 장황(R1)**: power가 토큰 폭발로 변질되지 않도록 TL;DR 의무화와 \"불필요 섹션 금지\" 게이트를 SKILL.md에 명시. 깊이는 정보 밀도지 분량이 아니다.\r\n\r\n## 변경 파일\r\n\r\n- `skills/cpp/SKILL.md` (신규) — 배너 \"Lens Power Plan v3.15.0\", 9스테이지 파이프라인\r\n- `scripts/bump-version.sh` — cpp 배너 sed 라인 + 검증 목록 추가, 파일 카운트 11→12\r\n- `CLAUDE.md` — Skills 표에 `/cpp` 행 + v3.15.0 feat 노트\r\n- `README.md` — skills 섹션 `/cpp` 1줄\r\n- `CHANGELOG` — v3.15.0 항목\r\n\r\n## 테스트 & 검증\r\n\r\n6개 EARS 검증 항목(WHEN/THEN/SHALL)으로 됐다는 증거를 정의하고 충족 확인:\r\n\r\n- 새 세션 인벤토리에 `/cpp` 표시 — `skills/cpp/SKILL.md` 폴더만 생성하면 `plugin.json`의 `\"skills\": \"./skills/\"` 자동 등록으로 등장(cps가 hooks/scripts 하드코딩 0건인데도 인벤토리에 뜨는 것으로 확정).\r\n- `/cpp` 목표 문장에 기술 토큰 0개 — 목표 섹션 검사.\r\n- UI 요청 시 와이어프레임+요소스펙+상태+문구 4요소 포함.\r\n- Codex 미감지 시 진행 정지·보고 — SKILL.md Codex 게이트 명시.\r\n- 릴리즈 tag 푸시 후 재설치 cache가 `skills/cpp/` 포함 — `bump-version.sh 3.15.0`으로 12/12 파일 갱신·stale 0 확인, commit + `git tag v3.15.0` + push, `/lens-upgrade` 재설치로 캐시 3.15.0의 cpp/ 디렉토리 존재 확인.\r\n- `/cp`·board·`/cc` 핸드오프 회귀 0 — 기존 동작 점검.\r\n\r\n## 추가 사항\r\n\r\n남은 후속(모두 선택):\r\n\r\n- gh release 생성.\r\n- done-sweep의 cpp 마커 인식(v2) — cpp 문서가 `## Plan A` 부재로 \"수동확인필요\"로 분류될 수 있는 안전한 degrade를 보강.\r\n- UI 렌더 목업 — 현재는 ASCII 와이어프레임만 지원.\r\n","truncated":false,"stale":true},{"id":"2026-06-05-lens-capability-modernization-audit","folder":"history","title":"Lens 자가 현대화 감사 기능 (`/cr`) — 완료","date":"2026-06-05","hasMd":true,"hasHtml":true,"mdPath":"history/2026-06-05-lens-capability-modernization-audit.md","htmlPath":"history/2026-06-05-lens-capability-modernization-audit.html","mdInline":"# Lens 자가 현대화 감사 기능 (`/cr`) — 완료\r\n\r\n**완료일**: 2026-06-06\r\n\r\n## 요약\r\n\r\nLens가 자기 자신의 모든 기능을 Claude/Codex의 최근 네이티브 발전과 사용자 세션 패턴에 비춰 주기적으로 재평가하는 `/cr`(자가 현대화 감사) 스킬을 신설했다. 한 번의 명령으로 4차원 양면 감사 — 공급-드리프트(여전히 유효한가), 공급-업그레이드(더 좋게 만들 벡터), 편의(워크플로 마찰 제거), 수요-마이닝(반복 패턴 기반 net-new 제안) — 를 수행해 각 기능에 KEEP/UPGRADE/OBSOLETE/NEW 판정과 라이브 근거를 단 분류 리포트를 산출한다. 감사 로직은 머신 독립적인 온디맨드 스킬 + creeta-lens 레포 한정 SessionStart staleness 알림(네트워크 호출 0)으로 구현했고, OBSOLETE 자동삭제는 0건 — 죽음 판정은 사람이 결정할 제안으로만 남긴다. v3.13.0으로 배포 완료.\r\n\r\n## 주요 결정 사항\r\n\r\n- **온디맨드 스킬 + 세션 staleness 알림 (cron 아님)** — Lens는 여러 머신에 배포되는 플러그인이라 cron은 머신 의존적이다. 기존 `/cu`(per-machine, 필요할 때만) 패턴과 일치하는 온디맨드 방식을 채택해 포터빌리티를 확보했다.\r\n- **레지스트리 포맷 = JSON** — Claude(markdown 표) vs Codex(JSON) 분기에서 JSON(`docs/rules/capability-assumptions.json`)을 채택. 사용자가 \"machine-readable\"을 명시했고, 훅의 레지스트리-해시 staleness 트리거가 안정적 직렬화를 요구하기 때문(JSON이 해시하기 깔끔).\r\n- **staleness 상태 = 프로젝트-로컬** — 전역 `~/.claude` vs 프로젝트-로컬 분기에서 `.lens/capability-audit-state.json`(로컬)을 채택. 전역이면 모든 프로젝트에서 알림이 떠 nag가 발생하지만, `/cr`은 lens 레포에서만 의미 있으므로 로컬 상태가 알림 스코프를 자연히 한정한다. 덤으로 레지스트리 해시 변경 시 재감사 신호도 얻는다.\r\n- **fetch 실패 = UNKNOWN-default (버전-앵커 오프라인 판정 아님)** — 라이브 데이터가 없을 때 추측으로 OBSOLETE를 찍는 것이 최악(false-obsolete)이다. 더 단순하고 안전한 UNKNOWN 표기를 택했다. 그 회차는 덜 actionable하지만 틀리지 않는다.\r\n- **`probe` 신호 타입 허용** — 능력 신호 중 로컬 확정 가능한 것(네이티브 명령 존재, `codex --help` 노출 모델 등)은 `probe`, 로드맵/공식 발표는 `web`. Pre-mortem P1·P2 — \"체인지로그는 능력을 다 안 알려주고 실행 중인 환경 자체가 더 권위 있는 신호\" — 를 레지스트리 스키마(`signal_method`)에 반영했다.\r\n- **OBSOLETE 자동삭제 0, 모호하면 KEEP** — 고신뢰 건도 삭제가 아니라 `docs/tasks/`에 `/cp` task로 핸드오프. obsolete 안전장치로 코드/스킬 파일 자동삭제를 금지했다.\r\n- **수요 가치 재정의** — Pass 1 감사에서 신기능 제안은 0건(`/ch`·`/cx` 둘 다 사용자 리뷰 후 드롭). 수요 가치는 \"반복 명령을 스킬 기본값으로\"로 재정의돼 v3.14.0에 반영됐다.\r\n\r\n## 변경 파일\r\n\r\n- `skills/cr/SKILL.md` (신규) — `/cr` 스킬. Phase A 레지스트리+버전 로드 → Phase B 라이브 fetch(공식 allowlist) → Phase C 분류(KEEP/UPGRADE/OBSOLETE/NEW + confidence + evidence) → Phase D md 리포트 → Phase E HTML 덱+board → Phase F 고신뢰 건 `/cp` 핸드오프 → Phase G stamp. `Triggers:` 줄 포함(자동추천 노출용).\r\n- `docs/rules/capability-assumptions.json` (신규) — machine-readable 레지스트리. 기능별 `{id, kind, refs[], purpose, assumed_native_gap, gap_closed_signal, signal_method(probe|web|both), official_sources[], false_obsolete_risk, last_reviewed}`. Pass1 감사의 11행을 시드로 사용.\r\n- `lib/capability-audit.js` (신규) — `readAuditState()`, `isLensRepo(cwd)`, `computeRegistryHash()`, `formatAuditNudge()`, CLI `stamp` 서브커맨드.\r\n- `hooks/session-start.js` — `isLensRepo(cwd)` 이고 (감사 주기 초과 또는 레지스트리 해시 변경)이면 muted 한 줄 알림 주입. 네트워크 0, fail-soft.\r\n- `lens.config.json` — `capabilityAuditIntervalDays`(기본 30) + `capabilityAuditNudge`(기본 true) 추가.\r\n- `CLAUDE.md` / `README.md` — 스킬 표에 `/cr` 추가.\r\n- 릴리스 산출물 — `scripts/bump-version.sh 3.13.0`(11곳 일괄 범프) + CHANGELOG `Added` + 태그 + GitHub Release.\r\n\r\n## 테스트 & 검증\r\n\r\n8개 검증 신호(✅표) 기준:\r\n\r\n- **분류 완전성** — 리포트 분류 행 수가 레지스트리 항목 수와 일치, 누락 0.\r\n- **근거 부착** — 모든 비-KEEP(OBSOLETE/UPGRADE/NEW) 행에 공식 체인지로그 URL+버전 인용. 근거 없는 비-KEEP = 0.\r\n- **핸드오프** — 고신뢰 UPGRADE/OBSOLETE/NEW가 `docs/tasks/`에 대응 `/cp` task로 생성됨.\r\n- **3종 산출 + board** — `docs/history/<id>.md`·`.html` + board 카드 노출.\r\n- **알림 스코프** — creeta-lens 세션 시작 시 알림 출력, 타 레포에선 미출력.\r\n- **타이머 리셋** — stamp 후 `lastAuditAt` 갱신 → 재시작 시 알림 소멸.\r\n- **obsolete 안전장치** — OBSOLETE 판정이 있어도 `git status` 변경분 = 문서·신규파일만(코드/스킬 자동삭제 0).\r\n- **degrade 안전** — 네트워크 차단 시 비-KEEP을 UNKNOWN으로 표기, OBSOLETE 추측 0.\r\n\r\n실증 완료(Pass 1, 2026-06-05): 이 4차원 감사를 멀티에이전트 워크플로로 1회 실행해 `/cr`이 자동화할 패스를 입증했다. 결과 = `docs/history/2026-06-05-lens-modernization-audit.md`(0 OBSOLETE / 2 KEEP / 9 THIN + 14 우선조치 + 신기능 0건). 원자료 = `.lens/conv-mining/audit-supply.json`·`audit-demand.json`.\r\n\r\n## 추가 사항\r\n\r\n- **수요 가치 후속** — \"반복 명령을 스킬 기본값으로\"는 v3.14.0에서 별도 반영.\r\n- **남은 코어 리팩토링(본 task 범위 밖, 별도 `/cp` 계획으로 분리)** — #6 `/goal` 위임, #7 Monitor 제거, #12 `/cps`, #13 `/cp` 토큰, #14 lens-upgrade. 미완이 아니라 의도적으로 분리된 후속 항목.\r\n- **언급만 한 드리프트** — `docs/START_HERE.md`의 6스킬(/cu 누락) 구문, SessionStart \"Quick Commands\" 하드코딩(/cps·/cs·/cu 누락)은 본 작업 범위 밖으로 명시.\r\n- **수명 주의** — `/cr` 매 실행 = `docs/history/`에 새 감사 파일 1개. 의도된 audit trail이나 board 카드가 누적 증가한다.\r\n","truncated":false,"stale":true},{"id":"2026-06-05-lens-modernization-audit","folder":"history","title":"Lens 현대화 감사 — Pass 1 (2026-06-05)","date":"2026-06-05","hasMd":true,"hasHtml":true,"mdPath":"history/2026-06-05-lens-modernization-audit.md","htmlPath":"history/2026-06-05-lens-modernization-audit.html","mdInline":"---\r\ntitle: \"Lens 현대화 감사 — 11기능 재분석 + 대화 마이닝 신기능 제안 (Pass 1)\"\r\ndate: 2026-06-05\r\nkind: audit\r\nmethod: \"이종 멀티에이전트 워크플로 (공급 측 25 agents + 수요 측 19 agents, 듀얼 검증)\"\r\n---\r\n\r\n# Lens 현대화 감사 — Pass 1 (2026-06-05)\r\n\r\n> 이 문서는 `/cr`(자가 현대화 감사) 기능의 **첫 실증 실행** 결과이자, 그 기능이 매번 산출할 리포트의 양식 레퍼런스다. 두 축으로 감사했다:\r\n> - **공급 측** — Claude Code(v2.1.160) + Codex(0.137.0) 네이티브 능력이 어디까지 왔나 → 각 기능 노후도·업그레이드·편의\r\n> - **수요 측** — 사용자의 과거 세션 82개·954 발화에서 반복/불편/우회 패턴 → net-new 기능 제안\r\n>\r\n> 방법: 두 개의 멀티에이전트 워크플로(기능별 독립 분석 → 적대적 검증 → 종합). 라이브 CLI probe + 공식 문서 + 실제 소스 정독 기반. 근거 없는 OBSOLETE 금지, false-obsolete 적대 검증.\r\n\r\n---\r\n\r\n## 0. 한 줄 결론\r\n\r\n**2026-06 네이티브 Claude Code가 Lens 오케스트레이션 \"엔진\"의 대부분을 흡수했다 — 그러나 11기능 중 OBSOLETE는 0이다.** `/cs`(멀티레포 sweep)와 Codex 연동(cross-vendor 이종검증)은 네이티브가 직접 공백을 인정해 KEEP, 나머지 9개는 THIN(엔진은 네이티브에 위임해 얇게, 고유 코어만 생존). 살아남는 코어는 셋으로 수렴한다: **① 디스크 영속 산출물**(board HTML·docs 라이프사이클·감사로그 — 네이티브는 전부 세션 휘발), **② cross-vendor 이종검증**(codex/gpt-5.5 — 네이티브 평가자·워커가 전부 Anthropic 가족이라 구조적 비대체), **③ Worker 프롬프트에 박힌 Karpathy 4규칙 강제계약**.\r\n\r\n---\r\n\r\n## 1. 공급 측 — 11기능 노후도 판정\r\n\r\n| # | 기능 | 판정 | 한 줄 |\r\n|---|------|------|-------|\r\n| 1 | `/c` 단일 내비 | **THIN** | 모델배정·Monitor폴링·Supervisor·QA·5회게이트는 네이티브 흡수. 남는 코어=Worker의 Karpathy 4규칙 강제계약 + 추천 1개 확정 |\r\n| 2 | `/cc` 병렬 엔진 | **THIN** | 병렬 엔진은 Dynamic Workflows로 하강. 단 Codex AND-게이트 + /cp plan-binding + 한국어/Karpathy 규율은 생존 |\r\n| 3 | `/cp` 계획 엔진 | **THIN** | 실행·목표강제·프리모템은 네이티브(plan mode/goal/workflows) 위임 가능. 디스크 영속 문서 라이프사이클 + 작성시점 Goal 품질게이트는 비대체 |\r\n| 4 | `/cps` START_HERE | **THIN** | 네이티브 /init은 CLAUDE.md만, 라우팅 인덱스 아님. 비파괴 diff 게이트·(Not documented yet) 규율 비대체 |\r\n| 5 | `/cs` 멀티레포 동기화 | **KEEP** | 네이티브가 직접 인정한 공백 — EnterWorktree는 단일레포 멀티워크트리뿐. 워크스페이스 전 레포 sweep 무대체 |\r\n| 6 | `/cu` per-machine 업데이터 | **THIN** | 실행부는 네이티브 패스스루. cross-tool 열거 + staleness 플래깅(native는 'unknown') + multi-select는 비대체 |\r\n| 7 | `/lens-upgrade` | **THIN** | 버전올리기는 네이티브 흡수. 멀티스코프 dedup·stash·자동롤백·origin교정은 무노출 |\r\n| 8 | 발견/추천 레이어(훅) | **THIN** | 실측상 hollow(아래 §4). /command nag-차단 OVERRIDE + 세션 온보딩만 생존 |\r\n| 9 | 에이전트 대시보드(훅) | **THIN** | 쓰기 전용 텔레메트리(reader 0건). 세션 경계 영속 감사로그 + orphan 정합성은 비대체 |\r\n| 10 | plan-manager + board-builder | **THIN** | board-builder=KEEP급(5 호출처, 무대체). plan-manager 무거운 절반은 런타임 호출자 0 |\r\n| 11 | Codex 이종검증 연동 | **KEEP** | cross-vendor 이종검증은 구조적 비대체(네이티브 평가자·워커 전부 Anthropic). 개념층 KEEP / 배관층 THIN |\r\n\r\n**핵심 발견 (관통):** 네이티브 4종 — **Dynamic Workflows**(16동시·adversarial verify, v2.1.154+) + **per-agent 모델 서브에이전트**([sonnet,opus,haiku]) + **`/goal`**(매 턴 Haiku 평가자 재판정, v2.1.139+) + **plan mode** — 이 `/c`·`/cc`·`/cp`의 절차 분량 대부분을 네이티브 프리미티브의 prose 래퍼로 만들었다. 하지만 OBSOLETE 0 — 이유는 네이티브가 전부 **세션 휘발성**이고 **단일(Anthropic) 모델 가족**이며 **Karpathy 계약을 강제하지 않기** 때문.\r\n\r\n---\r\n\r\n## 2. 우선순위 실행목록 (임팩트 × 저비용)\r\n\r\n> 업그레이드·편의 개선을 임팩트/비용으로 랭킹. 각 항목은 `/cr`이 발견 시 `/cp` task로 핸드오프할 후보다.\r\n\r\n| # | 기능 | 조치 | 유형 | 임팩트 | 비용 |\r\n|---|------|------|------|--------|------|\r\n| 1 | codex / `/cc` | Codex 리뷰 게이트를 **`codex exec review --uncommitted --output-schema --ephemeral`**로 전환(bare `codex review` 아님 — exec review라야 schema 동시 노출). awk PASS/FAIL·수동 diff·orphan 의존 제거. 라이브 실측 통과·plan-tier 무의존 | upgrade | high | M |\r\n| 2 | 발견/추천 | UserPromptSubmit **매 메시지 자동제안 폐기**(autoRecommend 기본 off) + 죽은 `KNOWN_PLUGINS=[]` 디스커버리 제거 + CLAUDE.md:51 '60+ known plugins' 드리프트 수정 | deprecate | high | S |\r\n| 3 | `/cu` | vscode-번들 codex(0.137.0-alpha)를 GitHub stable과 비교하는 **오탐('항상 update available')** → `needs_update=null`. `_codex_install_kind`가 이미 vscode 구분 ~3줄 | fix | med | S |\r\n| 4 | codex SoT | `service_tier=priority` → 정식 **`service_tier=fast`+`features.fast_mode=true`**(priority는 레거시 별칭) + `gpt-5.5` 하드코딩 **버전무관 fallback**. SoT 1곳 갱신으로 /cp·/cc 전부 정합 | fix | med | S |\r\n| 5 | plan-board | plan-manager.js의 **런타임 호출자 0인 절반**(generatePlanContent 8개국어 dict·extractGoal·validate·save/loadPlanState) `@deprecated` 격리, 8개국어 dict 릴리스 동기화 의무 제거 | deprecate | med | S |\r\n| 6 | `/c`·`/cc` | Phase 4(Supervisor)+5(QA) 자작 점수제·5회 게이트를 **네이티브 `/goal` emit**으로 위임(/cp v3.7.0 선례). Supervisor/QA spawn 비용 제거 | adopt-native | high | M |\r\n| 7 | `/c`·`/cc` | **Monitor 폴링 에이전트 제거**(haiku 5분, ALWAYS deploy) → background exit 재호출+TodoWrite. 진행보고는 2분+ long-running만 | adopt-native | med | S |\r\n| 8 | 대시보드 | PostToolUse 훅이 `additionalContext`로 직전 Task status/실패사유 **모델 주입**(현 비스키마 필드는 모델에 안 닿음). write→consume 단절 해소 | upgrade | high | S |\r\n| 9 | `/cc`·`/cps` | 작업 종료 시 **자동 commit(+Co-Authored-By)+원격동기화** 기본화(더블게이트+QA 통과 시). **`.gitignore` 존중(시크릿 임의 제외 금지 — 사용자는 민감파일을 의도적으로 버전관리: `feedback_sensitive_files_to_livevil_setting`)**, default 브랜치면 먼저 브랜치, diverged면 보고만 | ergonomics | high | M |\r\n| 10 | `/cc`·`/c` | **헤드리스(cron/TTY없음) 감지 시 AskUserQuestion 폴백**(자동승인 or plan-only 종료). Mac Mini 무인 파이프라인 hang 방지 | ergonomics | med | M |\r\n| 11 | `/cs` | `git-sync-all.sh` `--json` 모드 + diverged/failed 최상단 강조 + SKILL.md:100 'Stop훅 auto-commit' 미구현 암시 제거(stop.js git 동작 0) | fix | med | S |\r\n| 12 | `/cps` | `/cs` 스윕에 **START_HERE 커버리지 체크** 끼워 '진입문서 없는 레포 N개' 일괄 보고+생성(14레포 수동 비현실적) | upgrade | high | M |\r\n| 13 | `/cp` | on-invoke 토큰(**~15.8k, Lens 최대**) 절감 — ORGANIZE/CONVERT·codex-integration·Karpathy 전문 인라인을 별도 참조로 분리, PLAN만 본문 | upgrade | high | M |\r\n| 14 | `/lens-upgrade` | Phase 1+4 정상경로를 `claude plugin marketplace update`+`plugin update --scope`로 위임, Lens는 백업·dedup·검증·롤백·origin교정만 | adopt-native | med | M |\r\n\r\n---\r\n\r\n## 3. 수요 측 — 대화 마이닝 신기능 제안\r\n\r\n> 82세션·954 발화에서 반복/불편/우회 패턴을 추출 → 신기능 제안 → 적대적 검증(근거 약하거나 기존 스킬 중복이면 DROP).\r\n\r\n**관통 테마:** ① claim-vs-reality(보고 전 라이브 미검증 단정 — 최빈 신뢰붕괴) ② 운영 파이프라인 '지금 정상?' 헬스체크 세션마다 반복 ③ 장시간 작업 진행보고 부재('2분마다 보고' 13회+) ④ 다중 세션·머신 핸드오프 부담('Continue from where you left off' 10회+) ⑤ 즉시·끝까지 실행 강박 ⑥ 시크릿 livevil-setting 중앙화.\r\n\r\n> **후속 정정 (2026-06-06, 사용자 리뷰 후):** Pass-1 은 `/ch`·`/cx` 2건을 KEEP 으로 제안했으나, 사용자 검토에서 **둘 다 드롭**으로 정정됐다(아래 ①②). 신기능 제안은 결국 **0건** — Pass-1 이 마이닝 5건 중 3건을 잘랐으나 사실 **5건 모두 잘랐어야 했다.** 대신 수요 측의 진짜 가치는 신기능이 아니라 **반복 명령을 기본값으로 박는 것**(아래 §3.5)으로 재정의됐고 v3.14.0 에 반영.\r\n\r\n### 신기능 제안 — 검토 후 0건 (모두 DROP)\r\n\r\n**① `/ch` 운영 헬스체크 디스패처 — DROP (2026-06-06 정정)**\r\n- Pass-1 제안: 사용자 기존 SoT(런북·체크스크립트·대시보드)를 발견·실행하는 얇은 디스패처.\r\n- **드롭 사유**: 범용 Lens 스킬로 **일반화 불가**. \"정상(healthy)\"의 정의는 레포 도메인마다 다르고 공통 불변식이 0이라(체크 로직이 환원 불가능하게 프로젝트별) — `/cs`(git 불변)·`/cu`(--version 불변)처럼 성립하지 않는다. 일반화 가능한 유일한 형태는 \"레포가 선언한 체크를 실행하는 러너\"인데 그건 이미 `make`/`npm run`/CI 가 하는 일이고, 사용자 14+ 레포에 그 선언 컨벤션이 균일하게 없다. 진짜 반복 실패는 \"구조 부재\"가 아니라 *런북을 무시하고 쿼리 재즉흥*하는 행동 문제 — 메모리 룰(`feedback_livevil_publishing_status_runbook_first`)이 이미 처리.\r\n\r\n**② `/cx` 세션 핸드오프 — DROP (2026-06-06 정정)**\r\n- Pass-1 제안: `initSession()` wipe 를 보존으로 고치고 Stop 훅이 산출물 경로 캡처 + 얇은 reader.\r\n- **드롭 사유**: 전제가 약하다. `initSession()` 의 wipe 는 **버그가 아니라 의도된 동작**일 가능성이 크다(세션마다 대시보드를 새로 시작하는 게 정상) — 그러면 고칠 건 동작이 아니라 *틀린 docstring 한 줄*뿐이다(별건 정정). 핸드오프 가치도 네이티브 `--resume`/`--continue` + `/cp` 의 \"재개 포인트\" 와 겹쳐 고유가치가 얇다. → 새 스킬 불요.\r\n\r\n### §3.5 수요 측의 진짜 가치 — 반복 명령 → 기본값 (v3.14.0 반영)\r\n\r\n신기능이 아니라, 사용자가 *매번 다시 치던 명령*을 스킬 기본 동작으로 박는 것이 실제 사용자-관점 개선이다. 마이닝 근거 → v3.14.0:\r\n- \"커밋하고 푸시해\"(다회) → `autoCommitOnComplete` **기본 on** (안전 레일).\r\n- \"N분마다 보고해\"(13회+) → `/c`·`/cc` 장시간 작업 자동 진행보고 기본.\r\n- \"어디 저장했어?\" → 산출물 풀 경로 자동 보고 기본.\r\n- \"지금 해 / 멀 기다려 / 니가 해\" → 즉시·끝까지 실행, 헤지·떠넘김 금지 기본.\r\n- \"보고 먼저 하고 적용\" → 위험·시각 변경은 보고-먼저 기본.\r\n\r\n### DROP — (Pass-1 원래 3건, 근거 강함)\r\n\r\n- **`/cv` 라이브 검증 게이트** → `/cc`·`/cp`로 MERGE. 문제는 절실하나 capability ~85%가 이미 `/cc` Phase 6 QA(verified=false 차단 + 4채널 라우팅)에 구현됨. 핵심 전제(보고 전 *자동* 게이트)는 invocable skill로 **구조적 불가** — un-invoked 주장에 게이트를 강제하려면 skill이 아니라 harness Stop-hook(settings.json). → `/cc` QA에 '생성물 factuality WebSearch 대조' 한 줄 + `/cp` 어휘 추가로 흡수.\r\n- **progress-pulse(자동 주기보고 훅)** → 빌트인 **`/loop` 중복**(DROP). 핵심 메커니즘이 기술적 불가 + 사용자 본인 메모리가 못박음: \"ScheduleWakeup은 /loop dynamic 컨텍스트 전용, 일반 훅에서 호출 불가\". 해법은 `/loop 2m <status check>`.\r\n- **`/cp` 라이브 임베드 뷰어** → **범위 밖**(DROP). 근거가 잘못된 대상에 붙음(grounded=false) — 인용은 전부 일반 UI 개발 워크플로지 /cp 요청 아님. /cp 핵심 아키텍처 4건 위반(코드 실행 금지·JS 제한·md=SoT·CSS 인라인 금지). 그 공백은 verify+Playwright+ui-ux-pro-max 영역.\r\n\r\n---\r\n\r\n## 4. 검증된 코드 드리프트 / 버그 (별건, 외과 수정 후보)\r\n\r\n감사 중 라이브 실측·소스 정독으로 확인된 사실(추측 아님):\r\n\r\n- **`lib/agent-tracker.js:163-168`** — docstring \"Preserves...\" ↔ 구현은 wipe. (직접 검증 ✅)\r\n- **발견/추천 레이어 hollow** — `KNOWN_PLUGINS=[]`(죽은 레지스트리), 481세션 빈 메모리(`recordSkillUsage` 호출 0), context7/playwright `triggers:[]`, 추천 score=`keyword.length` 노이즈. **CLAUDE.md:51 '60+ known plugins'는 드리프트**(실제 [] 비어있음).\r\n- **`skills/cs/SKILL.md:100`** — 'Stop 훅이 결국 auto-commit' 암시 ↔ `stop.js`는 git 동작 0 (미구현 드리프트).\r\n- **설치 origin 불일치** — 설치 origin=`CreetaCorp/lens` vs 스크립트=`livevil7/creeta-lens` → `/lens-upgrade` origin교정 필요.\r\n- **`/cu` codex 오탐** — vscode 번들(0.137.0-alpha.4) vs GitHub stable(0.137.0) 비교로 '항상 update available'.\r\n- (stale 제안 정정) `hook-utils.js:65`는 이미 `isTTY` 가드 적용됨 — stdin-hang은 해결된 상태.\r\n\r\n---\r\n\r\n## 5. 이 감사와 `/cr` 기능의 관계\r\n\r\n이 Pass 1은 `/cr`(자가 현대화 감사 스킬)이 **주기적으로 자동 생성할 리포트의 양식**이다. `/cr`은 4개 입력축으로 이 리포트를 만든다:\r\n\r\n1. **공급-드리프트** — 라이브 네이티브 능력(probe+web) vs 레지스트리의 \"공백 가정\" → 노후도(KEEP/THIN/OBSOLETE)\r\n2. **공급-업그레이드** — 새 네이티브를 써서 기존 기능을 더 강하게 (§2)\r\n3. **편의(ergonomics)** — 사용자 워크플로 기준 마찰 제거 (§2의 ergonomics 행)\r\n4. **수요-마이닝** — 세션 대화 패턴 → net-new 제안 (§3)\r\n\r\n`/cr` 레지스트리(`docs/rules/capability-assumptions.json`)의 **시드**는 이 감사의 `registry_seed` 11행(네이티브 능력별 gap_closed_signal + signal_method=probe/web/both + false_obsolete_risk)으로 채운다. `.lens/conv-mining/audit-supply.json`·`audit-demand.json`에 전체 원자료 보존.\r\n\r\n**다음 단계:** `/cr` 기능 자체의 구현 계획은 `docs/tasks/2026-06-05-lens-capability-modernization-audit.md` 참조. §2 상위 항목(특히 #1 Codex review, #2 추천기 폐기, #9 자동커밋)은 `/cr`이 아니어도 즉시 착수 가능한 독립 업그레이드다.\r\n","truncated":false,"stale":true},{"id":"2026-05-30-codex-call-deep-fast-upgrade","folder":"history","title":"Codex 호출 업그레이드 — 깊게(xhigh) + 빠르게(priority) + drift/잔재 정리 — 완료","date":"2026-05-30","hasMd":true,"hasHtml":true,"mdPath":"history/2026-05-30-codex-call-deep-fast-upgrade.md","htmlPath":"history/2026-05-30-codex-call-deep-fast-upgrade.html","mdInline":"# Codex 호출 업그레이드 — 깊게(xhigh) + 빠르게(priority) + drift/잔재 정리 — 완료\r\n\r\n**완료일**: 2026-05-30\r\n\r\n## 요약\r\nlens가 codex를 부를 때 항상 가장 깊은 추론(`model_reasoning_effort=xhigh`)과 가능한 한 빠른 처리(`service_tier=priority`)로, 깨짐 없는 본문 수거(`-o`)로 호출하도록 표준 호출을 고정했다. 동시에 문서에 남아 있던 모델 drift(GPT-5.2 표기 → 실제는 gpt-5.5)와 취약한 텍스트 파싱(`^codex$`~`^tokens used$` awk 추출)·숫자 timeout 잔재(`timeout 30`)를 제거했다. 또한 `/cc`의 Claude 역할(Worker·Supervisor·QA)을 opus로 상향하고 Monitor만 haiku로 남겼다. SoT는 `docs/rules/codex-integration.md` 한 곳에서 고치고 `cp`/`cc` SKILL.md는 \"§N 참조\"로 통일했다.\r\n\r\n## 주요 결정 사항\r\n- **SoT 단일화 (Plan A)**: 호출 패턴·파싱·에러처리를 중앙 규칙 `codex-integration.md` 한 곳에서만 고치고, SKILL.md에 흩어진 직접 인용은 \"§4/§5 참조\"로 바꿨다. 외과적 변경 + 버전 전파는 `bump-version.sh`가 11곳을 일괄 처리하므로 수동 편집 대상이 아니다.\r\n- **깊이·속도 우선 (토큰 비용 비고려)**: 사용자 방침에 따라 `gpt-5.5` + `xhigh`(깊게) + `priority`(빠르게) + `-o`(깨짐 없는 수거)로 고정. priority는 부하 시 큐 우선권일 뿐 소규모 작업엔 무효과일 수 있다는 점을 문서에 명시해 \"빨라진다\"는 오해를 방지했다.\r\n- **숫자 timeout 폐기**: codex 호출은 background 병렬이라 느려도 기다리지 않는다. gate에서 ready면 수거, 아니면 degrade하고 Claude가 단독으로 끝까지 진행한다. 영원히 hang해도 Claude를 막지 않으며 세션 종료(Stop 훅)가 orphan을 정리하므로 숫자 timeout이 불필요하다.\r\n- **`-o` 파일명 race 방지**: Phase 0.5·2.4·4.5가 background 병렬이라 같은 임시 파일을 쓰면 덮어쓰기 위험이 있다. `/tmp/codex_<phase>_<무작위>.txt` 고유 파일명 컨벤션을 §5 표준으로 박았다.\r\n- **Claude 역할 모델 상향 (opus 우선)**: substantive 작업(Worker Easy/Medium/Hard, Supervisor, QA)은 전부 opus로 매핑. Monitor만 haiku로 남겼다 — 대시보드 상태 폴링만 하므로 opus의 품질 이득이 0인 유일 예외다.\r\n- **죽은 설명 강등**: `-o`로 본문만 받으면 §5의 \"원본 출력 예시\"가 추출에 더는 안 쓰이므로 삭제 대신 \"참고용 — 추출은 -o 권장\"으로 강등해 오해를 막았다.\r\n\r\n## 변경 파일\r\n- `docs/rules/codex-integration.md` — 중앙 규칙(SoT): §4 표준 호출에 `-m gpt-5.5 -c model_reasoning_effort=xhigh -c service_tier=priority -o` 추가, §5 파싱을 `-o` 본문 수거+고유 파일명 규칙으로 교체, §7 timeout 행/스니펫 제거, 모델 표기 5.2→5.5, 성능 표 갱신\r\n- `skills/cp/SKILL.md` — Phase 0.5/2.4/3.2의 codex 인용을 §4/§5 참조로 통일, timeout 어휘 제거\r\n- `skills/cc/SKILL.md` — Phase 4.5 codex 인용을 §4/§5 참조로 통일 + Model Assignment Table(한글·영문 2곳)·난이도 매핑·ASCII 다이어그램을 opus 상향에 맞게 갱신\r\n- `CHANGELOG.md` — v3.11.0 항목 추가\r\n- `CLAUDE.md` (creeta-lens) — Version feat 1줄 추가\r\n- (일괄) `plugin.json` / marketplace / hooks / SKILL.md 등 11곳 — `bump-version.sh 3.11.0`\r\n\r\n## 테스트 & 검증\r\n✅검증표 7개 항목 중 자동 판정 5개(#1·#2·#3·#6·#7) 전부 통과:\r\n- **#1** 표준 호출 라인에 `-m gpt-5.5` + `model_reasoning_effort=xhigh` + `service_tier=priority` + `-o` 모두 존재\r\n- **#2** 세 파일의 활성 코드에 취약 파싱(`tokens used`, `awk '/^codex/'`)·`timeout 30` 잔재 0건 (설명 텍스트 제외)\r\n- **#3** 세 파일에서 모델 지칭 `5.2` 0건 (Phase 번호와 무관)\r\n- **#6** `cc/SKILL.md`에서 Worker(Easy/Medium/Hard)·Supervisor·QA = opus, Monitor만 haiku로 표기\r\n- **#7** `cp/SKILL.md` Phase 3.1 pre-mortem이 기존대로 opus 유지(다운그레이드 없음)\r\n\r\n배포·설치 검증(#5)도 통과: commit `b7c195f` + tag `v3.11.0` push → livevil7/creeta-lens(= CreetaCorp/lens, 동일 레포), `scripts/upgrade.sh`로 캐시 3.11.0 설치 및 `plugin list` v3.11.0 확인.\r\n\r\ncodex 미응답 degrade(#4, manual)는 본 작업 진행 중 실증됐다: Phase 0.5 Codex 독립조사가 sandbox 정책으로 `codex exec --help` 차단 + 한글 출력 mojibake로 degrade했고, Claude가 `-o` 동작을 직접 실측 검증(최종 답변 본문만 파일로 떨굼 확인)하며 단독으로 작업을 완료했다 — 본 작업이 인코딩하려던 graceful degrade의 실증 사례다.\r\n\r\n## 추가 사항\r\n- **머신 간 전파**: `bump-version.sh`는 이 레포만 갱신한다. 이 PC는 Claude Code 재시작 후 3.11.0이 활성화되며(작업 당시 세션은 3.10.0 캐시), Mac Mini 등 다른 머신은 push 후 `/lens-upgrade`로 반영해야 한다. 검증 #5는 이 PC 한정이다.\r\n- **호환성 fallback (Plan B, 미발동)**: `service_tier=priority` 또는 `-o`가 다른 codex 빌드/계정에서 거부·부재면 부가분만 빼고 핵심(xhigh 깊이 + 모델 drift 제거)은 살리는 경로를 문서화했으나, 이 머신에서는 실호출 검증을 통과해 발동하지 않았다.\r\n- **후속 진화 (별도, 미완 아님)**: 이후 v3.19.0에서 `priority` → `service_tier=fast`, `xhigh` → 입력 규모 분기(소규모 xhigh / 대규모 high)로 진화했다. 이는 본 작업의 후속 진화이지 미완 항목이 아니다.\r\n","truncated":false,"stale":true},{"id":"2026-05-27-cps-start-here-and-cp-done-sweep","folder":"history","title":"/cps (START_HERE 생성기) + /cp done 기존 task 전수 정리 — 완료","date":"2026-05-27","hasMd":true,"hasHtml":true,"mdPath":"history/2026-05-27-cps-start-here-and-cp-done-sweep.md","htmlPath":"history/2026-05-27-cps-start-here-and-cp-done-sweep.html","mdInline":"# /cps (START_HERE 생성기) + /cp done 기존 task 전수 정리 — 완료\n\n**완료일**: 2026-05-27 (대상: v3.10.0 — 소스 반영 완료, git tag/push는 사용자 release 단계)\n\n## 요약\n\nlens에 신규 skill `/cps`를 추가했다. 어떤 레포든 `/cps` 한 번이면 실제 docs를 스캔해 `docs/START_HERE.md`(레포 first-read 진입점 + 질문 라우팅)를 생성/갱신한다. 함께 `/cp done`을 강화해, 새 task만이 아니라 `docs/tasks/`에 쌓인 기존 task까지 전수 재평가해 완료분을 일괄 아카이브 제안하도록 했다. (이 sweep으로 본 task와 방치 2건을 정리한 것이 첫 실사용.)\n\n## 주요 결정 사항\n\n- **SKILL.md-only + 강제 evidence step** (Plan A): 인터랙티브 스킬이라 Claude의 Glob/Read가 곧 ground-truth. Codex가 권한 결정론적 `lib/start-here-builder.js`는 허구 경로 재발 시의 Plan B로 격하 — Plan B 미발동(허구 경로 0).\n- **비파괴 게이트**: 기존 START_HERE는 diff+승인 후에만 갱신. CLAUDE.md 포인터는 없을 때만 1줄 조건부 주입(있으면 무변경, CLAUDE.md 신규 생성 안 함). docs/ 없으면 생성.\n- **허구 경로 0 원칙**: Glob 미확인 경로 나열 금지, 근거 부족은 `(Not documented yet)`.\n- **/cp done 강한 완료 신호**: 출시 기록(CHANGELOG/CLAUDE.md Version)이 확인되면 체크박스 미체크·재개포인트 잔존이어도 완료 추정으로 승격(최종 아카이브는 사용자 승인). 그 외 신호 상충 시 안전쪽(진행중/수동확인) 우선. 자동삭제 금지.\n- **surgical**: DONE 모드 Phase 1만 강화, Phase 2~4 불변.\n\n## 변경 파일\n\n- `skills/cps/SKILL.md` — 신규 (5단계 절차)\n- `skills/cp/SKILL.md` — DONE 모드 Phase 1 강화 (전수 재평가 3분류 + 강한 완료 신호)\n- `.claude-plugin/{plugin,marketplace}.json`, `hooks/`, `skills/{c,cc,cp,cs}/SKILL.md`, `CLAUDE.md`, `README.md`, `CHANGELOG.md` — v3.9.0 → v3.10.0 범프 (11곳) + /cps 문서화\n- `docs/START_HERE.md` — 신규 (dogfood 산출물)\n\n## 테스트 & 검증\n\n- /cc 병렬 실행 (Worker #1 opus: cps, Worker #2 sonnet: cp DONE). 품질 게이트 더블 검증: Supervisor iter1 FAIL(72) → iter2 PASS(88), Codex iter1 FAIL(7건) → iter2 PASS. Codex 단독 발견 2건(CLAUDE.md 모순, START_HERE 자기참조)이 이종 검증 가치 입증.\n- dogfood: `docs/START_HERE.md` 생성 → 나열 경로 16/16 실존(허구 0, `ls` 대조). CLAUDE.md 포인터는 이미 참조 존재로 skip. `/cp done` 분류 검증(2026-05-16 → 완료추정, 출시 기록 근거).\n- Goal 4/4 ✓.\n\n## 추가 사항\n\n- **남은 release (사용자)**: `git commit + tag v3.10.0 + push` → `/lens-upgrade` 후 라이브 `/cps`·강화된 `/cp done` 사용 가능. (현재 소스만 반영, 설치 캐시는 3.9.0)\n- dogfood에서 tie-break이 출시된 옛 task를 완료추정에서 빼는 문제를 발견 → 사용자 결정으로 \"출시 기록=강한 완료 신호\" 예외 추가.\n- 계획 문서(Plan A/B + 듀얼 합성 + Pre-mortem): 이 history의 원본 task.\n","truncated":false,"stale":false},{"id":"2026-05-26-goal-human-centric-codex-dual-verification","folder":"history","title":"사람 중심 Goal 2층 구조 + Codex 듀얼 검증 — 완료","date":"2026-05-26","hasMd":true,"hasHtml":true,"mdPath":"history/2026-05-26-goal-human-centric-codex-dual-verification.md","htmlPath":"history/2026-05-26-goal-human-centric-codex-dual-verification.html","mdInline":"---\r\nname: goal-human-centric-codex-dual-verification\r\nplan_id: 2026-05-26-goal-human-centric-codex-dual-verification\r\ndescription: Lens v3.8.0+v3.9.0 — 사람 중심 Goal 2층 구조 + Codex 공동 조사·더블 검증 (한 릴리스로 배포) 완료\r\nstatus: done\r\ncompleted: 2026-05-26\r\n---\r\n\r\n# 사람 중심 Goal 2층 구조 + Codex 듀얼 검증 — 완료\r\n\r\n**완료일**: 2026-05-26 · **릴리스**: v3.9.0 (v3.8.0 작업 포함, 별도 릴리스 없이 묶음)\r\n\r\n## 요약\r\n\r\n`/cp` 의 Goal 을 **사람 중심 2층 구조**로 재설계하고(v3.8.0), Codex 를 \"Claude 결과의 부분 검토자\"에서 **공동 조사자·공동 검증자**로 격상(v3.9.0)했다. 두 작업은 한 세션에서 연속 진행되어 **v3.9.0 한 릴리스**로 묶여 배포됐고, `/lens-upgrade` 로 이 PC 설치본(3.6.5 → 3.9.0)까지 반영했다.\r\n\r\n- **v3.8.0**: Goal 문장에서 개발 검증어(`201`·`user row` 등)를 추방하고, 🎯 목표=\"무엇이 가능해지는가\"(사람 언어)와 ✅ 검증=\"이게 됐다는 증거\"(기계 언어)로 2층 분리. 기존엔 사용자가 자기 계획서를 읽고도 함수·HTTP 코드 때문에 판단할 수 없던 문제 해결.\r\n- **v3.9.0**: `/cp` 는 Claude‖Codex 병렬 독립 조사(Phase 0.5) + 합성·교차검증(Phase 2.4), `/cc` 는 매 반복 Codex 코드리뷰 게이트(Phase 4.5)로 모든 코드 변경을 이종 모델 더블 검증.\r\n\r\n## 주요 결정 사항\r\n\r\n- **Goal=사람 언어, 검증=기계 언어 (2층 완전 분리)** — 사용자 명시 요청(\"무슨 함수가 어쩌고 하면 내가 알아듣겠어?\"). 기술 토큰은 목표 문장에서 reject → ✅검증 표로 강제 이동. 이 매핑이 게이트가 됨: \"사람 목표 → 검증 ≥1행\" 매핑 안 되면 = 모호 = reject.\r\n- **검증어는 검증 표에만** (사용자 선택) — Goal 옆 괄호 병기·완전 제거 대신 \"검증 표에만 남긴다\" 선택. Goal 문장은 100% 사람 언어.\r\n- **더블 검증은 항상(trivial만 skip)** (사용자 선택) — 비용·속도보다 안전망 우선. trivial(오타·한 줄)·비-코드는 skip, Codex 부재/실패는 graceful degrade(블로킹 금지).\r\n- **/cc 형태 = Claude 구현 → Codex 리뷰 게이트** (사용자 선택) — 독립 구현 후 병합(머지 충돌·비용 큼) 대신 리뷰 루프. Supervisor pass + Codex pass 둘 다여야 진행.\r\n- **/cp 분기 = Claude가 근거와 함께 선택·기록** (사용자 선택) — 객관 판정 불가한 분기는 trade-off 근거와 함께 Claude가 결정하고 `🔀 듀얼 합성` 섹션에 기록(사용자가 승인 게이트에서 확인).\r\n- **plan-manager.js 전면 동기화** (사용자 선택) — 런타임은 SKILL.md 기반(코드 생성기는 백업)이지만, 백업 생성기·extractGoal·8-lang dict 까지 신구조로 일치시켜 latent drift 제거.\r\n- **Pre-mortem 중복 호출 회피** — Phase 0.5 에서 Codex 조사가 돌면 Phase 3 Codex 호출 skip(quota 절약), Opus 단독으로 통합안 점검.\r\n- **산출물 링크 풀 경로 강제** (사용자 요청) — 보고 시 bare 파일명 금지, 프로젝트 루트 기준 전체 경로 클릭 링크.\r\n- **v3.8.0 별도 릴리스 안 함** — 미커밋 상태에서 v3.9.0 작업이 이어져, 두 기능셋을 v3.9.0 한 커밋·태그로 묶음. CHANGELOG 는 [3.8.0]·[3.9.0] 항목 분리 유지.\r\n\r\n## 변경 파일 (commit `b27b2a6`, 13개)\r\n\r\n- **스킬**: `skills/cp/SKILL.md` (Phase 0 2층·0.0 인터뷰·0.2 서브골·0.5 Codex 조사·2.4 듀얼 합성·2.5 템플릿·5.0 게이트·핸드오프·절대규칙), `skills/cc/SKILL.md` (핸드오프 4칼럼·Phase 4.5 Codex 리뷰·Phase 5 더블 게이트·QA auto/manual·절대규칙)\r\n- **라이브러리**: `lib/plan-manager.js` (8-lang dict·generatePlanContent 2층+종류 칼럼·extractGoal 다국어·dualSynthesis 렌더링·JSDoc)\r\n- **규칙 문서**: `docs/rules/codex-integration.md` (사용지점 4곳·§8.5 듀얼 검증 호출 패턴)\r\n- **manifest/문서**: `.claude-plugin/plugin.json`·`marketplace.json`, `CLAUDE.md`, `CHANGELOG.md`, `README.md`, `hooks/hooks.json`·`session-start.js`, `skills/c|cs/SKILL.md` (버전 bump 3.7.0→3.8.0→3.9.0)\r\n\r\n## 테스트 & 검증\r\n\r\n- **plan-manager.js 실측** (`node -e`) — generatePlanContent(ko)가 🎯 목표(plain bullet)+✅검증(종류 칼럼)+🔀 듀얼 합성 생성 확인, `validatePlanStructure` = `{valid:true}`, `extractGoal` 왕복(사람 목표→successCriteria) 확인.\r\n- **레거시 호환** — 옛 체크박스 구조(deliverables+성공기준) 문서도 extractGoal 이 그대로 파싱 확인. verification 미제공 시 outcomes 로 manual 행 폴백.\r\n- **릴리스 체인** — `bump-version.sh 3.9.0` (11/11 파일), commit `b27b2a6` + tag `v3.9.0` + push(master+태그). 옛 로컬 태그 충돌(v1.9.0/v2.0.0)은 이번 릴리스와 무관.\r\n- **`/lens-upgrade` 실측** — 마켓플레이스 v3.9.0 감지 → `claude plugin install lens@CreetaCorp` → 검증: registry 1 entry = v3.9.0, `claude plugin list` 확인.\r\n- **Karpathy 규칙 보존** — 새 3.9.0 캐시의 c/cc/cp SKILL.md 전부 `MUST FOLLOW` 마커 포함 확인(직접 grep — 검증 스크립트는 stale).\r\n\r\n## 추가 사항\r\n\r\n- **Claude Code 재시작 필요** — 현재 세션은 캐시 3.6.5 로 동작(skill 로드 시점). 재시작해야 v3.9.0 로드.\r\n- **옛 로컬 태그 정리 완료** — v1.3.0~v2.0.0 9개 삭제(로컬 한정, 원격 보존 → `git fetch --tags` 복구 가능).\r\n- **검증 스크립트 stale** — `livevil-setting/scripts/sync-karpathy-rules.ps1` 가 하드코딩 `lens\\3.3.3\\skills` 경로 + `~/.claude/CLAUDE.md` 의 `MUST FOLLOW` 마커 불일치로 false [MISS] 발생. 별도 수정 필요(미처리).\r\n- **stale task 2건 잔존** — `docs/tasks/2026-05-16-cp-goal-first-overhaul.md`(v3.4 shipped), `2026-05-20-cp-html-reports-board.md`(v3.6.0 shipped)는 이번에도 archive 안 함.\r\n- **미저장 메모리** — \"목표·설명은 사람 언어로\" + \"산출물 풀 링크\" 선호는 durable 하지만 메모리에 미기록(사용자 보류).\r\n","truncated":false,"stale":true},{"id":"2026-05-21-cp-board-redesign","folder":"history","title":"Lens v3.6.0 — /cp Taskboard 전면 재설계 — 완료","date":"2026-05-21","hasMd":true,"hasHtml":true,"mdPath":"history/2026-05-21-cp-board-redesign.md","htmlPath":"history/2026-05-21-cp-board-redesign.html","mdInline":"# Lens v3.6.0 — /cp Taskboard 전면 재설계 — 완료\r\n\r\n**완료일**: 2026-05-21\r\n\r\n## 요약\r\n\r\n`/cp`의 문서 보드를 전면 재설계해 **v3.6.0**으로 배포했다. `board-builder.js`가 `docs/{tasks,history,rules}` 3폴더의 `.md`+`.html`을 직접 인덱싱해 단일 라이트 테마 `board_<repo>.html`을 생성하고, html이 있는 문서는 slide-over iframe으로, md-only 문서는 원본 텍스트 + \"Convert to HTML\" 버튼(Claude 재생성 요청)으로 보여준다. `docs/reports/` 중간단계는 폐지(비파괴).\r\n\r\n## 주요 결정 사항\r\n\r\n- **전환 버튼 = Claude 재생성 요청**: 정적 `file://`는 폴더 읽기·Claude 호출·파일 쓰기가 모두 불가하므로, 버튼은 `/cp html docs/<경로>` 명령을 클립보드에 복사하고 사용자가 Claude Code에 붙여넣어 실행한다. 슬라이드 데크 품질은 Claude 재구성으로만 가능.\r\n- **전면 재설계 + 비파괴**: `reports/` 폐지, 3폴더 직접 인덱싱. 단 기존 `reports/`·`board.html`은 삭제하지 않음(다른 repo 호환).\r\n- **보드 기본 생성**(opt-in 해제), 파일명 `board_<repo>.html`.\r\n- **XSS 차단 = escape + `textContent`만**: md를 절대 `innerHTML`/파싱하지 않음 → 마크다운 라이브러리 불필요(단순성).\r\n- **디자인**: 초기 다크/사이드바 버전을 사용자가 반려 → `livevil-contents`의 기준 보드(라이트·3열 카드·slide-over)를 명시적 베이스로 클론. Rules 열은 보라 액센트로 \"참조 문서\" 구분.\r\n\r\n## 변경 파일\r\n\r\n- `lib/board-builder.js` — schema v3 재작성(3폴더 스캔, md inline·40KB 캡·stale 해시) + `$` replace 버그 픽스(함수 치환)\r\n- `templates/board.template.html` — 라이트 3열 + slide-over + 전환버튼/실패 모달\r\n- `skills/cp/SKILL.md` — CONVERT 모드(`/cp html`) 신설 + PLAN/DONE html 위치(reports/→폴더 옆) + 보드 기본 생성\r\n- `templates/report-conversion-spec.md` — `../_shared.css` + beside-md 위치\r\n- `lens.config.json` — `buildBoard: true`\r\n- `.claude-plugin/{plugin,marketplace}.json`, `CLAUDE.md`, `README.md`, `CHANGELOG.md` — v3.6.0\r\n\r\n## 테스트 & 검증\r\n\r\n- `node lib/board-builder.js` → `19 docs (tasks=3 history=11 rules=5)` 콘솔 출력\r\n- 브라우저(localhost http) 검증: 라이트 3열 카드 그리드, html 클릭→슬라이드 데크 iframe, md-only 클릭→원본+Convert 버튼(클립보드 토스트 `/cp html docs/...`), 콘솔 에러 0\r\n- XSS 픽스처(`<script>`, `<\/script>` breakout) → 보드 내 raw `<\/script>`=1(보드 자체뿐), 픽스처는 `<\\/` escape + textContent로 미실행 확인\r\n- **버그 발견·수정**: `tpl.replace('{{BOARD_DATA}}', payload)`가 md의 `` $` ``(codex-integration.md)를 replace 특수패턴으로 해석 → 템플릿 누출로 JSON 깨짐(콘솔 `Invalid or unexpected token`). 함수 치환 `() => payload`로 픽스. 브라우저 검증이 아니었으면 못 잡았을 통합 버그.\r\n- 배포: commit `c48fcf8` + tag `v3.6.0` → `origin(livevil7/creeta-lens)` push → `/lens-upgrade` exit 0 → `claude plugin list` = **v3.6.0**\r\n\r\n## 추가 사항\r\n\r\n- 새 스킬은 **Claude Code 재시작** 후 로드됨(현 세션은 v3.5.0 스킬로 동작 중에 작업).\r\n- 캐시 `3.5.0`/`3.3.1`은 활성 세션이라 보존됨 — 재시작 후 다음 업그레이드 시 정리.\r\n- **보류 작업**: `creeta-homepage/do
