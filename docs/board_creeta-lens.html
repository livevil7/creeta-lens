n> Plan ID: plan_m3g02d_7f2a\n\n---\n\n## 1. 요청사항\n\nLens 플러그인의 문서 작성 기술을 고도화한다.\n3개 에이전트(code-review, bkit-templates, phase-2-convention) 병렬 분석 결과를 기반으로\n구체적인 코드 변경과 파일 추가를 실행한다.\n\n### 분석 요약 (종합 점수: 65/100)\n\n| 카테고리 | 현재 상태 | 목표 |\n|----------|----------|------|\n| 문서 생성 엔진 | LLM 프롬프트 100% 의존 | plan-manager.js에 생성/파싱/검증 함수 추가 |\n| 메타데이터 | 자유 텍스트 blockquote | YAML frontmatter 구조화 |\n| PDCA 커버리지 | Plan + Do만 존재 | Plan + Do + Check + Act 완성 |\n| 합성 결과 저장 | 세션 종료 시 소멸 | `.lens/results/`에 파일 저장 |\n| 템플릿 관리 | SKILL.md에 하드코딩 | `templates/` 별도 디렉토리로 분리 |\n| 다국어 | \"user's language\" 한 줄 | 3단계 우선순위 규칙 + slug 유니코드 지원 |\n\n---\n\n## 2. 선행조건\n\n- [x] 3개 에이전트 병렬 분석 완료 (code-review, bkit-templates, phase-2-convention)\n- [x] `docs/DOCUMENT-CONVENTIONS.md` 컨벤션 문서 작성 완료\n- [x] 현재 코드베이스 구조 파악 완료\n\n---\n\n## 3. 작업 범위\n\n### Phase 0: 즉시 적용 (SKILL.md 텍스트 수정만)\n\n코드 변경 없이 프롬프트 개선만으로 효과를 볼 수 있는 항목.\n\n### Phase 1: 단기 코어 개선 (plan-manager.js + 새 파일)\n\n문서 생성의 핵심 엔진을 프로그래밍적으로 보장하는 코드 추가.\n\n### Phase 2: 중기 구조 변경 (템플릿 분리 + 새 문서 유형)\n\nPDCA 사이클 완성과 템플릿 외부화.\n\n> Phase 3(장기: 문서 체인 자동 연결, PDCA Cycle Index)는 이번 계획서 범위 밖.\n\n---\n\n## 4. 실행 계획\n\n### Task 1: `/cp` SKILL.md 품질 기준 강화 [Phase 0]\n\n**대상 파일**: `skills/cp/SKILL.md`\n\n**변경 내용**:\n\n1. 다국어 처리 규칙 명확화 (110행 부근)\n   - 현재: \"Keep both headers (English / Korean) as shown\"\n   - 변경: 3단계 우선순위 규칙 추가\n     ```\n     언어 결정 순서:\n     1. lens.config.json의 defaultPlanLanguage (설정값 있으면 최우선)\n     2. 사용자 메시지 언어 자동 감지\n     3. 폴백: English\n\n     헤더 형식: \"영어 / {감지된 언어}\" (예: Task / 要請事項)\n     YAML 키, 상태 enum은 항상 영어\n     ```\n\n2. 품질 기준(Self-Check) 추가\n   - Plan 필수 섹션 7개 중 1개라도 빠지면 생성 실패로 판단\n   - 구체성 기준: \"기능 구현\" (나쁨) vs \"UserService.login()에 rate limiting 추가\" (좋음)\n   - AI 셀프 체크리스트 6항목 추가\n\n3. 조건부 섹션 지시 추가\n   - Risks 섹션: 실질적 위험이 없는 단순 작업에서는 \"해당 없음\" 허용\n   - Prerequisites 섹션: 선행조건 없으면 생략 가능\n\n4. 합성 포맷 참조 통일\n   - Phase 6의 합성 지시를 `/cc`의 Synthesis 포맷 참조로 교체\n   - \"합성 결과는 /cc의 Synthesis 포맷(Points of Agreement, Conflicts, Next Steps)을 따른다\"\n\n**예상 변경량**: ~40줄 추가/수정\n\n---\n\n### Task 2: `generateSlug()` 유니코드 확장 [Phase 0]\n\n**대상 파일**: `lib/plan-manager.js` (66-85행)\n\n**변경 내용**:\n\n```javascript\n// 현재 (라틴 확장 문자 제거됨)\n.replace(/[^a-z0-9가-힣ぁ-んァ-ヶー一-龥\\s-]/g, '')\n\n// 변경 (모든 유니코드 Letter 허용)\n.replace(/[^\\p{L}\\p{N}\\s-]/gu, '')\n```\n\n**예상 변경량**: 1줄\n\n---\n\n### Task 3: plan-manager.js 문서 생성 엔진 확장 [Phase 1]\n\n**대상 파일**: `lib/plan-manager.js`\n\n**추가 함수 4개**:\n\n| 함수 | 역할 | 입력 → 출력 |\n|------|------|------------|\n| `generatePlanContent(planData)` | 템플릿 + 데이터 → 마크다운 문자열 | Object → String |\n| `parsePlanFrontmatter(filePath)` | 마크다운 → YAML frontmatter 객체 | String → Object |\n| `updatePlanStatus(filePath, newStatus)` | 상태 업데이트 (frontmatter + plan-state.json 동기화) | (String, String) → Boolean |\n| `validatePlanStructure(content)` | 필수 섹션 존재 여부 검증 | String → {valid, missing[]} |\n\n**YAML frontmatter 스키마**:\n```yaml\n---\nid: plan_m3g02d_7f2a\ntype: plan\nversion: 1\ncreated: 2026-03-02T13:13:00+09:00\nupdated: 2026-03-02T13:13:00+09:00\nstatus: draft\ngenerator: lens/plan\nlanguage: ko\nparent: null\nrefs: []\ntags: []\n---\n```\n\n**plan-state.json을 단일 원천(SSOT)으로 지정**:\n- frontmatter의 `status`는 파일 생성 시점의 스냅샷 (읽기 전용)\n- 상태 변경은 반드시 `updatePlanStatus()`를 통해 JSON → frontmatter 순서로 반영\n- 이중 원천 문제 해소\n\n**예상 변경량**: ~120줄 추가\n\n---\n\n### Task 4: `/cc` 합성 결과 파일 저장 [Phase 1]\n\n**대상 파일**: `skills/cc/SKILL.md`, `lens.config.json`\n\n**변경 내용**:\n\n1. `lens.config.json`에 옵션 추가:\n   ```json\n   \"saveSynthesisResults\": true,\n   \"resultsDir\": null\n   ```\n\n2. `/cc` SKILL.md Phase 6 이후에 저장 지시 추가:\n   ```\n   Phase 6.5: Save Results (선택적)\n   lens.config.json의 saveSynthesisResults가 true이면:\n   - .lens/results/synth-{YYYY-MM-DD}-{slug}.md에 합성 결과 저장\n   - YAML frontmatter 포함 (type: synthesis)\n   ```\n\n3. `.lens/results/` 디렉토리를 `session-start.js`에서 자동 생성\n\n**예상 변경량**: cc/SKILL.md ~20줄, config ~2줄, session-start.js ~3줄\n\n---\n\n### Task 5: 템플릿 외부 파일 분리 [Phase 2]\n\n**새로 생성할 파일**:\n\n```\nlens/\n└── templates/\n    ├── plan.template.md          # /cp 작업계획서 템플릿\n    ├── execution-result.template.md  # 실행 결과 템플릿\n    ├── synthesis.template.md     # /cc 합성 결과 템플릿\n    └── README.md                 # 템플릿 사용법 + 변수 목록\n```\n\n**변경할 파일**:\n- `skills/cp/SKILL.md`: 하드코딩된 템플릿 → \"templates/plan.template.md 참조\" 지시로 교체\n- `skills/cc/SKILL.md`: 합성 포맷 → \"templates/synthesis.template.md 참조\" 지시로 교체\n\n**템플릿 변수 규칙**:\n- `{variable_name}`: 단순 치환 (현행 유지)\n- `{variable_name|default:값}`: 기본값 지원 (Tier 2)\n- `{?section_name}...{/section_name}`: 조건부 섹션 (내용 있을 때만 렌더링)\n\n**예상 변경량**: 새 파일 4개, 기존 파일 2개 수정\n\n---\n\n### Task 6: DOCUMENTATION-GUIDE.md 정리 [Phase 0]\n\n**대상 파일**: `docs/DOCUMENTATION-GUIDE.md`\n\n**변경 내용**:\n- 섹션 9 \"현재 상태 진단\" (331-366행) 전체 삭제\n  - 이유: v1.5.0 시점 스냅샷이 남아 있어 규범 문서의 성격과 불일치\n  - 상태 추적은 GitHub Issues로 이동\n- 섹션 1.2 버전 참조 파일 목록에 `templates/` 디렉토리 추가\n\n**예상 변경량**: ~35줄 삭제, ~5줄 추가\n\n---\n\n### Task 7: 에러 핸들링 강화 [Phase 1]\n\n**대상 파일**: `lib/plan-manager.js`\n\n**변경 내용**:\n\n1. `savePlanState()`, `loadPlanState()`의 빈 catch 블록에 에러 로깅 추가:\n   ```javascript\n   // 현재\n   } catch { return false; }\n\n   // 변경\n   } catch (err) {\n     console.error(`[lens] plan-state save failed: ${err.message}`);\n     return { success: false, error: err.message };\n   }\n   ```\n\n2. `MAX_PLANS_RETAINED` 정리를 `createdAt` 기반 정렬로 변경:\n   ```javascript\n   // 현재: Object.keys() 순서 의존\n   // 변경: createdAt 타임스탬프 기준 정렬 후 삭제\n   ```\n\n**예상 변경량**: ~15줄 수정\n\n---\n\n## 5. 기대 결과\n\n- [ ] `/cp` 생성 문서에 YAML frontmatter가 포함되어 프로그래밍적 파싱 가능\n- [ ] `generateSlug()`가 프랑스어/독일어 등 라틴 확장 문자를 보존\n- [ ] `/cc` 합성 결과가 `.lens/results/`에 자동 저장 (설정 시)\n- [ ] Plan 문서에 품질 기준이 적용되어 필수 섹션 누락 방지\n- [ ] 템플릿이 SKILL.md에서 분리되어 독립적으로 수정 가능\n- [ ] DOCUMENTATION-GUIDE.md에서 오래된 진단 정보 제거\n\n**성공 기준**: 위 6개 항목 모두 달성 + 기존 `/c`, `/cc`, `/cp` 동작에 regression 없음\n\n---\n\n## 6. 위험 요소\n\n| # | Risk | 심각도 | 완화 방안 |\n|---|------|--------|----------|\n| 1 | SKILL.md 수정 후 LLM이 새 지시를 무시하거나 오해석 | H | 변경 후 실제 `/cp` 실행으로 검증 |\n| 2 | `plan-manager.js` 변경 시 기존 plan-state.json 호환성 깨짐 | M | 기존 스키마를 하위 호환으로 확장 (필드 추가만, 삭제 없음) |\n| 3 | 템플릿 분리 후 SKILL.md에서 참조 경로 오류 | M | 상대 경로 대신 `${PLUGIN_ROOT}/templates/` 사용 |\n\n---\n\n## 7. 실행 방식\n\n- **Mode**: Sequential (Task 1~7 순차 실행)\n- **실행 스킬 수**: 수동 코드 편집 (스킬 호출 불필요)\n- **예상 범위**: 중간 — 7개 Task, 약 200줄 코드 변경 + 4개 새 파일\n\n---\n\n## 실행 순서\n\n```\nPhase 0 (즉시)\n  Task 1: /cp SKILL.md 품질 기준 강화\n  Task 2: generateSlug() 유니코드 확장\n  Task 6: DOCUMENTATION-GUIDE.md 정리\n\nPhase 1 (단기)\n  Task 3: plan-manager.js 문서 생성 엔진 확장\n  Task 4: /cc 합성 결과 파일 저장\n  Task 7: 에러 핸들링 강화\n\nPhase 2 (중기)\n  Task 5: 템플릿 외부 파일 분리\n```\n\n---\n\n**Status**: Draft\n","truncated":false,"stale":false},{"id":"2026-03-02-creet-plugin-analysis","folder":"history","title":"2026-03-02 Lens 플러그인 설치/버전관리 문제 분석 보고서","date":"2026-03-02","hasMd":true,"hasHtml":false,"mdPath":"history/2026-03-02-creet-plugin-analysis.md","htmlPath":null,"mdInline":"# 2026-03-02 Lens 플러그인 설치/버전관리 문제 분석 보고서\n\n## 1. 요약\n\nLens 플러그인(`lens@CreetaCorp`, v1.7.0)의 마켓플레이스 등록 구조를 Anthropic 공식 플러그인(`claude-plugins-official`) 및 bkit(`popup-studio-ai`)와 비교 분석한 결과, **3가지 구조적 문제**를 확인함.\n\n---\n\n## 2. 3개 마켓플레이스 비교\n\n### 2-1. known_marketplaces.json (마켓플레이스 등록 방식)\n\n| 항목 | Anthropic 공식 | bkit | Lens |\n|------|---------------|------|-------|\n| source 타입 | `\"github\"` | `\"github\"` | **`\"git\"`** |\n| 참조 방식 | `repo: \"anthropics/claude-plugins-official\"` | `repo: \"popup-studio-ai/bkit-claude-code\"` | **`url: \"...lens.git\"`** |\n| 자동 업데이트 | 기본 활성화 | 수동 | 수동 |\n\n**문제 #1**: Lens의 `\"source\": \"git\"`은 Claude Code 공식 스키마에 정의되지 않은 값.\n- 공식 유효 값: `\"github\"`, `\"url\"`, `\"npm\"`, `\"pip\"`\n- `\"git\"`이 실제로 동작하더라도 비공식이라 향후 업데이트에서 동작 보장 안됨\n- `\"github\"` 타입은 GitHub API를 사용해 최적화된 다운로드 (tarball), `\"url\"`은 `git clone` 사용\n\n```json\n// 현재 (비공식)\n\"CreetaCorp\": {\n  \"source\": {\n    \"source\": \"git\",\n    \"url\": \"https://github.com/CreetaCorp/lens.git\"\n  }\n}\n\n// 수정안 A: github 타입 (권장)\n\"CreetaCorp\": {\n  \"source\": {\n    \"source\": \"github\",\n    \"repo\": \"CreetaCorp/lens\"\n  }\n}\n\n// 수정안 B: url 타입 (공식이지만 차선)\n\"CreetaCorp\": {\n  \"source\": {\n    \"source\": \"url\",\n    \"url\": \"https://github.com/CreetaCorp/lens.git\"\n  }\n}\n```\n\n### 2-2. marketplace.json (플러그인 카탈로그 구조)\n\n| 항목 | Anthropic 공식 | bkit | Lens |\n|------|---------------|------|-------|\n| 마켓 repo | `anthropics/claude-plugins-official` | `popup-studio-ai/bkit-claude-code` | `CreetaCorp/lens` |\n| 플러그인 참조 | `\"./plugins/commit-commands\"` (상대경로) | `{ source: \"url\", url: \"...bkit-claude-code.git\" }` | `{ source: \"url\", url: \"...lens.git\" }` |\n| 마켓=플러그인 동일? | 아니오 (카탈로그 repo ≠ 플러그인 코드) | **부분적** (bkit 마켓 repo = bkit 플러그인 repo) | **완전 동일** |\n| 플러그인 수 | 30+ | 2 (bkit, bkit-starter) | 1 (lens) |\n\n**문제 #2**: Lens의 마켓플레이스 repo와 플러그인 repo가 완전히 동일한 repo.\n\n이게 문제인 이유:\n- 마켓플레이스 = 카탈로그 (어떤 플러그인들이 있는지 목록)\n- 플러그인 = 실제 코드 (skills, hooks 등)\n- 동일 repo면: marketplace.json이 **자기 자신을 가리킴** → 순환 참조\n\n```\nLens 현재:\n  CreetaCorp/lens (repo)\n    ├── .claude-plugin/marketplace.json  → \"lens\" plugin source: lens.git (자기 자신)\n    ├── skills/c/SKILL.md\n    ├── skills/cc/SKILL.md\n    └── skills/cp/SKILL.md\n\nAnthropic 공식 패턴:\n  anthropics/claude-plugins-official (카탈로그 repo)\n    ├── .claude-plugin/marketplace.json  → 각 플러그인을 \"./plugins/...\" 상대경로로 참조\n    ├── plugins/commit-commands/          → 플러그인 A\n    ├── plugins/code-review/              → 플러그인 B\n    └── external_plugins/playwright/      → 외부 플러그인 C\n\nbkit 패턴:\n  popup-studio-ai/bkit-claude-code (카탈로그 repo)\n    ├── .claude-plugin/marketplace.json  → bkit, bkit-starter 각각 별도 URL로 참조\n    (bkit 플러그인 코드도 같은 repo에 있지만, marketplace.json에서 url로 참조)\n```\n\n참고: bkit도 마켓 repo = 플러그인 repo이지만, 플러그인이 2개이고 별도 URL 참조를 사용. Lens은 1개 플러그인만 있으면서 자기 자신을 URL로 참조.\n\n실제 Anthropic 공식은 **외부 플러그인**도 `source: \"url\"` 방식을 사용함:\n```json\n// Sentry (외부, 별도 repo)\n{ \"source\": { \"source\": \"url\", \"url\": \"https://github.com/getsentry/sentry-for-claude.git\" } }\n\n// commit-commands (내부, 같은 repo)\n{ \"source\": \"./plugins/commit-commands\" }\n```\n\n→ Lens이 자체 호스팅이면 `\"url\"` 방식은 **유효**함. 다만 마켓=플러그인이 동일 repo인 것 자체가 구조적으로 깔끔하지 않음.\n\n### 2-3. 버전 관리\n\n| 항목 | Anthropic 공식 | bkit | Lens |\n|------|---------------|------|-------|\n| marketplace.json 버전 | 없음 (카탈로그) | `\"1.5.3\"` | 없음 |\n| plugin.json 버전 | 없거나 `\"1.0.0\"` | `\"1.5.3\"` | `\"1.7.0\"` |\n| installed_plugins.json 버전 | commit SHA (`55b58ec6e564`) | `\"1.5.3\"` | `\"1.7.0\"` |\n| ref 필드 (버전 고정) | 없음 (HEAD 사용) | 없음 | 없음 |\n| sha 필드 (커밋 고정) | 없음 | 없음 | 없음 |\n\n**문제 #3**: 버전 핀 없이 항상 기본 브랜치 HEAD를 가져옴.\n\n- `ref` 미지정 → `git clone`이 기본 브랜치 HEAD를 가져옴\n- 개발 중인 불안정 코드가 바로 사용자에게 배포될 수 있음\n- 정식 릴리스 프로세스가 없음\n\n이건 사실 bkit, Anthropic 공식도 마찬가지:\n- Anthropic 공식은 commit SHA만 기록 (`\"55b58ec6e564\"`)\n- bkit은 semver 사용하지만 `ref`는 미지정\n\n→ Lens만의 고유 문제는 아니지만, 안정성 향상을 위해 `ref: \"v1.7.0\"` 추가를 권장.\n\n---\n\n## 3. 실제 영향\n\n### 문제 #1 (`source: \"git\"`) 의 영향\n\n| 영향 | 설명 |\n|------|------|\n| 설치 불안정 | `\"git\"` 타입이 Claude Code 내부에서 어떻게 처리되는지 미정의. 동작할 수도 있고 특정 버전에서 실패할 수도 있음 |\n| 자동 업데이트 실패 가능 | `claude plugins update` 시 `\"git\"` 타입을 인식 못할 수 있음 |\n| 향후 호환성 | Claude Code 업데이트 시 비공식 소스 타입이 차단될 수 있음 |\n\n### 문제 #2 (자기 참조 구조) 의 영향\n\n| 영향 | 설명 |\n|------|------|\n| 확장성 | 플러그인을 추가하려면 repo 자체를 마켓플레이스처럼 관리해야 함 |\n| 캐시 중복 | 마켓플레이스 캐시(marketplaces/)와 플러그인 캐시(cache/)에 같은 코드가 2벌 존재 |\n| 업데이트 혼란 | 마켓플레이스 업데이트 = 플러그인 업데이트가 동시에 발생 |\n\n### 문제 #3 (버전 핀 없음) 의 영향\n\n| 영향 | 설명 |\n|------|------|\n| 불안정 배포 | 개발 중인 코드가 사용자에게 바로 적용 |\n| 롤백 불가 | 이전 안정 버전으로 돌아갈 방법 없음 |\n| 재현 불가 | 같은 \"1.7.0\"이라도 시점에 따라 다른 코드 |\n\n---\n\n## 4. 수정 권장사항\n\n### 즉시 수정 가능 (사용자 측)\n\n**known_marketplaces.json의 source 타입 변경:**\n\n```json\n// 변경 전\n\"CreetaCorp\": {\n  \"source\": {\n    \"source\": \"git\",\n    \"url\": \"https://github.com/CreetaCorp/lens.git\"\n  }\n}\n\n// 변경 후\n\"CreetaCorp\": {\n  \"source\": {\n    \"source\": \"github\",\n    \"repo\": \"CreetaCorp/lens\"\n  }\n}\n```\n\n이것만으로도 설치/업데이트 안정성이 개선됨.\n\n### Creeta 팀에 요청해야 하는 사항\n\n| # | 수정 | 우선순위 | 이유 |\n|---|------|----------|------|\n| 1 | marketplace.json의 plugin source를 상대 경로(`\"./\"`)로 변경 | 높음 | 자기 참조 해소 |\n| 2 | 릴리스 시 Git 태그 생성 + marketplace.json에 `ref` 추가 | 중간 | 안정 버전 핀 |\n| 3 | Anthropic 공식 마켓플레이스에 제출 | 낮음 | 자동 업데이트, 신뢰성 |\n\n**marketplace.json 수정 예시 (Creeta 팀):**\n\n```json\n{\n  \"plugins\": [\n    {\n      \"name\": \"lens\",\n      \"source\": \"./\",\n      \"version\": \"1.7.0\"\n    }\n  ]\n}\n```\n\n이렇게 하면 마켓플레이스 repo = 플러그인 repo인 구조에서도 상대 경로로 자신을 참조하여 깔끔해짐. Anthropic 공식 패턴(`\"./plugins/...\"`)과 동일한 방식.\n\n---\n\n## 5. 현재 동작하는 이유\n\n`\"source\": \"git\"`이 비공식임에도 현재 동작하는 이유:\n- Claude Code 내부에서 `\"git\"`과 `\"url\"` 타입을 동일하게 `git clone`으로 처리할 가능성이 높음\n- 하지만 이건 우연히 동작하는 것이지 보장된 동작이 아님\n\n---\n\n작성일: 2026-03-02\n작성자: Claude (livevil7 요청)\n","truncated":false,"stale":false},{"id":"2026-03-02-plugin-완성도-강화","folder":"history","title":"Work Plan / 작업계획서","date":"2026-03-02","hasMd":true,"hasHtml":false,"mdPath":"history/2026-03-02-plugin-완성도-강화.md","htmlPath":null,"mdInline":"# Work Plan / 작업계획서\r\n\r\n> Generated by Creet Plan on 2026-03-02 16:30\r\n> Plan ID: plan_creet_release_v171\r\n\r\n---\r\n\r\n## Task / 요청사항\r\n\r\ncreet 플러그인이 제대로 설치가 안되고, 버전관리도 제대로 안되고, 마켓플레이스 등록도 안 되어 있음. 완성도 있는 플러그인으로 제대로 만들기.\r\n\r\n## 현재 상태 진단 / Diagnosis\r\n\r\n### 버전관리 (CRITICAL)\r\n\r\n| 항목 | 현재 | 문제 |\r\n|------|------|------|\r\n| Git 태그 (remote) | v1.3.0만 존재 | v1.4.0~v1.7.0 태그 push 안됨 |\r\n| GitHub Releases | v1.3.0만 존재 | v1.4.0~v1.7.0 릴리스 생성 안됨 |\r\n| 미push 커밋 | 3개 (fix 2 + feat 1) | origin/master보다 3개 앞서 있음 |\r\n| 미push 로컬 태그 | v1.4.0, v1.5.0, v1.6.0, v1.7.0 | push 필요 |\r\n| 현재 코드 버전 | v1.7.0 (plugin.json) | 3개 fix 커밋이 v1.7.0 이후 → v1.7.1 필요 |\r\n\r\n### 마켓플레이스 (CRITICAL)\r\n\r\n| 항목 | 현재 | 문제 |\r\n|------|------|------|\r\n| Anthropic 공식 등록 | 미등록 | claude-plugins-official에 미제출 |\r\n| marketplace.json source | `{\"source\": \"url\", \"url\": \"...\"}` | 형식은 OK, 하지만 `metadata` 누락 |\r\n| 커뮤니티 등록 | 미등록 | awesome-claude-code-plugins 등 미제출 |\r\n\r\n### plugin.json (WARNING)\r\n\r\n| 항목 | 현재 | 문제 |\r\n|------|------|------|\r\n| homepage | 없음 | 공식 URL 없음 |\r\n| skills 필드 | 없음 | 자동감지에 의존 (명시적 선언 권장) |\r\n| hooks 필드 | 없음 | 자동감지에 의존 |\r\n\r\n### GitHub 레포 (WARNING)\r\n\r\n| 항목 | 현재 | 문제 |\r\n|------|------|------|\r\n| Topics | 없음 | 검색 불가 |\r\n| Homepage | 없음 | 설정 안됨 |\r\n| Stars | 0 | 노출 부족 |\r\n| Description | OK | 현재 `/c`만 언급, `/cp` 미반영 |\r\n\r\n---\r\n\r\n## Execution Plan / 실행 계획\r\n\r\n### Step 1: 버전 정리 + Push\r\n\r\n**목표**: 모든 코드, 태그, 릴리스를 원격에 동기화\r\n\r\n1. 현재 3개 fix 커밋을 v1.7.1로 버전 범프\r\n   - `plugin.json`: 1.7.0 → 1.7.1\r\n   - `marketplace.json`: 1.7.0 → 1.7.1\r\n   - `hooks.json` description: v1.7.0 → v1.7.1\r\n   - CHANGELOG.md: v1.7.1 섹션 추가\r\n2. 커밋: `chore: bump version to v1.7.1`\r\n3. 태그: `v1.7.1`\r\n4. Push: 모든 커밋 + 모든 태그\r\n   ```bash\r\n   git push origin master --tags\r\n   ```\r\n5. GitHub Releases 생성 (v1.4.0 ~ v1.7.1, 총 4개)\r\n   - v1.4.0: /cc 멀티 에이전트\r\n   - v1.5.0: 크로스 플랫폼\r\n   - v1.6.0: 에이전트 대시보드 + 훅 시스템\r\n   - v1.7.0: /cp 플랜 실행\r\n   - v1.7.1: 품질 개선 (검증 이슈 수정, 8개 언어, YAML 파서)\r\n\r\n### Step 2: plugin.json + marketplace.json 강화\r\n\r\n**목표**: Claude Code가 올바르게 파싱할 수 있는 완전한 매니페스트\r\n\r\n**plugin.json 추가 필드**:\r\n```json\r\n{\r\n  \"homepage\": \"https://github.com/Creeta-creet/creet\",\r\n  \"skills\": \"./skills/\",\r\n  \"hooks\": \"./hooks/hooks.json\"\r\n}\r\n```\r\n\r\n**marketplace.json 보강**:\r\n```json\r\n{\r\n  \"metadata\": {\r\n    \"description\": \"Creet plugin marketplace\",\r\n    \"version\": \"1.0.0\"\r\n  },\r\n  \"plugins\": [{\r\n    \"source\": {\r\n      \"source\": \"github\",\r\n      \"repo\": \"Creeta-creet/creet\"\r\n    },\r\n    \"category\": \"productivity\",\r\n    \"tags\": [\"skill-navigator\", \"meta-skill\", \"multilingual\", \"plan-first\"]\r\n  }]\r\n}\r\n```\r\n\r\n### Step 3: GitHub 레포 메타데이터\r\n\r\n**목표**: 검색엔진과 GitHub에서 발견 가능하게\r\n\r\n```bash\r\n# Topics 설정\r\ngh repo edit --add-topic claude-code,claude-code-plugin,skill-navigator,productivity,multilingual\r\n\r\n# Description 업데이트\r\ngh repo edit --description \"Skill navigator for Claude Code. Scans all plugins, recommends the best match, and executes — single (/c), parallel (/cc), or plan-first (/cp).\"\r\n\r\n# Homepage 설정\r\ngh repo edit --homepage \"https://github.com/Creeta-creet/creet\"\r\n```\r\n\r\n### Step 4: 공식 등록 가이드\r\n\r\n**목표**: Anthropic 공식 디렉토리 + 커뮤니티 등록\r\n\r\n1. **Anthropic 공식**: `claude-plugins-official` 레포에 PR 제출\r\n   - `external_plugins/` 디렉토리에 creet 엔트리 추가\r\n   - 또는 https://claude.com/plugins 제출 페이지 이용\r\n2. **커뮤니티 awesome list**: `ccplugins/awesome-claude-code-plugins`에 PR\r\n3. **hesreallyhim/awesome-claude-code**: 가장 큰 커뮤니티 목록에 PR\r\n\r\n### Step 5: 버전관리 워크플로우 문서화\r\n\r\n**목표**: 다음부터 수동 실수 방지\r\n\r\nCLAUDE.md에 릴리스 체크리스트 섹션 추가:\r\n```\r\n## Release Checklist\r\n1. 코드 변경 완료 + 커밋\r\n2. 버전 범프 (plugin.json, marketplace.json, hooks.json)\r\n3. CHANGELOG.md 업데이트\r\n4. 커밋: chore: bump version to vX.Y.Z\r\n5. 태그: git tag vX.Y.Z\r\n6. Push: git push origin master --tags\r\n7. GitHub Release: gh release create vX.Y.Z --notes-file CHANGELOG_EXCERPT.md\r\n```\r\n\r\n---\r\n\r\n## Expected Outcomes / 기대 결과\r\n\r\n- [ ] 원격 레포에 v1.3.0~v1.7.1 전체 태그 + 릴리스 존재\r\n- [ ] plugin.json, marketplace.json이 공식 스키마 준수\r\n- [ ] GitHub Topics + Description으로 검색 가능\r\n- [ ] 릴리스 체크리스트가 CLAUDE.md에 문서화\r\n- [ ] Anthropic 공식 디렉토리 제출 준비 완료\r\n\r\n## Risks / 위험 요소\r\n\r\n- GitHub Release 생성 시 이미 지난 커밋에 대한 릴리스이므로 날짜 불일치 가능 → release body에 원래 날짜 명시\r\n- Anthropic 공식 등록은 심사가 있으므로 거절될 수 있음 → 커뮤니티 등록 병행\r\n- marketplace.json source를 github 형식으로 변경하면 기존 설치에 영향 가능 → 하위호환 유지\r\n\r\n## Execution Mode / 실행 방식\r\n\r\n- **Mode**: Sequential (step 1→2→3→4→5)\r\n- **Steps**: 5\r\n- **Estimated scope**: Medium (파일 수정 6개 + git ops + GitHub API)\r\n\r\n---\r\n\r\n**Status**: Draft\r\n","truncated":false,"stale":false}],"rules":[{"id":"codex-integration","folder":"rules","title":"Codex CLI 연동 규칙","date":"","hasMd":true,"hasHtml":false,"mdPath":"rules/codex-integration.md","htmlPath":null,"mdInline":"# Codex CLI 연동 규칙\r\n\r\nLens v3.1에서 OpenAI Codex CLI를 활용한 pre-mortem 이종 모델 검증의 표준 규칙.\r\n\r\n## 1. 개요\r\n\r\n### Codex CLI란\r\n\r\n- OpenAI가 제공하는 codex 전용 CLI 도구 (모델은 머신의 모델 순위표에서 최상위를 자동 선택 — §4 resolver. 2026-07 현재 1등: `gpt-5.6-sol`)\r\n- 로컬 셸에서 비대화형 호출 가능 (`codex exec`)\r\n- ChatGPT Plus/Pro/Max 구독으로 인증 (별도 API 키 불필요)\r\n\r\n### Lens가 Codex를 사용하는 이유\r\n\r\n- **이종 모델 병렬 검증**: Claude 계열과 다른 아키텍처/학습 데이터의 모델로 교차 검증\r\n- **블라인드 스팟 해소**: 단일 모델 편향(유사한 추론 경로, 동일한 놓침)을 상쇄\r\n- **비용 효율**: Plus/Pro/Max 구독 내에서 추가 과금 없이 활용\r\n\r\n### 사용 지점 (v3.9+)\r\n\r\nCodex 는 단순 \"Claude 결과 검토자\"가 아니라 **공동 조사자·공동 검증자**다. 네 지점에서 이종 모델 더블 검증을 수행한다:\r\n\r\n- `/cp PLAN` **Phase 0.5 — 병렬 독립 조사**: Goal 정의 직후 Codex 가 레포를 스스로 읽고 자기 접근안+리스크를 제시 (Claude 의 Plan A 설계와 병렬). 결과는 Phase 2.4 에서 합성.\r\n- `/cp PLAN` **Phase 2.4 — 듀얼 합성·교차검증**: Claude 안과 Codex 안의 합의/분기 분류 → 분기 재검증.\r\n- `/cp PLAN` **Phase 3 — Pre-mortem**: 통합안의 최종 리스크 점검 (Phase 0.5 에서 Codex 조사가 이미 돌았으면 Opus 단독, 아니면 Codex 병렬).\r\n- `/cc` **Phase 4.5 — 코드리뷰 게이트**: 매 반복의 코드 변경을 Codex 가 독립 리뷰. Supervisor pass + Codex pass 둘 다여야 진행.\r\n\r\n**trivial 작업(오타·변수명·한 줄 수정)은 모든 지점 skip** — 불필요한 호출 회피. Codex 부재/실패는 항상 graceful degrade (Claude/Supervisor 단독 진행 + 플래그 기록, 블로킹 금지). **단 예외 — `/cpp` S4 교차 협의는 하드 게이트**(Constitution 2조): 미감지/미인증 시 degrade 하지 않고 **정지·보고**한다(사용자가 \"Codex 없이 진행\" 명시 시만 1회 우회). 위 graceful degrade 는 `/cp`·`/cc` 의 듀얼검증 지점에 적용된다.\r\n\r\n## 2. 사전 조건 감지\r\n\r\nClaude Code 세션에서 Codex CLI가 설치·로그인됐는지 3단계 fallback으로 확인한다.\r\n\r\n### 단계 1: PATH 확인\r\n\r\n```bash\r\ncommand -v codex\r\n```\r\n\r\n`/usr/local/bin/codex` 등 경로가 출력되면 사용 가능.\r\n\r\n### 단계 2: VSCode ChatGPT 확장 번들 경로\r\n\r\nPATH에 없을 경우, VSCode ChatGPT 확장에 포함된 바이너리를 탐색한다.\r\n\r\n```bash\r\nls $HOME/.vscode/extensions/openai.chatgpt-*/bin/windows-x86_64/codex.exe 2>/dev/null | head -1\r\n```\r\n\r\n출력된 절대경로를 `CODEX_BIN` 변수에 저장하여 이후 호출에 사용한다.\r\n\r\n### 단계 3: 감지 실패\r\n\r\n위 두 단계 모두 실패하면 `codex_available=false` 로 마킹한다.\r\n\r\n**Fallback 동작**: Pre-mortem은 Opus 단독으로 수행하고, 결과 문서에 다음 문구를 명시한다.\r\n\r\n> Codex 미설치 — 단일 모델 pre-mortem\r\n\r\n## 3. 인증 확인\r\n\r\n```bash\r\ncodex login status\r\n```\r\n\r\n- 정상 응답: `Logged in using ChatGPT`\r\n- 미인증 상태: 사용자에게 `codex login`을 수동 실행하도록 안내\r\n- 로그인 URL이 자동으로 브라우저에 열리므로 대화형 실행 필요\r\n\r\n미인증 상태에서 호출하면 에러가 발생하므로 반드시 선제적으로 확인한다.\r\n\r\n## 4. 표준 호출 패턴\r\n\r\n```bash\r\n# ① 모델 resolver (v3.24+) — 순위표 1등을 매 호출 직전 동적 선택. 이름을 문서에 못박지 않는다.\r\nCODEX_MODEL=$(node -e \"const p=require('path'),os=require('os');const d=require(p.join(os.homedir(),'.codex','models_cache.json'));const m=d.models.filter(x=>x.visibility==='list'&&x.supported_in_api!==false).sort((a,b)=>(a.priority??99)-(b.priority??99))[0];if(!m||!m.slug)process.exit(1);console.log(m.slug)\" 2>/dev/null) || CODEX_MODEL=\"\"\r\nMODEL_ARG=(); if [ -n \"$CODEX_MODEL\" ]; then MODEL_ARG=(-m \"$CODEX_MODEL\"); else echo \"⚠️ 모델 resolver 실패 — codex config 기본 모델로 진행\"; fi\r\n\r\n# ② 표준 호출\r\nOUT=$(mktemp /tmp/codex_XXXXXX.txt)   # 고유 파일명 — 병렬 호출 충돌 방지\r\nDEPTH=xhigh                            # 소규모; 대규모 리뷰·협의는 high (§\"깊이 분기\")\r\ntimeout 180 codex exec --skip-git-repo-check \\\r\n  \"${MODEL_ARG[@]}\" \\\r\n  -c model_reasoning_effort=\"$DEPTH\" \\\r\n  -c service_tier=fast \\\r\n  -o \"$OUT\" \\\r\n  \"프롬프트 내용\"\r\nRC=$?                                  # 124 = 180초 초과 (§7)\r\n# 응답 본문은 \"$OUT\" 에 떨어진다 (§5). RC==124 면 부분 본문 수거 or degrade.\r\n```\r\n\r\n### 플래그 설명\r\n\r\n- `exec` — 비대화형 1회 응답 모드. TUI를 띄우지 않고 결과 출력\r\n- `--skip-git-repo-check` — 현재 디렉토리가 git repo가 아니어도 실행 허용. Pre-mortem은 repo와 무관하므로 필수\r\n- `\"${MODEL_ARG[@]}\"` — **순위표 1등 동적 지정 (v3.24+)**: `~/.codex/models_cache.json`(codex 가 자동 갱신하는 모델 순위표)에서 `visibility=list` + `supported_in_api` 중 `priority` 최소(=1등, 2026-07 현재 `gpt-5.6-sol`) slug 를 매 호출 직전 선택. 특정 모델명을 문서에 못박지 않고, 사용자가 데스크톱 앱에서 바꾼 config 기본값에도 의존하지 않는다. resolver 실패(순위표 부재·스키마 변경·빈 목록) 시 배열이 비어 `-m` 자체가 생략되고(빈 `-m \"\"` 전달 원천 차단) ⚠️ 플래그를 stdout 에 남긴다 — **이 플래그는 호출한 스킬의 결과 보고 상단에 복사 의무** (조용한 강등 금지)\r\n- `timeout 180` — **상한 가드(v3.19+)**: codex 가 180초 안에 못 끝내면 강제 종료(exit 124). 무한 동기 대기를 차단한다. 초과 시 §7 — `-o` 부분 본문이 있으면 \"미완\" 표기로 수거, 없으면 degrade. (coreutils `timeout` — git-bash/mac/linux 공통)\r\n- `-c model_reasoning_effort=\"$DEPTH\"` — **깊이 다이얼**: 입력 규모로 분기(§\"깊이 분기\"). 소규모(pre-mortem 200단어·빠른 조사)=`xhigh`, 대규모(전체 diff 리뷰·딥스펙 전량 협의)=`high`. 토큰 비용 비고려 방침은 유지하되, 대규모 xhigh 의 시간 비선형 폭증만 회피.\r\n- `-c service_tier=fast` — **속도 다이얼**: API 부하 시 큐 우선권. *별개 다이얼*이라 깊이와 동시 적용 가능. (현행 codex 0.137+ 정식 키는 `fast`; 과거 `priority` 는 동일 동작의 **레거시 별칭**으로 아직 매핑되나 미래 제거 대비 `fast` 로 통일. 라이브 실측 EXIT 0)\r\n- `-o \"$OUT\"` — 최종 답변 본문만 파일로 출력. 메타(`session id`/`tokens used`) 섞인 stdout을 awk로 파싱할 필요가 없다\r\n\r\n### 깊이 분기 — 소규모 xhigh / 대규모 high (v3.19+)\r\n\r\n깊이와 속도는 **독립 다이얼**이다. `reasoning_effort` 는 추론 토큰량(품질·깊이), `service_tier` 는 큐 우선권(지연)을 조절한다 — 한쪽이 다른 쪽을 깎지 않는다.\r\n\r\n**xhigh 는 입력이 작을 때만 빠르다.** 실측(gpt-5.5; 2026-07-15 gpt-5.6-sol 도 xhigh/high 단계 동일 지원 확인 — 깊이 분기 규칙은 모델 세대 무관 유지): 소규모에서 `low` 는 `xhigh` 보다 토큰 ~6배 + 속도 이득 0 → 소규모는 xhigh 가 오히려 싸고 빠르다. **그러나 입력이 크면(전체 diff 리뷰·딥스펙 전량 협의) xhigh 의 추론 시간은 비선형으로 폭증**한다. `service_tier=fast` 는 raw 속도가 아니라 **혼잡 시 큐 우선권**이라 compute-bound 인 이 폭증을 깎지 못한다. 따라서 깊이를 입력 규모로 분기한다:\r\n\r\n| 호출 지점 | 입력 규모 | DEPTH |\r\n|---|---|---|\r\n| Pre-mortem (200단어 제한) | 작음 | `xhigh` |\r\n| `/cp` P0.5 독립 조사 | 중 (background·비대기) | `xhigh` |\r\n| `/cc` P4.5 코드리뷰 (전체 diff) | **큼** | `high` |\r\n| `/cpp` S4 교차 협의 (딥스펙 전량) | **큼** | `high` |\r\n\r\n소규모 xhigh 는 메모리 룰(소규모 xhigh always) 그대로 보존한다. **대규모만 high 로 내려 시간을 잡고, 모든 지점에 `timeout 180`(§7) 을 공통 적용**한다. `fast`(구 `priority`) 는 큰 작업/혼잡 시 보험이며 해는 없다 → 유지.\r\n\r\n### 모델·티어 드리프트 대비 (버전 무관 fallback)\r\n\r\n동적 지정 모델과 `service_tier` 는 **서버측 검증**이라, OpenAI 가 모델을 폐기/리네임하면 호출이 런타임 400(`invalid_request_error`)으로 죽는다. 머신 하드코딩 금지 원칙에 따라 fallback 은 3단:\r\n\r\n- **resolver 실패** (순위표 부재·스키마 변경·빈 목록): `MODEL_ARG` 가 비어 `-m` 자체가 생략됨(§4 ① — codex config 기본 모델 사용) + ⚠️ 플래그 출력. **플래그는 호출한 스킬의 결과 보고에 복사 의무** — 조용한 강등 금지.\r\n- **모델 400**: 동적 선택된 모델이 400(invalid model)이면 **`MODEL_ARG` 를 비우고 1회 재시도** (codex config 기본 모델 사용). 특정 모델명에 영구 의존하지 않는다.\r\n- **티어**: `service_tier=fast` 가 거부되면 `-c service_tier` 자체를 생략하고 재시도 (기본 티어). `fast`/`priority` 둘 다 미지원인 구버전 대비.\r\n- 이 fallback 은 graceful — 이종검증이 조용히 죽는 대신 기본값으로라도 돈다. 깨짐은 `/crv` 감사가 `codex --version` + `models_cache.json` probe(순위표 스키마·1등 slug 변동)로 선제 감지.\r\n\r\n> 참고: codex 바이너리 절대경로는 `CODEX_BIN=$(ls $HOME/.vscode/extensions/openai.chatgpt-*/bin/windows-x86_64/codex.exe 2>/dev/null | head -1)` 로 잡고 `\"$CODEX_BIN\"` 으로 호출 (PATH 부재 시, §2 단계 2).\r\n\r\n## 5. 응답 수거\r\n\r\n`-o \"$OUT\"` 플래그를 쓰면 codex 가 **최종 답변 본문만** 해당 파일에 쓴다. 메타(`session id`/`tokens used`)가 섞인 stdout 을 파싱할 필요가 없다.\r\n\r\n### 본문 읽기\r\n\r\n```bash\r\nBODY=$(cat \"$OUT\")\r\n```\r\n\r\n읽은 `$BODY` 를 결과 문서에 삽입한다. **고유 파일명 필수** — Phase 0.5·2.4·4.5 가 background 병렬로 동시에 돌 수 있으므로, `mktemp /tmp/codex_XXXXXX.txt` 같은 고유 경로를 호출마다 새로 잡아 덮어쓰기를 막는다.\r\n\r\n### (참고) -o 없이 stdout 만 받은 경우\r\n\r\n구버전 codex 등으로 `-o` 를 못 쓰면 stdout 에 메타가 섞인다. 본문은 `^codex$` 라벨 다음 줄 ~ `^tokens used$` 이전 줄이며, 폴백 추출은:\r\n\r\n```bash\r\nBODY=$(echo \"$OUTPUT\" | awk '/^codex$/{flag=1; next} /^tokens used$/{flag=0} flag')\r\n```\r\n\r\n`-o` 가 동작하는 환경에선 이 awk 폴백을 쓰지 않는다.\r\n\r\n## 6. Pre-mortem 프롬프트 템플릿\r\n\r\n```\r\n다음 작업 계획의 허점을 찾아주세요. 200단어 이내, 순수 텍스트.\r\n\r\n## 계획\r\n{계획 문서의 목표 + 기술적 접근 섹션}\r\n\r\n## 평가 관점\r\n1. 실패할 수 있는 3가지 시나리오 (구체적 트리거 + 결과)\r\n2. 누락된 엣지 케이스\r\n3. 기술적 블라인드 스팟\r\n\r\nJSON 형식 사용하지 말고 한국어로 답변.\r\n```\r\n\r\n### 템플릿 설계 의도\r\n\r\n- **200단어 제한**: 응답 시간 단축, 핵심 허점에 집중\r\n- **순수 텍스트**: 파싱 편의성 (JSON/마크다운 파싱 불필요)\r\n- **3가지 시나리오 강제**: 단일 실패 모드가 아닌 다중 관점 유도\r\n- **한국어 명시**: codex 모델은 영문 응답이 기본값이므로 명시적 지시 필요\r\n\r\n## 7. 에러 처리 — 180초 상한 + 부분 수집/degrade (v3.19+)\r\n\r\n모든 codex 호출은 `timeout 180`(§4) 으로 감싼다. 두 층위의 보호가 있다:\r\n\r\n1. **background 비대기 지점**(`/cp` P0.5 조사 등): Claude 는 애초에 기다리지 않고 자기 작업을 진행하다 gate 에서 ready 면 수거·미완이면 degrade. (기존 동작 — `timeout` 은 orphan 강제 정리 보너스.)\r\n2. **동기·하드게이트 지점**(`/cpp` S4, `/cc` P4.5 더블게이트): codex 결과를 받아야 진행하므로 **실제로 대기**한다. 여기서 `timeout 180` 이 **무한 대기를 끊는 핵심**이다. 180초 초과(exit 124) 시:\r\n   - **`-o $OUT` 자유형**: `$OUT` 에 부분 본문이 있으면 **\"⚠️ Codex 부분 결과(180s 초과·미완)\"** 로 표기해 수거·반영한다. 비어있으면 degrade. (codex 가 최종본만 쓰면 부분 수거 불가 — best-effort.)\r\n   - **`--json` 구조화 review**: 부분 JSON 은 파싱 불가 → degrade(\"Codex 리뷰 미완 — 단독 게이트\").\r\n\r\ncodex 가 느리든 hang 하든 180초면 무조건 끊긴다. orphan 프로세스는 `timeout` kill + 세션 종료(Stop 훅)가 정리한다.\r\n\r\n| 상황 | 대응 |\r\n|------|------|\r\n| **180초 초과 (exit 124)** | $OUT 부분 본문 있으면 \"미완\" 표기 수거, 없으면 degrade. **무한 대기 금지.** |\r\n| **gate 시점에 미완 (background)** | 기다리지 않고 degrade — \"Codex 미완 — 단독 진행\" 플래그 기록 |\r\n| **인증 만료 / 호출 실패** | \"Codex 실패: {요약}\" 기록 후 Claude/Opus 단독 진행 |\r\n| **stderr 에러** | 결과 섹션에 \"Codex 에러\" 블록으로 포함 (블로킹 금지) |\r\n\r\n> **하드게이트 예외 주의**: `/cpp` S4 는 Codex *부재/미인증* 시 degrade 금지(정지·보고)지만, *180초 초과* 는 다르다 — codex 는 응답 중이었으므로 부분 결과를 \"미완 협의\"로 반영하고 진행하되, 커버리지 공백이 남으면 S5 회귀로 보강(§8.5). 무한 대기로 사용자를 잡지 않는다.\r\n\r\n## 8. 비용 및 성능 가이드\r\n\r\n| 항목 | 값 |\r\n|------|-----|\r\n| Pre-mortem 1회당 토큰 사용량 | 가변 — **비용 비고려**(깊이·속도 우선 방침). xhigh 는 소규모에서 오히려 토큰이 적음 |\r\n| 응답 시간 | 소규모 pre-mortem ~5–10초(xhigh). 대규모 리뷰·협의=high + `timeout 180` 상한(§7). 부하 시 fast 가 큐 우선권 |\r\n| 과금 | ChatGPT Plus/Pro/Max 구독 시 별도 과금 없음 |\r\n\r\n### 주의사항\r\n\r\n- 구독 등급에 따라 일일 사용량 제한 존재 (구체 수치는 OpenAI 공식 페이지 참조)\r\n- 연속 호출 시 rate limit 가능 — pre-mortem 1회/계획이면 일반적으로 문제 없음\r\n- 로컬 네트워크 상태에 따라 응답 시간 변동\r\n\r\n## 8.5 듀얼 검증 호출 패턴 (v3.9+)\r\n\r\n§4 표준 호출 + §5 응답 수거 + §7 에러 처리를 그대로 공유한다. 조사·리뷰에 추가되는 규칙:\r\n\r\n### 병렬성 — run_in_background\r\n\r\n조사(Phase 0.5)·코드리뷰(Phase 4.5)는 Claude 의 본 작업과 **진짜 병렬**이어야 한다. Bash tool 의 `run_in_background: true` 로 Codex 를 띄우고, Claude 는 자기 작업(Plan A 설계 / Supervisor 검토)을 진행한 뒤 백그라운드 출력을 수거한다. sleep/폴링 금지 — 완료 알림을 받는다. **gate 도달 시 ready 면 수거, 미완이면 기다리지 않고 degrade**(§7) — 숫자 timeout 없음.\r\n\r\n### 파일 접근 — 프로젝트 루트에서 실행\r\n\r\nPre-mortem 은 repo 무관(`--skip-git-repo-check`)이지만, **조사·코드리뷰는 Codex 가 파일을 읽어야** 한다. 반드시 프로젝트 루트(cwd)에서 `codex exec` 를 호출 — Codex 는 cwd 의 파일에 접근한다.\r\n\r\n### 프롬프트 / 판정\r\n\r\n- **Phase 0.5 독립 조사**: \"이 작업을 직접 조사하고 독립 실행 계획을 제안\" (권장 접근 / 리스크 3 / 관련 파일). 전체 템플릿은 `skills/cp/SKILL.md` Phase 0.5.\r\n- **Phase 4.5 코드리뷰 (구조화·git-aware — v3.13+ 권장)**: 자유형 \"이 diff 를 리뷰\" 프롬프트 + 수동 diff 주입 + 본문 마지막 줄 awk `PASS`/`FAIL` 파싱은 **취약**(diff 잘림·텍스트 휴리스틱). 대신 **`codex exec review`** 가 git 을 직접 읽고 구조화 판정을 낸다 (현행 0.137+ 라이브 실측 확인):\r\n\r\n  ```bash\r\n  # 모델 resolver (§4 ①) 를 먼저 실행해 MODEL_ARG 준비 — 이름 하드코딩 금지\r\n  SCHEMA=$(mktemp /tmp/codex_schema_XXXXXX.json)   # {verdict: pass|fail, high_findings:[...]}\r\n  RES=$(mktemp /tmp/codex_review_XXXXXX.json)\r\n  timeout 180 codex exec review --uncommitted \\\r\n    \"${MODEL_ARG[@]}\" -c model_reasoning_effort=high -c service_tier=fast \\\r\n    --output-schema \"$SCHEMA\" --ephemeral --json > \"$RES\" 2>/dev/null\r\n  # 판정: $RES 의 verdict==fail 또는 high_findings 비어있지 않음 → FAIL\r\n  # 깊이=high (전체 diff 는 대규모 입력 → xhigh 폭증 회피, §\"깊이 분기\").\r\n  # exit 124(180s 초과) → 구조화 JSON 불완전이면 degrade (§7).\r\n  ```\r\n\r\n  - `--uncommitted` (또는 `--base <branch>`) — Codex 가 작업트리 변경을 직접 읽음. **수동 diff 주입 제거**.\r\n  - `--output-schema` — `{verdict, high_findings}` 구조 강제. **awk PASS/FAIL 휴리스틱 제거**.\r\n  - `--ephemeral` — 세션 비영속. orphan 정리(Stop 훅) 의존 완화.\r\n  - ⚠️ **반드시 `codex exec review`** — bare `codex review` 는 `--output-schema`/`--ephemeral` 미노출. `exec review` 만이 review 인자(`--uncommitted/--base`)와 exec 플래그를 동시 노출.\r\n  - **fallback**: `codex exec review` 미지원 구버전이면 기존 자유형 diff 리뷰 + `PASS`/`FAIL`+`[high]` 파싱 (graceful degrade). 전체 템플릿은 `skills/cc/SKILL.md` Phase 4.5.\r\n- **합성/게이트**: 조사 결과는 Claude 가 합의/분기로 분류해 통합 (Phase 2.4). 리뷰 결과는 Supervisor 와 AND 게이트 (둘 다 pass 여야 진행).\r\n\r\n## 9. 관련 파일 / 외부 참조\r\n\r\n### 로컬\r\n\r\n- 스킬: `~/.claude/skills/codex-review/SKILL.md` — Claude Code 안에서 `/codex-review` 호출용 (별도 설치 완료)\r\n- Lens PLAN 모드: `~/.claude/plugins/lens/skills/cp/` — Phase 2.5에서 본 문서 참조\r\n\r\n### 외부\r\n\r\n- 공식 CLI 문서: <https://developers.openai.com/codex/cli/>\r\n- GitHub 저장소: <https://github.com/openai/codex>\r\n- ChatGPT 구독 정책: <https://openai.com/chatgpt/pricing/>\r\n","truncated":false,"stale":false},{"id":"document-conventions","folder":"rules","title":"Lens 문서 작성 컨벤션 (Document Writing Conventions)","date":"","hasMd":true,"hasHtml":false,"mdPath":"rules/document-conventions.md","htmlPath":null,"mdInline":"# Lens 문서 작성 컨벤션 (Document Writing Conventions)\n\n> Lens 플러그인이 생성하는 모든 문서의 작성 규칙 및 표준 정의서\n> 버전: 1.0.0 | 작성일: 2026-03-02\n\n---\n\n## 적용 범위\n\n이 컨벤션은 Lens가 **런타임에 생성하는 문서**에 적용된다.\n\n| 대상 | 생성 주체 | 현재 파일 |\n|------|-----------|-----------|\n| 작업계획서 (Work Plan) | `/cp` | `docs/YYYY-MM-DD-{slug}.md` |\n| 실행 결과 합성 | `/cc` | `.lens/results/synth-YYYY-MM-DD-{slug}.md` (saveSynthesisResults=true 시) |\n| Plan 상태 추적 | `plan-manager.js` | `.lens/plan-state.json` |\n| Agent 대시보드 | `agent-tracker.js` | `.lens/agent-dashboard.json` |\n\n프로젝트 자체 문서(`CLAUDE.md`, `README.md`, `CHANGELOG.md`)의 규칙은 `docs/rules/documentation-guide.md`를 따른다.\n\n---\n\n## 1. 문서 네이밍 컨벤션\n\n### 현재 상태\n\n| 항목 | 현재 규칙 | 문제점 |\n|------|-----------|--------|\n| 파일명 | `YYYY-MM-DD-{slug}.md` | slug 생성 규칙이 `plan-manager.js`에만 있고 SKILL.md와 중복 정의됨 |\n| 폴더 | `docs/` (기본), `.lens/results/` (/cc) | 작업계획서는 `docs/`, /cc 합성 결과는 `.lens/results/` |\n| ID | `plan_${timestamp36}_${hex}` | Plan에만 ID 존재. Agent, Session과 ID 형식이 제각각 |\n\n### 개선된 규칙\n\n#### 1.1 파일명 형식\n\n```\n{type}-{YYYY-MM-DD}-{slug}.md\n```\n\n| 접두사 (type) | 문서 종류 | 생성 스킬 | 예시 |\n|---------------|-----------|-----------|------|\n| `plan` | 작업계획서 | `/cp` | `plan-2026-03-02-jwt-auth-login.md` |\n| `result` | 실행 결과 합성 | `/cc` | `result-2026-03-02-seo-audit.md` |\n| `report` | 분석/리포트 | 향후 확장용 | `report-2026-03-02-perf-analysis.md` |\n\n> **근거**: 타입 접두사가 있으면 `ls` 한 번으로 종류별 필터링이 가능하다.\n> 현재 `YYYY-MM-DD-slug.md` 형식은 날짜순 정렬에는 유리하지만, 작업계획서와 결과 문서가 섞이면 구분이 안 된다.\n\n#### 1.2 Slug 생성 규칙 (단일 원천: `plan-manager.js`)\n\n```javascript\n// 규칙: plan-manager.js의 generateSlug()이 유일한 slug 생성 함수\n// SKILL.md에서는 \"slug는 plan-manager.js가 생성한다\"고만 명시\n\n// 허용 문자: 모든 Unicode 문자(\\p{L}), 숫자(\\p{N}), 하이픈\n// 최대 길이: 50자\n// 단어 수: 3~5개 핵심 키워드\n// 1글자 단어: 제외 (filter(w => w.length > 1))\n// 폴백: slug가 비어있거나 2자 미만이면 plan-{random_hex_6}\n```\n\n#### 1.3 폴더 구조\n\n```\nproject-root/\n├── docs/                        # /cp 작업계획서 (기본 저장 위치, planDir로 변경 가능)\n│   ├── 2026-03-02-jwt-auth.md\n│   └── 2026-03-01-db-migration.md\n├── .lens/\n│   ├── results/                 # /cc 합성 결과 (saveSynthesisResults=true 시)\n│   │   └── synth-2026-03-02-seo-audit.md\n│   ├── plan-state.json          # Plan 상태 추적\n│   └── agent-dashboard.json     # Agent 라이프사이클\n```\n\n#### 1.4 ID 형식 통일\n\n| 엔티티 | 현재 형식 | 통일 형식 |\n|--------|-----------|-----------|\n| Plan | `plan_${ts36}_${hex4}` | `plan_${ts36}_${hex4}` (유지) |\n| Session | `sess_${ts36}_${hex6}` | `sess_${ts36}_${hex4}` (hex 길이 통일) |\n| Agent | `agent_${ts36}_${hex4}` | `agt_${ts36}_${hex4}` (접두사 축약) |\n\n```\n공통 패턴: {prefix}_{base36_timestamp}_{hex_random_4}\n예시: plan_m1abc_f3d2, sess_m1abc_a1b2, agt_m1abc_c4e5\n```\n\n---\n\n## 2. 문서 헤더/메타데이터 컨벤션\n\n### 현재 상태\n\n| 항목 | 현재 규칙 | 문제점 |\n|------|-----------|--------|\n| 헤더 | `# Work Plan / 작업계획서` + blockquote 메타 | 파싱 불가. 메타데이터가 자유 텍스트 |\n| Plan ID | blockquote 안에 인라인 표기 | 프로그래밍적으로 추출 불가 |\n| 날짜 | `Generated by Lens Plan on {YYYY-MM-DD HH:mm}` | 형식만 있고 타임존 규칙 없음 |\n\n### 개선된 규칙\n\n#### 2.1 YAML 프론트매터 (필수)\n\n모든 Lens 생성 문서는 YAML 프론트매터로 시작한다.\n\n```yaml\n---\nid: plan_m1abc_f3d2\ntype: plan                    # plan | result | report\nversion: 1                   # 문서 스키마 버전 (수정할 때마다 증가 아님, 포맷 변경 시만)\ncreated: 2026-03-02T14:30:00+09:00   # ISO 8601 + 타임존\nupdated: 2026-03-02T15:00:00+09:00   # 최종 수정 시각\nstatus: draft                 # draft | approved | executing | completed | failed | cancelled\ngenerator: /cp                # 생성한 스킬\nlanguage: ko                  # 본문 언어 (ISO 639-1)\ntags: [jwt, auth, backend]    # 검색/필터용 태그\n---\n```\n\n#### 2.2 필수 vs 선택 필드\n\n| 필드 | 필수 | 타입 | 설명 |\n|------|------|------|------|\n| `id` | 필수 | string | 고유 식별자 |\n| `type` | 필수 | enum | 문서 종류 |\n| `version` | 필수 | integer | 프론트매터 스키마 버전 (현재 `1`) |\n| `created` | 필수 | ISO 8601 | 생성 시각 (타임존 포함) |\n| `updated` | 필수 | ISO 8601 | 최종 수정 시각 |\n| `status` | 필수 | enum | 문서/작업 상태 |\n| `generator` | 필수 | string | 생성 스킬명 |\n| `language` | 필수 | string | ISO 639-1 언어 코드 |\n| `tags` | 선택 | string[] | 태그 목록 |\n| `parent_id` | 선택 | string | 연결된 상위 문서 ID |\n| `related` | 선택 | string[] | 관련 문서 ID 목록 |\n\n#### 2.3 `plan-state.json` 스키마와의 정합성\n\n프론트매터의 `status`와 `plan-state.json`의 `status`는 **반드시 동기화**한다.\n상태 변경 시 두 곳 모두 업데이트:\n\n```\n1. plan-state.json의 해당 plan ID 엔트리의 status 변경\n2. plan 마크다운 파일의 프론트매터 status 변경\n→ 둘 다 plan-manager.js가 책임진다\n```\n\n---\n\n## 3. 다국어 처리 컨벤션\n\n### 현재 상태\n\n| 항목 | 현재 규칙 | 문제점 |\n|------|-----------|--------|\n| 언어 감지 | \"Respond in the user's language\" (SKILL.md) | 구체적 감지 로직 없음 |\n| 헤더 | `## Task / 요청사항` (이중 언어 고정) | 사용자가 영어면 한국어 헤더 불필요 |\n| 본문 | \"user's language\" | 기본값 규칙 없음 |\n| 설정 | `defaultPlanLanguage: null` (lens.config.json) | 사용 방법 미정의 |\n\n### 개선된 규칙\n\n#### 3.1 언어 결정 우선순위\n\n```\n1. lens.config.json의 defaultPlanLanguage (명시적 설정) → \"ko\", \"en\", 등\n2. 사용자 입력 언어 자동 감지 (요청 텍스트 기반)\n3. 폴백: \"en\" (영어)\n```\n\n#### 3.2 헤더 이중 언어 규칙\n\n| 본문 언어 | 헤더 형식 | 예시 |\n|-----------|-----------|------|\n| `en` | 영어만 | `## Task` |\n| `ko` | 영어 / 한국어 | `## Task / 요청사항` |\n| `ja` | 영어 / 일본어 | `## Task / 要件` |\n| `zh` | 영어 / 중국어 | `## Task / 任务` |\n| 기타 | 영어 / 해당 언어 | `## Task / Tarea` |\n\n**규칙**: 영어 헤더는 항상 첫 번째. 비영어 언어일 때만 ` / {번역}` 추가.\n\n#### 3.3 본문 언어 규칙\n\n| 요소 | 언어 | 이유 |\n|------|------|------|\n| 프론트매터 키 | 영어 | YAML 키는 코드. 다국어화 불가 |\n| 섹션 헤더 | 이중 언어 (3.2 규칙) | 가독성 + 검색성 |\n| 본문 텍스트 | 사용자 언어 | 사용자가 읽는 주요 콘텐츠 |\n| 코드/명령어 | 영어 | 코드는 원본 유지 |\n| 상태 값 | 영어 (enum) | `draft`, `completed` 등 파싱 가능해야 함 |\n\n#### 3.4 언어 코드 표 (지원 언어)\n\n| 코드 | 언어 | Lens 지원 상태 |\n|------|------|-----------------|\n| `en` | English | 기본값 |\n| `ko` | 한국어 | 지원 |\n| `ja` | 日本語 | 지원 |\n| `zh` | 中文 | 지원 |\n| `es` | Español | 지원 |\n| `fr` | Français | 지원 |\n| `de` | Deutsch | 지원 |\n| `it` | Italiano | 지원 |\n\n---\n\n## 4. 상태 관리 컨벤션\n\n### 현재 상태\n\n| 항목 | 현재 규칙 | 문제점 |\n|------|-----------|--------|\n| Plan 상태 | `Draft` → (실행) → `Completed \\| Partial \\| Failed` | `Approved`, `Executing` 단계 누락 |\n| 상태 위치 | 마크다운 본문 하단 `**Status**: Draft` | 프론트매터와 이원화. 파싱 어려움 |\n| `/cc` 결과 | 상태 개념 없음 | 성공/실패 이력 없음 |\n| Agent | `pending → running → done \\| error` | Plan 상태와 연결 안 됨 |\n\n### 개선된 규칙\n\n#### 4.1 문서 상태 머신\n\n```\n                     ┌──────────┐\n                     │  draft   │ ← 최초 생성\n                     └────┬─────┘\n                          │ 사용자 승인\n                     ┌────▼─────┐\n                     │ approved │\n                     └────┬─────┘\n                          │ 실행 시작\n                   ┌──────▼──────┐\n                   │  executing  │\n                   └──┬───────┬──┘\n                      │       │\n               ┌──────▼──┐ ┌──▼───────┐\n               │completed│ │  failed  │\n               └─────────┘ └──────────┘\n\n   취소는 어디서든 가능:\n   draft ──→ cancelled\n   approved ──→ cancelled\n```\n\n#### 4.2 상태 전이 규칙\n\n| 현재 상태 | 허용 전이 | 전이 조건 |\n|-----------|-----------|-----------|\n| `draft` | `approved`, `cancelled` | 사용자 응답 |\n| `approved` | `executing`, `cancelled` | 실행 시작 또는 취소 |\n| `executing` | `completed`, `failed` | 모든 스킬 완료 또는 에러 |\n| `completed` | (최종 상태) | - |\n| `failed` | (최종 상태) | - |\n| `cancelled` | (최종 상태) | - |\n\n#### 4.3 상태 변경 시 필수 기록\n\n| 전이 | 기록 사항 | 기록 위치 |\n|------|-----------|-----------|\n| → `approved` | `approvedAt` 타임스탬프 | 프론트매터 `updated` + `plan-state.json` |\n| → `executing` | 실행 시작 시각 | 프론트매터 `updated` |\n| → `completed` | `completedAt` + 결과 요약 | 프론트매터 `updated` + 본문 Execution Result 섹션 |\n| → `failed` | `failedAt` + 실패 원인 | 프론트매터 `updated` + 본문 Execution Result 섹션 |\n| → `cancelled` | `cancelledAt` + 사유 | 프론트매터 `updated` + `plan-state.json` |\n\n#### 4.4 `/cc` 결과 문서의 상태\n\n`/cc`는 계획 없이 즉시 실행하므로 상태 머신이 단순하다:\n\n```\nexecuting → completed | failed\n```\n\n`result` 타입 문서의 프론트매터에 `status: completed` 또는 `status: failed`로 기록.\n\n---\n\n## 5. 문서 연결 컨벤션\n\n### 현재 상태\n\n| 항목 | 현재 규칙 | 문제점 |\n|------|-----------|--------|\n| Plan → Result | Plan 파일 하단에 Execution Result 섹션 추가 | 한 파일에 계획과 결과가 혼재. 파일이 길어짐 |\n| Result → Plan | 없음 | 역참조 불가 |\n| Plan → Plan | 없음 | 연속 작업의 흐름 추적 불가 |\n| `/cc` → `/cp` | 없음 | `/cc` 결과를 바탕으로 `/cp` 계획을 세울 때 연결 없음 |\n\n### 개선된 규칙\n\n#### 5.1 연결 방식: 프론트매터 참조\n\n```yaml\n---\nid: plan_m1abc_f3d2\nparent_id: plan_m0xyz_a1b2       # 이 문서의 선행 문서\nrelated: [result_m1abc_e3f4]     # 관련 문서 목록\n---\n```\n\n#### 5.2 연결 시나리오\n\n| 시나리오 | 연결 방법 |\n|----------|-----------|\n| Plan 실행 후 결과 기록 | Plan 파일 하단에 `## Execution Result` 섹션 추가 (현재 방식 유지). 결과가 복잡하면 별도 `result` 문서 생성 후 `related`로 연결 |\n| 연속 Plan | 후속 Plan의 `parent_id`에 선행 Plan ID 기재 |\n| `/cc` 결과 → `/cp` 계획 | Plan의 `parent_id`에 Result 문서 ID 기재 |\n| 실패 후 재시도 | 새 Plan의 `parent_id`에 실패한 Plan ID 기재 |\n\n#### 5.3 본문 내 참조 형식\n\n문서 본문에서 다른 문서를 참조할 때:\n\n```markdown\n> 이전 계획 [plan_m0xyz_a1b2](../plans/plan-2026-03-01-db-migration.md) 에서 이어지는 작업입니다.\n```\n\n형식: `[{document_id}]({relative_path})`\n\n#### 5.4 Execution Result 섹션 (Plan 파일 내)\n\nPlan 파일에 결과를 인라인으로 추가할 때의 표준 형식:\n\n```markdown\n---\n\n## Execution Result / 실행 결과\n\n> Completed on {YYYY-MM-DDTHH:mm:ss+TZ}\n\n### Outcomes / 실행 결과 상세\n- [ ] {기대 결과 1} → {실제 결과}\n- [x] {기대 결과 2} → {실제 결과}\n\n### Files Changed / 변경된 파일\n| File | Action | Description |\n|------|--------|-------------|\n| `src/auth.js` | Modified | JWT 검증 로직 추가 |\n| `src/middleware.js` | Created | 인증 미들웨어 신규 생성 |\n\n### Status: {Completed | Failed}\n```\n\n> **기대 결과 항목**: Plan 단계의 `## Expected Outcomes`의 체크리스트와 1:1 매핑. 달성한 항목은 `[x]`, 미달성은 `[ ]`.\n\n---\n\n## 6. 품질 기준 컨벤션\n\n### 현재 상태\n\n| 항목 | 현재 규칙 | 문제점 |\n|------|-----------|--------|\n| 필수 섹션 | SKILL.md에 템플릿으로만 정의 | \"이 섹션이 없으면 거부\" 같은 규칙 없음 |\n| 구체성 | 없음 | \"JWT 구현\" vs \"Express.js 4.x에서 RS256 JWT 발급/검증 구현\" 구분 안 됨 |\n| 검증 | 없음 | AI가 생성한 문서가 품질 기준을 충족하는지 확인 방법 없음 |\n\n### 개선된 규칙\n\n#### 6.1 작업계획서 (Plan) 필수 섹션\n\n| # | 섹션 | 필수 여부 | 최소 요구사항 |\n|---|------|-----------|---------------|\n| 1 | 프론트매터 | 필수 | 2.1의 모든 필수 필드 |\n| 2 | Task / 요청사항 | 필수 | 사용자 원문 + 1줄 이상 컨텍스트 |\n| 3 | Matched Skills | 필수 | 1개 이상 매칭된 스킬. Why Selected 칼럼 비어있으면 안 됨 |\n| 4 | Execution Plan | 필수 | Step별 Skill + Input + Expected output. 최소 1 Step |\n| 5 | Expected Outcomes | 필수 | 체크리스트 형태. 최소 1개. 검증 가능한 구체적 결과물 |\n| 6 | Risks & Considerations | 선택 | 복잡한 작업(3 Step 이상)이면 필수 |\n| 7 | Execution Mode | 필수 | Single 또는 Parallel 명시 |\n\n#### 6.2 구체성 수준 기준\n\n**나쁜 예** vs **좋은 예**:\n\n| 항목 | 나쁜 예 (거부) | 좋은 예 (승인) |\n|------|---------------|---------------|\n| Task | \"인증 구현\" | \"Next.js 14 App Router 프로젝트에 Google OAuth 2.0 로그인 추가\" |\n| Expected Output | \"코드 생성\" | \"`src/app/api/auth/[...nextauth]/route.ts` 파일 생성, Google provider 설정 포함\" |\n| Input | \"사용자 요청\" | \"사용자의 원본 요청 + `package.json`의 현재 의존성 목록\" |\n| Risk | \"문제가 생길 수 있음\" | \"기존 session 기반 인증과 충돌 가능 → 마이그레이션 가이드 포함 필요\" |\n\n#### 6.3 검증 체크리스트 (AI 셀프 체크)\n\nPlan 생성 후, 사용자에게 제시하기 전에 AI가 내부적으로 확인:\n\n```\n[ ] 프론트매터의 필수 필드 7개 모두 존재하는가?\n[ ] 모든 Matched Skill이 실제 세션에 존재하는 스킬인가?\n[ ] Expected Outcomes가 검증 가능한 형태인가? (파일명, 동작, 수치 등)\n[ ] Execution Plan의 각 Step에 Input과 Expected Output이 있는가?\n[ ] 본문 언어가 3.1 우선순위 규칙을 따르는가?\n[ ] 상태가 \"draft\"로 설정되어 있는가?\n```\n\n#### 6.4 실행 결과 (Result) 품질 기준\n\n| # | 항목 | 필수 여부 | 기준 |\n|---|------|-----------|------|\n| 1 | 완료 타임스탬프 | 필수 | ISO 8601 |\n| 2 | Expected Outcomes 매핑 | 필수 | Plan의 체크리스트와 1:1 대응 |\n| 3 | 변경 파일 목록 | 필수 | 파일이 변경된 경우 |\n| 4 | 최종 상태 | 필수 | Completed / Failed |\n| 5 | 실패 원인 | Failed일 때 필수 | 에러 메시지 또는 원인 설명 |\n\n---\n\n## 7. 템플릿 분리 컨벤션\n\n### 현재 상태\n\n| 항목 | 현재 규칙 | 문제점 |\n|------|-----------|--------|\n| Plan 템플릿 | `skills/cp/SKILL.md` 안에 마크다운 코드 블록으로 하드코딩 | 템플릿만 수정하려면 SKILL.md 전체를 편집해야 함. 워크플로우 로직과 템플릿이 혼재 |\n| `/cc` 합성 포맷 | `skills/cc/SKILL.md` 안에 ASCII art 박스로 하드코딩 | 동일 문제 |\n| 확장 | 불가능 | 사용자가 자신만의 템플릿을 정의할 방법 없음 |\n\n### 개선된 규칙\n\n#### 7.1 템플릿 파일 분리 원칙\n\n```\n유지: SKILL.md에는 워크플로우 로직만 기술\n분리: 템플릿은 별도 파일로 추출\n참조: SKILL.md에서 템플릿 파일 경로를 명시\n```\n\n#### 7.2 템플릿 파일 위치\n\n```\nlens/\n├── templates/                    # (신규) 템플릿 파일 디렉토리\n│   ├── plan.md                   # /cp 작업계획서 템플릿\n│   ├── result.md                 # /cc 실행 결과 합성 템플릿\n│   └── execution-result.md       # Plan 파일 하단에 추가하는 결과 섹션 템플릿\n├── skills/\n│   ├── cp/SKILL.md               # 워크플로우만 (템플릿 → templates/plan.md 참조)\n│   └── cc/SKILL.md               # 워크플로우만 (템플릿 → templates/result.md 참조)\n```\n\n#### 7.3 SKILL.md에서의 참조 방식\n\n```markdown\n### 3. Generate Plan Document\n\nCreate a work plan document using the template at `templates/plan.md`.\nRead the template file using the Read tool, fill in all `{placeholder}` values,\nand save the result to `.lens/plans/` with the standard file naming convention.\n```\n\n#### 7.4 템플릿 변수 규칙\n\n템플릿 내 변수는 중괄호 `{variable_name}` 형식:\n\n| 변수 | 타입 | 설명 |\n|------|------|------|\n| `{id}` | string | 문서 ID (generatePlanId() 결과) |\n| `{created}` | ISO 8601 | 생성 시각 |\n| `{status}` | enum | 초기 상태 (`draft`) |\n| `{language}` | string | ISO 639-1 코드 |\n| `{task}` | string | 사용자 원문 요청 |\n| `{skill_table}` | markdown table | 매칭된 스킬 테이블 |\n| `{execution_steps}` | markdown | Step별 실행 계획 |\n| `{expected_outcomes}` | markdown checklist | 기대 결과 체크리스트 |\n| `{risks}` | markdown list | 위험 요소 (선택) |\n| `{execution_mode}` | string | Single 또는 Parallel |\n\n#### 7.5 사용자 커스텀 템플릿 (향후)\n\n`lens.config.json`에서 커스텀 템플릿 경로 지정:\n\n```json\n{\n  \"templates\": {\n    \"plan\": \"./my-templates/custom-plan.md\",\n    \"result\": null\n  }\n}\n```\n\n- `null`이면 기본 템플릿 사용\n- 지정된 경로의 파일이 없으면 기본 템플릿으로 폴백\n\n---\n\n## 8. 에러/실패 기록 컨벤션\n\n### 현재 상태\n\n| 항목 | 현재 규칙 | 문제점 |\n|------|-----------|--------|\n| 스킬 실행 실패 | `/cc`에서 \"note it briefly and continue\" | 기록 형식, 위치 미정의 |\n| Agent 에러 | `agent-tracker.js`에 `error` 필드 (최대 500자) | 에이전트 단위 에러만. 문서 단위 에러 없음 |\n| Plan 실패 | `Status: Failed`만 기록 | 실패 원인, 재시도 가이드 없음 |\n| 부분 성공 | `Status: Partial` | \"어디까지 성공했고 어디서 실패했는지\" 구조화 안 됨 |\n\n### 개선된 규칙\n\n#### 8.1 에러 기록 3계층\n\n```\nLevel 1: Agent 에러     → agent-dashboard.json (자동, 훅이 기록)\nLevel 2: 문서 에러      → Plan/Result 파일 본문 (구조화된 섹션)\nLevel 3: 세션 에러 요약  → plan-state.json의 status + failedAt\n```\n\n#### 8.2 실패 시 Plan 파일에 기록할 내용\n\n```markdown\n---\n\n## Execution Result / 실행 결과\n\n> Failed on {YYYY-MM-DDTHH:mm:ss+TZ}\n\n### Outcomes / 실행 결과 상세\n- [x] {성공한 기대 결과} → {실제 결과}\n- [ ] {실패한 기대 결과} → **FAILED**: {실패 원인}\n\n### Error Details / 에러 상세\n\n| Step | Skill | Status | Error |\n|------|-------|--------|-------|\n| 1 | /skill-a | Completed | - |\n| 2 | /skill-b | **Failed** | `TypeError: Cannot read property 'x' of undefined` |\n| 3 | /skill-c | Skipped | Step 2 실패로 미실행 |\n\n### Recovery Suggestion / 복구 제안\n- {구체적인 복구 방법}\n- {대안 접근법}\n\n### Status: Failed\n```\n\n#### 8.3 부분 성공 처리\n\n- Plan에 3개 Step이 있고, Step 1-2는 성공, Step 3은 실패한 경우:\n  - **Status**: `failed` (전체 Plan은 실패)\n  - **각 Step 상태**: 개별적으로 Completed/Failed/Skipped 표기\n  - **Recovery Suggestion**: 실패한 Step부터 재시도하는 방법 기재\n\n> **`Partial` 상태 폐지**: 기존 `Partial`은 모호하다. 대신 `failed` 상태 + 본문에서 성공/실패 Step을 명시한다.\n\n#### 8.4 `/cc` 병렬 실행 실패\n\n```markdown\n### Agent Execution Summary / 에이전트 실행 요약\n\n| # | Skill | Status | Duration | Error |\n|---|-------|--------|----------|-------|\n| 1 | /skill-a | Done | 3.2s | - |\n| 2 | /skill-b | Error | 1.5s | Timeout after 30s |\n| 3 | /skill-c | Done | 5.1s | - |\n\n### Partial Results Available\n{성공한 에이전트들의 결과는 정상 표시. 실패한 에이전트는 \"Error\" 표기 후 이유 명시}\n```\n\n#### 8.5 에러 메시지 형식\n\n```\n에러 메시지는 다음 형식을 따른다:\n- 첫 줄: 에러 유형 (TypeError, NetworkError, TimeoutError 등)\n- 둘째 줄: 발생 위치 (파일명 + 함수명 또는 스킬명)\n- 셋째 줄: 원인 요약 (자연어)\n- 최대 500자\n```\n\n---\n\n## 부록: 현재 → 개선 마이그레이션 요약\n\n| # | 컨벤션 | 영향받는 파일 | 변경 규모 |\n|---|--------|--------------|-----------|\n| 1 | 문서 네이밍 | `plan-manager.js`, `skills/cp/SKILL.md` | 중 (파일명 형식 변경, 폴더 추가) |\n| 2 | 헤더/메타데이터 | `skills/cp/SKILL.md`, `plan-manager.js` | 대 (YAML 프론트매터 도입) |\n| 3 | 다국어 | `skills/cp/SKILL.md`, `skills/cc/SKILL.md` | 소 (규칙 명확화) |\n| 4 | 상태 관리 | `plan-manager.js`, `skills/cp/SKILL.md` | 중 (상태 머신 확장) |\n| 5 | 문서 연결 | `plan-manager.js`, `skills/cp/SKILL.md` | 중 (프론트매터 참조 추가) |\n| 6 | 품질 기준 | `skills/cp/SKILL.md` | 소 (셀프 체크 규칙 추가) |\n| 7 | 템플릿 분리 | 신규 `templates/` 디렉토리, `skills/cp/SKILL.md`, `skills/cc/SKILL.md` | 대 (구조 변경) |\n| 8 | 에러/실패 | `skills/cp/SKILL.md`, `skills/cc/SKILL.md`, `plan-manager.js` | 중 (실패 기록 구조화) |\n\n### 구현 우선순위\n\n```\nPhase 1 (즉시): 3. 다국어, 6. 품질 기준 — SKILL.md 텍스트 수정만으로 적용 가능\nPhase 2 (단기): 2. 메타데이터, 4. 상태 관리, 8. 에러 기록 — SKILL.md + plan-manager.js 수정\nPhase 3 (중기): 1. 네이밍, 5. 문서 연결 — 파일명 형식 변경, 기존 파일과의 호환성 고려\nPhase 4 (장기): 7. 템플릿 분리 — 디렉토리 구조 변경, config 확장, SKILL.md 대폭 수정\n```\n","truncated":false,"stale":false},{"id":"documentation-guide","folder":"rules","title":"Lens 문서화 가이드","date":"","hasMd":true,"hasHtml":false,"mdPath":"rules/documentation-guide.md","htmlPath":null,"mdInline":"# Lens 문서화 가이드\r\n\r\n> lens 프로젝트의 문서 작성 표준 및 체계 정의서\r\n\r\n---\r\n\r\n## 1. 문서 체계 개요\r\n\r\n### 1.1 원칙\r\n\r\nlens의 문서는 **읽는 대상**에 따라 역할이 분리된다.\r\n\r\n| 문서 | 대상 독자 | 핵심 질문 |\r\n|------|-----------|-----------|\r\n| `CLAUDE.md` | Claude (AI 에이전트) | \"이 프로젝트가 뭐고, 뭐가 어디 있지?\" |\r\n| `README.md` | 외부 사용자 (GitHub) | \"이걸 왜 쓰고, 어떻게 설치하지?\" |\r\n| `CHANGELOG.md` | 개발자 / 기여자 | \"뭐가 바뀌었지?\" |\r\n| `plugin.json` | Claude Code 런타임 | \"이 플러그인의 이름, 버전, 메타데이터는?\" |\r\n\r\n**문서 간 정보 중복 금지.** 한 곳에서 정의하고, 나머지는 링크로 참조한다.\r\n\r\n### 1.2 버전 단일 원천 (Single Source of Truth)\r\n\r\n```\r\nplugin.json의 \"version\" 필드 = 프로젝트의 공식 버전\r\n```\r\n\r\n다른 모든 파일에서 버전을 표기할 때는 `plugin.json`의 값을 따른다.\r\n버전을 하드코딩하는 파일 목록:\r\n\r\n| 파일 | 위치 | 형태 |\r\n|------|------|------|\r\n| `.claude-plugin/plugin.json` | `\"version\"` 필드 | **원천** |\r\n| `hooks/hooks.json` | `\"description\"` 문자열 | 참조 |\r\n| `hooks/session-start.js` | `systemMessage` 문자열 | 참조 |\r\n| `skills/c/SKILL.md` | frontmatter `description` | 참조 |\r\n| `skills/cc/SKILL.md` | frontmatter `description` | 참조 |\r\n| `skills/cp/SKILL.md` | frontmatter `description` | 참조 |\r\n| `lens.config.json` | `\"version\"` 필드 | 참조 |\r\n\r\n릴리스 시 위 파일들의 버전 문자열을 **일괄 업데이트**한다.\r\n\r\n---\r\n\r\n## 2. CLAUDE.md 작성 규칙\r\n\r\n### 2.1 목적\r\n\r\nClaude가 이 파일 **하나만 읽으면** lens 전체를 파악할 수 있어야 한다.\r\n세션 시작 시 자동으로 로드되므로, 가장 중요한 문서다.\r\n\r\n### 2.2 구조 (필수 섹션, 순서 고정)\r\n\r\n```markdown\r\n# lens — [한 줄 정의]\r\n\r\n## 버전\r\n- 현재: vX.Y.Z\r\n- 마지막 업데이트: YYYY-MM-DD\r\n\r\n## 스킬\r\n| 스킬 | 설명 | 워크플로우 |\r\n(각 스킬의 핵심 동작을 1-2줄로)\r\n\r\n## 훅\r\n| 훅 | 이벤트 | 파일 | 설명 |\r\n(5개 훅 전체, 트리거 조건 포함)\r\n\r\n## 라이브러리 (lib/)\r\n| 모듈 | 파일 | 핵심 함수 | 설명 |\r\n(각 모듈의 주요 export 함수 나열)\r\n\r\n## 폴더 구조\r\n(전체 파일 트리 + 각 파일 한 줄 역할)\r\n\r\n## 설정\r\n| 옵션 | 기본값 | 설명 |\r\n(lens.config.json 옵션 전체)\r\n\r\n## 감지 대상\r\n| 타입 | 감지 방법 | 예시 |\r\n(Skill, MCP, LSP, Hybrid)\r\n\r\n## 알려진 이슈 / TODO\r\n(현재 알려진 버그나 미완성 항목)\r\n\r\n## 변경 이력 요약\r\n(최근 2-3개 버전만 한 줄씩. 상세는 CHANGELOG.md 참조)\r\n```\r\n\r\n### 2.3 작성 규칙\r\n\r\n| 규칙 | 설명 |\r\n|------|------|\r\n| **200줄 이내** | Claude의 자동 메모리 파일은 200줄 이후 잘림. 반드시 지킨다 |\r\n| **코드 블록 금지** | 구현 코드를 넣지 않는다. 파일 경로와 함수명만 표기 |\r\n| **테이블 우선** | 산문보다 테이블이 정보 밀도가 높다. 가능하면 테이블 사용 |\r\n| **링크로 위임** | 상세 내용은 `CHANGELOG.md`, `README.md`, 소스코드로 링크 |\r\n| **현재 상태만** | 과거 히스토리는 CHANGELOG에. CLAUDE.md는 \"지금\" 상태만 기술 |\r\n| **파일 역할 전수 기록** | 새 파일 추가 시 반드시 폴더 구조 섹션에 반영 |\r\n\r\n### 2.4 업데이트 시점\r\n\r\n- 새 파일 추가/삭제 시\r\n- 새 스킬 또는 훅 추가 시\r\n- 버전 릴리스 시\r\n- 설정 옵션 변경 시\r\n\r\n---\r\n\r\n## 3. README.md 작성 규칙\r\n\r\n### 3.1 목적\r\n\r\nGitHub에서 lens을 발견한 **외부 사용자**가 5분 안에 설치하고 사용할 수 있게 한다.\r\n\r\n### 3.2 구조 (필수 섹션, 순서 고정)\r\n\r\n```markdown\r\n# Lens\r\n\r\n[한 줄 소개]\r\n\r\n## The Problem\r\n(왜 이 플러그인이 필요한지)\r\n\r\n## The Solution\r\n(사용 예시 — 코드 블록으로)\r\n\r\n## Installation\r\n(3가지 옵션: GitHub clone, curl, local plugin)\r\n\r\n## Usage\r\n### /c — [설명]\r\n### /cc — [설명]\r\n(사용 예시 테이블)\r\n\r\n## How It Works\r\n(각 스킬의 워크플로우 — 번호 리스트로)\r\n\r\n## Features\r\n(불릿 리스트)\r\n\r\n## Configuration\r\n(lens.config.json 옵션 테이블)\r\n\r\n## Requirements\r\n\r\n## License\r\n```\r\n\r\n### 3.3 작성 규칙\r\n\r\n| 규칙 | 설명 |\r\n|------|------|\r\n| **내부 구현 상세 없음** | 아키텍처, 파일 구조, 함수명 등은 README에 넣지 않는다 |\r\n| **설치가 최우선** | Installation 섹션은 반드시 Usage 전에 온다 |\r\n| **복사-붙여넣기 가능** | 설치 명령어는 그대로 복사해서 터미널에 붙여넣을 수 있어야 한다 |\r\n| **스크린샷/예시 우선** | \"어떻게 보이는지\"를 먼저 보여주고 설명은 뒤에 |\r\n| **버전 하드코딩 금지** | README 본문에 버전 번호를 넣지 않는다 (금방 낡음) |\r\n\r\n### 3.4 README에 넣지 않는 것\r\n\r\n- 파일별 역할 설명 (→ `CLAUDE.md`)\r\n- 버전별 변경 이력 (→ `CHANGELOG.md`)\r\n- 훅 상세 동작 원리 (→ `CLAUDE.md`)\r\n- 라이브러리 모듈 API (→ 소스코드 JSDoc)\r\n\r\n---\r\n\r\n## 4. CHANGELOG.md 작성 규칙\r\n\r\n### 4.1 목적\r\n\r\n모든 버전의 변경사항을 **누락 없이** 기록한다.\r\n코드의 실제 상태와 항상 일치해야 한다.\r\n\r\n### 4.2 형식 (Keep a Changelog 기반)\r\n\r\n```markdown\r\n## [X.Y.Z] - YYYY-MM-DD\r\n\r\n### Added (vX.Y.Z)\r\n- **기능명** — 설명. `관련파일.js`\r\n\r\n### Changed (vX.Y.Z)\r\n- **변경 대상** — 무엇이 어떻게 바뀌었는지. `관련파일.js`\r\n\r\n### Fixed (vX.Y.Z)\r\n- **버그명** — 무엇이 어떻게 고쳐졌는지. `관련파일.js`\r\n\r\n### Removed (vX.Y.Z)\r\n- **제거 대상** — 왜 제거했는지\r\n```\r\n\r\n### 4.3 작성 규칙\r\n\r\n| 규칙 | 설명 |\r\n|------|------|\r\n| **최신 버전이 맨 위** | 역순 시간순 (newest first) |\r\n| **관련 파일 명시** | 각 항목 끝에 백틱으로 파일명 표기 |\r\n| **카테고리 태그** | Added, Changed, Fixed, Removed 중 해당하는 것만 사용 |\r\n| **버전 태그 표기** | 각 카테고리 제목에 `(vX.Y.Z)` 붙여서 접혀도 구분 가능 |\r\n| **커밋과 1:1** | 하나의 릴리스 커밋 = 하나의 CHANGELOG 엔트리 |\r\n\r\n### 4.4 CHANGELOG에 넣지 않는 것\r\n\r\n- 미래 계획 (→ TODO나 Issues)\r\n- 사용법 설명 (→ `README.md`)\r\n- 아키텍처 결정 이유 (→ `CLAUDE.md` 또는 커밋 메시지)\r\n\r\n---\r\n\r\n## 5. plugin.json 작성 규칙\r\n\r\n### 5.1 목적\r\n\r\nClaude Code 런타임이 읽는 메타데이터 + **버전의 단일 원천**.\r\n\r\n### 5.2 필수 필드\r\n\r\n```json\r\n{\r\n  \"name\": \"lens\",\r\n  \"version\": \"X.Y.Z\",\r\n  \"description\": \"[/c와 /cc의 핵심 기능을 포함한 50단어 이내 설명]\",\r\n  \"author\": {\r\n    \"name\": \"Lens\",\r\n    \"email\": \"livevil7@gmail.com\",\r\n    \"url\": \"https://github.com/CreetaCorp/lens\"\r\n  },\r\n  \"repository\": \"https://github.com/CreetaCorp/lens\",\r\n  \"license\": \"MIT\",\r\n  \"keywords\": [...]\r\n}\r\n```\r\n\r\n### 5.3 규칙\r\n\r\n| 규칙 | 설명 |\r\n|------|------|\r\n| **description에 버전 넣지 않음** | description은 기능 설명만. 버전은 version 필드에 |\r\n| **keywords 최신 유지** | 새 기능 추가 시 관련 키워드도 추가 |\r\n\r\n---\r\n\r\n## 6. 소스코드 내 문서화 규칙\r\n\r\n### 6.1 파일 헤더 주석\r\n\r\n모든 `.js` 파일 첫 줄에 역할 설명:\r\n\r\n```javascript\r\n/**\r\n * Lens - [모듈명]\r\n * [한 줄 설명]\r\n */\r\n```\r\n\r\n### 6.2 함수 JSDoc\r\n\r\nexport되는 함수에만 JSDoc 작성:\r\n\r\n```javascript\r\n/**\r\n * [한 줄 설명]\r\n * @param {Type} name - 설명\r\n * @returns {Type} 설명\r\n */\r\n```\r\n\r\n### 6.3 버전 문자열\r\n\r\n소스코드 내 버전 문자열은 `plugin.json`을 런타임에 읽는 것이 이상적이나,\r\n현재는 하드코딩되어 있으므로 릴리스 체크리스트에서 일괄 업데이트한다.\r\n\r\n---\r\n\r\n## 7. 릴리스 체크리스트\r\n\r\n새 버전 릴리스 시 반드시 수행:\r\n\r\n```\r\n[ ] 1. plugin.json \"version\" 업데이트\r\n[ ] 2. hooks.json \"description\" 버전 문자열 업데이트\r\n[ ] 3. session-start.js systemMessage 버전 문자열 업데이트\r\n[ ] 4. skills/c/SKILL.md description 버전 문자열 업데이트\r\n[ ] 5. skills/cc/SKILL.md description 버전 문자열 업데이트 (해당 시)\r\n[ ] 6. skills/cp/SKILL.md description 버전 문자열 업데이트 (해당 시)\r\n[ ] 7. lens.config.json \"version\" 업데이트\r\n[ ] 8. CHANGELOG.md에 새 버전 엔트리 추가\r\n[ ] 9. CLAUDE.md 버전 + 변경사항 반영\r\n[ ] 10. README.md 변경사항 반영 (사용자에게 영향 있는 경우만)\r\n[ ] 11. git commit + tag + push\r\n[ ] 12. GitHub Release 생성\r\n```\r\n\r\n---\r\n\r\n## 8. 문서 흐름도\r\n\r\n```\r\n                    ┌─────────────────────┐\r\n                    │    plugin.json       │\r\n                    │  (버전 단일 원천)     │\r\n                    └──────────┬──────────┘\r\n                               │\r\n              ┌────────────────┼────────────────┐\r\n              │                │                │\r\n              ▼                ▼                ▼\r\n     ┌────────────┐   ┌──────────────┐   ┌───────────┐\r\n     │  CLAUDE.md  │   │  README.md   │   │ CHANGELOG │\r\n     │ (AI 브리핑) │   │ (사용자 가이드)│   │ (변경 이력)│\r\n     └──────┬─────┘   └──────────────┘   └───────────┘\r\n            │\r\n            │ Claude가 세션 시작 시 읽음\r\n            │\r\n            ▼\r\n     ┌─────────────────────────────┐\r\n     │  소스코드 (필요시만 읽기)     │\r\n     │  hooks/, lib/, scripts/,    │\r\n     │  skills/                    │\r\n     └─────────────────────────────┘\r\n```\r\n\r\n**Claude 읽기 순서**: `CLAUDE.md` (필수) → `CHANGELOG.md` (필요시) → 소스코드 (수정 시)\r\n**사용자 읽기 순서**: `README.md` (필수) → `CHANGELOG.md` (업데이트 확인 시)\r\n","truncated":false,"stale":false},{"id":"harness-rules","folder":"rules","title":"하네스 규칙 (Harness Rules)","date":"","hasMd":true,"hasHtml":false,"mdPath":"rules/harness-rules.md","htmlPath":null,"mdInline":"# 하네스 규칙 (Harness Rules)\r\n\r\nLens 스킬 구성원(워커·감독·QA·리서치)의 작업 규율 기준선(SoT). 스킬 본문에 어떤 규칙을 넣고 어떤 규칙을 뺄지 판정할 때, 그리고 워커 디스패치 프롬프트를 설계할 때 이 문서를 기준으로 삼는다.\r\n\r\n**출처와 한계**:\r\n\r\n- 소스: 공개 저장소 asgeirtj/system_prompts_leaks 의 Claude Code 2.1.172 (Fable 5) 시스템 프롬프트 추출본 + claude.ai Fable 추출본 조사 결과.\r\n- **비공식 추출본이므로 정확성·최신성을 보증할 수 없다.** 원문 문구를 복제하지 않고 원칙만 선별해 재서술했다.\r\n- 재대조 채널: Claude Code 버전업이 감지되면 `/crv` 감사에서 이 문서를 당시 최신 추출본과 재대조하고 갱신한다.\r\n\r\n## 1. Additive-only 판정 기준\r\n\r\n스킬 본문에 규칙을 넣기 전에 한 가지를 묻는다: **\"Claude Code 하네스가 이미 강제하는 규칙인가?\"** yes 면 스킬 본문에 재복붙하지 않는다. 호스트가 풀 시스템 프롬프트를 이미 갖고 있으므로 스킬은 additive 규칙만 얹는다 (HouMinXi/fable-prompts 의 Lossless Transformation 교훈).\r\n\r\n재복붙이 허용되는 예외는 세 가지뿐이다:\r\n\r\n1. **워커 디스패치 프롬프트** — 서브에이전트 컨텍스트에서는 하네스 규칙 준수가 약해지므로, 약해지는 규칙을 디스패치 프롬프트에 재강조한다.\r\n2. **하네스가 강제하지 못하는 Lens 특화 지점** — 모니터 필터, 보고 템플릿, Codex 호출, 승인 게이트.\r\n3. **자주 위반되는 규칙의 3중 반복** — 규칙 본문 + self-check 질문 + 위반 시 결과를 각각 별도 위치에 배치한다.\r\n\r\n## 2. 규칙 인벤토리\r\n\r\n### A. 자율 실행·턴 종료 (→ /c·/cc 워커 프롬프트)\r\n\r\n- **자율 운영**: 사용자는 실시간으로 지켜보지 않는다. 작업 도중 \"~할까요?\" 라고 물으면 전체 작업이 블로킹된다. 원래 요청에서 자연히 따라 나오는 되돌릴 수 있는 행동은 묻지 않고 진행한다. 멈춰야 하는 경우는 파괴적 행동과 진짜 스코프 변경뿐. 완료 후 후속 제안은 허용, 작업 전에 허락을 구하는 것은 금지.\r\n- **마지막 문단 검사**: 턴을 끝내기 전 마지막 문단을 본다. 계획, 질문, \"이제 ~하겠습니다\" 류 약속으로 끝난다면 멈추지 말고 지금 도구를 호출해 실행한다. 에러 후 재시도와 누락 정보 수집도 같은 원칙. 세션이 길어졌다는 이유로 멈추지 않는다.\r\n- **진단 예외**: 사용자가 문제를 서술하거나 질문하는 중이면 산출물은 \"평가\"다 — 진단을 보고하고 멈춘다. 요청받기 전에 수정하지 않는다.\r\n- **상태 변경 전 증거 검사**: 재시작·삭제·설정 변경 같은 상태 변경 전에, 확보한 증거가 그 특정 행동을 정말 뒷받침하는지 확인한다. 패턴이 일치해 보여도 원인은 다를 수 있다.\r\n\r\n### B. 검증·정직 보고 (→ 전 스킬 워커 + QA)\r\n\r\n- **결과 충실 보고**: 실패는 출력과 함께 실패라고, 스킵은 스킵이라고 말한다. 완료·검증 상태는 헤징 없이 단언한다. 결과 미화 금지.\r\n- **완료 마킹 엄격**: 완전히(FULLY) 달성했을 때만 completed. 테스트 실패, 부분 구현, 미해결 에러, 의존성 미발견 상태에서는 절대 completed 로 마킹하지 않는다.\r\n- **침묵은 성공이 아니다** (→ Monitor): 감시 필터는 happy path 만이 아니라 가능한 모든 종결 상태를 매치해야 한다. 성공 마커만 grep 하는 모니터는 crashloop 과 행(hang)에 침묵한다. \"프로세스가 지금 죽으면 이 필터가 뭐라도 내보내는가?\" 를 자문한다.\r\n- **침묵 캡 금지**: top-N 이나 샘플링으로 커버리지를 잘랐다면 무엇이 잘려 나갔는지 명시한다.\r\n- **삭제·덮어쓰기 전 대상 확인**: 대상 실물을 직접 보고, 설명과 모순되거나 내가 만든 것이 아니면 진행하는 대신 표면화한다.\r\n\r\n### C. 오케스트레이션 (→ /cc Leader)\r\n\r\n- **위임 후 중복 금지 + 결과 릴레이**: 위임한 검색·작업을 본인이 다시 수행하지 않는다. 에이전트의 최종 메시지는 호출자만 본다 — 중요한 내용은 반드시 사용자에게 재서술한다. 기존 에이전트는 SendMessage 로 컨텍스트를 이어서 재사용한다.\r\n- **pipeline 기본, barrier 는 예외**: 기본은 파이프라인 진행. barrier(전체 완료 대기)는 전체 결과셋이 물리적으로 필요할 때만 — dedup, 조기종료 판단, 상호비교. \"개념적으로 별개 단계\"라는 이유는 barrier 사유가 아니다.\r\n- **하이브리드 스카우팅**: 인라인 정찰로 work-list 를 먼저 확보한 뒤 fan-out 한다.\r\n- **요청 규모 스케일링**: \"빨리 확인\" → 소규모 풀 + 단일 검증. \"철저히\" → 큰 풀 + 다중 적대 검증.\r\n- **loop-until-dry**: 크기를 모르는 발견 작업은 연속 K회 빈손이 나올 때까지 반복한다. dedup 은 이번 라운드가 아니라 seen 전체 기준.\r\n\r\n### D. QA 패턴 (→ /ccp)\r\n\r\n- **Adversarial verify**: 발견마다 독립적인 회의론자들이 반박을 시도한다. 불확실하면 refuted 가 기본값. 과반이 반박하면 그 발견은 kill.\r\n- **Perspective-diverse verify**: 동일한 반박자 N명 대신 렌즈를 분산한다 — correctness / security / performance / 재현성.\r\n- **완결성 비평가**: 최종 산출 전 \"빠진 것은? 안 돌린 검증, 미확인 주장, 안 읽은 소스는?\" 을 점검하는 단계를 둔다.\r\n- **Self-check**: 산출 직전 확인할 yes/no 질문 목록을 규칙 본문과 별도 위치에 배치한다 (drift 저항).\r\n\r\n### E. 계획 (→ /cp·/cpp)\r\n\r\n- **Elicitation gate**: 질문하기 전에 대화 이력·코드·합리적 기본값에서 스스로 답을 찾는다. 이미 상세한 제약을 받았다면 재질문은 second-guessing 이다. 질문은 1개 지향, 3개 상한.\r\n- **승인은 전용 게이트**: 요구사항 질문은 승인 요청 전에 끝낸다. 승인 질문에 요구사항 질문을 섞지 않는다.\r\n- **충분하면 행동**: 이미 확립된 사실을 재도출하거나, 내린 결정을 재논의하거나, 가지 않을 옵션을 나열하지 않는다. 추천은 1개만 낸다.\r\n\r\n### F. 리서치 (→ /cr)\r\n\r\n- **Unrecognized Entity Rule**: 모르는 제품·릴리즈·대상은 답하기 전 무조건 검색한다. 판별 테스트: \"답하려면 그게 뭔지 알아야 하는가?\" 부분적으로 들어본 것은 지식이 아니다.\r\n- **Effort scaling**: 단일 사실 1회 / 중간 난도 3~5회 / 심층 5~10회. 단일 검색으로 확정되면 1회로 끝낸다.\r\n- **Snippet 불신**: 검색 스니펫만으로 단정하지 않는다 — 전문을 fetch 한다.\r\n- **출처 위계**: 원출처 > 2차 출처. SEO 오염 영역(제품 추천 등)은 상위 랭크라도 회의적으로 본다. 충돌하는 출처는 충돌한다고 명기한다.\r\n- **\"없음\" 과신 금지**: 검색 결과의 부재를 존재의 부재에 대한 증거로 단정하지 않는다.\r\n\r\n### G. 공통 보고 (→ 전 스킬 최종 보고)\r\n\r\n- **결론 선행**: 첫 문장 = 무슨 일이 있었나 / 무엇을 발견했나.\r\n- **가독성 > 간결성**: 짧게 만드는 방법은 항목의 선택적 포함이지, 단편·화살표 체인·전문용어 압축이 아니다. 완전한 문장으로 쓴다.\r\n- **최종 메시지 완결성**: 사용자가 필요로 하는 전부(답·요약·결론·산출물 위치)는 마지막 메시지 안에 있어야 한다.\r\n- **내부 기제 내레이션 금지**: \"지침에 따라\", \"모듈을 로드했습니다\" 류 셋업 서술 금지 — 결과만 말한다.\r\n- **postamble 금지**: 산출물 링크 뒤에 긴 후기를 붙이지 않는다.\r\n\r\n## 3. 스킬 매핑\r\n\r\n| 규칙 | 적용 스킬 | 적용 지점 |\r\n|------|----------|----------|\r\n| A. 자율 실행·턴 종료 | /c, /cc | 워커 디스패치 프롬프트 |\r\n| B. 검증·정직 보고 | /c /cc /ccp /cp /cpp /cr 전체 | 워커 프롬프트 + QA 게이트 (인라인은 워커 프롬프트·QA 지점만 — 인-컨버세이션 스킬 본문은 호스트 하네스가 이미 강제, §1) |\r\n| B. 침묵은 성공이 아니다 | /c, /cc | Monitor 필터 설계 |\r\n| C. 오케스트레이션 | /cc | Leader (dispatch·파이프라인 설계) |\r\n| D. QA 패턴 | /ccp | 검증 파이프라인 (verify 팀 구성 + self-check) |\r\n| E. 계획 | /cp, /cpp | Elicitation 단계 + 승인 게이트 |\r\n| F. 리서치 | /cr | 리서치 파이프라인 (검색량·fetch·교차검증) |\r\n| G. 공통 보고 | 전 스킬 | 최종 보고 템플릿 (인라인은 워커 최종 보고 형식만 — 인-컨버세이션 보고는 호스트 하네스가 이미 강제, §1) |\r\n\r\n## 4. 충돌 심사 기록\r\n\r\nLens 기존 설계와 원문 원칙이 충돌해 보인 3건의 심사 결과. (4.1 은 v3.24.0 에서 재심사·개정, 4.2·4.3 은 Lens 설계 유지.)\r\n\r\n### 4.1 모델 할당 테이블 vs 모델 오버라이드 절제\r\n\r\n- 충돌: Lens 는 전 워커에 opus 를 고정 할당했다(/cc v3.11 설계). 원문 원칙은 모델 오버라이드를 절제하고 상속을 기본으로 한다.\r\n- 구 해소(v3.23 이하): 품질 우선 케이스로 고정 할당 유지 + \"불확실하면 상속\" 보강.\r\n- **재심사·개정 (v3.24.0, 2026-07-15 사용자 지시)**: 고정 이름 할당 **폐지** — \"최고 모델 무차별 배정 금지, 업무 난이도에 맞춰 배분\"이 원칙. 배분은 **난이도 사다리** — Easy=경량 티어(현재 haiku) / Medium=중간 티어(현재 sonnet) / Hard=**최상위 티어(TOP)**. 각 칸은 이름이 아니라 상대 위치라서 모델 세대와 함께 자동 상승한다. **TOP 판정 절차**: 세션 모델이 Task enum 최상위와 같거나 상위(예: Fable)면 지정 생략(상속), 미만이면 enum 최상위 명시(현재 fable, 없으면 opus). 미래 새 모델명의 우열 판별이 불확실하면 상속이 안전 기본값. Supervisor·QA 는 최고 사용 Worker 티어와 동급(역전 방지), Monitor 는 haiku 고정. 이로써 원문 원칙(오버라이드 절제·상속 기본)과도 정합.\r\n\r\n### 4.2 AskUserQuestion 승인 게이트 vs 되묻기 차단\r\n\r\n- 충돌: Lens 는 승인 게이트에서 AskUserQuestion 으로 사용자에게 묻는다. 원문 원칙은 작업 중 되묻기를 차단한다.\r\n- 해소: 승인 게이트는 파괴적 행동·스코프 결정에 대한 질문이므로 원문이 허용하는 예외에 해당한다 — **유지**. 차단 대상은 작업 중간의 \"~할까요?\" 류 허락 구하기뿐이다.\r\n\r\n### 4.3 5분 진행보고 vs 푸시 알림 절제\r\n\r\n- 충돌: Lens 는 5분 주기 진행보고를 한다. 원문 원칙은 푸시 알림을 절제하라고 한다.\r\n- 해소: 진행보고는 대화 안의 텍스트 한 줄이므로 충돌이 아니다 — **유지**. 사용자 주의를 강제로 끄는 푸시 알림과는 구분한다.\r\n","truncated":false,"stale":false},{"id":"live-research","folder":"rules","title":"Live Research substrate (agent-reach + insane-search)","date":"","hasMd":true,"hasHtml":false,"mdPath":"rules/live-research.md","htmlPath":null,"mdInline":"# Live Research substrate (agent-reach + insane-search)\r\n\r\n> Lens 스킬(`/cpp` S2, `/cr`)이 \"현재 라이브 정보\"(최신 릴리즈·트렌드·이슈·커뮤니티 반응)를 가져오는 표준 경로.\r\n> 도구 미설치 시 폴백까지 규정. **SoT — 스킬은 이 문서를 참조만 한다**(호출법을 각자 재구현하지 않는다).\r\n\r\n이 문서는 순수 규칙 문서다. Lens 는 `agent-reach`·`insane-search` 를 **강제 설치하지 않는다** — \"있으면 쓰고 없으면 폴백\"만 규정한다. 두 도구는 Lens 외부 플러그인이므로, 미설치가 \"실패\"가 아니라 \"폴백\"이 되어야 한다.\r\n\r\n---\r\n\r\n## 0. 감지 (호출 전 1회)\r\n\r\n라이브 조사 단계에 들어가면, 스킬은 **먼저 아래를 판정**해 어느 경로를 쓸지 고른다.\r\n\r\n### agent-reach (무키 라이브 채널)\r\n\r\n```bash\r\n# PATH 우선, 없으면 표준 설치 경로 확인\r\ncommand -v agent-reach \\\r\n  || ls ~/.agent-reach-venv/Scripts/agent-reach.exe   # Windows\r\n  # unix:  ls ~/.agent-reach-venv/bin/agent-reach\r\n```\r\n\r\n- Windows: `~/.agent-reach-venv/Scripts/agent-reach.exe`\r\n- unix(macOS/Linux): `~/.agent-reach-venv/bin/agent-reach`\r\n- 또는 PATH 에 `agent-reach` 가 잡히면 그대로 사용.\r\n\r\n감지되면 **채널별 백엔드 상태**를 확인한다(무키 6~7채널만 즉시 가용, 나머지는 인증 필요):\r\n\r\n```bash\r\nagent-reach doctor --json\r\n```\r\n\r\n→ 각 플랫폼의 `active_backend` 로 지금 어떤 채널이 살아 있는지 확인 후 호출표(§1)를 고른다.\r\n\r\n### insane-search (WAF 우회 fetch)\r\n\r\n- 플러그인 스킬 존재로 감지: 세션의 스킬 목록에 `insane-search` 가 있는지, 또는\r\n  ```bash\r\n  ls ~/.claude/plugins/cache/*/insane-search/*/ 2>/dev/null\r\n  ```\r\n- 있으면 `python -m engine \"<URL>\"` 사용 가능(§2).\r\n\r\n### 판정\r\n\r\n- 둘 다 감지 → §1·§2 직접 명령 사용.\r\n- 하나만 감지 → 있는 것만 쓰고, 없는 쪽은 §3 폴백.\r\n- **둘 다 없음 → §3 폴백 모드로 진행**(절대 멈추지 않음).\r\n\r\n---\r\n\r\n## 1. 라이브 채널 (agent-reach)\r\n\r\n감지되면 아래 실측 명령을 쓴다. 로그인 채널·재시도 체인 등 복잡한 라우팅은 **agent-reach 스킬에 위임**한다(그쪽 `references/*.md` 가 관리 — 여기서 재구현하지 않는다).\r\n\r\n| 의도 | 명령 |\r\n|------|------|\r\n| 시맨틱 웹검색(트렌드·최신) | `mcporter call 'exa.web_search_exa(query: \"...\", numResults: 5)'` |\r\n| 웹페이지 읽기(마크다운화) | `curl -s \"https://r.jina.ai/<URL>\"` |\r\n| GitHub 리포/이슈/PR | `gh search repos \"q\" --sort updated --limit N` / `gh search issues \"q\" --limit N` |\r\n| YouTube 자막 | `yt-dlp --write-auto-sub --sub-lang \"ko,en\" --skip-download -o \"/tmp/%(id)s\" \"<URL>\"` → 생성된 json3/vtt 파싱 |\r\n| V2EX 핫 토픽 | `curl -s https://www.v2ex.com/api/topics/hot.json -H \"User-Agent: lens/1.0\"` |\r\n| RSS/Atom 피드 | `curl -s \"<feed_url>\"` 후 항목 파싱 |\r\n| 플랫폼 라우팅 일반(小红书·트위터/X·B站·Reddit·LinkedIn 등) | **agent-reach 스킬에 위임** — 채널별 백엔드·재시도 체인은 그쪽이 관리 |\r\n\r\n## 2. 차단 우회 fetch (insane-search)\r\n\r\nWebFetch 가 402/403/blocked 를 반환하거나 WAF/봇 차단이 있는 특정 공개 URL 은:\r\n\r\n```bash\r\npython -m engine \"<URL>\"\r\n```\r\n\r\n- yt-dlp·Jina Reader·공개 API·WAF-프로파일 fetch 체인(TLS impersonation, 모바일 URL 변환, 실제 Chrome)을 자동으로 순차 시도한다.\r\n- **§6 안전 한계를 반드시 지킨다**(페이월·로그인 우회 금지 등).\r\n\r\n---\r\n\r\n## 3. 폴백 (도구 없을 때)\r\n\r\n미설치는 **실패가 아니라 폴백**이다. 조용히 대체하고, 조사보고에 한 줄만 남긴다.\r\n\r\n- **agent-reach 없음** → `deep-research` 스킬(있으면) → 없으면 네이티브 `WebSearch` / `WebFetch`.\r\n- **insane-search 없음** → `WebFetch` → 막히면 Jina Reader(`curl -s \"https://r.jina.ai/<URL>\"`).\r\n\r\n폴백을 탄 경우 조사보고에 다음 한 줄을 남긴다:\r\n\r\n> 라이브 채널 없음(폴백: `<대체 수단>`)\r\n\r\n절대 **\"라이브 조사 실패\"로 멈추지 않는다.** 최선의 폴백 수단으로 계속 진행하고, 어떤 경로를 썼는지만 명시한다.\r\n\r\n---\r\n\r\n## 4. 신선도 규율\r\n\r\n라이브 데이터는 \"지금 참인가\"가 핵심이다.\r\n\r\n- 라이브 인용은 **출처 URL + 발행일**을 병기한다.\r\n- 발행일이 오래된 소스는 \"라이브 아님\"으로 표기한다(오래된 정보를 최신 신호로 오인하지 않도록).\r\n- 발행일을 못 구하면 \"발행일 불명\"으로 명시하고, 라이브 신호로 단정하지 않는다.\r\n\r\n---\r\n\r\n## 5. 누가 참조하나\r\n\r\n이 문서를 참조하는 스킬:\r\n\r\n- **`/cpp`** — S2(전방위 fan-out 조사)의 축③ 라이브 신호 조사.\r\n- **`/cr`** — creeta research(라이브 다각도 딥리서치).\r\n\r\n스킬을 추가하거나 참조 방식을 바꿀 때 **이 목록을 갱신한다.** 새 Lens 스킬이 라이브 데이터를 필요로 하면, 호출법을 재발명하지 말고 이 문서만 참조한다(agent-reach 채널이 늘면 §1 표 한 곳만 갱신).\r\n\r\n---\r\n\r\n## 6. 안전 한계 (insane-search)\r\n\r\n`insane-search`(`python -m engine`)는 **접근이 막힌 정당한 공개 정보를 조회**하기 위한 도구다. 우회 능력을 오남용하지 않는다.\r\n\r\n- **(a) 로그인/유료 페이월 우회 금지** — 인증·결제 뒤의 콘텐츠를 강제로 뚫지 않는다.\r\n- **(b) robots·ToS 위반 대량 크롤 금지** — 사이트 정책을 무시한 대량 수집 금지.\r\n- **(c) 개인정보·비공개 리소스 조회 금지** — 공개 의도가 없는 데이터는 다루지 않는다.\r\n- **(d) 실패는 terminal 로 인정** — `auth_required` / `paywall` / `404` 등은 최종 실패로 받아들이고 멈춘다. **무한 재시도 금지.**\r\n\r\n---\r\n\r\n## 셸 규칙 (Windows cp949 함정)\r\n\r\n- **한글 content 를 셸에 직접 넣지 않는다** — Windows cp949 인코딩에서 깨진다. `--data-binary @file` 또는 파일 경유로 전달한다.\r\n- 임시 파일은 `/tmp/` 에 둔다(예: `-o \"/tmp/%(id)s\"`).\r\n- 큰 본문·자막은 파일로 받아 파싱한다(셸 인라인 금지).\r\n","truncated":false,"stale":false},{"id":"publishing-guide","folder":"rules","title":"Lens Publishing Guide","date":"","hasMd":true,"hasHtml":false,"mdPath":"rules/publishing-guide.md","htmlPath":null,"mdInline":"# Lens Publishing Guide\n\n플러그인 배포 및 등록 가이드.\n\n## 1. Anthropic 공식 디렉토리\n\n**공식 레포**: [anthropics/claude-plugins-official](https://github.com/anthropics/claude-plugins-official)\n\n### 제출 방법\n\n**제출 폼** 사용 (권장): https://clau.de/plugin-directory-submission\n\n제출 후 Anthropic 심사를 거쳐 `external_plugins/lens/` 폴더로 등록됨.\n\n### 등록 후 설치 방법 (유저)\n\n```bash\n# 방법 1: 직접 설치\n/plugin install lens@claude-plugin-directory\n\n# 방법 2: Discover 탭에서 검색\n/plugin > Discover > \"lens\"\n```\n\n## 2. 커뮤니티 등록\n\n| 대상 | Stars | 제출 방법 |\n|------|-------|-----------|\n| [hesreallyhim/awesome-claude-code](https://github.com/hesreallyhim/awesome-claude-code) | 25k+ | PR → Plugin 섹션에 추가 |\n| [ccplugins/awesome-claude-code-plugins](https://github.com/ccplugins/awesome-claude-code-plugins) | 500+ | PR → Productivity 카테고리 |\n| [obra/superpowers-marketplace](https://github.com/obra/superpowers-marketplace) | 500+ | marketplace.json PR |\n\n### PR 템플릿 (awesome list)\n\n```markdown\n- [lens](https://github.com/CreetaCorp/lens) - Skill navigator for Claude Code. Scans all plugins, recommends the best match, and executes — single (/c), parallel (/cc), or plan-first (/cp). 8 languages.\n```\n\n## 3. 독립 마켓플레이스 (현재 방식)\n\n유저가 직접 레포를 마켓플레이스로 추가:\n\n```bash\n# 마켓플레이스 추가\n/plugin marketplace add CreetaCorp/lens\n\n# 플러그인 설치\n/plugin install lens@CreetaCorp\n```\n\n## 4. --plugin-dir (개발용)\n\n```bash\ngit clone https://github.com/CreetaCorp/lens.git\nclaude --plugin-dir ./lens\n```\n\n캐시 없이 디렉토리에서 직접 로드. 개발/테스트 전용.\n","truncated":false,"stale":false},{"id":"release-guide","folder":"rules","title":"Lens Release Guide","date":"","hasMd":true,"hasHtml":false,"mdPath":"rules/release-guide.md","htmlPath":null,"mdInline":"# Lens Release Guide\r\n\r\n버전 업데이트 시 반드시 이 문서를 따른다.\r\n\r\n## 1. SemVer 규칙\r\n\r\n`MAJOR.MINOR.PATCH` (예: 1.7.1)\r\n\r\n| 변경 유형 | 버전 | 예시 |\r\n|-----------|------|------|\r\n| 하위호환 깨는 변경 | MAJOR 올림 | 스킬 이름 변경, 훅 인터페이스 변경, 설정 키 삭제 |\r\n| 새 기능 추가 | MINOR 올림 | 새 스킬 (`/cp`), 새 훅, 새 lib 모듈, 새 config 옵션 |\r\n| 버그 수정, 문서 개선 | PATCH 올림 | 정규식 수정, 오타 수정, 경로 통일, 기존 기능 보강 |\r\n\r\n### 판단 기준\r\n\r\n- 새 파일 추가 → MINOR 이상\r\n- 기존 파일만 수정 → PATCH\r\n- `plugin.json`이나 `hooks.json` 구조 변경 → MAJOR\r\n- CHANGELOG에 \"Added\" 섹션이 있으면 → MINOR 이상\r\n- CHANGELOG에 \"Fixed\"/\"Changed\"만 있으면 → PATCH\r\n\r\n## 2. 버전이 기록된 파일 (13곳 — `scripts/bump-version.sh` 가 일괄 처리)\r\n\r\n**모든 파일을 동시에 같은 버전으로 업데이트해야 한다.** 수동 대신 **`bash scripts/bump-version.sh <X.Y.Z>`** 를 쓰면 아래 13파일을 자동 범프하고 stale 검증까지 한다.\r\n\r\n| # | 파일 | 위치 | 형식 |\r\n|---|------|------|------|\r\n| 1 | `.claude-plugin/plugin.json` | `\"version\": \"X.Y.Z\"` | JSON value |\r\n| 2 | `.claude-plugin/marketplace.json` | `\"version\": \"X.Y.Z\"` + `\"ref\": \"vX.Y.Z\"` | JSON value (2곳) |\r\n| 3 | `hooks/hooks.json` | `\"description\": \"Lens vX.Y.Z — ...\"` | 문자열 내 버전 |\r\n| 4 | `hooks/session-start.js` | `Lens vX.Y.Z activated` (4곳) | 문자열 리터럴 |\r\n| 5 | `skills/c/SKILL.md` | `Lens vX.Y.Z` (description + table, 2곳) | YAML + Markdown |\r\n| 6 | `skills/cc/SKILL.md` | `Lens Multi vX.Y.Z` (description + table, 2곳) | YAML + Markdown |\r\n| 7 | `skills/cp/SKILL.md` | `Lens Plan vX.Y.Z` (description + table, 2곳) | YAML + Markdown |\r\n| 8 | `skills/cpp/SKILL.md` | `Lens Power Plan vX.Y.Z` (description + table, 2곳) | YAML + Markdown |\r\n| 9 | `skills/ccp/SKILL.md` | `Lens Power Verify vX.Y.Z` (description + table, 2곳) | YAML + Markdown |\r\n| 10 | `skills/cs/SKILL.md` | `Lens Sync vX.Y.Z` + `currently X.Y.Z` | YAML + Markdown |\r\n| 11 | `CLAUDE.md` | `Current: **vX.Y.Z**` + `Updated: YYYY-MM-DD` + Recent Changes | Markdown |\r\n| 12 | `README.md` | `# Lens vX.Y.Z` (title) | Markdown |\r\n| 13 | `CHANGELOG.md` | `## [X.Y.Z] - YYYY-MM-DD` 섹션 추가 | Markdown |\r\n\r\n### 검색 명령어 (빠뜨린 곳 확인)\r\n\r\n```bash\r\n# 현재 버전 문자열이 모든 파일에 있는지 확인\r\ngrep -rn \"v1.7.1\" --include=\"*.json\" --include=\"*.js\" --include=\"*.md\" .\r\n\r\n# 이전 버전이 남아있는지 확인 (0건이어야 정상)\r\ngrep -rn \"v1.7.0\" --include=\"*.json\" --include=\"*.js\" --include=\"*.md\" . | grep -v CHANGELOG | grep -v \"Recent Changes\" | grep -v docs/\r\n```\r\n\r\n## 3. 릴리스 절차 (Step by Step)\r\n\r\n### Step 1: 코드 변경 완료\r\n\r\n모든 기능 구현/버그 수정을 먼저 커밋한다. 버전 범프 커밋과 코드 변경 커밋을 **분리**한다.\r\n\r\n```bash\r\n# 코드 변경 커밋 (예시)\r\ngit add lib/plan-manager.js skills/cp/SKILL.md\r\ngit commit -m \"fix: updatePlanStatus regex safety\"\r\n```\r\n\r\n### Step 2: CHANGELOG.md 작성\r\n\r\n파일 **맨 위**에 새 버전 섹션을 추가한다.\r\n\r\n```markdown\r\n## [X.Y.Z] - YYYY-MM-DD\r\n\r\n### Added (vX.Y.Z)\r\n- (MINOR일 때만) 새로 추가된 기능\r\n\r\n### Changed (vX.Y.Z)\r\n- 기존 기능의 변경사항\r\n\r\n### Fixed (vX.Y.Z)\r\n- 수정된 버그\r\n\r\n### Removed (vX.Y.Z)\r\n- (있을 때만) 삭제된 기능\r\n```\r\n\r\n규칙:\r\n- 각 항목은 **굵은 제목** + 설명 + 해당 파일명\r\n- Added/Changed/Fixed/Removed 순서\r\n- 해당 없는 섹션은 생략\r\n\r\n### Step 3: 13곳 버전 범프 (자동 권장)\r\n\r\n`bash scripts/bump-version.sh <X.Y.Z>` 로 위 표의 13개 파일을 일괄 업데이트한다(수동 시 누락 위험).\r\n\r\n**주의사항**:\r\n- `marketplace.json`은 `version`과 `source.ref` 2곳 모두 변경\r\n- `session-start.js`는 4곳 (`activated` 메시지 2개 + `Session Startup` 제목 2개)\r\n- 각 SKILL.md는 YAML description + table description 2곳\r\n- `CLAUDE.md`는 Version 섹션 + Recent Changes 섹션\r\n\r\n### Step 4: 버전 범프 커밋\r\n\r\n```bash\r\ngit add -A\r\ngit commit -m \"chore: bump version to vX.Y.Z\"\r\n```\r\n\r\n커밋 메시지 규칙: `chore: bump version to vX.Y.Z` (항상 이 형식)\r\n\r\n### Step 5: Git 태그\r\n\r\n```bash\r\ngit tag vX.Y.Z\r\n```\r\n\r\n- 접두사 `v` 필수 (v1.7.1, v2.0.0)\r\n- 태그는 반드시 버전 범프 커밋에 생성\r\n\r\n### Step 6: Push\r\n\r\n```bash\r\ngit push origin master --tags\r\n```\r\n\r\n- `--tags` 플래그 필수. 없으면 태그가 remote에 안 올라감\r\n- 커밋과 태그를 한 번에 push\r\n\r\n### Step 7: GitHub Release\r\n\r\n```bash\r\ngh release create vX.Y.Z \\\r\n  --title \"vX.Y.Z — 릴리스 제목\" \\\r\n  --latest \\\r\n  --notes \"$(cat <<'EOF'\r\n## Added\r\n- ...\r\n\r\n## Fixed\r\n- ...\r\n\r\n**Released**: YYYY-MM-DD\r\nEOF\r\n)\"\r\n```\r\n\r\n규칙:\r\n- `--latest` 플래그: 최신 릴리스로 마킹 (가장 최근 버전에만)\r\n- Release notes는 CHANGELOG.md의 해당 버전 섹션과 동일\r\n- 릴리스 제목: `vX.Y.Z — 핵심 기능 요약` (예: `v1.7.0 — /cp Plan-First Execution`)\r\n\r\n## 4. 과거 실수 사례 & 방지책\r\n\r\n| 실수 | 결과 | 방지책 |\r\n|------|------|--------|\r\n| 태그 안 만듦 | 원격에 버전 추적 불가 | Step 5 필수 |\r\n| `--tags` 빼고 push | 태그가 로컬에만 존재 | Step 6 명령어 복사해서 사용 |\r\n| GitHub Release 안 만듦 | 유저가 변경사항 확인 불가 | Step 7 필수 |\r\n| `session-start.js` 누락 | 세션 시작 시 구버전 표시 | 4곳 모두 grep으로 확인 |\r\n| `marketplace.json` ref 미갱신 | 유저가 구버전 설치 | `source.ref` 확인 |\r\n| 코드 변경과 버전 범프 한 커밋 | 태그가 코드 변경+범프 섞임 | 분리 커밋 |\r\n\r\n## 5. 캐시 관련 주의사항\r\n\r\nClaude Code는 **버전 번호**로 플러그인 캐시를 관리한다.\r\n\r\n- 코드를 변경했지만 버전을 안 올리면 → 기존 유저는 **변경사항을 못 봄**\r\n- 캐시 경로: `~/.claude/plugins/cache/CreetaCorp/lens/{version}/`\r\n- 수동 캐시 삭제: `rm -rf ~/.claude/plugins/cache/CreetaCorp/lens/`\r\n- 개발 중에는 `claude --plugin-dir ./lens`으로 캐시 우회\r\n\r\n## 6. 버전 검증 체크리스트\r\n\r\n릴리스 후 아래를 확인한다:\r\n\r\n```bash\r\n# 1. 로컬 태그 확인\r\ngit tag -l | tail -3\r\n\r\n# 2. 원격 태그 확인\r\ngh api repos/CreetaCorp/lens/tags --jq '.[].name' | head -5\r\n\r\n# 3. GitHub Releases 확인\r\ngh release list | head -5\r\n\r\n# 4. origin과 동기화 확인\r\ngit status\r\n\r\n# 5. 구버전 잔존 확인 (CHANGELOG/docs 제외, 0건이어야 함)\r\ngrep -rn \"vOLD_VERSION\" --include=\"*.json\" --include=\"*.js\" skills/ hooks/ .claude-plugin/ | grep -v node_modules\r\n```\r\n","truncated":false,"stale":false}]}};

  // ── header ──
  $("#repo-name").textContent = repo;
  $("#repo-name").appendChild(el("span", { class: "dim", text: " / docs" }));

  // ── render board ──
  function renderBoard() {
    const f = filterText.trim().toLowerCase();
    let shown = 0;
    for (const g of GROUP_ORDER) {
      const all = groups[g] || [];
      const docs = f ? all.filter(d => (d.title || d.id).toLowerCase().includes(f)) : all;
      shown += docs.length;
      const wrap = $(`[data-col="${g}"]`);
      wrap.replaceChildren();
      if (docs.length === 0) {
        wrap.appendChild(el("div", { class: "empty", text: "empty" }));
      } else {
        for (const d of docs) wrap.appendChild(renderCard(d));
      }
      $(`[data-count="${g}"]`).textContent = String(docs.length).padStart(2, "0");
    }
    const statsEl = $("#stats");
    statsEl.replaceChildren();
    statsEl.appendChild(el("span", null, "showing ", el("b", { text: String(shown) }), " / ", el("b", { text: String(total) })));
    if (BOARD.generatedAt) {
      statsEl.appendChild(el("span", { class: "sep" }, "·"));
      const gen = BOARD.generatedAt.replace("T", " ").replace(/\.\d+Z$/, "Z");
      statsEl.appendChild(el("span", null, "generated ", el("b", { text: gen })));
    }
  }

  function renderCard(doc) {
    const card = el("article", { class: "card", "data-id": doc.id, onclick: () => openPanel(doc.id) });
    card.appendChild(el("h3", { class: "tt", text: doc.title || doc.id }));

    const meta = el("div", { class: "meta-row" });
    if (doc.date) meta.appendChild(el("span", { class: "date", text: doc.date }));
    meta.appendChild(el("span", { class: "badge " + (doc.hasHtml ? "html" : "md"), text: doc.hasHtml ? "HTML" : "MD" }));
    if (doc.stale) meta.appendChild(el("span", { class: "badge stale", text: "stale" }));
    card.appendChild(meta);
    return card;
  }

  // ── panel ──
  function openPanel(id) {
    viewing = id;
    $("#scrim").classList.add("open");
    $("#panel").classList.add("open");
    $("#panel").setAttribute("aria-hidden", "false");
    renderPanel();
  }
  function closePanel() {
    $("#scrim").classList.remove("open");
    $("#panel").classList.remove("open");
    $("#panel").setAttribute("aria-hidden", "true");
    viewing = null;
  }

  function renderPanel() {
    const doc = byId[viewing];
    if (!doc) { closePanel(); return; }

    $("#p-id").textContent = doc.id + (doc.date ? "  ·  " + doc.date : "") + "  ·  " + (GROUP_LABELS[doc.folder] || doc.folder);
    $("#p-title").textContent = doc.title || doc.id;

    // actions: "Open in new tab" for html docs, "Convert to HTML" for md-only
    const actions = $("#p-actions");
    actions.replaceChildren();
    if (doc.hasHtml && doc.htmlPath) {
      actions.appendChild(el("button", {
        class: "ghost",
        text: "Open in new tab",
        onclick: () => window.open(doc.htmlPath, "_blank", "noopener"),
      }));
    } else {
      actions.appendChild(el("button", {
        class: "primary",
        text: "Convert to HTML",
        onclick: () => convert(doc),
      }));
    }
    actions.appendChild(el("button", { class: "ghost", text: "close", onclick: closePanel }));

    // notes (truncated md)
    const notes = $("#p-notes");
    notes.replaceChildren();
    if (doc.truncated) {
      const span = el("span", { class: "trunc" });
      span.appendChild(document.createTextNode("⚠ truncated — "));
      if (doc.mdPath) {
        span.appendChild(el("a", { href: doc.mdPath, target: "_blank", rel: "noopener", text: "open original" }));
      } else {
        span.appendChild(document.createTextNode("open original"));
      }
      notes.appendChild(span);
    }

    // body: iframe for html report, raw md (textContent) otherwise
    const body = $("#p-body");
    body.replaceChildren();
    if (doc.hasHtml && doc.htmlPath) {
      body.appendChild(el("iframe", {
        class: "report-frame",
        src: doc.htmlPath,
        title: doc.title || doc.id,
        loading: "lazy",
      }));
    } else {
      const scroll = el("div", { class: "md-scroll" });
      const pre = el("pre", { class: "md-pre" });
      // HARD SECURITY REQUIREMENT: md is untrusted — render via textContent ONLY.
      pre.textContent = doc.mdInline || "(empty)";
      scroll.appendChild(pre);
      body.appendChild(scroll);
    }
  }

  // ── convert to html (clipboard + fallback) ──
  function convert(doc) {
    const cmd = "/cp html docs/" + doc.mdPath;
    const ok = () => toast("Command copied — paste into Claude Code:", cmd);
    const fail = () => openModal(cmd);
    // file:// is not a secure context — navigator.clipboard is blocked there and
    // writeText can hang silently. Gate on isSecureContext so file:// goes straight
    // to the modal (which shows the command for manual copy).
    if (window.isSecureContext && navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(cmd).then(ok, fail);
    } else {
      fail();
    }
  }

  // ── toast ──
  function toast(msg, cmd, ms = 4000) {
    const t = $("#toast");
    t.replaceChildren(document.createTextNode(msg));
    if (cmd) {
      t.appendChild(document.createElement("br"));
      t.appendChild(el("span", { class: "cmd", text: cmd }));
    }
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove("show"), ms);
  }

  // ── modal (manual copy fallback — must NOT look successful) ──
  function openModal(cmd) {
    const ta = $("#modal-cmd");
    ta.value = cmd;
    $("#modal-scrim").classList.add("open");
    ta.focus();
    ta.select();
    try { ta.setSelectionRange(0, cmd.length); } catch (_) {}
  }
  function closeModal() { $("#modal-scrim").classList.remove("open"); }

  // ── events ──
  $("#search").addEventListener("input", (e) => { filterText = e.target.value; renderBoard(); });
  $("#p-close").addEventListener("click", closePanel);
  $("#scrim").addEventListener("click", closePanel);
  $("#modal-close").addEventListener("click", closeModal);
  $("#modal-scrim").addEventListener("click", (e) => { if (e.target === $("#modal-scrim")) closeModal(); });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if ($("#modal-scrim").classList.contains("open")) { closeModal(); return; }
    if (viewing) closePanel();
  });

  // ── init ──
  renderBoard();
})();
</script>
</body>
</html>
