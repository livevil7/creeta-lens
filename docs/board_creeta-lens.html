수집·diff 4분류·dry-run 프리뷰)\n- `lib/install-sync.test.js` — 단위테스트 (foreign 불가침·lens 자기보호·excluded∩installed)\n- 릴리즈 배선 — `scripts/bump-version.sh`(버전-bearing 스킬 목록), `docs/START_HERE.md`, `CLAUDE.md`, `README.md`, `CHANGELOG.md`\n\n## 테스트 & 검증\n- task 계획의 EARS 6건(manifest 빈 틀 생성 / foreign 불가침 / lens 자기보호 / dry-run 무변경 / 제거 전 백업 / 세션 노출) 중 auto 항목은 단위테스트 `lib/install-sync.test.js`(레포에 실존)로 커버하도록 설계됐다.\n- 이 문서는 사후 아카이브라 당시 개별 검증 로그는 남아 있지 않다. 다만 **v3.22.0 릴리즈·설치로 최종 확인** — 산출물 3종(`skills/ci/`, `lib/install-sync.js`, `lib/install-sync.test.js`)이 레포에 실존하고, `/ci`가 세션 스킬 목록에 정상 노출된다(2026-07-04 확인).\n\n## 추가 사항\n- manifest는 빈 틀로 시작 — 내 목록을 livevil-setting/skills.json에서 export해 이식하는 것은 별도 작업.\n- `claude plugin list --json` 스키마는 Claude Code 버전에 따라 변할 수 있음 — 변화 감지 시 `installed_plugins.json` 폴백이 방어선.\n","truncated":false,"stale":false,"branch":null,"base":null},{"id":"2026-07-01-cpp-live-research","folder":"history","title":"`/cpp` 라이브 리서치화 — S2 조사에 agent-reach + insane-search 주입 — 완료","date":"2026-07-01","hasMd":true,"hasHtml":true,"mdPath":"history/2026-07-01-cpp-live-research.md","htmlPath":"history/2026-07-01-cpp-live-research.html","mdInline":"# `/cpp` 라이브 리서치화 — S2 조사에 agent-reach + insane-search 주입 — 완료\n\n**완료일**: 2026-07-01\n\n## 요약\n`/cpp`(Power Plan)의 S2 전방위 조사 축③(도메인 정석)에 라이브 리서치(agent-reach + insane-search)를 **조건부로** 주입했다 — 주제가 최신성·트렌드·저장소 현황·커뮤니티 반응에 민감할 때만 발동(강제 아님)하고, 도구 미설치 시 graceful degrade. S0 실행전략·S7 self-check도 정합했으며 S4 Codex 하드게이트는 무변경. `skills/cpp/SKILL.md` 단일 파일 외과 편집으로 **v3.22.0으로 출시**됐다(commit fe20cb2, tag v3.22.0).\n\n## 주요 결정 사항\n- **조건부 발동, 강제 아님 (Codex 핵심)**: 매 /cpp마다 라이브 조사를 강제하면 계획마다 수십 초 느려지고 네트워크 실패에 취약 — (a) 특정 URL/외부 리소스, (b) 최신 릴리즈·버전·트렌드 민감, (c) 커뮤니티 실이슈가 계획에 중요할 때만 발동. 순수 내부코드·trivial은 skip.\n- **substrate 위임 (SoT 단일)**: 호출 명령을 SKILL.md에 복붙하지 않고 `docs/rules/live-research.md`의 감지→호출→폴백 절차를 참조.\n- **축③만으로는 부족 — S0·S7 정합 (Codex 합의)**: S0 실행전략의 \"활용 스킬 자동감지\"에 라이브채널 인지 추가 + S7 self-check에 \"라이브 신호가 유익한 주제였다면 live-research를 썼거나 폴백 사유가 조사보고에 표기됐는가\" 체크 추가. 라이브 출처는 URL+발행일 병기(live-research §4).\n- **폴백 명시**: 도구 미설치는 실패가 아니라 context7/deep-research/web/로컬조사로 degrade + 조사보고에 한 줄 표기.\n- **Surgical**: `skills/cpp/SKILL.md`만 편집 — /cp·lib·다른 스킬 무수정, S4 Codex 하드게이트 흐름 불변.\n\n## 변경 파일\n- `skills/cpp/SKILL.md` — S2 축③ 확장 + 발동 조건 문단 + S0 실행전략 라이브채널 인지 + S7 self-check·조사보고 정합\n- `CHANGELOG.md` — v3.22.0 Changed 항목 (버전 bump는 ①③④와 통합 릴리즈)\n\n## 테스트 & 검증\n- task 계획의 EARS 5건(축③ live-research 참조 grep / 발동조건 문단 존재 / 라이브민감 주제 실행 시 조사보고에 URL+날짜 인용 / 미설치 폴백 / 태그 존재) 중 문구 반영은 grep, 동작은 실제 /cpp 1회 실행 관측으로 설계됐다.\n- 이 문서는 사후 아카이브라 당시 grep·실행 로그는 남아 있지 않다. 다만 **v3.22.0 릴리즈·설치로 최종 확인** — `skills/cpp/SKILL.md`에 변경이 반영된 채 tag v3.22.0으로 배포·설치됐고, 태그 존재(EARS 5)는 확인됐다(2026-07-04).\n\n## 추가 사항\n- 캐시↔소스 드리프트 주의 — 태그 push 후 `/lens-upgrade`를 해야 각 머신에 실제 반영된다(v3.22.0 릴리즈로 해소).\n","truncated":false,"stale":false,"branch":null,"base":null},{"id":"2026-07-01-cr-research-rename-crv","folder":"history","title":"`/cr` = Creeta Research 신설 + 기존 Lens Review → `/crv` 개명 — 완료","date":"2026-07-01","hasMd":true,"hasHtml":true,"mdPath":"history/2026-07-01-cr-research-rename-crv.md","htmlPath":"history/2026-07-01-cr-research-rename-crv.html","mdInline":"# `/cr` = Creeta Research 신설 + 기존 Lens Review → `/crv` 개명 — 완료\n\n**완료일**: 2026-07-01\n\n## 요약\n두 갈래를 순서대로 완료했다: (A) 기존 `/cr`(Lens Review, 자가 현대화 감사)을 `/crv`로 무손실 개명해 이름 충돌을 제거하고, (B) 비워진 `/cr`에 **Creeta Research**(agent-reach + insane-search 기반 라이브 다각도 딥리서치 → 대화로 인용 보고, 파일 저장 안 함)를 신설했다. **v3.22.0으로 출시**됐다(commit fe20cb2, tag v3.22.0).\n\n## 주요 결정 사항\n- **A(개명) 먼저 → B(신설) 순서**: `/cr` 이름 충돌을 먼저 제거해야 신규 스킬이 안전하게 자리 잡음. 순서에 Codex 이견 없음.\n- **개명은 무손실**: Review의 기능·SessionStart 알림·stamp·scope guard가 `/crv`로 완전 이전. Codex가 blast radius를 초안보다 넓게 교정 — `lib/capability-audit.js`의 nudge 3문자열(L114/119/124)·주석, `hooks/session-start.js` 주석, `docs/rules/capability-assumptions.json`의 affects_lens에 crv 신규 등록(기존엔 skills/cr 미참조라 자가감사 대상 누락 위험)까지 포함.\n- **신규 /cr 안전 규칙 (Codex)**: (a) 파일 저장 안 함 — 산출은 대화 보고만, (b) 출처 URL + 발행일 보고 의무, (c) 로컬/비공개 코드·시크릿을 외부 쿼리에 넣지 않음(유출 금지), (d) 스코프 가드 없음 — 아무 레포/컨텍스트에서 동작(Review와 반대).\n- **deep-research와 차별**: creeta research = 무키 라이브채널(agent-reach) + WAF 차단우회(insane-search) 특화. 범용 웹리서치만이면 deep-research 폴백/안내.\n- **substrate 소비**: 호출 명령을 SKILL.md에 복붙하지 않고 `docs/rules/live-research.md`(단일 SoT)를 참조.\n- **역사문서 불변**: `docs/history/2026-06-05-*audit*`의 과거 `/cr` 표기는 개명 대상에서 제외.\n\n## 변경 파일\n- `skills/cr/` → `skills/crv/` — 기존 Lens Review 스킬 폴더 이동 + 내부 식별자(/crv) 전환\n- `skills/cr/SKILL.md` — 신규 Creeta Research 스킬 (다각도 파이프라인 + 안전·폴백·차별 절)\n- `lib/capability-audit.js` — nudge 3문자열 + 주석 /cr → /crv\n- `hooks/session-start.js` — nudge 주석 갱신\n- `docs/rules/capability-assumptions.json` — description 갱신 + affects_lens에 crv 등록\n- `docs/rules/codex-integration.md` — /crv 참조 갱신 (CHANGELOG 명시)\n- `CLAUDE.md` · `README.md` — 스킬 표/사용법에 /cr(research)·/crv(review) 반영\n- 릴리즈 배선 — `scripts/bump-version.sh`, `docs/START_HERE.md`, `CHANGELOG.md`\n\n## 테스트 & 검증\n- task 계획의 EARS 7건(개명 잔재 0 grep 게이트 / SessionStart 알림 /crv 문구 / /crv 감사 파이프라인 동작 / /cr 다각도 인용 보고 / 도구 미설치 폴백 / affects_lens 등록 / 태그 + 세션 노출) 중 개명 무손실은 전수 grep 게이트(A6), 신규 /cr은 실제 실행 관측으로 확인하도록 설계됐다.\n- 이 문서는 사후 아카이브라 당시 개별 검증 로그는 남아 있지 않다. 다만 **v3.22.0 릴리즈·설치로 최종 확인** — `skills/cr/`·`skills/crv/`가 레포에 실존하고, `/cr`(research)·`/crv`(review) 둘 다 세션 스킬 목록에 정상 노출된다(2026-07-04 확인).\n\n## 추가 사항\n- 신규 `/cr`은 외부 서비스로 쿼리를 보내는 스킬 — 로컬 코드 유출 금지 규칙이 SKILL.md에 박혀 있으나, 프롬프트 위생은 실행 시마다 준수 필요.\n","truncated":false,"stale":false,"branch":null,"base":null},{"id":"2026-07-01-live-research-substrate","folder":"history","title":"라이브 리서치 substrate — `docs/rules/live-research.md` — 완료","date":"2026-07-01","hasMd":true,"hasHtml":true,"mdPath":"history/2026-07-01-live-research-substrate.md","htmlPath":"history/2026-07-01-live-research-substrate.html","mdInline":"# 라이브 리서치 substrate — `docs/rules/live-research.md` — 완료\n\n**완료일**: 2026-07-01\n\n## 요약\nLens 스킬(`/cpp` S2, `/cr`)이 \"현재 라이브 정보\"(최신 릴리즈·트렌드·이슈·커뮤니티 반응)를 가져오는 표준 경로를 단일 SoT 문서 `docs/rules/live-research.md`로 신설했다. agent-reach(무키 라이브 채널)·insane-search(WAF 우회 fetch)의 감지·호출법 + 미설치 시 폴백 규칙(deep-research → WebSearch/WebFetch) + 신선도 규율(출처 URL·발행일 병기) + insane-search 안전 한계를 규정하며, **v3.22.0으로 출시**됐다(commit fe20cb2, tag v3.22.0). 4개 계획(/ci·/cr·/cpp 라이브화)의 선행 토대.\n\n## 주요 결정 사항\n- **단일 SoT 참조 방식**: /cpp와 /cr이 같은 호출법·같은 폴백 규칙을 쓰므로 각 스킬에 복붙하면 드리프트 확정 — 규칙은 이 문서 한 곳에 두고 스킬은 참조만 한다(Codex 이견 없음).\n- **폴백 필수 = 미설치는 실패가 아님**: agent-reach 없음 → deep-research → 네이티브 WebSearch/WebFetch, insane-search 없음 → WebFetch/jina 2단 폴백. 폴백 시 조사보고에 \"라이브 채널 없음(폴백: X)\" 한 줄만 남기고 절대 멈추지 않는다(dormant 스캐폴딩 금지 원칙).\n- **위임 우선**: agent-reach는 이미 네이티브 스킬이므로 플랫폼 라우팅 일반은 재구현하지 않고 \"agent-reach 스킬에 위임\"(중복 회피).\n- **insane-search 안전 한계 (Codex 신규 리스크 반영)**: 로그인/유료 페이월 우회 금지, robots·ToS 위반 대량 크롤 금지, 개인정보·비공개 리소스 조회 금지, terminal 실패(auth_required/paywall/404)는 인정하고 멈춤(무한 재시도 금지).\n- **문서만 만들고 끝내지 않기 (Codex)**: `CLAUDE.md`·`docs/START_HERE.md`에 참조 등록. 실제 /cpp·/cr SKILL.md의 참조 배선은 각 스킬 계획 소관.\n- **문서 구조**: §0 감지(호출 전 1회, win/unix 경로 + doctor) → §1 라이브 채널 호출표(Exa·jina·GitHub·YouTube·V2EX·RSS) → §2 차단 우회 fetch → §3 폴백 → §4 신선도 규율 → §5 참조 스킬 목록 → §6 안전 한계 + 셸 규칙(Windows cp949 함정).\n\n## 변경 파일\n- `docs/rules/live-research.md` — 신규 (본 substrate 문서, 코드 0)\n- `CLAUDE.md` · `docs/START_HERE.md` — 참조 등록 한 줄씩\n- `CHANGELOG.md` — v3.22.0 Added 항목\n\n## 테스트 & 검증\n- task 계획의 EARS 4건(파일 존재 / Exa·engine 명령 제공 / 폴백 경로 명시 / 참조 스킬 목록 존재)은 전부 auto(파일 존재 + grep) 검증으로 설계됐다.\n- 이 문서는 사후 아카이브라 당시 grep 로그는 남아 있지 않다. 다만 **v3.22.0 릴리즈·설치로 최종 확인** — `docs/rules/live-research.md`가 레포에 실존하고 §0~§6 + 셸 규칙 절이 모두 존재하며, 소비자인 `/cr`·`/cpp`가 v3.22.0에 함께 출시돼 실사용 중이다(2026-07-04 확인).\n\n## 추가 사항\n- agent-reach·insane-search는 Lens 외부 플러그인 — Lens가 강제 설치하지 않는다(있으면 쓰고 없으면 폴백). 강제 의존으로 오해 금지.\n- agent-reach 채널이 늘거나 참조 스킬이 추가되면 이 문서의 호출표·§5 목록만 갱신하면 된다.\n","truncated":false,"stale":false,"branch":null,"base":null},{"id":"2026-06-18-cu-scope-winget-cc-uiux-pro","folder":"history","title":"/cu plugin scope + winget UTF-8 + /cc UI/UX 스킬 의무 할당 — 완료","date":"2026-06-18","hasMd":true,"hasHtml":true,"mdPath":"history/2026-06-18-cu-scope-winget-cc-uiux-pro.md","htmlPath":"history/2026-06-18-cu-scope-winget-cc-uiux-pro.html","mdInline":"# /cu plugin scope + winget UTF-8 + /cc UI/UX 스킬 의무 할당 — 완료\n\n**완료일**: 2026-06-18\n\n## 요약\n`/cu`(Lens Update)가 local/project scope 플러그인을 user scope로만 갱신하려다 \"not installed at scope user\"로 실패하던 버그와, winget의 UTF-8 박스문자에서 리더 스레드가 cp949 디코드로 죽어 출력이 비어 gh를 \"winget 미감지\"로 오탐하던 버그를 한 번에 수정했다. 동시에 `/cc`(Lens Multi) Phase 1.3에 화면·UI 서브태스크의 ui-ux-pro-max 스킬 의무 할당을 추가했다. marketplace `source.ref`가 고정 태그라 소스 수정만으로는 dormant 상태가 되므로 v3.19.0 → v3.20.0 bump + commit + tag + push로 전파했고, 활성 캐시에도 핫미러해 즉시 적용했다.\n\n## 주요 결정 사항\n- **scope를 installed_plugins.json에서 실측해 전달**: `_plugin_scope_info()`로 각 플러그인의 실제 scope를 읽어 `--scope <scope>`로 넘기고, local/project scope는 `projectPath`를 cwd로 실행. user scope만 가정하던 기존 동작이 context7·playwright(local scope) 갱신을 깨던 원인이라 실측 기반으로 전환.\n- **run()에 UTF-8 강제 디코딩**: `encoding=\"utf-8\", errors=\"replace\"`를 추가. winget이 출력하는 UTF-8 박스문자(0xe2…)를 cp949로 읽던 리더 스레드가 UnicodeDecodeError로 죽어 winget 출력이 비고, 그 결과 gh가 \"winget 미감지—수동 안내\"로 오탐되던 연쇄를 끊음. scan stderr 노이즈도 함께 제거.\n- **ui-ux-pro-max는 재설치하지 않음**: 이미 `~/.claude/skills/ui-ux-pro-max`에 설치돼 있음을 확인. `/cc` SKILL.md Phase 1.3에 기존 \"필수 실행 스킬\" 메커니즘으로 의무 할당만 추가하고, 미설치 머신은 네이티브 UI/UX 베스트프랙티스로 graceful degrade하도록 설계.\n- **bump + 핫미러 동시 전파**: marketplace `source.ref`가 고정 태그라 소스 수정만으로는 휴면 상태이므로 3.19.0 → 3.20.0 bump·commit·tag·push로 정식 전파. 동시에 활성 캐시(`cache/CreetaCorp/lens/3.19.0`)의 `cu.py`·`cc/SKILL.md`를 핫미러해 이 PC에서 즉시 동작하게 함.\n\n## 변경 파일\n- `scripts/cu.py` — `_plugin_scope_info()` 추가, `_upgrade_plugin_generic()`의 scope/cwd 처리, `run()` UTF-8 디코딩\n- `skills/cc/SKILL.md` — Phase 1.3 화면·UI 서브태스크 ui-ux-pro-max 의무 할당\n- bump 13파일 — `plugin.json`, `marketplace.json`, `CHANGELOG.md`, `CLAUDE.md`, `README.md`, hooks ×2, skills SKILL.md ×6 배너\n- 메모리 — `cu-winget-false-negative-windows.md` + `MEMORY.md` 인덱스를 \"v3.20.0에서 코드 수정됨—수동 워크어라운드 불필요\"로 갱신\n\n## 테스트 & 검증\n실측으로 확인:\n- ✅ `/cu scan`에서 cp949 traceback 사라짐 + gh `can_auto=True` (winget 소스 감지)\n- ✅ `context7` plugin `update --scope local` exit 0 (local scope 갱신 정상)\n- ✅ GitHub Release `isLatest=true` (v3.20.0 commit 4f1f606, tag push, Latest 지정)\n\n## 추가 사항\n- (선택) Mac Mini 등 타 머신은 `/lens-upgrade`로 3.20.0 반영\n- (선택) 라벨 정리를 위해 이 PC도 `/lens-upgrade` + 재시작\n","truncated":false,"stale":false,"branch":null,"base":null},{"id":"2026-06-11-ccp-power-verify","folder":"history","title":"/ccp (Lens Power Verify) 신설 + 5분 진행보고 규칙 — 완료","date":"2026-06-11","hasMd":true,"hasHtml":true,"mdPath":"history/2026-06-11-ccp-power-verify.md","htmlPath":"history/2026-06-11-ccp-power-verify.html","mdInline":"# /ccp (Lens Power Verify) 신설 + 5분 진행보고 규칙 — 완료\n\n**완료일**: 2026-06-11\n\n## 요약\n이미 만들어진 산출물(기능·PR·화면·방금 빌드)을 출처 불문 독립적으로 적대적 감사하고, Playwright 등으로 실제 실행해 \"진짜 작동하는가\"를 증거화하며 최소 수복까지 책임지는 `/ccp` (Lens Power Verify) 스킬을 신설했다. `/cc`(\"만들면서 검증\")와 `/ccp`(\"이미 만들어진 것을 독립 감사\")의 경계를 한 문장으로 명문화했고, 4 렌즈(기능·엣지·회귀·UX) 적대적 검증과 파괴적 변경 차단·무한루프 방지·정직한 종료 같은 안전장치를 함께 박았다. 더불어 `/cc`·`/cp`·`/cpp`·`/ccp` 네 스킬에 공통 5분 진행보고 규칙을 추가했다. v3.16.0으로 배포 완료(commit 1bb756b, tag v3.16.0).\n\n## 주요 결정 사항\n- **출처 불문 standalone 감사로 경계 확정** — Codex 교차 협의(S4)에서 `/cc`와 중복 리스크가 크다고 판단, `/cc`=\"만들면서 검증\" ↔ `/ccp`=\"이미 만들어진 것을 적대적으로 독립 감사해 증거화·수복\"으로 한 문장 차별화. 같은 작업이면 `/cc`를 권유하는 다운그레이드 가드도 둠.\n- **read-only 우선 · 파괴적 변경 차단** — \"무슨 수를 써서라도 검증\"을 read-only 범위까지로 한정. 배포·DB migration·대량삭제·외부 결제/메일은 dry-run 또는 승인 없이 금지(Codex critical 반영).\n- **만장일치 게이트** — 4 렌즈 중 blocking refute가 1개라도 있으면 done 선언 차단(과반이 아닌 만장일치).\n- **정직한 종료** — 못 끝내면 done 금지, `verified=false` + blocking + 다음 액션으로 마감.\n- **무한루프 방지 cap** — 5회 + 예산 + 동일 실패 2회 시 전략 전환 + 3회 승인 cap으로 무한 수복 방지.\n- **Surgical** — pass한 검증 축은 freeze, 실패 축만 수복. `/cc`·`/cp`는 5분 규칙 1줄 외 무수정.\n\n## 변경 파일\n- `skills/ccp/SKILL.md` (신설 — 배너 \"Lens Power Verify v3.16.0\", 증거수집→4렌즈 반박→최소수복→재검증→증거리포트 루프 + 안전장치 + 5분 보고)\n- `skills/cc/SKILL.md` (기본값 #2 \"2분\"→\"5분\")\n- `skills/cp/SKILL.md` (절대규칙에 5분 보고 1줄)\n- `skills/cpp/SKILL.md` (절대규칙에 5분 보고 1줄)\n- `scripts/bump-version.sh` (+ccp 배너, 12→13)\n- `CLAUDE.md` (Skills 표 +/ccp 행 + v3.16.0 feat)\n- `README.md` (/ccp 섹션)\n- `CHANGELOG.md` (v3.16.0)\n\n## 테스트 & 검증\nEARS 6항목 전부 auto 검증으로 통과:\n- ✅ 새 세션 시작 시 인벤토리에 `/ccp` 표시 (SKILL.md + SessionStart)\n- ✅ `/ccp` 검증 시 4 렌즈 적대적 검증 수행 (SKILL.md 렌즈 섹션)\n- ✅ blocking refute 1+ 시 done 선언 차단 (blocking=0만 pass)\n- ✅ 파괴적 변경(배포·DB·대량삭제·결제/메일) 승인 없이 금지 (SKILL.md 안전장치 명시)\n- ✅ 장시간 작업 시 4개 스킬 모두 5분 진행보고 (\"5분\" grep 4개 모두 적중)\n- ✅ 릴리즈 tag 푸시 후 재설치 cache에 ccp/ 포함 (cache 3.16.0/skills/ccp 존재 확인)\n\n배포 검증: commit 1bb756b, tag v3.16.0 push, 캐시 3.16.0 갱신에서 ccp/ + 5분 4스킬 모두 확인.\n\n## 추가 사항\n남은 후속(선택): gh release 생성, done-sweep의 cpp/ccp 마커 인식(v2). 둘 다 필수가 아니며 본 작업의 완료 정의에는 포함되지 않음.\n","truncated":false,"stale":false,"branch":null,"base":null},{"id":"2026-06-11-cpp-power-plan","folder":"history","title":"/cpp (Lens Power Plan) 신설 — 빌드레디 심층 계획 엔진 — 완료","date":"2026-06-11","hasMd":true,"hasHtml":true,"mdPath":"history/2026-06-11-cpp-power-plan.md","htmlPath":"history/2026-06-11-cpp-power-plan.html","mdInline":"# /cpp (Lens Power Plan) 신설 — 빌드레디 심층 계획 엔진 — 완료\n\n**완료일**: 2026-06-11\n\n## 요약\n\n되묻기 0을 목표로 하는 빌드레디 심층 계획 엔진 `/cpp`(Lens Power Plan)를 신설했다. 사용자가 `/cpp <요청>`을 입력하면 그대로 실행만 하면 완성품이 나오는 계획서가 산출되며, 계획서 맨 앞에는 항상 \"이게 끝나면 무엇을 할 수 있게 되는가\"가 사용자 언어로 박힌다. 9스테이지 파이프라인(목표 잠금 → Clarify-to-Zero → 6축 fan-out 조사 → body-adaptive 딥스펙 → Codex 교차 협의 → 빌드레디 태스크 → EARS 검증 → self-check → /cc 핸드오프)을 SKILL.md 골격으로 구현했고, 기존 `/cp`는 한 줄도 건드리지 않은 채 신규 폴더로 격리했다. v3.15.0으로 배포 완료(commit 247dbc0, tag v3.15.0).\n\n## 주요 결정 사항\n\n- **`/cp` 무수정, 신규 폴더 격리**: 가벼운 계획은 `/cp`, \"끝장 계획\"은 `/cpp`로 역할을 분리. `/cp`·`lib/*`·기존 skill을 일절 수정하지 않는 surgical 원칙을 Constitution 3번으로 못 박았다.\n- **Codex 교차 협의를 양보 불가 하드게이트로**: graceful-degrade를 금지하고, Codex 미감지 시 조용히 진행하지 않고 정지·보고하도록 했다. 다만 Codex 일시 다운의 불편(R2)을 고려해 사용자가 1회성으로 명시 우회할 수 있는 문구를 남겼다.\n- **목표는 사용자 언어로 잠금(Goal-Locked)**: 목표 문장에 함수/HTTP/SQL/경로 같은 기술 토큰을 0개로 강제. 약한 목표는 승인 거부(`/cp` v3.8 계승).\n- **Body-Adaptive 구조**: spine(목표·Constitution·검증·실행·진행상황)만 고정하고 나머지는 주제가 구조를 정하게 했다. 도메인 라우터로 UI는 ASCII 와이어프레임+요소스펙+상태, API는 계약서를 산출.\n- **벤치마크 기반 채택**: Spec Kit(Constitution/clarify/analyze), Kiro(EARS/waves), Superpowers(빌드레디 태스크 포맷)에서 검증된 패턴만 채택. BMAD 다중 페르소나·별도 CLI·7-커맨드 분리는 과함으로 미채택(`/cpp`는 단일 명령).\n- **깊이 ≠ 장황(R1)**: power가 토큰 폭발로 변질되지 않도록 TL;DR 의무화와 \"불필요 섹션 금지\" 게이트를 SKILL.md에 명시. 깊이는 정보 밀도지 분량이 아니다.\n\n## 변경 파일\n\n- `skills/cpp/SKILL.md` (신규) — 배너 \"Lens Power Plan v3.15.0\", 9스테이지 파이프라인\n- `scripts/bump-version.sh` — cpp 배너 sed 라인 + 검증 목록 추가, 파일 카운트 11→12\n- `CLAUDE.md` — Skills 표에 `/cpp` 행 + v3.15.0 feat 노트\n- `README.md` — skills 섹션 `/cpp` 1줄\n- `CHANGELOG` — v3.15.0 항목\n\n## 테스트 & 검증\n\n6개 EARS 검증 항목(WHEN/THEN/SHALL)으로 됐다는 증거를 정의하고 충족 확인:\n\n- 새 세션 인벤토리에 `/cpp` 표시 — `skills/cpp/SKILL.md` 폴더만 생성하면 `plugin.json`의 `\"skills\": \"./skills/\"` 자동 등록으로 등장(cps가 hooks/scripts 하드코딩 0건인데도 인벤토리에 뜨는 것으로 확정).\n- `/cpp` 목표 문장에 기술 토큰 0개 — 목표 섹션 검사.\n- UI 요청 시 와이어프레임+요소스펙+상태+문구 4요소 포함.\n- Codex 미감지 시 진행 정지·보고 — SKILL.md Codex 게이트 명시.\n- 릴리즈 tag 푸시 후 재설치 cache가 `skills/cpp/` 포함 — `bump-version.sh 3.15.0`으로 12/12 파일 갱신·stale 0 확인, commit + `git tag v3.15.0` + push, `/lens-upgrade` 재설치로 캐시 3.15.0의 cpp/ 디렉토리 존재 확인.\n- `/cp`·board·`/cc` 핸드오프 회귀 0 — 기존 동작 점검.\n\n## 추가 사항\n\n남은 후속(모두 선택):\n\n- gh release 생성.\n- done-sweep의 cpp 마커 인식(v2) — cpp 문서가 `## Plan A` 부재로 \"수동확인필요\"로 분류될 수 있는 안전한 degrade를 보강.\n- UI 렌더 목업 — 현재는 ASCII 와이어프레임만 지원.\n","truncated":false,"stale":false,"branch":null,"base":null},{"id":"2026-06-05-lens-capability-modernization-audit","folder":"history","title":"Lens 자가 현대화 감사 기능 (`/cr`) — 완료","date":"2026-06-05","hasMd":true,"hasHtml":true,"mdPath":"history/2026-06-05-lens-capability-modernization-audit.md","htmlPath":"history/2026-06-05-lens-capability-modernization-audit.html","mdInline":"# Lens 자가 현대화 감사 기능 (`/cr`) — 완료\n\n**완료일**: 2026-06-06\n\n## 요약\n\nLens가 자기 자신의 모든 기능을 Claude/Codex의 최근 네이티브 발전과 사용자 세션 패턴에 비춰 주기적으로 재평가하는 `/cr`(자가 현대화 감사) 스킬을 신설했다. 한 번의 명령으로 4차원 양면 감사 — 공급-드리프트(여전히 유효한가), 공급-업그레이드(더 좋게 만들 벡터), 편의(워크플로 마찰 제거), 수요-마이닝(반복 패턴 기반 net-new 제안) — 를 수행해 각 기능에 KEEP/UPGRADE/OBSOLETE/NEW 판정과 라이브 근거를 단 분류 리포트를 산출한다. 감사 로직은 머신 독립적인 온디맨드 스킬 + creeta-lens 레포 한정 SessionStart staleness 알림(네트워크 호출 0)으로 구현했고, OBSOLETE 자동삭제는 0건 — 죽음 판정은 사람이 결정할 제안으로만 남긴다. v3.13.0으로 배포 완료.\n\n## 주요 결정 사항\n\n- **온디맨드 스킬 + 세션 staleness 알림 (cron 아님)** — Lens는 여러 머신에 배포되는 플러그인이라 cron은 머신 의존적이다. 기존 `/cu`(per-machine, 필요할 때만) 패턴과 일치하는 온디맨드 방식을 채택해 포터빌리티를 확보했다.\n- **레지스트리 포맷 = JSON** — Claude(markdown 표) vs Codex(JSON) 분기에서 JSON(`docs/rules/capability-assumptions.json`)을 채택. 사용자가 \"machine-readable\"을 명시했고, 훅의 레지스트리-해시 staleness 트리거가 안정적 직렬화를 요구하기 때문(JSON이 해시하기 깔끔).\n- **staleness 상태 = 프로젝트-로컬** — 전역 `~/.claude` vs 프로젝트-로컬 분기에서 `.lens/capability-audit-state.json`(로컬)을 채택. 전역이면 모든 프로젝트에서 알림이 떠 nag가 발생하지만, `/cr`은 lens 레포에서만 의미 있으므로 로컬 상태가 알림 스코프를 자연히 한정한다. 덤으로 레지스트리 해시 변경 시 재감사 신호도 얻는다.\n- **fetch 실패 = UNKNOWN-default (버전-앵커 오프라인 판정 아님)** — 라이브 데이터가 없을 때 추측으로 OBSOLETE를 찍는 것이 최악(false-obsolete)이다. 더 단순하고 안전한 UNKNOWN 표기를 택했다. 그 회차는 덜 actionable하지만 틀리지 않는다.\n- **`probe` 신호 타입 허용** — 능력 신호 중 로컬 확정 가능한 것(네이티브 명령 존재, `codex --help` 노출 모델 등)은 `probe`, 로드맵/공식 발표는 `web`. Pre-mortem P1·P2 — \"체인지로그는 능력을 다 안 알려주고 실행 중인 환경 자체가 더 권위 있는 신호\" — 를 레지스트리 스키마(`signal_method`)에 반영했다.\n- **OBSOLETE 자동삭제 0, 모호하면 KEEP** — 고신뢰 건도 삭제가 아니라 `docs/tasks/`에 `/cp` task로 핸드오프. obsolete 안전장치로 코드/스킬 파일 자동삭제를 금지했다.\n- **수요 가치 재정의** — Pass 1 감사에서 신기능 제안은 0건(`/ch`·`/cx` 둘 다 사용자 리뷰 후 드롭). 수요 가치는 \"반복 명령을 스킬 기본값으로\"로 재정의돼 v3.14.0에 반영됐다.\n\n## 변경 파일\n\n- `skills/cr/SKILL.md` (신규) — `/cr` 스킬. Phase A 레지스트리+버전 로드 → Phase B 라이브 fetch(공식 allowlist) → Phase C 분류(KEEP/UPGRADE/OBSOLETE/NEW + confidence + evidence) → Phase D md 리포트 → Phase E HTML 덱+board → Phase F 고신뢰 건 `/cp` 핸드오프 → Phase G stamp. `Triggers:` 줄 포함(자동추천 노출용).\n- `docs/rules/capability-assumptions.json` (신규) — machine-readable 레지스트리. 기능별 `{id, kind, refs[], purpose, assumed_native_gap, gap_closed_signal, signal_method(probe|web|both), official_sources[], false_obsolete_risk, last_reviewed}`. Pass1 감사의 11행을 시드로 사용.\n- `lib/capability-audit.js` (신규) — `readAuditState()`, `isLensRepo(cwd)`, `computeRegistryHash()`, `formatAuditNudge()`, CLI `stamp` 서브커맨드.\n- `hooks/session-start.js` — `isLensRepo(cwd)` 이고 (감사 주기 초과 또는 레지스트리 해시 변경)이면 muted 한 줄 알림 주입. 네트워크 0, fail-soft.\n- `lens.config.json` — `capabilityAuditIntervalDays`(기본 30) + `capabilityAuditNudge`(기본 true) 추가.\n- `CLAUDE.md` / `README.md` — 스킬 표에 `/cr` 추가.\n- 릴리스 산출물 — `scripts/bump-version.sh 3.13.0`(11곳 일괄 범프) + CHANGELOG `Added` + 태그 + GitHub Release.\n\n## 테스트 & 검증\n\n8개 검증 신호(✅표) 기준:\n\n- **분류 완전성** — 리포트 분류 행 수가 레지스트리 항목 수와 일치, 누락 0.\n- **근거 부착** — 모든 비-KEEP(OBSOLETE/UPGRADE/NEW) 행에 공식 체인지로그 URL+버전 인용. 근거 없는 비-KEEP = 0.\n- **핸드오프** — 고신뢰 UPGRADE/OBSOLETE/NEW가 `docs/tasks/`에 대응 `/cp` task로 생성됨.\n- **3종 산출 + board** — `docs/history/<id>.md`·`.html` + board 카드 노출.\n- **알림 스코프** — creeta-lens 세션 시작 시 알림 출력, 타 레포에선 미출력.\n- **타이머 리셋** — stamp 후 `lastAuditAt` 갱신 → 재시작 시 알림 소멸.\n- **obsolete 안전장치** — OBSOLETE 판정이 있어도 `git status` 변경분 = 문서·신규파일만(코드/스킬 자동삭제 0).\n- **degrade 안전** — 네트워크 차단 시 비-KEEP을 UNKNOWN으로 표기, OBSOLETE 추측 0.\n\n실증 완료(Pass 1, 2026-06-05): 이 4차원 감사를 멀티에이전트 워크플로로 1회 실행해 `/cr`이 자동화할 패스를 입증했다. 결과 = `docs/history/2026-06-05-lens-modernization-audit.md`(0 OBSOLETE / 2 KEEP / 9 THIN + 14 우선조치 + 신기능 0건). 원자료 = `.lens/conv-mining/audit-supply.json`·`audit-demand.json`.\n\n## 추가 사항\n\n- **수요 가치 후속** — \"반복 명령을 스킬 기본값으로\"는 v3.14.0에서 별도 반영.\n- **남은 코어 리팩토링(본 task 범위 밖, 별도 `/cp` 계획으로 분리)** — #6 `/goal` 위임, #7 Monitor 제거, #12 `/cps`, #13 `/cp` 토큰, #14 lens-upgrade. 미완이 아니라 의도적으로 분리된 후속 항목.\n- **언급만 한 드리프트** — `docs/START_HERE.md`의 6스킬(/cu 누락) 구문, SessionStart \"Quick Commands\" 하드코딩(/cps·/cs·/cu 누락)은 본 작업 범위 밖으로 명시.\n- **수명 주의** — `/cr` 매 실행 = `docs/history/`에 새 감사 파일 1개. 의도된 audit trail이나 board 카드가 누적 증가한다.\n","truncated":false,"stale":false,"branch":null,"base":null},{"id":"2026-06-05-lens-modernization-audit","folder":"history","title":"Lens 현대화 감사 — Pass 1 (2026-06-05)","date":"2026-06-05","hasMd":true,"hasHtml":true,"mdPath":"history/2026-06-05-lens-modernization-audit.md","htmlPath":"history/2026-06-05-lens-modernization-audit.html","mdInline":"---\ntitle: \"Lens 현대화 감사 — 11기능 재분석 + 대화 마이닝 신기능 제안 (Pass 1)\"\ndate: 2026-06-05\nkind: audit\nmethod: \"이종 멀티에이전트 워크플로 (공급 측 25 agents + 수요 측 19 agents, 듀얼 검증)\"\n---\n\n# Lens 현대화 감사 — Pass 1 (2026-06-05)\n\n> 이 문서는 `/cr`(자가 현대화 감사) 기능의 **첫 실증 실행** 결과이자, 그 기능이 매번 산출할 리포트의 양식 레퍼런스다. 두 축으로 감사했다:\n> - **공급 측** — Claude Code(v2.1.160) + Codex(0.137.0) 네이티브 능력이 어디까지 왔나 → 각 기능 노후도·업그레이드·편의\n> - **수요 측** — 사용자의 과거 세션 82개·954 발화에서 반복/불편/우회 패턴 → net-new 기능 제안\n>\n> 방법: 두 개의 멀티에이전트 워크플로(기능별 독립 분석 → 적대적 검증 → 종합). 라이브 CLI probe + 공식 문서 + 실제 소스 정독 기반. 근거 없는 OBSOLETE 금지, false-obsolete 적대 검증.\n\n---\n\n## 0. 한 줄 결론\n\n**2026-06 네이티브 Claude Code가 Lens 오케스트레이션 \"엔진\"의 대부분을 흡수했다 — 그러나 11기능 중 OBSOLETE는 0이다.** `/cs`(멀티레포 sweep)와 Codex 연동(cross-vendor 이종검증)은 네이티브가 직접 공백을 인정해 KEEP, 나머지 9개는 THIN(엔진은 네이티브에 위임해 얇게, 고유 코어만 생존). 살아남는 코어는 셋으로 수렴한다: **① 디스크 영속 산출물**(board HTML·docs 라이프사이클·감사로그 — 네이티브는 전부 세션 휘발), **② cross-vendor 이종검증**(codex/gpt-5.5 — 네이티브 평가자·워커가 전부 Anthropic 가족이라 구조적 비대체), **③ Worker 프롬프트에 박힌 Karpathy 4규칙 강제계약**.\n\n---\n\n## 1. 공급 측 — 11기능 노후도 판정\n\n| # | 기능 | 판정 | 한 줄 |\n|---|------|------|-------|\n| 1 | `/c` 단일 내비 | **THIN** | 모델배정·Monitor폴링·Supervisor·QA·5회게이트는 네이티브 흡수. 남는 코어=Worker의 Karpathy 4규칙 강제계약 + 추천 1개 확정 |\n| 2 | `/cc` 병렬 엔진 | **THIN** | 병렬 엔진은 Dynamic Workflows로 하강. 단 Codex AND-게이트 + /cp plan-binding + 한국어/Karpathy 규율은 생존 |\n| 3 | `/cp` 계획 엔진 | **THIN** | 실행·목표강제·프리모템은 네이티브(plan mode/goal/workflows) 위임 가능. 디스크 영속 문서 라이프사이클 + 작성시점 Goal 품질게이트는 비대체 |\n| 4 | `/cps` START_HERE | **THIN** | 네이티브 /init은 CLAUDE.md만, 라우팅 인덱스 아님. 비파괴 diff 게이트·(Not documented yet) 규율 비대체 |\n| 5 | `/cs` 멀티레포 동기화 | **KEEP** | 네이티브가 직접 인정한 공백 — EnterWorktree는 단일레포 멀티워크트리뿐. 워크스페이스 전 레포 sweep 무대체 |\n| 6 | `/cu` per-machine 업데이터 | **THIN** | 실행부는 네이티브 패스스루. cross-tool 열거 + staleness 플래깅(native는 'unknown') + multi-select는 비대체 |\n| 7 | `/lens-upgrade` | **THIN** | 버전올리기는 네이티브 흡수. 멀티스코프 dedup·stash·자동롤백·origin교정은 무노출 |\n| 8 | 발견/추천 레이어(훅) | **THIN** | 실측상 hollow(아래 §4). /command nag-차단 OVERRIDE + 세션 온보딩만 생존 |\n| 9 | 에이전트 대시보드(훅) | **THIN** | 쓰기 전용 텔레메트리(reader 0건). 세션 경계 영속 감사로그 + orphan 정합성은 비대체 |\n| 10 | plan-manager + board-builder | **THIN** | board-builder=KEEP급(5 호출처, 무대체). plan-manager 무거운 절반은 런타임 호출자 0 |\n| 11 | Codex 이종검증 연동 | **KEEP** | cross-vendor 이종검증은 구조적 비대체(네이티브 평가자·워커 전부 Anthropic). 개념층 KEEP / 배관층 THIN |\n\n**핵심 발견 (관통):** 네이티브 4종 — **Dynamic Workflows**(16동시·adversarial verify, v2.1.154+) + **per-agent 모델 서브에이전트**([sonnet,opus,haiku]) + **`/goal`**(매 턴 Haiku 평가자 재판정, v2.1.139+) + **plan mode** — 이 `/c`·`/cc`·`/cp`의 절차 분량 대부분을 네이티브 프리미티브의 prose 래퍼로 만들었다. 하지만 OBSOLETE 0 — 이유는 네이티브가 전부 **세션 휘발성**이고 **단일(Anthropic) 모델 가족**이며 **Karpathy 계약을 강제하지 않기** 때문.\n\n---\n\n## 2. 우선순위 실행목록 (임팩트 × 저비용)\n\n> 업그레이드·편의 개선을 임팩트/비용으로 랭킹. 각 항목은 `/cr`이 발견 시 `/cp` task로 핸드오프할 후보다.\n\n| # | 기능 | 조치 | 유형 | 임팩트 | 비용 |\n|---|------|------|------|--------|------|\n| 1 | codex / `/cc` | Codex 리뷰 게이트를 **`codex exec review --uncommitted --output-schema --ephemeral`**로 전환(bare `codex review` 아님 — exec review라야 schema 동시 노출). awk PASS/FAIL·수동 diff·orphan 의존 제거. 라이브 실측 통과·plan-tier 무의존 | upgrade | high | M |\n| 2 | 발견/추천 | UserPromptSubmit **매 메시지 자동제안 폐기**(autoRecommend 기본 off) + 죽은 `KNOWN_PLUGINS=[]` 디스커버리 제거 + CLAUDE.md:51 '60+ known plugins' 드리프트 수정 | deprecate | high | S |\n| 3 | `/cu` | vscode-번들 codex(0.137.0-alpha)를 GitHub stable과 비교하는 **오탐('항상 update available')** → `needs_update=null`. `_codex_install_kind`가 이미 vscode 구분 ~3줄 | fix | med | S |\n| 4 | codex SoT | `service_tier=priority` → 정식 **`service_tier=fast`+`features.fast_mode=true`**(priority는 레거시 별칭) + `gpt-5.5` 하드코딩 **버전무관 fallback**. SoT 1곳 갱신으로 /cp·/cc 전부 정합 | fix | med | S |\n| 5 | plan-board | plan-manager.js의 **런타임 호출자 0인 절반**(generatePlanContent 8개국어 dict·extractGoal·validate·save/loadPlanState) `@deprecated` 격리, 8개국어 dict 릴리스 동기화 의무 제거 | deprecate | med | S |\n| 6 | `/c`·`/cc` | Phase 4(Supervisor)+5(QA) 자작 점수제·5회 게이트를 **네이티브 `/goal` emit**으로 위임(/cp v3.7.0 선례). Supervisor/QA spawn 비용 제거 | adopt-native | high | M |\n| 7 | `/c`·`/cc` | **Monitor 폴링 에이전트 제거**(haiku 5분, ALWAYS deploy) → background exit 재호출+TodoWrite. 진행보고는 2분+ long-running만 | adopt-native | med | S |\n| 8 | 대시보드 | PostToolUse 훅이 `additionalContext`로 직전 Task status/실패사유 **모델 주입**(현 비스키마 필드는 모델에 안 닿음). write→consume 단절 해소 | upgrade | high | S |\n| 9 | `/cc`·`/cps` | 작업 종료 시 **자동 commit(+Co-Authored-By)+원격동기화** 기본화(더블게이트+QA 통과 시). **`.gitignore` 존중(시크릿 임의 제외 금지 — 사용자는 민감파일을 의도적으로 버전관리: `feedback_sensitive_files_to_livevil_setting`)**, default 브랜치면 먼저 브랜치, diverged면 보고만 | ergonomics | high | M |\n| 10 | `/cc`·`/c` | **헤드리스(cron/TTY없음) 감지 시 AskUserQuestion 폴백**(자동승인 or plan-only 종료). Mac Mini 무인 파이프라인 hang 방지 | ergonomics | med | M |\n| 11 | `/cs` | `git-sync-all.sh` `--json` 모드 + diverged/failed 최상단 강조 + SKILL.md:100 'Stop훅 auto-commit' 미구현 암시 제거(stop.js git 동작 0) | fix | med | S |\n| 12 | `/cps` | `/cs` 스윕에 **START_HERE 커버리지 체크** 끼워 '진입문서 없는 레포 N개' 일괄 보고+생성(14레포 수동 비현실적) | upgrade | high | M |\n| 13 | `/cp` | on-invoke 토큰(**~15.8k, Lens 최대**) 절감 — ORGANIZE/CONVERT·codex-integration·Karpathy 전문 인라인을 별도 참조로 분리, PLAN만 본문 | upgrade | high | M |\n| 14 | `/lens-upgrade` | Phase 1+4 정상경로를 `claude plugin marketplace update`+`plugin update --scope`로 위임, Lens는 백업·dedup·검증·롤백·origin교정만 | adopt-native | med | M |\n\n---\n\n## 3. 수요 측 — 대화 마이닝 신기능 제안\n\n> 82세션·954 발화에서 반복/불편/우회 패턴을 추출 → 신기능 제안 → 적대적 검증(근거 약하거나 기존 스킬 중복이면 DROP).\n\n**관통 테마:** ① claim-vs-reality(보고 전 라이브 미검증 단정 — 최빈 신뢰붕괴) ② 운영 파이프라인 '지금 정상?' 헬스체크 세션마다 반복 ③ 장시간 작업 진행보고 부재('2분마다 보고' 13회+) ④ 다중 세션·머신 핸드오프 부담('Continue from where you left off' 10회+) ⑤ 즉시·끝까지 실행 강박 ⑥ 시크릿 livevil-setting 중앙화.\n\n> **후속 정정 (2026-06-06, 사용자 리뷰 후):** Pass-1 은 `/ch`·`/cx` 2건을 KEEP 으로 제안했으나, 사용자 검토에서 **둘 다 드롭**으로 정정됐다(아래 ①②). 신기능 제안은 결국 **0건** — Pass-1 이 마이닝 5건 중 3건을 잘랐으나 사실 **5건 모두 잘랐어야 했다.** 대신 수요 측의 진짜 가치는 신기능이 아니라 **반복 명령을 기본값으로 박는 것**(아래 §3.5)으로 재정의됐고 v3.14.0 에 반영.\n\n### 신기능 제안 — 검토 후 0건 (모두 DROP)\n\n**① `/ch` 운영 헬스체크 디스패처 — DROP (2026-06-06 정정)**\n- Pass-1 제안: 사용자 기존 SoT(런북·체크스크립트·대시보드)를 발견·실행하는 얇은 디스패처.\n- **드롭 사유**: 범용 Lens 스킬로 **일반화 불가**. \"정상(healthy)\"의 정의는 레포 도메인마다 다르고 공통 불변식이 0이라(체크 로직이 환원 불가능하게 프로젝트별) — `/cs`(git 불변)·`/cu`(--version 불변)처럼 성립하지 않는다. 일반화 가능한 유일한 형태는 \"레포가 선언한 체크를 실행하는 러너\"인데 그건 이미 `make`/`npm run`/CI 가 하는 일이고, 사용자 14+ 레포에 그 선언 컨벤션이 균일하게 없다. 진짜 반복 실패는 \"구조 부재\"가 아니라 *런북을 무시하고 쿼리 재즉흥*하는 행동 문제 — 메모리 룰(`feedback_livevil_publishing_status_runbook_first`)이 이미 처리.\n\n**② `/cx` 세션 핸드오프 — DROP (2026-06-06 정정)**\n- Pass-1 제안: `initSession()` wipe 를 보존으로 고치고 Stop 훅이 산출물 경로 캡처 + 얇은 reader.\n- **드롭 사유**: 전제가 약하다. `initSession()` 의 wipe 는 **버그가 아니라 의도된 동작**일 가능성이 크다(세션마다 대시보드를 새로 시작하는 게 정상) — 그러면 고칠 건 동작이 아니라 *틀린 docstring 한 줄*뿐이다(별건 정정). 핸드오프 가치도 네이티브 `--resume`/`--continue` + `/cp` 의 \"재개 포인트\" 와 겹쳐 고유가치가 얇다. → 새 스킬 불요.\n\n### §3.5 수요 측의 진짜 가치 — 반복 명령 → 기본값 (v3.14.0 반영)\n\n신기능이 아니라, 사용자가 *매번 다시 치던 명령*을 스킬 기본 동작으로 박는 것이 실제 사용자-관점 개선이다. 마이닝 근거 → v3.14.0:\n- \"커밋하고 푸시해\"(다회) → `autoCommitOnComplete` **기본 on** (안전 레일).\n- \"N분마다 보고해\"(13회+) → `/c`·`/cc` 장시간 작업 자동 진행보고 기본.\n- \"어디 저장했어?\" → 산출물 풀 경로 자동 보고 기본.\n- \"지금 해 / 멀 기다려 / 니가 해\" → 즉시·끝까지 실행, 헤지·떠넘김 금지 기본.\n- \"보고 먼저 하고 적용\" → 위험·시각 변경은 보고-먼저 기본.\n\n### DROP — (Pass-1 원래 3건, 근거 강함)\n\n- **`/cv` 라이브 검증 게이트** → `/cc`·`/cp`로 MERGE. 문제는 절실하나 capability ~85%가 이미 `/cc` Phase 6 QA(verified=false 차단 + 4채널 라우팅)에 구현됨. 핵심 전제(보고 전 *자동* 게이트)는 invocable skill로 **구조적 불가** — un-invoked 주장에 게이트를 강제하려면 skill이 아니라 harness Stop-hook(settings.json). → `/cc` QA에 '생성물 factuality WebSearch 대조' 한 줄 + `/cp` 어휘 추가로 흡수.\n- **progress-pulse(자동 주기보고 훅)** → 빌트인 **`/loop` 중복**(DROP). 핵심 메커니즘이 기술적 불가 + 사용자 본인 메모리가 못박음: \"ScheduleWakeup은 /loop dynamic 컨텍스트 전용, 일반 훅에서 호출 불가\". 해법은 `/loop 2m <status check>`.\n- **`/cp` 라이브 임베드 뷰어** → **범위 밖**(DROP). 근거가 잘못된 대상에 붙음(grounded=false) — 인용은 전부 일반 UI 개발 워크플로지 /cp 요청 아님. /cp 핵심 아키텍처 4건 위반(코드 실행 금지·JS 제한·md=SoT·CSS 인라인 금지). 그 공백은 verify+Playwright+ui-ux-pro-max 영역.\n\n---\n\n## 4. 검증된 코드 드리프트 / 버그 (별건, 외과 수정 후보)\n\n감사 중 라이브 실측·소스 정독으로 확인된 사실(추측 아님):\n\n- **`lib/agent-tracker.js:163-168`** — docstring \"Preserves...\" ↔ 구현은 wipe. (직접 검증 ✅)\n- **발견/추천 레이어 hollow** — `KNOWN_PLUGINS=[]`(죽은 레지스트리), 481세션 빈 메모리(`recordSkillUsage` 호출 0), context7/playwright `triggers:[]`, 추천 score=`keyword.length` 노이즈. **CLAUDE.md:51 '60+ known plugins'는 드리프트**(실제 [] 비어있음).\n- **`skills/cs/SKILL.md:100`** — 'Stop 훅이 결국 auto-commit' 암시 ↔ `stop.js`는 git 동작 0 (미구현 드리프트).\n- **설치 origin 불일치** — 설치 origin=`CreetaCorp/lens` vs 스크립트=`livevil7/creeta-lens` → `/lens-upgrade` origin교정 필요.\n- **`/cu` codex 오탐** — vscode 번들(0.137.0-alpha.4) vs GitHub stable(0.137.0) 비교로 '항상 update available'.\n- (stale 제안 정정) `hook-utils.js:65`는 이미 `isTTY` 가드 적용됨 — stdin-hang은 해결된 상태.\n\n---\n\n## 5. 이 감사와 `/cr` 기능의 관계\n\n이 Pass 1은 `/cr`(자가 현대화 감사 스킬)이 **주기적으로 자동 생성할 리포트의 양식**이다. `/cr`은 4개 입력축으로 이 리포트를 만든다:\n\n1. **공급-드리프트** — 라이브 네이티브 능력(probe+web) vs 레지스트리의 \"공백 가정\" → 노후도(KEEP/THIN/OBSOLETE)\n2. **공급-업그레이드** — 새 네이티브를 써서 기존 기능을 더 강하게 (§2)\n3. **편의(ergonomics)** — 사용자 워크플로 기준 마찰 제거 (§2의 ergonomics 행)\n4. **수요-마이닝** — 세션 대화 패턴 → net-new 제안 (§3)\n\n`/cr` 레지스트리(`docs/rules/capability-assumptions.json`)의 **시드**는 이 감사의 `registry_seed` 11행(네이티브 능력별 gap_closed_signal + signal_method=probe/web/both + false_obsolete_risk)으로 채운다. `.lens/conv-mining/audit-supply.json`·`audit-demand.json`에 전체 원자료 보존.\n\n**다음 단계:** `/cr` 기능 자체의 구현 계획은 `docs/tasks/2026-06-05-lens-capability-modernization-audit.md` 참조. §2 상위 항목(특히 #1 Codex review, #2 추천기 폐기, #9 자동커밋)은 `/cr`이 아니어도 즉시 착수 가능한 독립 업그레이드다.\n","truncated":false,"stale":false,"branch":null,"base":null},{"id":"2026-05-30-codex-call-deep-fast-upgrade","folder":"history","title":"Codex 호출 업그레이드 — 깊게(xhigh) + 빠르게(priority) + drift/잔재 정리 — 완료","date":"2026-05-30","hasMd":true,"hasHtml":true,"mdPath":"history/2026-05-30-codex-call-deep-fast-upgrade.md","htmlPath":"history/2026-05-30-codex-call-deep-fast-upgrade.html","mdInline":"# Codex 호출 업그레이드 — 깊게(xhigh) + 빠르게(priority) + drift/잔재 정리 — 완료\n\n**완료일**: 2026-05-30\n\n## 요약\nlens가 codex를 부를 때 항상 가장 깊은 추론(`model_reasoning_effort=xhigh`)과 가능한 한 빠른 처리(`service_tier=priority`)로, 깨짐 없는 본문 수거(`-o`)로 호출하도록 표준 호출을 고정했다. 동시에 문서에 남아 있던 모델 drift(GPT-5.2 표기 → 실제는 gpt-5.5)와 취약한 텍스트 파싱(`^codex$`~`^tokens used$` awk 추출)·숫자 timeout 잔재(`timeout 30`)를 제거했다. 또한 `/cc`의 Claude 역할(Worker·Supervisor·QA)을 opus로 상향하고 Monitor만 haiku로 남겼다. SoT는 `docs/rules/codex-integration.md` 한 곳에서 고치고 `cp`/`cc` SKILL.md는 \"§N 참조\"로 통일했다.\n\n## 주요 결정 사항\n- **SoT 단일화 (Plan A)**: 호출 패턴·파싱·에러처리를 중앙 규칙 `codex-integration.md` 한 곳에서만 고치고, SKILL.md에 흩어진 직접 인용은 \"§4/§5 참조\"로 바꿨다. 외과적 변경 + 버전 전파는 `bump-version.sh`가 11곳을 일괄 처리하므로 수동 편집 대상이 아니다.\n- **깊이·속도 우선 (토큰 비용 비고려)**: 사용자 방침에 따라 `gpt-5.5` + `xhigh`(깊게) + `priority`(빠르게) + `-o`(깨짐 없는 수거)로 고정. priority는 부하 시 큐 우선권일 뿐 소규모 작업엔 무효과일 수 있다는 점을 문서에 명시해 \"빨라진다\"는 오해를 방지했다.\n- **숫자 timeout 폐기**: codex 호출은 background 병렬이라 느려도 기다리지 않는다. gate에서 ready면 수거, 아니면 degrade하고 Claude가 단독으로 끝까지 진행한다. 영원히 hang해도 Claude를 막지 않으며 세션 종료(Stop 훅)가 orphan을 정리하므로 숫자 timeout이 불필요하다.\n- **`-o` 파일명 race 방지**: Phase 0.5·2.4·4.5가 background 병렬이라 같은 임시 파일을 쓰면 덮어쓰기 위험이 있다. `/tmp/codex_<phase>_<무작위>.txt` 고유 파일명 컨벤션을 §5 표준으로 박았다.\n- **Claude 역할 모델 상향 (opus 우선)**: substantive 작업(Worker Easy/Medium/Hard, Supervisor, QA)은 전부 opus로 매핑. Monitor만 haiku로 남겼다 — 대시보드 상태 폴링만 하므로 opus의 품질 이득이 0인 유일 예외다.\n- **죽은 설명 강등**: `-o`로 본문만 받으면 §5의 \"원본 출력 예시\"가 추출에 더는 안 쓰이므로 삭제 대신 \"참고용 — 추출은 -o 권장\"으로 강등해 오해를 막았다.\n\n## 변경 파일\n- `docs/rules/codex-integration.md` — 중앙 규칙(SoT): §4 표준 호출에 `-m gpt-5.5 -c model_reasoning_effort=xhigh -c service_tier=priority -o` 추가, §5 파싱을 `-o` 본문 수거+고유 파일명 규칙으로 교체, §7 timeout 행/스니펫 제거, 모델 표기 5.2→5.5, 성능 표 갱신\n- `skills/cp/SKILL.md` — Phase 0.5/2.4/3.2의 codex 인용을 §4/§5 참조로 통일, timeout 어휘 제거\n- `skills/cc/SKILL.md` — Phase 4.5 codex 인용을 §4/§5 참조로 통일 + Model Assignment Table(한글·영문 2곳)·난이도 매핑·ASCII 다이어그램을 opus 상향에 맞게 갱신\n- `CHANGELOG.md` — v3.11.0 항목 추가\n- `CLAUDE.md` (creeta-lens) — Version feat 1줄 추가\n- (일괄) `plugin.json` / marketplace / hooks / SKILL.md 등 11곳 — `bump-version.sh 3.11.0`\n\n## 테스트 & 검증\n✅검증표 7개 항목 중 자동 판정 5개(#1·#2·#3·#6·#7) 전부 통과:\n- **#1** 표준 호출 라인에 `-m gpt-5.5` + `model_reasoning_effort=xhigh` + `service_tier=priority` + `-o` 모두 존재\n- **#2** 세 파일의 활성 코드에 취약 파싱(`tokens used`, `awk '/^codex/'`)·`timeout 30` 잔재 0건 (설명 텍스트 제외)\n- **#3** 세 파일에서 모델 지칭 `5.2` 0건 (Phase 번호와 무관)\n- **#6** `cc/SKILL.md`에서 Worker(Easy/Medium/Hard)·Supervisor·QA = opus, Monitor만 haiku로 표기\n- **#7** `cp/SKILL.md` Phase 3.1 pre-mortem이 기존대로 opus 유지(다운그레이드 없음)\n\n배포·설치 검증(#5)도 통과: commit `b7c195f` + tag `v3.11.0` push → livevil7/creeta-lens(= CreetaCorp/lens, 동일 레포), `scripts/upgrade.sh`로 캐시 3.11.0 설치 및 `plugin list` v3.11.0 확인.\n\ncodex 미응답 degrade(#4, manual)는 본 작업 진행 중 실증됐다: Phase 0.5 Codex 독립조사가 sandbox 정책으로 `codex exec --help` 차단 + 한글 출력 mojibake로 degrade했고, Claude가 `-o` 동작을 직접 실측 검증(최종 답변 본문만 파일로 떨굼 확인)하며 단독으로 작업을 완료했다 — 본 작업이 인코딩하려던 graceful degrade의 실증 사례다.\n\n## 추가 사항\n- **머신 간 전파**: `bump-version.sh`는 이 레포만 갱신한다. 이 PC는 Claude Code 재시작 후 3.11.0이 활성화되며(작업 당시 세션은 3.10.0 캐시), Mac Mini 등 다른 머신은 push 후 `/lens-upgrade`로 반영해야 한다. 검증 #5는 이 PC 한정이다.\n- **호환성 fallback (Plan B, 미발동)**: `service_tier=priority` 또는 `-o`가 다른 codex 빌드/계정에서 거부·부재면 부가분만 빼고 핵심(xhigh 깊이 + 모델 drift 제거)은 살리는 경로를 문서화했으나, 이 머신에서는 실호출 검증을 통과해 발동하지 않았다.\n- **후속 진화 (별도, 미완 아님)**: 이후 v3.19.0에서 `priority` → `service_tier=fast`, `xhigh` → 입력 규모 분기(소규모 xhigh / 대규모 high)로 진화했다. 이는 본 작업의 후속 진화이지 미완 항목이 아니다.\n","truncated":false,"stale":false,"branch":null,"base":null},{"id":"2026-05-27-cps-start-here-and-cp-done-sweep","folder":"history","title":"/cps (START_HERE 생성기) + /cp done 기존 task 전수 정리 — 완료","date":"2026-05-27","hasMd":true,"hasHtml":true,"mdPath":"history/2026-05-27-cps-start-here-and-cp-done-sweep.md","htmlPath":"history/2026-05-27-cps-start-here-and-cp-done-sweep.html","mdInline":"# /cps (START_HERE 생성기) + /cp done 기존 task 전수 정리 — 완료\r\n\r\n**완료일**: 2026-05-27 (대상: v3.10.0 — 소스 반영 완료, git tag/push는 사용자 release 단계)\r\n\r\n## 요약\r\n\r\nlens에 신규 skill `/cps`를 추가했다. 어떤 레포든 `/cps` 한 번이면 실제 docs를 스캔해 `docs/START_HERE.md`(레포 first-read 진입점 + 질문 라우팅)를 생성/갱신한다. 함께 `/cp done`을 강화해, 새 task만이 아니라 `docs/tasks/`에 쌓인 기존 task까지 전수 재평가해 완료분을 일괄 아카이브 제안하도록 했다. (이 sweep으로 본 task와 방치 2건을 정리한 것이 첫 실사용.)\r\n\r\n## 주요 결정 사항\r\n\r\n- **SKILL.md-only + 강제 evidence step** (Plan A): 인터랙티브 스킬이라 Claude의 Glob/Read가 곧 ground-truth. Codex가 권한 결정론적 `lib/start-here-builder.js`는 허구 경로 재발 시의 Plan B로 격하 — Plan B 미발동(허구 경로 0).\r\n- **비파괴 게이트**: 기존 START_HERE는 diff+승인 후에만 갱신. CLAUDE.md 포인터는 없을 때만 1줄 조건부 주입(있으면 무변경, CLAUDE.md 신규 생성 안 함). docs/ 없으면 생성.\r\n- **허구 경로 0 원칙**: Glob 미확인 경로 나열 금지, 근거 부족은 `(Not documented yet)`.\r\n- **/cp done 강한 완료 신호**: 출시 기록(CHANGELOG/CLAUDE.md Version)이 확인되면 체크박스 미체크·재개포인트 잔존이어도 완료 추정으로 승격(최종 아카이브는 사용자 승인). 그 외 신호 상충 시 안전쪽(진행중/수동확인) 우선. 자동삭제 금지.\r\n- **surgical**: DONE 모드 Phase 1만 강화, Phase 2~4 불변.\r\n\r\n## 변경 파일\r\n\r\n- `skills/cps/SKILL.md` — 신규 (5단계 절차)\r\n- `skills/cp/SKILL.md` — DONE 모드 Phase 1 강화 (전수 재평가 3분류 + 강한 완료 신호)\r\n- `.claude-plugin/{plugin,marketplace}.json`, `hooks/`, `skills/{c,cc,cp,cs}/SKILL.md`, `CLAUDE.md`, `README.md`, `CHANGELOG.md` — v3.9.0 → v3.10.0 범프 (11곳) + /cps 문서화\r\n- `docs/START_HERE.md` — 신규 (dogfood 산출물)\r\n\r\n## 테스트 & 검증\r\n\r\n- /cc 병렬 실행 (Worker #1 opus: cps, Worker #2 sonnet: cp DONE). 품질 게이트 더블 검증: Supervisor iter1 FAIL(72) → iter2 PASS(88), Codex iter1 FAIL(7건) → iter2 PASS. Codex 단독 발견 2건(CLAUDE.md 모순, START_HERE 자기참조)이 이종 검증 가치 입증.\r\n- dogfood: `docs/START_HERE.md` 생성 → 나열 경로 16/16 실존(허구 0, `ls` 대조). CLAUDE.md 포인터는 이미 참조 존재로 skip. `/cp done` 분류 검증(2026-05-16 → 완료추정, 출시 기록 근거).\r\n- Goal 4/4 ✓.\r\n\r\n## 추가 사항\r\n\r\n- **남은 release (사용자)**: `git commit + tag v3.10.0 + push` → `/lens-upgrade` 후 라이브 `/cps`·강화된 `/cp done` 사용 가능. (현재 소스만 반영, 설치 캐시는 3.9.0)\r\n- dogfood에서 tie-break이 출시된 옛 task를 완료추정에서 빼는 문제를 발견 → 사용자 결정으로 \"출시 기록=강한 완료 신호\" 예외 추가.\r\n- 계획 문서(Plan A/B + 듀얼 합성 + Pre-mortem): 이 history의 원본 task.\r\n","truncated":false,"stale":true,"branch":null,"base":null},{"id":"2026-05-26-goal-human-centric-codex-dual-verification","folder":"history","title":"사람 중심 Goal 2층 구조 + Codex 듀얼 검증 — 완료","date":"2026-05-26","hasMd":true,"hasHtml":true,"mdPath":"history/2026-05-26-goal-human-centric-codex-dual-verification.md","htmlPath":"history/2026-05-26-goal-human-centric-codex-dual-verification.html","mdInline":"---\nname: goal-human-centric-codex-dual-verification\nplan_id: 2026-05-26-goal-human-centric-codex-dual-verification\ndescription: Lens v3.8.0+v3.9.0 — 사람 중심 Goal 2층 구조 + Codex 공동 조사·더블 검증 (한 릴리스로 배포) 완료\nstatus: done\ncompleted: 2026-05-26\n---\n\n# 사람 중심 Goal 2층 구조 + Codex 듀얼 검증 — 완료\n\n**완료일**: 2026-05-26 · **릴리스**: v3.9.0 (v3.8.0 작업 포함, 별도 릴리스 없이 묶음)\n\n## 요약\n\n`/cp` 의 Goal 을 **사람 중심 2층 구조**로 재설계하고(v3.8.0), Codex 를 \"Claude 결과의 부분 검토자\"에서 **공동 조사자·공동 검증자**로 격상(v3.9.0)했다. 두 작업은 한 세션에서 연속 진행되어 **v3.9.0 한 릴리스**로 묶여 배포됐고, `/lens-upgrade` 로 이 PC 설치본(3.6.5 → 3.9.0)까지 반영했다.\n\n- **v3.8.0**: Goal 문장에서 개발 검증어(`201`·`user row` 등)를 추방하고, 🎯 목표=\"무엇이 가능해지는가\"(사람 언어)와 ✅ 검증=\"이게 됐다는 증거\"(기계 언어)로 2층 분리. 기존엔 사용자가 자기 계획서를 읽고도 함수·HTTP 코드 때문에 판단할 수 없던 문제 해결.\n- **v3.9.0**: `/cp` 는 Claude‖Codex 병렬 독립 조사(Phase 0.5) + 합성·교차검증(Phase 2.4), `/cc` 는 매 반복 Codex 코드리뷰 게이트(Phase 4.5)로 모든 코드 변경을 이종 모델 더블 검증.\n\n## 주요 결정 사항\n\n- **Goal=사람 언어, 검증=기계 언어 (2층 완전 분리)** — 사용자 명시 요청(\"무슨 함수가 어쩌고 하면 내가 알아듣겠어?\"). 기술 토큰은 목표 문장에서 reject → ✅검증 표로 강제 이동. 이 매핑이 게이트가 됨: \"사람 목표 → 검증 ≥1행\" 매핑 안 되면 = 모호 = reject.\n- **검증어는 검증 표에만** (사용자 선택) — Goal 옆 괄호 병기·완전 제거 대신 \"검증 표에만 남긴다\" 선택. Goal 문장은 100% 사람 언어.\n- **더블 검증은 항상(trivial만 skip)** (사용자 선택) — 비용·속도보다 안전망 우선. trivial(오타·한 줄)·비-코드는 skip, Codex 부재/실패는 graceful degrade(블로킹 금지).\n- **/cc 형태 = Claude 구현 → Codex 리뷰 게이트** (사용자 선택) — 독립 구현 후 병합(머지 충돌·비용 큼) 대신 리뷰 루프. Supervisor pass + Codex pass 둘 다여야 진행.\n- **/cp 분기 = Claude가 근거와 함께 선택·기록** (사용자 선택) — 객관 판정 불가한 분기는 trade-off 근거와 함께 Claude가 결정하고 `🔀 듀얼 합성` 섹션에 기록(사용자가 승인 게이트에서 확인).\n- **plan-manager.js 전면 동기화** (사용자 선택) — 런타임은 SKILL.md 기반(코드 생성기는 백업)이지만, 백업 생성기·extractGoal·8-lang dict 까지 신구조로 일치시켜 latent drift 제거.\n- **Pre-mortem 중복 호출 회피** — Phase 0.5 에서 Codex 조사가 돌면 Phase 3 Codex 호출 skip(quota 절약), Opus 단독으로 통합안 점검.\n- **산출물 링크 풀 경로 강제** (사용자 요청) — 보고 시 bare 파일명 금지, 프로젝트 루트 기준 전체 경로 클릭 링크.\n- **v3.8.0 별도 릴리스 안 함** — 미커밋 상태에서 v3.9.0 작업이 이어져, 두 기능셋을 v3.9.0 한 커밋·태그로 묶음. CHANGELOG 는 [3.8.0]·[3.9.0] 항목 분리 유지.\n\n## 변경 파일 (commit `b27b2a6`, 13개)\n\n- **스킬**: `skills/cp/SKILL.md` (Phase 0 2층·0.0 인터뷰·0.2 서브골·0.5 Codex 조사·2.4 듀얼 합성·2.5 템플릿·5.0 게이트·핸드오프·절대규칙), `skills/cc/SKILL.md` (핸드오프 4칼럼·Phase 4.5 Codex 리뷰·Phase 5 더블 게이트·QA auto/manual·절대규칙)\n- **라이브러리**: `lib/plan-manager.js` (8-lang dict·generatePlanContent 2층+종류 칼럼·extractGoal 다국어·dualSynthesis 렌더링·JSDoc)\n- **규칙 문서**: `docs/rules/codex-integration.md` (사용지점 4곳·§8.5 듀얼 검증 호출 패턴)\n- **manifest/문서**: `.claude-plugin/plugin.json`·`marketplace.json`, `CLAUDE.md`, `CHANGELOG.md`, `README.md`, `hooks/hooks.json`·`session-start.js`, `skills/c|cs/SKILL.md` (버전 bump 3.7.0→3.8.0→3.9.0)\n\n## 테스트 & 검증\n\n- **plan-manager.js 실측** (`node -e`) — generatePlanContent(ko)가 🎯 목표(plain bullet)+✅검증(종류 칼럼)+🔀 듀얼 합성 생성 확인, `validatePlanStructure` = `{valid:true}`, `extractGoal` 왕복(사람 목표→successCriteria) 확인.\n- **레거시 호환** — 옛 체크박스 구조(deliverables+성공기준) 문서도 extractGoal 이 그대로 파싱 확인. verification 미제공 시 outcomes 로 manual 행 폴백.\n- **릴리스 체인** — `bump-version.sh 3.9.0` (11/11 파일), commit `b27b2a6` + tag `v3.9.0` + push(master+태그). 옛 로컬 태그 충돌(v1.9.0/v2.0.0)은 이번 릴리스와 무관.\n- **`/lens-upgrade` 실측** — 마켓플레이스 v3.9.0 감지 → `claude plugin install lens@CreetaCorp` → 검증: registry 1 entry = v3.9.0, `claude plugin list` 확인.\n- **Karpathy 규칙 보존** — 새 3.9.0 캐시의 c/cc/cp SKILL.md 전부 `MUST FOLLOW` 마커 포함 확인(직접 grep — 검증 스크립트는 stale).\n\n## 추가 사항\n\n- **Claude Code 재시작 필요** — 현재 세션은 캐시 3.6.5 로 동작(skill 로드 시점). 재시작해야 v3.9.0 로드.\n- **옛 로컬 태그 정리 완료** — v1.3.0~v2.0.0 9개 삭제(로컬 한정, 원격 보존 → `git fetch --tags` 복구 가능).\n- **검증 스크립트 stale** — `livevil-setting/scripts/sync-karpathy-rules.ps1` 가 하드코딩 `lens\\3.3.3\\skills` 경로 + `~/.claude/CLAUDE.md` 의 `MUST FOLLOW` 마커 불일치로 false [MISS] 발생. 별도 수정 필요(미처리).\n- **stale task 2건 잔존** — `docs/tasks/2026-05-16-cp-goal-first-overhaul.md`(v3.4 shipped), `2026-05-20-cp-html-reports-board.md`(v3.6.0 shipped)는 이번에도 archive 안 함.\n- **미저장 메모리** — \"목표·설명은 사람 언어로\" + \"산출물 풀 링크\" 선호는 durable 하지만 메모리에 미기록(사용자 보류).\n","truncated":false,"stale":false,"branch":null,"base":null},{"id":"2026-05-21-cp-board-redesign","folder":"history","title":"Lens v3.6.0 — /cp Taskboard 전면 재설계 — 완료","date":"2026-05-21","hasMd":true,"hasHtml":true,"mdPath":"history/2026-05-21-cp-board-redesign.md","htmlPath":"history/2026-05-21-cp-board-redesign.html","mdInline":"# Lens v3.6.0 — /cp Taskboard 전면 재설계 — 완료\n\n**완료일**: 2026-05-21\n\n## 요약\n\n`/cp`의 문서 보드를 전면 재설계해 **v3.6.0**으로 배포했다. `board-builder.js`가 `docs/{tasks,history,rules}` 3폴더의 `.md`+`.html`을 직접 인덱싱해 단일 라이트 테마 `board_<repo>.html`을 생성하고, html이 있는 문서는 slide-over iframe으로, md-only 문서는 원본 텍스트 + \"Convert to HTML\" 버튼(Claude 재생성 요청)으로 보여준다. `docs/reports/` 중간단계는 폐지(비파괴).\n\n## 주요 결정 사항\n\n- **전환 버튼 = Claude 재생성 요청**: 정적 `file://`는 폴더 읽기·Claude 호출·파일 쓰기가 모두 불가하므로, 버튼은 `/cp html docs/<경로>` 명령을 클립보드에 복사하고 사용자가 Claude Code에 붙여넣어 실행한다. 슬라이드 데크 품질은 Claude 재구성으로만 가능.\n- **전면 재설계 + 비파괴**: `reports/` 폐지, 3폴더 직접 인덱싱. 단 기존 `reports/`·`board.html`은 삭제하지 않음(다른 repo 호환).\n- **보드 기본 생성**(opt-in 해제), 파일명 `board_<repo>.html`.\n- **XSS 차단 = escape + `textContent`만**: md를 절대 `innerHTML`/파싱하지 않음 → 마크다운 라이브러리 불필요(단순성).\n- **디자인**: 초기 다크/사이드바 버전을 사용자가 반려 → `livevil-contents`의 기준 보드(라이트·3열 카드·slide-over)를 명시적 베이스로 클론. Rules 열은 보라 액센트로 \"참조 문서\" 구분.\n\n## 변경 파일\n\n- `lib/board-builder.js` — schema v3 재작성(3폴더 스캔, md inline·40KB 캡·stale 해시) + `$` replace 버그 픽스(함수 치환)\n- `templates/board.template.html` — 라이트 3열 + slide-over + 전환버튼/실패 모달\n- `skills/cp/SKILL.md` — CONVERT 모드(`/cp html`) 신설 + PLAN/DONE html 위치(reports/→폴더 옆) + 보드 기본 생성\n- `templates/report-conversion-spec.md` — `../_shared.css` + beside-md 위치\n- `lens.config.json` — `buildBoard: true`\n- `.claude-plugin/{plugin,marketplace}.json`, `CLAUDE.md`, `README.md`, `CHANGELOG.md` — v3.6.0\n\n## 테스트 & 검증\n\n- `node lib/board-builder.js` → `19 docs (tasks=3 history=11 rules=5)` 콘솔 출력\n- 브라우저(localhost http) 검증: 라이트 3열 카드 그리드, html 클릭→슬라이드 데크 iframe, md-only 클릭→원본+Convert 버튼(클립보드 토스트 `/cp html docs/...`), 콘솔 에러 0\n- XSS 픽스처(`<script>`, `<\/script>` breakout) → 보드 내 raw `<\/script>`=1(보드 자체뿐), 픽스처는 `<\\/` escape + textContent로 미실행 확인\n- **버그 발견·수정**: `tpl.replace('{{BOARD_DATA}}', payload)`가 md의 `` $` ``(codex-integration.md)를 replace 특수패턴으로 해석 → 템플릿 누출로 JSON 깨짐(콘솔 `Invalid or unexpected token`). 함수 치환 `() => payload`로 픽스. 브라우저 검증이 아니었으면 못 잡았을 통합 버그.\n- 배포: commit `c48fcf8` + tag `v3.6.0` → `origin(livevil7/creeta-lens)` push → `/lens-upgrade` exit 0 → `claude plugin list` = **v3.6.0**\n\n## 추가 사항\n\n- 새 스킬은 **Claude Code 재시작** 후 로드됨(현 세션은 v3.5.0 스킬로 동작 중에 작업).\n- 캐시 `3.5.0`/`3.3.1`은 활성 세션이라 보존됨 — 재시작 후 다음 업그레이드 시 정리.\n- **보류 작업**: `creeta-homepage/docs/tasks/2026-05-21-lens-homepage-update.md` (홈페이지 Lens 카피 v3.5→현행 갱신).\n- `docs/tasks/`의 테스트 md 2개(`2026-05-16-cp-goal-first-overhaul`, `2026-05-20-cp-html-reports-board`)는 테스트 산출물로 잔존(보드 렌더 픽스처).\n","truncated":false,"stale":false,"branch":null,"base":null},{"id":"2026-05-21-public-distribution-hardening","folder":"history","title":"Lens 범용 공개 배포 하드닝 — 완료","date":"2026-05-21","hasMd":true,"hasHtml":true,"mdPath":"history/2026-05-21-public-distribution-hardening.md","htmlPath":"history/2026-05-21-public-distribution-hardening.html","mdInline":"---\r\nname: public-distribution-hardening\r\nplan_id: 2026-05-21-public-distribution-hardening\r\ndescription: Lens v3.6.4 — 범용 공개 배포 하드닝 (하드코딩/개인정보 제거 + cross-platform 버그 수정) 완료\r\nstatus: done\r\ncompleted: 2026-05-21\r\n---\r\n\r\n# Lens 범용 공개 배포 하드닝 — 완료\r\n\r\n**완료일**: 2026-05-21 · **릴리스**: v3.6.4\r\n\r\n## 요약\r\n\r\n낯선 사용자가 받아 써도 개인 identity 노출·끊긴 포인터·플랫폼 깨짐이 없도록 Lens 플러그인을 정리했다. 5개 스킬 + 스크립트 + manifest/template을 **병렬 4-에이전트**로 코드리뷰(raw ~70건) → Karpathy 기준 필터링(15건 채택, 9건 거부) → 6워커 병렬 수정 → QA 실측 → **v3.6.4** 릴리스 + `/lens-upgrade` 설치 검증까지 완료.\r\n\r\n## 주요 결정 사항\r\n\r\n- **Karpathy Rule 2로 강하게 필터링** — 에이전트가 제안한 env var 남발(`LENS_DOCS_DIR`/`LENS_MAX_*`/`LENS_*_TIMEOUT_MS` 등 8종), 엔터프라이즈 드라이브 대응, 스키마 마이그레이션 등 **요청 안 한 speculative 유연화 9건을 의도적으로 거부**. 배포 안전성과 직결된 것만 채택.\r\n- **marketplace 이름은 유지, repo URL만 정정** — `\"name\": \"CreetaCorp\"`·설치키 `lens@CreetaCorp`는 식별자라 보존, stale `CreetaCorp/lens` repo URL만 실재 레포 `livevil7/creeta-lens`로.\r\n- **M1 마켓플레이스 sync = pull-only 가드** — `/cs`가 플러그인 자기 repo로 auto-commit/push하면 위험 → marketplace 경로는 fetch+ff-pull만.\r\n- **M7은 소프트 경고 대신 하드 게이트** — `/cp`가 md만 남기고 끝나던 구조적 결함을 \"필수\" 문구 반복(증상)이 아니라 **Phase 5.0 산출물 게이트**(md+html+board 3종 존재 검사)로 강제.\r\n- **creetacorp remote 푸시 제외** — origin(livevil7/creeta-lens)으로 redirect되는 동일 레포라 origin만 푸시. 사용자가 의문 제기한 remote는 안 건드림.\r\n- **dedup 버그는 거부** — 에이전트가 BLOCKER로 본 \"Windows stat inode dedup 깨짐\"은 실측 결과 정상 작동이라 제외(과진단 정정).\r\n\r\n## 변경 파일 (23개, commit `fbf6c46`)\r\n\r\n- **스크립트**: `scripts/git-sync-all.sh` (B1 author·M1 marketplace·M5 push remote·M6 scan roots), `scripts/upgrade.py` (M3 dry-run fetch·M4 동적 브랜치), `scripts/bump-version.sh` (M2 BSD sed)\r\n- **manifest/README**: `.claude-plugin/plugin.json`, `.claude-plugin/marketplace.json`, `README.md` (B2 URL)\r\n- **스킬**: `skills/cp/SKILL.md` (M7 게이트·N1·N6 `{lens}`·GPT-5.2), `skills/c|cc|cs/SKILL.md` (N1·N2·N4)\r\n- **템플릿/docs**: `templates/report-plan.example.html`·`report-history.example.html`·`report-shared.css`·`board.template.html` (N3), `docs/rules/codex-integration.md` (N5)\r\n- **기타**: `.gitignore` (`.agents/` 추가), `CHANGELOG.md`, `CLAUDE.md`, `hooks/hooks.json`·`session-start.js` (버전 bump), task 문서 2종\r\n\r\n## 테스트 & 검증\r\n\r\nQA를 텍스트 검토가 아닌 **실제 명령**으로 수행 (7개 성공기준 전부 PASS):\r\n\r\n- `grep` 0건 — 강제 commit identity / `/c/Users`·`C:/Users`·`/Users/user` 절대경로 / `livevil-setting`·`spotedcrypto`·`livevil-contents`·`namane`·`GPT-5.2` 개인 컨텍스트 (CHANGELOG·docs/history 제외)\r\n- `grep \"CreetaCorp/lens\"` .claude-plugin/·README = 0 (`\"name\":\"CreetaCorp\"`만 잔존, 의도)\r\n- `bash -n` (git-sync-all.sh·bump-version.sh) + `ast.parse` (upgrade.py) 전부 OK\r\n- `/cs` 마켓플레이스 root(line 35) + pull-only 가드(line 138) 구조 확인\r\n- `/cp` Phase 5.0 산출물 게이트 텍스트 확인\r\n- **`/lens-upgrade` 실측** — 마켓플레이스가 origin에서 v3.6.4 pull → 설치 → 검증: registry 1 entry, `claude plugin list` = v3.6.4\r\n\r\nQA가 워커 자기보고가 놓친 3건(cp/SKILL.md의 GPT-5.2, board.template.html의 livevil-contents, example의 namane)을 잡아 추가 수정 — \"trust but verify\"로 누락 차단.\r\n\r\n## 추가 사항\r\n\r\n- **Claude Code 재시작 필요** — 현재 세션은 캐시 v3.6.3로 동작. 재시작해야 v3.6.4 로드.\r\n- **stale task 2건 잔존** — `docs/tasks/2026-05-16-cp-goal-first-overhaul.md`(v3.4.0 shipped), `2026-05-20-cp-html-reports-board.md`(v3.6.0 shipped)는 이번에 archive 안 함. 별도 `/cp done`으로 정리 가능.\r\n- **메모리 기록** — `/cp` 필수 단계(HTML+board) 건너뛰기 금지를 feedback 메모리에 저장(세션 중 2회 발생).\r\n- GitHub 릴리스: https://github.com/livevil7/creeta-lens/releases/tag/v3.6.4\r\n","truncated":false,"stale":true,"branch":null,"base":null},{"id":"2026-05-20-cp-html-reports-board","folder":"history","title":"/cp 보고서 HTML 양식 + Task Board — 완료","date":"2026-05-20","hasMd":true,"hasHtml":true,"mdPath":"history/2026-05-20-cp-html-reports-board.md","htmlPath":"history/2026-05-20-cp-html-reports-board.html","mdInline":"# /cp 보고서 HTML 양식 + Task Board — 완료\r\n\r\n**완료일**: 2026-05-21 (출시: v3.6.0, 계획 작성 2026-05-20)\r\n\r\n## 요약\r\n\r\nlivevil-contents에서 검증한 Pretendard 미니멀 보고서 HTML 양식 + board 인덱스를 lens `/cp`의 범용 기능으로 승격했다. `/cp`가 만든 task/history 문서를 slide-deck HTML로 보고, `docs/board.html`이 카드 클릭 시 iframe panel로 즉시 표시한다. 데이터 모델은 **md = SoT, HTML = 파생 뷰**.\r\n\r\n## 주요 결정 사항\r\n\r\n- **md SoT + HTML 파생 뷰** (사용자 확정) — 상태/요약은 md에만, HTML은 항상 md에서 파생.\r\n- **board-builder.js**: `docs/{tasks,history}` 스캔 → board.html, `lens:source-hash` stale 감지.\r\n- **자산 자동 배포**: `_shared.css`를 cp 실행 시 최초 1회 배포(있으면 skip).\r\n- **하위 호환**: 최초엔 `reportFormat` opt-in(기본 md)으로 md-only 프로젝트 무영향. 이후 v3.6.0 board 전면 재설계에서 **always-on**으로 승격되며 이 task의 기반이 흡수됨.\r\n\r\n## 변경 파일\r\n\r\n- `templates/` — report-shared.css, report-conversion-spec.md, report-{history,plan}.example.html, board.template.html\r\n- `skills/cp/SKILL.md` — \"HTML 보고서 뷰 + Task Board\" 섹션\r\n- `lib/board-builder.js` — 신규 (스캔 → board, iframe panel, stale 감지)\r\n- `lens.config.json` — reportFormat 옵션\r\n\r\n## 테스트 & 검증\r\n\r\nlivevil-contents 3카드로 board 빌드 + 카드 클릭 → iframe panel 동작 검증. v3.6.0으로 출시(CHANGELOG `## [3.6.0]`). 본 task의 opt-in 접근은 v3.6.0 board 전면 재설계(`docs/history/2026-05-21-cp-board-redesign.md`)에서 `board_<repo>.html` 3-폴더 통합 + always-on으로 진화함.\r\n\r\n## 추가 사항\r\n\r\n이 task의 실질 후속/완성본은 `docs/history/2026-05-21-cp-board-redesign.md`다. 본 계획 문서가 `docs/tasks/`에 중복 방치돼 있다가 2026-05-27 `/cp done` sweep으로 정리됨.\r\n","truncated":false,"stale":true,"branch":null,"base":null},{"id":"2026-05-16-cp-goal-first-overhaul","folder":"history","title":"/cp + /cc Goal-first 구조 동시 개편 — 완료","date":"2026-05-16","hasMd":true,"hasHtml":true,"mdPath":"history/2026-05-16-cp-goal-first-overhaul.md","htmlPath":"history/2026-05-16-cp-goal-first-overhaul.html","mdInline":"# /cp + /cc Goal-first 구조 동시 개편 — 완료\r\n\r\n**완료일**: 2026-05-16 (출시: v3.4.0)\r\n\r\n## 요약\r\n\r\n`/cp`(계획)와 `/cc`(실행)를 **Goal-first** 구조로 동시 개편했다. 계획 문서가 `🎯 Goal → Plan A → Plan B → 사전 리스크 → 진행상황` 순서로 재구성되고, `/cc`는 Goal의 성공 기준을 최우선 로드해 미달 시 done을 차단하고 Plan A↔B를 자동 전환하는 Goal-aware 실행 엔진으로 격상됐다.\r\n\r\n## 주요 결정 사항\r\n\r\n- **Goal 절대 우위**: 모든 보조 섹션(Plan A/B, Pre-mortem)은 Goal에 종속. Goal이 약하면 Approve 거부.\r\n- **/cp↔/cc 핸드오프 프로토콜 명문화**: 어떤 필드를 어떤 형식으로 전달하는지 양쪽 SKILL.md에 고정.\r\n- **Plan B 의무화**: medium+ 규모는 Plan B 필수, small은 생략 사유 명시.\r\n- **8개 언어 헤더 dict**: Goal/Plan A/Plan B/Trigger 키를 EN/KO/JA/ZH/ES/FR/DE/IT 전부 채움.\r\n- **하위 호환**: 기존 v3.3.x 형식 문서도 `parsePlanFrontmatter`로 계속 읽힘.\r\n\r\n## 변경 파일\r\n\r\n- `skills/cp/SKILL.md` — Phase 0(Goal) → Plan A → Plan B → Pre-mortem 재구성\r\n- ix 방안: `if (process.stdin.isTTY) process.exit(0);` 가드.\n- **#2 fs.* operations without try/catch** (session-start.js, agent-tracker.js, keyword-matcher.js, memory-store.js, plan-manager.js 등 15곳). 권한/disk/corrupt 시 hook 통째로 throw → \"Hook UserPromptSubmit error\" 패턴. Fix 방안: sync-pull.js의 fail-soft 패턴 적용.\n\n### MINOR — 미해결\n\n- context 비용 절감 (Plugin Discovery Registry 표 크기), 에러 처리 일관성, KNOWN_PLUGINS 표기 통일.\n\n## 주요 결정 사항\n\n- v3.3.0은 MAJOR 2건에 집중. CRITICAL은 의도적 deferral — 별도 hook refactor task로 분리할 가치.\n- 모든 발견사항을 v3.3.0에 욱여넣지 않은 이유: minor release scope는 \"structural fix\"에 집중, hook 안전성은 별도 정밀 작업 필요.\n\n## 변경 파일\n\n이번 QA review의 fix는 두 release에 분산됨:\n- v3.2.2 (`fa17c45`): `scripts/bump-version.sh`\n- v3.3.0 (`ee1a4f9`): `lib/plugin-registry.js` + dependents\n\n## 테스트 & 검증\n\n- v3.2.2 bump-version.sh 정규식: v3.2.2 → v3.3.0 bump가 첫 실전 검증 (10/10 파일 자동 sync, stale detection 작동).\n- v3.3.0 source 구조: lens-upgrade Phase 5 verify에서 cache 새 install 시 새 구조로 정상 로드 확인.\n\n## 추가 사항\n\nCRITICAL 2건(#1, #2)은 다음 v3.4 또는 v3.3.1 patch에서 별도 task로 다시 열어 처리 권장. hook safety 단독 PR이 안전.\n","truncated":false,"stale":false,"branch":null,"base":null},{"id":"2026-05-14-v3.3.0-minor-release","folder":"history","title":"Lens v3.3.0 — minor release 완료","date":"2026-05-14","hasMd":true,"hasHtml":false,"mdPath":"history/2026-05-14-v3.3.0-minor-release.md","htmlPath":null,"mdInline":"# Lens v3.3.0 — minor release 완료\n\n**완료일**: 2026-05-14\n\n## 요약\n\n`lib/plugin-registry.js`의 `KNOWN_PLUGINS` source 필드를 string에서 typed object(`{type, repo}`)로 변경하고, 신규 `formatPluginSource()` helper를 export하는 minor release. 핵심 원인은 Claude Code plugin loader가 string source(`'ccplugins/awesome-claude-code-plugins'`)를 `/` 기준으로 split해 owner를 가짜 marketplace ID로 잘못 해석하던 패턴. 구조적 차단으로 해결.\n\n## 주요 결정 사항\n\n- **semver minor 선택**: `formatPluginSource()`가 string fallback을 포함해 backward compat 유지 → breaking 아님. patch가 아닌 minor가 정확.\n- **bump-version.sh 정규식 신뢰**: v3.2.2의 `fa17c45` commit에서 도입한 `v[0-9]+\\.[0-9]+\\.[0-9]+` 매칭이 첫 실전 작동. 10/10 파일 자동 sync 성공.\n- **master + tag 분리 push**: 옛 tag(v1.9.0, v2.0.0) conflict 회피를 위해 `git push origin master` 와 `git push origin v3.3.0` 분리 실행.\n- **CHANGELOG 직접 채움**: bump-version.sh가 prepend한 빈 template에 한국어로 Added/Changed/Fixed/Note 작성.\n\n## 변경 파일\n\n- `lib/plugin-registry.js` — `KNOWN_PLUGINS` source 구조 변경 + `formatPluginSource()` export\n- `hooks/session-start.js` — Plugin Discovery Registry 표가 `formatPluginSource(p.source)` 사용 + v3.3.0 banner\n- `.claude-plugin/plugin.json`, `.claude-plugin/marketplace.json` — version + ref bump\n- `hooks/hooks.json` — Lens v3.3.0 표기\n- `skills/c/SKILL.md`, `skills/cc/SKILL.md`, `skills/cp/SKILL.md` — 본문 버전\n- `CLAUDE.md` — Current 버전 + Updated 날짜\n- `README.md` — 제목 버전\n- `CHANGELOG.md` — v3.3.0 section 추가\n- `lib/hook-utils.js` — 신규 (commit에 포함)\n\n## 테스트 & 검증\n\n- `bash scripts/bump-version.sh 3.3.0` → 10/10 파일 갱신 + verification에서 stale v1.0.33 1건 발견(README의 외부 도구 표기, false positive)\n- `git push origin master` → `fa17c45..ee1a4f9` 정상\n- `git push origin v3.3.0` → `* [new tag] v3.3.0 -> v3.3.0` 정상\n- `bash scripts/upgrade.sh` (lens-upgrade) → Phase 5 verify에서 v3.3.0, scope=user, single entry 확인\n\n## 추가 사항\n\n- 향후 같은 lookup-fail 패턴이 재발 불가 — 구조적 차단.\n- 다음 정규식 bump 시 `v1.0.33` warning은 외부 도구 표기라 무시 가능. README의 진짜 lens 버전은 line 1 매칭으로 정확히 갱신됨.\n","truncated":false,"stale":false,"branch":null,"base":null},{"id":"2026-05-04-lens-v3.3-roadmap","folder":"history","title":"Lens v3.3 Roadmap — 부분 달성, 재정렬 필요","date":"2026-05-04","hasMd":true,"hasHtml":false,"mdPath":"history/2026-05-04-lens-v3.3-roadmap.md","htmlPath":null,"mdInline":"# Lens v3.3 Roadmap — 부분 달성, 재정렬 필요\n\n**완료일**: 2026-05-14\n\n## 요약\n\n5/4에 작성한 6-phase 야심찬 로드맵(Cost-aware Orchestrator). 실제로 release된 v3.3.0(`ee1a4f9`)은 로드맵 범위와 다른 방향 — **source-format fix + bump-version.sh hardening**이 핵심이고, 로드맵의 plan-drift/cost telemetry/prompt caching/`/cs` 강화/`/qa`·`/retro`·`/canary` 신규 스킬은 **모두 미착수**.\n\n## 로드맵 vs 실제 v3.3.0 비교\n\n| Phase | 로드맵 | v3.3.0 실제 |\n|-------|------|-----------|\n| 1. Plan-drift | ❌ 미착수 | — |\n| 2. Cost telemetry | ❌ 미착수 | — |\n| 3. Hook & caching | ❌ 미착수 | — |\n| 4. `/cs` 강화 | ❌ 미착수 | — |\n| 5. `/qa`·`/retro`·`/canary` 신규 | ❌ 미착수 | — |\n| 6. 릴리스 (CHANGELOG, 9곳 버전, dogfood, push) | ✅ 다른 내용으로 실행 | bump-version.sh + push + lens-upgrade 검증 완료 |\n\n## 주요 결정 사항\n\n- **로드맵 우선순위 재조정 필요**: 5/4 작성 후 2주 동안 실제 사용자 페인이 hook stability + plugin source format 쪽으로 드러남. 로드맵의 Phase 1-5는 가치 있지만 우선순위가 아님.\n- **v3.3.0 release scope 축소 채택**: 로드맵 따라가지 않고 실제 발생한 lookup-fail 패턴 + bump-version 버그 fix에 집중. 작은 release를 자주 내는 패턴이 더 안전.\n- **로드맵 carry-over**: 6 phase 모두 미착수 → v3.4 또는 v4.0 roadmap으로 이관 권장.\n\n## 변경 파일\n\n이번 history 자체. v3.3.0 release는 별도 history(`2026-05-14-v3.3.0-minor-release.md`)에 정리.\n\n## 테스트 & 검증\n\n해당 없음 — 로드맵 자체는 계획 문서.\n\n## 추가 사항\n\n### v3.4 또는 v4.0 후보 항목 (carry-over)\n\n- **plan-drift 방어**: `/cp` plan_id + `~/.claude/lens/plan-state.json` 영속화 + Supervisor 강제 게이트\n- **cost telemetry**: `lib/usage-meter.js` + `lib/pricing.js` + PostToolUse hook에서 worker별 토큰 누적\n- **prompt caching**: `/c`, `/cc` Leader 호출에서 system prompt를 ephemeral cache block으로 분리 (5분 TTL, 90% 할인)\n- **`/cs` 강화**: cost-cap, `--cost-preview`, status, AUTO_COMMIT_BLOCKLIST\n- **`/qa`, `/retro`, `/canary` 3종**: 커뮤니티 검증 패턴 흡수\n\n이 carry-over 5개는 v3.4 roadmap task로 새로 작성 권장. 이번 history 종결 시점에는 미착수 상태 명시로 충분.\n\n### lens-qa-review의 CRITICAL 2건과 통합 고려\n\nQA review에서 미해결 처리된 stdin blocking + fs try/catch 2건은 hook stability 영역. v3.4의 Phase 1(plan-drift)과 hook 변경이 겹치므로 묶어서 처리 가능.\n","truncated":false,"stale":false,"branch":null,"base":null},{"id":"2026-05-04-v3.2.0-cs-multi-repo-sync","folder":"history","title":"Lens v3.2.0 — `/cs` Multi-Repo Sync — 완료","date":"2026-05-04","hasMd":true,"hasHtml":false,"mdPath":"history/2026-05-04-v3.2.0-cs-multi-repo-sync.md","htmlPath":null,"mdInline":"# Lens v3.2.0 — `/cs` Multi-Repo Sync — 완료\n\n**완료일**: 2026-05-04\n**Release**: v3.2.0\n\n## 요약\n\n워크스페이스 하위 모든 git repo 를 일괄 동기화하는 신규 skill `/cs` 를 추가하고, SessionStart 마다 자동으로 incoming 변경을 pull 하는 hook 도 함께 등록했다. push 는 안전성 우선 정책으로 자동 실행하지 않고 사용자가 명시적으로 `/cs` 또는 `/cs push` 를 호출할 때만 발동한다. 사용자가 여러 기기 (Windows desktop, Mac mini, 노트북) 에서 같은 워크스페이스를 다루는 환경에서, 어느 기기에서든 lens 만 활성화하면 동일한 sync 동작을 받을 수 있게 됐다.\n\n## 주요 결정 사항\n\n- **Plugin 자체 등록 vs livevil-setting 의존**: lens self-contained 로 결정. `scripts/git-sync-all.sh` 를 lens 안에 두고, livevil-setting 의 같은 파일과 분리. 노트북에 livevil-setting clone 안 되어 있어도 lens 만 있으면 작동.\n- **자동 pull + 명시적 push (방식 C)**: SessionStart 에서 `git pull --ff-only` 자동 실행. Stop 에서 자동 push 는 하지 않음. push 가 자동으로 발동되면 미완성 코드도 올라갈 위험 있어 사용자가 의도적으로 호출하도록.\n- **opt-out 메커니즘**: `LENS_SYNC_AUTO_PULL=0` 환경변수로 SessionStart auto-pull 끔. plugin level 토글이 아니라 환경변수 — 더 가볍고 사용자별 cusotomization 가능.\n- **Cross-platform Bash 자동 감지**: Windows Git for Windows (`C:/Program Files/Git/bin/bash.exe`), msys64, WSL fallback. macOS/Linux `/bin/bash`. 사용자가 어느 노트북에서든 추가 설정 없이 작동.\n- **Fail-soft 처리**: 한 repo 실패가 나머지 진행을 막지 않음. Diverged repo 는 손대지 않고 `manual resolve required` 로만 보고. Auto-merge 시도 안 함 (안전).\n- **Auto-commit message 정형화**: `chore: auto-sync YYYY-MM-DD` 단일 라인. 매번 같은 패턴이라 git log 에서 식별 쉬움. Author 강제 (`livevil7 <livevil7@gmail.com>`).\n- **이전 PC 전용 setup 폐기**: 이전엔 `~/.claude/settings.json` 에 SessionStart/Stop bash hook 직접 박고 `~/.claude/commands/sync-all.md` 슬래시 커맨드 파일 두는 방식이었음. lens v3.2.0 통합 후 양쪽 다 제거 → marketplace 통한 단일 source of truth.\n\n## 변경 파일\n\n- `skills/cs/SKILL.md` (신규) — `/cs` 명령 정의: `pull` / `push` / `sync` 3 모드, Bash resolution, 사용 패턴, fail-soft 정책 명시\n- `scripts/git-sync-all.sh` (신규) — POSIX shell 스크립트. workspace 자동 감지, fetch → ff-pull → auto-commit → push 4 단계 파이프라인. 컬러 박스 리포트 출력\n- `hooks/sync-pull.js` (신규) — Node 기반 SessionStart hook. cross-platform Bash 자동 resolve, 90초 timeout, fail-soft (오류 발생해도 세션 시작 막지 않음)\n- `hooks/hooks.json` — SessionStart 배열에 sync-pull entry 추가 (once: true). 기존 session-start.js 와 별개 등록\n- `.claude-plugin/plugin.json` — version 3.1.0 → 3.2.0, description \"Skill navigator + multi-repo git sync\" 로 확장, keywords `git-sync` `multi-repo` `auto-pull` 추가\n- `.claude-plugin/marketplace.json` — version + ref + description + tags 동기화\n- `CHANGELOG.md` — v3.2.0 entry\n\n## 테스트 & 검증\n\n- 이전 PC custom hook ( `~/.claude/settings.json` SessionStart/Stop bash + `commands/sync-all.md`) 제거 후 lens 단일 source 로 전환 확인\n- Windows commit 170fe01 + tag v3.2.0 push 성공 (livevil7/creeta-lens master)\n- Marketplace fetch URL `CreetaCorp/lens` 가 같은 commit 가리킴 (GitHub redirect/alias)\n- `git-sync-all.sh sync` 직접 실행으로 19 repo 일괄 처리 확인 (T+0 시작 → T+5 완료, push 3 / pull 2 / unchanged 14)\n\n## 추가 사항\n\n- 다음 세션 재시작 시 marketplace 자동 fetch → `/cs` 슬래시 등록 + SessionStart auto-pull 활성. 노트북도 동일 (Claude Code 재시작 한 번이면 끝).\n- 향후 개선 후보: (1) `/cs` 가 dry-run 모드 지원, (2) auto-commit message 에 변경 파일 요약 포함, (3) GIT_ROOTS 외에 `.lens-sync.json` 같은 per-project 설정 파일.\n- 자동 push 가 필요한 사용자는 `~/.claude/settings.json` Stop hook 으로 `bash <plugin>/scripts/git-sync-all.sh push` 직접 등록 가능 (lens 표준은 아님, opt-in).\n","truncated":false,"stale":false,"branch":null,"base":null},{"id":"2026-04-23-v3.1.0-codex-premortem-skill-enforcement","folder":"history","title":"Lens v3.1.0 — Codex Pre-mortem + Skill Enforcement — 완료","date":"2026-04-23","hasMd":true,"hasHtml":false,"mdPath":"history/2026-04-23-v3.1.0-codex-premortem-skill-enforcement.md","htmlPath":null,"mdInline":"# Lens v3.1.0 — Codex Pre-mortem + Skill Enforcement — 완료\n\n**완료일**: 2026-04-23\n**Release**: v3.1.0\n\n## 요약\n\n`/cp` PLAN 모드에 Phase 2.5 Pre-mortem 단계를 추가해 Claude Opus + Codex GPT-5.2 병렬로 계획 문서의 리스크를 사전 분석하도록 했고, `/c` 와 `/cc` 의 Worker 프롬프트를 강화해 할당된 스킬을 반드시 호출하도록 강제하면서 Supervisor가 그 호출 여부를 감사하도록 만들었다.\n\n## 주요 결정 사항\n\n- **두 모델 병렬 pre-mortem**: 같은 모델로 자기 검증 시 동일 편향 공유 문제. Opus(세션 컨텍스트 기반) + Codex(독립 코드 분석)의 교차 검증으로 블라인드 스팟 해소.\n- **Codex 미설치 환경 fallback**: `command -v codex` 또는 VSCode 확장 경로 감지. 부재 시 \"Codex 미설치 — Opus 단독\" 명시 표기. 설치 강제 안 함.\n- **Supervisor 조건부 opus 승격**: Worker 할당에 `opus` 포함 시 Supervisor 도 자동 opus 승격. \"주니어가 시니어 코드 리뷰\" 역전 구조 해소. 단순 태스크는 sonnet 유지로 비용 절약.\n- **Skill Enforcement는 강제 명령문으로**: 기존 \"할당된 Skill (있는 경우)\" 참고 문구를 \"필수 실행 스킬 (SKIP 금지)\" 명령문으로 교체. 첫 액션 = `Skill invoke` 강제. 완료 보고 첫 줄 `Skill invoked: /{skill_name}` 필수.\n- **Supervisor 감사 조항**: Worker 보고에서 `Skill invoked:` 라인 누락 시 해당 서브태스크 점수 0점 + 재작업 지시. `general` 명시 태스크는 감사 제외.\n- **Phase 2/2.5 분리 Write**: Phase 2.5 실패해도 Phase 2 의 계획 문서는 이미 저장됨. 원자성 보장.\n\n## 변경 파일\n\n- `skills/cp/SKILL.md` — Phase 2.5 Pre-mortem 추가 (`## ⚠️ 사전 리스크` 섹션, Opus/Codex 병렬 호출, Blocker 판정)\n- `skills/c/SKILL.md` — Worker 프롬프트의 Skill Enforcement 강화, Supervisor opus 승격 + 감사 조항\n- `skills/cc/SKILL.md` — `/c` 와 동일 변경 (Worker + Supervisor)\n- `docs/rules/codex-integration.md` (신규) — Codex CLI 감지 로직, 인증 확인, 표준 호출 패턴(`codex exec --skip-git-repo-check`), 응답 파싱, pre-mortem 프롬프트 템플릿, 에러 처리\n- `.claude-plugin/plugin.json`, `marketplace.json` — version 3.0.0 → 3.1.0\n- `CHANGELOG.md` — v3.1.0 entry\n\n## 테스트 & 검증\n\n- `/cp` PLAN 모드 시연: 계획 저장 후 `## ⚠️ 사전 리스크` 섹션에 Opus + Codex 답변 양쪽 기록 확인\n- Codex 미설치 환경 fallback: Opus 단독 + 표기 동작 확인\n- `/c`, `/cc` Worker 보고 첫 줄 `Skill invoked:` 라인 검증 통과/실패 시나리오 양쪽 확인\n- Supervisor opus 자동 승격: Worker 할당에 opus 1개 이상 시 Supervisor sonnet → opus 승격 검증\n\n## 추가 사항\n\n- v3.2.0 에서 `/cs` (멀티 repo sync) 가 추가됨. v3.1.0 의 핵심 — Pre-mortem + Skill Enforcement — 는 그대로 유지.\n- Codex CLI 통합 패턴은 추후 다른 skill 에서도 활용 가능 (예: `/c` Worker 가 Codex 를 보조로 호출).\n","truncated":false,"stale":false,"branch":null,"base":null},{"id":"2026-04-11-all-projects-docs-organize","folder":"history","title":"전체 프로젝트 문서 정리 (docs/ 구조 표준화) — 완료","date":"2026-04-11","hasMd":true,"hasHtml":false,"mdPath":"history/2026-04-11-all-projects-docs-organize.md","htmlPath":null,"mdInline":"# 전체 프로젝트 문서 정리 (docs/ 구조 표준화) — 완료\n\n**완료일**: 2026-04-11\n**출시 버전**: v3.0.0 (commit e51b43e)\n\n## 요약\n10개 프로젝트에 docs/tasks, history, rules 구조를 적용하고 CLAUDE.md를 슬림화(핵심 + 포인터만)하는 표준화 작업. Change Log / Bug History는 git log로 대체하고, 배포/트러블슈팅/인프라 정보는 docs/rules/로 분리.\n\n## 주요 결정 사항\n- 각 프로젝트에 `docs/tasks/`, `docs/history/`, `docs/rules/` 3-폴더 구조 공 .md 텍스트 수정만)\r\n\r\n코드 변경 없이 프롬프트 개선만으로 효과를 볼 수 있는 항목.\r\n\r\n### Phase 1: 단기 코어 개선 (plan-manager.js + 새 파일)\r\n\r\n문서 생성의 핵심 엔진을 프로그래밍적으로 보장하는 코드 추가.\r\n\r\n### Phase 2: 중기 구조 변경 (템플릿 분리 + 새 문서 유형)\r\n\r\nPDCA 사이클 완성과 템플릿 외부화.\r\n\r\n> Phase 3(장기: 문서 체인 자동 연결, PDCA Cycle Index)는 이번 계획서 범위 밖.\r\n\r\n---\r\n\r\n## 4. 실행 계획\r\n\r\n### Task 1: `/cp` SKILL.md 품질 기준 강화 [Phase 0]\r\n\r\n**대상 파일**: `skills/cp/SKILL.md`\r\n\r\n**변경 내용**:\r\n\r\n1. 다국어 처리 규칙 명확화 (110행 부근)\r\n   - 현재: \"Keep both headers (English / Korean) as shown\"\r\n   - 변경: 3단계 우선순위 규칙 추가\r\n     ```\r\n     언어 결정 순서:\r\n     1. lens.config.json의 defaultPlanLanguage (설정값 있으면 최우선)\r\n     2. 사용자 메시지 언어 자동 감지\r\n     3. 폴백: English\r\n\r\n     헤더 형식: \"영어 / {감지된 언어}\" (예: Task / 要請事項)\r\n     YAML 키, 상태 enum은 항상 영어\r\n     ```\r\n\r\n2. 품질 기준(Self-Check) 추가\r\n   - Plan 필수 섹션 7개 중 1개라도 빠지면 생성 실패로 판단\r\n   - 구체성 기준: \"기능 구현\" (나쁨) vs \"UserService.login()에 rate limiting 추가\" (좋음)\r\n   - AI 셀프 체크리스트 6항목 추가\r\n\r\n3. 조건부 섹션 지시 추가\r\n   - Risks 섹션: 실질적 위험이 없는 단순 작업에서는 \"해당 없음\" 허용\r\n   - Prerequisites 섹션: 선행조건 없으면 생략 가능\r\n\r\n4. 합성 포맷 참조 통일\r\n   - Phase 6의 합성 지시를 `/cc`의 Synthesis 포맷 참조로 교체\r\n   - \"합성 결과는 /cc의 Synthesis 포맷(Points of Agreement, Conflicts, Next Steps)을 따른다\"\r\n\r\n**예상 변경량**: ~40줄 추가/수정\r\n\r\n---\r\n\r\n### Task 2: `generateSlug()` 유니코드 확장 [Phase 0]\r\n\r\n**대상 파일**: `lib/plan-manager.js` (66-85행)\r\n\r\n**변경 내용**:\r\n\r\n```javascript\r\n// 현재 (라틴 확장 문자 제거됨)\r\n.replace(/[^a-z0-9가-힣ぁ-んァ-ヶー一-龥\\s-]/g, '')\r\n\r\n// 변경 (모든 유니코드 Letter 허용)\r\n.replace(/[^\\p{L}\\p{N}\\s-]/gu, '')\r\n```\r\n\r\n**예상 변경량**: 1줄\r\n\r\n---\r\n\r\n### Task 3: plan-manager.js 문서 생성 엔진 확장 [Phase 1]\r\n\r\n**대상 파일**: `lib/plan-manager.js`\r\n\r\n**추가 함수 4개**:\r\n\r\n| 함수 | 역할 | 입력 → 출력 |\r\n|------|------|------------|\r\n| `generatePlanContent(planData)` | 템플릿 + 데이터 → 마크다운 문자열 | Object → String |\r\n| `parsePlanFrontmatter(filePath)` | 마크다운 → YAML frontmatter 객체 | String → Object |\r\n| `updatePlanStatus(filePath, newStatus)` | 상태 업데이트 (frontmatter + plan-state.json 동기화) | (String, String) → Boolean |\r\n| `validatePlanStructure(content)` | 필수 섹션 존재 여부 검증 | String → {valid, missing[]} |\r\n\r\n**YAML frontmatter 스키마**:\r\n```yaml\r\n---\r\nid: plan_m3g02d_7f2a\r\ntype: plan\r\nversion: 1\r\ncreated: 2026-03-02T13:13:00+09:00\r\nupdated: 2026-03-02T13:13:00+09:00\r\nstatus: draft\r\ngenerator: lens/plan\r\nlanguage: ko\r\nparent: null\r\nrefs: []\r\ntags: []\r\n---\r\n```\r\n\r\n**plan-state.json을 단일 원천(SSOT)으로 지정**:\r\n- frontmatter의 `status`는 파일 생성 시점의 스냅샷 (읽기 전용)\r\n- 상태 변경은 반드시 `updatePlanStatus()`를 통해 JSON → frontmatter 순서로 반영\r\n- 이중 원천 문제 해소\r\n\r\n**예상 변경량**: ~120줄 추가\r\n\r\n---\r\n\r\n### Task 4: `/cc` 합성 결과 파일 저장 [Phase 1]\r\n\r\n**대상 파일**: `skills/cc/SKILL.md`, `lens.config.json`\r\n\r\n**변경 내용**:\r\n\r\n1. `lens.config.json`에 옵션 추가:\r\n   ```json\r\n   \"saveSynthesisResults\": true,\r\n   \"resultsDir\": null\r\n   ```\r\n\r\n2. `/cc` SKILL.md Phase 6 이후에 저장 지시 추가:\r\n   ```\r\n   Phase 6.5: Save Results (선택적)\r\n   lens.config.json의 saveSynthesisResults가 true이면:\r\n   - .lens/results/synth-{YYYY-MM-DD}-{slug}.md에 합성 결과 저장\r\n   - YAML frontmatter 포함 (type: synthesis)\r\n   ```\r\n\r\n3. `.lens/results/` 디렉토리를 `session-start.js`에서 자동 생성\r\n\r\n**예상 변경량**: cc/SKILL.md ~20줄, config ~2줄, session-start.js ~3줄\r\n\r\n---\r\n\r\n### Task 5: 템플릿 외부 파일 분리 [Phase 2]\r\n\r\n**새로 생성할 파일**:\r\n\r\n```\r\nlens/\r\n└── templates/\r\n    ├── plan.template.md          # /cp 작업계획서 템플릿\r\n    ├── execution-result.template.md  # 실행 결과 템플릿\r\n    ├── synthesis.template.md     # /cc 합성 결과 템플릿\r\n    └── README.md                 # 템플릿 사용법 + 변수 목록\r\n```\r\n\r\n**변경할 파일**:\r\n- `skills/cp/SKILL.md`: 하드코딩된 템플릿 → \"templates/plan.template.md 참조\" 지시로 교체\r\n- `skills/cc/SKILL.md`: 합성 포맷 → \"templates/synthesis.template.md 참조\" 지시로 교체\r\n\r\n**템플릿 변수 규칙**:\r\n- `{variable_name}`: 단순 치환 (현행 유지)\r\n- `{variable_name|default:값}`: 기본값 지원 (Tier 2)\r\n- `{?section_name}...{/section_name}`: 조건부 섹션 (내용 있을 때만 렌더링)\r\n\r\n**예상 변경량**: 새 파일 4개, 기존 파일 2개 수정\r\n\r\n---\r\n\r\n### Task 6: DOCUMENTATION-GUIDE.md 정리 [Phase 0]\r\n\r\n**대상 파일**: `docs/DOCUMENTATION-GUIDE.md`\r\n\r\n**변경 내용**:\r\n- 섹션 9 \"현재 상태 진단\" (331-366행) 전체 삭제\r\n  - 이유: v1.5.0 시점 스냅샷이 남아 있어 규범 문서의 성격과 불일치\r\n  - 상태 추적은 GitHub Issues로 이동\r\n- 섹션 1.2 버전 참조 파일 목록에 `templates/` 디렉토리 추가\r\n\r\n**예상 변경량**: ~35줄 삭제, ~5줄 추가\r\n\r\n---\r\n\r\n### Task 7: 에러 핸들링 강화 [Phase 1]\r\n\r\n**대상 파일**: `lib/plan-manager.js`\r\n\r\n**변경 내용**:\r\n\r\n1. `savePlanState()`, `loadPlanState()`의 빈 catch 블록에 에러 로깅 추가:\r\n   ```javascript\r\n   // 현재\r\n   } catch { return false; }\r\n\r\n   // 변경\r\n   } catch (err) {\r\n     console.error(`[lens] plan-state save failed: ${err.message}`);\r\n     return { success: false, error: err.message };\r\n   }\r\n   ```\r\n\r\n2. `MAX_PLANS_RETAINED` 정리를 `createdAt` 기반 정렬로 변경:\r\n   ```javascript\r\n   // 현재: Object.keys() 순서 의존\r\n   // 변경: createdAt 타임스탬프 기준 정렬 후 삭제\r\n   ```\r\n\r\n**예상 변경량**: ~15줄 수정\r\n\r\n---\r\n\r\n## 5. 기대 결과\r\n\r\n- [ ] `/cp` 생성 문서에 YAML frontmatter가 포함되어 프로그래밍적 파싱 가능\r\n- [ ] `generateSlug()`가 프랑스어/독일어 등 라틴 확장 문자를 보존\r\n- [ ] `/cc` 합성 결과가 `.lens/results/`에 자동 저장 (설정 시)\r\n- [ ] Plan 문서에 품질 기준이 적용되어 필수 섹션 누락 방지\r\n- [ ] 템플릿이 SKILL.md에서 분리되어 독립적으로 수정 가능\r\n- [ ] DOCUMENTATION-GUIDE.md에서 오래된 진단 정보 제거\r\n\r\n**성공 기준**: 위 6개 항목 모두 달성 + 기존 `/c`, `/cc`, `/cp` 동작에 regression 없음\r\n\r\n---\r\n\r\n## 6. 위험 요소\r\n\r\n| # | Risk | 심각도 | 완화 방안 |\r\n|---|------|--------|----------|\r\n| 1 | SKILL.md 수정 후 LLM이 새 지시를 무시하거나 오해석 | H | 변경 후 실제 `/cp` 실행으로 검증 |\r\n| 2 | `plan-manager.js` 변경 시 기존 plan-state.json 호환성 깨짐 | M | 기존 스키마를 하위 호환으로 확장 (필드 추가만, 삭제 없음) |\r\n| 3 | 템플릿 분리 후 SKILL.md에서 참조 경로 오류 | M | 상대 경로 대신 `${PLUGIN_ROOT}/templates/` 사용 |\r\n\r\n---\r\n\r\n## 7. 실행 방식\r\n\r\n- **Mode**: Sequential (Task 1~7 순차 실행)\r\n- **실행 스킬 수**: 수동 코드 편집 (스킬 호출 불필요)\r\n- **예상 범위**: 중간 — 7개 Task, 약 200줄 코드 변경 + 4개 새 파일\r\n\r\n---\r\n\r\n## 실행 순서\r\n\r\n```\r\nPhase 0 (즉시)\r\n  Task 1: /cp SKILL.md 품질 기준 강화\r\n  Task 2: generateSlug() 유니코드 확장\r\n  Task 6: DOCUMENTATION-GUIDE.md 정리\r\n\r\nPhase 1 (단기)\r\n  Task 3: plan-manager.js 문서 생성 엔진 확장\r\n  Task 4: /cc 합성 결과 파일 저장\r\n  Task 7: 에러 핸들링 강화\r\n\r\nPhase 2 (중기)\r\n  Task 5: 템플릿 외부 파일 분리\r\n```\r\n\r\n---\r\n\r\n**Status**: Draft\r\n","truncated":false,"stale":false,"branch":null,"base":null},{"id":"2026-03-02-creet-plugin-analysis","folder":"history","title":"2026-03-02 Lens 플러그인 설치/버전관리 문제 분석 보고서","date":"2026-03-02","hasMd":true,"hasHtml":false,"mdPath":"history/2026-03-02-creet-plugin-analysis.md","htmlPath":null,"mdInline":"# 2026-03-02 Lens 플러그인 설치/버전관리 문제 분석 보고서\r\n\r\n## 1. 요약\r\n\r\nLens 플러그인(`lens@CreetaCorp`, v1.7.0)의 마켓플레이스 등록 구조를 Anthropic 공식 플러그인(`claude-plugins-official`) 및 bkit(`popup-studio-ai`)와 비교 분석한 결과, **3가지 구조적 문제**를 확인함.\r\n\r\n---\r\n\r\n## 2. 3개 마켓플레이스 비교\r\n\r\n### 2-1. known_marketplaces.json (마켓플레이스 등록 방식)\r\n\r\n| 항목 | Anthropic 공식 | bkit | Lens |\r\n|------|---------------|------|-------|\r\n| source 타입 | `\"github\"` | `\"github\"` | **`\"git\"`** |\r\n| 참조 방식 | `repo: \"anthropics/claude-plugins-official\"` | `repo: \"popup-studio-ai/bkit-claude-code\"` | **`url: \"...lens.git\"`** |\r\n| 자동 업데이트 | 기본 활성화 | 수동 | 수동 |\r\n\r\n**문제 #1**: Lens의 `\"source\": \"git\"`은 Claude Code 공식 스키마에 정의되지 않은 값.\r\n- 공식 유효 값: `\"github\"`, `\"url\"`, `\"npm\"`, `\"pip\"`\r\n- `\"git\"`이 실제로 동작하더라도 비공식이라 향후 업데이트에서 동작 보장 안됨\r\n- `\"github\"` 타입은 GitHub API를 사용해 최적화된 다운로드 (tarball), `\"url\"`은 `git clone` 사용\r\n\r\n```json\r\n// 현재 (비공식)\r\n\"CreetaCorp\": {\r\n  \"source\": {\r\n    \"source\": \"git\",\r\n    \"url\": \"https://github.com/CreetaCorp/lens.git\"\r\n  }\r\n}\r\n\r\n// 수정안 A: github 타입 (권장)\r\n\"CreetaCorp\": {\r\n  \"source\": {\r\n    \"source\": \"github\",\r\n    \"repo\": \"CreetaCorp/lens\"\r\n  }\r\n}\r\n\r\n// 수정안 B: url 타입 (공식이지만 차선)\r\n\"CreetaCorp\": {\r\n  \"source\": {\r\n    \"source\": \"url\",\r\n    \"url\": \"https://github.com/CreetaCorp/lens.git\"\r\n  }\r\n}\r\n```\r\n\r\n### 2-2. marketplace.json (플러그인 카탈로그 구조)\r\n\r\n| 항목 | Anthropic 공식 | bkit | Lens |\r\n|------|---------------|------|-------|\r\n| 마켓 repo | `anthropics/claude-plugins-official` | `popup-studio-ai/bkit-claude-code` | `CreetaCorp/lens` |\r\n| 플러그인 참조 | `\"./plugins/commit-commands\"` (상대경로) | `{ source: \"url\", url: \"...bkit-claude-code.git\" }` | `{ source: \"url\", url: \"...lens.git\" }` |\r\n| 마켓=플러그인 동일? | 아니오 (카탈로그 repo ≠ 플러그인 코드) | **부분적** (bkit 마켓 repo = bkit 플러그인 repo) | **완전 동일** |\r\n| 플러그인 수 | 30+ | 2 (bkit, bkit-starter) | 1 (lens) |\r\n\r\n**문제 #2**: Lens의 마켓플레이스 repo와 플러그인 repo가 완전히 동일한 repo.\r\n\r\n이게 문제인 이유:\r\n- 마켓플레이스 = 카탈로그 (어떤 플러그인들이 있는지 목록)\r\n- 플러그인 = 실제 코드 (skills, hooks 등)\r\n- 동일 repo면: marketplace.json이 **자기 자신을 가리킴** → 순환 참조\r\n\r\n```\r\nLens 현재:\r\n  CreetaCorp/lens (repo)\r\n    ├── .claude-plugin/marketplace.json  → \"lens\" plugin source: lens.git (자기 자신)\r\n    ├── skills/c/SKILL.md\r\n    ├── skills/cc/SKILL.md\r\n    └── skills/cp/SKILL.md\r\n\r\nAnthropic 공식 패턴:\r\n  anthropics/claude-plugins-official (카탈로그 repo)\r\n    ├── .claude-plugin/marketplace.json  → 각 플러그인을 \"./plugins/...\" 상대경로로 참조\r\n    ├── plugins/commit-commands/          → 플러그인 A\r\n    ├── plugins/code-review/              → 플러그인 B\r\n    └── external_plugins/playwright/      → 외부 플러그인 C\r\n\r\nbkit 패턴:\r\n  popup-studio-ai/bkit-claude-code (카탈로그 repo)\r\n    ├── .claude-plugin/marketplace.json  → bkit, bkit-starter 각각 별도 URL로 참조\r\n    (bkit 플러그인 코드도 같은 repo에 있지만, marketplace.json에서 url로 참조)\r\n```\r\n\r\n참고: bkit도 마켓 repo = 플러그인 repo이지만, 플러그인이 2개이고 별도 URL 참조를 사용. Lens은 1개 플러그인만 있으면서 자기 자신을 URL로 참조.\r\n\r\n실제 Anthropic 공식은 **외부 플러그인**도 `source: \"url\"` 방식을 사용함:\r\n```json\r\n// Sentry (외부, 별도 repo)\r\n{ \"source\": { \"source\": \"url\", \"url\": \"https://github.com/getsentry/sentry-for-claude.git\" } }\r\n\r\n// commit-commands (내부, 같은 repo)\r\n{ \"source\": \"./plugins/commit-commands\" }\r\n```\r\n\r\n→ Lens이 자체 호스팅이면 `\"url\"` 방식은 **유효**함. 다만 마켓=플러그인이 동일 repo인 것 자체가 구조적으로 깔끔하지 않음.\r\n\r\n### 2-3. 버전 관리\r\n\r\n| 항목 | Anthropic 공식 | bkit | Lens |\r\n|------|---------------|------|-------|\r\n| marketplace.json 버전 | 없음 (카탈로그) | `\"1.5.3\"` | 없음 |\r\n| plugin.json 버전 | 없거나 `\"1.0.0\"` | `\"1.5.3\"` | `\"1.7.0\"` |\r\n| installed_plugins.json 버전 | commit SHA (`55b58ec6e564`) | `\"1.5.3\"` | `\"1.7.0\"` |\r\n| ref 필드 (버전 고정) | 없음 (HEAD 사용) | 없음 | 없음 |\r\n| sha 필드 (커밋 고정) | 없음 | 없음 | 없음 |\r\n\r\n**문제 #3**: 버전 핀 없이 항상 기본 브랜치 HEAD를 가져옴.\r\n\r\n- `ref` 미지정 → `git clone`이 기본 브랜치 HEAD를 가져옴\r\n- 개발 중인 불안정 코드가 바로 사용자에게 배포될 수 있음\r\n- 정식 릴리스 프로세스가 없음\r\n\r\n이건 사실 bkit, Anthropic 공식도 마찬가지:\r\n- Anthropic 공식은 commit SHA만 기록 (`\"55b58ec6e564\"`)\r\n- bkit은 semver 사용하지만 `ref`는 미지정\r\n\r\n→ Lens만의 고유 문제는 아니지만, 안정성 향상을 위해 `ref: \"v1.7.0\"` 추가를 권장.\r\n\r\n---\r\n\r\n## 3. 실제 영향\r\n\r\n### 문제 #1 (`source: \"git\"`) 의 영향\r\n\r\n| 영향 | 설명 |\r\n|------|------|\r\n| 설치 불안정 | `\"git\"` 타입이 Claude Code 내부에서 어떻게 처리되는지 미정의. 동작할 수도 있고 특정 버전에서 실패할 수도 있음 |\r\n| 자동 업데이트 실패 가능 | `claude plugins update` 시 `\"git\"` 타입을 인식 못할 수 있음 |\r\n| 향후 호환성 | Claude Code 업데이트 시 비공식 소스 타입이 차단될 수 있음 |\r\n\r\n### 문제 #2 (자기 참조 구조) 의 영향\r\n\r\n| 영향 | 설명 |\r\n|------|------|\r\n| 확장성 | 플러그인을 추가하려면 repo 자체를 마켓플레이스처럼 관리해야 함 |\r\n| 캐시 중복 | 마켓플레이스 캐시(marketplaces/)와 플러그인 캐시(cache/)에 같은 코드가 2벌 존재 |\r\n| 업데이트 혼란 | 마켓플레이스 업데이트 = 플러그인 업데이트가 동시에 발생 |\r\n\r\n### 문제 #3 (버전 핀 없음) 의 영향\r\n\r\n| 영향 | 설명 |\r\n|------|------|\r\n| 불안정 배포 | 개발 중인 코드가 사용자에게 바로 적용 |\r\n| 롤백 불가 | 이전 안정 버전으로 돌아갈 방법 없음 |\r\n| 재현 불가 | 같은 \"1.7.0\"이라도 시점에 따라 다른 코드 |\r\n\r\n---\r\n\r\n## 4. 수정 권장사항\r\n\r\n### 즉시 수정 가능 (사용자 측)\r\n\r\n**known_marketplaces.json의 source 타입 변경:**\r\n\r\n```json\r\n// 변경 전\r\n\"CreetaCorp\": {\r\n  \"source\": {\r\n    \"source\": \"git\",\r\n    \"url\": \"https://github.com/CreetaCorp/lens.git\"\r\n  }\r\n}\r\n\r\n// 변경 후\r\n\"CreetaCorp\": {\r\n  \"source\": {\r\n    \"source\": \"github\",\r\n    \"repo\": \"CreetaCorp/lens\"\r\n  }\r\n}\r\n```\r\n\r\n이것만으로도 설치/업데이트 안정성이 개선됨.\r\n\r\n### Creeta 팀에 요청해야 하는 사항\r\n\r\n| # | 수정 | 우선순위 | 이유 |\r\n|---|------|----------|------|\r\n| 1 | marketplace.json의 plugin source를 상대 경로(`\"./\"`)로 변경 | 높음 | 자기 참조 해소 |\r\n| 2 | 릴리스 시 Git 태그 생성 + marketplace.json에 `ref` 추가 | 중간 | 안정 버전 핀 |\r\n| 3 | Anthropic 공식 마켓플레이스에 제출 | 낮음 | 자동 업데이트, 신뢰성 |\r\n\r\n**marketplace.json 수정 예시 (Creeta 팀):**\r\n\r\n```json\r\n{\r\n  \"plugins\": [\r\n    {\r\n      \"name\": \"lens\",\r\n      \"source\": \"./\",\r\n      \"version\": \"1.7.0\"\r\n    }\r\n  ]\r\n}\r\n```\r\n\r\n이렇게 하면 마켓플레이스 repo = 플러그인 repo인 구조에서도 상대 경로로 자신을 참조하여 깔끔해짐. Anthropic 공식 패턴(`\"./plugins/...\"`)과 동일한 방식.\r\n\r\n---\r\n\r\n## 5. 현재 동작하는 이유\r\n\r\n`\"source\": \"git\"`이 비공식임에도 현재 동작하는 이유:\r\n- Claude Code 내부에서 `\"git\"`과 `\"url\"` 타입을 동일하게 `git clone`으로 처리할 가능성이 높음\r\n- 하지만 이건 우연히 동작하는 것이지 보장된 동작이 아님\r\n\r\n---\r\n\r\n작성일: 2026-03-02\r\n작성자: Claude (livevil7 요청)\r\n","truncated":false,"stale":false,"branch":null,"base":null},{"id":"2026-03-02-plugin-완성도-강화","folder":"history","title":"Work Plan / 작업계획서","date":"2026-03-02","hasMd":true,"hasHtml":false,"mdPath":"history/2026-03-02-plugin-완성도-강화.md","htmlPath":null,"mdInline":"# Work Plan / 작업계획서\r\n\r\n> Generated by Creet Plan on 2026-03-02 16:30\r\n> Plan ID: plan_creet_release_v171\r\n\r\n---\r\n\r\n## Task / 요청사항\r\n\r\ncreet 플러그인이 제대로 설치가 안되고, 버전관리도 제대로 안되고, 마켓플레이스 등록도 안 되어 있음. 완성도 있는 플러그인으로 제대로 만들기.\r\n\r\n## 현재 상태 진단 / Diagnosis\r\n\r\n### 버전관리 (CRITICAL)\r\n\r\n| 항목 | 현재 | 문제 |\r\n|------|------|------|\r\n| Git 태그 (remote) | v1.3.0만 존재 | v1.4.0~v1.7.0 태그 push 안됨 |\r\n| GitHub Releases | v1.3.0만 존재 | v1.4.0~v1.7.0 릴리스 생성 안됨 |\r\n| 미push 커밋 | 3개 (fix 2 + feat 1) | origin/master보다 3개 앞서 있음 |\r\n| 미push 로컬 태그 | v1.4.0, v1.5.0, v1.6.0, v1.7.0 | push 필요 |\r\n| 현재 코드 버전 | v1.7.0 (plugin.json) | 3개 fix 커밋이 v1.7.0 이후 → v1.7.1 필요 |\r\n\r\n### 마켓플레이스 (CRITICAL)\r\n\r\n| 항목 | 현재 | 문제 |\r\n|------|------|------|\r\n| Anthropic 공식 등록 | 미등록 | claude-plugins-official에 미제출 |\r\n| marketplace.json source | `{\"source\": \"url\", \"url\": \"...\"}` | 형식은 OK, 하지만 `metadata` 누락 |\r\n| 커뮤니티 등록 | 미등록 | awesome-claude-code-plugins 등 미제출 |\r\n\r\n### plugin.json (WARNING)\r\n\r\n| 항목 | 현재 | 문제 |\r\n|------|------|------|\r\n| homepage | 없음 | 공식 URL 없음 |\r\n| skills 필드 | 없음 | 자동감지에 의존 (명시적 선언 권장) |\r\n| hooks 필드 | 없음 | 자동감지에 의존 |\r\n\r\n### GitHub 레포 (WARNING)\r\n\r\n| 항목 | 현재 | 문제 |\r\n|------|------|------|\r\n| Topics | 없음 | 검색 불가 |\r\n| Homepage | 없음 | 설정 안됨 |\r\n| Stars | 0 | 노출 부족 |\r\n| Description | OK | 현재 `/c`만 언급, `/cp` 미반영 |\r\n\r\n---\r\n\r\n## Execution Plan / 실행 계획\r\n\r\n### Step 1: 버전 정리 + Push\r\n\r\n**목표**: 모든 코드, 태그, 릴리스를 원격에 동기화\r\n\r\n1. 현재 3개 fix 커밋을 v1.7.1로 버전 범프\r\n   - `plugin.json`: 1.7.0 → 1.7.1\r\n   - `marketplace.json`: 1.7.0 → 1.7.1\r\n   - `hooks.json` description: v1.7.0 → v1.7.1\r\n   - CHANGELOG.md: v1.7.1 섹션 추가\r\n2. 커밋: `chore: bump version to v1.7.1`\r\n3. 태그: `v1.7.1`\r\n4. Push: 모든 커밋 + 모든 태그\r\n   ```bash\r\n   git push origin master --tags\r\n   ```\r\n5. GitHub Releases 생성 (v1.4.0 ~ v1.7.1, 총 4개)\r\n   - v1.4.0: /cc 멀티 에이전트\r\n   - v1.5.0: 크로스 플랫폼\r\n   - v1.6.0: 에이전트 대시보드 + 훅 시스템\r\n   - v1.7.0: /cp 플랜 실행\r\n   - v1.7.1: 품질 개선 (검증 이슈 수정, 8개 언어, YAML 파서)\r\n\r\n### Step 2: plugin.json + marketplace.json 강화\r\n\r\n**목표**: Claude Code가 올바르게 파싱할 수 있는 완전한 매니페스트\r\n\r\n**plugin.json 추가 필드**:\r\n```json\r\n{\r\n  \"homepage\": \"https://github.com/Creeta-creet/creet\",\r\n  \"skills\": \"./skills/\",\r\n  \"hooks\": \"./hooks/hooks.json\"\r\n}\r\n```\r\n\r\n**marketplace.json 보강**:\r\n```json\r\n{\r\n  \"metadata\": {\r\n    \"description\": \"Creet plugin marketplace\",\r\n    \"version\": \"1.0.0\"\r\n  },\r\n  \"plugins\": [{\r\n    \"source\": {\r\n      \"source\": \"github\",\r\n      \"repo\": \"Creeta-creet/creet\"\r\n    },\r\n    \"category\": \"productivity\",\r\n    \"tags\": [\"skill-navigator\", \"meta-skill\", \"multilingual\", \"plan-first\"]\r\n  }]\r\n}\r\n```\r\n\r\n### Step 3: GitHub 레포 메타데이터\r\n\r\n**목표**: 검색엔진과 GitHub에서 발견 가능하게\r\n\r\n```bash\r\n# Topics 설정\r\ngh repo edit --add-topic claude-code,claude-code-plugin,skill-navigator,productivity,multilingual\r\n\r\n# Description 업데이트\r\ngh repo edit --description \"Skill navigator for Claude Code. Scans all plugins, recommends the best match, and executes — single (/c), parallel (/cc), or plan-first (/cp).\"\r\n\r\n# Homepage 설정\r\ngh repo edit --homepage \"https://github.com/Creeta-creet/creet\"\r\n```\r\n\r\n### Step 4: 공식 등록 가이드\r\n\r\n**목표**: Anthropic 공식 디렉토리 + 커뮤니티 등록\r\n\r\n1. **Anthropic 공식**: `claude-plugins-official` 레포에 PR 제출\r\n   - `external_plugins/` 디렉토리에 creet 엔트리 추가\r\n   - 또는 https://claude.com/plugins 제출 페이지 이용\r\n2. **커뮤니티 awesome list**: `ccplugins/awesome-claude-code-plugins`에 PR\r\n3. **hesreallyhim/awesome-claude-code**: 가장 큰 커뮤니티 목록에 PR\r\n\r\n### Step 5: 버전관리 워크플로우 문서화\r\n\r\n**목표**: 다음부터 수동 실수 방지\r\n\r\nCLAUDE.md에 릴리스 체크리스트 섹션 추가:\r\n```\r\n## Release Checklist\r\n1. 코드 변경 완료 + 커밋\r\n2. 버전 범프 (plugin.json, marketplace.json, hooks.json)\r\n3. CHANGELOG.md 업데이트\r\n4. 커밋: chore: bump version to vX.Y.Z\r\n5. 태그: git tag vX.Y.Z\r\n6. Push: git push origin master --tags\r\n7. GitHub Release: gh release create vX.Y.Z --notes-file CHANGELOG_EXCERPT.md\r\n```\r\n\r\n---\r\n\r\n## Expected Outcomes / 기대 결과\r\n\r\n- [ ] 원격 레포에 v1.3.0~v1.7.1 전체 태그 + 릴리스 존재\r\n- [ ] plugin.json, marketplace.json이 공식 스키마 준수\r\n- [ ] GitHub Topics + Description으로 검색 가능\r\n- [ ] 릴리스 체크리스트가 CLAUDE.md에 문서화\r\n- [ ] Anthropic 공식 디렉토리 제출 준비 완료\r\n\r\n## Risks / 위험 요소\r\n\r\n- GitHub Release 생성 시 이미 지난 커밋에 대한 릴리스이므로 날짜 불일치 가능 → release body에 원래 날짜 명시\r\n- Anthropic 공식 등록은 심사가 있으므로 거절될 수 있음 → 커뮤니티 등록 병행\r\n- marketplace.json source를 github 형식으로 변경하면 기존 설치에 영향 가능 → 하위호환 유지\r\n\r\n## Execution Mode / 실행 방식\r\n\r\n- **Mode**: Sequential (step 1→2→3→4→5)\r\n- **Steps**: 5\r\n- **Estimated scope**: Medium (파일 수정 6개 + git ops + GitHub API)\r\n\r\n---\r\n\r\n**Status**: Draft\r\n","truncated":false,"stale":false,"branch":null,"base":nul
