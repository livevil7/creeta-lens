항상 영어\r\n     ```\r\n\r\n2. 품질 기준(Self-Check) 추가\r\n   - Plan 필수 섹션 7개 중 1개라도 빠지면 생성 실패로 판단\r\n   - 구체성 기준: \"기능 구현\" (나쁨) vs \"UserService.login()에 rate limiting 추가\" (좋음)\r\n   - AI 셀프 체크리스트 6항목 추가\r\n\r\n3. 조건부 섹션 지시 추가\r\n   - Risks 섹션: 실질적 위험이 없는 단순 작업에서는 \"해당 없음\" 허용\r\n   - Prerequisites 섹션: 선행조건 없으면 생략 가능\r\n\r\n4. 합성 포맷 참조 통일\r\n   - Phase 6의 합성 지시를 `/cc`의 Synthesis 포맷 참조로 교체\r\n   - \"합성 결과는 /cc의 Synthesis 포맷(Points of Agreement, Conflicts, Next Steps)을 따른다\"\r\n\r\n**예상 변경량**: ~40줄 추가/수정\r\n\r\n---\r\n\r\n### Task 2: `generateSlug()` 유니코드 확장 [Phase 0]\r\n\r\n**대상 파일**: `lib/plan-manager.js` (66-85행)\r\n\r\n**변경 내용**:\r\n\r\n```javascript\r\n// 현재 (라틴 확장 문자 제거됨)\r\n.replace(/[^a-z0-9가-힣ぁ-んァ-ヶー一-龥\\s-]/g, '')\r\n\r\n// 변경 (모든 유니코드 Letter 허용)\r\n.replace(/[^\\p{L}\\p{N}\\s-]/gu, '')\r\n```\r\n\r\n**예상 변경량**: 1줄\r\n\r\n---\r\n\r\n### Task 3: plan-manager.js 문서 생성 엔진 확장 [Phase 1]\r\n\r\n**대상 파일**: `lib/plan-manager.js`\r\n\r\n**추가 함수 4개**:\r\n\r\n| 함수 | 역할 | 입력 → 출력 |\r\n|------|------|------------|\r\n| `generatePlanContent(planData)` | 템플릿 + 데이터 → 마크다운 문자열 | Object → String |\r\n| `parsePlanFrontmatter(filePath)` | 마크다운 → YAML frontmatter 객체 | String → Object |\r\n| `updatePlanStatus(filePath, newStatus)` | 상태 업데이트 (frontmatter + plan-state.json 동기화) | (String, String) → Boolean |\r\n| `validatePlanStructure(content)` | 필수 섹션 존재 여부 검증 | String → {valid, missing[]} |\r\n\r\n**YAML frontmatter 스키마**:\r\n```yaml\r\n---\r\nid: plan_m3g02d_7f2a\r\ntype: plan\r\nversion: 1\r\ncreated: 2026-03-02T13:13:00+09:00\r\nupdated: 2026-03-02T13:13:00+09:00\r\nstatus: draft\r\ngenerator: lens/plan\r\nlanguage: ko\r\nparent: null\r\nrefs: []\r\ntags: []\r\n---\r\n```\r\n\r\n**plan-state.json을 단일 원천(SSOT)으로 지정**:\r\n- frontmatter의 `status`는 파일 생성 시점의 스냅샷 (읽기 전용)\r\n- 상태 변경은 반드시 `updatePlanStatus()`를 통해 JSON → frontmatter 순서로 반영\r\n- 이중 원천 문제 해소\r\n\r\n**예상 변경량**: ~120줄 추가\r\n\r\n---\r\n\r\n### Task 4: `/cc` 합성 결과 파일 저장 [Phase 1]\r\n\r\n**대상 파일**: `skills/cc/SKILL.md`, `lens.config.json`\r\n\r\n**변경 내용**:\r\n\r\n1. `lens.config.json`에 옵션 추가:\r\n   ```json\r\n   \"saveSynthesisResults\": true,\r\n   \"resultsDir\": null\r\n   ```\r\n\r\n2. `/cc` SKILL.md Phase 6 이후에 저장 지시 추가:\r\n   ```\r\n   Phase 6.5: Save Results (선택적)\r\n   lens.config.json의 saveSynthesisResults가 true이면:\r\n   - .lens/results/synth-{YYYY-MM-DD}-{slug}.md에 합성 결과 저장\r\n   - YAML frontmatter 포함 (type: synthesis)\r\n   ```\r\n\r\n3. `.lens/results/` 디렉토리를 `session-start.js`에서 자동 생성\r\n\r\n**예상 변경량**: cc/SKILL.md ~20줄, config ~2줄, session-start.js ~3줄\r\n\r\n---\r\n\r\n### Task 5: 템플릿 외부 파일 분리 [Phase 2]\r\n\r\n**새로 생성할 파일**:\r\n\r\n```\r\nlens/\r\n└── templates/\r\n    ├── plan.template.md          # /cp 작업계획서 템플릿\r\n    ├── execution-result.template.md  # 실행 결과 템플릿\r\n    ├── synthesis.template.md     # /cc 합성 결과 템플릿\r\n    └── README.md                 # 템플릿 사용법 + 변수 목록\r\n```\r\n\r\n**변경할 파일**:\r\n- `skills/cp/SKILL.md`: 하드코딩된 템플릿 → \"templates/plan.template.md 참조\" 지시로 교체\r\n- `skills/cc/SKILL.md`: 합성 포맷 → \"templates/synthesis.template.md 참조\" 지시로 교체\r\n\r\n**템플릿 변수 규칙**:\r\n- `{variable_name}`: 단순 치환 (현행 유지)\r\n- `{variable_name|default:값}`: 기본값 지원 (Tier 2)\r\n- `{?section_name}...{/section_name}`: 조건부 섹션 (내용 있을 때만 렌더링)\r\n\r\n**예상 변경량**: 새 파일 4개, 기존 파일 2개 수정\r\n\r\n---\r\n\r\n### Task 6: DOCUMENTATION-GUIDE.md 정리 [Phase 0]\r\n\r\n**대상 파일**: `docs/DOCUMENTATION-GUIDE.md`\r\n\r\n**변경 내용**:\r\n- 섹션 9 \"현재 상태 진단\" (331-366행) 전체 삭제\r\n  - 이유: v1.5.0 시점 스냅샷이 남아 있어 규범 문서의 성격과 불일치\r\n  - 상태 추적은 GitHub Issues로 이동\r\n- 섹션 1.2 버전 참조 파일 목록에 `templates/` 디렉토리 추가\r\n\r\n**예상 변경량**: ~35줄 삭제, ~5줄 추가\r\n\r\n---\r\n\r\n### Task 7: 에러 핸들링 강화 [Phase 1]\r\n\r\n**대상 파일**: `lib/plan-manager.js`\r\n\r\n**변경 내용**:\r\n\r\n1. `savePlanState()`, `loadPlanState()`의 빈 catch 블록에 에러 로깅 추가:\r\n   ```javascript\r\n   // 현재\r\n   } catch { return false; }\r\n\r\n   // 변경\r\n   } catch (err) {\r\n     console.error(`[lens] plan-state save failed: ${err.message}`);\r\n     return { success: false, error: err.message };\r\n   }\r\n   ```\r\n\r\n2. `MAX_PLANS_RETAINED` 정리를 `createdAt` 기반 정렬로 변경:\r\n   ```javascript\r\n   // 현재: Object.keys() 순서 의존\r\n   // 변경: createdAt 타임스탬프 기준 정렬 후 삭제\r\n   ```\r\n\r\n**예상 변경량**: ~15줄 수정\r\n\r\n---\r\n\r\n## 5. 기대 결과\r\n\r\n- [ ] `/cp` 생성 문서에 YAML frontmatter가 포함되어 프로그래밍적 파싱 가능\r\n- [ ] `generateSlug()`가 프랑스어/독일어 등 라틴 확장 문자를 보존\r\n- [ ] `/cc` 합성 결과가 `.lens/results/`에 자동 저장 (설정 시)\r\n- [ ] Plan 문서에 품질 기준이 적용되어 필수 섹션 누락 방지\r\n- [ ] 템플릿이 SKILL.md에서 분리되어 독립적으로 수정 가능\r\n- [ ] DOCUMENTATION-GUIDE.md에서 오래된 진단 정보 제거\r\n\r\n**성공 기준**: 위 6개 항목 모두 달성 + 기존 `/c`, `/cc`, `/cp` 동작에 regression 없음\r\n\r\n---\r\n\r\n## 6. 위험 요소\r\n\r\n| # | Risk | 심각도 | 완화 방안 |\r\n|---|------|--------|----------|\r\n| 1 | SKILL.md 수정 후 LLM이 새 지시를 무시하거나 오해석 | H | 변경 후 실제 `/cp` 실행으로 검증 |\r\n| 2 | `plan-manager.js` 변경 시 기존 plan-state.json 호환성 깨짐 | M | 기존 스키마를 하위 호환으로 확장 (필드 추가만, 삭제 없음) |\r\n| 3 | 템플릿 분리 후 SKILL.md에서 참조 경로 오류 | M | 상대 경로 대신 `${PLUGIN_ROOT}/templates/` 사용 |\r\n\r\n---\r\n\r\n## 7. 실행 방식\r\n\r\n- **Mode**: Sequential (Task 1~7 순차 실행)\r\n- **실행 스킬 수**: 수동 코드 편집 (스킬 호출 불필요)\r\n- **예상 범위**: 중간 — 7개 Task, 약 200줄 코드 변경 + 4개 새 파일\r\n\r\n---\r\n\r\n## 실행 순서\r\n\r\n```\r\nPhase 0 (즉시)\r\n  Task 1: /cp SKILL.md 품질 기준 강화\r\n  Task 2: generateSlug() 유니코드 확장\r\n  Task 6: DOCUMENTATION-GUIDE.md 정리\r\n\r\nPhase 1 (단기)\r\n  Task 3: plan-manager.js 문서 생성 엔진 확장\r\n  Task 4: /cc 합성 결과 파일 저장\r\n  Task 7: 에러 핸들링 강화\r\n\r\nPhase 2 (중기)\r\n  Task 5: 템플릿 외부 파일 분리\r\n```\r\n\r\n---\r\n\r\n**Status**: Draft\r\n","truncated":false,"stale":false},{"id":"2026-03-02-creet-plugin-analysis","folder":"history","title":"2026-03-02 Lens 플러그인 설치/버전관리 문제 분석 보고서","date":"2026-03-02","hasMd":true,"hasHtml":false,"mdPath":"history/2026-03-02-creet-plugin-analysis.md","htmlPath":null,"mdInline":"# 2026-03-02 Lens 플러그인 설치/버전관리 문제 분석 보고서\r\n\r\n## 1. 요약\r\n\r\nLens 플러그인(`lens@CreetaCorp`, v1.7.0)의 마켓플레이스 등록 구조를 Anthropic 공식 플러그인(`claude-plugins-official`) 및 bkit(`popup-studio-ai`)와 비교 분석한 결과, **3가지 구조적 문제**를 확인함.\r\n\r\n---\r\n\r\n## 2. 3개 마켓플레이스 비교\r\n\r\n### 2-1. known_marketplaces.json (마켓플레이스 등록 방식)\r\n\r\n| 항목 | Anthropic 공식 | bkit | Lens |\r\n|------|---------------|------|-------|\r\n| source 타입 | `\"github\"` | `\"github\"` | **`\"git\"`** |\r\n| 참조 방식 | `repo: \"anthropics/claude-plugins-official\"` | `repo: \"popup-studio-ai/bkit-claude-code\"` | **`url: \"...lens.git\"`** |\r\n| 자동 업데이트 | 기본 활성화 | 수동 | 수동 |\r\n\r\n**문제 #1**: Lens의 `\"source\": \"git\"`은 Claude Code 공식 스키마에 정의되지 않은 값.\r\n- 공식 유효 값: `\"github\"`, `\"url\"`, `\"npm\"`, `\"pip\"`\r\n- `\"git\"`이 실제로 동작하더라도 비공식이라 향후 업데이트에서 동작 보장 안됨\r\n- `\"github\"` 타입은 GitHub API를 사용해 최적화된 다운로드 (tarball), `\"url\"`은 `git clone` 사용\r\n\r\n```json\r\n// 현재 (비공식)\r\n\"CreetaCorp\": {\r\n  \"source\": {\r\n    \"source\": \"git\",\r\n    \"url\": \"https://github.com/CreetaCorp/lens.git\"\r\n  }\r\n}\r\n\r\n// 수정안 A: github 타입 (권장)\r\n\"CreetaCorp\": {\r\n  \"source\": {\r\n    \"source\": \"github\",\r\n    \"repo\": \"CreetaCorp/lens\"\r\n  }\r\n}\r\n\r\n// 수정안 B: url 타입 (공식이지만 차선)\r\n\"CreetaCorp\": {\r\n  \"source\": {\r\n    \"source\": \"url\",\r\n    \"url\": \"https://github.com/CreetaCorp/lens.git\"\r\n  }\r\n}\r\n```\r\n\r\n### 2-2. marketplace.json (플러그인 카탈로그 구조)\r\n\r\n| 항목 | Anthropic 공식 | bkit | Lens |\r\n|------|---------------|------|-------|\r\n| 마켓 repo | `anthropics/claude-plugins-official` | `popup-studio-ai/bkit-claude-code` | `CreetaCorp/lens` |\r\n| 플러그인 참조 | `\"./plugins/commit-commands\"` (상대경로) | `{ source: \"url\", url: \"...bkit-claude-code.git\" }` | `{ source: \"url\", url: \"...lens.git\" }` |\r\n| 마켓=플러그인 동일? | 아니오 (카탈로그 repo ≠ 플러그인 코드) | **부분적** (bkit 마켓 repo = bkit 플러그인 repo) | **완전 동일** |\r\n| 플러그인 수 | 30+ | 2 (bkit, bkit-starter) | 1 (lens) |\r\n\r\n**문제 #2**: Lens의 마켓플레이스 repo와 플러그인 repo가 완전히 동일한 repo.\r\n\r\n이게 문제인 이유:\r\n- 마켓플레이스 = 카탈로그 (어떤 플러그인들이 있는지 목록)\r\n- 플러그인 = 실제 코드 (skills, hooks 등)\r\n- 동일 repo면: marketplace.json이 **자기 자신을 가리킴** → 순환 참조\r\n\r\n```\r\nLens 현재:\r\n  CreetaCorp/lens (repo)\r\n    ├── .claude-plugin/marketplace.json  → \"lens\" plugin source: lens.git (자기 자신)\r\n    ├── skills/c/SKILL.md\r\n    ├── skills/cc/SKILL.md\r\n    └── skills/cp/SKILL.md\r\n\r\nAnthropic 공식 패턴:\r\n  anthropics/claude-plugins-official (카탈로그 repo)\r\n    ├── .claude-plugin/marketplace.json  → 각 플러그인을 \"./plugins/...\" 상대경로로 참조\r\n    ├── plugins/commit-commands/          → 플러그인 A\r\n    ├── plugins/code-review/              → 플러그인 B\r\n    └── external_plugins/playwright/      → 외부 플러그인 C\r\n\r\nbkit 패턴:\r\n  popup-studio-ai/bkit-claude-code (카탈로그 repo)\r\n    ├── .claude-plugin/marketplace.json  → bkit, bkit-starter 각각 별도 URL로 참조\r\n    (bkit 플러그인 코드도 같은 repo에 있지만, marketplace.json에서 url로 참조)\r\n```\r\n\r\n참고: bkit도 마켓 repo = 플러그인 repo이지만, 플러그인이 2개이고 별도 URL 참조를 사용. Lens은 1개 플러그인만 있으면서 자기 자신을 URL로 참조.\r\n\r\n실제 Anthropic 공식은 **외부 플러그인**도 `source: \"url\"` 방식을 사용함:\r\n```json\r\n// Sentry (외부, 별도 repo)\r\n{ \"source\": { \"source\": \"url\", \"url\": \"https://github.com/getsentry/sentry-for-claude.git\" } }\r\n\r\n// commit-commands (내부, 같은 repo)\r\n{ \"source\": \"./plugins/commit-commands\" }\r\n```\r\n\r\n→ Lens이 자체 호스팅이면 `\"url\"` 방식은 **유효**함. 다만 마켓=플러그인이 동일 repo인 것 자체가 구조적으로 깔끔하지 않음.\r\n\r\n### 2-3. 버전 관리\r\n\r\n| 항목 | Anthropic 공식 | bkit | Lens |\r\n|------|---------------|------|-------|\r\n| marketplace.json 버전 | 없음 (카탈로그) | `\"1.5.3\"` | 없음 |\r\n| plugin.json 버전 | 없거나 `\"1.0.0\"` | `\"1.5.3\"` | `\"1.7.0\"` |\r\n| installed_plugins.json 버전 | commit SHA (`55b58ec6e564`) | `\"1.5.3\"` | `\"1.7.0\"` |\r\n| ref 필드 (버전 고정) | 없음 (HEAD 사용) | 없음 | 없음 |\r\n| sha 필드 (커밋 고정) | 없음 | 없음 | 없음 |\r\n\r\n**문제 #3**: 버전 핀 없이 항상 기본 브랜치 HEAD를 가져옴.\r\n\r\n- `ref` 미지정 → `git clone`이 기본 브랜치 HEAD를 가져옴\r\n- 개발 중인 불안정 코드가 바로 사용자에게 배포될 수 있음\r\n- 정식 릴리스 프로세스가 없음\r\n\r\n이건 사실 bkit, Anthropic 공식도 마찬가지:\r\n- Anthropic 공식은 commit SHA만 기록 (`\"55b58ec6e564\"`)\r\n- bkit은 semver 사용하지만 `ref`는 미지정\r\n\r\n→ Lens만의 고유 문제는 아니지만, 안정성 향상을 위해 `ref: \"v1.7.0\"` 추가를 권장.\r\n\r\n---\r\n\r\n## 3. 실제 영향\r\n\r\n### 문제 #1 (`source: \"git\"`) 의 영향\r\n\r\n| 영향 | 설명 |\r\n|------|------|\r\n| 설치 불안정 | `\"git\"` 타입이 Claude Code 내부에서 어떻게 처리되는지 미정의. 동작할 수도 있고 특정 버전에서 실패할 수도 있음 |\r\n| 자동 업데이트 실패 가능 | `claude plugins update` 시 `\"git\"` 타입을 인식 못할 수 있음 |\r\n| 향후 호환성 | Claude Code 업데이트 시 비공식 소스 타입이 차단될 수 있음 |\r\n\r\n### 문제 #2 (자기 참조 구조) 의 영향\r\n\r\n| 영향 | 설명 |\r\n|------|------|\r\n| 확장성 | 플러그인을 추가하려면 repo 자체를 마켓플레이스처럼 관리해야 함 |\r\n| 캐시 중복 | 마켓플레이스 캐시(marketplaces/)와 플러그인 캐시(cache/)에 같은 코드가 2벌 존재 |\r\n| 업데이트 혼란 | 마켓플레이스 업데이트 = 플러그인 업데이트가 동시에 발생 |\r\n\r\n### 문제 #3 (버전 핀 없음) 의 영향\r\n\r\n| 영향 | 설명 |\r\n|------|------|\r\n| 불안정 배포 | 개발 중인 코드가 사용자에게 바로 적용 |\r\n| 롤백 불가 | 이전 안정 버전으로 돌아갈 방법 없음 |\r\n| 재현 불가 | 같은 \"1.7.0\"이라도 시점에 따라 다른 코드 |\r\n\r\n---\r\n\r\n## 4. 수정 권장사항\r\n\r\n### 즉시 수정 가능 (사용자 측)\r\n\r\n**known_marketplaces.json의 source 타입 변경:**\r\n\r\n```json\r\n// 변경 전\r\n\"CreetaCorp\": {\r\n  \"source\": {\r\n    \"source\": \"git\",\r\n    \"url\": \"https://github.com/CreetaCorp/lens.git\"\r\n  }\r\n}\r\n\r\n// 변경 후\r\n\"CreetaCorp\": {\r\n  \"source\": {\r\n    \"source\": \"github\",\r\n    \"repo\": \"CreetaCorp/lens\"\r\n  }\r\n}\r\n```\r\n\r\n이것만으로도 설치/업데이트 안정성이 개선됨.\r\n\r\n### Creeta 팀에 요청해야 하는 사항\r\n\r\n| # | 수정 | 우선순위 | 이유 |\r\n|---|------|----------|------|\r\n| 1 | marketplace.json의 plugin source를 상대 경로(`\"./\"`)로 변경 | 높음 | 자기 참조 해소 |\r\n| 2 | 릴리스 시 Git 태그 생성 + marketplace.json에 `ref` 추가 | 중간 | 안정 버전 핀 |\r\n| 3 | Anthropic 공식 마켓플레이스에 제출 | 낮음 | 자동 업데이트, 신뢰성 |\r\n\r\n**marketplace.json 수정 예시 (Creeta 팀):**\r\n\r\n```json\r\n{\r\n  \"plugins\": [\r\n    {\r\n      \"name\": \"lens\",\r\n      \"source\": \"./\",\r\n      \"version\": \"1.7.0\"\r\n    }\r\n  ]\r\n}\r\n```\r\n\r\n이렇게 하면 마켓플레이스 repo = 플러그인 repo인 구조에서도 상대 경로로 자신을 참조하여 깔끔해짐. Anthropic 공식 패턴(`\"./plugins/...\"`)과 동일한 방식.\r\n\r\n---\r\n\r\n## 5. 현재 동작하는 이유\r\n\r\n`\"source\": \"git\"`이 비공식임에도 현재 동작하는 이유:\r\n- Claude Code 내부에서 `\"git\"`과 `\"url\"` 타입을 동일하게 `git clone`으로 처리할 가능성이 높음\r\n- 하지만 이건 우연히 동작하는 것이지 보장된 동작이 아님\r\n\r\n---\r\n\r\n작성일: 2026-03-02\r\n작성자: Claude (livevil7 요청)\r\n","truncated":false,"stale":false},{"id":"2026-03-02-plugin-완성도-강화","folder":"history","title":"Work Plan / 작업계획서","date":"2026-03-02","hasMd":true,"hasHtml":false,"mdPath":"history/2026-03-02-plugin-완성도-강화.md","htmlPath":null,"mdInline":"# Work Plan / 작업계획서\r\n\r\n> Generated by Creet Plan on 2026-03-02 16:30\r\n> Plan ID: plan_creet_release_v171\r\n\r\n---\r\n\r\n## Task / 요청사항\r\n\r\ncreet 플러그인이 제대로 설치가 안되고, 버전관리도 제대로 안되고, 마켓플레이스 등록도 안 되어 있음. 완성도 있는 플러그인으로 제대로 만들기.\r\n\r\n## 현재 상태 진단 / Diagnosis\r\n\r\n### 버전관리 (CRITICAL)\r\n\r\n| 항목 | 현재 | 문제 |\r\n|------|------|------|\r\n| Git 태그 (remote) | v1.3.0만 존재 | v1.4.0~v1.7.0 태그 push 안됨 |\r\n| GitHub Releases | v1.3.0만 존재 | v1.4.0~v1.7.0 릴리스 생성 안됨 |\r\n| 미push 커밋 | 3개 (fix 2 + feat 1) | origin/master보다 3개 앞서 있음 |\r\n| 미push 로컬 태그 | v1.4.0, v1.5.0, v1.6.0, v1.7.0 | push 필요 |\r\n| 현재 코드 버전 | v1.7.0 (plugin.json) | 3개 fix 커밋이 v1.7.0 이후 → v1.7.1 필요 |\r\n\r\n### 마켓플레이스 (CRITICAL)\r\n\r\n| 항목 | 현재 | 문제 |\r\n|------|------|------|\r\n| Anthropic 공식 등록 | 미등록 | claude-plugins-official에 미제출 |\r\n| marketplace.json source | `{\"source\": \"url\", \"url\": \"...\"}` | 형식은 OK, 하지만 `metadata` 누락 |\r\n| 커뮤니티 등록 | 미등록 | awesome-claude-code-plugins 등 미제출 |\r\n\r\n### plugin.json (WARNING)\r\n\r\n| 항목 | 현재 | 문제 |\r\n|------|------|------|\r\n| homepage | 없음 | 공식 URL 없음 |\r\n| skills 필드 | 없음 | 자동감지에 의존 (명시적 선언 권장) |\r\n| hooks 필드 | 없음 | 자동감지에 의존 |\r\n\r\n### GitHub 레포 (WARNING)\r\n\r\n| 항목 | 현재 | 문제 |\r\n|------|------|------|\r\n| Topics | 없음 | 검색 불가 |\r\n| Homepage | 없음 | 설정 안됨 |\r\n| Stars | 0 | 노출 부족 |\r\n| Description | OK | 현재 `/c`만 언급, `/cp` 미반영 |\r\n\r\n---\r\n\r\n## Execution Plan / 실행 계획\r\n\r\n### Step 1: 버전 정리 + Push\r\n\r\n**목표**: 모든 코드, 태그, 릴리스를 원격에 동기화\r\n\r\n1. 현재 3개 fix 커밋을 v1.7.1로 버전 범프\r\n   - `plugin.json`: 1.7.0 → 1.7.1\r\n   - `marketplace.json`: 1.7.0 → 1.7.1\r\n   - `hooks.json` description: v1.7.0 → v1.7.1\r\n   - CHANGELOG.md: v1.7.1 섹션 추가\r\n2. 커밋: `chore: bump version to v1.7.1`\r\n3. 태그: `v1.7.1`\r\n4. Push: 모든 커밋 + 모든 태그\r\n   ```bash\r\n   git push origin master --tags\r\n   ```\r\n5. GitHub Releases 생성 (v1.4.0 ~ v1.7.1, 총 4개)\r\n   - v1.4.0: /cc 멀티 에이전트\r\n   - v1.5.0: 크로스 플랫폼\r\n   - v1.6.0: 에이전트 대시보드 + 훅 시스템\r\n   - v1.7.0: /cp 플랜 실행\r\n   - v1.7.1: 품질 개선 (검증 이슈 수정, 8개 언어, YAML 파서)\r\n\r\n### Step 2: plugin.json + marketplace.json 강화\r\n\r\n**목표**: Claude Code가 올바르게 파싱할 수 있는 완전한 매니페스트\r\n\r\n**plugin.json 추가 필드**:\r\n```json\r\n{\r\n  \"homepage\": \"https://github.com/Creeta-creet/creet\",\r\n  \"skills\": \"./skills/\",\r\n  \"hooks\": \"./hooks/hooks.json\"\r\n}\r\n```\r\n\r\n**marketplace.json 보강**:\r\n```json\r\n{\r\n  \"metadata\": {\r\n    \"description\": \"Creet plugin marketplace\",\r\n    \"version\": \"1.0.0\"\r\n  },\r\n  \"plugins\": [{\r\n    \"source\": {\r\n      \"source\": \"github\",\r\n      \"repo\": \"Creeta-creet/creet\"\r\n    },\r\n    \"category\": \"productivity\",\r\n    \"tags\": [\"skill-navigator\", \"meta-skill\", \"multilingual\", \"plan-first\"]\r\n  }]\r\n}\r\n```\r\n\r\n### Step 3: GitHub 레포 메타데이터\r\n\r\n**목표**: 검색엔진과 GitHub에서 발견 가능하게\r\n\r\n```bash\r\n# Topics 설정\r\ngh repo edit --add-topic claude-code,claude-code-plugin,skill-navigator,productivity,multilingual\r\n\r\n# Description 업데이트\r\ngh repo edit --description \"Skill navigator for Claude Code. Scans all plugins, recommends the best match, and executes — single (/c), parallel (/cc), or plan-first (/cp).\"\r\n\r\n# Homepage 설정\r\ngh repo edit --homepage \"https://github.com/Creeta-creet/creet\"\r\n```\r\n\r\n### Step 4: 공식 등록 가이드\r\n\r\n**목표**: Anthropic 공식 디렉토리 + 커뮤니티 등록\r\n\r\n1. **Anthropic 공식**: `claude-plugins-official` 레포에 PR 제출\r\n   - `external_plugins/` 디렉토리에 creet 엔트리 추가\r\n   - 또는 https://claude.com/plugins 제출 페이지 이용\r\n2. **커뮤니티 awesome list**: `ccplugins/awesome-claude-code-plugins`에 PR\r\n3. **hesreallyhim/awesome-claude-code**: 가장 큰 커뮤니티 목록에 PR\r\n\r\n### Step 5: 버전관리 워크플로우 문서화\r\n\r\n**목표**: 다음부터 수동 실수 방지\r\n\r\nCLAUDE.md에 릴리스 체크리스트 섹션 추가:\r\n```\r\n## Release Checklist\r\n1. 코드 변경 완료 + 커밋\r\n2. 버전 범프 (plugin.json, marketplace.json, hooks.json)\r\n3. CHANGELOG.md 업데이트\r\n4. 커밋: chore: bump version to vX.Y.Z\r\n5. 태그: git tag vX.Y.Z\r\n6. Push: git push origin master --tags\r\n7. GitHub Release: gh release create vX.Y.Z --notes-file CHANGELOG_EXCERPT.md\r\n```\r\n\r\n---\r\n\r\n## Expected Outcomes / 기대 결과\r\n\r\n- [ ] 원격 레포에 v1.3.0~v1.7.1 전체 태그 + 릴리스 존재\r\n- [ ] plugin.json, marketplace.json이 공식 스키마 준수\r\n- [ ] GitHub Topics + Description으로 검색 가능\r\n- [ ] 릴리스 체크리스트가 CLAUDE.md에 문서화\r\n- [ ] Anthropic 공식 디렉토리 제출 준비 완료\r\n\r\n## Risks / 위험 요소\r\n\r\n- GitHub Release 생성 시 이미 지난 커밋에 대한 릴리스이므로 날짜 불일치 가능 → release body에 원래 날짜 명시\r\n- Anthropic 공식 등록은 심사가 있으므로 거절될 수 있음 → 커뮤니티 등록 병행\r\n- marketplace.json source를 github 형식으로 변경하면 기존 설치에 영향 가능 → 하위호환 유지\r\n\r\n## Execution Mode / 실행 방식\r\n\r\n- **Mode**: Sequential (step 1→2→3→4→5)\r\n- **Steps**: 5\r\n- **Estimated scope**: Medium (파일 수정 6개 + git ops + GitHub API)\r\n\r\n---\r\n\r\n**Status**: Draft\r\n","truncated":false,"stale":false}],"rules":[{"id":"codex-integration","folder":"rules","title":"Codex CLI 연동 규칙","date":"","hasMd":true,"hasHtml":false,"mdPath":"rules/codex-integration.md","htmlPath":null,"mdInline":"# Codex CLI 연동 규칙\r\n\r\nLens v3.1에서 OpenAI Codex CLI를 활용한 pre-mortem 이종 모델 검증의 표준 규칙.\r\n\r\n## 1. 개요\r\n\r\n### Codex CLI란\r\n\r\n- OpenAI가 제공하는 codex 전용 CLI 도구 (이 확장 빌드가 노출하는 모델: `gpt-5.5`)\r\n- 로컬 셸에서 비대화형 호출 가능 (`codex exec`)\r\n- ChatGPT Plus/Pro/Max 구독으로 인증 (별도 API 키 불필요)\r\n\r\n### Lens가 Codex를 사용하는 이유\r\n\r\n- **이종 모델 병렬 검증**: Claude Opus와 다른 아키텍처/학습 데이터의 모델로 교차 검증\r\n- **블라인드 스팟 해소**: 단일 모델 편향(유사한 추론 경로, 동일한 놓침)을 상쇄\r\n- **비용 효율**: Plus/Pro/Max 구독 내에서 추가 과금 없이 활용\r\n\r\n### 사용 지점 (v3.9+)\r\n\r\nCodex 는 단순 \"Claude 결과 검토자\"가 아니라 **공동 조사자·공동 검증자**다. 네 지점에서 이종 모델 더블 검증을 수행한다:\r\n\r\n- `/cp PLAN` **Phase 0.5 — 병렬 독립 조사**: Goal 정의 직후 Codex 가 레포를 스스로 읽고 자기 접근안+리스크를 제시 (Claude 의 Plan A 설계와 병렬). 결과는 Phase 2.4 에서 합성.\r\n- `/cp PLAN` **Phase 2.4 — 듀얼 합성·교차검증**: Claude 안과 Codex 안의 합의/분기 분류 → 분기 재검증.\r\n- `/cp PLAN` **Phase 3 — Pre-mortem**: 통합안의 최종 리스크 점검 (Phase 0.5 에서 Codex 조사가 이미 돌았으면 Opus 단독, 아니면 Codex 병렬).\r\n- `/cc` **Phase 4.5 — 코드리뷰 게이트**: 매 반복의 코드 변경을 Codex 가 독립 리뷰. Supervisor pass + Codex pass 둘 다여야 진행.\r\n\r\n**trivial 작업(오타·변수명·한 줄 수정)은 모든 지점 skip** — 불필요한 호출 회피. Codex 부재/실패는 항상 graceful degrade (Claude/Supervisor 단독 진행 + 플래그 기록, 블로킹 금지). **단 예외 — `/cpp` S4 교차 협의는 하드 게이트**(Constitution 2조): 미감지/미인증 시 degrade 하지 않고 **정지·보고**한다(사용자가 \"Codex 없이 진행\" 명시 시만 1회 우회). 위 graceful degrade 는 `/cp`·`/cc` 의 듀얼검증 지점에 적용된다.\r\n\r\n## 2. 사전 조건 감지\r\n\r\nClaude Code 세션에서 Codex CLI가 설치·로그인됐는지 3단계 fallback으로 확인한다.\r\n\r\n### 단계 1: PATH 확인\r\n\r\n```bash\r\ncommand -v codex\r\n```\r\n\r\n`/usr/local/bin/codex` 등 경로가 출력되면 사용 가능.\r\n\r\n### 단계 2: VSCode ChatGPT 확장 번들 경로\r\n\r\nPATH에 없을 경우, VSCode ChatGPT 확장에 포함된 바이너리를 탐색한다.\r\n\r\n```bash\r\nls $HOME/.vscode/extensions/openai.chatgpt-*/bin/windows-x86_64/codex.exe 2>/dev/null | head -1\r\n```\r\n\r\n출력된 절대경로를 `CODEX_BIN` 변수에 저장하여 이후 호출에 사용한다.\r\n\r\n### 단계 3: 감지 실패\r\n\r\n위 두 단계 모두 실패하면 `codex_available=false` 로 마킹한다.\r\n\r\n**Fallback 동작**: Pre-mortem은 Opus 단독으로 수행하고, 결과 문서에 다음 문구를 명시한다.\r\n\r\n> Codex 미설치 — 단일 모델 pre-mortem\r\n\r\n## 3. 인증 확인\r\n\r\n```bash\r\ncodex login status\r\n```\r\n\r\n- 정상 응답: `Logged in using ChatGPT`\r\n- 미인증 상태: 사용자에게 `codex login`을 수동 실행하도록 안내\r\n- 로그인 URL이 자동으로 브라우저에 열리므로 대화형 실행 필요\r\n\r\n미인증 상태에서 호출하면 에러가 발생하므로 반드시 선제적으로 확인한다.\r\n\r\n## 4. 표준 호출 패턴\r\n\r\n```bash\r\nOUT=$(mktemp /tmp/codex_XXXXXX.txt)   # 고유 파일명 — 병렬 호출 충돌 방지\r\nDEPTH=xhigh                            # 소규모; 대규모 리뷰·협의는 high (§\"깊이 분기\")\r\ntimeout 180 codex exec --skip-git-repo-check \\\r\n  -m gpt-5.5 \\\r\n  -c model_reasoning_effort=\"$DEPTH\" \\\r\n  -c service_tier=fast \\\r\n  -o \"$OUT\" \\\r\n  \"프롬프트 내용\"\r\nRC=$?                                  # 124 = 180초 초과 (§7)\r\n# 응답 본문은 \"$OUT\" 에 떨어진다 (§5). RC==124 면 부분 본문 수거 or degrade.\r\n```\r\n\r\n### 플래그 설명\r\n\r\n- `exec` — 비대화형 1회 응답 모드. TUI를 띄우지 않고 결과 출력\r\n- `--skip-git-repo-check` — 현재 디렉토리가 git repo가 아니어도 실행 허용. Pre-mortem은 repo와 무관하므로 필수\r\n- `-m gpt-5.5` — 모델 명시 고정. config 기본값에 의존하지 않고 항상 동일 모델 사용 (이 codex 확장 빌드가 노출하는 모델)\r\n- `timeout 180` — **상한 가드(v3.19+)**: codex 가 180초 안에 못 끝내면 강제 종료(exit 124). 무한 동기 대기를 차단한다. 초과 시 §7 — `-o` 부분 본문이 있으면 \"미완\" 표기로 수거, 없으면 degrade. (coreutils `timeout` — git-bash/mac/linux 공통)\r\n- `-c model_reasoning_effort=\"$DEPTH\"` — **깊이 다이얼**: 입력 규모로 분기(§\"깊이 분기\"). 소규모(pre-mortem 200단어·빠른 조사)=`xhigh`, 대규모(전체 diff 리뷰·딥스펙 전량 협의)=`high`. 토큰 비용 비고려 방침은 유지하되, 대규모 xhigh 의 시간 비선형 폭증만 회피.\r\n- `-c service_tier=fast` — **속도 다이얼**: API 부하 시 큐 우선권. *별개 다이얼*이라 깊이와 동시 적용 가능. (현행 codex 0.137+ 정식 키는 `fast`; 과거 `priority` 는 동일 동작의 **레거시 별칭**으로 아직 매핑되나 미래 제거 대비 `fast` 로 통일. 라이브 실측 EXIT 0)\r\n- `-o \"$OUT\"` — 최종 답변 본문만 파일로 출력. 메타(`session id`/`tokens used`) 섞인 stdout을 awk로 파싱할 필요가 없다\r\n\r\n### 깊이 분기 — 소규모 xhigh / 대규모 high (v3.19+)\r\n\r\n깊이와 속도는 **독립 다이얼**이다. `reasoning_effort` 는 추론 토큰량(품질·깊이), `service_tier` 는 큐 우선권(지연)을 조절한다 — 한쪽이 다른 쪽을 깎지 않는다.\r\n\r\n**xhigh 는 입력이 작을 때만 빠르다.** 실측(gpt-5.5): 소규모에서 `low` 는 `xhigh` 보다 토큰 ~6배 + 속도 이득 0 → 소규모는 xhigh 가 오히려 싸고 빠르다. **그러나 입력이 크면(전체 diff 리뷰·딥스펙 전량 협의) xhigh 의 추론 시간은 비선형으로 폭증**한다. `service_tier=fast` 는 raw 속도가 아니라 **혼잡 시 큐 우선권**이라 compute-bound 인 이 폭증을 깎지 못한다. 따라서 깊이를 입력 규모로 분기한다:\r\n\r\n| 호출 지점 | 입력 규모 | DEPTH |\r\n|---|---|---|\r\n| Pre-mortem (200단어 제한) | 작음 | `xhigh` |\r\n| `/cp` P0.5 독립 조사 | 중 (background·비대기) | `xhigh` |\r\n| `/cc` P4.5 코드리뷰 (전체 diff) | **큼** | `high` |\r\n| `/cpp` S4 교차 협의 (딥스펙 전량) | **큼** | `high` |\r\n\r\n소규모 xhigh 는 메모리 룰(소규모 xhigh always) 그대로 보존한다. **대규모만 high 로 내려 시간을 잡고, 모든 지점에 `timeout 180`(§7) 을 공통 적용**한다. `fast`(구 `priority`) 는 큰 작업/혼잡 시 보험이며 해는 없다 → 유지.\r\n\r\n### 모델·티어 드리프트 대비 (버전 무관 fallback)\r\n\r\n`-m gpt-5.5` 와 `service_tier` 는 **서버측 검증**이라, OpenAI 가 모델을 폐기/리네임하면 호출이 런타임 400(`invalid_request_error`)으로 죽는다. 머신 하드코딩 금지 원칙에 따라:\r\n\r\n- **모델**: `-m gpt-5.5` 호출이 400(invalid model)이면 **`-m` 을 빼고 1회 재시도** (codex config 기본 모델 사용). 특정 모델명에 영구 의존하지 않는다.\r\n- **티어**: `service_tier=fast` 가 거부되면 `-c service_tier` 자체를 생략하고 재시도 (기본 티어). `fast`/`priority` 둘 다 미지원인 구버전 대비.\r\n- 이 fallback 은 graceful — 이종검증이 조용히 죽는 대신 기본값으로라도 돈다. 깨짐은 `/crv` 감사가 `codex --version` probe 로 선제 감지.\r\n\r\n> 참고: codex 바이너리 절대경로는 `CODEX_BIN=$(ls $HOME/.vscode/extensions/openai.chatgpt-*/bin/windows-x86_64/codex.exe 2>/dev/null | head -1)` 로 잡고 `\"$CODEX_BIN\"` 으로 호출 (PATH 부재 시, §2 단계 2).\r\n\r\n## 5. 응답 수거\r\n\r\n`-o \"$OUT\"` 플래그를 쓰면 codex 가 **최종 답변 본문만** 해당 파일에 쓴다. 메타(`session id`/`tokens used`)가 섞인 stdout 을 파싱할 필요가 없다.\r\n\r\n### 본문 읽기\r\n\r\n```bash\r\nBODY=$(cat \"$OUT\")\r\n```\r\n\r\n읽은 `$BODY` 를 결과 문서에 삽입한다. **고유 파일명 필수** — Phase 0.5·2.4·4.5 가 background 병렬로 동시에 돌 수 있으므로, `mktemp /tmp/codex_XXXXXX.txt` 같은 고유 경로를 호출마다 새로 잡아 덮어쓰기를 막는다.\r\n\r\n### (참고) -o 없이 stdout 만 받은 경우\r\n\r\n구버전 codex 등으로 `-o` 를 못 쓰면 stdout 에 메타가 섞인다. 본문은 `^codex$` 라벨 다음 줄 ~ `^tokens used$` 이전 줄이며, 폴백 추출은:\r\n\r\n```bash\r\nBODY=$(echo \"$OUTPUT\" | awk '/^codex$/{flag=1; next} /^tokens used$/{flag=0} flag')\r\n```\r\n\r\n`-o` 가 동작하는 환경에선 이 awk 폴백을 쓰지 않는다.\r\n\r\n## 6. Pre-mortem 프롬프트 템플릿\r\n\r\n```\r\n다음 작업 계획의 허점을 찾아주세요. 200단어 이내, 순수 텍스트.\r\n\r\n## 계획\r\n{계획 문서의 목표 + 기술적 접근 섹션}\r\n\r\n## 평가 관점\r\n1. 실패할 수 있는 3가지 시나리오 (구체적 트리거 + 결과)\r\n2. 누락된 엣지 케이스\r\n3. 기술적 블라인드 스팟\r\n\r\nJSON 형식 사용하지 말고 한국어로 답변.\r\n```\r\n\r\n### 템플릿 설계 의도\r\n\r\n- **200단어 제한**: 응답 시간 단축, 핵심 허점에 집중\r\n- **순수 텍스트**: 파싱 편의성 (JSON/마크다운 파싱 불필요)\r\n- **3가지 시나리오 강제**: 단일 실패 모드가 아닌 다중 관점 유도\r\n- **한국어 명시**: gpt-5.5는 영문 응답 기본값이므로 명시적 지시 필요\r\n\r\n## 7. 에러 처리 — 180초 상한 + 부분 수집/degrade (v3.19+)\r\n\r\n모든 codex 호출은 `timeout 180`(§4) 으로 감싼다. 두 층위의 보호가 있다:\r\n\r\n1. **background 비대기 지점**(`/cp` P0.5 조사 등): Claude 는 애초에 기다리지 않고 자기 작업을 진행하다 gate 에서 ready 면 수거·미완이면 degrade. (기존 동작 — `timeout` 은 orphan 강제 정리 보너스.)\r\n2. **동기·하드게이트 지점**(`/cpp` S4, `/cc` P4.5 더블게이트): codex 결과를 받아야 진행하므로 **실제로 대기**한다. 여기서 `timeout 180` 이 **무한 대기를 끊는 핵심**이다. 180초 초과(exit 124) 시:\r\n   - **`-o $OUT` 자유형**: `$OUT` 에 부분 본문이 있으면 **\"⚠️ Codex 부분 결과(180s 초과·미완)\"** 로 표기해 수거·반영한다. 비어있으면 degrade. (codex 가 최종본만 쓰면 부분 수거 불가 — best-effort.)\r\n   - **`--json` 구조화 review**: 부분 JSON 은 파싱 불가 → degrade(\"Codex 리뷰 미완 — 단독 게이트\").\r\n\r\ncodex 가 느리든 hang 하든 180초면 무조건 끊긴다. orphan 프로세스는 `timeout` kill + 세션 종료(Stop 훅)가 정리한다.\r\n\r\n| 상황 | 대응 |\r\n|------|------|\r\n| **180초 초과 (exit 124)** | $OUT 부분 본문 있으면 \"미완\" 표기 수거, 없으면 degrade. **무한 대기 금지.** |\r\n| **gate 시점에 미완 (background)** | 기다리지 않고 degrade — \"Codex 미완 — 단독 진행\" 플래그 기록 |\r\n| **인증 만료 / 호출 실패** | \"Codex 실패: {요약}\" 기록 후 Claude/Opus 단독 진행 |\r\n| **stderr 에러** | 결과 섹션에 \"Codex 에러\" 블록으로 포함 (블로킹 금지) |\r\n\r\n> **하드게이트 예외 주의**: `/cpp` S4 는 Codex *부재/미인증* 시 degrade 금지(정지·보고)지만, *180초 초과* 는 다르다 — codex 는 응답 중이었으므로 부분 결과를 \"미완 협의\"로 반영하고 진행하되, 커버리지 공백이 남으면 S5 회귀로 보강(§8.5). 무한 대기로 사용자를 잡지 않는다.\r\n\r\n## 8. 비용 및 성능 가이드\r\n\r\n| 항목 | 값 |\r\n|------|-----|\r\n| Pre-mortem 1회당 토큰 사용량 | 가변 — **비용 비고려**(깊이·속도 우선 방침). xhigh 는 소규모에서 오히려 토큰이 적음 |\r\n| 응답 시간 | 소규모 pre-mortem ~5–10초(xhigh). 대규모 리뷰·협의=high + `timeout 180` 상한(§7). 부하 시 fast 가 큐 우선권 |\r\n| 과금 | ChatGPT Plus/Pro/Max 구독 시 별도 과금 없음 |\r\n\r\n### 주의사항\r\n\r\n- 구독 등급에 따라 일일 사용량 제한 존재 (구체 수치는 OpenAI 공식 페이지 참조)\r\n- 연속 호출 시 rate limit 가능 — pre-mortem 1회/계획이면 일반적으로 문제 없음\r\n- 로컬 네트워크 상태에 따라 응답 시간 변동\r\n\r\n## 8.5 듀얼 검증 호출 패턴 (v3.9+)\r\n\r\n§4 표준 호출 + §5 응답 수거 + §7 에러 처리를 그대로 공유한다. 조사·리뷰에 추가되는 규칙:\r\n\r\n### 병렬성 — run_in_background\r\n\r\n조사(Phase 0.5)·코드리뷰(Phase 4.5)는 Claude 의 본 작업과 **진짜 병렬**이어야 한다. Bash tool 의 `run_in_background: true` 로 Codex 를 띄우고, Claude 는 자기 작업(Plan A 설계 / Supervisor 검토)을 진행한 뒤 백그라운드 출력을 수거한다. sleep/폴링 금지 — 완료 알림을 받는다. **gate 도달 시 ready 면 수거, 미완이면 기다리지 않고 degrade**(§7) — 숫자 timeout 없음.\r\n\r\n### 파일 접근 — 프로젝트 루트에서 실행\r\n\r\nPre-mortem 은 repo 무관(`--skip-git-repo-check`)이지만, **조사·코드리뷰는 Codex 가 파일을 읽어야** 한다. 반드시 프로젝트 루트(cwd)에서 `codex exec` 를 호출 — Codex 는 cwd 의 파일에 접근한다.\r\n\r\n### 프롬프트 / 판정\r\n\r\n- **Phase 0.5 독립 조사**: \"이 작업을 직접 조사하고 독립 실행 계획을 제안\" (권장 접근 / 리스크 3 / 관련 파일). 전체 템플릿은 `skills/cp/SKILL.md` Phase 0.5.\r\n- **Phase 4.5 코드리뷰 (구조화·git-aware — v3.13+ 권장)**: 자유형 \"이 diff 를 리뷰\" 프롬프트 + 수동 diff 주입 + 본문 마지막 줄 awk `PASS`/`FAIL` 파싱은 **취약**(diff 잘림·텍스트 휴리스틱). 대신 **`codex exec review`** 가 git 을 직접 읽고 구조화 판정을 낸다 (현행 0.137+ 라이브 실측 확인):\r\n\r\n  ```bash\r\n  SCHEMA=$(mktemp /tmp/codex_schema_XXXXXX.json)   # {verdict: pass|fail, high_findings:[...]}\r\n  RES=$(mktemp /tmp/codex_review_XXXXXX.json)\r\n  timeout 180 codex exec review --uncommitted \\\r\n    -m gpt-5.5 -c model_reasoning_effort=high -c service_tier=fast \\\r\n    --output-schema \"$SCHEMA\" --ephemeral --json > \"$RES\" 2>/dev/null\r\n  # 판정: $RES 의 verdict==fail 또는 high_findings 비어있지 않음 → FAIL\r\n  # 깊이=high (전체 diff 는 대규모 입력 → xhigh 폭증 회피, §\"깊이 분기\").\r\n  # exit 124(180s 초과) → 구조화 JSON 불완전이면 degrade (§7).\r\n  ```\r\n\r\n  - `--uncommitted` (또는 `--base <branch>`) — Codex 가 작업트리 변경을 직접 읽음. **수동 diff 주입 제거**.\r\n  - `--output-schema` — `{verdict, high_findings}` 구조 강제. **awk PASS/FAIL 휴리스틱 제거**.\r\n  - `--ephemeral` — 세션 비영속. orphan 정리(Stop 훅) 의존 완화.\r\n  - ⚠️ **반드시 `codex exec review`** — bare `codex review` 는 `--output-schema`/`--ephemeral` 미노출. `exec review` 만이 review 인자(`--uncommitted/--base`)와 exec 플래그를 동시 노출.\r\n  - **fallback**: `codex exec review` 미지원 구버전이면 기존 자유형 diff 리뷰 + `PASS`/`FAIL`+`[high]` 파싱 (graceful degrade). 전체 템플릿은 `skills/cc/SKILL.md` Phase 4.5.\r\n- **합성/게이트**: 조사 결과는 Claude 가 합의/분기로 분류해 통합 (Phase 2.4). 리뷰 결과는 Supervisor 와 AND 게이트 (둘 다 pass 여야 진행).\r\n\r\n## 9. 관련 파일 / 외부 참조\r\n\r\n### 로컬\r\n\r\n- 스킬: `~/.claude/skills/codex-review/SKILL.md` — Claude Code 안에서 `/codex-review` 호출용 (별도 설치 완료)\r\n- Lens PLAN 모드: `~/.claude/plugins/lens/skills/cp/` — Phase 2.5에서 본 문서 참조\r\n\r\n### 외부\r\n\r\n- 공식 CLI 문서: <https://developers.openai.com/codex/cli/>\r\n- GitHub 저장소: <https://github.com/openai/codex>\r\n- ChatGPT 구독 정책: <https://openai.com/chatgpt/pricing/>\r\n","truncated":false,"stale":false},{"id":"document-conventions","folder":"rules","title":"Lens 문서 작성 컨벤션 (Document Writing Conventions)","date":"","hasMd":true,"hasHtml":false,"mdPath":"rules/document-conventions.md","htmlPath":null,"mdInline":"# Lens 문서 작성 컨벤션 (Document Writing Conventions)\r\n\r\n> Lens 플러그인이 생성하는 모든 문서의 작성 규칙 및 표준 정의서\r\n> 버전: 1.0.0 | 작성일: 2026-03-02\r\n\r\n---\r\n\r\n## 적용 범위\r\n\r\n이 컨벤션은 Lens가 **런타임에 생성하는 문서**에 적용된다.\r\n\r\n| 대상 | 생성 주체 | 현재 파일 |\r\n|------|-----------|-----------|\r\n| 작업계획서 (Work Plan) | `/cp` | `docs/YYYY-MM-DD-{slug}.md` |\r\n| 실행 결과 합성 | `/cc` | `.lens/results/synth-YYYY-MM-DD-{slug}.md` (saveSynthesisResults=true 시) |\r\n| Plan 상태 추적 | `plan-manager.js` | `.lens/plan-state.json` |\r\n| Agent 대시보드 | `agent-tracker.js` | `.lens/agent-dashboard.json` |\r\n\r\n프로젝트 자체 문서(`CLAUDE.md`, `README.md`, `CHANGELOG.md`)의 규칙은 `docs/rules/documentation-guide.md`를 따른다.\r\n\r\n---\r\n\r\n## 1. 문서 네이밍 컨벤션\r\n\r\n### 현재 상태\r\n\r\n| 항목 | 현재 규칙 | 문제점 |\r\n|------|-----------|--------|\r\n| 파일명 | `YYYY-MM-DD-{slug}.md` | slug 생성 규칙이 `plan-manager.js`에만 있고 SKILL.md와 중복 정의됨 |\r\n| 폴더 | `docs/` (기본), `.lens/results/` (/cc) | 작업계획서는 `docs/`, /cc 합성 결과는 `.lens/results/` |\r\n| ID | `plan_${timestamp36}_${hex}` | Plan에만 ID 존재. Agent, Session과 ID 형식이 제각각 |\r\n\r\n### 개선된 규칙\r\n\r\n#### 1.1 파일명 형식\r\n\r\n```\r\n{type}-{YYYY-MM-DD}-{slug}.md\r\n```\r\n\r\n| 접두사 (type) | 문서 종류 | 생성 스킬 | 예시 |\r\n|---------------|-----------|-----------|------|\r\n| `plan` | 작업계획서 | `/cp` | `plan-2026-03-02-jwt-auth-login.md` |\r\n| `result` | 실행 결과 합성 | `/cc` | `result-2026-03-02-seo-audit.md` |\r\n| `report` | 분석/리포트 | 향후 확장용 | `report-2026-03-02-perf-analysis.md` |\r\n\r\n> **근거**: 타입 접두사가 있으면 `ls` 한 번으로 종류별 필터링이 가능하다.\r\n> 현재 `YYYY-MM-DD-slug.md` 형식은 날짜순 정렬에는 유리하지만, 작업계획서와 결과 문서가 섞이면 구분이 안 된다.\r\n\r\n#### 1.2 Slug 생성 규칙 (단일 원천: `plan-manager.js`)\r\n\r\n```javascript\r\n// 규칙: plan-manager.js의 generateSlug()이 유일한 slug 생성 함수\r\n// SKILL.md에서는 \"slug는 plan-manager.js가 생성한다\"고만 명시\r\n\r\n// 허용 문자: 모든 Unicode 문자(\\p{L}), 숫자(\\p{N}), 하이픈\r\n// 최대 길이: 50자\r\n// 단어 수: 3~5개 핵심 키워드\r\n// 1글자 단어: 제외 (filter(w => w.length > 1))\r\n// 폴백: slug가 비어있거나 2자 미만이면 plan-{random_hex_6}\r\n```\r\n\r\n#### 1.3 폴더 구조\r\n\r\n```\r\nproject-root/\r\n├── docs/                        # /cp 작업계획서 (기본 저장 위치, planDir로 변경 가능)\r\n│   ├── 2026-03-02-jwt-auth.md\r\n│   └── 2026-03-01-db-migration.md\r\n├── .lens/\r\n│   ├── results/                 # /cc 합성 결과 (saveSynthesisResults=true 시)\r\n│   │   └── synth-2026-03-02-seo-audit.md\r\n│   ├── plan-state.json          # Plan 상태 추적\r\n│   └── agent-dashboard.json     # Agent 라이프사이클\r\n```\r\n\r\n#### 1.4 ID 형식 통일\r\n\r\n| 엔티티 | 현재 형식 | 통일 형식 |\r\n|--------|-----------|-----------|\r\n| Plan | `plan_${ts36}_${hex4}` | `plan_${ts36}_${hex4}` (유지) |\r\n| Session | `sess_${ts36}_${hex6}` | `sess_${ts36}_${hex4}` (hex 길이 통일) |\r\n| Agent | `agent_${ts36}_${hex4}` | `agt_${ts36}_${hex4}` (접두사 축약) |\r\n\r\n```\r\n공통 패턴: {prefix}_{base36_timestamp}_{hex_random_4}\r\n예시: plan_m1abc_f3d2, sess_m1abc_a1b2, agt_m1abc_c4e5\r\n```\r\n\r\n---\r\n\r\n## 2. 문서 헤더/메타데이터 컨벤션\r\n\r\n### 현재 상태\r\n\r\n| 항목 | 현재 규칙 | 문제점 |\r\n|------|-----------|--------|\r\n| 헤더 | `# Work Plan / 작업계획서` + blockquote 메타 | 파싱 불가. 메타데이터가 자유 텍스트 |\r\n| Plan ID | blockquote 안에 인라인 표기 | 프로그래밍적으로 추출 불가 |\r\n| 날짜 | `Generated by Lens Plan on {YYYY-MM-DD HH:mm}` | 형식만 있고 타임존 규칙 없음 |\r\n\r\n### 개선된 규칙\r\n\r\n#### 2.1 YAML 프론트매터 (필수)\r\n\r\n모든 Lens 생성 문서는 YAML 프론트매터로 시작한다.\r\n\r\n```yaml\r\n---\r\nid: plan_m1abc_f3d2\r\ntype: plan                    # plan | result | report\r\nversion: 1                   # 문서 스키마 버전 (수정할 때마다 증가 아님, 포맷 변경 시만)\r\ncreated: 2026-03-02T14:30:00+09:00   # ISO 8601 + 타임존\r\nupdated: 2026-03-02T15:00:00+09:00   # 최종 수정 시각\r\nstatus: draft                 # draft | approved | executing | completed | failed | cancelled\r\ngenerator: /cp                # 생성한 스킬\r\nlanguage: ko                  # 본문 언어 (ISO 639-1)\r\ntags: [jwt, auth, backend]    # 검색/필터용 태그\r\n---\r\n```\r\n\r\n#### 2.2 필수 vs 선택 필드\r\n\r\n| 필드 | 필수 | 타입 | 설명 |\r\n|------|------|------|------|\r\n| `id` | 필수 | string | 고유 식별자 |\r\n| `type` | 필수 | enum | 문서 종류 |\r\n| `version` | 필수 | integer | 프론트매터 스키마 버전 (현재 `1`) |\r\n| `created` | 필수 | ISO 8601 | 생성 시각 (타임존 포함) |\r\n| `updated` | 필수 | ISO 8601 | 최종 수정 시각 |\r\n| `status` | 필수 | enum | 문서/작업 상태 |\r\n| `generator` | 필수 | string | 생성 스킬명 |\r\n| `language` | 필수 | string | ISO 639-1 언어 코드 |\r\n| `tags` | 선택 | string[] | 태그 목록 |\r\n| `parent_id` | 선택 | string | 연결된 상위 문서 ID |\r\n| `related` | 선택 | string[] | 관련 문서 ID 목록 |\r\n\r\n#### 2.3 `plan-state.json` 스키마와의 정합성\r\n\r\n프론트매터의 `status`와 `plan-state.json`의 `status`는 **반드시 동기화**한다.\r\n상태 변경 시 두 곳 모두 업데이트:\r\n\r\n```\r\n1. plan-state.json의 해당 plan ID 엔트리의 status 변경\r\n2. plan 마크다운 파일의 프론트매터 status 변경\r\n→ 둘 다 plan-manager.js가 책임진다\r\n```\r\n\r\n---\r\n\r\n## 3. 다국어 처리 컨벤션\r\n\r\n### 현재 상태\r\n\r\n| 항목 | 현재 규칙 | 문제점 |\r\n|------|-----------|--------|\r\n| 언어 감지 | \"Respond in the user's language\" (SKILL.md) | 구체적 감지 로직 없음 |\r\n| 헤더 | `## Task / 요청사항` (이중 언어 고정) | 사용자가 영어면 한국어 헤더 불필요 |\r\n| 본문 | \"user's language\" | 기본값 규칙 없음 |\r\n| 설정 | `defaultPlanLanguage: null` (lens.config.json) | 사용 방법 미정의 |\r\n\r\n### 개선된 규칙\r\n\r\n#### 3.1 언어 결정 우선순위\r\n\r\n```\r\n1. lens.config.json의 defaultPlanLanguage (명시적 설정) → \"ko\", \"en\", 등\r\n2. 사용자 입력 언어 자동 감지 (요청 텍스트 기반)\r\n3. 폴백: \"en\" (영어)\r\n```\r\n\r\n#### 3.2 헤더 이중 언어 규칙\r\n\r\n| 본문 언어 | 헤더 형식 | 예시 |\r\n|-----------|-----------|------|\r\n| `en` | 영어만 | `## Task` |\r\n| `ko` | 영어 / 한국어 | `## Task / 요청사항` |\r\n| `ja` | 영어 / 일본어 | `## Task / 要件` |\r\n| `zh` | 영어 / 중국어 | `## Task / 任务` |\r\n| 기타 | 영어 / 해당 언어 | `## Task / Tarea` |\r\n\r\n**규칙**: 영어 헤더는 항상 첫 번째. 비영어 언어일 때만 ` / {번역}` 추가.\r\n\r\n#### 3.3 본문 언어 규칙\r\n\r\n| 요소 | 언어 | 이유 |\r\n|------|------|------|\r\n| 프론트매터 키 | 영어 | YAML 키는 코드. 다국어화 불가 |\r\n| 섹션 헤더 | 이중 언어 (3.2 규칙) | 가독성 + 검색성 |\r\n| 본문 텍스트 | 사용자 언어 | 사용자가 읽는 주요 콘텐츠 |\r\n| 코드/명령어 | 영어 | 코드는 원본 유지 |\r\n| 상태 값 | 영어 (enum) | `draft`, `completed` 등 파싱 가능해야 함 |\r\n\r\n#### 3.4 언어 코드 표 (지원 언어)\r\n\r\n| 코드 | 언어 | Lens 지원 상태 |\r\n|------|------|-----------------|\r\n| `en` | English | 기본값 |\r\n| `ko` | 한국어 | 지원 |\r\n| `ja` | 日本語 | 지원 |\r\n| `zh` | 中文 | 지원 |\r\n| `es` | Español | 지원 |\r\n| `fr` | Français | 지원 |\r\n| `de` | Deutsch | 지원 |\r\n| `it` | Italiano | 지원 |\r\n\r\n---\r\n\r\n## 4. 상태 관리 컨벤션\r\n\r\n### 현재 상태\r\n\r\n| 항목 | 현재 규칙 | 문제점 |\r\n|------|-----------|--------|\r\n| Plan 상태 | `Draft` → (실행) → `Completed \\| Partial \\| Failed` | `Approved`, `Executing` 단계 누락 |\r\n| 상태 위치 | 마크다운 본문 하단 `**Status**: Draft` | 프론트매터와 이원화. 파싱 어려움 |\r\n| `/cc` 결과 | 상태 개념 없음 | 성공/실패 이력 없음 |\r\n| Agent | `pending → running → done \\| error` | Plan 상태와 연결 안 됨 |\r\n\r\n### 개선된 규칙\r\n\r\n#### 4.1 문서 상태 머신\r\n\r\n```\r\n                     ┌──────────┐\r\n                     │  draft   │ ← 최초 생성\r\n                     └────┬─────┘\r\n                          │ 사용자 승인\r\n                     ┌────▼─────┐\r\n                     │ approved │\r\n                     └────┬─────┘\r\n                          │ 실행 시작\r\n                   ┌──────▼──────┐\r\n                   │  executing  │\r\n                   └──┬───────┬──┘\r\n                      │       │\r\n               ┌──────▼──┐ ┌──▼───────┐\r\n               │completed│ │  failed  │\r\n               └─────────┘ └──────────┘\r\n\r\n   취소는 어디서든 가능:\r\n   draft ──→ cancelled\r\n   approved ──→ cancelled\r\n```\r\n\r\n#### 4.2 상태 전이 규칙\r\n\r\n| 현재 상태 | 허용 전이 | 전이 조건 |\r\n|-----------|-----------|-----------|\r\n| `draft` | `approved`, `cancelled` | 사용자 응답 |\r\n| `approved` | `executing`, `cancelled` | 실행 시작 또는 취소 |\r\n| `executing` | `completed`, `failed` | 모든 스킬 완료 또는 에러 |\r\n| `completed` | (최종 상태) | - |\r\n| `failed` | (최종 상태) | - |\r\n| `cancelled` | (최종 상태) | - |\r\n\r\n#### 4.3 상태 변경 시 필수 기록\r\n\r\n| 전이 | 기록 사항 | 기록 위치 |\r\n|------|-----------|-----------|\r\n| → `approved` | `approvedAt` 타임스탬프 | 프론트매터 `updated` + `plan-state.json` |\r\n| → `executing` | 실행 시작 시각 | 프론트매터 `updated` |\r\n| → `completed` | `completedAt` + 결과 요약 | 프론트매터 `updated` + 본문 Execution Result 섹션 |\r\n| → `failed` | `failedAt` + 실패 원인 | 프론트매터 `updated` + 본문 Execution Result 섹션 |\r\n| → `cancelled` | `cancelledAt` + 사유 | 프론트매터 `updated` + `plan-state.json` |\r\n\r\n#### 4.4 `/cc` 결과 문서의 상태\r\n\r\n`/cc`는 계획 없이 즉시 실행하므로 상태 머신이 단순하다:\r\n\r\n```\r\nexecuting → completed | failed\r\n```\r\n\r\n`result` 타입 문서의 프론트매터에 `status: completed` 또는 `status: failed`로 기록.\r\n\r\n---\r\n\r\n## 5. 문서 연결 컨벤션\r\n\r\n### 현재 상태\r\n\r\n| 항목 | 현재 규칙 | 문제점 |\r\n|------|-----------|--------|\r\n| Plan → Result | Plan 파일 하단에 Execution Result 섹션 추가 | 한 파일에 계획과 결과가 혼재. 파일이 길어짐 |\r\n| Result → Plan | 없음 | 역참조 불가 |\r\n| Plan → Plan | 없음 | 연속 작업의 흐름 추적 불가 |\r\n| `/cc` → `/cp` | 없음 | `/cc` 결과를 바탕으로 `/cp` 계획을 세울 때 연결 없음 |\r\n\r\n### 개선된 규칙\r\n\r\n#### 5.1 연결 방식: 프론트매터 참조\r\n\r\n```yaml\r\n---\r\nid: plan_m1abc_f3d2\r\nparent_id: plan_m0xyz_a1b2       # 이 문서의 선행 문서\r\nrelated: [result_m1abc_e3f4]     # 관련 문서 목록\r\n---\r\n```\r\n\r\n#### 5.2 연결 시나리오\r\n\r\n| 시나리오 | 연결 방법 |\r\n|----------|-----------|\r\n| Plan 실행 후 결과 기록 | Plan 파일 하단에 `## Execution Result` 섹션 추가 (현재 방식 유지). 결과가 복잡하면 별도 `result` 문서 생성 후 `related`로 연결 |\r\n| 연속 Plan | 후속 Plan의 `parent_id`에 선행 Plan ID 기재 |\r\n| `/cc` 결과 → `/cp` 계획 | Plan의 `parent_id`에 Result 문서 ID 기재 |\r\n| 실패 후 재시도 | 새 Plan의 `parent_id`에 실패한 Plan ID 기재 |\r\n\r\n#### 5.3 본문 내 참조 형식\r\n\r\n문서 본문에서 다른 문서를 참조할 때:\r\n\r\n```markdown\r\n> 이전 계획 [plan_m0xyz_a1b2](../plans/plan-2026-03-01-db-migration.md) 에서 이어지는 작업입니다.\r\n```\r\n\r\n형식: `[{document_id}]({relative_path})`\r\n\r\n#### 5.4 Execution Result 섹션 (Plan 파일 내)\r\n\r\nPlan 파일에 결과를 인라인으로 추가할 때의 표준 형식:\r\n\r\n```markdown\r\n---\r\n\r\n## Execution Result / 실행 결과\r\n\r\n> Completed on {YYYY-MM-DDTHH:mm:ss+TZ}\r\n\r\n### Outcomes / 실행 결과 상세\r\n- [ ] {기대 결과 1} → {실제 결과}\r\n- [x] {기대 결과 2} → {실제 결과}\r\n\r\n### Files Changed / 변경된 파일\r\n| File | Action | Description |\r\n|------|--------|-------------|\r\n| `src/auth.js` | Modified | JWT 검증 로직 추가 |\r\n| `src/middleware.js` | Created | 인증 미들웨어 신규 생성 |\r\n\r\n### Status: {Completed | Failed}\r\n```\r\n\r\n> **기대 결과 항목**: Plan 단계의 `## Expected Outcomes`의 체크리스트와 1:1 매핑. 달성한 항목은 `[x]`, 미달성은 `[ ]`.\r\n\r\n---\r\n\r\n## 6. 품질 기준 컨벤션\r\n\r\n### 현재 상태\r\n\r\n| 항목 | 현재 규칙 | 문제점 |\r\n|------|-----------|--------|\r\n| 필수 섹션 | SKILL.md에 템플릿으로만 정의 | \"이 섹션이 없으면 거부\" 같은 규칙 없음 |\r\n| 구체성 | 없음 | \"JWT 구현\" vs \"Express.js 4.x에서 RS256 JWT 발급/검증 구현\" 구분 안 됨 |\r\n| 검증 | 없음 | AI가 생성한 문서가 품질 기준을 충족하는지 확인 방법 없음 |\r\n\r\n### 개선된 규칙\r\n\r\n#### 6.1 작업계획서 (Plan) 필수 섹션\r\n\r\n| # | 섹션 | 필수 여부 | 최소 요구사항 |\r\n|---|------|-----------|---------------|\r\n| 1 | 프론트매터 | 필수 | 2.1의 모든 필수 필드 |\r\n| 2 | Task / 요청사항 | 필수 | 사용자 원문 + 1줄 이상 컨텍스트 |\r\n| 3 | Matched Skills | 필수 | 1개 이상 매칭된 스킬. Why Selected 칼럼 비어있으면 안 됨 |\r\n| 4 | Execution Plan | 필수 | Step별 Skill + Input + Expected output. 최소 1 Step |\r\n| 5 | Expected Outcomes | 필수 | 체크리스트 형태. 최소 1개. 검증 가능한 구체적 결과물 |\r\n| 6 | Risks & Considerations | 선택 | 복잡한 작업(3 Step 이상)이면 필수 |\r\n| 7 | Execution Mode | 필수 | Single 또는 Parallel 명시 |\r\n\r\n#### 6.2 구체성 수준 기준\r\n\r\n**나쁜 예** vs **좋은 예**:\r\n\r\n| 항목 | 나쁜 예 (거부) | 좋은 예 (승인) |\r\n|------|---------------|---------------|\r\n| Task | \"인증 구현\" | \"Next.js 14 App Router 프로젝트에 Google OAuth 2.0 로그인 추가\" |\r\n| Expected Output | \"코드 생성\" | \"`src/app/api/auth/[...nextauth]/route.ts` 파일 생성, Google provider 설정 포함\" |\r\n| Input | \"사용자 요청\" | \"사용자의 원본 요청 + `package.json`의 현재 의존성 목록\" |\r\n| Risk | \"문제가 생길 수 있음\" | \"기존 session 기반 인증과 충돌 가능 → 마이그레이션 가이드 포함 필요\" |\r\n\r\n#### 6.3 검증 체크리스트 (AI 셀프 체크)\r\n\r\nPlan 생성 후, 사용자에게 제시하기 전에 AI가 내부적으로 확인:\r\n\r\n```\r\n[ ] 프론트매터의 필수 필드 7개 모두 존재하는가?\r\n[ ] 모든 Matched Skill이 실제 세션에 존재하는 스킬인가?\r\n[ ] Expected Outcomes가 검증 가능한 형태인가? (파일명, 동작, 수치 등)\r\n[ ] Execution Plan의 각 Step에 Input과 Expected Output이 있는가?\r\n[ ] 본문 언어가 3.1 우선순위 규칙을 따르는가?\r\n[ ] 상태가 \"draft\"로 설정되어 있는가?\r\n```\r\n\r\n#### 6.4 실행 결과 (Result) 품질 기준\r\n\r\n| # | 항목 | 필수 여부 | 기준 |\r\n|---|------|-----------|------|\r\n| 1 | 완료 타임스탬프 | 필수 | ISO 8601 |\r\n| 2 | Expected Outcomes 매핑 | 필수 | Plan의 체크리스트와 1:1 대응 |\r\n| 3 | 변경 파일 목록 | 필수 | 파일이 변경된 경우 |\r\n| 4 | 최종 상태 | 필수 | Completed / Failed |\r\n| 5 | 실패 원인 | Failed일 때 필수 | 에러 메시지 또는 원인 설명 |\r\n\r\n---\r\n\r\n## 7. 템플릿 분리 컨벤션\r\n\r\n### 현재 상태\r\n\r\n| 항목 | 현재 규칙 | 문제점 |\r\n|------|-----------|--------|\r\n| Plan 템플릿 | `skills/cp/SKILL.md` 안에 마크다운 코드 블록으로 하드코딩 | 템플릿만 수정하려면 SKILL.md 전체를 편집해야 함. 워크플로우 로직과 템플릿이 혼재 |\r\n| `/cc` 합성 포맷 | `skills/cc/SKILL.md` 안에 ASCII art 박스로 하드코딩 | 동일 문제 |\r\n| 확장 | 불가능 | 사용자가 자신만의 템플릿을 정의할 방법 없음 |\r\n\r\n### 개선된 규칙\r\n\r\n#### 7.1 템플릿 파일 분리 원칙\r\n\r\n```\r\n유지: SKILL.md에는 워크플로우 로직만 기술\r\n분리: 템플릿은 별도 파일로 추출\r\n참조: SKILL.md에서 템플릿 파일 경로를 명시\r\n```\r\n\r\n#### 7.2 템플릿 파일 위치\r\n\r\n```\r\nlens/\r\n├── templates/                    # (신규) 템플릿 파일 디렉토리\r\n│   ├── plan.md                   # /cp 작업계획서 템플릿\r\n│   ├── result.md                 # /cc 실행 결과 합성 템플릿\r\n│   └── execution-result.md       # Plan 파일 하단에 추가하는 결과 섹션 템플릿\r\n├── skills/\r\n│   ├── cp/SKILL.md               # 워크플로우만 (템플릿 → templates/plan.md 참조)\r\n│   └── cc/SKILL.md               # 워크플로우만 (템플릿 → templates/result.md 참조)\r\n```\r\n\r\n#### 7.3 SKILL.md에서의 참조 방식\r\n\r\n```markdown\r\n### 3. Generate Plan Document\r\n\r\nCreate a work plan document using the template at `templates/plan.md`.\r\nRead the template file using the Read tool, fill in all `{placeholder}` values,\r\nand save the result to `.lens/plans/` with the standard file naming convention.\r\n```\r\n\r\n#### 7.4 템플릿 변수 규칙\r\n\r\n템플릿 내 변수는 중괄호 `{variable_name}` 형식:\r\n\r\n| 변수 | 타입 | 설명 |\r\n|------|------|------|\r\n| `{id}` | string | 문서 ID (generatePlanId() 결과) |\r\n| `{created}` | ISO 8601 | 생성 시각 |\r\n| `{status}` | enum | 초기 상태 (`draft`) |\r\n| `{language}` | string | ISO 639-1 코드 |\r\n| `{task}` | string | 사용자 원문 요청 |\r\n| `{skill_table}` | markdown table | 매칭된 스킬 테이블 |\r\n| `{execution_steps}` | markdown | Step별 실행 계획 |\r\n| `{expected_outcomes}` | markdown checklist | 기대 결과 체크리스트 |\r\n| `{risks}` | markdown list | 위험 요소 (선택) |\r\n| `{execution_mode}` | string | Single 또는 Parallel |\r\n\r\n#### 7.5 사용자 커스텀 템플릿 (향후)\r\n\r\n`lens.config.json`에서 커스텀 템플릿 경로 지정:\r\n\r\n```json\r\n{\r\n  \"templates\": {\r\n    \"plan\": \"./my-templates/custom-plan.md\",\r\n    \"result\": null\r\n  }\r\n}\r\n```\r\n\r\n- `null`이면 기본 템플릿 사용\r\n- 지정된 경로의 파일이 없으면 기본 템플릿으로 폴백\r\n\r\n---\r\n\r\n## 8. 에러/실패 기록 컨벤션\r\n\r\n### 현재 상태\r\n\r\n| 항목 | 현재 규칙 | 문제점 |\r\n|------|-----------|--------|\r\n| 스킬 실행 실패 | `/cc`에서 \"note it briefly and continue\" | 기록 형식, 위치 미정의 |\r\n| Agent 에러 | `agent-tracker.js`에 `error` 필드 (최대 500자) | 에이전트 단위 에러만. 문서 단위 에러 없음 |\r\n| Plan 실패 | `Status: Failed`만 기록 | 실패 원인, 재시도 가이드 없음 |\r\n| 부분 성공 | `Status: Partial` | \"어디까지 성공했고 어디서 실패했는지\" 구조화 안 됨 |\r\n\r\n### 개선된 규칙\r\n\r\n#### 8.1 에러 기록 3계층\r\n\r\n```\r\nLevel 1: Agent 에러     → agent-dashboard.json (자동, 훅이 기록)\r\nLevel 2: 문서 에러      → Plan/Result 파일 본문 (구조화된 섹션)\r\nLevel 3: 세션 에러 요약  → plan-state.json의 status + failedAt\r\n```\r\n\r\n#### 8.2 실패 시 Plan 파일에 기록할 내용\r\n\r\n```markdown\r\n---\r\n\r\n## Execution Result / 실행 결과\r\n\r\n> Failed on {YYYY-MM-DDTHH:mm:ss+TZ}\r\n\r\n### Outcomes / 실행 결과 상세\r\n- [x] {성공한 기대 결과} → {실제 결과}\r\n- [ ] {실패한 기대 결과} → **FAILED**: {실패 원인}\r\n\r\n### Error Details / 에러 상세\r\n\r\n| Step | Skill | Status | Error |\r\n|------|-------|--------|-------|\r\n| 1 | /skill-a | Completed | - |\r\n| 2 | /skill-b | **Failed** | `TypeError: Cannot read property 'x' of undefined` |\r\n| 3 | /skill-c | Skipped | Step 2 실패로 미실행 |\r\n\r\n### Recovery Suggestion / 복구 제안\r\n- {구체적인 복구 방법}\r\n- {대안 접근법}\r\n\r\n### Status: Failed\r\n```\r\n\r\n#### 8.3 부분 성공 처리\r\n\r\n- Plan에 3개 Step이 있고, Step 1-2는 성공, Step 3은 실패한 경우:\r\n  - **Status**: `failed` (전체 Plan은 실패)\r\n  - **각 Step 상태**: 개별적으로 Completed/Failed/Skipped 표기\r\n  - **Recovery Suggestion**: 실패한 Step부터 재시도하는 방법 기재\r\n\r\n> **`Partial` 상태 폐지**: 기존 `Partial`은 모호하다. 대신 `failed` 상태 + 본문에서 성공/실패 Step을 명시한다.\r\n\r\n#### 8.4 `/cc` 병렬 실행 실패\r\n\r\n```markdown\r\n### Agent Execution Summary / 에이전트 실행 요약\r\n\r\n| # | Skill | Status | Duration | Error |\r\n|---|-------|--------|----------|-------|\r\n| 1 | /skill-a | Done | 3.2s | - |\r\n| 2 | /skill-b | Error | 1.5s | Timeout after 30s |\r\n| 3 | /skill-c | Done | 5.1s | - |\r\n\r\n### Partial Results Available\r\n{성공한 에이전트들의 결과는 정상 표시. 실패한 에이전트는 \"Error\" 표기 후 이유 명시}\r\n```\r\n\r\n#### 8.5 에러 메시지 형식\r\n\r\n```\r\n에러 메시지는 다음 형식을 따른다:\r\n- 첫 줄: 에러 유형 (TypeError, NetworkError, TimeoutError 등)\r\n- 둘째 줄: 발생 위치 (파일명 + 함수명 또는 스킬명)\r\n- 셋째 줄: 원인 요약 (자연어)\r\n- 최대 500자\r\n```\r\n\r\n---\r\n\r\n## 부록: 현재 → 개선 마이그레이션 요약\r\n\r\n| # | 컨벤션 | 영향받는 파일 | 변경 규모 |\r\n|---|--------|--------------|-----------|\r\n| 1 | 문서 네이밍 | `plan-manager.js`, `skills/cp/SKILL.md` | 중 (파일명 형식 변경, 폴더 추가) |\r\n| 2 | 헤더/메타데이터 | `skills/cp/SKILL.md`, `plan-manager.js` | 대 (YAML 프론트매터 도입) |\r\n| 3 | 다국어 | `skills/cp/SKILL.md`, `skills/cc/SKILL.md` | 소 (규칙 명확화) |\r\n| 4 | 상태 관리 | `plan-manager.js`, `skills/cp/SKILL.md` | 중 (상태 머신 확장) |\r\n| 5 | 문서 연결 | `plan-manager.js`, `skills/cp/SKILL.md` | 중 (프론트매터 참조 추가) |\r\n| 6 | 품질 기준 | `skills/cp/SKILL.md` | 소 (셀프 체크 규칙 추가) |\r\n| 7 | 템플릿 분리 | 신규 `templates/` 디렉토리, `skills/cp/SKILL.md`, `skills/cc/SKILL.md` | 대 (구조 변경) |\r\n| 8 | 에러/실패 | `skills/cp/SKILL.md`, `skills/cc/SKILL.md`, `plan-manager.js` | 중 (실패 기록 구조화) |\r\n\r\n### 구현 우선순위\r\n\r\n```\r\nPhase 1 (즉시): 3. 다국어, 6. 품질 기준 — SKILL.md 텍스트 수정만으로 적용 가능\r\nPhase 2 (단기): 2. 메타데이터, 4. 상태 관리, 8. 에러 기록 — SKILL.md + plan-manager.js 수정\r\nPhase 3 (중기): 1. 네이밍, 5. 문서 연결 — 파일명 형식 변경, 기존 파일과의 호환성 고려\r\nPhase 4 (장기): 7. 템플릿 분리 — 디렉토리 구조 변경, config 확장, SKILL.md 대폭 수정\r\n```\r\n","truncated":false,"stale":false},{"id":"documentation-guide","folder":"rules","title":"Lens 문서화 가이드","date":"","hasMd":true,"hasHtml":false,"mdPath":"rules/documentation-guide.md","htmlPath":null,"mdInline":"# Lens 문서화 가이드\r\n\r\n> lens 프로젝트의 문서 작성 표준 및 체계 정의서\r\n\r\n---\r\n\r\n## 1. 문서 체계 개요\r\n\r\n### 1.1 원칙\r\n\r\nlens의 문서는 **읽는 대상**에 따라 역할이 분리된다.\r\n\r\n| 문서 | 대상 독자 | 핵심 질문 |\r\n|------|-----------|-----------|\r\n| `CLAUDE.md` | Claude (AI 에이전트) | \"이 프로젝트가 뭐고, 뭐가 어디 있지?\" |\r\n| `README.md` | 외부 사용자 (GitHub) | \"이걸 왜 쓰고, 어떻게 설치하지?\" |\r\n| `CHANGELOG.md` | 개발자 / 기여자 | \"뭐가 바뀌었지?\" |\r\n| `plugin.json` | Claude Code 런타임 | \"이 플러그인의 이름, 버전, 메타데이터는?\" |\r\n\r\n**문서 간 정보 중복 금지.** 한 곳에서 정의하고, 나머지는 링크로 참조한다.\r\n\r\n### 1.2 버전 단일 원천 (Single Source of Truth)\r\n\r\n```\r\nplugin.json의 \"version\" 필드 = 프로젝트의 공식 버전\r\n```\r\n\r\n다른 모든 파일에서 버전을 표기할 때는 `plugin.json`의 값을 따른다.\r\n버전을 하드코딩하는 파일 목록:\r\n\r\n| 파일 | 위치 | 형태 |\r\n|------|------|------|\r\n| `.claude-plugin/plugin.json` | `\"version\"` 필드 | **원천** |\r\n| `hooks/hooks.json` | `\"description\"` 문자열 | 참조 |\r\n| `hooks/session-start.js` | `systemMessage` 문자열 | 참조 |\r\n| `skills/c/SKILL.md` | frontmatter `description` | 참조 |\r\n| `skills/cc/SKILL.md` | frontmatter `description` | 참조 |\r\n| `skills/cp/SKILL.md` | frontmatter `description` | 참조 |\r\n| `lens.config.json` | `\"version\"` 필드 | 참조 |\r\n\r\n릴리스 시 위 파일들의 버전 문자열을 **일괄 업데이트**한다.\r\n\r\n---\r\n\r\n## 2. CLAUDE.md 작성 규칙\r\n\r\n### 2.1 목적\r\n\r\nClaude가 이 파일 **하나만 읽으면** lens 전체를 파악할 수 있어야 한다.\r\n세션 시작 시 자동으로 로드되므로, 가장 중요한 문서다.\r\n\r\n### 2.2 구조 (필수 섹션, 순서 고정)\r\n\r\n```markdown\r\n# lens — [한 줄 정의]\r\n\r\n## 버전\r\n- 현재: vX.Y.Z\r\n- 마지막 업데이트: YYYY-MM-DD\r\n\r\n## 스킬\r\n| 스킬 | 설명 | 워크플로우 |\r\n(각 스킬의 핵심 동작을 1-2줄로)\r\n\r\n## 훅\r\n| 훅 | 이벤트 | 파일 | 설명 |\r\n(5개 훅 전체, 트리거 조건 포함)\r\n\r\n## 라이브러리 (lib/)\r\n| 모듈 | 파일 | 핵심 함수 | 설명 |\r\n(각 모듈의 주요 export 함수 나열)\r\n\r\n## 폴더 구조\r\n(전체 파일 트리 + 각 파일 한 줄 역할)\r\n\r\n## 설정\r\n| 옵션 | 기본값 | 설명 |\r\n(lens.config.json 옵션 전체)\r\n\r\n## 감지 대상\r\n| 타입 | 감지 방법 | 예시 |\r\n(Skill, MCP, LSP, Hybrid)\r\n\r\n## 알려진 이슈 / TODO\r\n(현재 알려진 버그나 미완성 항목)\r\n\r\n## 변경 이력 요약\r\n(최근 2-3개 버전만 한 줄씩. 상세는 CHANGELOG.md 참조)\r\n```\r\n\r\n### 2.3 작성 규칙\r\n\r\n| 규칙 | 설명 |\r\n|------|------|\r\n| **200줄 이내** | Claude의 자동 메모리 파일은 200줄 이후 잘림. 반드시 지킨다 |\r\n| **코드 블록 금지** | 구현 코드를 넣지 않는다. 파일 경로와 함수명만 표기 |\r\n| **테이블 우선** | 산문보다 테이블이 정보 밀도가 높다. 가능하면 테이블 사용 |\r\n| **링크로 위임** | 상세 내용은 `CHANGELOG.md`, `README.md`, 소스코드로 링크 |\r\n| **현재 상태만** | 과거 히스토리는 CHANGELOG에. CLAUDE.md는 \"지금\" 상태만 기술 |\r\n| **파일 역할 전수 기록** | 새 파일 추가 시 반드시 폴더 구조 섹션에 반영 |\r\n\r\n### 2.4 업데이트 시점\r\n\r\n- 새 파일 추가/삭제 시\r\n- 새 스킬 또는 훅 추가 시\r\n- 버전 릴리스 시\r\n- 설정 옵션 변경 시\r\n\r\n---\r\n\r\n## 3. README.md 작성 규칙\r\n\r\n### 3.1 목적\r\n\r\nGitHub에서 lens을 발견한 **외부 사용자**가 5분 안에 설치하고 사용할 수 있게 한다.\r\n\r\n### 3.2 구조 (필수 섹션, 순서 고정)\r\n\r\n```markdown\r\n# Lens\r\n\r\n[한 줄 소개]\r\n\r\n## The Problem\r\n(왜 이 플러그인이 필요한지)\r\n\r\n## The Solution\r\n(사용 예시 — 코드 블록으로)\r\n\r\n## Installation\r\n(3가지 옵션: GitHub clone, curl, local plugin)\r\n\r\n## Usage\r\n### /c — [설명]\r\n### /cc — [설명]\r\n(사용 예시 테이블)\r\n\r\n## How It Works\r\n(각 스킬의 워크플로우 — 번호 리스트로)\r\n\r\n## Features\r\n(불릿 리스트)\r\n\r\n## Configuration\r\n(lens.config.json 옵션 테이블)\r\n\r\n## Requirements\r\n\r\n## License\r\n```\r\n\r\n### 3.3 작성 규칙\r\n\r\n| 규칙 | 설명 |\r\n|------|------|\r\n| **내부 구현 상세 없음** | 아키텍처, 파일 구조, 함수명 등은 README에 넣지 않는다 |\r\n| **설치가 최우선** | Installation 섹션은 반드시 Usage 전에 온다 |\r\n| **복사-붙여넣기 가능** | 설치 명령어는 그대로 복사해서 터미널에 붙여넣을 수 있어야 한다 |\r\n| **스크린샷/예시 우선** | \"어떻게 보이는지\"를 먼저 보여주고 설명은 뒤에 |\r\n| **버전 하드코딩 금지** | README 본문에 버전 번호를 넣지 않는다 (금방 낡음) |\r\n\r\n### 3.4 README에 넣지 않는 것\r\n\r\n- 파일별 역할 설명 (→ `CLAUDE.md`)\r\n- 버전별 변경 이력 (→ `CHANGELOG.md`)\r\n- 훅 상세 동작 원리 (→ `CLAUDE.md`)\r\n- 라이브러리 모듈 API (→ 소스코드 JSDoc)\r\n\r\n---\r\n\r\n## 4. CHANGELOG.md 작성 규칙\r\n\r\n### 4.1 목적\r\n\r\n모든 버전의 변경사항을 **누락 없이** 기록한다.\r\n코드의 실제 상태와 항상 일치해야 한다.\r\n\r\n### 4.2 형식 (Keep a Changelog 기반)\r\n\r\n```markdown\r\n## [X.Y.Z] - YYYY-MM-DD\r\n\r\n### Added (vX.Y.Z)\r\n- **기능명** — 설명. `관련파일.js`\r\n\r\n### Changed (vX.Y.Z)\r\n- **변경 대상** — 무엇이 어떻게 바뀌었는지. `관련파일.js`\r\n\r\n### Fixed (vX.Y.Z)\r\n- **버그명** — 무엇이 어떻게 고쳐졌는지. `관련파일.js`\r\n\r\n### Removed (vX.Y.Z)\r\n- **제거 대상** — 왜 제거했는지\r\n```\r\n\r\n### 4.3 작성 규칙\r\n\r\n| 규칙 | 설명 |\r\n|------|------|\r\n| **최신 버전이 맨 위** | 역순 시간순 (newest first) |\r\n| **관련 파일 명시** | 각 항목 끝에 백틱으로 파일명 표기 |\r\n| **카테고리 태그** | Added, Changed, Fixed, Removed 중 해당하는 것만 사용 |\r\n| **버전 태그 표기** | 각 카테고리 제목에 `(vX.Y.Z)` 붙여서 접혀도 구분 가능 |\r\n| **커밋과 1:1** | 하나의 릴리스 커밋 = 하나의 CHANGELOG 엔트리 |\r\n\r\n### 4.4 CHANGELOG에 넣지 않는 것\r\n\r\n- 미래 계획 (→ TODO나 Issues)\r\n- 사용법 설명 (→ `README.md`)\r\n- 아키텍처 결정 이유 (→ `CLAUDE.md` 또는 커밋 메시지)\r\n\r\n---\r\n\r\n## 5. plugin.json 작성 규칙\r\n\r\n### 5.1 목적\r\n\r\nClaude Code 런타임이 읽는 메타데이터 + **버전의 단일 원천**.\r\n\r\n### 5.2 필수 필드\r\n\r\n```json\r\n{\r\n  \"name\": \"lens\",\r\n  \"version\": \"X.Y.Z\",\r\n  \"description\": \"[/c와 /cc의 핵심 기능을 포함한 50단어 이내 설명]\",\r\n  \"author\": {\r\n    \"name\": \"Lens\",\r\n    \"email\": \"livevil7@gmail.com\",\r\n    \"url\": \"https://github.com/CreetaCorp/lens\"\r\n  },\r\n  \"repository\": \"https://github.com/CreetaCorp/lens\",\r\n  \"license\": \"MIT\",\r\n  \"keywords\": [...]\r\n}\r\n```\r\n\r\n### 5.3 규칙\r\n\r\n| 규칙 | 설명 |\r\n|------|------|\r\n| **description에 버전 넣지 않음** | description은 기능 설명만. 버전은 version 필드에 |\r\n| **keywords 최신 유지** | 새 기능 추가 시 관련 키워드도 추가 |\r\n\r\n---\r\n\r\n## 6. 소스코드 내 문서화 규칙\r\n\r\n### 6.1 파일 헤더 주석\r\n\r\n모든 `.js` 파일 첫 줄에 역할 설명:\r\n\r\n```javascript\r\n/**\r\n * Lens - [모듈명]\r\n * [한 줄 설명]\r\n */\r\n```\r\n\r\n### 6.2 함수 JSDoc\r\n\r\nexport되는 함수에만 JSDoc 작성:\r\n\r\n```javascript\r\n/**\r\n * [한 줄 설명]\r\n * @param {Type} name - 설명\r\n * @returns {Type} 설명\r\n */\r\n```\r\n\r\n### 6.3 버전 문자열\r\n\r\n소스코드 내 버전 문자열은 `plugin.json`을 런타임에 읽는 것이 이상적이나,\r\n현재는 하드코딩되어 있으므로 릴리스 체크리스트에서 일괄 업데이트한다.\r\n\r\n---\r\n\r\n## 7. 릴리스 체크리스트\r\n\r\n새 버전 릴리스 시 반드시 수행:\r\n\r\n```\r\n[ ] 1. plugin.json \"version\" 업데이트\r\n[ ] 2. hooks.json \"description\" 버전 문자열 업데이트\r\n[ ] 3. session-start.js systemMessage 버전 문자열 업데이트\r\n[ ] 4. skills/c/SKILL.md description 버전 문자열 업데이트\r\n[ ] 5. skills/cc/SKILL.md description 버전 문자열 업데이트 (해당 시)\r\n[ ] 6. skills/cp/SKILL.md description 버전 문자열 업데이트 (해당 시)\r\n[ ] 7. lens.config.json \"version\" 업데이트\r\n[ ] 8. CHANGELOG.md에 새 버전 엔트리 추가\r\n[ ] 9. CLAUDE.md 버전 + 변경사항 반영\r\n[ ] 10. README.md 변경사항 반영 (사용자에게 영향 있는 경우만)\r\n[ ] 11. git commit + tag + push\r\n[ ] 12. GitHub Release 생성\r\n```\r\n\r\n---\r\n\r\n## 8. 문서 흐름도\r\n\r\n```\r\n                    ┌─────────────────────┐\r\n                    │    plugin.json       │\r\n                    │  (버전 단일 원천)     │\r\n                    └──────────┬──────────┘\r\n                               │\r\n              ┌────────────────┼────────────────┐\r\n              │                │                │\r\n              ▼                ▼                ▼\r\n     ┌────────────┐   ┌──────────────┐   ┌───────────┐\r\n     │  CLAUDE.md  │   │  README.md   │   │ CHANGELOG │\r\n     │ (AI 브리핑) │   │ (사용자 가이드)│   │ (변경 이력)│\r\n     └──────┬─────┘   └──────────────┘   └───────────┘\r\n            │\r\n            │ Claude가 세션 시작 시 읽음\r\n            │\r\n            ▼\r\n     ┌─────────────────────────────┐\r\n     │  소스코드 (필요시만 읽기)     │\r\n     │  hooks/, lib/, scripts/,    │\r\n     │  skills/                    │\r\n     └─────────────────────────────┘\r\n```\r\n\r\n**Claude 읽기 순서**: `CLAUDE.md` (필수) → `CHANGELOG.md` (필요시) → 소스코드 (수정 시)\r\n**사용자 읽기 순서**: `README.md` (필수) → `CHANGELOG.md` (업데이트 확인 시)\r\n","truncated":false,"stale":false},{"id":"live-research","folder":"rules","title":"Live Research substrate (agent-reach + insane-search)","date":"","hasMd":true,"hasHtml":false,"mdPath":"rules/live-research.md","htmlPath":null,"mdInline":"# Live Research substrate (agent-reach + insane-search)\n\n> Lens 스킬(`/cpp` S2, `/cr`)이 \"현재 라이브 정보\"(최신 릴리즈·트렌드·이슈·커뮤니티 반응)를 가져오는 표준 경로.\n> 도구 미설치 시 폴백까지 규정. **SoT — 스킬은 이 문서를 참조만 한다**(호출법을 각자 재구현하지 않는다).\n\n이 문서는 순수 규칙 문서다. Lens 는 `agent-reach`·`insane-search` 를 **강제 설치하지 않는다** — \"있으면 쓰고 없으면 폴백\"만 규정한다. 두 도구는 Lens 외부 플러그인이므로, 미설치가 \"실패\"가 아니라 \"폴백\"이 되어야 한다.\n\n---\n\n## 0. 감지 (호출 전 1회)\n\n라이브 조사 단계에 들어가면, 스킬은 **먼저 아래를 판정**해 어느 경로를 쓸지 고른다.\n\n### agent-reach (무키 라이브 채널)\n\n```bash\n# PATH 우선, 없으면 표준 설치 경로 확인\ncommand -v agent-reach \\\n  || ls ~/.agent-reach-venv/Scripts/agent-reach.exe   # Windows\n  # unix:  ls ~/.agent-reach-venv/bin/agent-reach\n```\n\n- Windows: `~/.agent-reach-venv/Scripts/agent-reach.exe`\n- unix(macOS/Linux): `~/.agent-reach-venv/bin/agent-reach`\n- 또는 PATH 에 `agent-reach` 가 잡히면 그대로 사용.\n\n감지되면 **채널별 백엔드 상태**를 확인한다(무키 6~7채널만 즉시 가용, 나머지는 인증 필요):\n\n```bash\nagent-reach doctor --json\n```\n\n→ 각 플랫폼의 `active_backend` 로 지금 어떤 채널이 살아 있는지 확인 후 호출표(§1)를 고른다.\n\n### insane-search (WAF 우회 fetch)\n\n- 플러그인 스킬 존재로 감지: 세션의 스킬 목록에 `insane-search` 가 있는지, 또는\n  ```bash\n  ls ~/.claude/plugins/cache/*/insane-search/*/ 2>/dev/null\n  ```\n- 있으면 `python -m engine \"<URL>\"` 사용 가능(§2).\n\n### 판정\n\n- 둘 다 감지 → §1·§2 직접 명령 사용.\n- 하나만 감지 → 있는 것만 쓰고, 없는 쪽은 §3 폴백.\n- **둘 다 없음 → §3 폴백 모드로 진행**(절대 멈추지 않음).\n\n---\n\n## 1. 라이브 채널 (agent-reach)\n\n감지되면 아래 실측 명령을 쓴다. 로그인 채널·재시도 체인 등 복잡한 라우팅은 **agent-reach 스킬에 위임**한다(그쪽 `references/*.md` 가 관리 — 여기서 재구현하지 않는다).\n\n| 의도 | 명령 |\n|------|------|\n| 시맨틱 웹검색(트렌드·최신) | `mcporter call 'exa.web_search_exa(query: \"...\", numResults: 5)'` |\n| 웹페이지 읽기(마크다운화) | `curl -s \"https://r.jina.ai/<URL>\"` |\n| GitHub 리포/이슈/PR | `gh search repos \"q\" --sort updated --limit N` / `gh search issues \"q\" --limit N` |\n| YouTube 자막 | `yt-dlp --write-auto-sub --sub-lang \"ko,en\" --skip-download -o \"/tmp/%(id)s\" \"<URL>\"` → 생성된 json3/vtt 파싱 |\n| V2EX 핫 토픽 | `curl -s https://www.v2ex.com/api/topics/hot.json -H \"User-Agent: lens/1.0\"` |\n| RSS/Atom 피드 | `curl -s \"<feed_url>\"` 후 항목 파싱 |\n| 플랫폼 라우팅 일반(小红书·트위터/X·B站·Reddit·LinkedIn 등) | **agent-reach 스킬에 위임** — 채널별 백엔드·재시도 체인은 그쪽이 관리 |\n\n## 2. 차단 우회 fetch (insane-search)\n\nWebFetch 가 402/403/blocked 를 반환하거나 WAF/봇 차단이 있는 특정 공개 URL 은:\n\n```bash\npython -m engine \"<URL>\"\n```\n\n- yt-dlp·Jina Reader·공개 API·WAF-프로파일 fetch 체인(TLS impersonation, 모바일 URL 변환, 실제 Chrome)을 자동으로 순차 시도한다.\n- **§6 안전 한계를 반드시 지킨다**(페이월·로그인 우회 금지 등).\n\n---\n\n## 3. 폴백 (도구 없을 때)\n\n미설치는 **실패가 아니라 폴백**이다. 조용히 대체하고, 조사보고에 한 줄만 남긴다.\n\n- **agent-reach 없음** → `deep-research` 스킬(있으면) → 없으면 네이티브 `WebSearch` / `WebFetch`.\n- **insane-search 없음** → `WebFetch` → 막히면 Jina Reader(`curl -s \"https://r.jina.ai/<URL>\"`).\n\n폴백을 탄 경우 조사보고에 다음 한 줄을 남긴다:\n\n> 라이브 채널 없음(폴백: `<대체 수단>`)\n\n절대 **\"라이브 조사 실패\"로 멈추지 않는다.** 최선의 폴백 수단으로 계속 진행하고, 어떤 경로를 썼는지만 명시한다.\n\n---\n\n## 4. 신선도 규율\n\n라이브 데이터는 \"지금 참인가\"가 핵심이다.\n\n- 라이브 인용은 **출처 URL + 발행일**을 병기한다.\n- 발행일이 오래된 소스는 \"라이브 아님\"으로 표기한다(오래된 정보를 최신 신호로 오인하지 않도록).\n- 발행일을 못 구하면 \"발행일 불명\"으로 명시하고, 라이브 신호로 단정하지 않는다.\n\n---\n\n## 5. 누가 참조하나\n\n이 문서를 참조하는 스킬:\n\n- **`/cpp`** — S2(전방위 fan-out 조사)의 축③ 라이브 신호 조사.\n- **`/cr`** — creeta research(라이브 다각도 딥리서치).\n\n스킬을 추가하거나 참조 방식을 바꿀 때 **이 목록을 갱신한다.** 새 Lens 스킬이 라이브 데이터를 필요로 하면, 호출법을 재발명하지 말고 이 문서만 참조한다(agent-reach 채널이 늘면 §1 표 한 곳만 갱신).\n\n---\n\n## 6. 안전 한계 (insane-search)\n\n`insane-search`(`python -m engine`)는 **접근이 막힌 정당한 공개 정보를 조회**하기 위한 도구다. 우회 능력을 오남용하지 않는다.\n\n- **(a) 로그인/유료 페이월 우회 금지** — 인증·결제 뒤의 콘텐츠를 강제로 뚫지 않는다.\n- **(b) robots·ToS 위반 대량 크롤 금지** — 사이트 정책을 무시한 대량 수집 금지.\n- **(c) 개인정보·비공개 리소스 조회 금지** — 공개 의도가 없는 데이터는 다루지 않는다.\n- **(d) 실패는 terminal 로 인정** — `auth_required` / `paywall` / `404` 등은 최종 실패로 받아들이고 멈춘다. **무한 재시도 금지.**\n\n---\n\n## 셸 규칙 (Windows cp949 함정)\n\n- **한글 content 를 셸에 직접 넣지 않는다** — Windows cp949 인코딩에서 깨진다. `--data-binary @file` 또는 파일 경유로 전달한다.\n- 임시 파일은 `/tmp/` 에 둔다(예: `-o \"/tmp/%(id)s\"`).\n- 큰 본문·자막은 파일로 받아 파싱한다(셸 인라인 금지).\n","truncated":false,"stale":false},{"id":"publishing-guide","folder":"rules","title":"Lens Publishing Guide","date":"","hasMd":true,"hasHtml":false,"mdPath":"rules/publishing-guide.md","htmlPath":null,"mdInline":"# Lens Publishing Guide\r\n\r\n플러그인 배포 및 등록 가이드.\r\n\r\n## 1. Anthropic 공식 디렉토리\r\n\r\n**공식 레포**: [anthropics/claude-plugins-official](https://github.com/anthropics/claude-plugins-official)\r\n\r\n### 제출 방법\r\n\r\n**제출 폼** 사용 (권장): https://clau.de/plugin-directory-submission\r\n\r\n제출 후 Anthropic 심사를 거쳐 `external_plugins/lens/` 폴더로 등록됨.\r\n\r\n### 등록 후 설치 방법 (유저)\r\n\r\n```bash\r\n# 방법 1: 직접 설치\r\n/plugin install lens@claude-plugin-directory\r\n\r\n# 방법 2: Discover 탭에서 검색\r\n/plugin > Discover > \"lens\"\r\n```\r\n\r\n## 2. 커뮤니티 등록\r\n\r\n| 대상 | Stars | 제출 방법 |\r\n|------|-------|-----------|\r\n| [hesreallyhim/awesome-claude-code](https://github.com/hesreallyhim/awesome-claude-code) | 25k+ | PR → Plugin 섹션에 추가 |\r\n| [ccplugins/awesome-claude-code-plugins](https://github.com/ccplugins/awesome-claude-code-plugins) | 500+ | PR → Productivity 카테고리 |\r\n| [obra/superpowers-marketplace](https://github.com/obra/superpowers-marketplace) | 500+ | marketplace.json PR |\r\n\r\n### PR 템플릿 (awesome list)\r\n\r\n```markdown\r\n- [lens](https://github.com/CreetaCorp/lens) - Skill navigator for Claude Code. Scans all plugins, recommends the best match, and executes — single (/c), parallel (/cc), or plan-first (/cp). 8 languages.\r\n```\r\n\r\n## 3. 독립 마켓플레이스 (현재 방식)\r\n\r\n유저가 직접 레포를 마켓플레이스로 추가:\r\n\r\n```bash\r\n# 마켓플레이스 추가\r\n/plugin marketplace add CreetaCorp/lens\r\n\r\n# 플러그인 설치\r\n/plugin install lens@CreetaCorp\r\n```\r\n\r\n## 4. --plugin-dir (개발용)\r\n\r\n```bash\r\ngit clone https://github.com/CreetaCorp/lens.git\r\nclaude --plugin-dir ./lens\r\n```\r\n\r\n캐시 없이 디렉토리에서 직접 로드. 개발/테스트 전용.\r\n","truncated":false,"stale":false},{"id":"release-guide","folder":"rules","title":"Lens Release Guide","date":"","hasMd":true,"hasHtml":false,"mdPath":"rules/release-guide.md","htmlPath":null,"mdInline":"# Lens Release Guide\r\n\r\n버전 업데이트 시 반드시 이 문서를 따른다.\r\n\r\n## 1. SemVer 규칙\r\n\r\n`MAJOR.MINOR.PATCH` (예: 1.7.1)\r\n\r\n| 변경 유형 | 버전 | 예시 |\r\n|-----------|------|------|\r\n| 하위호환 깨는 변경 | MAJOR 올림 | 스킬 이름 변경, 훅 인터페이스 변경, 설정 키 삭제 |\r\n| 새 기능 추가 | MINOR 올림 | 새 스킬 (`/cp`), 새 훅, 새 lib 모듈, 새 config 옵션 |\r\n| 버그 수정, 문서 개선 | PATCH 올림 | 정규식 수정, 오타 수정, 경로 통일, 기존 기능 보강 |\r\n\r\n### 판단 기준\r\n\r\n- 새 파일 추가 → MINOR 이상\r\n- 기존 파일만 수정 → PATCH\r\n- `plugin.json`이나 `hooks.json` 구조 변경 → MAJOR\r\n- CHANGELOG에 \"Added\" 섹션이 있으면 → MINOR 이상\r\n- CHANGELOG에 \"Fixed\"/\"Changed\"만 있으면 → PATCH\r\n\r\n## 2. 버전이 기록된 파일 (13곳 — `scripts/bump-version.sh` 가 일괄 처리)\r\n\r\n**모든 파일을 동시에 같은 버전으로 업데이트해야 한다.** 수동 대신 **`bash scripts/bump-version.sh <X.Y.Z>`** 를 쓰면 아래 13파일을 자동 범프하고 stale 검증까지 한다.\r\n\r\n| # | 파일 | 위치 | 형식 |\r\n|---|------|------|------|\r\n| 1 | `.claude-plugin/plugin.json` | `\"version\": \"X.Y.Z\"` | JSON value |\r\n| 2 | `.claude-plugin/marketplace.json` | `\"version\": \"X.Y.Z\"` + `\"ref\": \"vX.Y.Z\"` | JSON value (2곳) |\r\n| 3 | `hooks/hooks.json` | `\"description\": \"Lens vX.Y.Z — ...\"` | 문자열 내 버전 |\r\n| 4 | `hooks/session-start.js` | `Lens vX.Y.Z activated` (4곳) | 문자열 리터럴 |\r\n| 5 | `skills/c/SKILL.md` | `Lens vX.Y.Z` (description + table, 2곳) | YAML + Markdown |\r\n| 6 | `skills/cc/SKILL.md` | `Lens Multi vX.Y.Z` (description + table, 2곳) | YAML + Markdown |\r\n| 7 | `skills/cp/SKILL.md` | `Lens Plan vX.Y.Z` (description + table, 2곳) | YAML + Markdown |\r\n| 8 | `skills/cpp/SKILL.md` | `Lens Power Plan vX.Y.Z` (description + table, 2곳) | YAML + Markdown |\r\n| 9 | `skills/ccp/SKILL.md` | `Lens Power Verify vX.Y.Z` (description + table, 2곳) | YAML + Markdown |\r\n| 10 | `skills/cs/SKILL.md` | `Lens Sync vX.Y.Z` + `currently X.Y.Z` | YAML + Markdown |\r\n| 11 | `CLAUDE.md` | `Current: **vX.Y.Z**` + `Updated: YYYY-MM-DD` + Recent Changes | Markdown |\r\n| 12 | `README.md` | `# Lens vX.Y.Z` (title) | Markdown |\r\n| 13 | `CHANGELOG.md` | `## [X.Y.Z] - YYYY-MM-DD` 섹션 추가 | Markdown |\r\n\r\n### 검색 명령어 (빠뜨린 곳 확인)\r\n\r\n```bash\r\n# 현재 버전 문자열이 모든 파일에 있는지 확인\r\ngrep -rn \"v1.7.1\" --include=\"*.json\" --include=\"*.js\" --include=\"*.md\" .\r\n\r\n# 이전 버전이 남아있는지 확인 (0건이어야 정상)\r\ngrep -rn \"v1.7.0\" --include=\"*.json\" --include=\"*.js\" --include=\"*.md\" . | grep -v CHANGELOG | grep -v \"Recent Changes\" | grep -v docs/\r\n```\r\n\r\n## 3. 릴리스 절차 (Step by Step)\r\n\r\n### Step 1: 코드 변경 완료\r\n\r\n모든 기능 구현/버그 수정을 먼저 커밋한다. 버전 범프 커밋과 코드 변경 커밋을 **분리**한다.\r\n\r\n```bash\r\n# 코드 변경 커밋 (예시)\r\ngit add lib/plan-manager.js skills/cp/SKILL.md\r\ngit commit -m \"fix: updatePlanStatus regex safety\"\r\n```\r\n\r\n### Step 2: CHANGELOG.md 작성\r\n\r\n파일 **맨 위**에 새 버전 섹션을 추가한다.\r\n\r\n```markdown\r\n## [X.Y.Z] - YYYY-MM-DD\r\n\r\n### Added (vX.Y.Z)\r\n- (MINOR일 때만) 새로 추가된 기능\r\n\r\n### Changed (vX.Y.Z)\r\n- 기존 기능의 변경사항\r\n\r\n### Fixed (vX.Y.Z)\r\n- 수정된 버그\r\n\r\n### Removed (vX.Y.Z)\r\n- (있을 때만) 삭제된 기능\r\n```\r\n\r\n규칙:\r\n- 각 항목은 **굵은 제목** + 설명 + 해당 파일명\r\n- Added/Changed/Fixed/Removed 순서\r\n- 해당 없는 섹션은 생략\r\n\r\n### Step 3: 13곳 버전 범프 (자동 권장)\r\n\r\n`bash scripts/bump-version.sh <X.Y.Z>` 로 위 표의 13개 파일을 일괄 업데이트한다(수동 시 누락 위험).\r\n\r\n**주의사항**:\r\n- `marketplace.json`은 `version`과 `source.ref` 2곳 모두 변경\r\n- `session-start.js`는 4곳 (`activated` 메시지 2개 + `Session Startup` 제목 2개)\r\n- 각 SKILL.md는 YAML description + table description 2곳\r\n- `CLAUDE.md`는 Version 섹션 + Recent Changes 섹션\r\n\r\n### Step 4: 버전 범프 커밋\r\n\r\n```bash\r\ngit add -A\r\ngit commit -m \"chore: bump version to vX.Y.Z\"\r\n```\r\n\r\n커밋 메시지 규칙: `chore: bump version to vX.Y.Z` (항상 이 형식)\r\n\r\n### Step 5: Git 태그\r\n\r\n```bash\r\ngit tag vX.Y.Z\r\n```\r\n\r\n- 접두사 `v` 필수 (v1.7.1, v2.0.0)\r\n- 태그는 반드시 버전 범프 커밋에 생성\r\n\r\n### Step 6: Push\r\n\r\n```bash\r\ngit push origin master --tags\r\n```\r\n\r\n- `--tags` 플래그 필수. 없으면 태그가 remote에 안 올라감\r\n- 커밋과 태그를 한 번에 push\r\n\r\n### Step 7: GitHub Release\r\n\r\n```bash\r\ngh release create vX.Y.Z \\\r\n  --title \"vX.Y.Z — 릴리스 제목\" \\\r\n  --latest \\\r\n  --notes \"$(cat <<'EOF'\r\n## Added\r\n- ...\r\n\r\n## Fixed\r\n- ...\r\n\r\n**Released**: YYYY-MM-DD\r\nEOF\r\n)\"\r\n```\r\n\r\n규칙:\r\n- `--latest` 플래그: 최신 릴리스로 마킹 (가장 최근 버전에만)\r\n- Release notes는 CHANGELOG.md의 해당 버전 섹션과 동일\r\n- 릴리스 제목: `vX.Y.Z — 핵심 기능 요약` (예: `v1.7.0 — /cp Plan-First Execution`)\r\n\r\n## 4. 과거 실수 사례 & 방지책\r\n\r\n| 실수 | 결과 | 방지책 |\r\n|------|------|--------|\r\n| 태그 안 만듦 | 원격에 버전 추적 불가 | Step 5 필수 |\r\n| `--tags` 빼고 push | 태그가 로컬에만 존재 | Step 6 명령어 복사해서 사용 |\r\n| GitHub Release 안 만듦 | 유저가 변경사항 확인 불가 | Step 7 필수 |\r\n| `session-start.js` 누락 | 세션 시작 시 구버전 표시 | 4곳 모두 grep으로 확인 |\r\n| `marketplace.json` ref 미갱신 | 유저가 구버전 설치 | `source.ref` 확인 |\r\n| 코드 변경과 버전 범프 한 커밋 | 태그가 코드 변경+범프 섞임 | 분리 커밋 |\r\n\r\n## 5. 캐시 관련 주의사항\r\n\r\nClaude Code는 **버전 번호**로 플러그인 캐시를 관리한다.\r\n\r\n- 코드를 변경했지만 버전을 안 올리면 → 기존 유저는 **변경사항을 못 봄**\r\n- 캐시 경로: `~/.claude/plugins/cache/CreetaCorp/lens/{version}/`\r\n- 수동 캐시 삭제: `rm -rf ~/.claude/plugins/cache/CreetaCorp/lens/`\r\n- 개발 중에는 `claude --plugin-dir ./lens`으로 캐시 우회\r\n\r\n## 6. 버전 검증 체크리스트\r\n\r\n릴리스 후 아래를 확인한다:\r\n\r\n```bash\r\n# 1. 로컬 태그 확인\r\ngit tag -l | tail -3\r\n\r\n# 2. 원격 태그 확인\r\ngh api repos/CreetaCorp/lens/tags --jq '.[].name' | head -5\r\n\r\n# 3. GitHub Releases 확인\r\ngh release list | head -5\r\n\r\n# 4. origin과 동기화 확인\r\ngit status\r\n\r\n# 5. 구버전 잔존 확인 (CHANGELOG/docs 제외, 0건이어야 함)\r\ngrep -rn \"vOLD_VERSION\" --include=\"*.json\" --include=\"*.js\" skills/ hooks/ .claude-plugin/ | grep -v node_modules\r\n```\r\n","truncated":false,"stale":false}]}};

  const $ = (s, p = document) => p.querySelector(s);
  const $$ = (s, p = document) => Array.from(p.querySelectorAll(s));
  const el = (tag, attrs, ...children) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;        // always textContent — never innerHTML
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else if (v !== undefined && v !== null) e.setAttribute(k, v);
    }
    for (const c of children) {
      if (c == null) continue;
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return e;
  };

  const GROUP_LABELS = { tasks: "Tasks", history: "History", rules: "Rules" };
  const GROUP_ORDER = ["tasks", "history", "rules"];

  const repo = BOARD.repo || "repo";
  const groups = BOARD.groups || { tasks: [], history: [], rules: [] };
  let viewing = null;     // active doc id
  let filterText = "";

  // index docs by id for O(1) lookup
  const byId = {};
  for (const g of GROUP_ORDER) for (const d of (groups[g] || [])) byId[d.id] = d;
  const total = GROUP_ORDER.reduce((n, g) => n + (groups[g] || []).length, 0);

  // ── header ──
  $("#repo-name").textContent = repo;
  $("#repo-name").appendChild(el("span", { class: "dim", text: " / docs" }));

  // ── render board ──
  function renderBoard() {
    const f = filterText.trim().toLowerCase();
    let shown = 0;
    for (const g of GROUP_ORDER) {
      const all = groups[g] || [];
      const docs = f ? all.filter(d => (d.title || d.id).toLowerCase().includes(f)) : all;

      wrap.replaceChildren();

    const statsEl = $("#stats");

  }

    const meta = el("div", { class: "meta-row" });

    const doc = byId[viewing];
    if (!doc) { closePanel(); return; }

    $("#p-id").textContent = doc.id + (doc.date ? "  ·  " + doc.date : "") + "  ·  " + (GROUP_LABELS[doc.folder] || doc.folder);
    $("#p-title").textContent = doc.title || doc.id;

    // actions: "Open in new tab" for html docs, "Convert to HTML" for md-only
    const actions = $("#p-actions");
    actions.replaceChildren();
    if (doc.hasHtml && doc.htmlPath) {
      actions.appendChild(el("button", {
        class: "ghost",
        text: "Open in new tab",
        onclick: () => window.open(doc.htmlPath, "_blank", "noopener"),
      }));
    } else {
      actions.appendChild(el("button", {
        class: "primary",
        text: "Convert to HTML",
        onclick: () => convert(doc),
      }));
    }
    actions.appendChild(el("button", { class: "ghost", text: "close", onclick: closePanel }));

    // notes (truncated md)
    const notes = $("#p-notes");
    notes.replaceChildren();
    if (doc.truncated) {
      const span = el("span", { class: "trunc" });
      span.appendChild(document.createTextNode("⚠ truncated — "));
      if (doc.mdPath) {
        span.appendChild(el("a", { href: doc.mdPath, target: "_blank", rel: "noopener", text: "open original" }));
      } else {
        span.appendChild(document.createTextNode("open original"));
      }
      notes.appendChild(span);
    }

    // body: iframe for html report, raw md (textContent) otherwise
    const body = $("#p-body");
    body.replaceChildren();
    if (doc.hasHtml && doc.htmlPath) {
      body.appendChild(el("iframe", {
        class: "report-frame",
        src: doc.htmlPath,
        title: doc.title || doc.id,
        loading: "lazy",
      }));
    } else {
      const scroll = el("div", { class: "md-scroll" });
      const pre = el("pre", { class: "md-pre" });
      // HARD SECURITY REQUIREMENT: md is untrusted — render via textContent ONLY.
      pre.textContent = doc.mdInline || "(empty)";
      scroll.appendChild(pre);
      body.appendChild(scroll);
    }
  }

  // ── convert to html (clipboard + fallback) ──
  function convert(doc) {
    const cmd = "/cp html docs/" + doc.mdPath;
    const ok = () => toast("Command copied — paste into Claude Code:", cmd);
    const fail = () => openModal(cmd);
    // file:// is not a secure context — navigator.clipboard is blocked there and
    // writeText can hang silently. Gate on isSecureContext so file:// goes straight
    // to the modal (which shows the command for manual copy).
    if (window.isSecureContext && navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(cmd).then(ok, fail);
    } else {
      fail();
    }
  }

  // ── toast ──
  function toast(msg, cmd, ms = 4000) {
    const t = $("#toast");
    t.replaceChildren(document.createTextNode(msg));
    if (cmd) {
      t.appendChild(document.createElement("br"));
      t.appendChild(el("span", { class: "cmd", text: cmd }));
    }
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove("show"), ms);
  }

  // ── modal (manual copy fallback — must NOT look successful) ──
  function openModal(cmd) {
    const ta = $("#modal-cmd");
    ta.value = cmd;
    $("#modal-scrim").classList.add("open");
    ta.focus();
    ta.select();
    try { ta.setSelectionRange(0, cmd.length); } catch (_) {}
  }
  function closeModal() { $("#modal-scrim").classList.remove("open"); }

  // ── events ──
  $("#search").addEventListener("input", (e) => { filterText = e.target.value; renderBoard(); });
  $("#p-close").addEventListener("click", closePanel);
  $("#scrim").addEventListener("click", closePanel);
  $("#modal-close").addEventListener("click", closeModal);
  $("#modal-scrim").addEventListener("click", (e) => { if (e.target === $("#modal-scrim")) closeModal(); });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if ($("#modal-scrim").classList.contains("open")) { closeModal(); return; }
    if (viewing) closePanel();
  });

  // ── init ──
  renderBoard();
})();
</script>
</body>
</html>
