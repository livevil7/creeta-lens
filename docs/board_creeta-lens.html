<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lens — Documentation Board</title>
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">

<style>
/* ════ Light design tokens (cloned from livevil-contents/docs/board.html) ════ */
:root {
  --bg: #fafafa;
  --card: #ffffff;
  --fg: #18181b;
  --fg-2: #3f3f46;
  --fg-mute: #71717a;
  --line: #e4e4e7;
  --line-soft: #f1f1f3;
  --accent: #2563eb;
  --accent-soft: rgba(37, 99, 235, 0.08);
  --warn: #b91c1c;
  --stale: #b45309;
  --stale-soft: rgba(180, 83, 9, 0.12);
  --good: #16a34a;
  --rules: #7c3aed;
  --rules-soft: rgba(124, 58, 237, 0.10);
}

* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
html, body { margin: 0; padding: 0; min-height: 100%; background: var(--bg); color: var(--fg); }

body {
  font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.55;
  font-feature-settings: "tnum";
}

::selection { background: var(--accent-soft); }

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

button {
  font: inherit; cursor: pointer;
  background: var(--card); color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 6px 12px;
  letter-spacing: -0.005em;
  transition: border-color 120ms, background 120ms, color 120ms;
}
button:hover { border-color: var(--fg-mute); }
button:active { transform: translateY(1px); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500; }
button.primary:hover { background: #1d4fd4; border-color: #1d4fd4; }
button.ghost { border-color: transparent; color: var(--fg-mute); }
button.ghost:hover { color: var(--fg); background: var(--line-soft); }

code, .mono {
  font-family: "Pretendard Variable", monospace;
  font-variant-numeric: tabular-nums;
}
code {
  font-size: 0.92em;
  background: var(--line-soft);
  padding: 1px 5px;
  border-radius: 3px;
  color: var(--accent);
}

/* ════ Top bar ════ */
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: rgba(250, 250, 250, 0.9);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  padding: 12px 24px;
  display: flex; align-items: center; gap: 16px;
}
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand .repo { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
.brand .repo .dim { color: var(--fg-mute); font-weight: 400; }
.brand .title { font-size: 12px; color: var(--fg-mute); }

.topbar .grow { flex: 1; }
.topbar .stats {
  display: flex; gap: 14px;
  font-size: 11px; color: var(--fg-mute);
  font-variant-numeric: tabular-nums;
}
.topbar .stats b { color: var(--fg); font-weight: 500; }
.topbar .stats .sep { color: var(--line); }

.search input {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 6px 12px;
  width: 240px;
  font: inherit;
  color: var(--fg);
}
.search input:focus { outline: none; border-color: var(--accent); }

/* ════ Board grid ════ */
.board {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  padding: 12px;
  min-height: calc(100vh - 53px);
}
.column {
  display: flex; flex-direction: column;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 6px;
  min-width: 0;
}
.col-head {
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
}
.col-head .label {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-mute);
  font-weight: 500;
}
.col-head .label .pip { width: 6px; height: 6px; border-radius: 50%; }
.column[data-column="tasks"]   .pip { background: var(--accent); }
.column[data-column="history"] .pip { background: var(--good); }
.column[data-column="rules"]   .pip { background: var(--rules); }
/* Rules column reads as "reference docs" — muted purple header accent. */
.column[data-column="rules"] .col-head { background: var(--rules-soft); }
.column[data-column="rules"] .col-head .label { color: var(--rules); }
.col-head .count {
  font-size: 11px;
  color: var(--fg-mute);
  font-variant-numeric: tabular-nums;
}

.cards {
  flex: 1;
  overflow-y: auto;
  display: flex; flex-direction: column;
  gap: 8px;
  padding: 10px;
}

/* ════ Card ════ */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 14px 16px;
  cursor: pointer;
  user-select: none;
  transition: border-color 120ms;
}
.card:hover { border-color: var(--fg-mute); }

.card h3.tt {
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: -0.01em;
  margin: 0;
  color: var(--fg);
  text-wrap: balance;
  word-break: break-word;
}

.card .meta-row {
  display: flex; flex-wrap: wrap; gap: 7px; align-items: center;
  margin-top: 9px;
  font-size: 11px;
  color: var(--fg-mute);
  font-variant-numeric: tabular-nums;
}
.card .meta-row .date { color: var(--fg-mute); }
.badge {
  font-size: 9.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 1.5px 6px;
  border-radius: 3px;
  font-weight: 600;
  line-height: 1.6;
}
.badge.html  { background: var(--accent-soft); color: var(--accent); }
.badge.md    { background: var(--line-soft); color: var(--fg-mute); }
.badge.stale { background: var(--stale-soft); color: var(--stale); }

.empty {
  padding: 32px 16px;
  text-align: center;
  color: var(--fg-mute);
  font-size: 12px;
  font-style: italic;
}

/* ════ Slide-over panel (cloned from reference) ════ */
.scrim {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(24, 24, 27, 0.4);
  opacity: 0; pointer-events: none;
  transition: opacity 200ms;
}
.scrim.open { opacity: 1; pointer-events: auto; }

.panel {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(860px, 62vw);
  background: var(--bg);
  border-left: 1px solid var(--line);
  z-index: 100;
  transform: translateX(100%);
  transition: transform 240ms cubic-bezier(0.22, 1, 0.36, 1);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.panel.open { transform: translateX(0); }

.panel header {
  padding: 18px 28px 14px;
  border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: flex-start; gap: 14px;
  background: var(--card);
}
.panel header .info { min-width: 0; }
.panel header .id-row {
  font-size: 11px;
  color: var(--fg-mute);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
  margin-bottom: 4px;
}
.panel header h2 {
  margin: 0;
  font-size: 22px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--fg);
  text-wrap: balance;
  max-width: 56ch;
  word-break: break-word;
}
.panel header .top-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }

.panel .notes {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  padding: 10px 28px;
  font-size: 11.5px;
  border-bottom: 1px solid var(--line);
  background: var(--card);
}
.panel .notes:empty { display: none; }
.panel .notes .trunc { color: var(--warn); }
.panel .notes .trunc a { color: var(--warn); text-decoration: underline; }

.panel .scroll { flex: 1; overflow: hidden; position: relative; }

.report-frame {
  width: 100%; height: 100%;
  border: 0; display: block;
  background: #fff;
}

.md-scroll { width: 100%; height: 100%; overflow: auto; }
.md-pre {
  margin: 0;
  padding: 24px 28px 48px;
  font-family: "Pretendard Variable", ui-monospace, monospace;
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--fg-2);
  white-space: pre-wrap;
  word-break: break-word;
  tab-size: 2;
}

/* ════ Toast ════ */
.toast {
  position: fixed;
  bottom: 24px; left: 50%; transform: translateX(-50%) translateY(12px);
  background: var(--fg);
  color: var(--card);
  border-radius: 4px;
  padding: 11px 18px;
  font-size: 12.5px;
  line-height: 1.5;
  z-index: 300;
  opacity: 0;
  transition: all 200ms;
  pointer-events: none;
  max-width: 520px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
}
.toast .cmd {
  font-family: "Pretendard Variable", ui-monospace, monospace;
  font-size: 11.5px;
  color: #93c5fd;
  word-break: break-all;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ════ Modal (clipboard fallback) ════ */
.modal-scrim {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(24, 24, 27, 0.45);
  display: none;
  align-items: center; justify-content: center;
  padding: 24px;
}
.modal-scrim.open { display: flex; }
.modal {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 22px 24px 20px;
  width: min(560px, 100%);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
}
.modal h3 {
  margin: 0 0 6px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.modal p {
  margin: 0 0 14px;
  font-size: 12.5px;
  color: var(--fg-mute);
  line-height: 1.55;
}
.modal textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 10px 12px;
  color: var(--fg);
  font-family: "Pretendard Variable", ui-monospace, monospace;
  font-size: 12.5px;
  resize: none;
  min-height: 64px;
}
.modal textarea:focus { outline: none; border-color: var(--accent); }
.modal .modal-actions {
  display: flex; justify-content: flex-end; gap: 8px;
  margin-top: 16px;
}

/* ════ Print ════ */
@media print {
  .topbar, .scrim, .toast, .modal-scrim { display: none !important; }
  .panel { position: static; transform: none; width: 100%; }
  body { background: #fff; }
}

/* ════ Responsive ════ */
@media (max-width: 980px) {
  .board { grid-template-columns: 1fr; }
  .panel { width: 100vw; }
  .topbar { flex-wrap: wrap; }
  .search input { width: 180px; }
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="repo" id="repo-name">repo<span class="dim"> / docs</span></div>
    <div class="title">· Documentation Board</div>
  </div>
  <div class="search">
    <input id="search" type="search" placeholder="Search titles…" spellcheck="false">
  </div>
  <div class="grow"></div>
  <div class="stats" id="stats"></div>
</div>

<main class="board" id="board">
  <section class="column" data-column="tasks">
    <div class="col-head">
      <div class="label"><span class="pip"></span>Tasks</div>
      <div class="count" data-count="tasks">0</div>
    </div>
    <div class="cards" data-col="tasks"></div>
  </section>
  <section class="column" data-column="history">
    <div class="col-head">
      <div class="label"><span class="pip"></span>History</div>
      <div class="count" data-count="history">0</div>
    </div>
    <div class="cards" data-col="history"></div>
  </section>
  <section class="column" data-column="rules">
    <div class="col-head">
      <div class="label"><span class="pip"></span>Rules</div>
      <div class="count" data-count="rules">0</div>
    </div>
    <div class="cards" data-col="rules"></div>
  </section>
</main>

<div class="scrim" id="scrim"></div>

<aside class="panel" id="panel" aria-hidden="true">
  <header>
    <div class="info">
      <div class="id-row" id="p-id"></div>
      <h2 id="p-title"></h2>
    </div>
    <div class="top-actions" id="p-actions">
      <button class="ghost" id="p-close">close</button>
    </div>
  </header>
  <div class="notes" id="p-notes"></div>
  <div class="scroll" id="p-body"></div>
</aside>

<div class="toast" id="toast"></div>

<div class="modal-scrim" id="modal-scrim">
  <div class="modal" role="dialog" aria-modal="true">
    <h3>Copy this command manually</h3>
    <p>Clipboard access was blocked. Select the command below and copy it, then paste it into Claude Code.</p>
    <textarea id="modal-cmd" readonly spellcheck="false"></textarea>
    <div class="modal-actions">
      <button class="primary" id="modal-close">Done</button>
    </div>
  </div>
</div>

기존 kanban 위 **뷰어 pane + 폴더 필터**만 증분 추가 (전면 교체 X)\n- [ ] 전환 버튼은 클립보드 대신 **명령 표시 모달**(수동 복사) — clipboard 정책 회피\n- [ ] 파일명/기본생성/CONVERT 모드는 Plan A 와 동일\n\n---\n\n## ⚠️ 사전 리스크 (Pre-mortem)\n\n### Claude Opus 관점 (세션 컨텍스트 기반)\n- **md = SoT 원칙 충돌 주의**: Lens 설계는 \"md=SoT, HTML=파생뷰, 상태/요약 HTML 원본 저장 금지\"를 못박음. board 에 md 본문을 inline 해도 board 는 어디까지나 **파생 스냅샷** — 진실은 디스크 md. 현 builder 의 **stale 해시 감지**를 보존해 inline 본문이 디스크와 어긋나면 카드에 stale 표시해야 함.\n- **XSS = 가장 단순하고 안전한 해법으로 차단 (Rule 2)**: md 를 파싱·`innerHTML` 하지 말 것. **escape 후 `<pre>` + `textContent`** 로만 표시하면 XSS(Codex #2)를 원천 차단 + 마크다운 라이브러리 불필요. \"보기 좋은\" 렌더는 Claude 생성 html 의 몫. → \"원본 표시 vs 안전 미리보기\"라는 Codex 최대 블라인드 스팟은 **\"md=escaped 텍스트, html=신뢰된 슬라이드 데크\"** 2분할로 해소.\n- **iframe 신뢰 경계**: html 슬라이드 데크는 우리가 생성한 신뢰 자산이나, `<iframe>` 에 최소 권한만. `_shared.css` 동일 출처 필요(same-origin) 고려.\n- **SKILL.md 외과적 수정**: board 섹션 재작성이 Goal-first/핸드오프 프로토콜 등 다른 섹션을 깨면 안 됨 (Rule 3).\n- **blast radius 는 사용자 본인 repo**: Lens 는 사용자 자신의 repo 들에서만 쓰이므로 reports/ 폐기 충격은 외부 생태계가 아닌 본인 docs/ 한정. 그래도 비파괴 마이그레이션 권장.\n\n### Codex GPT-5.5 관점 (독립 코드 분석)\n> - **시나리오 1 (호환성)**: 업그레이드 직후 reports/ 폐기 → 기존 reports 기반 링크/automation 이 카드 누락·404·스크립트 실패.\n> - **시나리오 2 (보안·치명)**: md 에 `script`/`iframe`/`onerror`/raw HTML/백틱 내 태그 → file:// board 에서도 **임의 JS 실행·레이아웃 붕괴·클립보드 탈취**.\n> - **시나리오 3 (UX)**: \"전환\" 버튼이 file://·비보안 컨텍스트·권한 미부여·제스처 부족으로 막힘 → 복사 실패했는데 사용자는 변환된 줄 오해.\n> - **추가**: `_shared.css` 상대경로가 폴더 깊이별로 다르게 해석 / 대용량 md inline 으로 board 비대 / `/cp html` 생성과 board 재빌드 **비원자성**.\n> - **최대 블라인드 스팟**: \"원본 표시\"와 \"안전 미리보기\"를 한 보드에서 동시 만족하는 렌더링 정책 — sanitization·크기 제한·마이그레이션 경고·실패 UI 를 **먼저** 정의해야 함.\n\n### Trigger 매핑 (Pre-mortem 결과 → 대응)\n- **XSS (Codex #2, 치명)** → Plan B 포크 아님. **설계 제약**으로 흡수: Plan A step 2 에 \"md 는 escape+`<pre>`+textContent, innerHTML/마크다운 파싱 금지\" 명시.\n- **클립보드 차단 (Codex #3)** → 기존 **지점 C** 매핑 + Plan A step 2 에 **성공/실패 토스트 + 실패 시 명령 표시 모달**(실패 UI) 강화.\n- **호환성/마이그레이션 (Codex #1)** → Plan A 신규 step(비파괴 reports/ 처리 + CHANGELOG 마이그레이션 노트). 사용자도 \"기존꺼 정리는 옵션\"이라 했으므로 **하드 삭제 금지**.\n- **대용량 md inline (Codex #5)** → Plan A step 1 에 inline 크기 캡(예: >40KB 면 truncate + \"원본 열기\" 링크).\n- **비원자성 (Codex #6)** → step 3 에 \"builder 는 idempotent — `/cp html` 후 항상 재실행, 재빌드는 저비용\" 명시.\n- **_shared.css 경로 (Codex #4)** → 기존 step 4 + 지점 B 매핑 완료.\n\n→ **결론**: data-loss 급 Blocker 없음(파괴는 reports/ 하드삭제뿐 → 비파괴로 회피). XSS 는 \"escape-only 렌더\"로 설계 단계 차단. 발견 위험은 모두 Plan A 제약·신규 step 으로 흡수. 아래 Plan A 에 반영함.\n\n---\n\n## 진행상황\n- **마지막 업데이트**: 2026-05-21\n- **현재 경로**: Plan A (전환 없음 — Plan B trigger 미발동)\n- **Goal 달성**: 6/7 (성공기준 1~6 QA 검증 완료, 7번 `/lens-upgrade` 재배포는 사용자 확인 대기)\n- **구현 완료 (소스)**: `lib/board-builder.js`(schema v3 재작성 + `$` replace 버그 픽스), `templates/board.template.html`(3폴더+뷰어+escape md+전환버튼), `skills/cp/SKILL.md`(CONVERT 모드+기본생성+reports/폐기), `templates/report-conversion-spec.md`(../_shared.css), `lens.config.json`(buildBoard:true), 버전 3.6.0(plugin/marketplace/CLAUDE/README/CHANGELOG)\n- **QA 증거**: 브라우저(http) 렌더 확인 — 3폴더 19 docs 카드, plan doc html→iframe 슬라이드 데크, md-only→raw text+전환버튼, 전환버튼→`/cp html docs/...` 클립보드+토스트, XSS 픽스처 미실행(escape+`<\\/` payload), 콘솔 에러 0\n- **버그 수정 (QA 중 발견)**: `board-builder.js`의 `tpl.replace('{{BOARD_DATA}}', payload)`가 md의 `` $` ``(rules/codex-integration.md)를 replace 특수패턴으로 해석 → 템플릿 누출로 JSON 깨짐. 함수 치환 `() => payload`로 픽스\n- **재개 포인트**: step 7 — 사용자 확인 후 `git commit` + `/lens-upgrade` 재배포 → `claude plugin list` 버전 3.6.0 확인\n- **보류 중 연관 작업**: `creeta-homepage/docs/tasks/2026-05-21-lens-homepage-update.md` (홈페이지 Lens 카피 갱신 — 본 작업 후 재개)\n","truncated":false,"stale":true},{"id":"2026-05-20-cp-html-reports-board","folder":"tasks","title":"Work Plan / cp 에 보고서 HTML 양식 + Task Board 녹이기","date":"2026-05-20","hasMd":true,"hasHtml":false,"mdPath":"tasks/2026-05-20-cp-html-reports-board.md","htmlPath":null,"mdInline":"---\nid: plan_cp_html_reports_board\ntype: plan\nversion: 2\ncreated: 2026-05-20\nupdated: 2026-05-20\nstatus: draft\ngenerator: lens/plan (hand)\nlanguage: ko\nparent: null\nrefs: [livevil-contents/docs/reports/_conversion-spec.md, livevil-contents/docs/board.html]\n---\n\n# Work Plan / cp 에 보고서 HTML 양식 + Task Board 녹이기\n\n> 출처 컨텍스트: livevil-contents 에서 검증한 reports HTML 양식 + board.html 인덱스를\n> lens cp 의 범용 기능으로 승격하는 기획.\n\n---\n\n## 🎯 Goal — 결과물\n\n**완료 시점에 존재해야 하는 것:**\n\n- `/cp` 가 만든 task/history 문서를 **Pretendard 미니멀 보고서 HTML** 로 볼 수 있다 (livevil-contents `reports/2026-05-13-publish-date-restore.html` 양식).\n- 프로젝트의 모든 보고서를 한눈에 보는 **Task Board** (`docs/board.html`) — 카드 클릭 시 오른쪽 panel 에 iframe 으로 보고서 즉시 표시.\n- 이 양식/board 가 **lens 소스(creeta-lens)에 들어가** 모든 프로젝트에서 `/cp` 만으로 동작 (livevil-contents 전용 아님).\n- `/lens-upgrade` 후에도 살아남는다 (소스 레포 반영).\n\n**성공 기준 (검증 가능):**\n\n- [ ] **G1**: 임의의 새 프로젝트에서 `/cp {task}` 호출 → `docs/reports/{id}.html` 생성 (Pretendard/단일 blue/슬라이드 양식)\n- [ ] **G2**: `/cp` DONE 처리 → history 보고서도 동일 양식 HTML\n- [ ] **G3**: `docs/board.html` 이 reports/ 의 보고서들을 카드로 나열, 카드 클릭 → panel iframe 으로 즉시 표시\n- [ ] **G4**: `_shared.css` 등 양식 자산이 cp 실행 시 프로젝트에 자동 배포됨\n- [ ] **G5**: `/lens-upgrade` 실행 후 기능 유지 (creeta-lens 소스에 커밋됨)\n- [ ] **G6**: 기존 md 기반 워크플로우 사용 프로젝트가 깨지지 않음 (하위 호환 또는 opt-in)\n\n**완료의 정의 (Done = ?):**\n\n> 새 프로젝트에서 `/cp` 한 번으로 보고서 HTML + board 가 만들어지고, lens upgrade 후에도 유지되며, 기존 md-only 프로젝트도 안 깨진다.\n\n---\n\n## 현재 lens cp 아키텍처 (분석)\n\n| 요소 | 위치 | 역할 |\n|------|------|------|\n| 지침 | `skills/cp/SKILL.md` (v3.4 Goal-first) | Claude 행동 규칙. PLAN/DONE/ORGANIZE 모드 |\n| 문서 생성 | `lib/plan-manager.js` `generatePlanContent()` | **코드로 md 생성** — frontmatter + Goal/PlanA/PlanB/Risks/Status, 다국어 8개 |\n| 템플릿 | `templates/plan.template.md` | placeholder 템플릿 (md) |\n| 상태 SoT | `.lens/plan-state.json` + md frontmatter | id/status/createdAt 추적 |\n| 목록 | `plan-manager.js` `listPlans()` | `docs/` 의 **`.md` 만** 인식 |\n| board | (없음) | plan-state.json 의 텍스트 요약만 |\n\n## ⚠️ 핵심 충돌 — 두 철학\n\n| | lens cp (현재) | livevil-contents 방식 |\n|---|---|---|\n| 데이터 SoT | md (frontmatter + state.json) | HTML (reports/{id}.html) |\n| 생성 주체 | **코드 결정론** (plan-manager.js) | **Claude hand-craft** (의미 분석/재구성) |\n| 빌더 언어 | Node / JS (lib/) | Python (seed/build) |\n| 다국어 | 8개 언어 | 한국어 |\n| 시각화 | 텍스트 md | 슬라이드 보고서 (KPI/Before-After/timeline) |\n| board | 없음 | iframe panel 인덱스 |\n\n**근본 긴장**: 코드 생성은 일관·빠름·다국어이나 \"단순 템플릿 fill\" 이라 *의미 분석 시각화*가 안 됨. hand-craft 는 풍부하나 일관성이 지침에 의존하고 느림. livevil 에서 사용자가 택한 건 hand-craft (Python auto-gen 명시 거부).\n\n---\n\n## Plan A — 권장 경로: 하이브리드 (데이터 md + 뷰 HTML + JS board 빌더)\n\n### 왜 이게 1순위인가\n\nlens 의 강점(상태추적·다국어·결정론)을 죽이지 않고, livevil 의 강점(시각 보고서·board)을 **레이어로 추가**. md 를 폐기하지 않고 \"데이터/상태\"로 남기되, 사람이 보는 \"뷰\"는 HTML 보고서. board 빌더는 lens 네이티브(JS).\n\n### 단계\n\n- [ ] **S1. 양식 자산을 templates/ 에 추가**: `report-shared.css` (livevil `_shared.css` 이식), `report-plan.template.html` (task 6슬라이드), `report-history.template.html` (history 8슬라이드), `report-conversion-spec.md` (작성 규칙)\n- [ ] **S2. SKILL.md 갱신**: PLAN/DONE 모드에 \"보고서 HTML 뷰 작성\" 단계 추가. Claude 가 templates/report-*.html 양식을 Read → 의미 분석 → `docs/reports/{id}.html` 작성. md(데이터) + HTML(뷰) 병행 명시.\n- [ ] **S3. board 빌더를 lib/board-builder.js 로**: livevil `seed_board_from_md.py` + `build_board_html.py` 를 JS 포팅. `docs/reports/*.html` 스캔 → 메타 추출 → `docs/board.html` 생성. iframe panel UI 포함.\n- [ ] **S4. plan-manager.js 확장**: `listPlans()` 가 `.html` 도 인식. 보고서 경로 헬퍼 추가.\n- [ ] **S5. lens.config.json 옵션**: `reportFormat: \"html\" | \"md\"` (기본 md = 하위호환, html = opt-in), `buildBoard: true|false`.\n- [ ] **S6. 자산 배포 로직**: cp 첫 실행 시 `report-shared.css` 를 프로젝트 `docs/reports/` 로 복사 (없으면).\n- [ ] **S7. 하위호환 검증**: 기존 md-only 프로젝트가 reportFormat 미설정 시 기존대로 동작.\n- [ ] **S8. creeta-lens 소스 커밋 + 버전 bump + /lens-upgrade 검증**.\n\n### 막힐 수 있는 지점 (→ Plan B 트리거)\n\n- S3 board 빌더 JS 포팅이 Python 대비 공수 큼: file:// fetch 제약·한글 파일명·iframe 보안 → JS 빌더가 2일 넘어가면 Plan B.\n- S2 에서 \"md + HTML 병행\" 이 사용자의 livevil \"md 폐기\" 선호와 충돌하면 → Plan B (HTML 네이티브).\n\n## Plan B — Fallback: SKILL 지침 + 템플릿 자산만 (코드 변경 최소)\n\n### Trigger\n\nPlan A 의 JS 빌더/plan-manager 확장이 과투자로 판명되거나, 사용자가 \"코드는 건드리지 말고 지침만\" 을 원할 때.\n\n### 왜 이 대안인가\n\nlivevil-contents 에서 실제로 검증된 최소 경로 그대로. plan-manager.js 코드 생성 경로는 그대로 두고(또는 비활성), SKILL.md 지침 + templates/ HTML 자산만 추가. board 빌더는 작은 단일 스크립트 또는 수동. 코드 리스크 0, 단 일관성은 SKILL 지침 강도에 의존.\n\n### 단계\n\n- [ ] templates/ 에 report HTML 양식 + _shared.css + spec 추가\n- [ ] SKILL.md 에 \"reports/{id}.html 작성\" 지침 + reference Read 강제\n- [ ] board 는 단일 self-contained HTML 빌더 1개 (JS 또는 수동), 또는 프로젝트별 선택\n- [ ] reportFormat opt-in, 미설정 시 기존 md\n\n## ⚠️ 사전 리스크\n\n### Claude Opus 관점 (세션 컨텍스트 기반)\n\n1. **lens 정체성 변화 위험** — lens cp 의 핵심 가치는 *결정론적 코드 생성 + 다국어 + 상태추적*. hand-craft HTML 보고서는 그 반대(LLM 의존, 비결정론). 둘을 한 스킬에 섞으면 cp 가 \"코드 생성기인가 LLM 작가인가\" 정체성 혼란. → **reportFormat opt-in 으로 명확히 분리**, 기본은 기존 md.\n2. **livevil \"md 폐기\" vs lens \"md 데이터 유지\" 모순** — 사용자는 livevil 에서 md 를 폐기하고 HTML 을 SoT 로 했음. 그러나 lens 는 plan-state.json + frontmatter 가 상태 SoT 라 md 폐기 시 상태추적/listPlans/`/cc` 핸드오프(extractGoal, extractPlanBTriggers)가 다 깨짐. → **lens 에서는 md 가 SoT, HTML 은 파생 뷰**가 안전. 이 차이를 사용자에게 명시 필요.\n3. **board 빌더 Python→JS 포팅 공수** — livevil 빌더는 Python. lens 는 Node. 재작성이지 이식이 아님. Goal-first 구조(deliverables/criteria/planA/planB)를 슬라이드로 매핑하는 로직도 새로 짜야. → 공수 과소평가 경계, Plan B(지침+자산만) 항상 열어둠.\n\n### Codex GPT-5.5 관점 (독립 분석)\n\n1. **md 갱신 ↔ HTML 재생성 누락** → board 에 오래된 진행률/결론 표시. (수동 편집/예외종료/partial write 트리거)\n2. **경로 깨짐** → reports/{id}.html + board iframe 이 프로젝트별 base path·Windows 경로·GitHub Pages 에서 깨져 빈 panel.\n3. **/lens-upgrade 가 템플릿/빌더 덮어씀** → reportFormat 설정·커스텀 CSS·생성물과 충돌, 보드 사라지거나 구HTML+신md 혼재.\n- **범용화 함정**: 다국어 8개를 HTML UI 문구까지 확장 시 번역 누락·레이아웃 깨짐. Pretendard 의존은 오프라인/사내망/라이선스 문제. reports 디렉터리 충돌·CSP·iframe 차단.\n- **이중 SoT 정합성**: md 가 진짜 데이터면 HTML 은 *항상 파생물*. HTML 에 상태/요약 저장 시작하면 drift 필연. **생성 시점·입력 md 해시·builder 버전을 HTML 에 기록, 불일치 시 재생성.**\n\n### 통합 결론 — 계획 수정 사항\n\n두 모델 모두 **이중 SoT drift** 와 **upgrade 충돌**을 최대 위험으로 지목. 수정:\n\n- **HTML = 순수 파생물 강제**: reports HTML 에 상태/요약을 *원본으로* 저장 금지. 각 HTML head 에 `<meta name=\"lens:source\" content=\"{md경로}\">`, `<meta name=\"lens:source-hash\">`, `<meta name=\"lens:builder-version\">` 기록. board 빌더가 md 해시 불일치 감지 시 \"stale\" 표시 + 재생성 권고. → Codex 이중SoT/누락 대응.\n- **자산은 덮어쓰지 않게 분리**: `report-shared.css` 는 lens 가 *최초 1회만* 복사(이미 있으면 skip), 사용자 커스텀 보존. 빌더/템플릿은 lens 소스에 두고 프로젝트엔 생성물만. `/lens-upgrade` 가 프로젝트 생성물 안 건드림. → Codex upgrade 충돌 대응.\n- **경로는 상대경로 + 동일 폴더 강제**: board.html 과 reports/ 는 같은 docs/ 하위, 상대경로만. 배포(GitHub Pages)는 scope 밖으로 명시 (로컬 file:// + 같은 폴더 http 만 지원).\n- **Pretendard fallback**: CDN 실패 대비 `font-family` 에 system-ui fallback 명시 (이미 _shared.css 에 있음). 오프라인 환경은 \"CDN 필요\" 한계로 문서화.\n- **다국어는 보고서 본문만, UI chrome 은 영문 고정**: 슬라이드 콘텐츠는 plan 언어 따르되 page-no/eyebrow 등 UI 라벨은 영문 고정 → 번역 매트릭스 폭발 방지.\n- **md SoT 유지 확정 (Plan A 의 A2)**: lens 에서는 md 가 데이터/상태 SoT, HTML 은 파생 뷰. livevil 의 \"md 폐기\" 와 다름을 사용자에게 명시하고 동의받는다.\n\n## 진행상황\n\n- **Updated**: 2026-05-20\n- **현재 경로**: Plan A (하이브리드). 데이터 모델 = **md SoT + HTML 파생 뷰** (사용자 확정).\n- **구현 완료 (이번 세션)**:\n  - S1 ✅ `templates/`: report-shared.css, report-conversion-spec.md, report-history.example.html, report-plan.example.html, board.template.html\n  - S2 ✅ `skills/cp/SKILL.md`: \"HTML 보고서 뷰 + Task Board (reportFormat: html — opt-in)\" 섹션 추가\n  - S5 ✅ `lens.config.json`: `reportFormat: \"md\"` (기본), `buildBoard: false`\n  - S3 ✅ `lib/board-builder.js`: reports 스캔 → board.html, iframe panel, lens:source-hash stale 감지. **livevil-contents 3카드 검증 통과** (카드 클릭 → iframe panel 동작)\n  - S6 ✅ board-builder 가 `_shared.css` 최초 1회 배포 (있으면 skip)\n  - S4 ⏭️ 스킵 — md=SoT 라 listPlans=md 가 올바름. 보고서 경로는 SKILL 지침이 명시.\n  - S7 ✅ 하위호환 — reportFormat 기본 md + plan-manager.js 무변경 → md-only 프로젝트 무영향 (구조적 보장)\n- **재개 포인트**: S8 — creeta-lens 커밋 + 버전 bump + `/lens-upgrade` 검증 (사용자 확인 후)\n\n## Status\n\n**Status**: executing\n","truncated":false,"stale":false},{"id":"2026-05-16-cp-goal-first-overhaul","folder":"tasks","title":"/cp + /cc 를 Goal-first 구조로 동시 개편","date":"2026-05-16","hasMd":true,"hasHtml":false,"mdPath":"tasks/2026-05-16-cp-goal-first-overhaul.md","htmlPath":null,"mdInline":"# /cp + /cc 를 Goal-first 구조로 동시 개편\r\n\r\n**작성일**: 2026-05-16\r\n**작성자**: livev + Claude Opus 4.7\r\n**대상 버전**: lens v3.3.3 → v3.4.0\r\n**규모**: medium-large (코드 + 2개 스킬 문서 + 템플릿 + 핸드오프 프로토콜)\r\n\r\n> **이 task의 제1 원칙**: **Goal은 모든 것의 최상위다.** 문서의 다른 모든 섹션(Plan A, Plan B, Pre-mortem, 진행상황)은 Goal에 종속된 보조 자료다. 실행 엔진(/cc)은 Goal 달성을 위해 Plan A/B 사이를 자유롭게 전환할 수 있으나, **Goal 자체는 절대 양보하지 않는다**. Goal이 약하면 reject, Goal이 달성되지 않으면 절대 done 처리하지 않는다.\r\n\r\n---\r\n\r\n## 🎯 Goal — 이 task의 결과물\r\n\r\n**완료 시점에 존재해야 하는 것:**\r\n- `skills/cp/SKILL.md` 가 **Phase 0(Goal Definition) → Phase 1(Plan A) → Phase 2(Plan B) → Phase 2.5(Pre-mortem)** 순서로 재구성된 상태\r\n- `skills/cc/SKILL.md` 가 **Goal-aware 실행 엔진**으로 격상된 상태 — plan 문서의 Goal 섹션을 최우선 로드, Goal 검증 기준 미달 시 Plan A↔Plan B 자동 전환, Goal 달성 전 done 처리 차단\r\n- `lib/plan-manager.js` 의 `REQUIRED_SECTIONS` / `generatePlanContent()` / **신규 `extractGoal()` 함수** 가 새 구조의 마크다운을 생성/파싱하는 상태\r\n- `templates/plan.template.md` 가 새 구조 reference로 갱신된 상태\r\n- **/cp↔/cc 핸드오프 프로토콜** 이 SKILL.md 양쪽에 명문화된 상태 (어떤 필드를 어떤 형식으로 전달하는지)\r\n- `CHANGELOG.md` 에 `v3.4.0` entry 추가, `plugin.json` 버전 bump\r\n\r\n**성공 기준 (검증 가능):**\r\n- [ ] `/cp <임의 task>` 실행 시 생성되는 문서가 `## 🎯 Goal`, `## Plan A`, `## Plan B`, `## ⚠️ 사전 리스크`, `## 진행상황` 5개 섹션을 순서대로 포함한다\r\n- [ ] `/cc` 가 plan 문서 경로를 받아 실행할 때 **첫 동작은 Goal 섹션 파싱 + 성공 기준 체크박스 추출**이다 (TodoWrite의 첫 항목들이 성공 기준이어야 함)\r\n- [ ] `/cc` 가 Plan A 진행 중 막혔다고 판단하면 **자동으로 task 문서의 Plan B Trigger와 매칭 → Plan B로 전환** (사용자 개입 없이)\r\n- [ ] `/cc` 의 모든 성공 기준 체크박스가 yes 가 되기 전엔 **\"완료\" 보고를 차단** — 미달 항목 명시하고 retry/Plan B/사용자 개입 요청 중 하나를 선택\r\n- [ ] `validatePlanStructure()` 가 새 REQUIRED_SECTIONS 기준으로 통과/실패한다\r\n- [ ] medium 이상 규모 task에서 Plan B 섹션이 비어있으면 Phase 4 Approve가 거부된다 (small은 Plan B 생략 허용)\r\n- [ ] Goal이 \"동사+산출물\" 형식이 아니면 Phase 4 Approve가 거부된다 (예: \"API 개선\" → reject / \"POST /api/users가 201 반환\" → accept)\r\n- [ ] 8개 언어(EN/KO/JA/ZH/ES/FR/DE/IT)의 헤더 dict에 Goal / Plan A / Plan B / Trigger 키가 모두 채워져 있다\r\n- [ ] 기존 `docs/tasks/` 의 v3.3.x 형식 문서는 그대로 읽힌다 (parsePlanFrontmatter 호환성 유지)\r\n\r\n**완료의 정의 (Done = ?):**\r\n\r\n> 새 lens 빌드를 install 한 뒤 임의 프로젝트에서 `/cp redis 캐싱 도입` → Approve → `/cc` 자동 핸드오프 시나리오를 돌렸을 때:\r\n>\r\n> 1. `/cp` 가 Goal-first 마크다운 파일 저장\r\n> 2. `/cc` 가 Goal 섹션의 성공 기준 N개를 TodoWrite에 등록\r\n> 3. Plan A 진행 → 1개 step 실패 시뮬레이션 (e.g. 강제 에러) 시 Plan B Trigger 매칭 + 자동 전환\r\n> 4. 모든 성공 기준이 yes 가 될 때까지 루프, 미달 항목 잔존 시 done 보고 거부\r\n> 5. 최종 보고에 \"Goal 달성: 5/5 ✓\" 형식 명시\r\n\r\n---\r\n\r\n## Plan A — 권장 경로: 6개 파일 동시 인플레이스 수정\r\n\r\n### 왜 이게 1순위인가\r\n\r\n- 여섯 파일이 의미적으로 한 덩어리 (cp 스킬 + cc 스킬 + 코드 생성기/파서 + 템플릿 + 버전 기록 + 플러그인 매니페스트) — 따로 머지하면 중간 상태가 깨진 빌드가 됨.\r\n- 인플레이스 수정은 diff가 명확해서 리뷰가 쉽고, git history 한 커밋으로 묶을 수 있음.\r\n- Goal 게이트는 SKILL.md 본문만으로 LLM 셀프 검열로 강제 (코드 게이트는 백업).\r\n- `/cc` 의 Goal 루프 로직도 SKILL.md 명세 + LLM 준수로 처리 (별도 런타임 코드 신설 불필요).\r\n\r\n### 단계\r\n\r\n- [ ] **A1. `/cp` SKILL.md PLAN 모드 재구성** ([skills/cp/SKILL.md](skills/cp/SKILL.md))\r\n  - 현재 Phase 1 (분석) → Phase 0 (Goal & Deliverable) 으로 격상, 분석은 Phase 0의 보조 단계로 흡수\r\n  - Phase 2 (문서 작성)의 마크다운 템플릿을 Goal/Plan A/Plan B/Pre-mortem/진행상황 5섹션으로 교체\r\n  - \"문서 품질 규칙\" 에 **Goal 품질 게이트** 추가: \"Goal은 '동사+산출물' 형태 / 검증 가능한 성공 기준 ≥1개 필수\"\r\n  - Plan B 의무화 규칙 명시: \"medium 이상 필수, small은 'Plan B 불필요' 라인으로 생략 가능\"\r\n  - Phase 2.5 Pre-mortem 본문에 \"Plan A 약점 → Plan B Trigger 연결\" 문단 추가\r\n  - Phase 4 Approve 직전에 Goal 게이트 + Plan B 게이트 체크 로직 명시\r\n  - **Phase 5 Execute 분기에 핸드오프 프로토콜 명시** (아래 별도 섹션 참조)\r\n- [ ] **A2. `/cc` SKILL.md Goal-aware 실행 엔진으로 격상** ([skills/cc/SKILL.md](skills/cc/SKILL.md))\r\n  - 진입 시점에 **plan 문서 경로** 받으면 즉시 Goal 섹션 파싱 (없으면 사용자 입력에서 Goal을 추출 후 사용자 확인)\r\n  - Goal의 \"검증 가능한 성공 기준\" 체크박스 N개 → TodoWrite의 **최우선 항목**으로 등록 (Plan A의 step들은 그 아래)\r\n  - 매 step 완료 후 **Goal 검증 기준 재평가** — 통과한 항목 체크\r\n  - Plan A의 step 이 실패하면 task 문서의 **\"막힐 수 있는 지점\"** 의 Trigger 와 매칭 시도 → 매칭되면 자동으로 Plan B로 전환 (전환 사실은 사용자에게 알림만)\r\n  - 매칭 안 되는 실패면 사용자에게 \"Plan B 전환 / 재시도 / 중단\" 3지선다 AskUserQuestion\r\n  - **종료 게이트**: 모든 성공 기준 yes 가 될 때까지 done 보고 차단. 미달 항목 있으면 \"X/N 미달 — 다음 액션 선택\" 강제\r\n  - 최종 보고 포맷: \"Goal 달성: N/N ✓\" 또는 \"Goal 미달성: X/N (미달 항목: [...])\"\r\n- [ ] **A3. plan-manager.js 코드 갱신** ([lib/plan-manager.js](lib/plan-manager.js))\r\n  - `REQUIRED_SECTIONS` 배열을 `['Goal', 'Plan A', 'Plan B', 'Risks', 'Status']` 로 교체\r\n  - `generatePlanContent()` 의 섹션 생성 로직을 새 구조로 재작성\r\n  - **신규 함수 `extractGoal(planContent)`** 추가 — `/cc` 가 plan 문서에서 Goal 섹션 + 성공 기준 체크박스 배열을 파싱하는 데 사용\r\n  - **신규 함수 `extractPlanBTriggers(planContent)`** 추가 — Plan A의 \"막힐 수 있는 지점\" 리스트를 추출해 Plan B Trigger 와 매핑\r\n  - 8개 언어 헤더 dict 에 `goal`, `planA`, `planB`, `trigger`, `deliverable`, `successCriteria` 키 추가\r\n  - `parsePlanFrontmatter()` 는 손대지 않음 (frontmatter 구조 동일)\r\n  - `validatePlanStructure()` 는 새 REQUIRED_SECTIONS 로 자동 적용됨\r\n- [ ] **A4. plan.template.md 갱신** ([templates/plan.template.md](templates/plan.template.md))\r\n  - 새 구조 reference로 본문 교체 (runtime은 안 읽지만 AI 컨텍스트용)\r\n- [ ] **A5. 버전 & 변경 이력**\r\n  - `.claude-plugin/plugin.json` version `3.3.3` → `3.4.0`\r\n  - `CHANGELOG.md` 에 v3.4.0 entry 추가 (breaking: plan 문서 구조 변경 + /cc 실행 모델 변경)\r\n  - `CLAUDE.md` Version 섹션 갱신\r\n- [ ] **A6. 수동 검증 시나리오**\r\n  - **S1**: 임의 디렉토리에서 `/cp 테스트 작업` 호출 → 생성 파일이 새 구조인지 확인\r\n  - **S2**: 기존 v3.3.x 형식 task 파일이 있는 프로젝트에서 `/cp` 무인자 호출 → 활성 작업 목록이 그대로 뜨는지 확인\r\n  - **S3**: Goal이 약한 입력 (\"뭔가 개선해줘\") 으로 호출 → Phase 4에서 reject 메시지 뜨는지 확인\r\n  - **S4**: `/cp` Approve 후 Execute 선택 → `/cc` 가 핸드오프 받아 Goal 섹션부터 TodoWrite 등록하는지 확인\r\n  - **S5**: Plan A 의 한 step 을 강제 실패시킴 → `/cc` 가 자동으로 Plan B Trigger 매칭 + 전환하는지 확인\r\n  - **S6**: 마지막 성공 기준 1개 미달 상태에서 `/cc` 가 done 보고를 시도하는지 → **차단되어야 함**\r\n\r\n### 막힐 수 있는 지점 (→ Plan B 트리거)\r\n\r\n- **T1. generatePlanContent 재작성이 길어져 diff 가 300줄 넘어감** → 리뷰 불가, 회귀 위험 ↑ → Plan B 진입\r\n- **T2. 8개 언어 헤더 번역이 어색해서 사용자가 외부 검수 원함** → Plan B 의 점진 적용\r\n- **T3. 기존 task 문서들(이미 작성된 livevil-contents/Returns-Homepage 등의 docs/tasks)이 새 validatePlanStructure 에서 죄다 실패함** → Plan B 의 호환 모드\r\n- **T4. `/cc` Goal 루프가 무한 루프에 빠짐** (성공 기준이 모호해 영원히 yes 가 안 됨) → Plan B 의 \"최대 N회 재시도 후 사용자 개입\" 로직\r\n- **T5. `/cc` 가 Plan A의 step 실패 신호를 잘못 인지해 불필요하게 Plan B로 자주 전환** → Plan B 의 \"Trigger 매칭 임계값 상향 / 사용자 confirm 모드\"\r\n\r\n---\r\n\r\n## Plan B — Fallback: 2개 SKILL.md만 우선, 코드는 호환 모드 + Goal 루프는 사용자 confirm 모드\r\n\r\n### Trigger\r\n\r\nPlan A의 **A3 단계에서 T1/T3 발생** (diff > 300줄 또는 기존 task 문서 호환성 깨짐) **또는 A2/A6 의 S5/S6 에서 T4/T5 발생** (Goal 루프 무한 / Plan B 오발동) 시 즉시 전환.\r\n\r\n### 왜 이 대안인가\r\n\r\n- 두 SKILL.md만 먼저 바꾸면 **LLM이 새 구조 + Goal 루프를 따르지만, 코드 게이트는 호환** — 점진 마이그레이션.\r\n- Goal 루프 무한 위험은 **\"최대 3회 재시도 후 사용자 confirm 강제\"** 로 안전 장치 추가.\r\n- Plan B 오발동 위험은 **자동 전환을 사용자 confirm 모드로 강등** — 자동성은 줄지만 신뢰성 ↑.\r\n- Trade-off: 검증이 LLM 셀프 체크에 의존 + 자동성 일부 포기 → 일시적 마찰 ↑. 하지만 회귀/무한 루프 사고보단 낫다.\r\n\r\n### 단계\r\n\r\n- [ ] **B1. cp SKILL.md + cc SKILL.md 만 v3.4.0 으로 인플레이스 교체** (A1 + A2 와 동일)\r\n- [ ] **B2. plan-manager.js 는 최소 변경**\r\n  - `REQUIRED_SECTIONS` 에 새 섹션 **추가만** (기존 섹션도 유지) → 신규/구식 둘 다 통과\r\n  - `generatePlanContent()` 는 손대지 않음 (LLM이 SKILL.md 따라 직접 마크다운 작성하므로 코드 생성기는 백업용)\r\n  - `extractGoal()` / `extractPlanBTriggers()` 는 신설하되 best-effort (실패해도 throw 안 함, null 반환)\r\n- [ ] **B3. `/cc` Goal 루프에 안전 장치 강제**\r\n  - 최대 재시도 횟수 = **3회** (SKILL.md 본문에 명시)\r\n  - 3회 초과 시 사용자 AskUserQuestion: \"Goal 미달성 — 계속 / Plan B 전환 / 중단\"\r\n  - Plan A↔B 자동 전환을 **사용자 confirm 모드** 로 강등 (Trigger 매칭 시 \"Plan B 로 전환할까요?\" 묻기)\r\n- [ ] **B4. 버전 bump 는 minor 가 아니라 patch** (`3.3.3` → `3.3.4`) — breaking 아님을 시그널\r\n- [ ] **B5. 후속 task 생성**: `docs/tasks/YYYY-MM-DD-cc-goal-loop-automation.md` 로 \"Goal 자동 루프 활성화\" 별도 task 분리\r\n- [ ] **B6. CHANGELOG에 \"SKILL.md only — code generator unchanged, /cc auto-transition gated behind user confirm\" 명시**\r\n\r\n---\r\n\r\n## /cp ↔ /cc 핸드오프 프로토콜 (신설 — Goal-first의 핵심)\r\n\r\n> 이 프로토콜은 양쪽 SKILL.md 본문에 **동일 표현**으로 박혀야 한다. 어느 한쪽만 갱신되면 핸드오프가 깨진다.\r\n\r\n### 핸드오프 시점\r\n\r\n`/cp` Phase 5 의 사용자 선택이 **Execute** 일 때.\r\n\r\n### 전달 페이로드 (Skill tool 호출 시)\r\n\r\n`/cp` 는 `Skill` 도구로 `lens:cc` 를 호출하면서 다음 구조의 컨텍스트를 프롬프트에 첨부:\r\n\r\n```text\r\n[HANDOFF FROM /cp]\r\nplan_doc_path: docs/tasks/YYYY-MM-DD-{slug}.md\r\nplan_id: {plan-id-from-frontmatter}\r\noriginal_request: {사용자 원본 요청}\r\n\r\n[GOAL — 최우선, 절대 양보 금지]\r\n{Goal 섹션 본문 전체}\r\n\r\n[SUCCESS_CRITERIA — TodoWrite의 최상위 항목으로 등록할 것]\r\n- [ ] {기준 1}\r\n- [ ] {기준 2}\r\n...\r\n\r\n[CURRENT_PATH] Plan A\r\n[PLAN_A_STEPS] {Plan A 체크리스트}\r\n[PLAN_A_FAILURE_TRIGGERS] {막힐 수 있는 지점 리스트 — Plan B 매칭 키}\r\n[PLAN_B_TRIGGERS] {Plan B Trigger 리스트}\r\n[PLAN_B_STEPS] {Plan B 체크리스트}\r\n```\r\n\r\n### /cc 의 진입 동작 (이 페이로드를 받았을 때)\r\n\r\n1. `plan_doc_path` 읽기 → 페이로드와 일치 확인 (drift 방지)\r\n2. SUCCESS_CRITERIA → TodoWrite 최상위 항목 N개 등록 (status: pending)\r\n3. PLAN_A_STEPS → TodoWrite 하위 항목으로 등록 (Goal 기준 아래)\r\n4. 실행 루프 진입 — 각 step 종료 후 **SUCCESS_CRITERIA 재평가**, 통과 항목 자동 체크\r\n5. step 실패 신호 발생 → PLAN_A_FAILURE_TRIGGERS 와 매칭 시도\r\n6. 매칭 → PLAN_B_TRIGGERS 확인 → Plan B 단계로 전환 (CURRENT_PATH 갱신)\r\n7. 매칭 실패 → AskUserQuestion: \"Plan B 전환 / 재시도 / 중단\"\r\n8. 모든 SUCCESS_CRITERIA yes 가 될 때까지 루프\r\n9. 최종 보고: \"Goal 달성: N/N ✓\" + task 문서의 `## 진행상황` 섹션 갱신 (`현재 경로`, `마지막 업데이트`)\r\n\r\n### 절대 규칙\r\n\r\n- `/cc` 는 SUCCESS_CRITERIA 미달 상태에서 **절대 done 처리 금지**\r\n- `/cc` 는 Goal 자체를 수정할 권한 **없음** — 약하다고 판단되면 사용자에게 \"Goal 재정의가 필요합니다 — /cp Modify 권장\" 회신\r\n- Plan A↔B 전환은 task 문서를 수정하지 않음 (현재 경로만 `## 진행상황` 에 기록)\r\n- 핸드오프 페이로드와 plan 문서가 불일치하면 **plan 문서를 SoT 로 신뢰** (`/cp` 가 그 후에 수정한 흔적일 수 있음)\r\n\r\n---\r\n\r\n## ⚠️ 사전 리스크 (Pre-mortem)\r\n\r\n> Phase 2.5에서 Opus + Codex 병렬 분석 후 채울 자리. 현재는 placeholder.\r\n\r\n### Claude Opus 관점 (세션 컨텍스트 기반)\r\n_(미실행 — Phase 2.5에서 작성)_\r\n\r\n### Codex GPT-5.2 관점 (독립 코드 분석)\r\n_(미실행 — Phase 2.5에서 작성)_\r\n\r\n### Trigger 매핑 (Pre-mortem 결과 → Plan B 전환점)\r\n- Pre-mortem 에서 발견된 약점은 Plan A의 \"막힐 수 있는 지점\" 섹션으로 흡수\r\n- 같은 약점이 Plan B의 Trigger 와 매칭되는지 확인 → 매칭되지 않으면 Plan B에 새 Trigger 추가\r\n\r\n---\r\n\r\n## 진행상황\r\n\r\n- **마지막 업데이트**: 2026-05-16\r\n- **현재 경로**: Plan A (A1~A6 의 install 단계까지 완료, S1~S6 수동 검증 대기)\r\n- **Goal 달성**: 코드/배포 5.5/6 ✓ — smoke test 8개 언어 통과 + v3.4.0 push (origin + creetacorp, tag v3.4.0 annotated) + `/lens-upgrade` 전체 phase 통과 (registry single entry / `claude plugin list` 확인 / installed_plugins.json 백업 보관). 마지막 0.5 는 Claude Code restart 후 S1~S6 실사용 검증.\r\n- **재개 포인트**: **Claude Code 재시작 필요** (스크립트가 running CLI 를 재시작하지 못함). 재시작 후 S1~S6 시나리오 실행. 미달 항목 발견 시 task 문서 갱신 + 재진입.\r\n- **git 상태**:\r\n  - `0e7bdaf feat: v3.4.0 - Goal-first plan structure (BREAKING)` (8 files, +857/-200)\r\n  - `cdc2529 chore: bump marketplace.json to v3.4.0` (1 file, +3/-3)\r\n  - `v3.4.0` annotated tag → ba666b9 → 두 remote 모두 보유 (origin + creetacorp)\r\n- **완료된 deliverable**:\r\n  - ✓ `skills/cp/SKILL.md` Phase 0~6 + 핸드오프 프로토콜 + 핵심 원칙/절대 규칙 갱신\r\n  - ✓ `skills/cc/SKILL.md` Phase 0 신설 + Phase 5.0 자동 전환 + Phase 7.4 진행상황 갱신 + 절대 규칙 보강 + v3.4 라벨링\r\n  - ✓ `lib/plan-manager.js` REQUIRED_SECTIONS / generatePlanContent (8개 언어 dict) / extractGoal / extractPlanBTriggers / SECTION_ALIASES 다국어 validate / exports\r\n  - ✓ `templates/plan.template.md` 새 구조 reference + lint disable\r\n  - ✓ `.claude-plugin/plugin.json` 3.3.3 → 3.4.0\r\n  - ✓ `CHANGELOG.md` v3.4.0 entry (BREAKING + Changed + Added + Migration notes)\r\n  - ✓ `CLAUDE.md` Version 섹션 + plan-manager.js exports 목록 갱신\r\n\r\n---\r\n\r\n## 참고 — 이 task 문서 자체가 dogfooding 이다\r\n\r\n이 문서는 **변경하려는 신규 구조를 미리 적용해서 작성**됐다. 즉:\r\n\r\n| 기존 /cp 가 만들었을 구조 | 이 task 문서 (신규 구조) |\r\n|---|---|\r\n| 목표 → 체크리스트 → 기술적 접근 → 리스크 | 🎯 Goal (최우선·절대) → Plan A → Plan B → 핸드오프 프로토콜 → Pre-mortem → 진행상황 |\r\n| Plan B 없음 (리스크 섹션이 대체) | Plan B Trigger + 단계 명시 + 자동 전환 규칙 |\r\n| Goal 이 체크리스트와 섞임 | Goal 이 최상단 + 검증 기준 분리 + \"Done = ?\" 명시 |\r\n| /cc 핸드오프 시 단순 요청 전달 | Goal + 성공 기준 + Trigger 매핑까지 구조화 페이로드로 전달 |\r\n| /cc 가 step 완료 시 done 보고 | /cc 가 SUCCESS_CRITERIA 전부 yes 되기 전엔 done 차단 |\r\n\r\n만약 이 문서가 읽힐 만하고 작업의 \"어디서 막히면 어디로 갈지 + 무엇이 되어야 끝인지\" 가 명확하다면, 신규 구조가 기존보다 낫다는 1차 증거다.\r\n","truncated":false,"stale":false}],"history":[{"id":"2026-05-14-lens-qa-review","folder":"history","title":"Lens 플러그인 코드 리뷰 + QA — 부분 close","date":"2026-05-14","hasMd":true,"hasHtml":false,"mdPath":"history/2026-05-14-lens-qa-review.md","htmlPath":null,"mdInline":"# Lens 플러그인 코드 리뷰 + QA — 부분 close\n\n**완료일**: 2026-05-14\n\n## 요약\n\n9건의 발견사항(CRITICAL 2, MAJOR 3, MINOR 4) 중 **MAJOR 2건**(bump-version.sh 4개 버그, plugin-registry source 호환성)이 v3.2.2(`fa17c45`)와 v3.3.0(`ee1a4f9`) release에 흡수되어 close. **CRITICAL 2건은 미해결 carry-over**.\n\n## 흡수된 항목 (close)\n\n### MAJOR — bump-version.sh 4개 버그 (#3)\n- (a) sed pattern → v3.2.2에서 정규식 `v[0-9]+\\.[0-9]+\\.[0-9]+`로 일반화\n- (b) CHANGELOG.md multi-line prepend → awk로 교체\n- (c) grep -P locale → `LC_ALL=C.UTF-8` 명시 (스크립트 호출자 책임)\n- (d) verify가 stale drift 못 잡음 → 새 verification block: `grep -rohE \"v[0-9]+\\.[0-9]+\\.[0-9]+\"` 후 `$NEW_VERSION` 외 모두 stale 표기\n\n### MAJOR — plugin-registry source 호환성 (#4)\n- string `source` → typed `{type, repo}` 객체 (v3.3.0)\n- `formatPluginSource()` helper로 backward compat\n- Claude Code의 fake marketplace lookup 패턴 구조적 차단\n\n## 미해결 carry-over (v3.4 roadmap 후보)\n\n### CRITICAL — Session 차단 위험 (미해결)\n\n- **#1 stdin blocking read in 4 hooks** (`post-tool-task.js:77`, `pre-tool-task.js:64`, `stop.js:61`, `session-start.js:25`). Claude Code가 stdin 안 보내면 5초 timeout까지 hang. Fix 방안: `if (process.stdin.isTTY) process.exit(0);` 가드.\n- **#2 fs.* operations without try/catch** (session-start.js, agent-tracker.js, keyword-matcher.js, memory-store.js, plan-manager.js 등 15곳). 권한/disk/corrupt 시 hook 통째로 throw → \"Hook UserPromptSubmit error\" 패턴. Fix 방안: sync-pull.js의 fail-soft 패턴 적용.\n\n### MINOR — 미해결\n\n- context 비용 절감 (Plugin Discovery Registry 표 크기), 에러 처리 일관성, KNOWN_PLUGINS 표기 통일.\n\n## 주요 결정 사항\n\n- v3.3.0은 MAJOR 2건에 집중. CRITICAL은 의도적 deferral — 별도 hook refactor task로 분리할 가치.\n- 모든 발견사항을 v3.3.0에 욱여넣지 않은 이유: minor release scope는 \"structural fix\"에 집중, hook 안전성은 별도 정밀 작업 필요.\n\n## 변경 파일\n\n이번 QA review의 fix는 두 release에 분산됨:\n- v3.2.2 (`fa17c45`): `scripts/bump-version.sh`\n- v3.3.0 (`ee1a4f9`): `lib/plugin-registry.js` + dependents\n\n## 테스트 & 검증\n\n- v3.2.2 bump-version.sh 정규식: v3.2.2 → v3.3.0 bump가 첫 실전 검증 (10/10 파일 자동 sync, stale detection 작동).\n- v3.3.0 source 구조: lens-upgrade Phase 5 verify에서 cache 새 install 시 새 구조로 정상 로드 확인.\n\n## 추가 사항\n\nCRITICAL 2건(#1, #2)은 다음 v3.4 또는 v3.3.1 patch에서 별도 task로 다시 열어 처리 권장. hook safety 단독 PR이 안전.\n","truncated":false,"stale":false},{"id":"2026-05-14-v3.3.0-minor-release","folder":"history","title":"Lens v3.3.0 — minor release 완료","date":"2026-05-14","hasMd":true,"hasHtml":false,"mdPath":"history/2026-05-14-v3.3.0-minor-release.md","htmlPath":null,"mdInline":"# Lens v3.3.0 — minor release 완료\n\n**완료일**: 2026-05-14\n\n## 요약\n\n`lib/plugin-registry.js`의 `KNOWN_PLUGINS` source 필드를 string에서 typed object(`{type, repo}`)로 변경하고, 신규 `formatPluginSource()` helper를 export하는 minor release. 핵심 원인은 Claude Code plugin loader가 string source(`'ccplugins/awesome-claude-code-plugins'`)를 `/` 기준으로 split해 owner를 가짜 marketplace ID로 잘못 해석하던 패턴. 구조적 차단으로 해결.\n\n## 주요 결정 사항\n\n- **semver minor 선택**: `formatPluginSource()`가 string fallback을 포함해 backward compat 유지 → breaking 아님. patch가 아닌 minor가 정확.\n- **bump-version.sh 정규식 신뢰**: v3.2.2의 `fa17c45` commit에서 도입한 `v[0-9]+\\.[0-9]+\\.[0-9]+` 매칭이 첫 실전 작동. 10/10 파일 자동 sync 성공.\n- **master + tag 분리 push**: 옛 tag(v1.9.0, v2.0.0) conflict 회피를 위해 `git push origin master` 와 `git push origin v3.3.0` 분리 실행.\n- **CHANGELOG 직접 채움**: bump-version.sh가 prepend한 빈 template에 한국어로 Added/Changed/Fixed/Note 작성.\n\n## 변경 파일\n\n- `lib/plugin-registry.js` — `KNOWN_PLUGINS` source 구조 변경 + `formatPluginSource()` export\n- `hooks/session-start.js` — Plugin Discovery Registry 표가 `formatPluginSource(p.source)` 사용 + v3.3.0 banner\n- `.claude-plugin/plugin.json`, `.claude-plugin/marketplace.json` — version + ref bump\n- `hooks/hooks.json` — Lens v3.3.0 표기\n- `skills/c/SKILL.md`, `skills/cc/SKILL.md`, `skills/cp/SKILL.md` — 본문 버전\n- `CLAUDE.md` — Current 버전 + Updated 날짜\n- `README.md` — 제목 버전\n- `CHANGELOG.md` — v3.3.0 section 추가\n- `lib/hook-utils.js` — 신규 (commit에 포함)\n\n## 테스트 & 검증\n\n- `bash scripts/bump-version.sh 3.3.0` → 10/10 파일 갱신 + verification에서 stale v1.0.33 1건 발견(README의 외부 도구 표기, false positive)\n- `git push origin master` → `fa17c45..ee1a4f9` 정상\n- `git push origin v3.3.0` → `* [new tag] v3.3.0 -> v3.3.0` 정상\n- `bash scripts/upgrade.sh` (lens-upgrade) → Phase 5 verify에서 v3.3.0, scope=user, single entry 확인\n\n## 추가 사항\n\n- 향후 같은 lookup-fail 패턴이 재발 불가 — 구조적 차단.\n- 다음 정규식 bump 시 `v1.0.33` warning은 외부 도구 표기라 무시 가능. README의 진짜 lens 버전은 line 1 매칭으로 정확히 갱신됨.\n","truncated":false,"stale":false},{"id":"2026-05-04-lens-v3.3-roadmap","folder":"history","title":"Lens v3.3 Roadmap — 부분 달성, 재정렬 필요","date":"2026-05-04","hasMd":true,"hasHtml":false,"mdPath":"history/2026-05-04-lens-v3.3-roadmap.md","htmlPath":null,"mdInline":"# Lens v3.3 Roadmap — 부분 달성, 재정렬 필요\n\n**완료일**: 2026-05-14\n\n## 요약\n\n5/4에 작성한 6-phase 야심찬 로드맵(Cost-aware Orchestrator). 실제로 release된 v3.3.0(`ee1a4f9`)은 로드맵 범위와 다른 방향 — **source-format fix + bump-version.sh hardening**이 핵심이고, 로드맵의 plan-drift/cost telemetry/prompt caching/`/cs` 강화/`/qa`·`/retro`·`/canary` 신규 스킬은 **모두 미착수**.\n\n## 로드맵 vs 실제 v3.3.0 비교\n\n| Phase | 로드맵 | v3.3.0 실제 |\n|-------|------|-----------|\n| 1. Plan-drift | ❌ 미착수 | — |\n| 2. Cost telemetry | ❌ 미착수 | — |\n| 3. Hook & caching | ❌ 미착수 | — |\n| 4. `/cs` 강화 | ❌ 미착수 | — |\n| 5. `/qa`·`/retro`·`/canary` 신규 | ❌ 미착수 | — |\n| 6. 릴리스 (CHANGELOG, 9곳 버전, dogfood, push) | ✅ 다른 내용으로 실행 | bump-version.sh + push + lens-upgrade 검증 완료 |\n\n## 주요 결정 사항\n\n- **로드맵 우선순위 재조정 필요**: 5/4 작성 후 2주 동안 실제 사용자 페인이 hook stability + plugin source format 쪽으로 드러남. 로드맵의 Phase 1-5는 가치 있지만 우선순위가 아님.\n- **v3.3.0 release scope 축소 채택**: 로드맵 따라가지 않고 실제 발생한 lookup-fail 패턴 + bump-version 버그 fix에 집중. 작은 release를 자주 내는 패턴이 더 안전.\n- **로드맵 carry-over**: 6 phase 모두 미착수 → v3.4 또는 v4.0 roadmap으로 이관 권장.\n\n## 변경 파일\n\n이번 history 자체. v3.3.0 release는 별도 history(`2026-05-14-v3.3.0-minor-release.md`)에 정리.\n\n## 테스트 & 검증\n\n해당 없음 — 로드맵 자체는 계획 문서.\n\n## 추가 사항\n\n### v3.4 또는 v4.0 후보 항목 (carry-over)\n\n- **plan-drift 방어**: `/cp` plan_id + `~/.claude/lens/plan-state.json` 영속화 + Supervisor 강제 게이트\n- **cost telemetry**: `lib/usage-meter.js` + `lib/pricing.js` + PostToolUse hook에서 worker별 토큰 누적\n- **prompt caching**: `/c`, `/cc` Leader 호출에서 system prompt를 ephemeral cache block으로 분리 (5분 TTL, 90% 할인)\n- **`/cs` 강화**: cost-cap, `--cost-preview`, status, AUTO_COMMIT_BLOCKLIST\n- **`/qa`, `/retro`, `/canary` 3종**: 커뮤니티 검증 패턴 흡수\n\n이 carry-over 5개는 v3.4 roadmap task로 새로 작성 권장. 이번 history 종결 시점에는 미착수 상태 명시로 충분.\n\n### lens-qa-review의 CRITICAL 2건과 통합 고려\n\nQA review에서 미해결 처리된 stdin blocking + fs try/catch 2건은 hook stability 영역. v3.4의 Phase 1(plan-drift)과 hook 변경이 겹치므로 묶어서 처리 가능.\n","truncated":false,"stale":false},{"id":"2026-05-04-v3.2.0-cs-multi-repo-sync","folder":"history","title":"Lens v3.2.0 — `/cs` Multi-Repo Sync — 완료","date":"2026-05-04","hasMd":true,"hasHtml":false,"mdPath":"history/2026-05-04-v3.2.0-cs-multi-repo-sync.md","htmlPath":null,"mdInline":"# Lens v3.2.0 — `/cs` Multi-Repo Sync — 완료\n\n**완료일**: 2026-05-04\n**Release**: v3.2.0\n\n## 요약\n\n워크스페이스 하위 모든 git repo 를 일괄 동기화하는 신규 skill `/cs` 를 추가하고, SessionStart 마다 자동으로 incoming 변경을 pull 하는 hook 도 함께 등록했다. push 는 안전성 우선 정책으로 자동 실행하지 않고 사용자가 명시적으로 `/cs` 또는 `/cs push` 를 호출할 때만 발동한다. 사용자가 여러 기기 (Windows desktop, Mac mini, 노트북) 에서 같은 워크스페이스를 다루는 환경에서, 어느 기기에서든 lens 만 활성화하면 동일한 sync 동작을 받을 수 있게 됐다.\n\n## 주요 결정 사항\n\n- **Plugin 자체 등록 vs livevil-setting 의존**: lens self-contained 로 결정. `scripts/git-sync-all.sh` 를 lens 안에 두고, livevil-setting 의 같은 파일과 분리. 노트북에 livevil-setting clone 안 되어 있어도 lens 만 있으면 작동.\n- **자동 pull + 명시적 push (방식 C)**: SessionStart 에서 `git pull --ff-only` 자동 실행. Stop 에서 자동 push 는 하지 않음. push 가 자동으로 발동되면 미완성 코드도 올라갈 위험 있어 사용자가 의도적으로 호출하도록.\n- **opt-out 메커니즘**: `LENS_SYNC_AUTO_PULL=0` 환경변수로 SessionStart auto-pull 끔. plugin level 토글이 아니라 환경변수 — 더 가볍고 사용자별 cusotomization 가능.\n- **Cross-platform Bash 자동 감지**: Windows Git for Windows (`C:/Program Files/Git/bin/bash.exe`), msys64, WSL fallback. macOS/Linux `/bin/bash`. 사용자가 어느 노트북에서든 추가 설정 없이 작동.\n- **Fail-soft 처리**: 한 repo 실패가 나머지 진행을 막지 않음. Diverged repo 는 손대지 않고 `manual resolve required` 로만 보고. Auto-merge 시도 안 함 (안전).\n- **Auto-commit message 정형화**: `chore: auto-sync YYYY-MM-DD` 단일 라인. 매번 같은 패턴이라 git log 에서 식별 쉬움. Author 강제 (`livevil7 <livevil7@gmail.com>`).\n- **이전 PC 전용 setup 폐기**: 이전엔 `~/.claude/settings.json` 에 SessionStart/Stop bash hook 직접 박고 `~/.claude/commands/sync-all.md` 슬래시 커맨드 파일 두는 방식이었음. lens v3.2.0 통합 후 양쪽 다 제거 → marketplace 통한 단일 source of truth.\n\n## 변경 파일\n\n- `skills/cs/SKILL.md` (신규) — `/cs` 명령 정의: `pull` / `push` / `sync` 3 모드, Bash resolution, 사용 패턴, fail-soft 정책 명시\n- `scripts/git-sync-all.sh` (신규) — POSIX shell 스크립트. workspace 자동 감지, fetch → ff-pull → auto-commit → push 4 단계 파이프라인. 컬러 박스 리포트 출력\n- `hooks/sync-pull.js` (신규) — Node 기반 SessionStart hook. cross-platform Bash 자동 resolve, 90초 timeout, fail-soft (오류 발생해도 세션 시작 막지 않음)\n- `hooks/hooks.json` — SessionStart 배열에 sync-pull entry 추가 (once: true). 기존 session-start.js 와 별개 등록\n- `.claude-plugin/plugin.json` — version 3.1.0 → 3.2.0, description \"Skill navigator + multi-repo git sync\" 로 확장, keywords `git-sync` `multi-repo` `auto-pull` 추가\n- `.claude-plugin/marketplace.json` — version + ref + description + tags 동기화\n- `CHANGELOG.md` — v3.2.0 entry\n\n## 테스트 & 검증\n\n- 이전 PC custom hook ( `~/.claude/settings.json` SessionStart/Stop bash + `commands/sync-all.md`) 제거 후 lens 단일 source 로 전환 확인\n- Windows commit 170fe01 + tag v3.2.0 push 성공 (livevil7/creeta-lens master)\n- Marketplace fetch URL `CreetaCorp/lens` 가 같은 commit 가리킴 (GitHub redirect/alias)\n- `git-sync-all.sh sync` 직접 실행으로 19 repo 일괄 처리 확인 (T+0 시작 → T+5 완료, push 3 / pull 2 / unchanged 14)\n\n## 추가 사항\n\n- 다음 세션 재시작 시 marketplace 자동 fetch → `/cs` 슬래시 등록 + SessionStart auto-pull 활성. 노트북도 동일 (Claude Code 재시작 한 번이면 끝).\n- 향후 개선 후보: (1) `/cs` 가 dry-run 모드 지원, (2) auto-commit message 에 변경 파일 요약 포함, (3) GIT_ROOTS 외에 `.lens-sync.json` 같은 per-project 설정 파일.\n- 자동 push 가 필요한 사용자는 `~/.claude/settings.json` Stop hook 으로 `bash <plugin>/scripts/git-sync-all.sh push` 직접 등록 가능 (lens 표준은 아님, opt-in).\n","truncated":false,"stale":false},{"id":"2026-04-23-v3.1.0-codex-premortem-skill-enforcement","folder":"history","title":"Lens v3.1.0 — Codex Pre-mortem + Skill Enforcement — 완료","date":"2026-04-23","hasMd":true,"hasHtml":false,"mdPath":"history/2026-04-23-v3.1.0-codex-premortem-skill-enforcement.md","htmlPath":null,"mdInline":"# Lens v3.1.0 — Codex Pre-mortem + Skill Enforcement — 완료\n\n**완료일**: 2026-04-23\n**Release**: v3.1.0\n\n## 요약\n\n`/cp` PLAN 모드에 Phase 2.5 Pre-mortem 단계를 추가해 Claude Opus + Codex GPT-5.2 병렬로 계획 문서의 리스크를 사전 분석하도록 했고, `/c` 와 `/cc` 의 Worker 프롬프트를 강화해 할당된 스킬을 반드시 호출하도록 강제하면서 Supervisor가 그 호출 여부를 감사하도록 만들었다.\n\n## 주요 결정 사항\n\n- **두 모델 병렬 pre-mortem**: 같은 모델로 자기 검증 시 동일 편향 공유 문제. Opus(세션 컨텍스트 기반) + Codex(독립 코드 분석)의 교차 검증으로 블라인드 스팟 해소.\n- **Codex 미설치 환경 fallback**: `command -v codex` 또는 VSCode 확장 경로 감지. 부재 시 \"Codex 미설치 — Opus 단독\" 명시 표기. 설치 강제 안 함.\n- **Supervisor 조건부 opus 승격**: Worker 할당에 `opus` 포함 시 Supervisor 도 자동 opus 승격. \"주니어가 시니어 코드 리뷰\" 역전 구조 해소. 단순 태스크는 sonnet 유지로 비용 절약.\n- **Skill Enforcement는 강제 명령문으로**: 기존 \"할당된 Skill (있는 경우)\" 참고 문구를 \"필수 실행 스킬 (SKIP 금지)\" 명령문으로 교체. 첫 액션 = `Skill invoke` 강제. 완료 보고 첫 줄 `Skill invoked: /{skill_name}` 필수.\n- **Supervisor 감사 조항**: Worker 보고에서 `Skill invoked:` 라인 누락 시 해당 서브태스크 점수 0점 + 재작업 지시. `general` 명시 태스크는 감사 제외.\n- **Phase 2/2.5 분리 Write**: Phase 2.5 실패해도 Phase 2 의 계획 문서는 이미 저장됨. 원자성 보장.\n\n## 변경 파일\n\n- `skills/cp/SKILL.md` — Phase 2.5 Pre-mortem 추가 (`## ⚠️ 사전 리스크` 섹션, Opus/Codex 병렬 호출, Blocker 판정)\n- `skills/c/SKILL.md` — Worker 프롬프트의 Skill Enforcement 강화, Supervisor opus 승격 + 감사 조항\n- `skills/cc/SKILL.md` — `/c` 와 동일 변경 (Worker + Supervisor)\n- `docs/rules/codex-integration.md` (신규) — Codex CLI 감지 로직, 인증 확인, 표준 호출 패턴(`codex exec --skip-git-repo-check`), 응답 파싱, pre-mortem 프롬프트 템플릿, 에러 처리\n- `.claude-plugin/plugin.json`, `marketplace.json` — version 3.0.0 → 3.1.0\n- `CHANGELOG.md` — v3.1.0 entry\n\n## 테스트 & 검증\n\n- `/cp` PLAN 모드 시연: 계획 저장 후 `## ⚠️ 사전 리스크` 섹션에 Opus + Codex 답변 양쪽 기록 확인\n- Codex 미설치 환경
