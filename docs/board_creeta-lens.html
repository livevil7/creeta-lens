<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lens — Documentation Board</title>
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">

<style>
/* ════ Light design tokens ════ */
:root {
  --bg: #fafafa;
  --card: #ffffff;
  --fg: #18181b;
  --fg-2: #3f3f46;
  --fg-mute: #71717a;
  --line: #e4e4e7;
  --line-soft: #f1f1f3;
  --accent: #2563eb;
  --accent-soft: rgba(37, 99, 235, 0.08);
  --warn: #b91c1c;
  --stale: #b45309;
  --stale-soft: rgba(180, 83, 9, 0.12);
  --good: #16a34a;
  --rules: #7c3aed;
  --rules-soft: rgba(124, 58, 237, 0.10);
}

* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
html, body { margin: 0; padding: 0; min-height: 100%; background: var(--bg); color: var(--fg); }

body {
  font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.55;
  font-feature-settings: "tnum";
}

::selection { background: var(--accent-soft); }

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

button {
  font: inherit; cursor: pointer;
  background: var(--card); color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 6px 12px;
  letter-spacing: -0.005em;
  transition: border-color 120ms, background 120ms, color 120ms;
}
button:hover { border-color: var(--fg-mute); }
button:active { transform: translateY(1px); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500; }
button.primary:hover { background: #1d4fd4; border-color: #1d4fd4; }
button.ghost { border-color: transparent; color: var(--fg-mute); }
button.ghost:hover { color: var(--fg); background: var(--line-soft); }

code, .mono {
  font-family: "Pretendard Variable", monospace;
  font-variant-numeric: tabular-nums;
}
code {
  font-size: 0.92em;
  background: var(--line-soft);
  padding: 1px 5px;
  border-radius: 3px;
  color: var(--accent);
}

/* ════ Top bar ════ */
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: rgba(250, 250, 250, 0.9);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  padding: 12px 24px;
  display: flex; align-items: center; gap: 16px;
}
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand .repo { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
.brand .repo .dim { color: var(--fg-mute); font-weight: 400; }
.brand .title { font-size: 12px; color: var(--fg-mute); }

.topbar .grow { flex: 1; }
.topbar .stats {
  display: flex; gap: 14px;
  font-size: 11px; color: var(--fg-mute);
  font-variant-numeric: tabular-nums;
}
.topbar .stats b { color: var(--fg); font-weight: 500; }
.topbar .stats .sep { color: var(--line); }

.search input {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 6px 12px;
  width: 240px;
  font: inherit;
  color: var(--fg);
}
.search input:focus { outline: none; border-color: var(--accent); }

/* ════ Board grid ════ */
.board {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  padding: 12px;
  min-height: calc(100vh - 53px);
}
.column {
  display: flex; flex-direction: column;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 6px;
  min-width: 0;
}
.col-head {
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
}
.col-head .label {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-mute);
  font-weight: 500;
}
.col-head .label .pip { width: 6px; height: 6px; border-radius: 50%; }
.column[data-column="tasks"]   .pip { background: var(--accent); }
.column[data-column="history"] .pip { background: var(--good); }
.column[data-column="rules"]   .pip { background: var(--rules); }
/* Rules column reads as "reference docs" — muted purple header accent. */
.column[data-column="rules"] .col-head { background: var(--rules-soft); }
.column[data-column="rules"] .col-head .label { color: var(--rules); }
.col-head .count {
  font-size: 11px;
  color: var(--fg-mute);
  font-variant-numeric: tabular-nums;
}

.cards {
  flex: 1;
  overflow-y: auto;
  display: flex; flex-direction: column;
  gap: 8px;
  padding: 10px;
}

/* ════ Card ════ */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 14px 16px;
  cursor: pointer;
  user-select: none;
  transition: border-color 120ms;
}
.card:hover { border-color: var(--fg-mute); }

.card h3.tt {
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: -0.01em;
  margin: 0;
  color: var(--fg);
  text-wrap: balance;
  word-break: break-word;
}

.card .meta-row {
  display: flex; flex-wrap: wrap; gap: 7px; align-items: center;
  margin-top: 9px;
  font-size: 11px;
  color: var(--fg-mute);
  font-variant-numeric: tabular-nums;
}
.card .meta-row .date { color: var(--fg-mute); }
.badge {
  font-size: 9.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 1.5px 6px;
  border-radius: 3px;
  font-weight: 600;
  line-height: 1.6;
}
.badge.html  { background: var(--accent-soft); color: var(--accent); }
.badge.md    { background: var(--line-soft); color: var(--fg-mute); }
.badge.stale { background: var(--stale-soft); color: var(--stale); }

.empty {
  padding: 32px 16px;
  text-align: center;
  color: var(--fg-mute);
  font-size: 12px;
  font-style: italic;
}

/* ════ Slide-over panel (cloned from reference) ════ */
.scrim {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(24, 24, 27, 0.4);
  opacity: 0; pointer-events: none;
  transition: opacity 200ms;
}
.scrim.open { opacity: 1; pointer-events: auto; }

.panel {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(860px, 62vw);
  background: var(--bg);
  border-left: 1px solid var(--line);
  z-index: 100;
  transform: translateX(100%);
  transition: transform 240ms cubic-bezier(0.22, 1, 0.36, 1);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.panel.open { transform: translateX(0); }

.panel header {
  padding: 18px 28px 14px;
  border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: flex-start; gap: 14px;
  background: var(--card);
}
.panel header .info { min-width: 0; }
.panel header .id-row {
  font-size: 11px;
  color: var(--fg-mute);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
  margin-bottom: 4px;
}
.panel header h2 {
  margin: 0;
  font-size: 22px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--fg);
  text-wrap: balance;
  max-width: 56ch;
  word-break: break-word;
}
.panel header .top-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }

.panel .notes {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  padding: 10px 28px;
  font-size: 11.5px;
  border-bottom: 1px solid var(--line);
  background: var(--card);
}
.panel .notes:empty { display: none; }
.panel .notes .trunc { color: var(--warn); }
.panel .notes .trunc a { color: var(--warn); text-decoration: underline; }

.panel .scroll { flex: 1; overflow: hidden; position: relative; }

.report-frame {
  width: 100%; height: 100%;
  border: 0; display: block;
  background: #fff;
}

.md-scroll { width: 100%; height: 100%; overflow: auto; }
.md-pre {
  margin: 0;
  padding: 24px 28px 48px;
  font-family: "Pretendard Variable", ui-monospace, monospace;
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--fg-2);
  white-space: pre-wrap;
  word-break: break-word;
  tab-size: 2;
}

/* ════ Toast ════ */
.toast {
  position: fixed;
  bottom: 24px; left: 50%; transform: translateX(-50%) translateY(12px);
  background: var(--fg);
  color: var(--card);
  border-radius: 4px;
  padding: 11px 18px;
  font-size: 12.5px;
  line-height: 1.5;
  z-index: 300;
  opacity: 0;
  transition: all 200ms;
  pointer-events: none;
  max-width: 520px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
}
.toast .cmd {
  font-family: "Pretendard Variable", ui-monospace, monospace;
  font-size: 11.5px;
  color: #93c5fd;
  word-break: break-all;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ════ Modal (clipboard fallback) ════ */
.modal-scrim {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(24, 24, 27, 0.45);
  display: none;
  align-items: center; justify-content: center;
  padding: 24px;
}
.modal-scrim.open { display: flex; }
.modal {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 22px 24px 20px;
  width: min(560px, 100%);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
}
.modal h3 {
  margin: 0 0 6px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.modal p {
  margin: 0 0 14px;
  font-size: 12.5px;
  color: var(--fg-mute);
  line-height: 1.55;
}
.modal textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 10px 12px;
  color: var(--fg);
  font-family: "Pretendard Variable", ui-monospace, monospace;
  font-size: 12.5px;
  resize: none;
  min-height: 64px;
}
.modal textarea:focus { outline: none; border-color: var(--accent); }
.modal .modal-actions {
  display: flex; justify-content: flex-end; gap: 8px;
  margin-top: 16px;
}

/* ════ Print ════ */
@media print {
  .topbar, .scrim, .toast, .modal-scrim { display: none !important; }
  .panel { position: static; transform: none; width: 100%; }
  body { background: #fff; }
}

/* ════ Responsive ════ */
@media (max-width: 980px) {
  .board { grid-template-columns: 1fr; }
  .panel { width: 100vw; }
  .topbar { flex-wrap: wrap; }
  .search input { width: 180px; }
}
</style>
<style>
/* ════ In Review column ════ */
.board { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.column[data-column="review"] .pip { background: var(--stale); }
.column[data-column="review"] .col-head { background: var(--stale-soft); }
.column[data-column="review"] .col-head .label { color: var(--stale); }
.badge.pr { background: var(--accent-soft); color: var(--accent); text-decoration: none; }
.badge.pr:hover { text-decoration: underline; }
@media (max-width: 980px) { .board { grid-template-columns: 1fr; } }
</style>
</head>

<script>
(() => {
  "use strict";

  const BOARD = {"schemaVersion":3,"repo":"creeta-lens","generatedAt":"2026-07-25T23:08:16.314Z","groups":{"tasks":[{"id":"2026-07-20-lens-plan-engine-overhaul","folder":"tasks","title":"Lens 계획 엔진 개편 — 기획서 품질 게이트 · 모델 배분 통제 · /cs PR 전환 · /cpp 정리","date":"2026-07-20","hasMd":true,"hasHtml":false,"mdPath":"tasks/2026-07-20-lens-plan-engine-overhaul.md","htmlPath":null,"mdInline":"---\r\ntitle: Lens 계획 엔진 개편 — 기획서 품질 게이트 · 모델 배분 통제 · /cs PR 전환 · /cpp 정리\r\ndate: 2026-07-20\r\nplanner: cp\r\ngrade: deep\r\nstatus: draft\r\nrefs:\r\n  - skills/cp/SKILL.md\r\n  - skills/cpp/SKILL.md\r\n  - skills/cc/SKILL.md\r\n  - skills/c/SKILL.md\r\n  - skills/ccp/SKILL.md\r\n  - skills/cs/SKILL.md\r\n  - lib/plan-manager.js\r\n  - lib/agent-tracker.js\r\n  - hooks/pre-tool-task.js\r\n  - scripts/git-sync-all.sh\r\n  - docs/rules/codex-integration.md\r\n---\r\n\r\n# Lens 계획 엔진 개편 — 기획서 품질 게이트 · 모델 배분 통제 · /cs PR 전환 · /cpp 정리\r\n\r\n> 이 문서 자체가 새 deep 골격의 실물 견본이다. 도입하려는 섹션 구성을 그대로 따른다.\r\n\r\n## 🎯 What — 목표 (무엇이 가능해지는가)\r\n\r\n**이 작업이 끝나면 가능해지는 것:**\r\n\r\n- 관리자가 Lens가 만든 기획안 하나만 읽고 **승인/반려를 판단할 수 있다.** 지금은 \"무엇을 만드는지\"가 빠져 있어 판단 근거가 부족하다.\r\n- 계획서에 **\"왜 이 방법을 골랐고 무엇을 버렸는지\"가 남는다.** 지금은 결론만 있고 선택의 근거가 없다.\r\n- **깊이가 얕은 계획서로는 실행이 시작되지 않는다.** 필수 항목이 비면 `/c`·`/cc`가 실행을 거부한다. 어떤 경로로 만들어진 계획이든(과거 문서·수동 작성·다른 세션 산출물) 동일하게 걸린다.\r\n- **최상위 모델이 필요한 일에만 쓰인다.** 파일 읽기·자료 수집 같은 단순 업무가 최상위 모델을 먹지 않고, 어떤 모델이 몇 번 쓰였는지 사용자가 확인할 수 있다.\r\n- **`/cs`로 푸시한 변경이 전부 PR로 남는다.** 기본 브랜치에 직접 밀어 넣는 경로가 사라진다.\r\n- 계획 스킬이 **`/cp` 하나 · 등급 3개(fast/standard/deep)**로 정리된다.\r\n\r\n**완료의 정의 (Done = ?):**\r\n\r\n> 새 골격으로 만든 계획서 한 건이 실제로 `/cc` 실행 진입 게이트를 통과하고, 같은 세션의 에이전트 모델 사용 내역이 기록으로 확인되며, `/cs` 한 번이 PR을 만들어 기본 브랜치 직접 푸시 없이 동기화를 끝낸 것이 실행으로 확인된다.\r\n\r\n## 🚧 비목표 (Non-Goals)\r\n\r\n> \"합리적으로 목표가 될 수 있었으나 이번엔 하지 않는 것.\"\r\n\r\n- **기존 계획서 80건의 소급 개정** — 하지 않는다. 완료된 history 문서를 새 골격으로 다시 쓰는 것은 가치가 낮다. 대신 실행 진입 게이트가 낡은 계획을 *실행 시점에* 잡는다.\r\n- **계획서 품질의 의미적(semantic) 자동 판정** — 하지 않는다. \"대안이 진짜로 검토됐는지\", \"리스크가 현실적인지\"는 규칙 검사로 판정 불가능하다(Codex 지적). 구조적 항목만 기계로 막고, 의미 품질은 사람 승인과 독립 검토에 맡긴다.\r\n- **모델 자동 선택기 고도화** — 하지 않는다. 이번엔 \"명시 의무 + 상한\"까지만. 복잡한 자동 선택 로직은 과잉이다.\r\n- **Codex로 적대적 검증 전면 대체** — 하지 않는다. 독립 검토 1개 역할만 시험한다. 광범위 대체는 결과 형식·판단 기준이 달라져 통합 비용이 커진다.\r\n- **전 레포 squash auto-merge** — 이번 범위 밖. PR-only까지만 하고 자동 병합은 별도 단계로 뺀다(미해결 질문 Q1 참조).\r\n- **`/ccp` 파이프라인 재설계** — 모델 배분만 손대고 검증 로직은 건드리지 않는다.\r\n\r\n## ❓ Why — 왜 해야 하는가 (6하원칙)\r\n\r\n- **왜 지금**: 세 문제가 동시에 임계에 왔다. ① 기획서 80건 전수조사에서 NFR·인수기준·미해결질문·테스트케이스 표가 **단 한 번도 등장하지 않았다(0/80)**. ② 최상위 모델(fable) 사용량이 구독의 50%에 도달했다. ③ `/cs`가 26개 레포에 **기본 브랜치 직접 푸시**를 계속하고 있어 검토 기록이 남지 않는다.\r\n- **무엇을**: 계획서 골격에 결손 섹션을 넣고, 그 골격을 *실행 진입 시점에* 강제하고, 모델 배분을 계측·상한으로 통제하고, `/cs`를 PR 경유로 바꾼다.\r\n- **어떻게**: 산문 규칙을 늘리는 게 아니라 **집행 지점을 옮긴다.** 작성 시점 검사는 우회 경로가 많아(응답 본문으로만 계획을 내는 경우·외부 수정·과거 문서) 실효가 없다. 실행 진입은 우회가 불가능하다.\r\n- **누구를 위해**: 기획안을 읽고 승인하는 관리자(사용자 본인), 그리고 그 계획을 받아 실행하는 `/cc` worker.\r\n- **어디서**: creeta-lens 리포 → 새 버전 출시 → 이 컴퓨터 우선 적용, 다른 머신은 각자 업데이트 시.\r\n- **안 하면**: 기획안은 계속 \"실행 로그에 가까운 문서\"로 남아 승인 판단에 못 쓰이고, 최상위 모델 쿼터는 단순 업무에 계속 소모되며, 코드 변경 이력에 검토 기록이 남지 않는다. 그리고 이번에 확인된 **\"딱지와 내용이 불일치하는 계획서\"**(`planner: cpp`인데 71줄, 하드게이트 전무)가 계속 생산된다.\r\n\r\n## 📖 용어 풀이 (운영자용)\r\n\r\n| 용어 | 쉬운 설명 |\r\n| --- | --- |\r\n| **골격 / 스켈레톤** | 계획서에 반드시 들어가야 하는 섹션 목록. 지금은 What/Why/How/Review 4개 축. |\r\n| **비목표(Non-Goals)** | \"할 수도 있었지만 이번엔 안 한다\"고 못 박는 것. 범위가 슬금슬금 늘어나는 걸 막는다. |\r\n| **검토된 대안** | 최종안 말고 검토했다가 버린 방법들과 버린 이유. 첫 아이디어를 그냥 적었는지, 실제로 고민했는지가 여기서 드러난다. |\r\n| **차단 질문** | 답이 없으면 실행을 시작할 수 없는 질문. 답이 없어도 진행 가능한 질문(비차단)과 구분한다. |\r\n| **게이트** | 조건을 못 채우면 다음 단계로 못 가게 막는 관문. |\r\n| **실행 진입 게이트** | 계획을 *쓸 때*가 아니라 *실행을 시작할 때* 검사하는 관문. 어떤 경로로 만든 계획이든 실행하려면 반드시 통과해야 해서 우회가 안 된다. |\r\n| **TOP (최상위 티어)** | 난이도 사다리의 맨 윗칸. 현재 실물은 fable. 이름이 아니라 상대 위치라 새 모델이 나오면 자동으로 올라간다. |\r\n| **상속** | 에이전트를 띄울 때 모델을 지정하지 않으면 부모 세션 모델을 그대로 물려받는 것. 부모가 fable이면 자식도 fable. |\r\n| **fan-out** | 하나의 조사를 여러 갈래로 쪼개 에이전트를 동시에 여러 개 띄우는 것. |\r\n| **squash 병합** | 여러 커밋을 하나로 합쳐 넣는 병합 방식. **원격에 새 커밋이 생기므로** 로컬에 남은 원본 커밋과 갈라진다. |\r\n| **fail-closed** | 실패했을 때 우회하지 않고 그냥 멈추는 것. 반대는 \"실패하면 예전 방식으로 몰래 진행\". |\r\n\r\n## 🧰 실행 전략 & 자원\r\n\r\n- **난이도**: **deep** — 되돌리기 어려운 변경(스킬 폐지·푸시 방식 전환)이 포함되고, 5개 스킬 + 훅 + 셸 스크립트에 걸쳐 있으며, `/cs` 변경은 26개 레포의 운영 동기화에 직접 영향.\r\n- **권장 모델**: 설계·게이트 로직은 TOP(현재 fable). 문구 일괄 치환·참조 갱신은 중간 티어. 파일 목록 수집은 경량 티어.\r\n- **병렬 실행**: 작업 패키지 1·3은 서로 독립이라 병렬 가능. 패키지 2는 같은 파일(`cp/SKILL.md`)을 여러 갈래로 건드리므로 **순차**.\r\n- **활용 스킬·도구**: codex CLI(교차 검증 — 이미 1회 수행), `gh`(PR), node(기존 의존), git. Playwright 불필요(화면 작업 없음).\r\n- **기존 자원 재사용**:\r\n  - `lib/plan-manager.js`의 `validatePlanStructure()` + `SECTION_ALIASES` — 죽어 있지만 **다국어 별칭 로직은 살아 있어 재사용 가능**. 새로 만들지 않는다.\r\n  - `hooks/pre-tool-task.js` — 이미 `tool_input`을 받고 있어 `model` 기록에 신규 배선 불필요.\r\n  - `scripts/bump-version.sh` — 14곳 일괄 버전 갱신.\r\n  - `scripts/git-sync-all.sh` — 순수 POSIX 셸. 이 성질을 유지한다.\r\n\r\n## 🔬 조사 보고\r\n\r\n이번 계획 수립에 실제로 수행한 조사와 결과.\r\n\r\n**① 산출물 전수조사 (계획서 80건, 14개 레포)**\r\n\r\n- 줄 수: 중앙값 **153**, 최소 33, 최대 1,050. 100줄 미만 27.5%, 150줄 미만 50%.\r\n- 섹션 존재율: What 89% · Review 85% · 진행상황 88% · Why 70% · Pre-mortem 61% · 듀얼합성 59% · Plan B 56% · Plan A 50% · **실행전략 28% · 시사점 28% · 용어집 1%**.\r\n- **전수 0%**: NFR · 인수기준(AC는 1건) · 테스트케이스 표 · 미해결 질문 · ADR.\r\n- 계약류: API 계약 20%(스키마까지 간 건 1건) · 데이터모델 34% · 상태전이 6% · 와이어프레임 8%.\r\n- 추적성: `planner` 부재 52%, `grade` 부재 86%.\r\n- **딱지-내용 불일치 실례**: `namane-mkt/docs/tasks/2026-06-23-cardgen-saas-roadmap.md` — `planner: cpp`인데 71줄, Codex 협의·Plan A/B·Pre-mortem·EARS 검증 전무.\r\n\r\n**② 업계 표준 리서치 (PRD·Google DD·RFC·KEP·ADR·PR/FAQ·Spec Kit·Kiro·EARS·ISO 25010·STRIDE·SLI/SLO)**\r\n\r\n- 어떤 방식으로 써도 빠지지 않는 **불변 코어 5개**: 문제/맥락 · 목표+**비목표** · 해법 · **검토된 대안** · 결과/리스크. Lens 골격에 자리가 있는 건 3개뿐.\r\n- **분량 규범은 일관되게 \"짧게\"**: Google DD 10~20p(넘으면 문제를 쪼개라) · Amazon 6p 하드캡 · ADR 1~2p · Figma/Notion/Intercom 1p. **\"길수록 좋다\"고 한 1차 출처는 없다.**\r\n- AI 에이전트용 명세의 추가 조건: 모호성 사전 제거 · 기계 검증 가능한 인수기준 · **\"DO NOT CHANGE\" 명시**(에이전트는 건드리면 안 되는 것에 대한 맥락 판단이 없음) · 기술 스택 버전까지 선행 확정.\r\n\r\n**③ 코드 실측 (creeta-lens)**\r\n\r\n- `lib/plan-manager.js:230` `REQUIRED_SECTIONS` = v3.4 골격(Goal/Verification/Plan A/Plan B/Risks/Status). v3.21 필수 섹션 미반영.\r\n- `lib/plan-manager.js:579` `validatePlanStructure()` **런타임 호출자 0** (자체 CHANGELOG:284가 명시).\r\n- `lib/agent-tracker.js:177` `registerAgent(description)` — **모델 미기록**. `hooks/pre-tool-task.js:26`이 `tool_input`을 이미 수신 중.\r\n- fable 소비 구조: `/ccp` 6개 TOP(`ccp:196-201`) · `/cpp` S2 fan-out 6축 **모델 지시 부재→전량 상속**(`cpp:108-126`) · `/cc` Hard 1개로 Supervisor+QA 동반 승격(`cc:513`) · `/cp` Pre-mortem 세션 내부 수행(`cp:413-415`).\r\n- `/cp`→`/cc` 핸드오프 페이로드(`cp:553-578`): DO NOT CHANGE · 비목표 · 기각된 대안 · 차단질문 상태가 **전부 없음**. 페이로드 절반이 Plan A/B 4블록.\r\n- `/cs`: `git push origin HEAD` — 현재 브랜치 직접 푸시. 26개 레포 중 25개가 기본 브랜치.\r\n- `.claude-plugin/plugin.json` = `\"skills\": \"./skills/\"` 자동 스캔. `lib/board-builder.js`는 `planner` 미참조.\r\n- task-deep 양식 분기 실제 위치 = **`skills/cp/SKILL.md:663`** (templates/report-conversion-spec.md 아님).\r\n\r\n**④ Codex 교차 협의 (gpt-5.6-sol, high, 재시도 성공)**\r\n\r\n- 1차 호출 180초 초과로 **0바이트 종료**. 2차(420초 + 탐색 범위 제한) 성공(23.6KB). → `docs/rules/codex-integration.md` 타임아웃 규칙을 규모 분기로 개정 완료.\r\n- 핵심 반박 4건은 「🔀 검토된 대안」에 반영.\r\n\r\n**⑤ `/cpp` 통합 적대적 검증 (독립 에이전트)**\r\n\r\n- 판정 **not-yet** + 조건 4개. Codex와 독립적으로 같은 결론(통합 보류) 도달.\r\n- 발견: progressive disclosure는 이 레포에 선례 0이며, frontmatter 분기 실패 사고 이력 있음(CHANGELOG:50, v3.23.0).\r\n\r\n**⑥ 유실된 조사**: 설계 워크플로(3축 × 3렌즈)가 오케스트레이션 유실로 사망(`journal.jsonl` 미생성). 에이전트 산출물은 남았으나 `/cs` 축이 auto-merge 전제라 폐기 판단. Codex 협의가 커버 범위를 대체.\r\n\r\n## 🛠 How — 어떻게\r\n\r\n> 순서는 Codex 권고를 따른다: **한 번에 다 바꾸면 회귀 원인을 구분할 수 없다.** 패키지 단위로 순차 적용하고 각 패키지마다 검증한다.\r\n\r\n### 패키지 1 — 모델 배분 통제 (1순위)\r\n\r\n> 근거: 가장 작고 외과적이며 즉시 효과가 난다. **현재 정책을 완벽히 지켜도 fable을 많이 쓰도록 설계돼 있다**(Codex 교정) — 계측만으론 못 줄인다. 계측과 정책을 함께 바꾼다.\r\n\r\n- [ ] **1-1. 모델 계측** — `hooks/pre-tool-task.js`가 `toolInput.model`·`toolInput.subagent_type`을 읽어 `registerAgent()`에 전달. `lib/agent-tracker.js`의 agent 엔트리에 `model`·`agentType`·`skill` 필드 추가.\r\n      - 파일: `hooks/pre-tool A-3b. **등급 호출 방식 — 예약어 3개 (사용자 결정 2026-07-20: \"내가 정하는 게 좋아\")**\r\n      - `/cp fast {요청}` · `/cp standard {요청}` · `/cp deep {요청}` — 등급 **명시 지정**. `/cp {요청}` 은 종전대로 **자동 판정**.\r\n      - **모호성 해소 규칙**: 첫 토큰이 정확히 `fast`/`standard`/`deep` 이면 **등급으로 소비**하고 나머지 전부를 요청으로 본다. ⚠️ `flow` 의 기존 규칙(*\"뒤에 자연어가 붙으면 PLAN 으로 해석\"*)은 **여기 적용 불가** — 등급어는 뒤에 자연어 요청을 받는 것이 정상 용법이기 때문이다.\r\n      - **오인식 완화**: 요청이 실제로 등급어로 시작하는 경우(`deep dive 버그 원인 찾아줘`)에 등급으로 오소비될 수 있다. 이를 잡기 위해 **승인 게이트(Phase 5)에 등급과 그 출처를 반드시 표시**한다 — `등급: deep (사용자 지정)` / `등급: standard (자동 판정 — 사유: …)`. 사용자가 한눈에 보고 Modify 할 수 있으면 오인식은 사고가 되지 않는다.\r\n      - **요청이 빈 경우**(`/cp deep` 단독): 등급만 고정하고 요청을 되묻는다(인자 없는 스캔 모드로 폴백하지 않는다).\r\n      - **선행 의존**: `/cp deep` 이 실제로 동작하려면 deep 파이프라인 본문이 있어야 한다 → **2C-1(이관)과 같은 커밋에서 처리**한다. 파싱만 먼저 넣으면 `/cp deep` 이 빈 껍데기가 된다(dormant 스캐폴딩 금지 원칙).\r\n- [ ] 2A-3c. **등급 불일치 가드 — 양방향 (사용자 결정 2026-07-20: \"잘못 호출했으면 니가 다시 제안할 수도 있겠지\")**\r\n      - 사용자가 등급을 명시해도 `/cp` 는 **위험도 자동 판정을 그대로 수행**하고, 지정 등급과 어긋나면 진행 전에 **제안**한다. 강제 전환은 없다 — 사용자가 고수하면 지정대로 간다.\r\n      - **비대칭 강도 (의도적)**:\r\n        - **낮춰 지정 (위험 판정 > 지정 등급)** → **강한 경고.** 사유를 구체적으로 대고(`배포 직결 / DB 마이그레이션 / 다중 시스템 / 되돌리기 어려움`) 상향을 권한다. 되돌리기 어려운 작업을 `fast` 로 계획하면 **실제 손해**가 난다.\r\n        - **높여 지정 (위험 판정 < 지정 등급)** → **가벼운 안내 한 줄.** 과잉 계획은 시간 낭비일 뿐 사고가 아니다. `/cpp` 의 기존 다운그레이드 가드가 이 자리로 흡수된다.\r\n      - **질문은 1개** (하네스 규칙: 질문 1개 지향, 승인 게이트와 분리). 이 가드 질문은 Phase 5 승인 질문에 **섞지 않는다** — 진행 전에 끝낸다.\r\n      - 결과는 등급 출처 표기에 반영: `등급: fast (사용자 지정 — deep 권고를 사용자가 기각)`. 나중에 문제가 생겼을 때 판단 이력이 남는다.\r\n      - 이로써 기존 두 가드(`/cpp` 다운그레이드 가드 · `/cp` \"Deep 신호 감지 시 제안\")가 **하나의 양방향 규칙으로 통합**된다.\r\n- [ ] 2A-4. **미결 질문 규칙** — \"전량 0\"이 아니라 **차단 질문만 0**. 비차단 질문은 가정·기본선택·확인시점과 함께 남긴다. (전량 0 강제는 질문 은폐를 유도 — Codex 지적)\r\n- [ ] 2A-5. **관리자용 결정 요약을 맨 앞에** — 목표·기대효과·비용/공수·주요 의존성·**요청하는 결정**·중단 조건을 한 화면에. 등급 무관 짧게 유지.\r\n- [ ] 2A-6. `grade:`/`planner:` **frontmatter를 spec에 명문화**(현재 정의 자체가 없음) + 필수화.\r\n- [ ] 2A-7. `lib/plan-manager.js`의 `REQUIRED_SECTIONS`를 신 골격 — 실행 중 발생한 **추가 질문 수**와 **편차 건수**를 `## 진행상황`에 기록. 이것이 없으면 **골격 개편이 실제로 효과가 있었는지 판정할 수 없고**, 섹션만 계속 바꾸게 된다(Codex 2순위 \"먼저 할 것\" — 초안에서 누락됐던 항목).\r\n      - 파일: `skills/cc/SKILL.md` §7.4\r\n      - 판정 기준: 개편 전후 동일 성격 작업에서 **추가 질문 수가 감소**하면 골격 개편이 효과 있음\r\n\r\n**[2C] `/cpp` → `/cp deep` 정리 (2A·2B 완료 후)**\r\n\r\n- [ ] 2C-1. `/cpp`의 9단계 파이프라인·Codex 하드게이트·fan-out·빌드레디 태스크를 `/cp`의 **deep 등급 본문으로 이관**. **Constitution·하드게이트 조항은 `cp/SKILL.md` 인라인 유지**(조건부 Read 뒤로 숨기지 않는다 — 검증 발견 1).\r\n- [ ] 2C-2. `/cpp`의 **다국어 트리거 22개를 `/cp`의 Triggers로 이관** — \"파워플랜/끝장 계획/심층 계획/프로토타입 계획\" 등이 `/cp`를 발동시키고 **deep 등급으로 자동 판정**.\r\n- [ ] 2C-3. `skills/cp/SKILL.md:663` 분기를 **`grade: deep` OR `planner: cpp`**(레거시 하위호환) — 기존 17건이 6슬라이드로 강등되는 것 차단.\r\n- [ ] 2C-4. `/cp` 저빈도 모드(ORGANIZE·DONE·FLOW, ~180줄) 외부화 — 기존 \"서식은 외부, 정책은 인라인\" 컨벤션에 부합.\r\n- [ ] 2C-5. 참조 갱신 — `skills/ccp`(6곳) · `skills/cc`(1곳) · README·CLAUDE.md·START_HERE(19곳) · `docs/rules` 3종(10곳) · `capability-assumptions.json`(1곳). **CHANGELOG·docs/history는 과거 기록이므로 미수정.**\r\n- [ ] 2C-6. `skills/cpp/` 폴더 삭제.\r\n\r\n### 패키지 3 — `/cs` PR 전환 (3순위)\r\n\r\n> Codex 권고 반영: **PR-only 먼저, auto-merge는 별도 단계.** 현재 제안 그대로면 PR을 만들 수 없거나 동기화를 깨뜨린다.\r\n\r\n- [ ] **3-1. 커밋 전 임시 브랜치** — 가장 중요. 기본 브랜치에서 커밋한 뒤 PR을 만들면 **비교할 변경이 남지 않는다.** dirty 감지 시 커밋 *전에* `sync/<날짜>-<해시>` 브랜치를 만들고 거기서 커밋한다. 기본 브랜치는 원격과 동일하게 유지.\r\n- [ ] **3-2. base 결정 규칙** — 각 레포의 실제 기본 브랜치. **`Returns_ERP_v20`은 `staging`으로 고정하고 자동 병합 대상에서 제외**(staging→main 승격은 `promote-to-main.sh` 별도 규칙, 운영 배포 직결).\r\n- [ ] **3-3. 중복 PR 방지** — 열린 동일 PR이 있으면 재사용, 없으면 생성. 재실행해도 중복 커밋·PR이 안 생겨야 한다.\r\n- [ ] **3-4. fail-closed** — PR 생성 실패 시 **기본 브랜치 직접 push로 우회 금지.** 실패로 보고하고 멈춘다. (우회하면 사용자가 요구한 \"PR 보장\"이 조용히 무너진다.)\r\n- [ ] **3-5. 병합 후 로컬 복귀** — 병합 확인 후 기본 브랜치로 돌아와 fast-forward. squash가 원격에 새 커밋을 만들므로 이 단계가 없으면 다음 `/cs`가 즉시 `diverged`로 멈춘다.\r\n- [ ] **3-6. 미병합은 \"동기화 완료\"로 보고 금지** — 병합 대기 중인 변경은 운영 머신이 못 받는다. 보고에 명시.\r\n- [ ] **3-7. `.github/workflows/` 사전 감지** — `gh` 토큰에 `workflow` 스코프가 없어 해당 변경이 낀 푸시는 거부된다. 미리 감지해 실패 목록에 명시.\r\n- [ ] **3-8. PR 본문은 단순하게** — 변경 파일 목록 + diff 요약. **LLM diff 분석을 필수 의존성으로 넣지 않는다**(인증·비용·응답 실패가 git 동기화 자체를 중단시킨다 — Codex 지적). 스크립트의 순수 POSIX 셸 성질 유지.\r\n- [ ] **3-9. 부분 성공 보고** — 일부 레포만 성공한 경우 정확한 단계와 복구 방법을 보고.\r\n- [ ] **3-10. 비배포 레포 3개로 먼저 검증** 후 전체 적용.\r\n\r\n### 패키지 4 — 출시\r\n\r\n- [ ] 4-1. CHANGELOG.md · CLAUDE.md 버전 항목 작성\r\n- [ ] 4-2. `bash scripts/bump-version.sh <ver>` (14/14 검증 출력 확인)\r\n- [ ] 4-3. **순서 엄수**: 커밋 → 태그 → push → `git show <tag>:.claude-plugin/marketplace.json`으로 ref 확인. **태그 누락 시 다른 머신에 옛 코드 설치**(실측 사고 이력)\r\n- [ ] 4-4. 이 컴퓨터 플러그인 업데이트 후 버전 확인\r\n\r\n## 🔀 검토된 대안 (Alternatives Considered)\r\n\r\n> 이 섹션이 이번 개편의 핵심 신설 항목이다. 최종안이 목표에 비추어 최선임을 증명한다.\r\n\r\n**대안 A — 계획서에 섹션을 대폭 추가하고 등급별 최소 줄 수를 강제**\r\n\r\n- *Good, because* 결손 섹션(NFR·대안·미결질문)이 확실히 표면화된다.\r\n- *Bad, because* **줄 수를 품질 대리값으로 쓴다.** 이미 중앙값 153줄인데 만족스럽지 않았다는 사실 자체가 길이≠품질을 증명한다. 각 섹션을 한 줄로 때워도 형식 검증은 통과한다. 작은 작업의 계획 비용이 실행 비용을 넘는다.\r\n- **기각.** 대신 필수 7항목 + 조건부 부록 + 위험도 기반 등급으로 축소.\r\n\r\n**대안 B — 작성 시점 훅(PostToolUse)으로 계획서를 검사**\r\n\r\n- *Good, because* 잘못된 문서가 애초에 저장되지 않는다.\r\n- *Bad, because* 우회 경로가 많다 — 다른 파일 쓰기 경로는 훅 대상이 아니고, 파일을 안 쓰고 응답 본문으로만 계획을 내면 검사가 아예 안 돌며, **외부 수정·과거 버전 문서는 생성 시점 훅을 거친 적이 없다.**\r\n- **기각.** 실행 진입 게이트로 대체 — 어떤 경로로 만든 계획이든 실행하려면 통과해야 하므로 우회 불가. 소급 정리가 불필요해지는 것도 이 선택의 부산물.\r\n\r\n**대안 C — `/cpp`를 즉시 폐지하고 `/cp`에 통합**\r\n\r\n- *Good, because* 등급 체계가 한 곳에 모이고 골격 동기화 실패가 사라진다.\r\n- *Bad, because* 독립 검증 2건이 \"품질 문제 해결 전 인터페이스 변경\"을 지적했다. 지금 `/cp`는 고정 Plan A/B, `/cpp`는 Body-Adaptive로 **구조 철학이 다르다** — 정도 차이가 아니라 종류 차이.\r\n- **조건부 채택 — 순서를 바꿔서.** 2A(골격 통일)가 `/cp`를 Body-Adaptive로 옮기면 그 차이가 소멸한다. 차이가 사라진 뒤 2C에서 폐지한다. 같은 릴리스 안에서 순서만 지킨다.\r\n\r\n**대안 D — deep 파이프라인을 `skills/cp/deep.md`로 분리해 조건부 Read**\r\n\r\n- *Good, because* `cp/SKILL.md` 비대화를 막는다.\r\n- *Bad, because* **보장된 로드가 확률적 툴콜로 격하된다.** 지금은 `/cpp` 호출 시 하드게이트 조항이 무조건 로드되는데, 조건부 Read가 실패하면 인라인 기본값(degrade)이 조용히 적용돼 안전조항이 티 안 나게 무력화된다. 이 레포에 frontmatter 분기 실패 사고 이력도 있다(CHANGELOG:50). 게다가 정책은 인라인에 남겨야 하므로 **파일이 오히려 커진다** — 원래 동기가 무너진다.\r\n- **기각.** 정책·게이트는 인라인 유지. 크기 문제는 `/cpp` 병합 시 중복 소멸(비교표·라우팅 안내가 존재 이유를 잃음) + `/cp` 저빈도 모드 외부화로 해결.\r\n\r\n**대안 E — `/cs`를 PR + squash auto-merge로 (당초 선택)**\r\n\r\n- *Good, because* PR 기록이 남으면서 동기화도 안 끊긴다.\r\n- *Bad, because* **auto-merge가 즉시 실행되면 PR은 검토 단계가 아니라 기록용 포장에 불과하다**(Codex). 즉 \"PR 무조건 생성\"의 원래 취지(검토 기록)를 자기부정한다. 또 검사 실패·auto-merge 미허용 시 변경이 기본 브랜치에 영영 도달하지 않고, staging 자동 병합은 승인 없는 배포를 촉발한다.\r\n- **보류.** PR-only를 먼저 시행하고 auto-merge는 별도 단계로. → 미해결 질문 Q1.\r\n\r\n**대안 F — `/ccp` 적대적 검증을 Codex로 광범위 대체**\r\n\r\n- *Good, because* fable 부하가 다른 공급자로 넘어간다.\r\n- *Bad, because* 결과 형식·판단 기준이 달라져 통합 비용이 커지고, 전체 비용·지연·일관성이 개선된다는 근거가 없다. Codex 타임아웃 사고 2건이 보여주듯 신뢰성도 미검증.\r\n- **축소 채택.** 독립 검토 **1개 역할만** 시험하고 품질·비용을 비교한 뒤 확대 여부 결정.\r\n\r\n## 🚫 DO NOT CHANGE\r\n\r\n> 실행자(`/cc` worker)가 건드리면 안 되는 것.\r\n\r\n- `docs/history/**` · `CHANGELOG.md`의 과거 항목 · `CLAUDE.md` 버전 히스토리 — **역사적 기록.** 낡은 모델명·구 스킬명이 나와도 고치지 않는다.\r\n- `lib/board-builder.js` — `planner`를 참조하지 않으므로 이번 변경과 무관. 건드릴 이유 없음.\r\n- `docs/rules/codex-integration.md`의 §\"깊이·시간 분기\" 및 §7 — **이번 세션에서 이미 개정 완료.** 재작업 금지.\r\n- 기존 `docs/tasks/**`의 계획서 80건 — 소급 개정하지 않는다(비목표).\r\n- `scripts/git-sync-all.sh`의 **순수 POSIX 셸 성질** — Node/Python 의존을 추가하지 않는다.\r\n- `/cs`의 fail-soft 성질 — 한 레포 실패가 다른 레포를 막지 않는다.\r\n- Monitor 역할의 haiku 배정 — 폴링뿐이라 상위 모델 이득 0(실측 근거 기존 문서에 있음).\r\n\r\n## 💡 시사점 · ⚠️ 주의점 · 🔀 Side Effect\r\n\r\n- **💡 시사점**: 게이트가 작성 시점에서 **실행 진입 시점으로 이동**하면 소급 정리 없이도 과거 계획 전체가 커버된다. 그리고 모델 \"상속\" 폐기는 계측 구멍을 막는 동시에 소비를 줄이는 **일석이조** — 관측과 통제가 같은 변경으로 해결된다.\r\n- **⚠️ 주의점**: ① `/cs` 변경은 26개 레포의 운영 동기화에 직접 영향 — 비배포 레포 3개 선검증 필수. ② 모델 명시 의무화는 5개 스킬 전체를 건드리므로 문구 누락 시 일부 경로만 옛 규칙으로 남는다. ③ 출시 태그 누락 = 다른 머신에 옛 코드 설치(실측 사고 이력).\r\n- **🔀 Side Effect (파급)**: 스킬 6종(`c`·`cc`·`ccp`·`cp`·`cpp`·`cs`) · 훅 1종 · lib 2종 · 셸 스크립트 1종 · rules 3종. `/cpp` 폐지로 해당 슬래시 명령 소멸(트리거는 `/cp`로 이관). 실행 진입 게이트로 **기존 계획서 일부가 실행 거부될 수 있음** — 의도된 동작이나 첫 조우 시 당황할 수 있어 거부 메시지에 \"무엇을 채우면 되는지\"를 명시해야 한다.\r\n\r\n## ⚠️ 리스크 레지스터\r\n\r\n| ID | 리스크 | 트리거 | 영향 | 대응 | 중단 조건 |\r\n| --- | --- | --- | --- | --- | --- |\r\n| R1 | `/cs` PR 전환이 운영 동기화를 끊음 | 병합 실패·auto-merge 미지원 | **높음** — Mac Mini가 코드를 영영 못 받음 | fail-closed + 미병합은 \"완료\" 보고 금지 + 비배포 3개 선검증 | 선검증 레포에서 1건이라도 미병합 잔류 시 전체 적용 중단 |\r\n| R2 | squash 후 로컬/원격 이력 분기 | 기본 브랜치에 먼저 커밋 | 높음 — 다음 `/cs`가 멈춤 | 3-1(커밋 전 임시 브랜치) + 3-5(병합 후 ff 복귀) | 검증에서 `diverged` 1건 발생 시 |\r\n| R3 | `Returns_ERP_v20` 자동 병합이 승인 없는 운영 배포 유발 | base를 main으로 잡거나 staging 자동 병합 | **높음 · 비가역** | base=staging 고정 + 자동 병합 대상 제외 | 해당 레포에서 자동 병합 시도 감지 즉시 |\r\n| R4 | 모델 강등이 품질을 떨어뜨림 | `/ccp` Skeptic·fan-out을 중간 티어로 | 중간 — 재작업 증가로 총사용량이 오히려 상승 가능 | 강등 전후 동일 과제로 비교, 회귀 시 개별 복원 | 동일 과제에서 검증 누락이 2건 이상 늘면 |\r\n| R5 | 실행 진입 게이트가 정상 작업을 막음 | 게이트 기준이 과엄격 | 중간 | 거부 메시지에 결손 항목 명시 + 사용자 1회 우회 허용 | 정상 계획이 2회 연속 거부되면 기준 재조정 |\r\n| R6 | 게이트가 형식만 검사해 통과율만 오름 | 제목 존재 여부만 확인 | 중간 — **품질 착시** | 구조는 기계 검사, 의미는 사람 승인. \"통과=품질\"이라 주장하지 않는다 | — |\r\n| R7 | 한 번에 다 바꿔 회귀 원인 구분 불가 | 패키지 동시 적용 | 중간 | 패키지 순차 적용 + 패키지별 검증 | — |\r\n| R8 | Codex 협의가 또 타임아웃 | 대규모 입력 + 탐색 유발 프롬프트 | 낮음(개정 완료) | 규모별 상한(180/300/600) + 대규모 background + 탐색 범위 제한 | 같은 지점 2회 초과 시 규칙 재개정 |\r\n\r\n**소유자**: 전 항목 사용자(단독 운영). 개인 프로젝트이므로 별도 담당자 지정은 무의미 — 대신 중단 조건을 명시해 판단 시점을 고정했다.\r\n\r\n## ❓ 미해결 질문\r\n\r\n**차단 — 전량 해소됨 (2026-07-20)**\r\n\r\n- ~~**Q1 — `/cs` auto-merge를 이번에 포함하는가?**~~ → **해소: PR-only 선행.** 사용자 결정(2026-07-20), Codex 권고 채택. auto-merge는 비목표로 확정하고 별도 단계로 분리. 패키지 3 차단 해제.\r\n- ~~**Q2 — \"fable 50%\"의 정의는?**~~ → **해소: `/usage`의 주간 한도 소진 비율.** 사용자 확인(2026-07-20). 따라서 상한은 **세션당 TOP 에이전트 개수**로 걸고, 효과는 **주간 한도 비율의 추이**로 판정한다(단일 세션 비교로는 판정 불가 — 작업 성격에 따라 변동이 크므로 최소 2주 관측). 패키지 1-6 차단 해제.\r\n\r\n**비차단 (가정을 두고 진행, 나중에 확인)**\r\n\r\n- Q3 — 명령별 TOP 상한의 초기값. **가정**: `/cc` 3개 · `/ccp` 1개 · `/cp deep` 2개로 시작해 실측 후 조정. 확인 시점: 패키지 1 검증 직후 + 1주 뒤 `/usage` 비율 재확인.\r\n- Q4 — 실행 진입 게이트의 사용자 우회 허용 여부. **가정**: 1회 우회 허용하되 \"게이트 우회됨\"을 계획 문서에 기록. 확인 시점: 패키지 2 검증 시.\r\n- Q5 — 조건부 부록 감지 신호의 정밀도. **가정**: 파일 확장자·경로 패턴 기반의 단순 규칙으로 시작. 오탐 시 사용자가 Modify로 조정.\r\n\r\n## ✅ Review — 검증\r\n\r\n**검증 전략**: 각 패키지 완료 시점에 아래 항목을 이 컴퓨터에서 직접 실행해 확인하고, pass/fail을 표로 보고한다. 범위는 이 컴퓨터에서의 동작 + 출시 상태까지. 다른 머신 반영은 범위 밖(기록만).\r\n\r\n| # | 목표가 됐다는 신호 | 확인 방법 | 통과 판정 | 종류 | 패키지 |\r\n| --- | --- | --- | --- | --- | --- |\r\n| 1 | 에이전트 모델이 기록된다 | 에이전트 1개 spawn 후 `.lens/agent-dashboard.json` 확인 | `model` 필드에 값 존재 | auto | 1 |\r\n| 2 | 모델 미지정 spawn이 사라졌다 | `grep -n \"지정 생략\\|상속\" skills/*/SKILL.md` (모델 배정 문맥) | 0건 | auto | 1 |\r\n| 3 | 연쇄 승격이 없다 | Hard 1 + Easy 3 구성으로 `/cc` 계획 단계까지 실행 | Supervisor가 TOP 아님 | auto | 1 |\r\n| 4 | `/ccp` TOP이 1자리다 | `skills/ccp/SKILL.md` 역할 표 확인 | TOP ≤ 1 | auto | 1 |\r\n| 5 | 얕은 계획이 실행을 못 뚫는다 | 차단 질문이 남은 계획으로 `/cc` 진입 | 거부 + 결손 항목 명시 | auto | 2 |\r\n| 6 | worker가 DO NOT CHANGE를 받는다 | `/cc` worker spawn 프롬프트 확인 | 해당 블록 포함 | auto | 2 |\r\n| 7 | 레거시 문서가 강등되지 않는다 | `planner: cpp` 문서 1건으로 `/cp html` 실행 | task-deep 양식(6장 캡 없음) | auto | 2 |\r\n| 8 | `/cpp` 트리거가 살아 있다 | \"끝장 계획으로 X 해줘\" 입력 | `/cp`가 deep 등급으로 발동 | manual | 2 |\r\n| 9 | `/cs`가 PR을 만든다 | 비배포 레포 3개에서 `/cs push` | PR 3건 생성, 기본 브랜치 직접 push 0건 | auto | 3 |\r\n| 10 | 동기화가 안 깨진다 | 9번 직후 `/cs` 재실행 | `diverged` 0건 | auto | 3 |\r\n| 11 | 실패 시 우회하지 않는다 | `gh` 인증을 임시 무효화하고 `/cs push` | 실패 보고 + 직접 push 0건 | auto | 3 |\r\n| 12 | 재실행이 중복을 안 만든다 | 9번 직후 동일 조건 재실행 | 중복 PR·커밋 0건 | auto | 3 |\r\n| 13 | 새 버전이 출시됐다 | `git tag --list` + `git show <tag>:.claude-plugin/marketplace.json` | 태그 존재 + ref 일치 | auto | 4 |\r\n\r\n## 진행상황\r\n\r\n- **마지막 업데이트**: 2026-07-20 (KST)\r\n- **현재 상태**: **승인됨 (2026-07-20) · 패키지 1 완료** — 패키지 2 착수 대기\r\n- **패키지 1 완료 (2026-07-20)**: 1-1 모델 계측(`hooks/pre-tool-task.js`+`lib/agent-tracker.js`, 실행 검증 `model=haiku` 기록 확인) · 1-2 상속 폐기(5개 스킬 + `harness-rules.md` §4.1 재개정, 잔존 0건) · 1-3 fan-out 조사 중간 티어 고정 · 1-4 `/cc` 연쇄 승격 폐기→위험도 기반 · 1-5 `/ccp` TOP 6→1 · 1-6 TOP 상한(`/cc` 3 · `/ccp` 1 · `/cp deep` 2). 검증 6/6 pass.\r\n- **선행 추가 (2026-07-20, 사용자 지시)**: 진행보고 규약을 `docs/rules/harness-rules.md` §4.4 SoT + 6개 스킬 인라인으로 강화 — **생존 확인 의무**(추측 금지)·끝난 것/남은 것·부분 산출물 선공개 3항 필수, \"아직입니다\"만 적는 보고는 위반. 기존 v3.16 규칙이 Workflow 도구를 누락하고 생존 확인을 요구하지 않아 실패한 것을 교정.\r\n- **완료**: 산출물 전수조사(80건) → 업계 표준 리서치 → 코드 실측 → Codex 교차 협의(재시도 성공) → `/cpp` 통합 적대적 검증 → 계획 작성\r\n- **선행 완료 (이번 세션)**: `docs/rules/codex-integration.md` 타임아웃 규칙을 규모 분기(180/300/600s) + 대규모 background 필수로 개정. 실측 실패 2건과 \"`-o`는 부분 수거 불가(0바이트 확인)\" 근거 반영.\r\n- **유실**: 설계 워크플로(3축×3렌즈) 오케스트레이션 사망 — 복구하지 않고 폐기. Codex 협의가 커버 범위 대체.\r\n- **패키지 2 완료 (2026-07-20)**: 2A 골격(비목표·검토된대안·DO NOT CHANGE·리스크레지스터·미해결질문 + 필수7/조건부부록 + 위험도 등급 + 예약어 3개 + 양방향 가드) · 2B 게이트(`/cc` 실행 진입 게이트 · `/c` 범위한정 · 핸드오프 4블록 · worker 주입 · 편차 기록 · 실행 지표) · 2C `/cpp` 폐지(트리거 22개 이관, 레거시 하위호환). `validatePlanStructure` v3.4 골격 → 현행 갱신 + 실제 배선. 커밋 `b9530df`·`eb3abed`·`7c47263`.\r\n- **패키지 3 완료 (2026-07-20)**: `/cs` PR-only. 로컬 테스트 레포로 핵심 함정 검증 — 커밋 전 브랜치 분기 ✓ / 기본 브랜치 직접 커밋 0건 ✓ / `master == origin/master`(divergence 없음) ✓ / PR 실패 시 직접 push 우회 안 함(fail-closed) ✓.\r\n- **패키지 4 완료 (2026-07-20)**: CHANGELOG·CLAUDE.md 작성, `bump-version.sh` 를 12파일로 정정(`skills/cpp` 제거 반영), v3.25.0 13/13 반영 확인.\r\n- **Goal 달성**: 계획된 4개 패키지 전량 실행 완료.\r\n- **재개 포인트**: 완료 — `/cp done` 으로 history 전환 권장.\r\n\r\n### 편차 기록 (계획 ↔ 실제)\r\n\r\n- **`/cs` auto-merge → PR-only** — 당초 사용자 선택은 \"PR + 자동 머지\"였으나 Codex 협의에서 *\"auto-merge 가 즉시 실행되면 PR 은 검토 단계가 아니라 기록용 포장\"* 이라는 반박이 나와 사용자 재확인 후 PR-only 로 축소. auto-merge 는 비목표로 분리.\r\n- **`/cpp` 통합 순서** — 검증 2건이 \"품질 문제 해결 전 인터페이스 변경\" 이라며 보류(not-yet)를 권고. 폐지 자체는 사용자 결정대로 진행하되 **골격 통일(2A) 이후에 오도록 순서를 재배치**해 위험을 해소.\r\n- **deep 본문 분리(`deep.md`) 기각** — 당초 파일 비대화 방지 목적이었으나, 정책은 인라인에 남겨야 하므로 오히려 커진다는 반박이 성립. 통합으로 중복이 소멸해(-154줄) 애초에 문제가 아니었음이 확인됨.\r\n- **설계 워크플로 유실** — 3축×3렌즈 워크플로가 오케스트레이션 사망(`journal.jsonl` 미생성). 복구하지 않고 폐기, Codex 협의로 커버 범위 대체.\r\n- **`bump-version.sh` 수정 필요 발생** — 계획에 없던 항목. `skills/cpp/SKILL.md` 삭제로 릴리스 스크립트가 깨져 12파일 기준으로 정정.\r\n\r\n### 실행 지표\r\n\r\n- **추가 질문 수**: 6 (등급 호출 방식 · `/cs` PR 방식 · fable 기준 정의 · `/cpp` 유지 여부 · 진행보고 · 승인)\r\n- **편차 건수**: 5\r\n- **게이트**: 통과 (이 문서 자체가 `validatePlanStructure(deep)` → `valid:true`)\r\n","truncated":false,"stale":false,"branch":null},{"id":"2026-07-15-dynamic-top-model-policy","folder":"tasks","title":"Lens 모델 정책 전환 — 고정 모델명 폐지, \"항상 그 시점의 최고 모델\" 자동 추종","date":"2026-07-15","hasMd":true,"hasHtml":true,"mdPath":"tasks/2026-07-15-dynamic-top-model-policy.md","htmlPath":"tasks/2026-07-15-dynamic-top-model-policy.html","mdInline":"---\r\ntitle: Lens 모델 정책 전환 — 고정 모델명 폐지, \"항상 그 시점의 최고 모델\" 자동 추종\r\ndate: 2026-07-15\r\nplanner: cp\r\ngrade: standard\r\nstatus: in-progress\r\nrefs: [docs/rules/codex-integration.md, docs/rules/harness-rules.md, docs/rules/capability-assumptions.json]\r\n---\r\n\r\n# Lens 모델 정책 전환 — 고정 모델명 폐지, \"항상 그 시점의 최고 모델\" 자동 추종\r\n\r\n## 🎯 What — 목표 (무엇이 가능해지는가)\r\n\r\n**이 작업이 끝나면 가능해지는 것:**\r\n\r\n- Lens가 부리는 모든 일꾼(계획 조사·코드 작성·검토·품질 검증)이 **업무 난이도에 맞는 등급의 모델**로 일하되, **가장 어려운 업무는 항상 그 시점의 가장 똑똑한 모델**이 맡는다. 새 AI 모델이 출시되어도 **문서를 사람이 고치지 않아도** 이 배분이 자동으로 따라간다.\r\n- 오늘 기준으로는: 어려운 업무(설계·검토·검증)는 **Fable**(현재 1등)이, 중간 업무(코드 작성·분석)는 중간 모델이, 단순 업무(파일 읽기·상태 확인)는 경량 모델이 맡고, codex 검증 파트너는 **GPT-5.6-Sol**(현재 1등)로 실행된다. 지금은 최고 난이도 자리에 한 세대 전 모델(opus, gpt-5.5)이 이름으로 못박혀 있어 그보다 낮은 두뇌로 돌고 있다.\r\n- ⚠️ 사용자 정정 반영 (2026-07-15 Modify): \"최고 모델을 전 역할에 무차별 배정\"이 아니다 — **난이도별 배분이 원칙**이고, 사다리의 각 칸이 모델 세대와 함께 자동으로 올라가는 것이 이 작업의 본질이다.\r\n\r\n**완료의 정의 (Done = ?):**\r\n\r\n> 이 컴퓨터에서 Lens의 계획·실행·검증이 문서 수정 없이 난이도별 적정 모델(최고 난이도 = Fable, codex = GPT-5.6-Sol, 단순 업무 = 경량 모델)로 도는 것이 실제 실행으로 확인되고, 다음 세대 모델이 나와도 같은 배분 규칙이 자동 적용된다는 것이 새 버전(v3.24.0)으로 출시되어 있다.\r\n\r\n## ❓ Why — 왜 해야 하는가 (6하원칙)\r\n\r\n- **왜 지금**: 2026년 7월 현재 상위 모델 Fable(Claude 계열)과 GPT-5.6-Sol(OpenAI 계열)이 이미 출시되어 있는데, Lens의 지시문에는 한 세대 전 모델 이름(opus, gpt-5.5)이 못박혀 있다. gpt-5.5는 codex의 모델 순위표에서 이미 **7위까지 밀려난 상태**다. 즉 Lens의 모든 품질 검증이 지금 이 순간에도 한 단계 낮은 두뇌로 돌고 있다.\r\n- **무엇을**: 못박힌 모델 이름을 \"난이도별 모델 사다리\" 규칙으로 교체한다 — 사다리의 각 칸(경량/중간/최상위)은 이름이 아니라 상대 위치라서 모델 세대가 바뀌면 자동으로 올라가고, **최고 난이도 칸은 항상 그 시점의 1등 모델**이 된다.\r\n- **어떻게**: Claude 쪽은 \"난이도 사다리(Easy=경량/Medium=중간/Hard=최상위) + 최상위 칸은 세션 물려받기 우선\" 규칙으로, codex 쪽은 컴퓨터에 저장된 모델 순위표에서 1등을 자동으로 골라주는 한 줄짜리 자동 선택기(resolver)로 — codex는 이종 검증 파트너라 모델은 1등 고정이고 난이도는 추론 깊이 다이얼(소규모 xhigh/대규모 high, 기존 규칙)로 배분한다. (상세는 🛠 How)\r\n- **누구를 위해**: Lens를 쓰는 모든 작업 — 이 사용자의 전 프로젝트에서 이뤄지는 계획·실행·검증의 품질.\r\n- **어디서**: creeta-lens 리포를 고쳐 새 버전으로 출시 → 이 컴퓨터부터 적용, 다른 컴퓨터는 각자 업데이트 시 적용.\r\n- **안 하면**: 모델 세대가 바뀔 때마다 이번 같은 수동 개정 작업을 반복해야 하고, 누군가 알아차리고 고치기 전까지는 낮은 품질의 모델로 검증이 돈다. 이번에도 gpt-5.5가 7위로 밀릴 때까지 아무도 몰랐다.\r\n\r\n## 📖 용어 풀이 (운영자용 — 이 문서를 읽는 데 필요한 개념)\r\n\r\n| 용어 | 쉬운 설명 |\r\n|------|-----------|\r\n| **모델** | AI의 두뇌 등급. 높은 모델일수록 더 깊게 생각한다. Claude 계열은 haiku < sonnet < opus < **fable** 순, OpenAI 계열은 현재 **gpt-5.6-sol**이 1등. |\r\n| **하드코딩** | 문서나 프로그램에 이름을 \"못박아\" 둔 것. 세상이 바뀌어도 못박은 값은 스스로 안 바뀐다. |\r\n| **세션 모델** | 사용자가 지금 Claude Code를 켤 때 고른 모델. 이 사용자는 항상 최신 최고 모델로 켠다. |\r\n| **상속(물려받기)** | Lens가 일꾼을 띄울 때 모델을 따로 지정하지 않으면, 일꾼이 세션 모델을 그대로 물려받는 것. 세션이 1등 모델이면 일꾼도 자동으로 1등. |\r\n| **Task tool enum** | Claude가 부하 일꾼을 띄울 때 고를 수 있는 두뇌 목록. Claude Code 프로그램이 관리하며, 새 모델이 나오면 목록에 자동으로 추가된다. 현재: sonnet, opus, haiku, **fable**. |\r\n| **모델 순위표 (models_cache.json)** | codex 프로그램이 각 컴퓨터에 저장해 두는 \"지금 쓸 수 있는 모델 목록 + 순위\" 파일. OpenAI가 새 모델을 내면 이 파일이 자동 갱신된다. 실측: 1위 gpt-5.6-sol, 2위 gpt-5.6-terra, 3위 gpt-5.6-luna, 7위 gpt-5.5. |\r\n| **resolver(자동 선택기)** | 순위표에서 1등을 자동으로 골라주는 한 줄짜리 명령. 사람이 이름을 알 필요가 없다. |\r\n| **fallback(2안)** | 1안이 실패했을 때 자동으로 넘어가는 예비 경로. |\r\n| **marketplace 태그** | Lens 새 버전을 출시할 때 git에 붙이는 버전 꼬리표. **꼬리표를 안 올리면 다른 컴퓨터가 옛 버전을 설치**한다 (과거 실제 사고 이력 있음). |\r\n\r\n## 🧰 실행 전략 & 자원\r\n\r\n- **난이도**: medium — 파일 9개, 수정 지점 약 45곳 + 출시 절차. 단, 새로 만드는 로직은 자동 선택기 한 줄뿐이고 나머지는 지시문 텍스트 교체라 위험도는 낮은 편.\r\n- **권장 모델**: 이 세션(Fable)이 직접 실행. 계획 승인 후 /cc 핸드오프 시에도 새 규칙(최상위 상속) 그대로 적용됨.\r\n- **병렬 실행**: 파일 수정은 순차 (스킬 문서끼리 서로를 참조하므로 일관성 유지가 우선). 검증 7건 중 5건은 병렬 실행 가능. Pre-mortem은 ultracode 워크플로로 4명의 회의론자(skeptic)를 병렬 배포해 계획의 허점을 공격시킴.\r\n- **활용 도구**: node (Lens가 이미 board-builder로 의존 — 추가 설치 불필요), git, codex CLI. Playwright 불필요 (화면 작업 아님).\r\n  - ⚠️ 자동 선택기를 python으로 짜면 안 되는 이유: Windows에서 `python3` 명령은 Microsoft Store 안내 프로그램(가짜)이 가로채는 함정이 있다(실측 이력). node는 Lens가 이미 쓰고 있어 안전.\r\n- **기존 자원 재사용**:\r\n  - `scripts/bump-version.sh` — 버전 번호를 **14곳**에 일괄 갱신하는 출시 스크립트 (스크립트 직접 확인 실측 — 메모리의 \"11곳\"은 낡은 정보).\r\n  - `lib/board-builder.js` — 작업 보드 HTML 재생성.\r\n  - `docs/rules/capability-assumptions.json` + `/crv` 감사 — Lens가 스스로 낡은 부분을 감지하는 기존 체계. 여기에 \"모델 순위표 감시\"를 추가해 미래 드리프트를 자동 감지.\r\n  - `docs/rules/codex-integration.md`의 기존 400-fallback 설계 (모델 이름이 서버에서 거부되면 이름 없이 재시도) — 폐기하지 않고 유지.\r\n\r\n## 🛠 How — 어떻게 (Plan A / Plan B)\r\n\r\n### Plan A — 권장 경로\r\n\r\n#### 설계 원칙 (왜 이 방식이 1순위인가)\r\n\r\n1. **이름을 지우고 규칙을 남긴다.** \"opus를 써라\"(이름)가 아니라 \"목록의 1등을 써라\"(규칙)로 바꾸면, 목록은 Claude Code와 codex 프로그램이 알아서 갱신하므로 Lens는 영원히 고칠 필요가 없다.\r\n2. **Claude 쪽 — 난이도 사다리 + TOP 규칙 (사용자 Modify 반영 2026-07-15)**:\r\n   - **배분의 원칙은 업무 난이도다.** 최고 모델을 전 역할에 무차별 배정하지 않는다 (사용자 공식 지시 — 기존 /cc의 \"품질 우선, 토큰 비용 비고려로 전부 opus\" 철학은 이번에 폐기).\r\n   - **난이도 사다리 (각 칸은 이름이 아니라 상대 위치 — 모델 세대와 함께 자동 상승)**:\r\n     - **Easy** (파일 읽기·검색·자료 수집·단순 수정·상태 확인) = **경량 티어** (현재 haiku)\r\n     - **Medium** (코드 작성·분석·디버깅·콘텐츠 작성) = **중간 티어** (현재 sonnet)\r\n     - **Hard** (설계·복잡한 리팩토링·보안·계획·심층 검토·적대적 검증) = **최상위 티어 = TOP**\r\n   - **TOP의 판정 절차**: 세션 모델이 두뇌 목록(Task tool enum) 최상위와 같거나 상위(예: Fable)면 **모델 지정 생략(상속)**, 미만이면 **목록 최상위를 명시 지정** (현재 fable, 목록에 없으면 opus). 미래에 낯선 이름의 새 모델이 나와 우열 판별이 안 될 때는 상속이 안전 기본값.\r\n   - **Supervisor·QA는 \"최고 사용 티어와 동급\"**: TOP worker가 하나라도 있으면 Supervisor/QA도 TOP — \"주니어가 시니어 코드를 리뷰\"하는 역전 방지 (기존 /c의 승격 로직을 /cc에도 일반화). Monitor는 항상 haiku (단순 폴링 — 상위 모델 품질 이득 0, 실측 근거 기존 문서에 있음).\r\n   - 이 사다리로 /c(기존 경제 티어제)와 /cc(기존 전부-opus)가 **동일 규칙으로 통일**된다. harness-rules.md §4.1의 상속 조항은 Hard 티어의 기본 경로로 승격.\r\n3. **Codex 쪽 — 순위표 1등 자동 선택 (resolver, Pre-mortem 반영 강화판)**: 매 호출 직전에 컴퓨터의 모델 순위표에서 1등을 뽑아 `-m`으로 전달. **빈 값이 `-m \"\"`으로 흘러들어가지 않도록** 인자를 분기한다 (Pre-mortem blocker 2건의 해소책).\r\n   ```bash\r\n   CODEX_MODEL=$(node -e \"const p=require('path'),os=require('os');const d=require(p.join(os.homedir(),'.codex','models_cache.json'));const m=d.models.filter(x=>x.visibility==='list'&&x.supported_in_api!==false).sort((a,b)=>(a.priority??99)-(b.priority??99))[0];if(!m||!m.slug)process.exit(1);console.log(m.slug)\" 2>/dev/null) || CODEX_MODEL=\"\"\r\n   MODEL_ARG=(); if [ -n \"$CODEX_MODEL\" ]; then MODEL_ARG=(-m \"$CODEX_MODEL\"); else echo \"⚠️ 모델 resolver 실패 — codex config 기본 모델로 진행\"; fi\r\n   timeout 180 codex exec ... \"${MODEL_ARG[@]}\" ...   # 400 거부 시 → MODEL_ARG 비우고 1회 재시도 (기존 fallback 유지)\r\n   ```\r\n   - 강화 포인트 (Pre-mortem 27건 중 runtime 렌즈 반영): ① `path.join` — OS 무관 경로 정규화. ② `if(!m||!m.slug)process.exit(1)` — 빈 배열이면 명시적 실패 (TypeError로 비결정 종료 금지). ③ `|| CODEX_MODEL=\"\"` — 실패 시 항상 빈 값으로 확정. ④ `MODEL_ARG` 배열 분기 — 빈 값이 `-m \"\"`으로 전달되는 사고 원천 차단. ⑤ 플래그 echo가 스킬 실행 대화에 남아 결과 보고에 그대로 복사됨 (기록 위치 = codex 호출 직후 stdout → 각 스킬의 결과 문서/보고 상단에 복사 의무).\r\n   - 실측 완료 (2026-07-15, 이 컴퓨터): 성공 경로 → `gpt-5.6-sol` 반환 + 실호출 EXIT 0 (\"SOL-OK\") + `service_tier=fast` 통과. 실패 경로(파일 부재 모사) → 빈 값 + 플래그 경로 정상 작동.\r\n   - `supported_in_api` 필터는 Codex 듀얼트랙 조사가 제안한 것을 채택 (API로 못 쓰는 모델이 뽑히는 사고 방지).\r\n4. **조용한 강등 금지**: fallback으로 낮은 모델/기본 모델로 넘어가면 반드시 결과 문서에 \"⚠️ 모델 resolver 실패 — config 기본 모델로 진행\" 플래그를 남긴다. (Codex 조사가 지적한 \"몰래 낮은 모델로 도는\" 위험을 플래그 의무로 해소.)\r\n5. **깊이 다이얼은 안 건드린다**: 기존 규칙(소규모 xhigh / 대규모 high + timeout 180초)은 그대로 유효 — gpt-5.6-sol도 xhigh/high 단계를 동일하게 지원함을 실측 확인. (신설된 max/ultra 단계는 이번 범위 밖 — 후속 검토 과제.)\r\n6. **과거 기록은 안 고친다**: docs/history/, CHANGELOG.md의 과거 항목, CLAUDE.md 버전 히스토리, \"실측(gpt-5.5)\" 같은 측정 출처 표기는 역사적 사실이므로 그대로 둔다. 고치는 건 \"앞으로 이렇게 하라\"는 지시문만.\r\n\r\n#### 단계 (수정 지점 전량 — 파일별 inline)\r\n\r\n**[A] docs/rules/codex-integration.md — codex 호출 규칙의 원본(SoT), 7개 지점**\r\n\r\n- [ ] A1. 9행: \"(이 확장 빌드가 노출하는 모델: `gpt-5.5`)\" → \"(모델은 머신의 모델 순위표에서 최상위를 자동 선택 — §4 resolver)\"\r\n- [ ] A2. §4 표준 호출 블록(75~78행): 호출 앞에 위 resolver 한 줄 추가 + `-m gpt-5.5`를 `-m \"$CODEX_MODEL\"`로 교체. resolver 실패 시 `-m` 생략 + 플래그 규칙 명기.\r\n- [ ] A3. 91행: \"`-m gpt-5.5` — 모델 명시 고정. config 기본값에 의존하지 않고…\" → \"`-m \"$CODEX_ 뀌었나).\r\n- [ ] I2. CLAUDE.md Version 섹션에 v3.24.0 한 줄 추가 (기존 히스토리 형식 그대로).\r\n- [ ] I3. `bash scripts/bump-version.sh 3.24.0` — 버전 번호 **14곳** 일괄 갱신 (스크립트의 \"Files with v3.24.0: 14/14\" 검증 출력 확인).\r\n- [ ] I4. **순서 엄수**: ① `git add -A && git commit` (marketplace.json의 `ref: v3.24.0` 갱신이 **커밋에 포함**된 것 확인 — 커밋 전에 태그를 만들면 태그가 옛 ref를 가리키는 사고) → ② `git tag v3.24.0` → ③ `git push origin master --tags` → ④ 검증: `git show v3.24.0:.claude-plugin/marketplace.json | grep ref` 출력이 `v3.24.0`. **태그 필수** — marketplace가 태그를 보고 설치하므로 태그 없이 push만 하면 다른 컴퓨터에 옛 코드가 설치된다 (실제 사고 이력).\r\n- [ ] I5. 이 컴퓨터에 새 버전 반영 (`claude plugin update` 또는 /lens-upgrade) 후 설치 버전 3.24.0 확인. 다른 컴퓨터(Mac Mini 등)는 각자 다음 /ci·/lens-upgrade 때 자동 반영 (이번 범위 밖, 기록만).\r\n\r\n**변경하지 않는 것 (명시)**: skills/cr·cs·cu·ci·cps·crv (모델 배정 없음 — grep 실측 0건), docs/history/* 전부, CHANGELOG 과거 항목, CLAUDE.md 버전 히스토리(17행의 gpt-5.5 언급 포함), codex-integration.md 101행 실측 표기, Monitor/QA의 haiku 배정(/c의 QA=haiku 포함 — 경제형 설계 유지).\r\n\r\n#### 막힐 수 있는 지점 (→ Plan B 트리거)\r\n\r\n- **T1**: resolver 한 줄이 이 컴퓨터 Git Bash에서 실행 실패 (node 경로·따옴표 문제) → 문법 조정 1회 재시도, 그래도 실패하면 **Plan B-1** 전환.\r\n- **T2**: `codex exec -m gpt-5.6-sol`이 400 거부 (검증 완료라 가능성 낮음) → **Plan B-1** 전환.\r\n- **T3**: Task tool로 fable 명시 spawn이 거부됨 (권한/플랜 문제) → **Plan B-2** 전환.\r\n- **T4**: 출시 후 marketplace 설치가 옛 버전 (태그 문제) → I4 재실행 (lens-release-process 절차 재점검).\r\n\r\n### Plan B — Fallback 경로\r\n\r\n#### B-1 (codex 쪽): 런타임 자동 선택 포기 → \"현재 1등 이름 고정 + 자동 감시\"\r\n\r\n- **Trigger**: Plan A의 T1 (resolver 실행 불가) 또는 T2 (동적 선택 모델 400 거부).\r\n- **왜 이 대안인가**: 자동 \"추종\"은 포기하지만 자동 \"감지\"는 유지하는 절충. 문서에 `-m gpt-5.6-sol`을 명시하되, capability-assumptions.json 감시 항목에 \"순위표 1위 ≠ 문서 명시 모델이면 /crv가 개정 알림\"을 넣는다. 다음 세대 모델이 나오면 사람이 고치긴 해야 하지만, Lens가 낡았다고 스스로 알려준다. trade-off: 수동 개정 1회/세대 발생.\r\n- **단계**: [ ] §4에 `-m gpt-5.6-sol` 고정 표기 → [ ] capability-assumptions.json에 순위표 대조 감시 항목 추가 → [ ] 나머지 A3~A6·D13~14·G3·H2는 고정 이름 기준으로 동일 진행 → [ ] Claude 쪽(C·D~F·G~H의 TOP 규칙)은 Plan A 그대로 (Claude 쪽은 T1~T2와 무관).\r\n\r\n#### B-2 (Claude 쪽): fable 명시 spawn 불가 → \"상속 단일 규칙\"\r\n\r\n- **Trigger**: Plan A의 T3 (fable 지정 spawn 거부).\r\n- **왜 이 대안인가**: 이 사용자의 세션은 항상 최상위 모델이므로, 명시 지정 없이 \"전 역할 상속(지정 생략)\"만으로도 사실상 동일 품질. trade-off: 세션을 낮은 모델로 켠 경우 일꾼도 낮아짐 (이 사용자 패턴에선 발생 확률 낮음).\r\n- **단계**: [ ] TOP 정의를 \"항상 지정 생략(상속). Monitor만 haiku 명시\"로 단순화 → [ ] 테이블·예시의 fable 표기를 \"(상속)\"으로 교체.\r\n\r\n### 🔀 듀얼 합성 (Claude ‖ Codex gpt-5.6-sol — P0.5 병렬 독립 조사)\r\n\r\n**합의 (고신뢰 — 그대로 채택):**\r\n- 순위표(models_cache.json)에서 visibility=list 중 priority 최소를 뽑는 resolver 방식 — 양측 동일 결론. Codex의 `supported_in_api` 필터 추가 제안 채택.\r\n- 구모델명 정적 스윕(grep 0건 확인) + 실제 Task=fable·codex=gpt-5.6-sol 실행 통합시험 + capability-assumptions·릴리즈 버전 갱신 — 양측 동일.\r\n- 대상 파일: skills 5종(c/cc/ccp/cp/cpp) + rules 3종 + bump-version.sh — 거의 일치.\r\n\r\n**분기 → 해소 (4건):**\r\n1. **새 rule 문서(model-selection.md) 신설**(Codex) vs **기존 문서 확장**(Claude) → **기존 확장 채택**. 근거: 스킬이 실행 중 읽는 텍스트는 자기 SKILL.md뿐이고, codex 호출의 SoT는 이미 codex-integration.md로 확립돼 있다. 새 문서를 만들면 SoT가 분산되고 스킬은 어차피 그걸 안 읽는다.\r\n2. **`-m` 생략 fallback 폐기, 실패 시 중단(fail-closed)**(Codex) vs **fallback 유지**(Claude) → **유지 + 강등 플래그 의무** 절충. 근거: \"이종검증이 조용히 죽는 대신 기본값으로라도 돈다\"는 graceful degrade가 Lens의 확립 원칙(§7)이고, 순위표 파일이 없는 컴퓨터(데스크톱 앱 없이 CLI만 있는 서버)가 존재할 수 있다. Codex가 우려한 \"몰래 낮은 모델로 도는\" 위험은 플래그 의무로 해소.\r\n3. **Monitor까지 최고 모델**(Codex) vs **haiku 유지**(Claude) → **haiku 유지**. 근거: cc/SKILL.md 165행에 실측 사유 명문 (\"상태 폴링뿐이라 품질 이득 0\") — 기존 설계 의도가 명확.\r\n4. **skills/cr/SKILL.md 포함**(Codex) vs 제외 → **제외**. 근거: grep 실측 — cr에는 모델 배정이 한 건도 없음 (하네스 규칙 문구뿐).\r\n\r\n**Codex가 낸 리스크 중 계획에 반영된 것:**\r\n- \"캐시 누락·오염 → 잘못된 모델/호출 실패\" → fallback + 플래그 의무 + capability-assumptions 감시 (B5).\r\n- \"Claude enum에는 순위 정보가 없어 미래 이름의 우열 오판 가능\" → 인정. 판별 불확실 시 **상속이 안전 기본값**이라는 문구를 TOP 정의에 포함 + /crv의 enum drift 감사 (B2·B5). 완전 자동 보장은 불가함을 문서에 정직하게 명기.\r\n- \"분산된 예제·fallback에 옛 이름 잔존 → 특정 경로만 옛 모델로 실행\" → 검증 3번(정적 스윕 0건)으로 차단.\r\n\r\n### ⚠️ 사전 리스크 (Pre-mortem — 2026-07-15 수행)\r\n\r\n수행 방식: ① Claude Fable 세션 분석(컨텍스트 기반) + ② Codex gpt-5.6-sol 독립 조사(P0.5에서 통합) + ③ **ultracode 워크플로 — 4명의 적대적 회의론자(runtime·consistency·deploy·design 렌즈) 병렬 공격, 27건 수집** 후 중복 제거·계획 반영.\r\n\r\n#### Claude Fable 관점 (세션 컨텍스트 기반)\r\n\r\n- 컨벤션 위반 없음: resolver는 `os.homedir()` 기반 portable (머신 하드코딩 금지 원칙 준수). capability-assumptions.json은 필드 내 문자열만 교체하므로 /crv 호환.\r\n- 과거 결정과의 모순 없음: \"소규모 xhigh/대규모 high + 180s\" 규칙 유지, /cc \"품질 우선\" 철학은 TOP 규칙이 그대로 계승, /c 경제 티어는 설계 의도대로 보존.\r\n- 가장 막힐 가능성이 큰 지점: 리포를 고쳐도 이 컴퓨터의 실행은 플러그인 캐시(3.23.1)에서 나오므로 **I5(플러그인 업데이트) 전까지는 반영 안 됨** — 검증 7번이 이걸 잡는다.\r\n\r\n#### Skeptic 패널 핵심 발견 (27건 중 채택·반영 완료 — 계획 본문에 이미 흡수됨)\r\n\r\n| # | 렌즈 | 발견 (심각도) | 계획 반영 |\r\n|---|------|--------------|----------|\r\n| 1 | runtime | resolver 빈 결과가 `-m \"\"`으로 흘러 조용한 강등 (**blocker**) | Plan A-3 강화판: `process.exit(1)` + `MODEL_ARG` 배열 분기 + 실패 경로 실측 완료 |\r\n| 2 | runtime | 순위표 파일 부재(require 에러) 시 비결정 종료 (high) | `\\|\\| CODEX_MODEL=\"\"` 확정 처리 + path.join 정규화. 실패 경로 실측 통과 |\r\n| 3 | runtime·consistency | \"플래그 의무\"의 기록 위치 불명 (high) | 기록 위치 확정: 호출 직후 stdout echo → 각 스킬 결과 보고 상단 복사 의무 (A4에 명기) |\r\n| 4 | deploy | bump-version은 11곳이 아니라 **14곳** (high) | I3 수정 + \"14/14\" 검증 출력 확인 절차화 |\r\n| 5 | deploy | 커밋 전 태그 생성 시 marketplace ref가 옛 버전을 가리킴 (high) | I4 순서 엄수(①커밋→②태그→③push→④`git show` 검증) 명문화 |\r\n| 6 | deploy | capability-assumptions.json 라인 편집 시 JSON 파손 → /crv 사망 (high) | [B] 편집 안전 규칙: Edit 정밀 교체 + node 파싱 검증 의무 |\r\n| 7 | design | 세션이 낮은 모델일 때 상속이 품질을 낮춤 (high) | TOP 정의에 판정 절차 명시: \"세션 ≥ enum 최상위면 상속, 미만이면 enum 최상위 **명시**\" |\r\n| 8 | design | enum에 순위 정보 없음 — 미래 새 이름 우열 오판 가능 (high) | 수용된 한계로 정직하게 명기 + 판별 불확실 시 상속 = 안전 기본값 + /crv enum drift 감사(B5) |\r\n| 9 | design | 순위표 priority가 \"성능 순위\"가 아닐 가능성 (medium) | 실측 반박: 1위 설명 \"Latest frontier\" — 설명·순서 일치 확인. 잔여 위험은 /crv 감사로 커버 |\r\n| 10 | design | 신설 추론 단계(max/ultra) 미활용 (medium) | 범위 밖 명기 유지 + B5 감시에 \"reasoning_levels 확장 감지\" 포함 |\r\n| 11 | consistency | 검증 grep의 제외 규칙 모호 (medium) | 검증 3 명령을 호출형(`-m gpt-5.5`) 기준으로 명확화 + resolver 삽입 지점 전수 grep(검증 4) |\r\n| 12 | runtime | Mac Mini 등 타 OS에서 resolver 미검증 (medium) | 검증 8 신설: ssh macmini에서 resolver 실측 |\r\n\r\n기각한 발견: \"TOP 정의 중앙화(include 방식)\" — 스킬은 런타임에 자기 SKILL.md만 읽으므로 include 불가, 동일 문구 복붙 + /crv 불일치 감사가 현실적 방안 (듀얼 합성 분기 1과 동일 근거). \"fail-closed(-m 생략 fallback 폐기)\" — graceful degrade 원칙 유지 (듀얼 합성 분기 2에서 이미 해소).\r\n\r\n#### Trigger 매핑 (Pre-mortem 결과 → Plan B 전환점)\r\n\r\n- 발견 1·2·3 → Plan A 설계 보강으로 해소 (트리거 아님 — 사전 차단).\r\n- 발견 4·5·6 → 실행 절차 보강 (I3·I4·B 안전 규칙). T4(태그 사고)와 매핑.\r\n- 발견 7·8 → TOP 정의 문구 보강. T3(fable spawn 거부 → Plan B-2)와 매핑.\r\n- 발견 12 → 검증 8 신설. 실패 시 T1 계열 (resolver 크로스플랫폼) → Plan B-1.\r\n- **Blocker 판정**: 보안 치명·데이터 손실·비가역 단계 없음 — 발견된 blocker 2건은 구현 디테일이며 계획 반영으로 해소 완료. Modify 강제 사유 아님.\r\n\r\n## 💡 시사점 · ⚠️ 주의점 · 🔀 Side Effect\r\n\r\n- **💡 시사점**: 모델 세대 교체가 \"문서 개정 이벤트\"에서 \"무이벤트\"로 바뀐다. /c(경제 티어제)와 /cc(전부-opus)로 갈라져 있던 모델 정책이 **하나의 난이도 사다리로 통일**되고, /cc의 토큰 비용은 v3.11 \"전부 opus\" 대비 절감된다 (Easy/Medium 업무가 경량·중간 티어로 내려가므로). capability-assumptions 감시 체계가 기능 축에 이어 모델 축까지 커버하게 된다. 이후 gpt-5.6 세대의 신설 추론 단계(max, ultra — \"자동 작업 위임\" 포함)를 Lens 깊이 분기에 편입할지가 자연스러운 후속 과제.\r\n- **⚠️ 주의점**: ① 출시 시 태그 누락 = 다른 컴퓨터에 옛 코드 설치 (실측 사고 이력 — I4 절차 엄수). ② 이 계획은 지시문(문서) 교체라 되돌리기 쉽지만, 출시 후에는 버전이 박제되므로 되돌리려면 새 패치 버전이 필요. ③ Mac Mini 등 다른 컴퓨터의 codex에 순위표 파일이 없을 수 있음 — fallback이 커버하지만 플래그 발생 여부를 다음 사용 시 확인 권장.\r\n- **🔀 Side Effect (파급)**: /c·/cc·/ccp·/cp·/cpp 5개 스킬의 모델 배정 문구 전부, /crv 감사 항목 2건, harness-rules 심사 기록 1건. 다른 스킬(cr·cs·cu·ci·cps·crv 본문)은 무영향 (grep 실측 0건). 실행 중인 다른 프로젝트에는 영향 없음 (Lens 문서만 변경).\r\n\r\n## ✅ Review — 검증 (증거 + 어떻게 검증할지)\r\n\r\n**검증 전략**: 7건 전부 이 세션에서 직접 명령을 실행해 검증하고(대화에 증거 잔존), 각 행의 pass/fail을 최종 보고에 표로 제시한다. 범위: 이 컴퓨터에서의 실행 검증 + 리포·출시 상태 검증까지 (다른 컴퓨터 반영은 범위 밖 — 기록만).\r\n\r\n| # | 목표가 됐다는 신호 | 확인 방법 (명령/관측) | 통과 판정 | 종류 |\r\n|---|------------------|----------------------|----------|------|\r\n| 1 | codex가 쓸 모델을 스스로 1등으로 찾아낸다 | 문서에 적힌 resolver 한 줄을 bash로 실행 | 출력 = `gpt-5.6-sol` | auto |\r\n| 2 | codex 실호출이 그 모델로 성공한다 | §4 표준 호출(resolver 포함) 실행 | EXIT 0 + 본문 수신 | auto |\r\n| 3 | 옛 모델 이름이 지시문에 남아있지 않다 | `grep -rn \"m gpt-5.5\" skills/ docs/rules/` | 0건 (호출형 기준. 실측 표기 101행·역사 기록은 제외 대상) | auto |\r\n| 4 | Claude 일꾼 지시문이 난이도 사다리 + TOP 규칙으로 바뀌었다 | `grep -n \"TOP\\|fable\\|사다리\" skills/*/SKILL.md` 역할 테이블 | 5개 스킬 전부에서 사다리(경량/중간/TOP) 정의+테이블 확인, \"전부 opus\" 문구 0건 | auto |\r\n| 5 | 실제로 fable 일꾼이 뜬다 | Task tool로 model=fable 에이전트 1개 spawn (1문장 과제) | 정상 응답 수신 | auto |\r\n| 6 | 새 버전이 출시됐다 | `git tag --list v3.24.0` + `git status -sb` | 태그 존재 + 원격 push 완료 | auto |\r\n| 7 | 이 컴퓨터의 Lens가 새 버전이다 | installed_plugins 확인 (`claude plugin list` 또는 캐시 디렉토리) | 3.24.0 | auto |\r\n| 8 | 다른 OS에서도 자동 선택기가 안전하다 | `ssh macmini`로 resolver 한 줄 실행 (Pre-mortem 발견 12) | 1등 slug 반환 **또는** 빈 값+플래그 경로 (둘 다 pass — 조용한 오작동만 fail) | auto |\r\n| 9 | 감사 설정 파일이 깨지지 않았다 | `node -e \"require('./docs/rules/capability-assumptions.json')\"` (Pre-mortem 발견 6) | exit 0 | auto |\r\n\r\n## 진행상황\r\n\r\n- **마지막 업데이트**: 2026-07-15\r\n- **현재 경로**: Plan A\r\n- **완료**: Goal 정의 → Codex 듀얼트랙 조사·합성 → 계획 작성 → Pre-mortem(4-skeptic 27건 → 12건 채택 반영, blocker 2건 사전 해소) → 강화판 resolver 실측 통과\r\n- **Modify 이력 (2026-07-15)**: 사용자 정정 — \"최고 모델 무차별 배정 금지, 업무 난이도에 맞춰 배분\". Claude 축을 \"전 역할 TOP\" → \"난이도 사다리(Easy=경량/Medium=중간/Hard=TOP, 각 칸 자동 상승)\"로 재설계. /cc의 v3.11 \"전부 opus(품질 우선·비용 비고려)\" 철학 공식 폐기, /c와 사다리 통일. codex는 1등 모델 유지 + 난이도는 깊이 다이얼(기존 xhigh/high).\r\n- **실행 (2026-07-15, /cc)**: [A]~[H] 전 수정 완료 (rules 3종 + 스킬 5종 + cc P4.5 resolver 인라인 — Supervisor 지적 반영). Supervisor(fable) 82점 pass — fable spawn 실측 겸용. Codex 리뷰는 대형 diff로 180s 초과 → §7 degrade(Supervisor 단독 게이트, timeout 가드 라이브 실증). 검증: V1 resolver=gpt-5.6-sol ✓ / V2 §4 E2E EXIT 0+\"V324-OK\" ✓ / V3 옛 이름 호출형 0건 ✓ / V4 5개 스킬 사다리 반영 ✓ / V5 fable spawn ✓ / V8 Mac Mini 플래그 경로 정상 ✓ / V9 JSON 파싱 ✓. V6(태그)·V7(플러그인) 출시 단계에서.\r\n- **[I] 출시 완료 (2026-07-15)**: 커밋 9fd7182 → 태그 v3.24.0 → push → `git show v3.24.0:.claude-plugin/marketplace.json` ref=v3.24.0 확인 (V6 ✓) → 이 컴퓨터 플러그인 3.23.1→3.24.0 업데이트 (V7 ✓).\r\n- **Goal 달성**: 3/3 ✓ — 검증 9/9 전량 pass.\r\n- **재개 포인트**: 완료 — /cp done 으로 history 전환 권장. (다른
