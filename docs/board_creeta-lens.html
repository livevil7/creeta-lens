로 사용자에게 묻는다. 원문 원칙은 작업 중 되묻기를 차단한다.\r\n- 해소: 승인 게이트는 파괴적 행동·스코프 결정에 대한 질문이므로 원문이 허용하는 예외에 해당한다 — **유지**. 차단 대상은 작업 중간의 \"~할까요?\" 류 허락 구하기뿐이다.\r\n\r\n### 4.3 2분 진행보고 vs 푸시 알림 절제\r\n\r\n- 충돌: Lens 는 2분 주기 진행보고를 한다. 원문 원칙은 푸시 알림을 절제하라고 한다.\r\n- 해소: 진행보고는 대화 안의 텍스트 한 줄이므로 충돌이 아니다 — **유지**. 사용자 주의를 강제로 끄는 푸시 알림과는 구분한다.\r\n\r\n### 4.4 진행보고 규약 (SoT · 주기 2분 · 훅으로 강제 · v3.29 수행 주체 변경)\r\n\r\n> 이 절이 진행보고의 원본이다. 각 스킬은 런타임에 자기 SKILL.md 만 읽으므로 **동일 취지를 스킬마다 인라인**으로 복제한다(include 불가 — 확립된 제약).\r\n>\r\n> **v3.29: 규칙은 유지, 수행 주체만 바뀐다.** 종전에는 전담 Monitor 서브에이전트(haiku)를 매 실행마다 띄워 폴링시켰다. 지금은 **스킬 본체(Leader)가 직접** 보고한다 — 하네스가 백그라운드 작업 완료 시 본체를 자동 재호출하므로 폴링 에이전트는 순수 오버헤드다. 상세 근거는 §4.6.\r\n\r\n**발동 조건**: 백그라운드/장시간 작업이 **2분 이상** 걸리는 모든 구간. 대상에는 Task 서브에이전트, **Workflow**, codex 호출, 장시간 Bash 가 전부 포함된다. (v3.16 원규칙은 Workflow 도구 이전에 작성되어 이를 누락했다 — 이번에 포함.)\r\n\r\n**주기 = 2분 = 120초** (사용자 지시 — \"cc 할 때 반드시 2분마다 진행사항 보고\"). v3.16 이 주기를 120초 → 300초 로 완화했던 것을 되돌린다. 사용자 기존 룰(`feedback_wait_progress_report`)이 원래 120초였으므로 완화 자체가 회귀였다.\r\n\r\n**매 보고에 반드시 들어갈 것 (세 가지 전부, 하나라도 빠지면 위반)**:\r\n\r\n1. **생존 확인 결과** — 추측 금지. `TaskOutput(block=false)` 또는 산출 디렉토리 mtime 으로 **실제로 확인한 뒤** 보고한다. **확인하지 않은 채 \"진행 중\"이라고 말하지 않는다.**\r\n2. **끝난 것 / 남은 것** — N/M 형태로. 무엇이 완료됐고 무엇을 기다리는지.\r\n3. **부분 산출물** — 지금 낼 수 있는 결과(초안·확정된 결정·부분 설계)가 있으면 대기 중이라도 **먼저 낸다.** 대기가 산출물을 100% 막지 않게 한다.\r\n\r\n**금지**: \"아직입니다\" / \"진행 중입니다\" 만 적는 보고. 정보량 0 이며 규칙 위반이다.\r\n\r\n**강제 수단 = 훅** (산문 규칙만으로는 조용히 스킵된다 — 실측):\r\n\r\n- 구현: `hooks/post-tool-progress.js`, `PostToolUse`(matcher 없음 = 전 도구)에 등록. 상태 파일 `.lens/progress-report-state.json`.\r\n- 동작: 도구 호출마다 경과를 확인하고 **마지막 보고 기점 이후 120초를 넘겼으면** 보고를 요구하는 리마인더를 `additionalContext` 로 주입한다. 리마인더에는 위 세 요소와 \"'아직입니다'만 적는 보고는 위반\"이 그대로 박혀 있다.\r\n- **오탐 억제**: 백그라운드 작업이 실제로 in-flight 일 때만 울린다. 판정 = ① `run_in_background:true` **또는** ② `Task`/`Agent` 반환의 async-launch **봉투**(§4.7 과 동일 판별) **또는** ③ `Workflow` 반환의 **Workflow 전용 봉투** **또는** ④ 폴링 도구(`TaskOutput`/`BashOutput`/`SendMessage`/`KillShell`/`KillTask`/`TaskStop`) 를, **최근 180초 내에** 본 경우. 백그라운드 작업이 없는 짧은 대화 턴에서는 무장되지 않아 침묵한다.\r\n  - ①은 **도구 이름 게이팅이 없다** — 백그라운드 `Bash` 가 여기서 잡힌다. `Bash` 는 백그라운드여도 결과의 `stdout` 이 비어 오므로 **텍스트 매칭을 쓰면 안 된다**(실측: 그 런치 문구를 `grep` 한 명령의 출력이 스스로를 무장시킨다).\r\n  - **`Workflow` 는 별도 봉투를 쓴다.** `run_in_background` 필드가 없고 반환에 agent 문구(`Async agent launched` / `working in the background`)가 **하나도 없어** agent 봉투로는 영원히 무장되지 않는다. 실측(2026-07-25, 4개 세션 25건) 봉투는 텍스트 `Workflow launched in background. Task ID: <id> … Run ID: wf_<id>` 또는 구조화 결과 `{status:'async_launched', taskId, runId, taskType}` 이며, 어느 쪽이 `tool_response` 로 오는지 미확정이라 **두 철자를 모두 받되 마커·식별자를 함께 요구**한다. 25건 중 1건은 권한 거부로 **아예 뜨지 못한 런치**였고 마커·식별자 어느 쪽도 없어 정상 탈락한다 — 마커 단독 판정을 쓰지 않는 이유다.\r\n- **TTL(180초) 초과는 해제가 아니라 휴면이다.** 상태를 버리지 않는다. 평범한 도구는 휴면 상태를 보지 못하므로 여전히 침묵한다(오탐 억제 유지). **늦은 신호가 보고 시계를 리셋하지 않는다** — 예전에는 TTL 초과 폴링이 상태를 새로 만들며 `lastReportAt = now` 로 리셋해서, **180초보다 긴 간격으로 폴링하면 2분 규칙을 무한 회피**할 수 있었다(Codex 7차 P2, 실측 재현: 4회 반복에 리마인더 0회).\r\n- **연속성 판정**: 휴면 상태에 신호가 왔을 때 직전 신호와의 간격이 **360초(보고 주기 ×3)** 이내면 같은 폴링 루프로 보고 즉시 판정한다. 그보다 길면 그 1회는 침묵하되 마커를 남기고 **다음 신호에서 판정**한다 — \"끝난 작업의 마지막 수거 호출\" 과 \"느린 폴링\" 은 그 순간의 도구 스트림상 **구분이 불가능**하기 때문이다(구분할 만한 두 소스는 이미 봉쇄돼 있다: 폴링 응답 형태는 미실측이라 배선 금지 §4.7, 대시보드는 신뢰 불가). 그래서 시간에 걸친 **거동**으로 가른다 — 살아있는 작업은 신호를 계속 내고, 끝난 작업은 한 번 내고 멈춘다.\r\n- 결과적으로 **어떤 폴링 간격에서도 회피는 최대 1회**다.\r\n- **도구 이름만으로는 무장하지 않는다** (Codex 3차 리뷰 P2, 실측 재현): **전경** `Task`/`Agent` 는 `PostToolUse` 시점에 **이미 완료돼 있다** — 이 훅은 서브에이전트가 끝난 뒤에야 돈다. 그래서 이름만 보고 무장하면 진행 중 작업이 0인데도 120~180초 뒤 아무 평범한 도구에서 \"백그라운드 작업 대기 중\" 리마인더가 발화한다. `run_in_background === false` 는 **조기 거부**한다(전경 선언). 이름 게이팅 자체는 유지한다 — 없애면 이 문서를 `Read` 하는 것만으로 async-launch 문구가 매칭돼 새 오탐이 생긴다(훅을 주제로 작업하는 에이전트가 자기 보고문으로 자기를 무장시키는 경로).\r\n- **§4.7 과 판별을 공유한다**: 두 훅이 같은 두 신호(`run_in_background` 플래그 / 반환 텍스트 문구)를 쓴다. 하네스가 그 문구나 파라미터를 바꾸면 `post-tool-task.js` 의 거짓 `done` 재발과 이 훅의 무장 실패가 **동시에** 나타난다 — 단일 감시 지점으로 취급하라.\r\n- **`.lens/agent-dashboard.json` 을 in-flight 근거로 쓰지 않는 이유**: 그 데이터는 이 목적에 신뢰할 수 없다. `PostToolUse` 는 async spawn 직후(~130ms)에 발생하므로 트래커가 백그라운드 에이전트를 즉시 `done` 으로 찍었다(실측 2026-07-25 — 10개 전원 배포 직후 `done`, 그중 둘은 이후 311초·567초 실행). fan-out 직후 \"0 running\" 을 읽으면 훅이 영구히 침묵한다. 그래서 훅은 도구 호출 스트림을 **직접** 관측한다. (거짓 `done` 자체는 `hooks/post-tool-task.js` 에서 수정 — 아래 §4.7.)\r\n- **봉투는 두 철자로 온다 — 둘 다 받는다** (Codex 11차 후속, 실측 2026-07-26). 같은 async 런치가 산문 봉투(`Async agent launched …` + `agentId:`/`output_file:`)로도, **구조화 결과**(`{status:'async_launched', isAsync:true, agentId, outputFile, …}`)로도 온다 — 한 세션의 async Agent 런치 **41건 전부**가 후자였다. 산문 철자만 요구하면 그 payload 에는 문장이 아예 없어 봉투가 영영 성립하지 않고, **§4.4 강제와 §4.7 계측이 동시에 죽는다.**\r\n  - ⚠️ **`tool_response` 가 content-block 배열이면 `JSON.stringify` 로 검색하지 마라.** 그러면 개행이 `\\` 와 `n` 두 글자로 escape 되어 `agentId:` 앞에 **단어 문자**가 오고, `\\bagentId:` 의 단어경계가 깨져 식별자가 안 잡힌다(문장은 잡히는데 식별자만 빠져 봉투가 조용히 실패한다). 배열은 **`.text` 를 펼쳐서** 검색한다. 두 훅의 `responseText()` 가 같이 이 처리를 한다.\r\n- **턴이 끝나면(`Stop` 훅) 상태 파일을 지우지 않고 `lastReportAt` 을 스탬프한다.** 사용자가 방금 메시지를 받았으므로 시계는 리셋되지만, **삭제하면 그 타임스탬프가 사라져** 다음 폴이 새 시계로 재무장하고 리마인더가 2분 더 밀린다 — 위에서 막은 \"늦은 신호가 시계를 리셋\" 회피와 같은 경로다. 무장 필드는 건드리지 않는다.\r\n- **세션 경계(`SessionStart`)에서는 상태 파일을 삭제한다 — 단 소스가 `startup`·`resume`·`clear` 일 때만.** 상태에는 시계(`armedAt`/`lastSignalAt`/`lastReportAt`/`reminders`)만 있고 **작업 식별자가 없으므로** 지워도 떠 있는 작업을 놓치지 않는다. 애초에 이전 세션의 백그라운드는 새 CLI 프로세스에서 무장 신호(프로세스가 소유한 핸들)를 낼 수 없다. 남겨두면 새 세션의 **첫 폴링이 즉시 발화하며 \"대기 7201초째\" 같은 거짓 경과**를 보고한다(실측 재현).\r\n  - **`compact`·`fork`·알 수 없는 소스에서는 지우지 않는다.** 둘 다 대화 **도중** 발화하고(긴 대기 중 auto-compact, 에이전트가 띄우는 `fork`) 같은 상태 파일을 공유하므로, 거기서 지우면 `Stop` 이 스탬프로 막았던 회피가 그대로 재생된다. **허용목록**으로 판정한다 — 보존의 최악은 시끄러움, 삭제의 최악은 침묵이고 침묵이 더 나쁘다.\r\n  - 기준선: `Stop`(에이전트가 유발하는 턴 주기) = **스탬프**, `SessionStart` 중 사용자 행동(`startup`/`resume`/`clear`) = **삭제**.\r\n  - ⚠️ `hooks/hooks.json` 의 `\"once\": true` 는 매처 **그룹** 레벨에 있어 하네스가 무시한다(스키마상 `once` 는 hook 엔트리 필드 — claude 바이너리 실측). SessionStart 훅은 **모든** SessionStart 이벤트(`startup|resume|clear|compact|fork`)에서 실행된다고 전제해야 한다.\r\n- 한계: **블로킹 도구 호출 도중에는 PostToolUse 가 발생하지 않아** 주입이 불가능하다. 장시간 작업은 백그라운드 spawn + 폴링 형태로 돌려야 훅의 보호를 받는다.\r\n- 실패해도 세션을 깨뜨리지 않는다(`installFailSoftHandlers` + 락 실패 시 무락 폴백).\r\n- **`ScheduleWakeup` 을 강제 수단으로 쓰지 않는다** — `/loop` 전용 페이서이고 스키마가 \"백그라운드 폴링용 짧은 주기 예약 금지 / 최소 60초 클램프\"를 명시한다. 훅이 유일한 실제 강제 수단이다.\r\n\r\n**위반 판정 기준** (하나라도 해당하면 위반):\r\n\r\n1. 120초를 넘겨 보고가 없었다 (훅 리마인더가 떴는데도 무응답이면 명백한 위반).\r\n2. 생존확인 **실측 없이** \"진행 중\"이라고 썼다.\r\n3. 세 요소 중 하나라도 빠졌다 (특히 ③ 부분 산출물 — 낼 수 있는데 안 냈다).\r\n4. 정보량 0 인 보고(\"아직입니다\")로 주기만 채웠다.\r\n\r\n**유실·정지 감지 시**: 즉시 사용자에게 보고하고, **복구보다 폐기·재판단을 우선 검토**한다. 죽은 작업을 계속 기다리지 않는다.\r\n\r\n**근거 (실측 사고 2026-07-20)**: Workflow 가 조용히 사망(`journal.jsonl` 미생성 · 태스크 레지스트리 부재 · 완료 알림 없음)했는데 생존 확인 없이 \"진행 중\"을 2회 오보하고 사용자를 여러 턴 대기시킴. 사용자 지적: *\"지금 이렇게 기다릴때 나는 답답해\"* → *\"대기를 없앨수는 없고, 진행 현황을 알려주면 되지. 주기적으로.\"*\r\n\r\n**중요**: 사용자의 VS Code 확장에는 `/workflows` 진행창이 **보이지 않는다.** 사용자가 스스로 상태를 확인할 수단이 없으므로 **보고 책임은 전적으로 스킬에 있다.**\r\n\r\n적용 스킬: `/cc` · `/cp`(전 등급) · `/cr` · `/cs`.\r\n\r\n### 4.5 Karpathy Rule 1 vs 하네스 되묻기 정책 (v3.29 신설)\r\n\r\n- **충돌**: 사용자 전역 지침의 Rule 1(Think Before Coding)은 *\"불확실하면 묻는다 / 해석이 여러 개면 모두 제시한다 / 불명확하면 멈춘다\"* 를 요구한다. 현재 하네스는 반대 방향을 요구한다 — *\"Interpret ambiguity the way a careful colleague would: make routine judgment calls yourself, and check in only when different readings would lead to materially different work\"*, *\"Reserve blocking questions\"*, *\"When you have enough information to act, act\"*.\r\n- **왜 지금 문제가 됐나**: Rule 1 전문이 스킬 본문 12곳에 복붙돼 있었다. 하네스는 한 번 말하는데 Lens 가 반대 취지를 열두 번 반복하면 **가중치가 Lens 쪽으로 기운다.** 사용자의 다른 룰(`feedback_try_first` — \"해봐 하면 추측·옵션나열 금지, 즉시 실행\")과도 어긋나 있었다.\r\n- **판정 — 하네스 우선, 단 Rule 1 의 산출물 요구는 유지**:\r\n  - **묻는 행위**는 억제한다. 질문은 1개 지향·3개 상한(§E Elicitation gate), 그 외 불확실성은 **묻지 말고 기록**한다.\r\n  - **가정을 드러내라는 Rule 1 의 핵심**은 살린다 — 다만 대화 중 질문이 아니라 **계획서의 `가정`·`❓ 미해결 질문` 섹션**으로 배출한다. Rule 1 이 막으려던 것은 \"혼란을 숨기는 것\"이지 \"스스로 판단하는 것\"이 아니다.\r\n  - **\"불명확하면 멈춘다\"** 는 파괴적·비가역 작업에만 적용한다. 가역적 작업에서 멈추는 것은 하네스·사용자 룰 양쪽 위반이다.\r\n- **적용 위치**: `/cp` 본문에 이 판정을 인라인 1블록(비네이티브 — 하네스는 질문 개수 상한을 주지 않음). `/cc` 워커 프롬프트의 Rule 1 은 그대로 두되, 워커는 애초에 \"멈추지 말고 끝내라\" 계약이 함께 걸려 있어 상충하지 않는다.\r\n\r\n### 4.6 전담 Monitor 에이전트 폐지 (v3.29)\r\n\r\n- **폐지 대상**: `/c`·`/cc` 가 매 실행마다 강제 배포하던 haiku Monitor 서브에이전트(5분 폴링 → \"진행 현황: N/M\").\r\n- **근거**:\r\n  1. 하네스가 **백그라운드 작업 완료 시 본체를 자동 재호출**한다 — 폴링할 이유가 없다.\r\n  2. `ScheduleWakeup` 도구 설명이 이 패턴을 **명시적으로 금지**한다: *\"Do NOT schedule a short-interval wakeup to poll for background work you started — when harness-tracked work finishes, you are re-invoked automatically, so polling is wasted.\"*\r\n  3. 외부 프로세스 감시가 실제로 필요한 경우엔 네이티브 **`Monitor` 도구**가 있고, 그 설명이 §B \"침묵은 성공이 아니다\"를 자체적으로 강제한다.\r\n  4. 레지스트리(`capability-assumptions.json` → `native-todowrite-background`)가 **2026-06-06 에 이미 \"Monitor 에이전트는 순수 오버헤드\"로 판정**해 두었다. 조치가 14개월치 릴리스 동안 밀려 있었을 뿐이다.\r\n- **유지되는 것**: §4.4 진행보고 의무 전부. 사용자에게 진행창이 없다는 조건은 변하지 않았다 — 지키는 주체만 서브에이전트에서 **본체**로 옮겼다.\r\n- **회귀 감시**: 폐지 후 장시간 작업에서 진행보고 누락이 늘어나는지 관찰한다. 본체가 침묵하는 사례가 반복되면 폴링이 아니라 **`Monitor` 도구 기반 감시**로 복구한다(에이전트 부활 아님).\r\n\r\n## 5. v3.29 에서 걷어낸 것 (감사 추적)\r\n\r\n`/crv` 없이 수동 감사로 확정. 판정 기준은 §1 — \"호스트가 이미 강제하는가\".\r\n\r\n| 걷어낸 것 | 있던 위치 | 대체하는 네이티브 |\r\n|------|----------|----------|\r\n| 오케스트레이션 규율 6항목 | `/cc` P3.0 · `/c` 3.4 | Agent·Workflow 도구 설명 (§C 표) |\r\n| QA 패턴 4항목 | `/ccp` 하네스 절 | Workflow Quality patterns (§D 표) |\r\n| \"침묵은 성공이 아니다\" 프롬프트 | `/cc` P3.1 · `/c` 3.2 Monitor 프롬프트 | `Monitor` 도구 \"Coverage — silence is not success\" |\r\n| 전담 Monitor 에이전트 | `/c`·`/cc` 강제 배포 | 하네스 자동 재호출 + TodoWrite (§4.6) |\r\n| 워커 \"작업 규율\" 8줄 | `/cc`·`/c` 워커 프롬프트 | 시스템 프롬프트 정직보고·완료판정·되돌리기 확인 (2줄 계약만 존치) |\r\n| Karpathy 4규칙 전문 ×12 | 8개 스킬 | `~/.claude/CLAUDE.md` 자동 로드 (워커 프롬프트 1곳만 존치) |\r\n| 스킬 인벤토리 표 주입 | SessionStart 훅 (~2K 토큰/세션) | 호스트 시스템 프롬프트의 스킬 목록 |\r\n| Lens Suggestion Line | SessionStart 훅 | 네이티브 Skills auto-discovery |\r\n| 키워드 추천기 + 플러그인 레지스트리 | `lib/keyword-matcher.js` · `lib/plugin-registry.js` | 네이티브 semantic auto-discovery (레지스트리는 v3.13 부터 빈 배열) |\r\n| `/c` 스킬 | `skills/c/` | 하네스 본체 + TodoWrite (순차 실행은 기본 동작) |\r\n| `/ccp` 스킬 | `skills/ccp/` | `/code-review`(+`ultra`) · `/security-review` · `/cc` P6 QA |\r\n\r\n**걷어내지 않은 것과 그 이유**: `/cp` 문서 라이프사이클(plan mode 는 영속 산출물을 만들지 않음) · `/cs` 멀티레포 sync(EnterWorktree 는 단일 레포) · `/cu`·`/ci`·`/lens-upgrade`(머신 단위 패키지 관리) · **codex 이종 모델 교차검증**(네이티브 워커는 전부 Anthropic 계열) · 모델 난이도 사다리와 TOP 상한(네이티브에 예산 정책 없음) · `/cr` 리서치 substrate(§F) · `/crv`.\r\n\r\n### 4.7 백그라운드 spawn 은 완료가 아니다 (계측 규약)\r\n\r\n**실측 결함 (2026-07-25)**: `Agent` 도구로 백그라운드 워커 10개를 배포한 **직후**, `hooks/post-tool-task.js` 가 전원에 대해 `done` 을 찍고 `All N agents complete` 를 출력했다. 실제로는 그 뒤 수 분간 돌았다(한 에이전트 311초, 다른 하나 567초). 원인: `PostToolUse` 는 **spawn 호출이 반환되는 순간** 발생하고, 훅이 `hasError ? 'error' : 'done'` 으로 무조건 완료 처리했다. 보고된 `132ms` 는 에이전트 수명이 아니라 spawn 호출 자체의 소요였다.\r\n\r\n**판정 근거 (2가지 독립 신호 — 실측 확인)**:\r\n\r\n1. `tool_input.run_in_background === true` (배포 10건 전부 존재).\r\n2. 도구 반환 텍스트 — `Async agent launched successfully.` + `agentId: …` + `output_file: …` + \"The agent is working in the background. You will be notified automatically when it completes.\"\r\n\r\n**규약**:\r\n\r\n- 백그라운드 launch 는 `done` 으로 마킹하지 않는다. **`launched`(완료 미관측)** 로 마킹하고 완료 집계에서 빼며, 훅 출력에 **\"상태 미확정(done 아님)\"** 을 드러낸다. 거짓 완료보다 미확정이 낫다 — 조용한 오보 금지.\r\n- **`launched` 는 성공도 실패도 아니다.** `endSession()` 의 고아 스윕(`running`/`pending` → `error`)에서 **제외**된다. 관측하지 못한 것은 실패가 아니기 때문이다. `running` 으로 남기면 `Stop` 훅이 **매 턴** 발화하므로 수 초 안에 거짓 `error` 가 된다(실측) — 거짓 `done` 을 고치다 거짓 `error` 를 만드는 함정이다.\r\n- `launched` 가 하나라도 있으면 **`All N agents complete` 류 문구를 출력하지 않는다.** 그 문구는 `running == 0 && launched == 0` 일 때만 참이다.\r\n- 완료 판정은 **완료 알림 또는 산출물 실측**으로만 한다. 스킬·Supervisor 는 훅의 `done` 카운트를 완료의 증거로 쓰기 전에 실측을 요구하고, **`launched` 를 in-flight 판정 근거로도 쓰지 않는다**(정의상 \"모름\"이라 아무것도 해제하지 못해 리마인더가 영구히 울린다). 진행보고 훅은 그래서 대시보드가 아니라 **도구 호출 스트림을 직접 관측**한다.\r\n- **완료 관측 경로 (조사 결론, 2026-07-25)**: `PostToolUse` 는 spawn 반환 시점에 **한 번만** 발화하므로 훅으로 완료를 볼 수 없다(실측: 220초 돌아간 에이전트에 두 번째 발화 없음). 하네스 이벤트 목록에 `SubagentStop`/`TaskCompleted`/`Notification:agent_completed` 가 존재하지만 **백그라운드 발화 여부·입력 스키마·상관 식별자가 문서화돼 있지 않아** 실측 프로빙 없이 배선할 수 없다. `launched` 는 그 배선이 생기면 `completeAgent(agentId,'done')` 으로 그대로 해소되는 **전방 호환** 상태다.\r\n","truncated":false,"stale":false,"branch":null,"base":null},{"id":"live-research","folder":"rules","title":"Live Research substrate (agent-reach + insane-search)","date":"","hasMd":true,"hasHtml":false,"mdPath":"rules/live-research.md","htmlPath":null,"mdInline":"# Live Research substrate (agent-reach + insane-search)\r\n\r\n> Lens 스킬(`/cp deep` S2, `/cr`)이 \"현재 라이브 정보\"(최신 릴리즈·트렌드·이슈·커뮤니티 반응)를 가져오는 표준 경로.\r\n> 도구 미설치 시 폴백까지 규정. **SoT — 스킬은 이 문서를 참조만 한다**(호출법을 각자 재구현하지 않는다).\r\n\r\n이 문서는 순수 규칙 문서다. Lens 는 `agent-reach`·`insane-search` 를 **강제 설치하지 않는다** — \"있으면 쓰고 없으면 폴백\"만 규정한다. 두 도구는 Lens 외부 플러그인이므로, 미설치가 \"실패\"가 아니라 \"폴백\"이 되어야 한다.\r\n\r\n---\r\n\r\n## 0. 감지 (호출 전 1회)\r\n\r\n라이브 조사 단계에 들어가면, 스킬은 **먼저 아래를 판정**해 어느 경로를 쓸지 고른다.\r\n\r\n### agent-reach (무키 라이브 채널)\r\n\r\n```bash\r\n# PATH 우선, 없으면 표준 설치 경로 확인\r\ncommand -v agent-reach \\\r\n  || ls ~/.agent-reach-venv/Scripts/agent-reach.exe   # Windows\r\n  # unix:  ls ~/.agent-reach-venv/bin/agent-reach\r\n```\r\n\r\n- Windows: `~/.agent-reach-venv/Scripts/agent-reach.exe`\r\n- unix(macOS/Linux): `~/.agent-reach-venv/bin/agent-reach`\r\n- 또는 PATH 에 `agent-reach` 가 잡히면 그대로 사용.\r\n\r\n감지되면 **채널별 백엔드 상태**를 확인한다(무키 6~7채널만 즉시 가용, 나머지는 인증 필요):\r\n\r\n```bash\r\nagent-reach doctor --json\r\n```\r\n\r\n→ 각 플랫폼의 `active_backend` 로 지금 어떤 채널이 살아 있는지 확인 후 호출표(§1)를 고른다.\r\n\r\n### insane-search (WAF 우회 fetch)\r\n\r\n- 플러그인 스킬 존재로 감지: 세션의 스킬 목록에 `insane-search` 가 있는지, 또는\r\n  ```bash\r\n  ls ~/.claude/plugins/cache/*/insane-search/*/ 2>/dev/null\r\n  ```\r\n- 있으면 `python -m engine \"<URL>\"` 사용 가능(§2).\r\n\r\n### 판정\r\n\r\n- 둘 다 감지 → §1·§2 직접 명령 사용.\r\n- 하나만 감지 → 있는 것만 쓰고, 없는 쪽은 §3 폴백.\r\n- **둘 다 없음 → §3 폴백 모드로 진행**(절대 멈추지 않음).\r\n\r\n---\r\n\r\n## 1. 라이브 채널 (agent-reach)\r\n\r\n감지되면 아래 실측 명령을 쓴다. 로그인 채널·재시도 체인 등 복잡한 라우팅은 **agent-reach 스킬에 위임**한다(그쪽 `references/*.md` 가 관리 — 여기서 재구현하지 않는다).\r\n\r\n| 의도 | 명령 |\r\n|------|------|\r\n| 시맨틱 웹검색(트렌드·최신) | `mcporter call 'exa.web_search_exa(query: \"...\", numResults: 5)'` |\r\n| 웹페이지 읽기(마크다운화) | `curl -s \"https://r.jina.ai/<URL>\"` |\r\n| GitHub 리포/이슈/PR | `gh search repos \"q\" --sort updated --limit N` / `gh search issues \"q\" --limit N` |\r\n| YouTube 자막 | `yt-dlp --write-auto-sub --sub-lang \"ko,en\" --skip-download -o \"/tmp/%(id)s\" \"<URL>\"` → 생성된 json3/vtt 파싱 |\r\n| V2EX 핫 토픽 | `curl -s https://www.v2ex.com/api/topics/hot.json -H \"User-Agent: lens/1.0\"` |\r\n| RSS/Atom 피드 | `curl -s \"<feed_url>\"` 후 항목 파싱 |\r\n| 플랫폼 라우팅 일반(小红书·트위터/X·B站·Reddit·LinkedIn 등) | **agent-reach 스킬에 위임** — 채널별 백엔드·재시도 체인은 그쪽이 관리 |\r\n\r\n## 2. 차단 우회 fetch (insane-search)\r\n\r\nWebFetch 가 402/403/blocked 를 반환하거나 WAF/봇 차단이 있는 특정 공개 URL 은:\r\n\r\n```bash\r\npython -m engine \"<URL>\"\r\n```\r\n\r\n- yt-dlp·Jina Reader·공개 API·WAF-프로파일 fetch 체인(TLS impersonation, 모바일 URL 변환, 실제 Chrome)을 자동으로 순차 시도한다.\r\n- **§6 안전 한계를 반드시 지킨다**(페이월·로그인 우회 금지 등).\r\n\r\n---\r\n\r\n## 3. 폴백 (도구 없을 때)\r\n\r\n미설치는 **실패가 아니라 폴백**이다. 조용히 대체하고, 조사보고에 한 줄만 남긴다.\r\n\r\n- **agent-reach 없음** → `deep-research` 스킬(있으면) → 없으면 네이티브 `WebSearch` / `WebFetch`.\r\n- **insane-search 없음** → `WebFetch` → 막히면 Jina Reader(`curl -s \"https://r.jina.ai/<URL>\"`).\r\n\r\n폴백을 탄 경우 조사보고에 다음 한 줄을 남긴다:\r\n\r\n> 라이브 채널 없음(폴백: `<대체 수단>`)\r\n\r\n절대 **\"라이브 조사 실패\"로 멈추지 않는다.** 최선의 폴백 수단으로 계속 진행하고, 어떤 경로를 썼는지만 명시한다.\r\n\r\n---\r\n\r\n## 4. 신선도 규율\r\n\r\n라이브 데이터는 \"지금 참인가\"가 핵심이다.\r\n\r\n- 라이브 인용은 **출처 URL + 발행일**을 병기한다.\r\n- 발행일이 오래된 소스는 \"라이브 아님\"으로 표기한다(오래된 정보를 최신 신호로 오인하지 않도록).\r\n- 발행일을 못 구하면 \"발행일 불명\"으로 명시하고, 라이브 신호로 단정하지 않는다.\r\n\r\n---\r\n\r\n## 5. 누가 참조하나\r\n\r\n이 문서를 참조하는 스킬:\r\n\r\n- **`/cp deep`** — S2(전방위 fan-out 조사)의 축③ 라이브 신호 조사.\r\n- **`/cr`** — creeta research(라이브 다각도 딥리서치).\r\n\r\n스킬을 추가하거나 참조 방식을 바꿀 때 **이 목록을 갱신한다.** 새 Lens 스킬이 라이브 데이터를 필요로 하면, 호출법을 재발명하지 말고 이 문서만 참조한다(agent-reach 채널이 늘면 §1 표 한 곳만 갱신).\r\n\r\n---\r\n\r\n## 6. 안전 한계 (insane-search)\r\n\r\n`insane-search`(`python -m engine`)는 **접근이 막힌 정당한 공개 정보를 조회**하기 위한 도구다. 우회 능력을 오남용하지 않는다.\r\n\r\n- **(a) 로그인/유료 페이월 우회 금지** — 인증·결제 뒤의 콘텐츠를 강제로 뚫지 않는다.\r\n- **(b) robots·ToS 위반 대량 크롤 금지** — 사이트 정책을 무시한 대량 수집 금지.\r\n- **(c) 개인정보·비공개 리소스 조회 금지** — 공개 의도가 없는 데이터는 다루지 않는다.\r\n- **(d) 실패는 terminal 로 인정** — `auth_required` / `paywall` / `404` 등은 최종 실패로 받아들이고 멈춘다. **무한 재시도 금지.**\r\n\r\n---\r\n\r\n## 셸 규칙 (Windows cp949 함정)\r\n\r\n- **한글 content 를 셸에 직접 넣지 않는다** — Windows cp949 인코딩에서 깨진다. `--data-binary @file` 또는 파일 경유로 전달한다.\r\n- 임시 파일은 `/tmp/` 에 둔다(예: `-o \"/tmp/%(id)s\"`).\r\n- 큰 본문·자막은 파일로 받아 파싱한다(셸 인라인 금지).\r\n","truncated":false,"stale":false,"branch":null,"base":null},{"id":"publishing-guide","folder":"rules","title":"Lens Publishing Guide","date":"","hasMd":true,"hasHtml":false,"mdPath":"rules/publishing-guide.md","htmlPath":null,"mdInline":"# Lens Publishing Guide\r\n\r\n플러그인 배포 및 등록 가이드.\r\n\r\n## 1. Anthropic 공식 디렉토리\r\n\r\n**공식 레포**: [anthropics/claude-plugins-official](https://github.com/anthropics/claude-plugins-official)\r\n\r\n### 제출 방법\r\n\r\n**제출 폼** 사용 (권장): https://clau.de/plugin-directory-submission\r\n\r\n제출 후 Anthropic 심사를 거쳐 `external_plugins/lens/` 폴더로 등록됨.\r\n\r\n### 등록 후 설치 방법 (유저)\r\n\r\n```bash\r\n# 방법 1: 직접 설치\r\n/plugin install lens@claude-plugin-directory\r\n\r\n# 방법 2: Discover 탭에서 검색\r\n/plugin > Discover > \"lens\"\r\n```\r\n\r\n## 2. 커뮤니티 등록\r\n\r\n| 대상 | Stars | 제출 방법 |\r\n|------|-------|-----------|\r\n| [hesreallyhim/awesome-claude-code](https://github.com/hesreallyhim/awesome-claude-code) | 25k+ | PR → Plugin 섹션에 추가 |\r\n| [ccplugins/awesome-claude-code-plugins](https://github.com/ccplugins/awesome-claude-code-plugins) | 500+ | PR → Productivity 카테고리 |\r\n| [obra/superpowers-marketplace](https://github.com/obra/superpowers-marketplace) | 500+ | marketplace.json PR |\r\n\r\n### PR 템플릿 (awesome list)\r\n\r\n```markdown\r\n- [lens](https://github.com/CreetaCorp/lens) - Plan-first execution engine for Claude Code. Plan (/cp), run in parallel (/cc), sync repos (/cs), keep tooling current (/cu, /ci). 8 languages.\r\n```\r\n\r\n## 3. 독립 마켓플레이스 (현재 방식)\r\n\r\n유저가 직접 레포를 마켓플레이스로 추가:\r\n\r\n```bash\r\n# 마켓플레이스 추가\r\n/plugin marketplace add CreetaCorp/lens\r\n\r\n# 플러그인 설치\r\n/plugin install lens@CreetaCorp\r\n```\r\n\r\n## 4. --plugin-dir (개발용)\r\n\r\n```bash\r\ngit clone https://github.com/CreetaCorp/lens.git\r\nclaude --plugin-dir ./lens\r\n```\r\n\r\n캐시 없이 디렉토리에서 직접 로드. 개발/테스트 전용.\r\n","truncated":false,"stale":false,"branch":null,"base":null},{"id":"release-guide","folder":"rules","title":"Lens Release Guide","date":"","hasMd":true,"hasHtml":false,"mdPath":"rules/release-guide.md","htmlPath":null,"mdInline":"# Lens Release Guide\r\n\r\n버전 업데이트 시 반드시 이 문서를 따른다.\r\n\r\n## 1. SemVer 규칙\r\n\r\n`MAJOR.MINOR.PATCH` (예: 1.7.1)\r\n\r\n| 변경 유형 | 버전 | 예시 |\r\n|-----------|------|------|\r\n| 하위호환 깨는 변경 | MAJOR 올림 | 스킬 이름 변경, 훅 인터페이스 변경, 설정 키 삭제 |\r\n| 새 기능 추가 | MINOR 올림 | 새 스킬 (`/cp`), 새 훅, 새 lib 모듈, 새 config 옵션 |\r\n| 버그 수정, 문서 개선 | PATCH 올림 | 정규식 수정, 오타 수정, 경로 통일, 기존 기능 보강 |\r\n\r\n### 판단 기준\r\n\r\n- 새 파일 추가 → MINOR 이상\r\n- 기존 파일만 수정 → PATCH\r\n- `plugin.json`이나 `hooks.json` 구조 변경 → MAJOR\r\n- CHANGELOG에 \"Added\" 섹션이 있으면 → MINOR 이상\r\n- CHANGELOG에 \"Fixed\"/\"Changed\"만 있으면 → PATCH\r\n\r\n## 2. 버전이 기록된 파일 (13곳 — `scripts/bump-version.sh` 가 일괄 처리)\r\n\r\n**모든 파일을 동시에 같은 버전으로 업데이트해야 한다.** 수동 대신 **`bash scripts/bump-version.sh <X.Y.Z>`** 를 쓰면 아래 11파일을 자동 범프하고 stale 검증까지 한다.\r\n\r\n| # | 파일 | 위치 | 형식 |\r\n|---|------|------|------|\r\n| 1 | `.claude-plugin/plugin.json` | `\"version\": \"X.Y.Z\"` | JSON value |\r\n| 2 | `.claude-plugin/marketplace.json` | `\"version\": \"X.Y.Z\"` + `\"ref\": \"vX.Y.Z\"` | JSON value (2곳) |\r\n| 3 | `hooks/hooks.json` | `\"description\": \"Lens vX.Y.Z — ...\"` | 문자열 내 버전 |\r\n| 4 | `hooks/session-start.js` | `Lens vX.Y.Z activated` (4곳) | 문자열 리터럴 |\r\n| 5 | `skills/cc/SKILL.md` | `Lens Multi vX.Y.Z` (description + table, 2곳) | YAML + Markdown |\r\n| 6 | `skills/cp/SKILL.md` | `Lens Plan vX.Y.Z` (description + table, 2곳) | YAML + Markdown |\r\n| 7 | `skills/cs/SKILL.md` | `Lens Sync vX.Y.Z` + `currently X.Y.Z` | YAML + Markdown |\r\n| 8 | `skills/ci/SKILL.md` | `Creeta Install vX.Y.Z` (table row) | Markdown |\r\n| 9 | `CLAUDE.md` | `Current: **vX.Y.Z**` + `Updated: YYYY-MM-DD` + Recent Changes | Markdown |\r\n| 10 | `README.md` | `# Lens vX.Y.Z` (title) | Markdown |\r\n| 11 | `CHANGELOG.md` | `## [X.Y.Z] - YYYY-MM-DD` 섹션 추가 | Markdown |\r\n\r\n> v3.29 에서 `skills/c/` · `skills/ccp/` 가 제거돼 표에서 빠졌다. `skills/cpp/` 는 v3.25 삭제분인데 스크립트 검증 목록에만 남아 있던 유령 경로였고 v3.29 에서 정리했다.\r\n\r\n### 검색 명령어 (빠뜨린 곳 확인)\r\n\r\n```bash\r\n# 현재 버전 문자열이 모든 파일에 있는지 확인\r\ngrep -rn \"v1.7.1\" --include=\"*.json\" --include=\"*.js\" --include=\"*.md\" .\r\n\r\n# 이전 버전이 남아있는지 확인 (0건이어야 정상)\r\ngrep -rn \"v1.7.0\" --include=\"*.json\" --include=\"*.js\" --include=\"*.md\" . | grep -v CHANGELOG | grep -v \"Recent Changes\" | grep -v docs/\r\n```\r\n\r\n## 3. 릴리스 절차 (Step by Step)\r\n\r\n### Step 1: 코드 변경 완료\r\n\r\n모든 기능 구현/버그 수정을 먼저 커밋한다. 버전 범프 커밋과 코드 변경 커밋을 **분리**한다.\r\n\r\n```bash\r\n# 코드 변경 커밋 (예시)\r\ngit add lib/plan-manager.js skills/cp/SKILL.md\r\ngit commit -m \"fix: updatePlanStatus regex safety\"\r\n```\r\n\r\n### Step 2: CHANGELOG.md 작성\r\n\r\n파일 **맨 위**에 새 버전 섹션을 추가한다.\r\n\r\n```markdown\r\n## [X.Y.Z] - YYYY-MM-DD\r\n\r\n### Added (vX.Y.Z)\r\n- (MINOR일 때만) 새로 추가된 기능\r\n\r\n### Changed (vX.Y.Z)\r\n- 기존 기능의 변경사항\r\n\r\n### Fixed (vX.Y.Z)\r\n- 수정된 버그\r\n\r\n### Removed (vX.Y.Z)\r\n- (있을 때만) 삭제된 기능\r\n```\r\n\r\n규칙:\r\n- 각 항목은 **굵은 제목** + 설명 + 해당 파일명\r\n- Added/Changed/Fixed/Removed 순서\r\n- 해당 없는 섹션은 생략\r\n\r\n### Step 3: 13곳 버전 범프 (자동 권장)\r\n\r\n`bash scripts/bump-version.sh <X.Y.Z>` 로 위 표의 13개 파일을 일괄 업데이트한다(수동 시 누락 위험).\r\n\r\n**주의사항**:\r\n- `marketplace.json`은 `version`과 `source.ref` 2곳 모두 변경\r\n- `session-start.js`는 4곳 (`activated` 메시지 2개 + `Session Startup` 제목 2개)\r\n- 각 SKILL.md는 YAML description + table description 2곳\r\n- `CLAUDE.md`는 Version 섹션 + Recent Changes 섹션\r\n\r\n### Step 4: 버전 범프 커밋\r\n\r\n```bash\r\ngit add -A\r\ngit commit -m \"chore: bump version to vX.Y.Z\"\r\n```\r\n\r\n커밋 메시지 규칙: `chore: bump version to vX.Y.Z` (항상 이 형식)\r\n\r\n### Step 5: Git 태그\r\n\r\n```bash\r\ngit tag vX.Y.Z\r\n```\r\n\r\n- 접두사 `v` 필수 (v1.7.1, v2.0.0)\r\n- 태그는 반드시 버전 범프 커밋에 생성\r\n\r\n### Step 6: Push\r\n\r\n```bash\r\ngit push origin master --tags\r\n```\r\n\r\n- `--tags` 플래그 필수. 없으면 태그가 remote에 안 올라감\r\n- 커밋과 태그를 한 번에 push\r\n\r\n### Step 7: GitHub Release\r\n\r\n```bash\r\ngh release create vX.Y.Z \\\r\n  --title \"vX.Y.Z — 릴리스 제목\" \\\r\n  --latest \\\r\n  --notes \"$(cat <<'EOF'\r\n## Added\r\n- ...\r\n\r\n## Fixed\r\n- ...\r\n\r\n**Released**: YYYY-MM-DD\r\nEOF\r\n)\"\r\n```\r\n\r\n규칙:\r\n- `--latest` 플래그: 최신 릴리스로 마킹 (가장 최근 버전에만)\r\n- Release notes는 CHANGELOG.md의 해당 버전 섹션과 동일\r\n- 릴리스 제목: `vX.Y.Z — 핵심 기능 요약` (예: `v1.7.0 — /cp Plan-First Execution`)\r\n\r\n## 4. 과거 실수 사례 & 방지책\r\n\r\n| 실수 | 결과 | 방지책 |\r\n|------|------|--------|\r\n| 태그 안 만듦 | 원격에 버전 추적 불가 | Step 5 필수 |\r\n| `--tags` 빼고 push | 태그가 로컬에만 존재 | Step 6 명령어 복사해서 사용 |\r\n| GitHub Release 안 만듦 | 유저가 변경사항 확인 불가 | Step 7 필수 |\r\n| `session-start.js` 누락 | 세션 시작 시 구버전 표시 | 4곳 모두 grep으로 확인 |\r\n| `marketplace.json` ref 미갱신 | 유저가 구버전 설치 | `source.ref` 확인 |\r\n| 코드 변경과 버전 범프 한 커밋 | 태그가 코드 변경+범프 섞임 | 분리 커밋 |\r\n\r\n## 5. 캐시 관련 주의사항\r\n\r\nClaude Code는 **버전 번호**로 플러그인 캐시를 관리한다.\r\n\r\n- 코드를 변경했지만 버전을 안 올리면 → 기존 유저는 **변경사항을 못 봄**\r\n- 캐시 경로: `~/.claude/plugins/cache/CreetaCorp/lens/{version}/`\r\n- 수동 캐시 삭제: `rm -rf ~/.claude/plugins/cache/CreetaCorp/lens/`\r\n- 개발 중에는 `claude --plugin-dir ./lens`으로 캐시 우회\r\n\r\n## 6. 버전 검증 체크리스트\r\n\r\n릴리스 후 아래를 확인한다:\r\n\r\n```bash\r\n# 1. 로컬 태그 확인\r\ngit tag -l | tail -3\r\n\r\n# 2. 원격 태그 확인\r\ngh api repos/CreetaCorp/lens/tags --jq '.[].name' | head -5\r\n\r\n# 3. GitHub Releases 확인\r\ngh release list | head -5\r\n\r\n# 4. origin과 동기화 확인\r\ngit status\r\n\r\n# 5. 구버전 잔존 확인 (CHANGELOG/docs 제외, 0건이어야 함)\r\ngrep -rn \"vOLD_VERSION\" --include=\"*.json\" --include=\"*.js\" skills/ hooks/ .claude-plugin/ | grep -v node_modules\r\n```\r\n","truncated":false,"stale":false,"branch":null,"base":null}],"review":[]}};

  const $ = (s, p = document) => p.querySelector(s);
  const $$ = (s, p = document) => Array.from(p.querySelectorAll(s));
  const el = (tag, attrs, ...children) => {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;        // always textContent — never innerHTML
      else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
      else if (v !== undefined && v !== null) e.setAttribute(k, v);
    }
    for (const c of children) {
      if (c == null) continue;
      e.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return e;
  };

  const GROUP_LABELS = { tasks: "Tasks", review: "In Review", history: "History", rules: "Rules" };
  const GROUP_ORDER = ["tasks", "review", "history", "rules"];

  const repo = BOARD.repo || "repo";
  const groups = BOARD.groups || { tasks: [], history: [], rules: [] };
  let viewing = null;     // active doc id
  let filterText = "";

  // index docs by id for O(1) lookup
  const byId = {};
  for (const g of GROUP_ORDER) for (const d of (groups[g] || [])) byId[d.id] = d;
  const total = GROUP_ORDER.reduce((n, g) => n + (groups[g] || []).length, 0);

  // ── header ──
  $("#repo-name").textContent = repo;
  $("#repo-name").appendChild(el("span", { class: "dim", text: " / docs" }));

  // ── render board ──
  function renderBoard() {
    const f = filterText.trim().toLowerCase();
    let shown = 0;
    for (const g of GROUP_ORDER) {
      const all = groups[g] || [];
      const docs = f ? all.filter(d => (d.title || d.id).toLowerCase().includes(f)) : all;
      shown += docs.length;
      const wrap = $(`[data-col="${g}"]`);
      wrap.replaceChildren();
      if (docs.length === 0) {
        wrap.appendChild(el("div", { class: "empty", text: "empty" }));
      } else {
        for (const d of docs) wrap.appendChild(renderCard(d));
      }
      $(`[data-count="${g}"]`).textContent = String(docs.length).padStart(2, "0");
    }
    const statsEl = $("#stats");
    statsEl.replaceChildren();
    statsEl.appendChild(el("span", null, "showing ", el("b", { text: String(shown) }), " / ", el("b", { text: String(total) })));
    if (BOARD.generatedAt) {
      statsEl.appendChild(el("span", { class: "sep" }, "·"));
      const gen = BOARD.generatedAt.replace("T", " ").replace(/\.\d+Z$/, "Z");
      statsEl.appendChild(el("span", null, "generated ", el("b", { text: gen })));
    }
  }

  function renderCard(doc) {
    const card = el("article", { class: "card", "data-id": doc.id, onclick: () => openPanel(doc.id) });
    card.appendChild(el("h3", { class: "tt", text: doc.title || doc.id }));

    const meta = el("div", { class: "meta-row" });
    if (doc.date) meta.appendChild(el("span", { class: "date", text: doc.date }));
    meta.appendChild(el("span", { class: "badge " + (doc.hasHtml ? "html" : "md"), text: doc.hasHtml ? "HTML" : "MD" }));
    if (doc.stale) meta.appendChild(el("span", { class: "badge stale", text: "stale" }));
    if (doc.pr) meta.appendChild(el("a", { class: "badge pr", href: doc.pr.url, title: doc.pr.base ? ("PR #" + doc.pr.number + " \u2192 " + doc.pr.base) : null, target: "_blank", rel: "noopener", text: "PR #" + doc.pr.number, onclick: (e) => e.stopPropagation() }));
    card.appendChild(meta);
    return card;
  }

  // ── panel ──
  function openPanel(id) {
    viewing = id;
    $("#scrim").classList.add("open");
    $("#panel").classList.add("open");
    $("#panel").setAttribute("aria-hidden", "false");
    renderPanel();
  }
  function closePanel() {
    $("#scrim").classList.remove("open");
    $("#panel").classList.remove("open");
    $("#panel").setAttribute("aria-hidden", "true");
    viewing = null;
  }

  function renderPanel() {
    const doc = byId[viewing];
    if (!doc) { closePanel(); return; }

    $("#p-id").textContent = doc.id + (doc.date ? "  ·  " + doc.date : "") + "  ·  " + (GROUP_LABELS[doc.folder] || doc.folder);
    $("#p-title").textContent = doc.title || doc.id;

    // actions: "Open in new tab" for html docs, "Convert to HTML" for md-only
    const actions = $("#p-actions");
    actions.replaceChildren();
    if (doc.hasHtml && doc.htmlPath) {
      actions.appendChild(el("button", {
        class: "ghost",
        text: "Open in new tab",
        onclick: () => window.open(doc.htmlPath, "_blank", "noopener"),
      }));
    } else {
      actions.appendChild(el("button", {
        class: "primary",
        text: "Convert to HTML",
        onclick: () => convert(doc),
      }));
    }
    actions.appendChild(el("button", { class: "ghost", text: "close", onclick: closePanel }));

    // notes (truncated md)
    const notes = $("#p-notes");
    notes.replaceChildren();
    if (doc.truncated) {
      const span = el("span", { class: "trunc" });
      span.appendChild(document.createTextNode("⚠ truncated — "));
      if (doc.mdPath) {
        span.appendChild(el("a", { href: doc.mdPath, target: "_blank", rel: "noopener", text: "open original" }));
      } else {
        span.appendChild(document.createTextNode("open original"));
      }
      notes.appendChild(span);
    }

    // body: iframe for html report, raw md (textContent) otherwise
    const body = $("#p-body");
    body.replaceChildren();
    if (doc.hasHtml && doc.htmlPath) {
      body.appendChild(el("iframe", {
        class: "report-frame",
        src: doc.htmlPath,
        title: doc.title || doc.id,
        loading: "lazy",
      }));
    } else {
      const scroll = el("div", { class: "md-scroll" });
      const pre = el("pre", { class: "md-pre" });
      // HARD SECURITY REQUIREMENT: md is untrusted — render via textContent ONLY.
      pre.textContent = doc.mdInline || "(empty)";
      scroll.appendChild(pre);
      body.appendChild(scroll);
    }
  }

  // ── convert to html (clipboard + fallback) ──
  function convert(doc) {
    const cmd = "/cp html docs/" + doc.mdPath;
    const ok = () => toast("Command copied — paste into Claude Code:", cmd);
    const fail = () => openModal(cmd);
    // file:// is not a secure context — navigator.clipboard is blocked there and
    // writeText can hang silently. Gate on isSecureContext so file:// goes straight
    // to the modal (which shows the command for manual copy).
    if (window.isSecureContext && navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(cmd).then(ok, fail);
    } else {
      fail();
    }
  }

  // ── toast ──
  function toast(msg, cmd, ms = 4000) {
    const t = $("#toast");
    t.replaceChildren(document.createTextNode(msg));
    if (cmd) {
      t.appendChild(document.createElement("br"));
      t.appendChild(el("span", { class: "cmd", text: cmd }));
    }
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove("show"), ms);
  }

  // ── modal (manual copy fallback — must NOT look successful) ──
  function openModal(cmd) {
    const ta = $("#modal-cmd");
    ta.value = cmd;
    $("#modal-scrim").classList.add("open");
    ta.focus();
    ta.select();
    try { ta.setSelectionRange(0, cmd.length); } catch (_) {}
  }
  function closeModal() { $("#modal-scrim").classList.remove("open"); }

  // ── events ──
  $("#search").addEventListener("input", (e) => { filterText = e.target.value; renderBoard(); });
  $("#p-close").addEventListener("click", closePanel);
  $("#scrim").addEventListener("click", closePanel);
  $("#modal-close").addEventListener("click", closeModal);
  $("#modal-scrim").addEventListener("click", (e) => { if (e.target === $("#modal-scrim")) closeModal(); });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if ($("#modal-scrim").classList.contains("open")) { closeModal(); return; }
    if (viewing) closePanel();
  });

  // ── init ──
  renderBoard();
})();
