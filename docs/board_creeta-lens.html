니라 리터럴 문자열로 잡히는 이상 상태 — **가정**: `resolveBase` 판정 불가로 처리하고 `requireTaskBranch` 대상에서 제외. · **확인 시점**: T2 검증\r\n- **`validatePlanStructure` 자체 결함 2건을 이번에 고칠 것인가** — 이 계획을 게이트에 통과시키는 과정에서 발견했다. ① 섹션 매칭이 `^##` 만 허용하는데 `/cp` SKILL.md 템플릿은 `### 🔀 검토된 대안` 을 `## 🛠 How` 하위에 두라고 지시한다 → 스킬 지시를 그대로 따른 계획서는 **항상 게이트 fail**. ② placeholder 오탐 — lookbehind 가 `%`·`$` 만 제외해서 git upstream 표기(`@` + 중괄호 u)를 템플릿 변수로 오인한다 → 브랜치를 다루는 계획서가 게이트를 통과할 수 없다(이 문서가 실제로 걸렸다). **가정**: T3 가 같은 파일(`lib/plan-manager.js`)을 건드리므로 그때 함께 고치되, 범위 확대이므로 사용자 승인 후 착수. · **확인 시점**: 이 계획 승인 시\r\n- `sync/` 접두사를 유지할 것인가 — **가정**: 유지하되 규칙에 \"도구 전용·머지 즉시 삭제\"로 명시(`/cs` 재작성 회피 = surgical). · **확인 시점**: T1\r\n- 멀티레포 단일 task(한 작업이 2개 이상 레포를 건드림)를 어디까지 지원 — **가정**: 1 task = 1 레포를 기본 전제로 두고, 다중 레포는 `/cp done` 판정 결과 표로만 다룬다(manifest 최소 구현). · **확인 시점**: T6\r\n\r\n## ✅ Review — 검증\r\n\r\n**검증 전략 (어디까지·어떻게·보고)**: 이 작업은 CLI·git 레이어라 브라우저 검증이 없다. 세 층으로 검증한다. ① **판정 정확성** — `lib/git-branch.js` 를 **27개 레포 실물에 전량 실행**해 base 판정표를 출력하고, 알려진 정답 3건(`Returns_ERP_v20`=staging, `creeta-lens`=master, `livevil-contents`=main)과 이상 케이스 2건(`namane-cms`, `docs`)을 대조한다. ② **차단 동작** — 가장 위험한 `Returns_ERP_v20`(staging 체크아웃)에서 커밋 시도를 **dry-run** 으로 돌려 거부되는지 확인한다(현재는 통과해버리는 것이 결함이므로 before/after 대조가 곧 증거). ③ **왕복 1건** — 실제 레포 1개(`creeta-lens`)에서 계획→실행→완료를 한 바퀴 돌려 브랜치 생성·커밋·PR·머지·삭제·history 기록까지 이어지는지 확인한다. 파괴적 단계(브랜치 삭제·머지)는 `creeta-lens` 에서만 수행하고 `Returns_ERP_v20` 은 판정·차단까지만 검증한다. 보고는 판정표 + before/after 대조 + 왕복 로그를 대화에 그대로 싣는다.\r\n\r\n| # | 목표가 됐다는 신호 | 확인 방법 (명령/관측) | 통과 판정 | 종류 |\r\n|---|---|---|---|---|\r\n| 1 | 작업이 자기 브랜치에서 진행된다 | `/cc` 진입 후 `git -C <repo> rev-parse --abbrev-ref HEAD` | `feat/`·`fix/`·`ops/`·`docs/` 중 하나로 시작, base 이름과 다름 | auto |\r\n| 2 | 통합 브랜치가 오염되지 않는다 | 왕복 검증 중 `git -C creeta-lens log --oneline master..HEAD` 와 `git status` | 작업 중 `master` 의 tip 이 변하지 않음(커밋 0) | auto |\r\n| 3 | 배포 트리거 레포에서 직접 커밋이 막힌다 | `Returns_ERP_v20`(staging) 에서 `canCommitTo(plan.branch)` dry-run | `false` + \"staging 은 base — 커밋 거부\" 사유 출력. 변경 전 코드로 같은 입력 실행 시 `true`(결함 재현) | auto |\r\n| 4 | base 를 레포마다 정확히 감지한다 | `node -e \"require('./lib/git-branch').resolveBase(...)\"` 를 27개 레포 전량 실행 | `Returns_ERP_v20`=staging / `creeta-lens`=master / `livevil-contents`=main, 판정 불가는 명시적 null(조용한 추정 0건) | auto |\r\n| 5 | 머지 판정이 rebase·squash 에서도 맞다 | `livevil-research` 의 이미 머지된 브랜치에 `mergedState` 실행 | `MERGED(patch 동일)` 로 판정(조상 검사만으로는 미병합으로 보이는 브랜치) | auto |\r\n| 6 | 미머지 작업은 완료 기록으로 내려가지 않는다 | 머지 안 된 브랜치를 가진 task 로 `/cp done` 실행 | `docs/history/` 에 파일 미생성 + task 파일 유지 + \"In Review\" 보고 출력 | auto |\r\n| 7 | 병합된 브랜치는 자동으로 없어진다 | 왕복 검증에서 머지 후 `git branch -a \\| grep <branch>` | 로컬·원격 모두 결과 없음 + `docs/history/` 에 기록 생성 | auto |\r\n| 8 | 브랜치 목록에 진행 중인 작업만 남는다 | T0 후 + 왕복 후 `scripts/prune_branches.py --remote origin --base <base>` | `삭제 대상` 0건 (모두 정리됨), `유지` 는 열린 PR 의 head 뿐 | auto |\r\n| 9 | 기존 동작이 깨지지 않는다 | `requireTaskBranch:false` 로 기존 task 문서 3건 파싱 + `/cs` 1회 실행 | 파싱 에러 0, `/cs` 결과가 변경 전과 동일(회귀 없음) | auto |\r\n| 10 | 상태판이 실제 개발 상태를 보여준다 | board 재빌드 후 `docs/board_creeta-lens.html` 열기 | In Review 칼럼에 열린 PR 의 task 카드가 표시됨 | manual |\r\n\r\n## 🔍 실행 중 발견한 결함 (전부 실측 재현)\r\n\r\n> 이 계획을 실행하는 과정에서 드러난 것들. 계획 시점에는 몰랐다.\r\n\r\n| # | 결함 | 재현 | 처리 |\r\n|---|---|---|---|\r\n| D1 | `prune_branches.py` 가 `origin/HEAD` 를 **빈 이름 브랜치**로 \"삭제\" 판정 | git 이 `refs/remotes/origin/HEAD` 를 `origin` 으로 축약 → 이름 계산이 빈 문자열 → `PROTECTED={\"HEAD\"}` 가드 미발동. 보고서 첫 항목이라 `--apply` 가 abort. `git push origin --delete \"\"` → `fatal: --delete only accepts plain target ref names`, exit 128, 브랜치 무손상(throwaway 원격에서 실증) | T8 |\r\n| D2 | 같은 스크립트가 Windows 에서 크래시 | `UnicodeEncodeError: 'cp949' codec can't encode '—'`. Mac 에서만 검증된 도구인데 워크스페이스는 Windows + Mac Mini 양쪽 사용 | T8 |\r\n| D3 | 아카이브 판정 공백 | `backup/macmini-preIA-20260723`(커밋 169 / 변경 파일 4)이 계보가 같아서 `유지` 로 분류됨 — `branch-hygiene.md` 가 \"태그 아카이브\"로 지목한 바로 그 패턴인데 판정에서 빠진다 | T8 |\r\n| D4 | `validatePlanStructure` 가 `^##` 만 허용 | `/cp` SKILL.md 템플릿은 `### 🔀 검토된 대안` 을 `## 🛠 How` 하위에 두라고 지시 → **스킬 지시를 그대로 따른 계획서는 항상 게이트 fail.** 이 문서가 실제로 그렇게 fail 했다 | T3(lib) + T4(템플릿) 양쪽 |\r\n| D5 | 같은 함수의 placeholder 오탐 | lookbehind 가 `%`·`$` 만 제외해서 git upstream 표기(`@`+중괄호 u)를 템플릿 변수로 오인 → 브랜치를 다루는 계획서가 통과 불가. 이 문서가 실제로 걸려 문구를 우회 수정해야 했다 | T3 |\r\n| D6 | Lens 훅이 **거짓 \"완료\" 신호** | 백그라운드 서브에이전트 10개 배포 **직후** 훅이 전부에 `done (132ms). All N agents complete` 를 출력. 실제로는 방금 시작한 시점(한 에이전트는 311초 소요). `PostToolUse:Agent` 가 백그라운드에선 *반환 시점*에 발화하는데 그걸 완료로 해석. 132ms = 도구 호출 자체의 소요시간 | T10 (범위 추가) |\r\n| D7 | `canCommitTo` **계약 자체의 순서 오류** (Leader 책임) | \"base 와 같으면 항상 false\" 로 계약했는데, task 브랜치를 push 하면 upstream 이 자기 자신이 되어 base=자기자신으로 판정됨 → **두 번째 커밋이 거부된다.** throwaway 원격으로 재현(수정 전 false → 수정 후 true). 판정 순서를 \"planBranch 일치가 최우선\" 으로 정정 | T2 (완료) |\r\n| D8 | `parsePlanFrontmatter` 가 **CRLF 문서의 frontmatter 를 통째로 `null` 로 반환** | 앵커가 `^---\\n` LF 전용. 실측: frontmatter 보유 문서 6건 중 **CRLF 3건**(Windows 작성분) — 그 문서들은 `status`·`grade`·신규 `branch` 를 전부 못 읽는다. **이 계획서 자체도 CRLF** 였다. 즉 board 조인과 `/cp done` 판정이 Windows 문서에서 조용히 반쪽이었다 | T3 (`^---\\r?\\n` 로 수정, LF 회귀 0 확인) |\r\n| D9 | `updatePlanStatus` 의 frontmatter 정규식도 LF 전용 | D8 과 같은 계열. CRLF 문서에서는 frontmatter 의 `status:`/`updated:` 가 갱신되지 않고 본문만 바뀐다 | **미수정 — 보고만.** 그 함수는 런타임 미호출(deprecated)이라 범위 밖. Leader 승인 시 `\\r?` 1토큰으로 동일 수정 가능 |\r\n| D10 | placeholder 검사가 **비ASCII 플레이스홀더를 원래부터 못 잡음** | 문자 클래스가 ASCII 전용(`[a-z_]+`)이라 한글 플레이스홀더는 수정 전·후 모두 통과. Leader 지시문이 \"한글 플레이스홀더는 계속 잡혀야 한다\"고 썼는데 그 전제가 애초에 성립하지 않았다 | **미수정 — 보고만.** 유니코드 문자 클래스로 확장하는 것은 요청 범위 밖 동작 변경 |\r\n| D13 | placeholder 검사가 **산문에 인용된 정규식 문법도 오탐** | D5 를 고친 뒤에도, 이 문서에 유니코드 문자 클래스 표기를 그대로 적었더니 그 중괄호가 템플릿 변수로 잡혀 게이트가 fail 했다(실측 — 이 표의 D10 항목을 쓰다가 발생). `@` 를 lookbehind 에 추가하는 방식은 **오탐 유형마다 예외를 늘리는 접근**이라 근본 해결이 아니다 | **미수정 — 설계 재검토 필요.** 후속 과제: \"미치환 템플릿 변수\" 를 문자 패턴이 아니라 **템플릿 생성기가 실제로 쓰는 토큰 목록**으로 판정하는 방식 |\r\n| D11 | `sync-karpathy-rules.ps1` 에 **BOM 이 원래 없었다** | Leader 지시문이 \"BOM 유지 필수\"라고 했으나 `git show HEAD:` 로 확인한 원본 선두가 `b'# sync'`. 유지할 BOM 이 없었다 | **정정 완료 — 추가하지 않음.** 새로 넣은 줄은 전부 ASCII 라 한글 깨짐 위험 0 |\r\n| D12 | Karpathy 동기화 `-Verify` 가 **작업 전부터 exit 1** | 선재 drift 2건: ① `GUI Ground Truth` 섹션이 `~/.claude/CLAUDE.md` 에 애초에 복사돼 있지 않음 ② `~/.codex/AGENTS.md` 가 이 PC 에 **파일 자체가 없음**. 새로 넣은 진행보고 섹션은 `byte-identical=True` 로 통과 | **범위 밖 — Leader/사용자 판단 필요** |\r\n\r\n| D14 | prune 이 **fetch URL 로 판정하고 push URL 로 삭제** | remote 에 `pushurl`(또는 `pushInsteadOf`)이 걸려 있으면 판정·보호·lease 는 전부 fetch 레포 기준인데 삭제는 push 레포로 나간다. 같은 이름·같은 SHA 의 `feat/x` 를 가진 upstream/fork 구성에서 재현 — 수정 전 코드가 **fork 의 브랜치를 실제로 삭제**했고(SHA 가 같아 lease 도 통과) upstream tracking ref 까지 부수 삭제됐다 | 5번째 fail-closed 로 차단. `--delete-without-pr-check` 로도 안 열림(판정 근거 레포와 삭제 대상 레포는 플래그로 같아지지 않는다). 실측 27개 레포 중 split remote 0개 |\r\n| D15 | board 의 In Review 조인이 **head 이름만 대조** | head 이름이 같기만 하면 **다른 base 로 향하는 PR** 이 카드에 달라붙는다. fixture 재현: `base: master` 인 task 에 `feat/stacked → develop` PR 이 In Review 로 붙었다 | base 자격 검사 추가. `base` 없는 옛 문서는 이름만으로 조인(39개 중 `base:` 보유 1개뿐 — 엄격하게 가면 전 코퍼스 In Review 가 조용히 빈다). 안 붙인 건수는 상단 바에 표시 |\r\n| D16 | 같은 조인이 **gh 응답 순서에 따라 결과가 달라짐** | 지시 범위 밖에서 발견. `byBranch.set()` 마지막-쓰기-승리라, 캐시의 PR 순서만 뒤집자 옛 코드가 tie task 에 **잘못된 base 의 PR** 을 붙였다 | 결정적 선택(자격 통과 후보 중 최소 번호)으로 해소 — 순서 무관 |\r\n| D17 | `/cp done` 의 PR 증거가 **MERGED 상태만 확인** | `baseRefName` 을 안 봐서 **stacked PR**(다른 작업 브랜치로 머지 + head 삭제)이 `prMerged:true` → `merged-deleted` 를 만든다. 그 변경이 계획의 base 에 없는데도 task 가 완료 아카이브된다 | base 자격 통과 MERGED 가 **정확히 1개**일 때만 증거. 0개면 사유와 함께 `unknown`, 2개 이상이면 브랜치 재사용으로 보고 fail-closed |\r\n| D18 | `/cp` 가 **원격에 없는 base 를 frontmatter 에 기록** | `resolveBase` 는 이름만 해석한다. upstream 이 stale 이면(`docs` 레포 실측: 원격이 비어 있는데 이름은 `main`) 존재하지 않는 base 가 문서에 박히고 `/cc` 가 실행 진입에서 실패한다 | PLAN 흐름이 `preflight()` 의 base(원격 ref 실존 확인 포함)를 쓰도록 변경 |\r\n\r\n| D19 | 삭제 lease 가 **브랜치 tip 에만** 걸려 base 역행을 못 본다 | 삭제 근거는 둘(\"tip 이 판정 그대로\" + \"패치가 base 에 있다\")인데 하나만 검증했다. throwaway 원격 재현: base 를 머지 이전으로 force-push → stale 판정으로 `--apply` → `삭제 완료`, 이후 `git branch --contains <B>` **출력 없음**(커밋이 어느 원격 ref 에도 없음) | `--atomic` + base·branch **이중 lease**. base refspec 은 no-op 이지만 lease 가 reset 된 base 를 되미는 write 까지 막는다(실측). 로컬은 `update-ref -z --stdin` 의 `verify`+`delete` 한 트랜잭션 |\r\n| D20 | `gh pr list` 에 timeout·stdin 차단 없음 | 300초 sleep 하는 가짜 `gh.exe` 로 재현 — 워크스페이스 전수 순회가 **무기한 정지**, 외부 kill 로만 종료. 같은 파일의 `ls-remote` 에는 20초 가드가 이미 있었다 | `GH_PR_LIST_TIMEOUT_SECONDS=20` + `stdin=DEVNULL`. `TimeoutExpired` 를 **기존 fail-closed 사유 1번**으로 합류(새 경로 없음) |\r\n| D21 | 진행보고 훅이 **`Workflow` 를 무장하지 못함** | `run_in_background` 필드가 없고 반환에 agent 문구가 하나도 없어 agent 봉투로는 영영 성립 불가. 4개 세션 25건 실측 | Workflow 전용 봉투(마커+식별자). 권한 거부로 **못 뜬 런치 1건**은 정상 탈락 — 마커 단독 판정을 안 쓰는 이유 |\r\n| D22 | **11라운드에 내가 넣은 봉투 판별이 실제 payload 에서 성립하지 않음** | 두 경로 다 실패. ① content-block 배열이면 `JSON.stringify` 가 개행을 `\\`+`n` 으로 escape → `agentId` 앞이 **단어 문자** → `\\b` 가 깨져 식별자 미검출 ② 구조화 결과에는 문장 자체가 없음(실측: 이 세션 async Agent 런치 **41건 전부** `{status:'async_launched', agentId, outputFile, …}`) | `responseText()` 가 배열을 **`.text` 로 펼치도록** 근본 수정 + 구조화 철자 추가. 두 훅 동시 적용(문서가 \"단일 감시 지점\"이라 명시) |\r\n| D23 | `SessionStart` 가 진행보고 상태를 초기화하지 않음 | stop.js 를 \"삭제→스탬프\" 로 고친 부작용. 이전 세션 시계가 살아남아 새 세션 **첫 폴링에서 즉시 발화 + \"대기 7201초째\"** 오보(실측 재현) | `startup`/`resume`/`clear` 만 삭제하는 **허용목록**. `compact`·`fork` 는 대화 도중 발화하고 `fork` 는 에이전트가 띄울 수 있어 보존 — 거기서 지우면 stop.js 가 막은 회피가 재생된다 |\r\n\r\n**D6·D7 이 이 작업의 성격을 말해준다** — 계획서에 \"생성 자동화보다 삭제 자동화가 먼저\"라고 적었는데, 실제로는 **판정 자체가 틀린 것**이 더 먼저였다. D1 은 첫 `--apply` 에서, D7 은 두 번째 커밋에서 각각 터진다.\r\n\r\n## 🔁 Codex 교차 리뷰 11라운드 + 12라운드 수정 (실행 중 추가)\r\n\r\nCodex 가 매 커밋을 독립 리뷰했고 **11차까지 매 라운드 P1 이 나왔다.** 라운드별 P1: **5 → 3 → 2 → 4 → 2 → 3 → 2 → 1 → 1 → 2 → 1**. 단조 감소가 아니었고, 지적의 성격이 표면(하드코딩·오탐)에서 **순서·재사용·충돌·경쟁 상태** 같은 의미론으로 옮겨갔다.\r\n\r\n> **왜 여기서 멈췄나**: 사전 선언한 기준(\"11차까지 돌리고 그 시점 상태로 커밋·푸시\")대로 11차를 마지막 **리뷰**로 두었다. 다만 11차가 낸 P1 1건 + P2 3건은 **범위가 확정된 수정**이지 새 탐색이 아니므로 12라운드로 전부 처리했고, **12차 리뷰는 돌리지 않았다.** 매 라운드 새 P1 이 나온다는 것 자체가 **이 코드 영역(파괴적 git 연산)에서는 리뷰를 무한히 돌려도 0 이 되지 않는다**는 신호다. 무인 상태로 라이브에 올리지 않는 것(`/lens-upgrade` 보류)이 그 사실에 대한 대응이다.\r\n\r\n**12라운드가 드러낸 것 — 내 수정이 만든 결함 2건(D22·D23)**: 11라운드에 넣은 \"구조화 봉투 요구\"는 **실제 payload 에서 한 번도 성립하지 않는** 판별이었고(D22), stop.js 의 \"삭제→스탬프\" 전환은 세션 경계에 낡은 시계를 남겼다(D23). 둘 다 이 표의 패턴 1(\"수정이 다음 결함을 만든다\")의 새 사례다. **차이는 이번엔 실측 payload 41건을 직접 확인해서 잡았다는 것** — 추론이 아니라 트랜스크립트 대조가 잡았다.\r\n\r\n**패턴 3가지가 반복됐다:**\r\n\r\n1. **수정이 다음 결함을 만든다.** 거짓 `done` 을 고치니 거짓 `error` 가 생겼고(`launched` 상태로 해소), `--limit 200` 을 넣으니 \"정확히 200개면 조용히 잘림\" 이 생겼고, `namane-cms` 를 `master` 로 고정하니 잔여 `main` 이 삭제 대상이 됐다. 파괴적 연산 코드의 전형이다.\r\n2. **규칙 문서를 고치고 코드·스킬을 안 따라간다.** 5·6차 지적의 대부분이 이 유형이었다 — 규칙을 야심차게 쓸수록 간극이 새로 생긴다. SoT 를 고칠 때 소비자 전부를 같이 봐야 한다.\r\n3. **문서가 계획 범위를 넘어선다.** 규칙 문서가 레포별 브랜치 메타데이터를 요구했는데 계획서는 \"1 task = 1 레포\" 를 전제로 뒀다. **코드를 확장하지 않고 문서를 좁혔다** — 스칼라 4필드에 구조를 넣으면 파싱이 깨지고 핸드오프·DONE·board 소비자가 전부 영향받는다.\r\n\r\n**실제 파괴를 재현한 것 3건** (이론이 아니었다):\r\n- 태그 이름 충돌 → `legacy/foo` 의 tip 이 **어디에도 보존되지 않은 채 삭제**됨\r\n- 셸 인젝션 → `pwn;touch${IFS}INJECTED` 브랜치로 `INJECTED` 파일이 **실제 생성**됨\r\n- `--remote upstream` 에서 그 remote 의 **default 브랜치가 삭제**됨\r\n\r\n**Codex 가 아니라 실측에서 찾은 것 1건**: prune 출력의 `base 분포` 에 `claude/why-so-many-branches-apcojh` 가 섞여 있었다 — 열린 PR 의 head 에 체크아웃된 레포에서 그 브랜치가 base 로 판정되고 있었다. `/cp` 가 그대로 계획했으면 **PR 이 main 이 아니라 다른 PR 의 브랜치를 향했다.** 금지 접두사(§3)를 base 후보에서 제외해 해소.\r\n\r\n## 진행상황\r\n- **마지막 업데이트**: 2026-07-26\r\n- **현재 경로**: Plan A (구현·문서·리뷰 11라운드 완료 — **PR 머지 대기**)\r\n- **작업 브랜치**: `feat/branch-lifecycle` (master tip `5cbf645` 에서 분기 — 미오염 검증 기준점). `livevil-setting` 은 `docs/progress-report-2min`\r\n- **재개 포인트**: PR #2(creeta-lens) · PR #3(livevil-setting) 머지 → 버전 bump → 태그 → `/lens-upgrade` → 설치본 실동작 검증\r\n\r\n### 남은 것 (사람 판단 필요)\r\n\r\n- **`/lens-upgrade` 보류** — 의도적. 11라운드 내내 매 라운드 P1 이 나온 코드를 무인 상태로 라이브에 올리면 문제가 생겨도 알아챌 사람이 없다. 사용자가 있을 때 실행한다. **그때까지 설치본 캐시는 옛 코드라 사용자의 실제 Lens 동작은 바뀌지 않았다.**\r\n- **`backup/macmini-*` 2건 태그 아카이브** — 커밋 169개인데 고유 변경 4파일(§0.6). 무엇을 살릴지는 내용 판단이라 도구가 못 정한다\r\n- **`requireTaskBranch` 를 언제 `true` 로 올릴 것인가** — 현재 `false`(경고만). 올리면 브랜치 확보 실패가 곧 실행 차단이 된다\r\n- **`docs` 레포 원격이 비어 있음** — base ref 부재로 판정 대상에서 제외 중. 초기 push 를 하든 대상에서 영구 제외하든 결정 필요\r\n- **성공기준 4·5(머지 확인 후 완료 기록 / 병합 브랜치 자동 삭제)** — 구현·문서·fixture 재현까지 끝났으나 **실사용 왕복 검증은 PR #2 머지 후**에만 가능하다(아직 열려 있다)\r\n\r\n### 편차 기록 (계획 ↔ 실제)\r\n- **T0 를 T8 보다 먼저** 두었으나 → 도구가 D1 로 고장나 있어 **이름 명시 수동 삭제**로 우회(사용자 승인). 원격 6개 삭제 + `main` 복귀 + 로컬 `agent/` 삭제 완료. 재판정 결과 삭제 대상 0건(남은 1건은 D1 오판)\r\n- **\"7개 삭제\"로 보고했다가 6개로 정정** — 7번째가 D1 의 빈 이름 항목이었다\r\n- **태스크 단위 병렬 → 파일 단위 병렬로 재분할** — T4·T6·T10 이 모두 `cp/SKILL.md` 를, T5·T10·T12 가 모두 `cc/SKILL.md` 를 건드려 충돌. 파일 배타 소유로 10 worker 재구성 (이 작업의 성공기준 #5 를 실행 자체가 지켜야 했다)\r\n- **범위 추가 3건** — T10(2분보고 강제)·T11(기본 agent 규칙)·T12(모델 사다리 4단)는 실행 중 사용자 지시로 추가\r\n- **모델 배정 상향** — 초기 배정(sonnet 다수)이 사용자 기준(\"사고과정=상위 모델\")에 미달해 opus 7 / fable 2 / sonnet 1 로 재배정. 원인은 D-급 결함이 아니라 Lens 사다리에 `opus` 칸이 없던 것(→ T12)\r\n- **`creeta-lens` 의 `sync/2026-07-25-215113` 정리 계획 철회** — 열린 PR #1 의 head 였다(삭제 전 확인으로 발견)\r\n- **병렬 worker lock 을 `withFileLock` 이 아니라 구조로 구현** — 계획서(🧰 실행 전략·R3)는 `lib/hook-utils.js` 의 파일 lock 재사용을 적었으나, 실제 통합 주체가 **Leader 단일·직렬**이라 잠글 경쟁자가 없다. 파일 lock 대신 \"Leader 만, 하나씩\" 이라는 구조적 lock 으로 구현했다. `withFileLock` 자체는 그대로 존재한다(다른 용도)\r\n- **worktree 통합 수단을 merge 가 아니라 패치 전송으로** — worker 는 커밋하지 않으므로(커밋 주체는 Phase 7.4 Leader 뿐) worktree 브랜치는 보통 **커밋 0개**이고, merge·cherry-pick 은 **아무것도 안 가져오면서 \"성공\"** 한다 — 같은 결함이 \"통합했다\" 는 거짓 신호와 함께 재발한다. 게다가 worktree 는 task base 가 아니라 `origin/<기본 브랜치>` 에서 갈라지므로(도구 스키마 실측), base 가 `staging` 인 레포에서 merge 하면 무관한 이력이 PR 에 딸려 들어간다\r\n","truncated":false,"stale":true,"branch":"feat/branch-lifecycle","base":"master"}],"history":[{"id":"2026-08-07-harness-thinning-audit","folder":"history","title":"하네스 감축 감사 (v3.29.0)","date":"2026-08-07","hasMd":true,"hasHtml":false,"mdPath":"history/2026-08-07-harness-thinning-audit.md","htmlPath":null,"mdInline":"---\r\ntitle: 하네스 감축 감사 — 네이티브가 흡수한 규율 걷어내기 (v3.29.0)\r\ndate: 2026-08-07\r\nstatus: completed\r\ngrade: standard\r\nplanner: manual-audit\r\n---\r\n\r\n# 하네스 감축 감사 (v3.29.0)\r\n\r\n## 🎯 What — 무엇이 가능해졌나\r\n\r\n- Lens 를 켜도 **Claude Code 가 이미 강제하는 규칙을 두 번 읽지 않는다.** 같은 지시를 호스트가 한 번, Lens 가 열두 번 말하던 상태가 끝났다.\r\n- 세션을 시작할 때 **Lens 가 밀어 넣던 스킬 목록·추천 규칙·팁 줄이 사라졌다.** 그 자리를 호스트의 스킬 목록이 그대로 채운다.\r\n- 병렬 작업을 돌릴 때 **진행 상황만 세던 보조 에이전트가 더 이상 뜨지 않는다.** 진행 보고는 그대로 받되, 그 일을 하던 별도 인력이 없어졌다.\r\n- 남은 스킬 9개는 전부 **호스트가 대신 해주지 않는 일**만 한다.\r\n\r\n**완료의 정의 (Done = ?)**\r\n\r\n> `/cc` 를 한 번 돌렸을 때 Monitor 에이전트가 뜨지 않고, 세션 시작 컨텍스트에 스킬 표가 없으며, 남은 9개 스킬 어디에도 Claude Code 가 이미 강제하는 규율 문단이 복붙돼 있지 않다.\r\n\r\n## ❓ Why — 왜 했나\r\n\r\n**푸는 문제**: LLM 세대가 올라가면서 하네스(모델을 붙잡아 두던 비계)가 모델 안으로 흡수됐다. 흡수된 뒤에도 비계를 그대로 두면 두 가지 손해가 난다. ① **토큰** — 같은 규칙을 여러 번 읽는다. ② **가중치 왜곡** — 호스트가 한 번 말하는 것을 Lens 가 열두 번 반복하면, 둘이 어긋날 때 Lens 쪽으로 기운다. 실제로 되묻기 정책에서 이 왜곡이 일어나고 있었다(§4.5).\r\n\r\n**안 하면**: 모델이 좋아질수록 Lens 가 모델의 판단을 덮어쓰는 방향으로 나빠진다. 비계는 저절로 사라지지 않는다.\r\n\r\n**직접 계기**: 사용자 지적 — *\"지금 llm 모델이 진화하면서 하네스를 걷어내는 게 더 좋다고 하던데.\"*\r\n\r\n## 🔬 조사 방법\r\n\r\n`/crv` 를 돌리지 않고 수동으로 했다. 판정 기준은 `docs/rules/harness-rules.md` §1 — **\"호스트가 이미 강제하는가\"** 하나.\r\n\r\n1. **공급 측 probe** — 라이브 세션(Claude Code 2.1.222)의 시스템 프롬프트·도구 설명을 직접 읽어 대조. `claude --help`, `claude plugin list`, `claude ultrareview --help` 실행.\r\n2. **수요 측** — 설치된 6개 플러그인(lens·agentmemory·context7·playwright·insane-search·ui-ux-pro-max) 전수 검토.\r\n3. **레지스트리 대조** — `docs/rules/capability-assumptions.json` 의 가정 ↔ 라이브 현실 diff.\r\n\r\n## 🔎 핵심 발견\r\n\r\n### 발견 1 — 규율 텍스트는 전부 네이티브로 이동했다\r\n\r\n| Lens 가 인라인하던 것 | 라이브에서 확인된 네이티브 위치 |\r\n|------|----------|\r\n| pipeline 기본 / barrier 예외 | Workflow 도구 — `DEFAULT TO pipeline()` + smell test 예제 |\r\n| 위임 후 중복 금지 | Agent 도구 — `Once you've delegated a search, don't also run it yourself` |\r\n| 결과 릴레이 | Agent 도구 — `The agent's final report is not shown to the user — relay what matters` |\r\n| Adversarial verify / Perspective-diverse / Completeness critic / No silent caps | Workflow 도구 `Quality patterns` — **항목명까지 1:1** |\r\n| 침묵은 성공이 아니다 | Monitor 도구 — `Coverage — silence is not success`, 자문 문장까지 동일 |\r\n| 정직 보고 · 완료 판정 · 삭제 전 확인 | 시스템 프롬프트 `Delivering work` 절 |\r\n\r\n### 발견 2 — 레지스트리가 이미 알고 있었는데 조치가 밀려 있었다\r\n\r\n`capability-assumptions.json` 의 `native-todowrite-background` 행은 **2026-06-06 에 \"Monitor 에이전트는 순수 오버헤드\"** 라고 판정해 두었다. 그럼에도 v3.25(7월)는 Monitor 를 제거하는 대신 5분 보고 규칙을 *강화*했다.\r\n\r\n**이것이 이번 감사의 가장 중요한 교훈이다** — 감사가 판정을 내려도 코드에 반영되지 않으면 아무 일도 일어나지 않는다. 레지스트리에 `acted_v3.29` 필드를 추가해 판정과 조치를 같은 행에서 추적하게 했다.\r\n\r\n### 발견 3 — Karpathy Rule 1 이 하네스와 반대 방향이었다\r\n\r\nRule 1 은 *\"불확실하면 묻는다\"*, 하네스는 *\"루틴한 판단은 스스로 내리고 blocking question 은 아껴라\"*. Rule 1 전문이 스킬 12곳에 복붙돼 있어 가중치가 되묻기 쪽으로 기울어 있었고, 사용자의 다른 룰(`feedback_try_first`)과도 충돌했다. `harness-rules.md` §4.5 에 충돌 심사로 기록하고 **하네스 우선**으로 판정했다 — 단, \"가정을 드러내라\"는 Rule 1 의 취지는 *질문*이 아니라 *계획서의 가정·미해결 질문 섹션*으로 배출한다.\r\n\r\n### 발견 4 (부수) — 슬래시 OVERRIDE 가 죽어 있었다\r\n\r\n`scripts/user-prompt-handler.js` 는 `autoRecommend === false` 일 때 1번째 분기에서 즉시 반환했다. 그런데 그 아래에 **슬래시 명령 OVERRIDE**(사용자가 `/cp` 라고 치면 되묻지 않고 즉시 Skill 도구를 때리게 하는 강제)가 있었다. `autoRecommend` 는 v3.13 부터 기본 `false` 였으므로, **그 이후 이 OVERRIDE 는 한 번도 실행된 적이 없다.** 핸들러를 OVERRIDE 전용으로 재작성하며 복구했고, 실측으로 확인했다.\r\n\r\n## 🛠 What was done\r\n\r\n### 삭제\r\n\r\n| 대상 | 위치 | 대체 |\r\n|------|------|------|\r\n| `/c` 스킬 (777줄) | `skills/c/` | 하네스 본체 + TodoWrite |\r\n| `/ccp` 스킬 (228줄) | `skills/ccp/` | `/code-review`(+`ultra`) · `/security-review` · `/cc` P6 QA |\r\n| 전담 Monitor 에이전트 | `/cc` P3.1 강제 배포 | 하네스 자동 재호출 + TodoWrite |\r\n| 오케스트레이션 규율 6항목 | `/cc` P3.0 | Agent·Workflow 도구 설명 |\r\n| QA 패턴 4항목 | `/ccp` 하네스 절 | Workflow Quality patterns |\r\n| 워커 \"작업 규율\" 8줄 | `/cc` 워커 프롬프트 | 시스템 프롬프트 (Leader 향 보고 계약 2줄만 존치) |\r\n| Karpathy 4규칙 전문 ×12 | 8개 스킬 | `~/.claude/CLAUDE.md` (워커 프롬프트 1곳만 존치) |\r\n| 스킬 인벤토리 표 주입 | SessionStart 훅 | 호스트 스킬 목록 |\r\n| Lens Suggestion Line | SessionStart 훅 | 네이티브 auto-discovery |\r\n| 키워드 추천기 · 플러그인 레지스트리 | `lib/keyword-matcher.js` · `lib/plugin-registry.js` · `.lens-cache.json` | 네이티브 semantic auto-discovery |\r\n| 죽은 설정 4개 | `lens.config.json` (`autoRecommend`·`showReport`·`minMatchScore`·`customKeywords`) | — |\r\n| 유령 경로 `skills/cpp/` | `scripts/bump-version.sh` 검증 목록 | v3.25 삭제분이 스크립트에만 남아 있었음 |\r\n\r\n### 신설·개정\r\n\r\n- `harness-rules.md` §2 에 `[네이티브]`/`[Lens]` 표시 도입, §C·§D 를 \"네이티브 위치 색인\"으로 전환\r\n- `harness-rules.md` §1 — 재복붙 예외 3개 → **2개**. 예외 3(\"자주 위반되는 규칙의 3중 반복\")은 additive-only 를 무력화하는 만능 우회로여서 폐지. 예외 1 의 전제가 미검증임을 명시\r\n- `harness-rules.md` §4.5 (Rule 1 ↔ 되묻기 충돌) · §4.6 (Monitor 폐지) · §5 (걷어낸 것 전량 추적표) 신설\r\n- `capability-assumptions.json` — `native-work-discipline` · `native-code-review` 행 신설, `acted_v3.29` 필드 도입, `last_full_audit` 2026-06-05 → 2026-08-07\r\n- `user-prompt-handler.js` OVERRIDE 전용 재작성 (발견 4 수정)\r\n\r\n## ✅ Review — 검증\r\n\r\n| 목표가 됐다는 신호 | 확인 방법 | 통과 판정 | 종류 | 결과 |\r\n|---|---|---|---|---|\r\n| 스킬 9개만 남음 | `ls skills/ \\| wc -l` | `9` | auto | ✅ 9 |\r\n| SessionStart 주입이 대폭 축소 | `node hooks/session-start.js \\| wc -c` | 4,804B → 1,000B 미만 | auto | ✅ **603B** (additionalContext 147자) |\r\n| 슬래시 OVERRIDE 동작 | `CLAUDE_USER_MESSAGE='/cp deep x' node scripts/user-prompt-handler.js` | OVERRIDE 문자열 출력 | auto | ✅ 확인 |\r\n| 비-슬래시는 무음 | 같은 스크립트에 일반 문장 | `{\"systemMessage\":\"\"}` | auto | ✅ 확인 |\r\n| 레지스트리 JSON 유효 + 경로 실재 | `node -e` 파싱 + `fs.existsSync` 전수 | 파싱 OK, 드리프트 0 | auto | ✅ 13행 / 드리프트 0 |\r\n| 4규칙 **전문 블록**이 1곳만 남음 | `grep -c '### 2. Simplicity First' skills/*/SKILL.md` | 총 1건, 위치는 `/cc` 워커 dispatch | auto | ✅ **1건** (`skills/cc/SKILL.md:405`). 나머지 스킬의 `Think Before Coding` 언급은 전부 1줄 포인터 |\r\n| 버전 문자열 일관 | `bash scripts/bump-version.sh` stale 검사 | 잔여는 전부 히스토리 표기 | auto | ✅ 확인 |\r\n\r\n## 🚧 비목표 (이번에 하지 않은 것)\r\n\r\n- **agentmemory 정리** — 초기 감사에서 네이티브 파일 메모리와 중복이라고 제안했으나, **사용자가 멀티머신 용도로 유지를 지시**했다. 네이티브 파일 메모리는 머신 로컬이고 agentmemory 는 Mac Mini 중앙 서버를 통해 여러 머신이 공유한다 — 겹치는 것은 표면뿐이다. 유지.\r\n- **ui-ux-pro-max 중복 파일** — 벤더 플러그인 내부(`.claude/skills` ↔ `cli/assets/skills` 동일 내용 2벌)라 이 저장소 범위 밖. 보고만.\r\n- **`/cc` 팬아웃 엔진 자체** — Dynamic Workflows 가 대체 후보이나 plan-tier 게이트(Max/Team)가 있어 비-Max 세션에선 `/cc` 가 유일 경로. 존치.\r\n- **codex 이종검증** — 네이티브 워커는 전부 Anthropic 계열이라 대체 불가. 존치.\r\n\r\n## ⚠️ 리스크\r\n\r\n| # | 리스크 | 트리거 | 완화 |\r\n|---|------|--------|------|\r\n| R1 | 진행보고 누락 증가 | Monitor 폐지 후 본체가 침묵 | 회귀 감시(§4.6). 재발 시 폴링 에이전트가 아니라 **네이티브 Monitor 도구** 기반으로 복구 |\r\n| R2 | 워커 규율 이완 | 서브에이전트가 시스템 프롬프트를 못 받는 경우 | 전제 자체가 미검증이므로 §1 에 명시. 실측 결함이 관측되면 그때 복구 |\r\n| R3 | `/ccp` 상실로 실행 증명 누락 | `/cc` P6 QA 가 얕아지면 | P6 QA 는 auto 행 명령을 직접 실행하도록 이미 강제. 얕아지면 `native-code-review` 행 재검토 |\r\n| R4 | `/c` 사용자 습관 | 기존 `/c` 타이핑 | 슬래시 OVERRIDE 가 미설치 스킬엔 반응하지 않음. `/cc`·`/cp` 로 안내 |\r\n\r\n## 📊 결과 수치\r\n\r\n- 스킬: **11개 → 9개**\r\n- `/cc` SKILL.md: **1,078줄 → 993줄**\r\n- 삭제된 스킬 본문: `/c` 777줄 + `/ccp` 228줄\r\n- SessionStart 훅 출력: **4,804B → 603B** (주입 컨텍스트 147자)\r\n- 삭제된 lib: 2개 파일 + 캐시 1개\r\n- 죽은 설정 키: 4개\r\n- 복구된 버그: 1건 (슬래시 OVERRIDE)\r\n\r\n## 관련 문서\r\n\r\n- `docs/rules/harness-rules.md` — §1 additive-only · §2 인벤토리 · §4.5 되묻기 충돌 · §4.6 Monitor 폐지 · §5 걷어낸 것 추적표\r\n- `docs/rules/capability-assumptions.json` — `acted_v3.29` 필드로 판정↔조치 추적\r\n- `CHANGELOG.md` — v3.29.0\r\n","truncated":false,"stale":false,"branch":null,"base":null},{"id":"2026-07-30-cu-multi-source-autoupdate","folder":"history","title":"/cu 고도화 — 다중 소스 전수 스캔 + 무확인 자동 업데이트 — 완료","date":"2026-07-30","hasMd":true,"hasHtml":true,"mdPath":"history/2026-07-30-cu-multi-source-autoupdate.md","htmlPath":"history/2026-07-30-cu-multi-source-autoupdate.html","mdInline":"# /cu 고도화 — 다중 소스 전수 스캔 + 무확인 자동 업데이트 — 완료\r\n\r\n**완료일**: 2026-07-30\r\n**출시**: v3.26.0 (커밋 `c4b7237` + `fcd3bc5`, 태그 `v3.26.0`)\r\n\r\n## 요약\r\n\r\n`/cu` 를 \"아는 도구 3개 확인기\"에서 **이 머신의 업데이트 관제**로 바꿨다. 도구 이름을 손으로 적어두던 방식을 버리고 패키지 매니저 7종(winget·npm-global·vscode-ext·claude-plugin·cli-special·pip-global·brew)이 스스로 열거하게 했고, 매 실행마다 뜨던 확인 게이트를 제거해 `auto` 등급을 묻지 않고 실행한다. 되돌리기 어려운 것은 `hold`/`never` 로 분리했다.\r\n\r\n**착수 근거는 실측이었다** — `/cu` 가 업데이트 대기 **25건 중 0건**을 보고하고 있었다. winget 설치 143개 중 19개, npm 글로벌 8개 중 6개가 낡은 채였고 VS Code 확장 40여 개는 목록에 존재조차 없었다. 못 찾은 게 아니라 **찾지 않았다**: `cu.py` 가 함수 3개(claude·codex·gh)를 하드코딩으로 부르는 구조라 목록에 없는 도구는 영원히 안 보였다. 여기에 플러그인 버전 **오탐 2건**(최신인데 \"업데이트 있음\")까지 겹쳐 표 전체가 신뢰를 잃은 상태였다.\r\n\r\n## 주요 결정 사항\r\n\r\n- **소스 단위 열거로 전환** — CLI 하나당 함수 하나를 쓰는 구조를 버렸다. 패키지 매니저가 이미 전체 목록을 알고 있으므로 그쪽에 물어본다. 결과적으로 새 도구를 깔면 코드 수정 없이 목록에 편입되고, `cli:codex`·`cli:gh` 전용 스캐너는 삭제됐다(각각 npm·winget 이 잡는다).\r\n- **확인 게이트 제거는 정책으로 구현** — 질문을 없애되 판단은 남겼다. 매번 묻는 대신 위험도를 미리 정해두고 안전한 것만 실행한다.\r\n- **`never` 3단계를 신설** (Pre-mortem P1) — 처음 설계는 2단계(`auto`/`hold`)에 `/cu all` 이 hold 전량을 실행하는 것이었다. 그런데 hold 에 PostgreSQL 이 있어 **`/cu all` 오타 한 번으로 DB 마이그레이션이 일어난다.** \"사용자가 `all` 을 타이핑했으니 승인\"이라는 논리는 되돌릴 수 없는 손실을 정당화하지 못하므로, `/cu all` 로도 실행되지 않는 층을 뒀다.\r\n- **`never` 를 문서가 아니라 코드로 강제** — 이것이 이번 작업의 가장 중요한 수정이다. 상세는 아래 \"검증\" 참조.\r\n- **정책을 파일 상단 상수 한 블록에 집결** — `HOLD_KEYWORDS`/`NEVER_KEYWORDS`/`NEVER_WINGET_IDS`/`SPECIAL_DEDUP`. 조건이 코드 곳곳에 흩어지면 \"왜 이게 hold 인가\"를 추적할 수 없다.\r\n- **판단 불가는 항상 보수적으로** — 버전 파싱 실패, 형태 불일치, 미지의 mode 값은 전부 안전한 쪽(hold / `None` / auto 제외)으로 떨어뜨렸다.\r\n- **위험도를 설정 파일로 빼지 않았다** — 요청하지 않은 설정 가능성이고, 파일이 없을 때·깨졌을 때 처리가 붙는다. 조정이 필요해지면 그때 뺀다.\r\n- **LLM 에게 위험도 판단을 위임하지 않았다** — 실행 정책은 결정적이어야 한다. 인증·네트워크·모델 변경으로 정책이 흔들리고 \"왜 이게 올라갔나\"를 재현할 수 없다.\r\n- **fixture 는 실캡처만** — 손으로 쓰면 컬럼 폭이 실물과 어긋나 \"테스트는 통과하는데 파서는 깨지는\" 최악의 조합이 된다.\r\n\r\n## 변경 파일\r\n\r\n**구현**\r\n\r\n- `scripts/cu.py` — 497줄 → 약 900줄. 소스 스캐너 7종 + 계약 함수 6개(`parse_winget_upgrade`·`compare_versions`·`is_major_jump`·`classify_risk`·`dedup_items`·`upgrade_targets`) + `never_reason` 실행 경계 게이트 + 정책 상수 블록 + 사전 스냅샷\r\n- `scripts/cu.test.py` (신규) — 단위 테스트 68개\r\n- `tests/fixtures/winget-upgrade.txt` (신규) — 실제 `winget upgrade` 출력 캡처\r\n- `tests/fixtures/winget-cjk-rows.txt` (신규) — 실제 한글 패키지명 행 캡처\r\n- `tests/fixtures/npm-outdated.json` (신규) — 실제 `npm outdated -g --json` 캡처\r\n\r\n**문서**\r\n\r\n- `skills/cu/SKILL.md` — 절차 전면 재작성(확인 게이트 제거·3모드·3단 위험도표·실행 전 예고·재스캔 규칙 교체·`source_errors` 보고 의무·승격 일괄 명령)\r\n- `README.md` — `/cu` 절 갱신 (파괴적 변경 고지 포함)\r\n- `CHANGELOG.md` — v3.26.0 항목\r\n- `docs/tasks/2026-07-30-cu-multi-source-autoupdate.md` + `.html` — 계획서 (이 history 로 이관)\r\n\r\n**릴리즈 부수 변경** — `.claude-plugin/marketplace.json`·`plugin.json`, `CLAUDE.md`, `hooks/hooks.json`, `hooks/session-start.js`, `skills/{c,cc,ccp,ci,cp,cs}/SKILL.md` (버전 문자열 44곳), `docs/board_creeta-lens.html`\r\n\r\n## 테스트 & 검증\r\n\r\n**단위 테스트**: `python scripts/cu.test.py` → **68/68 passed, exit 0**\r\n\r\n**실측 검증** (레포의 `scripts/cu.sh` 직접 호출)\r\n\r\n| 목표 | 결과 |\r\n|---|---|\r\n| 종류를 가리지 않고 한 목록 | 소스 6종 **34항목** (winget 19·plugin 6·npm 6·cli 1·vscode 1·pip 1), 중복 0, `source_errors` 없음. 개편 전 9~10항목 |\r\n| 고르지 않아도 최신으로 | **auto 9건 실제 업그레이드** (winget 5 + npm 4). 업그레이드 중 확인 질문 0회. 재스캔에서 34 → 25항목 |\r\n| 되돌리기 어려운 것은 미실행 | hold 14 · never 3 **버전 전부 불변** — PostgreSQL 18.4-1 · Node 24.15.0 · Python 3.13.13 · VCRedist 14.44.35211.0 · AppInstaller 1.29.279.0 · railway 4.65.0 · shopify 3.94.3 |\r\n| 플러그인 버전 정확 | 오탐 2건 해소(agentmemory `0.9.28→0.9.28 False`, insane-search `0.13.0→0.13.0 False`), ❓2건 판정 성립(context7·playwright SHA 대 SHA) |\r\n\r\n`bash scripts/cu.sh upgrade winget:PostgreSQL.PostgreSQL.18` → **실행 없이 exit 3 거부**, PostgreSQL `18.4-1` 유지.\r\n\r\n**더블 게이트가 결함 14건을 잡았다.** Codex(2라운드) + Supervisor 가 검토했고, 1라운드는 양쪽 모두 **fail** 이었다.\r\n\r\n가장 중요한 지적은 두 리뷰어가 **독립적으로 같은 것**을 짚은 것이다 — `never` 등급이 **문서로만 막혀 있고 코드로는 열려 있었다.** `upgrade_targets()` 가 never 를 제외하도록 설계했지만 **실행 흐름은 그 함수를 경유하지 않는다**(에이전트가 스캔 JSON 을 읽고 `cu.sh upgrade <id>` 를 개별 호출). 즉 `upgrade_targets` 는 테스트에서만 불리는 죽은 방어선이었고, 에이전트가 판단을 한 번 틀리면 DB 가 올라갔다. 실행 경계(`cmd_upgrade`)에 `never_reason()` 게이트를 넣어 해소했다.\r\n\r\n**실행해보지 않으면 못 잡을 함정 3건**\r\n\r\n- **winget HRESULT 마스킹** — Python `subprocess` 는 32비트 원값(`0x8A15002B` = 2316632107)을 받지만 셸은 하위 1바이트(43)만 보여준다. 셸에서 잰 값을 상수로 쓰면 Python 경로에서 하나도 안 맞는다. 실제로 이 함정에 빠졌다가 실측으로 발견했다. 양쪽 표현을 모두 인정하고, winget 원시 코드를 종료코드 규약(0/1/2/3)으로 사상해 해석 불가한 값이 새어 나가지 않게 했다.\r\n- **소스 일시 장애** — msstore REST API 오류(`0x8A15003B`)로 winget 5건이 전부 실패했고, 같은 명령 재시도로 통과했다. 한 번의 일시 장애로 그날의 자동 갱신이 통째로 날아가지 않도록 재시도 1회를 넣었다.\r\n- **CJK 표시폭** — winget 은 표시 폭으로 컬럼을 정렬하므로 한글 이름 행은 문자 인덱스가 어긋난다. 이 머신 출력에 실제로 한글 패키지명(`AVC 인코더 비디오 확장`)이 있어 가설이 아닌 라이브 경로였다.\r\n\r\n**그 외 수정된 결함**: `upgrade_targets` fail-open(`mode != \"default\"` 라 오타가 hold 를 해제) · 최신 항목까지 매번 재설치 · `/cu scan` 이 실제로 업그레이드 실행 · 소스 실패 시 \"모두 최신\" 종료 · 사후 재스캔이 사전 스냅샷 파괴 · winget 실패가 소스를 조용히 삭제 · 비영어 로케일 0건 · 드라이버 복합어 누락 · `/cu all` UAC 무한 대기 · README 계약 불일치 · stderr 한글 mojibake.\r\n\r\n## 추가 사항\r\n\r\n**⚠️ 출시됐지만 이 머신에서 활성이 아니다.** 활성 플러그인 캐시는 `~/.claude/plugins/cache/CreetaCorp/lens/3.25.0` 이고 거기의 `cu.py` 는 구버전이다(계약 함수 0/3). `/cu` 를 치면 여전히 옛 스캐너가 돈다. 활성화: `/lens-upgrade` → **Claude Code 완전 재시작**. 이번 검증은 전부 레포의 `scripts/cu.sh` 를 직접 호출해 수행했다.\r\n\r\n**승격 커버리지 한계.** 비승격 셸에서는 winget 19건 중 auto 가 **5건뿐**이다. Git 2.54→2.55 · AWS CLI · Tailscale · WeChat · QMK Toolbox · Futuremark 6건은 위험해서가 아니라 **권한 때문에** hold 로 갔다. 관리자 권한 세션에서는 auto 가 된다. `SKILL.md` 가 PowerShell `foreach` 루프 한 줄을 제시하도록 해뒀다 — winget 은 `--id` 중복을 거부하므로(exit 2) 단일 명령으로는 묶을 수 없다.\r\n\r\n**context7·playwright 는 재시작 대기 상태.** `claude plugin update` 가 `refreshed from source. Restart to apply changes.` 로 응답했고, 재시작 전까지 레지스트리 SHA 가 안 바뀌므로 `/cu` 가 계속 대기로 표시한다 — 실패가 아니라 정직한 상태다.\r\n\r\n**후속 (이번 범위 밖)**\r\n\r\n- **Mac Mini(brew) 실측** — `brew` 스캐너는 자리를 만들었으나 Windows 에서만 검증했다.\r\n- **`lib/install-sync.js` 일관성** — 조사 결과 그쪽은 설치 유무만 대조하고 최신 버전 해석 로직이 아예 없어 이번 규칙과 충돌하지 않는다. 후속 태스크 불필요로 판정.\r\n\r\n**되먹임으로 남길 것**\r\n\r\n- **계획 단계에서 파일 단위 충돌을 태스크 분할에 반영해야 한다.** T1~T5 를 병렬 태스크로 쪼갰지만 전부 같은 `cu.py` 를 수정하므로 실제로는 직렬화가 강제됐다. Pre-mortem 이 T3·T4 만 지적했는데 실은 T1~T5 전체가 같은 문제였다.\r\n- **mtime 부재는 에이전트 사망 근거가 못 된다.** 배포 8분 시점에 산출물이 없다는 이유로 \"Worker 3개 사망\"으로 판단하고 직접 실행 전환을 선언했으나 오판이었다 — 세 Worker 모두 정상 동작했다(212·294·854초 완료). 대형 계획서를 읽는 동안은 산출물이 없는 것이 정상이며, 생존 판정 기준은 완료 알림이어야 한다.\r\n- **실행 지표**: 추가 질문 0회(승인 게이트 2회는 스킬 규정 절차라 제외) · 편차 15건 · 게이트 통과(구조 `valid:true`, 차단 질문 0, 우회 없음)\r\n","truncated":false,"stale":true,"branch":null,"base":null},{"id":"2026-07-20-lens-plan-engine-overhaul","folder":"history","title":"Lens 계획 엔진 개편 — 기획서 품질 게이트 · 모델 배분 통제 · /cs PR 전환 · /cpp 정리 — 완료","date":"2026-07-20","hasMd":true,"hasHtml":true,"mdPath":"history/2026-07-20-lens-plan-engine-overhaul.md","htmlPath":"history/2026-07-20-lens-plan-engine-overhaul.html","mdInline":"# Lens 계획 엔진 개편 — 기획서 품질 게이트 · 모델 배분 통제 · /cs PR 전환 · /cpp 정리 — 완료\r\n\r\n**완료일**: 2026-07-30 (실행 완료: 2026-07-20)\r\n**출시**: v3.25.0 (커밋 `ea7c693`·`b9530df`·`eb3abed`·`7c47263`·`5cbf645`, 태그 `v3.25.0`)\r\n\r\n> 이 기록은 계획서 `docs/tasks/2026-07-20-lens-plan-engine-overhaul.md` 의 본문·진행상황·편차 기록에서 추출해 작성했다. 실행은 2026-07-20 세션에서 이뤄졌고, history 이관만 2026-07-30 에 했다.\r\n\r\n## 요약\r\n\r\n계획 엔진을 네 갈래로 개편했다. **세 문제의 뿌리가 하나였다 — 정책은 산문으로 선언되고 강제하는 코드가 없었다.**\r\n\r\n1. **기획서 골격** — 비목표·검토된 대안·DO NOT CHANGE·리스크 레지스터·미해결 질문을 필수 섹션으로 추가하고, 등급을 분량이 아니라 **위험도**로 정하게 바꿨다.\r\n2. **실행 진입 게이트** — 얕은 계획으로는 `/c`·`/cc` 가 실행을 거부한다. 검사를 **작성 시점이 아니라 실행 시점**에 뒀다.\r\n3. **모델 배분 통제** — 상속 폐기(모든 spawn 이 모델 명시), 연쇄 승격 폐기(위험도 기반), TOP 상한 도입, 훅 계측 추가.\r\n4. **`/cs` PR-only** — 기본 브랜치 직접 push 폐지.\r\n5. **`/cpp` 폐지** — `/cp deep` 등급으로 흡수.\r\n\r\n착수 근거: 산출물 **80건 전수조사** 결과 NFR·인수기준·미결질문·테스트케이스가 **0/80**, 필수라고 선언된 섹션조차 존재율 **28%**. 업계 표준 리서치(PRD·Google DD·RFC·KEP·ADR·PR/FAQ·Spec Kit·Kiro·EARS·ISO 25010) + Codex 교차 협의 + 적대적 검증 2건으로 설계를 굳혔다.\r\n\r\n## 주요 결정 사항\r\n\r\n- **검사를 실행 시점으로 이동** — 작성 시점 검사는 우회 경로가 많다(다른 쓰기 경로·파일 없는 계획·외부 수정·과거 버전 문서). 실행 진입은 우회할 수 없으므로 레거시 문서까지 자동 커버되고 소급 정리가 불필요해진다.\r\n- **등급은 위험도로 정한다** — 줄 수·페이지 수로 등급을 정하면 길이가 품질의 대리값이 되어 내용 없는 문서가 길이만으로 통과한다. 기준은 \"되돌리기 얼마나 어려운가\".\r\n- **`/cs` auto-merge → PR-only 로 축소** — 당초 사용자 선택은 \"PR + 자동 머지\"였으나 Codex 협의에서 *\"auto-merge 가 즉시 실행되면 PR 은 검토 단계가 아니라 기록용 포장\"* 이라는 반박이 나와 사용자 재확인 후 축소했다. auto-merge 는 비목표로 분리.\r\n- **PR 흐름의 순서가 핵심** — **커밋 전에** 브랜치를 만든다. 기본 브랜치에 먼저 커밋하고 그 브랜치를 push 한 뒤 PR 을 만들면 비교할 변경이 남지 않아 PR 자체가 불가능하다.\r\n- **fail-closed** — `gh` 부재·PR 실패 시 기본 브랜치 직접 push 로 우회하지 않는다. 우회하면 사용자가 요구한 \"PR 보장\"이 조용히 무너진다.\r\n- **모델 상속 폐기** — 지정을 생략하면 훅이 실제 실행 모델을 관측할 수 없어(`tool_input.model` = undefined) 계측에 구멍이 생기고, 세션이 최상위 모델일 때 **모든 Hard 역할이 자동으로 최상위를 먹는다**(실측된 과소비 원인). 명시하면 기록되고, 기록되면 통제된다.\r\n- **연쇄 승격 폐기** — 종전 규칙은 \"TOP worker 가 하나라도 있으면 Supervisor·QA 도 TOP\"이었다. Hard 1개 + Easy 3개인 실행에서도 최상위 모델 2개가 추가로 붙었다. 리뷰 깊이가 실제로 필요한 것은 \"worker 가 똑똑했을 때\"가 아니라 **\"틀렸을 때 손해가 클 때\"** 다 — 기준을 티어 대칭에서 위험도로 옮겼다.\r\n- **미해결 질문은 \"차단만 0\"** — 전량 0 을 기계적으로 강제하면 모델이 불확실성을 드러내는 대신 **임의 가정을 확정처럼 기록**한다. 질문 은폐를 유도하는 역효과라 비차단 질문은 가정·확인시점과 함께 남기게 했다.\r\n- **`/cpp` 통합 순서 재배치** — 적대적 검증 2건이 \"품질 문제 해결 전 인터페이스 변경\"이라며 보류를 권고했다. 폐지 자체는 사용자 결정대로 진행하되 **골격 통일 이후로 순서를 옮겨** 위험을 해소했다.\r\n- **deep 본문 분리(`deep.md`) 기각** — 파일 비대화 방지 목적이었으나 정책은 인라인에 남겨야 하므로 오히려 커진다는 반박이 성립. 통합으로 중복이 소멸해(-154줄) 애초에 문제가 아니었음이 확인됐다.\r\n\r\n## 변경 파일\r\n\r\n**규칙 (SoT)** — `docs/rules/harness-rules.md`(§4.1 재개정 + §4.4 진행보고 규약 신설), `docs/rules/codex-integration.md`(타임아웃 규모 분기), `docs/rules/live-research.md`, `docs/rules/release-guide.md`, `docs/rules/capability-assumptions.json`\r\n\r\n**코드** — `lib/plan-manager.js`(`validatePlanStructure` 를 현행 골격으로 갱신 + **실제 배선** — 그전까지 런타임 호출자가 0개였다), `hooks/pre-tool-task.js`·`lib/agent-tracker.js`(모델 계측 신설), `scripts/git-sync-all.sh`(PR-only 흐름), `scripts/bump-version.sh`(12파일 기준 정정)\r\n\r\n**스킬** — `skills/cp/SKILL.md`(+282줄, deep 흡수), `skills/cs/SKILL.md`, `skills/cc/SKILL.md`, `skills/c/SKILL.md`, `skills/ccp/SKILL.md`, `skills/ci/SKILL.md`, **`skills/cpp/SKILL.md` 삭제**(-307줄)\r\n\r\n**기타** — `templates/report-conversion-spec.md`, `docs/START_HERE.md`, `CHANGELOG.md`, `CLAUDE.md`, `docs/board_creeta-lens.html`\r\n\r\n합산 26파일, +693 / -448.\r\n\r\n## 테스트 & 검증\r\n\r\n**패키지 1 (모델 정책)** — 검증 6/6 pass. 모델 계측 실행 검증에서 `model=haiku` 기록 확인, 상속 잔존 0건.\r\n\r\n**패키지 2 (골격 + 게이트)** — `validatePlanStructure(deep)` 가 이 계획서 자체에 대해 `valid:true`. 즉 개편된 게이트가 개편 산출물로 자기 검증됐다.\r\n\r\n**패키지 3 (`/cs` PR-only)** — 로컬 테스트 레포로 핵심 함정을 실측 검증:\r\n\r\n| 검증 | 결과 |\r\n|---|---|\r\n| 커밋 전 브랜치 분기 | ✓ |\r\n| 기본 브랜치 직접 커밋 | 0건 ✓ |\r\n| `master == origin/master` (divergence 없음) | ✓ |\r\n| PR 실패 시 직접 push 우회 안 함 (fail-closed) | ✓ |\r\n\r\n**패키지 4 (릴리즈)** — v3.25.0 버전 반영 13/13 확인.\r\n\r\n**Codex 교차 협의** — 재시도로 성공. `/cpp` 통합 적대적 검증 2건 수행.\r\n\r\n## 추가 사항\r\n\r\n**유실 1건 — 복구하지 않고 폐기.** 설계 워크플로(3축×3렌즈) 오케스트레이션이 사망했다(`journal.jsonl` 미생성). 복구 대신 폐기를 택했고 Codex 협의가 커버 범위를 대체했다. **이 실패가 진행보고 규약 강화의 직접 원인이다** — 기존 v3.16 규칙이 Workflow 도구를 누락하고 생존 확인을 요구하지 않아 \"조용한 사망\"을 못 잡았다. `harness-rules.md` §4.4 를 SoT 로 신설하고 6개 스킬에 인라인해, **생존 확인 의무(추측 금지)·끝난 것/남은 것·부분 산출물 선공개** 3항을 필수로 만들었다. \"아직입니다\"만 적는 보고는 위반이다.\r\n\r\n**계획에 없던 작업 1건** — `skills/cpp/SKILL.md` 삭제로 릴리스 스크립트가 깨져 `bump-version.sh` 를 12파일 기준으로 정정해야 했다.\r\n\r\n**타임아웃 규칙 개정** — 실측 실패 2건(2026-07-15 대형 diff 리뷰, 2026-07-20 계획엔진 협의)이 모두 180초 상한에 걸려 죽었고, `-o` 부분 수거가 불가능함(0바이트)이 확인됐다. 두 사례 모두 \"작업이 클수록 교차검증이 사라지는\" 방향이라, 하드게이트가 가장 필요한 순간에 정확히 무력화됐다. 깊이만 규모에 맞추고 시간을 안 맞춘 것이 설계 결함이었다 — 규모 분기(180/300/600초) + 대규모 background 필수로 개정했다.\r\n\r\n**되먹임 고리 신설** — 핸드오프에 NON_GOALS·DO_NOT_CHANGE·REJECTED_ALTERNATIVES·BLOCKING_QUESTIONS·GRADE 를 추가하고 **worker 프롬프트에 실제 주입**하게 했다. 계획서에 적어놓고 실행자에게 넘기지 않으면 그 판단은 버려진다 — DO NOT CHANGE 가 없으면 worker 가 무관한 코드를 \"개선\"하고, 비목표가 없으면 범위를 넘고, 기각된 대안이 없으면 이미 버린 접근을 다시 시도한다. 여기에 편차 기록(계획↔실제)과 실행 지표(추가 질문 수·편차 건수)를 더해 `/cp → /cc → ???` 로 끊겨 있던 고리를 닫았다.\r\n\r\n**실행 지표** — 추가 질문 6회(등급 호출 방식 · `/cs` PR 방식 · fable 기준 정의 · `/cpp` 유지 여부 · 진행보고 · 승인) · 편차 5건 · 게이트 통과.\r\n\r\n**후속 확인 사항** — 계획서 진행상황의 \"현재 상태\" 줄이 `패키지 1 완료 — 패키지 2 착수 대기` 로 stale 하게 남아 있었다(이후 줄들과 v3.25.0 출시가 전량 완료를 확인). 진행상황은 최신 줄만 갱신하지 말고 요약 줄도 함께 고쳐야 한다.\r\n","truncated":false,"stale":true,"branch":null,"base":null},{"id":"2026-07-15-dynamic-top-model-policy","folder":"history","title":"Lens 모델 정책 전환 — 고정 모델명 폐지, 난이도 사다리 자동 추종 — 완료","date":"2026-07-15","hasMd":true,"hasHtml":true,"mdPath":"history/2026-07-15-dynamic-top-model-policy.md","htmlPath":"history/2026-07-15-dynamic-top-model-policy.html","mdInline":"# Lens 모델 정책 전환 — 고정 모델명 폐지, 난이도 사다리 자동 추종 — 완료\r\n\r\n**완료일**: 2026-07-30 (실행 완료: 2026-07-15)\r\n**출시**: v3.24.0 (커밋 `9fd7182`, 태그 `v3.24.0`)\r\n\r\n> 이 기록은 계획서 `docs/tasks/2026-07-15-dynamic-top-model-policy.md` 의 본문·진행상황에서 추출해 작성했다. 실행은 2026-07-15 세션에서 이뤄졌고, history 이관만 2026-07-30 에 했다.\r\n\r\n## 요약\r\n\r\nLens 지시문에 못박혀 있던 고정 모델명(`opus`·`gpt-5.5`)을 지우고 **업무 난이도에 맞는 모델 사다리**로 교체했다. Easy=경량 티어 / Medium=중간 티어 / Hard=최상위 티어(TOP)로 배분하고, 각 칸이 **모델 세대와 함께 자동으로 올라가게** 했다 — 새 모델이 나와도 사람이 문서를 고치지 않는다.\r\n\r\ncodex 축은 `~/.codex/models_cache.json` 순위표에서 **1등을 매 호출 직전 동적 선택**하는 resolver 로 바꿨다. 특정 모델명을 문서에 못박지 않고, 사용자가 데스크톱 앱에서 바꾼 config 기본값에도 의존하지 않는다.\r\n\r\n착수 근거: Lens 의 모든 품질 검증이 당시 순위표 **7위** 모델(gpt-5.5)로 돌고 있었고, Claude 쪽 최고 난이도 자리도 한 세대 전(opus)에 고정돼 있었다.\r\n\r\n## 주요 결정 사항\r\n\r\n- **\"최고 모델 무차별 배정\"을 기각하고 난이도 배분으로 재설계** — 사용자 정정(2026-07-15 Modify)이 결정적이었다. 초안은 Claude 축을 \"전 역할 TOP\"으로 잡았으나, 원칙은 **난이도별 배분**이고 사다리의 각 칸이 자동 상승하는 것이 이 작업의 본질이라는 지적을 반영했다. 이로써 `/cc` 의 v3.11 \"전부 opus (품질 우선·비용 비고려)\" 철학이 공식 폐기되고 `/c` 와 사다리가 통일됐다.\r\n- **사다리의 칸은 이름이 아니라 상대 위치** — `haiku`/`sonnet`/`fable` 를 적는 대신 \"경량 티어 / 중간 티어 / enum 최상위\"로 정의했다. enum 이 갱신되면 사다리가 따라 올라간다.\r\n- **codex 는 순위표 1등 동적 선택, 난이도는 별도 다이얼** — 모델 선택과 추론 깊이(`xhigh`/`high`)를 분리했다.\r\n- **조용한 강등 금지** — resolver 가 실패해 낮은 모델로 떨어지면 결과물에 ⚠️ 플래그를 남기도록 의무화했다. 빈 값이 `-m \"\"` 으로 새어 조용히 기본 모델로 실행되는 경로를 인자 배열 분기로 원천 차단했다.\r\n\r\n## 변경 파일\r\n\r\n**규칙 (SoT)** — `docs/rules/codex-integration.md`(§4 resolver 강화판), `docs/rules/harness-rules.md`, `docs/rules/capability-assumptions.json`\r\n\r\n**스킬 5종** — `skills/c/SKILL.md`, `skills/cc/SKILL.md`(P4.5 resolver 인라인 — Supervisor 지적 반영), `skills/ccp/SKILL.md`, `skills/ci/SKILL.md`, `skills/cp/SKILL.md`\r\n\r\n**릴리즈** — `.claude-plugin/marketplace.json`·`plugin.json`, `CHANGELOG.md`, `CLAUDE.md`, `README.md`, `hooks/hooks.json`, `hooks/session-start.js`, `docs/board_creeta-lens.html`\r\n\r\n**계획서** — `docs/tasks/2026-07-15-dynamic-top-model-policy.md` + `.html` (이 history 로 이관)\r\n\r\n## 테스트 & 검증\r\n\r\n검증 **9/9 전량 pass**, Goal 3/3 달성.\r\n\r\n| # | 검증 | 결과 |\r\n|---|---|---|\r\n| V1 | resolver 가 순위표 1등을 뽑는가 | `gpt-5.6-sol` ✓ |\r\n| V2 | §4 표준 호출 E2E | EXIT 0 + `V324-OK` ✓ |\r\n| V3 | 옛 모델명 호출형 잔존 | 0건 ✓ |\r\n| V4 | 5개 스킬에 사다리 반영 | ✓ |\r\n| V5 | `fable` spawn 실측 | ✓ (Supervisor 실행이 겸용 검증) |\r\n| V6 | 태그 ref 확인 | `git show v3.24.0:.claude-plugin/marketplace.json` → ref=v3.24.0 ✓ |\r\n| V7 | 이 컴퓨터 플러그인 반영 | 3.23.1 → 3.24.0 ✓ |\r\n| V8 | Mac Mini 플래그 경로 | 정상 ✓ |\r\n| V9 | JSON 파싱 | ✓ |\r\n\r\n**Pre-mortem**: 4-skeptic 병렬 공격으로 27건 수집 → 12건 채택·계획 반영, **blocker 2건 사전 해소**.\r\n\r\n**Supervisor**: `fable` 82점 pass.\r\n\r\n**Codex 리뷰는 degrade 됐다** — 대형 diff 로 180초를 초과해 `codex-integration.md` §7 규칙대로 Supervisor 단독 게이트로 진행했다. 이때 timeout 가드가 라이브로 실증됐고, 이 실패가 v3.25.0 에서 **타임아웃 규모 분기(180/300/600초)** 개정의 근거가 됐다.\r\n\r\n## 추가 사항\r\n\r\n- **자기 감시 배선** — 모델 순위가 바뀌어 문서 예시가 낡으면 Lens 정기 감사(`/crv`)가 스스로 알아차리도록 `capability-assumptions.json` 에 감사 항목을 넣었다.\r\n- **수용된 한계** — Claude 두뇌 목록에는 순위 정보가 없어 미래 새 모델명의 우열은 자동 판별이 불가능하다. 판별 불확실 시 상속을 안전 기본값으로 두고, `/crv` 감사가 목록 변화를 감지해 개정을 제안한다. (⚠️ 이 \"상속\" 규칙 자체는 **v3.25.0 에서 폐기**됐다 — 계측 구멍이자 최상위 모델 과소비의 직접 원인이었다.)\r\n- **다른 컴퓨터** — 각자 `/lens-upgrade`·`/ci` 실행 시 자동 반영.\r\n- **출시 순서 교훈** — 마켓플레이스가 태그의 `ref` 를 보므로 **커밋 → 태그 → push → `git show` 검증** 순서를 엄수해야 한다. 순서가 바뀌면 다른 컴퓨터에 옛 코드가 설치된다(실제 사고 이력이 있어 절차화됨).\r\n","truncated":false,"stale":true,"branch":null,"base":null},{"id":"2026-07-04-cp-flow-mode","folder":"history","title":"Lens 3.23.x 통합 업그레이드 — `/cp flow` 신설 + Fable 하네스 규칙 이식 — 완료","date":"2026-07-04","hasMd":true,"hasHtml":true,"mdPath":"history/2026-07-04-cp-flow-mode.md","htmlPath":"history/2026-07-04-cp-flow-mode.html","mdInline":"# Lens 3.23.x 통합 업그레이드 — `/cp flow` 신설 + Fable 하네스 규칙 이식 — 완료\n\n**완료일**: 2026-07-04\n\n## 요약\n\n`/cp flow` FLOW 모드를 신설해 어떤 프로젝트든 \"이용자 관점 단계별 **화면** ↔ 받치는 엔진/모듈 ↔ 종속·재사용 관계\"를 한 장의 인터랙티브 Mermaid 플로우차트(`docs/rules/flow.md` SoT + `flow.html` 뷰, 05-dark-developer 토큰)로 그려 프로젝트의 Rule 로 저장하게 했다. 동시에 공개 추출본(asgeirtj/system_prompts_leaks 의 Claude Code 2.1.172 Fable 프롬프트)에서 하네스 규칙을 선별·재서술해 `docs/rules/harness-rules.md` SoT + 6개 스킬(c·cc·ccp·cp·cpp·cr)에 역할별로 인라인했다. **v3.23.0**(본편) + **v3.23.1**(dogfood 피드백 패치)로 릴리즈.\n\n## 주요 결정 사항\n\n- **단계 층 노드 = 화면(스크린) 단위 (v3.23.1 — 사용자 반려로 확정)**: 초판 스펙(\"화면/명령의 사용 순서\")이 느슨해 dogfood 산출물이 스크립트/작업 단위로 묶임 → 사용자 반려. F2(a)를 \"이용자가 실제로 보는 화면/뷰만 단계 노드, 스크립트·설정·잡·CLI 는 전부 엔진 층으로 강등\"으로 강제. 화면 인벤토리는 라우트/템플릿/페이지 파일에서 도출.\n- **Additive-only 이식 원칙 (fable-prompts 의 Lossless Transformation 교훈)**: Claude Code 하네스가 이미 강제하는 규칙은 스킬에 재복붙하지 않는다. 예외 3가지 — ① 워커 디스패치 프롬프트(서브에이전트에서 준수가 약해지는 규칙 재강조) ② 하네스가 못 미치는 Lens 특화 지점(Monitor 필터·보고 템플릿·Codex 호출·승인 게이트) ③ 자주 위반되는 규칙의 3중 반복. 스킬당 ~40줄 상한, 삭제 0줄(순수 삽입).\n- **출처 취급**: 비공식 추출본이므로 원문 복붙 금지 — 원칙만 재서술 + 기준 버전(2.1.172) 명시 + 이후 `/crv` 감사에서 재대조 채널화. 충돌 3건(모델 할당·승인 게이트·5분 보고)은 전부 Lens 설계 유지로 심사 기록.\n- **md = SoT, HTML = 파생 뷰** 유지 + **CONVERT `doc_kind: flow` 가드** (Codex 듀얼트랙이 발견한 함정 — 미가드 시 `/cp html` 이 flow 뷰어를 task 6-slide 덱으로 덮음. `planner: cpp` 확인보다 선행).\n- **디자인 SoT**: `livevil-setting/design/05-dark-developer/design.md` 토큰을 뷰어 템플릿에 임베드(타 머신 livevil-setting 부재 대비). 폰트만 한국어 커버리지로 Pretendard 유지(편차 명기).\n- **mermaid 점선 라벨 가드** (dogfood 실측 버그): `-.라벨.->` 은 라벨 안 `.`·`-` 에서 lexical error → `-.->|\"라벨\"|` 형식만.\n\n## 변경 파일\n\n- 신규: `templates/flow.template.md`, `templates/flow-viewer.example.html`, `docs/rules/harness-rules.md`\n- 수정: `skills/cp/SKILL.md`(FLOW 모드 42줄 + 라우팅 예약어 + CONVERT 가드 + 규칙 8줄), `skills/c/SKILL.md`(+20), `skills/cc/SKILL.md`(+27), `skills/ccp/SKILL.md`(+16), `skills/cpp/SKILL.md`(+12), `skills/cr/SKILL.md`(+14), `CHANGELOG.md`, `README.md`, `CLAUDE.md`, `docs/START_HERE.md`\n- dogfood 산출물(livevil-boost 레포, commit `1bf78f2`): `docs/rules/flow.md`, `docs/rules/flow.html`, `docs/board_livevil-boost.html`\n- 릴리즈: creeta-lens `f3120e2`(v3.23.0 tag) + v3.23.1 tag, 로컬 플러그인 3.23.1 설치\n\n## 테스트 & 검증\n\n- Supervisor(실파일 재검증) 92/100 pass — 워커 5개 산출물 + 통합성(하네스 블록이 디스패치 프롬프트 코드펜스 **안**에 위치함을 펜스 짝 분석으로 확정). Codex 리뷰는 180초 내 판정 미산출로 미완 → Supervisor 단독 게이트로 degrade(정직 기록).\n- QA 검증표 auto 6/6 pass: 산출물 존재(ls) / Playwright 실렌더(svg=true, err=none — 반려 전 21노드, 재생성 후 24노드) / board 카드(stale=false, 해시 일치) / 6개 스킬 grep 커버 / 설치본 3.23.x 버전 / CONVERT 가드(doc_kind 분기 선행 + 생성 html slide 클래스 0).\n- do
