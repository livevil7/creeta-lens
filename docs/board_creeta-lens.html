l}],"rules":[{"id":"branch-lifecycle","folder":"rules","title":"브랜치 생명주기 규칙 (Branch Lifecycle)","date":"","hasMd":true,"hasHtml":false,"mdPath":"rules/branch-lifecycle.md","htmlPath":null,"mdInline":"# 브랜치 생명주기 규칙 (Branch Lifecycle)\r\n\r\nLens 워크스페이스(27개 레포)의 브랜치 규칙 SoT. `/cp`·`/cc`·`/cs` 가 브랜치를 정하고·만들고·닫을 때 이 문서를 기준으로 삼는다. 스킬 본문은 이 규칙을 재서술하지 않고 여기를 참조한다.\r\n\r\n**출처와 위상**:\r\n\r\n- 승격 원본: `livevil-research/docs/rules/branch-hygiene.md` (2026-07-25 그 레포의 브랜치 정리에서 실측으로 확립). 접두사 4종, 머지 후 즉시 삭제, patch 동등성으로 머지 증명, 스냅샷은 태그, 자동 커밋을 브랜치에 쌓지 않기, PR base 는 통합 브랜치 — 이 여섯 결론은 재발명하지 않고 그대로 승격했다.\r\n- **위상 차이**: 원본은 **그 레포 한 곳의 규칙**이고, 이 문서는 **워크스페이스 전체 + Lens 도구 동작의 규칙**이다. 두 문서가 어긋나는 지점은 §3 에서 명시적으로 다룬다(숨기지 않는다).\r\n- 판정 구현: `lib/git-branch.js` — `resolveBase` / `canCommitTo` / `mergedState` / `branchName` / `preflight`. 문서와 구현이 어긋나면 **문서가 SoT**이고 구현을 고친다.\r\n\r\n---\r\n\r\n## 0. 실측 근거 (2026-07-25 재확인)\r\n\r\n규칙의 모든 조항은 아래 실측에서 나왔다. 수치는 이 문서를 쓰면서 직접 재측정한 값이다.\r\n\r\n### 0.1 base 브랜치 위 직접 작업\r\n\r\n```sh\r\n# 워크스페이스 루트의 git 레포마다 \"현재 브랜치 == 감지된 base\" 인지 센다\r\nnode -e \"const {resolveBase}=require('./lib/git-branch.js'); ...\"   # 전체 스니펫은 §4.4\r\n```\r\n\r\n```text\r\nbase 브랜치 위에서 작업 중: 25/27\r\n작업 브랜치 위: 2 → creeta-lens (feat/branch-lifecycle), livevil-setting (docs/progress-report-2min)\r\n```\r\n\r\n**27개 중 25개가 통합 브랜치 위에서 직접 작업 중이었다.** 예외 2개는 이 규칙을 만드는 오늘 작업이 스스로 만든 브랜치다 — 즉 규칙 도입 직전 상태는 실질 27/27 이었다. 워크스페이스 루트에는 디렉터리 30개가 있고 그중 `data`·`hellomarket`·`Returns-Finance` 는 git 레포가 아니라서 27개가 대상이다.\r\n\r\n### 0.2 base 이름 분포\r\n\r\n원격 ref 존재 기준(`git rev-parse --verify refs/remotes/origin/<name>`):\r\n\r\n| 상태 | 개수 | 레포 |\r\n| --- | --- | --- |\r\n| `master` 만 | 11 | creeta, creeta-homepage, creeta-lens, creeta-pulse, creeta-workspace, livevil-AI_infuencer, livevil-setting, namane-homepage, namane-shop-renewal, namane-sns, returns-bidding-analyzer |\r\n| `main` 만 | 13 | creeta-echo, livevil-boost, livevil-contents, livevil-data, livevil-mini-server, livevil-openclaw, livevil-research, namane-mkt, namane-snscard, nestree, Returns-Doc, Returns-Homepage, Stage |\r\n| `main` + `master` 둘 다 | 1 | namane-cms |\r\n| `main` + `staging` | 1 | Returns_ERP_v20 |\r\n| 원격에 둘 다 없음 | 1 | docs (원격 저장소가 비어 있음 — §4.3) |\r\n\r\n`resolveBase()` 가 실제로 내리는 판정 기준으로는 **master 12 / main 14 / staging 1** 이고 **판정 실패 0건**이다(판정 출처: upstream 24, origin/HEAD 2, config 1). 두 표의 차이는 `namane-cms`(→ master)와 `docs`(→ main) 가 어디로 귀속되는지의 차이다.\r\n\r\n> ⚠️ **수치 대조**: 이 규칙 도입 과정의 초기 브리핑이 `master 13 / main 12 / staging 1` 을 인용했으나 **오집계였다**(합계가 28이 되어 27과 맞지 않았다). 재측정값이 위 표이며, 그 값을 인용했던 `skills/cp/SKILL.md`·`skills/cc/SKILL.md` 두 곳은 2026-07-25 정정 완료. **이 문서의 수치가 SoT** 이며, 인용하는 쪽은 아래 명령으로 재확인한 값을 쓴다.\r\n>\r\n> ```sh\r\n> for d in */; do r=\"${d%/}\"; [ -d \"$r/.git\" ] || continue\r\n>   m=$(git -C \"$r\" rev-parse --verify -q refs/remotes/origin/main   >/dev/null 2>&1 && echo main)\r\n>   s=$(git -C \"$r\" rev-parse --verify -q refs/remotes/origin/master >/dev/null 2>&1 && echo master)\r\n>   g=$(git -C \"$r\" rev-parse --verify -q refs/remotes/origin/staging >/dev/null 2>&1 && echo staging)\r\n>   printf \"%-28s %s %s %s\\n\" \"$r\" \"$m\" \"$s\" \"$g\"\r\n> done\r\n> ```\r\n\r\n### 0.3 `main` 과 `master` 는 두 단계가 아니다\r\n\r\n**같은 역할의 다른 이름이다.** git 이 2020년에 기본 브랜치 이름을 `master` → `main` 으로 바꿨기 때문에, 그 전에 만든 레포만 `master` 로 남아 있다. 두 이름이 동시에 존재하는 레포에서도 계층 관계가 아니다 — `namane-cms` 실측: `origin/main` 은 `origin/master` 의 조상이고(main 고유 커밋 0개, master 가 9커밋 앞) `main` 의 마지막 커밋은 2026-03-31, `master` 는 2026-04-13 이다. `main` 은 **완전히 흡수된 잔여물**이고 살아 있는 base 는 `master` 다.\r\n\r\n따라서 `master` → `main` rename 은 이 규칙의 목표가 아니다. Lens 는 이름을 통일하지 않고 **감지**한다(§4).\r\n\r\n### 0.4 `staging` 은 배포 환경이 있는 곳에만 있다\r\n\r\n`staging` 원격 브랜치가 있는 레포는 `Returns_ERP_v20` **하나**다. 그 레포는 `staging` 이 실제 배포 환경에 연결되어 있고 `scripts/promote-to-main.sh` 로 main 에 승격한다.\r\n\r\n### 0.5 접두사 누적과 정리 결과\r\n\r\n한 레포(`livevil-research`)에서 접두사 9종이 혼재했다: `agent/ claude/ codex/ feat/ feature/ task/ ops/ backup/ sync/` (2026-07-25 정리 기록). 원격 브랜치 10개 중 살아 있는 작업은 1개였고, **오늘 정리로 병합 증명된 6개를 삭제**했다.\r\n\r\n정리 후 현재 원격(`git ls-remote --heads origin`) — main 외 4개 + 오늘 `/cs` 가 새로 만든 `sync/` 1개:\r\n\r\n```text\r\nrefs/heads/main\r\nrefs/heads/backup/macmini-preIA-20260723\r\nrefs/heads/claude/why-so-many-branches-apcojh\r\nrefs/heads/ops/pre-renewal-macmini-20260719\r\nrefs/heads/task/community-insight-surface-v3\r\nrefs/heads/sync/2026-07-25-215207\r\n```\r\n\r\n지금 직접 재확인되는 접두사는 남은 ref 의 `backup/ claude/ ops/ sync/ task/` 5종과, 닫힌 PR #2(`agent/research-workspace-features-20260725`)의 `agent/` 1종이다. 나머지 3종(`codex/ feat/ feature/`)은 브랜치와 reflog가 함께 삭제되어 정리 기록에만 남아 있다.\r\n\r\n### 0.6 자동 커밋 누적\r\n\r\n`backup/macmini-preIA-20260723` 실측: base 에 없는 패치 **169개**인데 merge-base 기준 고유 변경은 **4파일**이다.\r\n\r\n```text\r\ndocs/reports/platform-engine-soak-final.json\r\ndocs/tasks/2026-07-12-platform-engine-rebuild-and-control-plane.md\r\nlivevil_research/wiki.py\r\nregistry/update_sources.yaml\r\n```\r\n\r\n`ops: record 24-hour platform engine soak` 형태의 반복 커밋이 브랜치를 만들었다. **커밋 수는 남은 작업량의 근거가 되지 못한다**(§5, §6).\r\n\r\n---\r\n\r\n## 1. 브랜치 모델 — 2단 (확정)\r\n\r\n```text\r\nfeat/<slug>  ──PR──▶  그 레포의 base  ──▶  브랜치 즉시 삭제\r\n                      (main | master | staging — 레포마다 감지)\r\n```\r\n\r\n**단계는 둘뿐이다: 작업 브랜치 → base.** 그 사이에 아무것도 넣지 않는다.\r\n\r\n### 1.1 `staging` 을 새로 만들지 않는다\r\n\r\n배포 환경이 뒤에 없는 `staging` 은 시간이 지나면 `main` 과 항상 동일해지고, 남는 것은 머지를 두 번 하는 절차뿐이다. 사용자 확정 발언 그대로: *\"3단을 할 필요가 전혀 없어 / staging조차 배포환경이 있는 것이나 하는 거지.\"*\r\n\r\n- 26개 레포에 `staging` 브랜치를 신설하는 것은 **비목표**다. 배포 환경 구축은 별개의 인프라 과제다.\r\n- 이미 `staging` 이 있는 레포(1개)는 그것이 base 다. Lens 는 없애지도 만들지도 않고 감지만 한다.\r\n\r\n### 1.2 예외 1개 — `Returns_ERP_v20`\r\n\r\n```text\r\nfeat/<slug>  ──PR──▶  staging  ──[배포·검증]──▶  promote-to-main.sh  ──▶  main\r\n                                                 (그 레포 고유 절차 — Lens 관여 없음)\r\n```\r\n\r\n- base 는 `staging` 이다. **이중 방어**다: `lens.config.json` 의 `baseBranch[\"Returns_ERP_v20\"] = \"staging\"` 로 명시 고정되어 있고(판정 ①), config 를 비워도 체크아웃된 `staging` 의 upstream 이 `origin/staging` 이므로 판정 ②가 같은 답을 낸다.\r\n- `staging` 머지가 곧 배포다. 그래서 이 레포에서는 **PR 생성까지만 자동화하고 머지는 사람이 한다.** \"작업 완료 처리\"가 자동으로 \"배포\"가 되어서는 안 된다. `staging` 직접 커밋은 §2.1 의 규칙 2·3 두 경로에서 모두 차단된다(실측).\r\n- `staging` → `main` 승격은 그 레포의 `scripts/promote-to-main.sh` 가 소유한다. Lens 는 이 경로를 호출하지도, 대체하지도, 문서화하지도 않는다.\r\n\r\n---\r\n\r\n## 2. 1 task = 1 문서 = 1 브랜치 = 1 PR\r\n\r\n작업의 완료를 문서 위치(`docs/tasks/` → `docs/history/`)로만 정의하면 브랜치는 작업이 끝난 *뒤* 급조되고 계속 쌓인다(§0.5 실측). 계획 시점에 이름을 정해 문서에 박아두고, 실행이 그 브랜치만 쓰고, 완료 처리가 그것을 닫는다.\r\n\r\n| 시점 | 소유자 | 하는 일 |\r\n| --- | --- | --- |\r\n| 계획 승인 | `/cp` | 브랜치 **이름을 확정**해 task 문서 frontmatter 에 기록한다: `repo` / `base`(감지값) / `branch: feat/<slug>` / `pr`(초기 null). **브랜치를 만들지는 않는다** — `/cp` 는 문서만 쓴다 |\r\n| 실행 진입 | `/cc` | base 를 fetch·최신화한 뒤 `checkout -b <문서의 branch>` — **`requireTaskBranch` 값과 무관하게 항상 만든다**(그 플래그는 \"만드느냐\" 가 아니라 **\"확보에 실패했을 때 차단하느냐\"** 만 통제한다). diverged·base 판정 불가면 **차단**(fail-closed). dirty 면 차단하되, **그 dirty 가 전부 이 task 의 계획 산출물(plan md·board)이면 예외** — `/cp` 는 계획 문서를 커밋하지 않고 넘기므로 정상 핸드오프는 항상 dirty 다. 그 외 dirty 는 목록을 보여주고 (중단 / stash / 명시 승인) 을 묻는다. 헤드리스는 fail-closed |\r\n| 병렬 worker 격리 | `/cc` Phase 3.5 | worktree 로 격리했으면 Leader 가 **패치 전송으로 직렬 통합**한다(merge·cherry-pick 금지 — worker 는 커밋하지 않아 worktree 브랜치는 보통 커밋 0개이고, merge 는 **아무것도 안 가져오면서 성공**한다. 게다가 worktree 는 task base 가 아니라 `origin/<기본 브랜치>` 에서 갈라진다). 통합 결과를 역적용 검사로 **관측**한 뒤에만 worktree 를 제거하고, 충돌·실패면 검토 단계로 **진행하지 않는다**(fail-closed) |\r\n| 실행 중 커밋 | `/cc` | **현재 브랜치가 문서의 `branch` 와 같을 때만 커밋한다.** 그 외는 커밋을 거부하고 보고 — 판정 순서는 §2.1, 구현은 `canCommitTo(repoPath, planBranch)` |\r\n| 완료 처리 | `/cp done` | ① PR 생성/확인 → ② 머지 판정(§5) → ③ **브랜치 정리를 먼저 한다**(lease 통과, 또는 `autoDeleteMergedBranch:false` 같은 정당한 skip) → ④ 그 다음 history 기록 + task 문서 삭제 → ⑤ **미머지면 history 로 내리지 않고 \"In Review\" 로 보고** |\r\n| 워크스페이스 스윕 | `/cs` | task 브랜치를 **소유하지 않는다.** task 브랜치는 건너뛴다(재포장·reset 금지). `sync/` 브랜치는 계획 밖 dirty 변경 전용이다(§3.2) |\r\n\r\n- **정리가 아카이브보다 먼저다.** history 를 쓰고 task 문서를 지운 *뒤에* 브랜치를 지우려 하면, lease 가 거부됐을 때 **검증되지 않은 작업이 \"완료\" 로 기록된 채 남고 재평가할 task 문서도 없다** — 되돌릴 수 없다. 순서를 뒤집으면 실패는 \"완료인데 문서상 미완료\"(내용은 base 에 증명돼 있고 task 도 남음, 손실 0)로 넘어진다. Phase 1.4 의 \"잘못 아카이브하느니 남겨두는 것이 안전\" 과 같은 방향이다.\r\n  - ⚠️ **삭제를 *시도하지 않은 것*과 *시도했다 실패한 것*을 구분한다.** `autoDeleteMergedBranch:false` 는 전자이므로 아카이브를 막지 않는다. lease 거부·삭제 실패는 후자이므로 아카이브에 진입하지 않는다.\r\n- **기존 브랜치를 \"재개\" 로 받아들이기 전에 그것이 이 계획의 것인지 검증한다.** 브랜치 이름은 결정적이라, 이전 task 의 잔여물이나 slug 가 겹친 새 task 가 같은 이름을 갖는다. 이름 일치만으로 checkout 하면 **새 작업이 낡거나 무관한 이력 위에** 쌓인다. 세 조건이 전부 참일 때만 재개다:\r\n  1. **소유** — `/cc` 가 브랜치를 만든 직후 계획 문서 `## 진행상황` 에 남긴 기록(브랜치명·레포·시작 SHA)이 있고 지금 값과 일치한다. frontmatter 의 `branch` 는 `/cp` 가 *이름을 예약*한 것일 뿐 실행 사실을 증명하지 못하므로 보조 근거다.\r\n  2. **동일성** — `git merge-base --is-ancestor <기록된 시작 SHA> <branch>` 가 exit 0. exit 1 이면 같은 이름으로 reset·재생성된 남의 브랜치이고, exit 128 은 판정 불가다(둘 다 차단). ⚠️ `--is-ancestor origin/<base> <branch>` 는 **차단 사유로 쓰지 않는다** — base 가 그 뒤 전진하면 정상 재개에서도 exit 1 이 난다.\r\n  3. **미완료** — `mergedState` 가 `merged`/`patch-merged`/`merged-deleted`/`unknown` 이 아니다. merged 계열은 끝난 task 의 시체이고 그 위 커밋은 닫힌 작업을 되살린다.\r\n  - 실패하면 **fail-closed**(중단이 기본). 자동으로 이름에 접미사를 붙이지 않는다 — §3.1 이 이름의 유일성 토큰을 금지하고, 이름을 바꾸면 커밋 판정(§2.1 규칙 2)이 모든 커밋을 거부해 조용히 \"커밋 없는 실행\" 이 된다. 사용자가 고유 이름을 택하면 **계획 문서의 `branch` 를 그 이름으로 갱신하는 것이 필수**다.\r\n- **1 task = 1 레포가 이 규칙의 전제다.** frontmatter 의 `repo`/`base`/`branch`/`pr` 은 스칼라 4필드이고, 레포별 구조를 담지 않는다. 하나의 task 가 여러 레포를 건드려야 한다면 **레포마다 task 문서를 나눈다.**\r\n  - 다중 레포를 한 문서에 담는 것은 **이번 범위 밖**이다(계획서의 명시적 전제). 스칼라 필드에 구조를 넣으면 파싱이 `[object Object]` 같은 값을 만들고, 핸드오프·DONE·board 소비자가 전부 깨진다.\r\n  - 실제로 여러 레포가 얽히는 작업은 있다 — 이 규칙을 도입한 작업 자체가 `creeta-lens` 와 `livevil-setting` 두 곳을 건드렸다. 그때도 **레포별로 브랜치와 PR 을 따로** 만들었고(`feat/branch-lifecycle` / `docs/progress-report-2min`), 문서만 하나였다. 그 방식이 지금 지원되는 형태다: **문서는 주 레포에 두고, 부수 레포의 브랜치·PR 은 본문에 적는다.** frontmatter 는 주 레포 하나만 기술한다.\r\n  - 레포별 메타데이터를 frontmatter 로 구조화하는 것은 후속 과제다. 필요해지면 `plan-manager` 파싱·`/cp` 핸드오프·DONE 판정·board 조인을 **함께** 바꿔야 한다.\r\n- 브랜치 하나에 두 개의 task 를 태우지 않는다. 머지 판정과 완료 처리가 서로를 막는다.\r\n- PR base 는 **그 레포의 base** 다. 다른 작업 브랜치를 base 로 삼지 않는다 — 그 브랜치가 머지·삭제되면 PR 이 의미를 잃는다.\r\n\r\n### 2.1 커밋 허용 판정 — 순서가 계약이다\r\n\r\n`canCommitTo(repoPath, planBranch)` 의 판정 순서다. **순서를 바꾸면 규칙이 깨진다.**\r\n\r\n| 순위 | 조건 | 결과 |\r\n| --- | --- | --- |\r\n| 0 | 현재 브랜치를 읽을 수 없다(detached HEAD, git 조회 실패) | **금지** |\r\n| 1 | 계획 문서에 `branch` 가 있고 현재 브랜치가 그것과 **같다** | **허용** — base 판정 결과와 무관 |\r\n| 2 | 계획 문서에 `branch` 가 있고 현재 브랜치가 **다르다** | **금지** — 사유에 \"어느 브랜치를 체크아웃해야 하는지\" 명시 |\r\n| 3 | 계획 문서에 `branch` 가 **없다** | 현재 브랜치가 허용 접두사 4종이고 **base 가 아닐 때만** 허용. base 판정 불가면 금지 |\r\n\r\n**규칙 1 이 base 검사보다 앞인 이유(실증으로 정정된 계약)**: 초기 계약은 \"현재 브랜치가 base 와 같으면 **항상** 금지\"였고 **틀렸다.** task 브랜치를 push 하면 그 브랜치의 upstream 이 자기 자신(`origin/<자기 브랜치>`)이 되고, base 판정 ②(upstream)가 **자기 자신을 base 로 답한다.** 그러면 `current === base` 가 성립해 **두 번째 커밋부터 전부 거부**된다. throwaway 원격으로 재현·확인됐다(수정 전 `allowed=false` → 수정 후 `true`).\r\n\r\n따라서 **\"base 와 같으면 금지\"는 계획에 브랜치가 명시되지 않은 경우(규칙 3)에만 적용된다.** 계획 문서가 \"이 브랜치에 커밋하라\"고 명시한 것이 최상위 근거다.\r\n\r\n**`Returns_ERP_v20` 보호는 약화되지 않는다 — 두 경로 모두 차단됨을 실측했다**:\r\n\r\n```text\r\nERP resolveBase          : {\"base\":\"staging\",\"source\":\"config\"}\r\nERP + planBranch feat/x  : {\"allowed\":false,\"reason\":\"현재 브랜치(staging)가 계획 브랜치(feat/x)와 다름 — feat/x 체크아웃 필요\"}   ← 규칙 2\r\nERP + planBranch null    : {\"allowed\":false,\"reason\":\"현재 브랜치(staging)가 base 브랜치 — base 직접 커밋 금지\"}                  ← 규칙 3\r\n```\r\n\r\n계획 브랜치가 있으면 규칙 2 가 막고, 없으면 규칙 3 이 막는다. `staging` 에 직접 커밋하는 경로는 남지 않는다.\r\n\r\n---\r\n\r\n## 3. 접두사\r\n\r\n### 3.1 4종만 쓴다\r\n\r\n| 접두사 | 용도 | 수명 |\r\n| --- | --- | --- |\r\n| `feat/` | 기능 추가·변경 | 머지 즉시 삭제 |\r\n| `fix/` | 버그 수정 | 머지 즉시 삭제 |\r\n| `ops/` | 운영·배포·스케줄 변경 | 머지 즉시 삭제 |\r\n| `docs/` | 문서만 변경 | 머지 즉시 삭제 |\r\n\r\n- **금지**: `agent/` `claude/` `codex/` `task/` `feature/` `backup/`. 도구·에이전트 이름을 접두사에 넣으면 누적의 원인이 된다(§0.5 실측 — 9종 혼재, 10개 중 살아 있는 것 1개). `feature/` 는 `feat/` 와 중복이고, `backup/` 은 브랜치가 아니라 태그의 일이다(§6).\r\n- 도구가 자동으로 만든 이름(`claude/...`, `codex/...`)으로 작업을 시작했다면 **PR 을 열기 전에** 4종으로 이름을 바꾼다.\r\n- 이름 형식은 `<접두사>/<무엇을-하는지>`. 예: `feat/branch-lifecycle`, `fix/duplicate-cover-upload`, `ops/cron-retry-window`, `docs/progress-report-2min`.\r\n- **날짜를 붙이지 않는다.** 커밋이 이미 날짜를 갖고 있고, 날짜가 붙은 이름은 같은 작업을 재개할 때 두 번째 브랜치를 만들게 한다.\r\n- 접두사 목록은 `lens.config.json` 의 `branchPrefixes` 로 덮어쓸 수 있다. 기본값은 위 4종이다. 늘리려면 이 문서를 먼저 고친다.\r\n\r\n### 3.2 `sync/` 는 예외 — 어느 쪽이 상위인지\r\n\r\n**상충을 먼저 드러낸다**: 출처 문서(`livevil-research/docs/rules/branch-hygiene.md`)는 `sync/` 를 금지 목록에 넣었다. **이 문서는 `sync/` 를 도구 전용 임시 접두사로 예외 인정한다.**\r\n\r\n**우선순위**: 이 문서 = Lens 워크스페이스 규칙(27개 레포 공통 + 도구 동작 정의) → **상위**. 출처 문서 = `livevil-research` 레포 내부 규칙 → **하위**. 같은 레포에서 두 규칙이 부딪히면 이 문서를 따른다. 실질적으로는 적용 대상이 갈리므로 모순이 아니다:\r\n\r\n- **사람이 손으로 만드는 브랜치**: 4종만. `sync/` 를 사람이 만들지 않는다 — 하위 문서의 금지가 그대로 유효하다.\r\n- **`/cs` 가 자동으로 만드는 브랜치**: `sync/` 만 쓴다.\r\n\r\n**왜 예외를 인정하는가**: `/cs`(`scripts/git-sync-all.sh`)는 계획 밖에서 생긴 dirty 변경을 처리해야 하고, PR-only fail-closed 원칙상 base 로 직접 push 하지 않는다. 그러면 그 커밋을 담을 브랜치가 반드시 필요하다. 그것을 `feat/` 로 위장하면 계획된 작업 브랜치와 구분이 사라져 `/cp done` 의 브랜치 소유 판정이 오염되고, `/cc` 는 남의 브랜치 위에서 커밋 허가를 받는다. **이름을 분리하는 것이 옳다.**\r\n\r\n예외의 대가로 규율을 더 세게 건다:\r\n\r\n- `sync/` 는 **머지(또는 PR 종결) 즉시 삭제**한다. 원격·로컬 둘 다. 재사용하지 않는다 — 실행마다 새로 만든다.\r\n- `sync/` 는 이 규칙에서 **유일하게 이름에 시각을 포함한다**: `sync/YYYY-MM-DD-HHMMSS` (`git-sync-all.sh` 구현). 하루에 여러 번 자동 생성되므로 충돌 회피용 유일성이 필요하다. §3.1 의 \"날짜 금지\"는 사람이 이름 붙이는 4종에만 적용된다.\r\n- **미머지로 닫힌 `sync/` PR 은 브랜치가 남는다.** 실측: `livevil-research` PR #5(`sync/2026-07-25-215207`)는 CLOSED·미머지이고 base 에 없는 패치 1개를 여전히 갖고 있다. 이 경우 브랜치를 그냥 지우면 그 변경이 사라진다 → **자동 삭제 금지, 사람이 내용을 확인한 뒤 처리**(§5 와 같은 원칙).\r\n- `/cc` 는 `sync/` 브랜치 위에서 task 커밋을 하지 않는다. `sync/` 는 `/cs` 의 것이다.\r\n\r\n---\r\n\r\n## 4. base 판정\r\n\r\n**`main`|`master` 문자 추정을 절대 하지 않는다.** 추정하면 `Returns_ERP_v20`(base=staging, 머지=배포)에서 배포 사고가 난다. 이것이 현재 유일한 배포 사고 경로다.\r\n\r\n### 4.1 우선순위 3단\r\n\r\n| 순위 | 근거 | 명령 |\r\n| --- | --- | --- |\r\n| ① | `lens.config.json` 의 `baseBranch[<레포 디렉터리명>]` 명시값 | — |\r\n| ② | 현재 브랜치의 upstream (remote 접두사 제거) | `git for-each-ref --format='%(upstream:short)' refs/heads/<current>` |\r\n| ③ | `origin/HEAD` | `git symbolic-ref refs/remotes/origin/HEAD` |\r\n\r\n- ②가 ③보다 앞인 이유: `staging` 을 체크아웃해 `origin/staging` 을 추적하는 레포에서 `origin/HEAD` 는 `main` 을 가리킨다(`Returns_ERP_v20` 실측). upstream 이 실제 작업 맥락을 더 정확히 반영한다.\r\n- ①이 맨 앞인 이유: ②는 체크아웃 상태에 따라 흔들린다. 배포와 연결된 레포는 흔들리면 안 되므로 명시값으로 못박는다.\r\n- 세 단계 모두 실패하면 `base = null` 이다. 이때는 **추정하지 않고 그 레포를 브랜치 강제 대상에서 제외하고 사유를 보고**한다(fail-closed). base 를 모르는 상태에서는 커밋도 허용하지 않는다.\r\n\r\n### 4.2 `namane-cms` — `main` 과 `master` 공존\r\n\r\n- 살아 있는 base 는 `master` 다(§0.3: `origin/main` 은 `origin/master` 의 조상, main 고유 커밋 0개). `origin/HEAD` 와 현재 upstream 도 `master` 를 가리키므로 판정은 지금 그대로 맞다.\r\n- 위험은 누군가 그 레포에서 잔여 `main` 을 체크아웃할 때다. 그러면 ②가 `main` 을 답으로 내고, **완전히 흡수된 잔여 브랜치로 PR 을 열게 된다.**\r\n- 그래서 이 레포는 `lens.config.json` 의 `baseBranch[\"namane-cms\"] = \"master\"` 로 **명시 고정**한다(①이 ②를 덮으므로 체크아웃 상태와 무관해진다). 잔여 `origin/main` 삭제는 그 레포 소유자의 판단이고 Lens 는 건드리지 않는다.\r\n\r\n### 4.3 `docs` — 원격에 base 가 없다\r\n\r\n- 실측: 원격은 `github.com/Namane-Mkt/Docs` 이고 **저장소가 비어 있다**(`gh repo view` → `isEmpty: true`, `defaultBranchRef.name: \"\"`). `git ls-remote --heads origin` 출력이 0줄이다. 로컬 `main` 에는 커밋이 있지만 한 번도 push 되지 않았다.\r\n- 그런데 로컬 `main` 에는 upstream(`origin/main`)이 **설정되어 있다.** 그래서 ②가 `main` 을 답으로 낸다 — **존재하지 않는 ref 를 가리키는 판정**이다. PR 을 만들려 하면 base 가 없어서 실패한다.\r\n- 따라서 base 판정에는 **존재 확인이 붙는다**:\r\n\r\n  ```sh\r\n  git rev-parse --verify -q \"refs/remotes/origin/<base>\" >/dev/null \\\r\n    || echo \"base ref 원격에 없음 — 브랜치 강제 제외\"\r\n  ```\r\n\r\n  판정이 이름을 돌려줬더라도 원격에 그 ref 가 없으면 `base = null` 과 같이 취급한다. 그 레포는 브랜치 강제 대상에서 **제외**하고 \"원격 base 부재\"를 사유로 보고한다. 빈 원격을 초기화하는 것은 Lens 의 일이 아니다.\r\n- 이것은 `resolveBase` 의 실패가 아니다 — 27개 레포 전량에서 판정 실패는 0건이고 `docs` 도 ②로 답을 낸다. **이름 판정과 ref 존재는 별개 층**이며, 존재 확인은 브랜치를 만들거나 PR 을 열기 직전에 한 번 더 한다.\r\n\r\n### 4.4 전 레포 판정 재확인\r\n\r\n```sh\r\nnode -e \"\r\nconst {resolveBase}=require('./lib/git-branch.js');\r\nconst fs=require('fs'), path=require('path');\r\nconst root=process.env.GIT_ROOT || (process.env.USERPROFILE||process.env.HOME)+'/Documents/GIT';\r\nfor (const d of fs.readdirSync(root)) {\r\n  if (!fs.existsSync(path.join(root,d,'.git'))) continue;\r\n  const r = resolveBase(path.join(root,d));\r\n  console.log(d.padEnd(26), String(r.base).padEnd(9), r.source, '|', r.reason);\r\n}\"\r\n```\r\n\r\n기대값 3개는 고정이다: `Returns_ERP_v20` = `staging`(source=config), `creeta-lens` = `master`, `livevil-contents` = `main`.\r\n\r\n---\r\n\r\n## 5. 머지 판정 — 틀리면 코드가 사라진다\r\n\r\nGitHub 의 rebase·squash 머지는 커밋을 새로 쓴다. 조상 관계만 보면 **이미 병합된 브랜치가 영원히 미병합으로 보인다.** 두 단계로 판정한다.\r\n\r\n```sh\r\n# ① 빠른 경로 — 팁이 base 의 조상인가\r\ngit merge-base --is-ancestor origin/<branch> origin/<base>\r\n\r\n# ② ①이 실패하면 — base 에 없는 patch 가 남았는가 (rebase·squash 대응)\r\ngit cherry origin/<base> origin/<branch> | grep '^+'\r\n```\r\n\r\n| 결과 | 판정 | 조치 |\r\n| --- | --- | --- |\r\n| ① 통과 | `merged` | 삭제. 잃을 것이 없다 |\r\n| ① 실패 + ② 출력 없음 | `merged`(patch 동일) | 삭제. 커밋 id 는 달라도 모든 patch 가 base 에 있다 |\r\n| ② 출력 있음 | `unmerged` | **삭제 금지.** 남은 패치 수와 함께 보고 |\r\n| merge-base 없음 | `계보 다름` | **삭제 금지.** 태그 아카이브(§6) |\r\n| 원격 ref 부재 + **로컬 ref 로 내용 증명됨** | `merged-deleted` | 로컬 브랜치만 삭제(원격은 이미 없다). §7.1 의 로컬 삭제 조건을 따른다 |\r\n| 원격 ref 부재 + **내용이 base 에 없음이 증명됨** | `unpushed` | **삭제·머지 판정 금지.** push+PR 제안은 여기서만 한다. upstream 흔적이 있으면 \"병합 없이 원격에서 삭제됐을 수 있음\" 을 함께 보고 |\r\n| 원격 ref 부재 + **증명 실패** (merge-tree 충돌·git &lt;2.38·로컬 ref 도 없음) | `unknown` | **자동 처리 금지.** 사람 확인. push+PR 을 제안하지 않는다 |\r\n\r\n> **`unpushed` 와 `unknown` 의 경계는 증명의 방향이다.** `unpushed` 는 \"원격에 없다\" 가 아니라 **\"내용이 base 에 없음이 실제로 증명됐다\"** 는 뜻이다. 증명이 실패하면 `unknown` 이다.\r\n>\r\n> upstream 설정 유무를 판정 근거로 쓰지 않는다 — **`-u` 없이 push 하면 흔적이 남지 않으므로** \"흔적 없음\" 과 \"push 된 적 없음\" 은 구분할 수 없다. 그 정보는 `reason` 을 풍부하게 하는 데만 쓴다.\r\n>\r\n> 왜 중요한가: 거짓 \"머지됨\" 이 ref 를 지우는 것과 대칭으로, **거짓 \"미푸시\" 는 이미 머지된 작업에 대해 `/cp done` 이 \"push 하고 PR 을 여시겠습니까\" 를 제안하게 만든다.** 둘 다 만들지 않는다.\r\n\r\n> **`merged-deleted` 가 필요한 이유**: 머지 직후 head 브랜치 삭제는 이 문서가 규정한 정상 흐름(§3)이고 GitHub 이 자동으로 하기도 한다. 그러면 `git fetch --prune` 이 `origin/<branch>` 를 지우고, 원격 ref 만 보는 판정은 그것을 **\"한 번도 push 안 됨\"** 으로 읽는다 — 완료된 작업에 대해 \"push 하고 PR 을 또 여시겠습니까\" 를 묻게 된다. 그래서 원격 ref 가 없을 때는 **로컬 ref 를 기준으로** 조상 검사 → merge-tree 비교를 한 번 더 돌린다. 증명되면 `merged-deleted`, 증명 안 되면 머지로 올리지 않는다.\r\n\r\n### 5.1 PR 을 증거로 쓸 때 — base 자격을 통과한 MERGED 만 인정한다\r\n\r\n원격·로컬 ref 가 둘 다 없으면 내용으로 증명할 방법이 없다(→ `unknown`). 이때만 PR 상태를 판정에 되먹인다(`mergedState(..., {prMerged:true})`). 그런데 **`state: MERGED` 라는 사실만으로는 증거가 아니다.**\r\n\r\n- **base 자격**: 조회 결과 중 `baseRefName` 이 **그 task 문서 frontmatter 의 `base`** 와 같은 MERGED PR 만 증거 후보다. 조회에 `baseRefName` 을 반드시 포함시킨다(`--json number,state,baseRefName,mergedAt`).\r\n- **왜**: 이름 일치 + MERGED 만 보면 **stacked PR** 이 통과한다 — head 가 그 레포의 base 가 아니라 **다른 작업 브랜치**로 머지되고 head 가 삭제된 경우, `prMerged:true` → `merged-deleted` 가 나와 **그 변경이 계획의 base 에는 없는데도** task 가 완료로 아카이브된다. §2 가 이미 \"PR base 는 그 레포의 base 다\" 를 못 박았으므로, base 가 다른 MERGED PR 은 그 조항 밖에서 만들어진 것이고 증거 자격이 없다.\r\n- **정확히 1개**일 때만 증거로 쓴다. frontmatter `pr` 에 적는 번호도 그 PR 이다.\r\n- **0개**(MERGED 는 있으나 전부 base 불일치 포함) → `prMerged` 를 주지 않는다. `unknown` 유지, 사람 확인. 보고에 `PR #N 은 MERGED 지만 base 가 <baseRefName> (계획 base <base> 아님) — 증거 불인정` 을 명시해 그 stacked 변경의 행방을 추적할 수 있게 한다.\r\n- **2개 이상** → 같은 브랜치가 두 사이클에 재사용된 흔적(1 task = 1 브랜치 = 1 PR 위반)이다. 어느 머지가 이 task 의 것인지 도구가 특정할 수 없으므로 `unknown` 유지하고 후보 전부(번호·mergedAt)를 보고한다.\r\n\r\n같은 자격 검사가 **board 의 In Review 조인**에도 적용된다 — head 이름만으로 붙이면 다른 base 로 향하는 PR 이 카드에 달라붙는다. 다만 board 는 **하위호환을 택한다**: 문서에 `base` 가 없으면(이 규칙 이전에 쓰인 문서) 이름만으로 조인한다. 실측 근거 — 이 레포 39개 문서 중 `base:` 를 가진 것은 1개뿐이라, 엄격하게 가면 좁은 오조인 1건을 막으려고 나머지 전 코퍼스의 In Review 를 조용히 비우게 된다. **`base` 를 적은 적이 없다는 것은 불일치의 증거가 아니다.** base 때문에 붙이지 않은 건수는 상단 바에 표시한다(침묵 금지).\r\n\r\n- **`ahead` 커밋 수를 병합 근거로 쓰지 않는다.** 계보가 다르면 ahead 가 수백이어도 병합할 것이 없고, 반대로 계보가 같아도 커밋 수는 남은 작업량을 말해주지 않는다. 실측: `backup/macmini-preIA-20260723` 은 base 에 없는 패치 169개인데 고유 변경은 4파일이다(§0.6).\r\n- **두 검사를 다 통과하지 못하는 브랜치는 자동 삭제하지 않는다.** 리베이스 중 충돌을 해결하면 patch-id 가 바뀌어 이미 병합된 브랜치도 `unmerged` 로 나온다. \"도구가 병합을 증명할 수 없다\"는 뜻이므로 사람이 내용을 확인한 뒤 지운다. 추측으로 지우지 않는다.\r\n- 구현은 `mergedState(repoPath, branch, base)` 다. 현재 `livevil-research` 실측 출력:\r\n\r\n  ```\r\n  sync/2026-07-25-215207              {\"state\":\"unmerged\",\"unmergedPatches\":1}\r\n  claude/why-so-many-branches-apcojh  {\"state\":\"unmerged\",\"unmergedPatches\":5}\r\n  backup/macmini-preIA-20260723       {\"state\":\"unmerged\",\"unmergedPatches\":169}\r\n  ops/pre-renewal-macmini-20260719    {\"state\":\"unmerged\",\"unmergedPatches\":2}\r\n  task/community-insight-surface-v3   {\"state\":\"unmerged\",\"unmergedPatches\":1}\r\n  ```\r\n\r\n  정리 후 남은 4개(+오늘 생긴 `sync/` 1개)가 전부 `unmerged` 인 것은 정상이다 — 병합 증명된 6개는 이미 삭제됐고, 남은 것은 사람의 판단이 필요한 것들이다.\r\n\r\n---\r\n\r\n## 6. 스냅샷은 브랜치가 아니라 태그다\r\n\r\n상태 보존, 갱신 전 백업, 재현용 시점 고정은 **전부 태그**로 남긴다.\r\n\r\n태그 이름은 **`archive/<원래-브랜치-전체경로>-<판정SHA12>`** 다. 세 명령은 **`&&` 로 묶인 하나**이고, 쪼개서 실행하지 않는다.\r\n\r\n```sh\r\ngit tag -a archive/<원래-브랜치-전체경로>-<판정SHA12> <판정SHA> -m '<보존 이유>' \\\r\n  && git push origin archive/<원래-브랜치-전체경로>-<판정SHA12> \\\r\n  && git push --force-with-lease=refs/heads/<원래-브랜치>:<판정SHA> origin :refs/heads/<원래-브랜치>\r\n```\r\n\r\n- **브랜치 전체 경로를 살린다.** 첫 경로 요소를 버리면 `backup/foo` 와 `legacy/foo` 가 **같은 태그 이름**이 된다. 그러면 두 번째 태그 생성은 실패하는데 뒤따르는 삭제는 성공해서, **그 브랜치의 tip 이 어디에도 보존되지 않은 채 사라진다**(throwaway 원격에서 실제로 재현됨). 중첩(`archive/backup/foo-…`)은 유효한 태그 이름이다.\r\n- **접미사는 날짜가 아니라 판정 SHA 다.** 도구는 하루에 여러 번 돌 수 있고, 같은 브랜치의 tip 이 진전된 뒤 재아카이브하면 날짜 접미사는 또 충돌한다. SHA 는 §7.1 의 \"태그·lease 는 판정 시점 tip\" 계약과 일치하고, 이름 자체가 어느 tip 을 보존했는지 남긴다.\r\n- **태그 push 가 성공해야 삭제한다.** `&&` 가 그 순서를 강제한다. 태그가 안 올라갔는데 삭제만 도는 절차를 문서가 승인해서는 안 된다 — §7.1 의 \"lease 없는 삭제 금지\" 와 같은 강도의 요구다.\r\n- **로컬 정리는 원격에 아무것도 쓰지 않는다.** `--remote` 를 주지 않은 실행은 로컬 `refs/heads` 만 대상으로 한다. 그런데 안내가 `origin` 을 넣어 원격 삭제를 내보내면, **로컬만 정리하려던 사용자가 블록을 복사 실행하는 순간 원격 브랜치가 사라진다**(재현 확인). 로컬 모드의 형태는 이렇다 — 태그도 **로컬에만** 만들고 push 하지 않는다:\r\n\r\n  ```sh\r\n  git tag -a archive/<원래-브랜치-전체경로>-<판정SHA12> <판정SHA> -m '<보존 이유>' \\\r\n    && git update-ref -d refs/heads/<원래-브랜치> <판정SHA>\r\n  ```\r\n\r\n  - 태그 push 도 원격 쓰기다 — `--remote` 를 안 준 사용자는 그것도 승인한 적이 없다. 지워지는 ref 가 로컬이므로 GC 로부터 보호할 곳도 로컬이고, 같은 이름의 원격 브랜치가 있다면 그 tip 은 원격 브랜치 자체가 계속 보존한다.\r\n  - 원격 모드는 \"태그 **push** 성공에 삭제 종속\", 로컬 모드는 \"태그 **생성** 성공에 삭제 종속\" 이다(`&&` 로 동일).\r\n  - ⚠️ `update-ref -d` 는 체크아웃된 브랜치도 지워 HEAD 를 깨뜨린다 — 그 브랜치에서 벗어난 뒤 실행한다(§7.1).\r\n  - 원격까지 정리하려면 `--remote` 로 **재판정**한다. 로컬 실행이 원격을 대신 판단하지 않는다.\r\n- **도구가 출력하는 명령의 동적 값은 셸 인용한다.** git 은 브랜치 이름에 `;`·`$()`·`&`·백틱을 허용한다. 인용하지 않으면 그런 이름의 브랜치가 안내에 그대로 보간되고, 사용자가 블록을 복사해 실행하는 순간 **임의 셸 코드가 돈다**(재현 확인). `/cp done` Phase 4 처럼 같은 형태의 명령을 만드는 경로는 전부 해당된다.\r\n\r\n- 태그는 브랜치 목록을 오염시키지 않으면서 커밋을 영구 보존한다. 브랜치 목록은 **지금 진행 중인 작업만** 보여야 한다.\r\n- **병합 의도가 없는 계보를 브랜치로 두지 않는다.** 특히 base 와 공통 조상이 없는 계보는 브랜치로 남겨두면 언젠가 병합 시도의 대상이 되고, 그 병합은 현재 트리를 대량 삭제한다.\r\n- 자동 커밋을 브랜치에 쌓지 않는다. 주기적 측정 결과는 커밋이 아니라 DB 나 `docs/reports/` 의 최종 산출물로 남긴다. 기록이 커밋을 만들어야 한다면 같은 파일을 덮어쓰고 마지막 상태 하나만 커밋한다. 워커·스케줄러가 `git commit` 을 반복 호출하는 경로를 새로 만들지 않는다.\r\n\r\n### 6.1 ⚠️ 도구가 결론을 내릴 수 없는 지점 (사람이 판단한다)\r\n\r\n**자동 커밋이 쌓인 브랜치는 계보가 base 와 같아서 §5 의 두 검사만으로는 `유지`(살아 있는 작업)가 된다. 그러나 규칙상으로는 태그 아카이브 대상이다.**\r\n\r\n실측 `backup/macmini-preIA-20260723`: merge-base 가 존재하므로(`808e5b0`) `계보 다름` 이 아니고, 패치 169개가 남았으므로 `merged` 도 아니다 → `mergedState` 판정은 `unmerged`. 하지만 고유 변경은 4파일뿐이고 나머지는 `ops: record ...` 형태의 반복 커밋이다.\r\n\r\n**판정 신호**: `커밋 수 ≫ 변경 파일 수`. `scripts/prune_branches.py` 는 이 신호를 `아카이브 검토` 로 **표면화하고 절대 삭제하지 않는다** — 신호를 놓치지는 않지만 결론은 내리지 않는다. 실측 출력:\r\n\r\n```text\r\nbackup/macmini-preIA-20260723  아카이브 검토 — 자동커밋 누적 의심 (커밋 169 / 변경 파일 4 = 파일당 42커밋, 삭제 대상 아님)\r\n```\r\n\r\n사람이 할 일:\r\n\r\n1. 고유 변경 4파일을 확인해 필요한 것만 `feat/`·`ops/` 브랜치로 새로 옮긴다 (`git diff --stat origin/<base>...origin/<branch>`).\r\n2. 원래 브랜치는 `git tag archive/macmini-preIA-20260723` 로 보존하고 삭제한다.\r\n\r\n`--apply` 는 이 판정을 지우지 않으므로 사람이 손대지 않으면 계속 남는다 — 실제로 `livevil-research` 에는 현재 `archive/*` 태그가 0개이고 이 브랜치가 그대로 남아 있다(미해결).\r\n\r\n---\r\n\r\n## 7. 점검·정리\r\n\r\n- 한 레포의 원격 브랜치가 **5개를 넘으면** 상태를 판정한다.\r\n\r\n  ```sh\r\n  git fetch origin --prune\r\n  python scripts/prune_branches.py --repo <레포경로> --remote origin            # 판정만 (base 는 §4 로 자동 감지)\r\n  python scripts/prune_branches.py --repo-root <워크스페이스루트> --remote origin # 전 레포 일괄 판정\r\n  python scripts/prune_branches.py --repo <레포경로> --remote origin --apply     # 병합 증명된 것만 삭제\r\n  ```\r\n\r\n  `--base` 를 직접 주려면 §4 로 감지한 값을 넣는다. `main` 을 기본값으로 가정하지 않는다(옵션을 비우면 도구가 §4 우선순위로 감지한다).\r\n\r\n- `--apply` 가 지우는 것은 §5 표의 두 `merged` 판정뿐이다. `계보 다름`(→ 태그 아카이브), `아카이브 검토`(§6.1), `유지`, `판정 불가` 는 지우지 않는다.\r\n- **`--apply` 를 막는 fail-closed 사유 5가지** (판정 전용 실행은 경고만 내고 완주한다 — 아무것도 지우지 않으므로):\r\n  1. **PR 보호 검사 불가** — `gh` 부재·미인증·일시 실패·**응답 없음**. 열린 PR 의 head 가 병합처럼 보이면 지워진다.\r\n     - gh 조회는 **유한·비대화형**이다(`GH_PR_LIST_TIMEOUT_SECONDS` = 20초, stdin 차단 — `ls-remote` 가드와 같은 근거). timeout·stdin 이 없으면 멈춘 gh(네트워크·인증 대기)가 **워크스페이스 전수 순회 전체를 무기한 정지**시킨다(실측: 300초 sleep 하는 가짜 `gh` 로 재현, 외부 kill 로만 종료). 멈춘 gh 는 순회를 세우지 않고 **검사 실패와 같은 경로**로 떨어진다 — 판정 전용은 경고 내고 완주, `--apply` 는 이 사유로 차단.\r\n  2. **PR 목록이 한도에 도달** — 잘려 나간 head 는 본 적이 없으므로 검사가 불완전한 것이다.\r\n  3. **PR 조회 대상 레포 미해석** — 선택한 remote 의 URL 에서 GitHub 레포를 못 뽑으면(비 GitHub 호스트 포함) **어느 레포의 PR 을 확인하는지 모른다.** ⚠️ 이건 gh 호출 자체의 가드가 **못 잡는** 종류다 — 레포를 고정하지 않으면 gh 가 제 기본 레포를 골라 **다른 레포의 PR 목록을 \"성공\" 으로 반환**한다(실측: 원격 2개 + `gh repo set-default` 상태에서 엉뚱한 레포의 PR 55개를 받아왔고, 이 레포의 열린 PR head 는 보호 목록에 없었다). 그래서 조회는 `--repo OWNER/REPO` 로 **못 박는다**.\r\n  4. **원격의 현재 기본 브랜치 조회 실패** — 네트워크·인증·remote 부재·symref 미광고. 복구는 캐시를 고치는 게 아니라 **원격 접근을 복구**하는 것이다.\r\n     - ⚠️ **default 는 로컬 `refs/remotes/<remote>/HEAD` 가 아니라 `git ls-remote --symref <remote> HEAD` 로 라이브 조회한다.** 그 로컬 심볼릭 ref 는 **clone 시점의 캐시**이고 평범한 `fetch` 로 갱신되지 않는다(`git remote set-head` 로만). 원격의 default 가 바뀐 뒤에는 가드가 **\"성공\" 을 보고하면서 옛 default 를 지키고, 진짜 현재 default 를 삭제 대상으로 흘려보낸다**(실측 재현).\r\n     - 라이브 값과 로컬 캐시가 **다르면 둘 다 `유지`** 로 두고(`stale_default_branch`), 사용자에게 `git remote set-head <remote> --auto` 를 안내한다. **스크립트가 로컬 상태를 대신 고치지 않는다.**\r\n     - 비용: 레포당 네트워크 왕복 1회가 는다. 실측으로 27개 레포 전수 순회가 **27초 → 76초**.\r\n  5. **remote 의 fetch URL 과 push URL 이 다름** — `git remote get-url <remote>` 와 `git remote get-url --push --all <remote>` 의 **실효값**이 하나라도 다르면 차단한다(둘 중 하나라도 못 읽어도 차단). 판정·보호·lease 는 전부 **fetch URL 레포**의 tracking ref 를 근거로 하는데, 삭제는 **push URL 레포**로 나간다 — 검사한 적 없는 레포의 브랜치를 지우는 것이다. 실측 재현: 같은 이름·같은 SHA 의 `feat/x` 를 가진 upstream/fork 구성에서 수정 전 코드가 **fork 의 브랜치를 삭제**했고(SHA 가 같아 lease 도 통과했다), upstream tracking ref 까지 부수적으로 지워졌다.\r\n     - ⚠️ **`--delete-without-pr-check` 로 우회되지 않는다.** 그 플래그는 \"PR 목록을 손으로 확인했다\"는 증명인데, PR 목록을 아무리 확인해도 **판정 근거 레포와 삭제 대상 레포가 같아지지는 않는다.** default 가드와 같이 override 없는 차단이다.\r\n     - 복구는 플래그가 아니라 remote 설정 교정이다 — `pushurl`(또는 `pushInsteadOf`) 을 해제하거나, push 대상을 **별도 remote 로 등록해 그쪽을 `--remote` 로 재판정**한다. `get-url` 은 `pushInsteadOf` 재작성까지 실효값으로 드러내므로 그 형태도 잡힌다.\r\n     - 실측: 워크스페이스 27개 레포 전수에서 split remote **0개** — 이 가드로 새로 막히는 레포는 없다.\r\n  - 로컬 모드는 `origin` 을 proxy 로 쓴다(3·4 공통). 로컬 모드에는 push 자체가 없으므로 5 는 해당 없음이다. 우회는 `--delete-without-pr-check` 하나뿐이고(사유 5 는 그것으로도 안 열린다), **그것이 명시적·가시적 행위가 되도록** 설계됐다.\r\n\r\n### 7.1 삭제하는 방법 — 원자적 lease, check-then-delete 금지\r\n\r\n판정은 **로컬 tracking ref** 를 근거로 한다. 다른 머신이 그 사이 원격을 진전시켰으면 그 ref 는 낡은 값이다. 그런데 삭제가 \"현재 원격 tip\" 을 무조건 지우면 **이 판정이 한 번도 본 적 없는 커밋이 사라진다.** Windows 개발 머신과 Mac Mini 가 같은 레포를 쓰므로 실제로 일어날 수 있다.\r\n\r\n`tip 을 비교한 뒤 삭제` 는 이 문제를 막지 못한다 — 비교와 삭제 사이에 창이 남는다. **기대 SHA 를 삭제 명령 자체에 실어 보낸다.**\r\n\r\n**삭제 근거는 두 개다** — \"브랜치 tip 이 판정한 그대로다\" **그리고 \"그 패치가 base 에 있다\"**. 브랜치 lease 만 걸면 판정 이후 base 가 force-push·reset 됐을 때 브랜치 tip 은 그대로라 lease 가 통과하고, **그 커밋을 담은 마지막 원격 ref 가 삭제된다**(throwaway 원격에서 재현: base 를 머지 이전으로 되돌린 뒤 stale 판정으로 `--apply` → `삭제 완료`, 이후 `git branch --contains <B>` 출력 없음). 그래서 두 기대값을 모두 실은 **하나의 atomic push** 를 쓴다.\r\n\r\n```sh\r\n# 원격 삭제 — 브랜치 tip 과 base tip 두 기대값을 한 push 에 실는다\r\ngit push --atomic \\\r\n  --force-with-lease=refs/heads/<base>:<판정baseSHA> \\\r\n  --force-with-lease=refs/heads/<branch>:<판정SHA> \\\r\n  origin <판정baseSHA>:refs/heads/<base> :refs/heads/<branch>\r\n```\r\n\r\n- base 쪽 refspec 은 **아무것도 쓰지 않는다**: base 가 안 움직였으면 \"up to date\"(no-op), 움직였으면 lease 가 push 전체(삭제 포함)를 거부한다. ⚠️ **lease 를 빼고 refspec 만 넣으면 안 된다** — 그러면 reset 된 base 를 fast-forward 로 **되미는 write** 가 실제로 나간다. lease 가 그것까지 막는 것을 실측했다.\r\n- base 가 **어느 방향으로든** 움직였으면(전진 포함) `base 가 진전됨 — fetch 후 재판정` 으로 멈춘다. force 전환·재시도 금지.\r\n- 원격 tip 이 판정 SHA 와 다르면 git 이 `stale info` 로 **거부**한다. 그때는 **재시도하거나 force 로 전환하지 않는다** — `원격이 진전됨 — fetch 후 재판정` 으로 보고하고 멈춘다.\r\n- **잔여 한계(정직하게)**: base 검증은 같은 push 커넥션의 **ref advertisement 시점**에 클라이언트가 수행한다(base 쪽은 실제 커맨드가 전송되지 않는 no-op 이라 서버측 CAS 는 브랜치 삭제에만 걸린다). 창이 \"판정↔삭제 사이(수 분~무기한)\"에서 \"단일 push RPC 내부(밀리초)\"로 줄어드는 것이지 0 은 아니다 — 브랜치 lease 자체의 한계와 같은 수준이다.\r\n- **§6 태그 아카이브 경로는 base lease 가 필요 없다** — 태그 push 성공이 삭제에 선행하므로 base 가 무엇을 하든 tip 은 이미 보존돼 있다.\r\n- `git push origin --delete <branch>` 는 lease 가 없으므로 **쓰지 않는다.** (§6 의 태그 아카이브 예시도 같은 이유로 lease 형태를 쓰는 것이 안전하다 — 아카이브 태그를 밀어둔 뒤라 손실 위험은 낮지만, 두 경로가 다른 문법을 쓰면 다음 구현자가 어느 쪽을 표준으로 볼지 모른다.)\r\n- 이 규칙은 `scripts/prune_branches.py` 와 `/cp done` 의 Phase 4 **양쪽에 동일하게** 적용된다. 한쪽만 원자적이면 다른 쪽이 사고 경로로 남는다.\r\n\r\n**로컬 삭제는 조상 검사를 반복하지 않는다.** `patch-merged` 는 squash·rebase 머지에서 나오고, 그 경우 브랜치 tip 이 base 의 조상이 **아닌 것이 정상**이다(커밋이 새로 쓰였으니까). 그래서 `git branch -d` 는 내용 증명이 끝난 뒤에도 **거부**한다 — 그대로 두면 그런 완료마다 로컬 브랜치가 쌓인다.\r\n\r\n- **로컬 삭제도 원자적으로 한다** — 원격과 같은 이유다. 판정과 삭제 사이에 다른 프로세스가 로컬 브랜치를 진전시키면 비교-후-삭제는 그 커밋을 지운다.\r\n\r\n  원격과 마찬가지로 **base 기대값도 같은 트랜잭션에 싣는다.** `update-ref --stdin` 은 열거된 ref 를 **동시에 잠그고 all-or-nothing** 으로 처리한다.\r\n\r\n  ```sh\r\n  # NUL 종단(-z) 으로 verify + delete 를 한 트랜잭션에 싣는다\r\n  printf 'verify\\0refs/heads/<base>\\0<판정baseSHA>\\0delete\\0refs/heads/<branch>\\0<판정SHA>\\0' \\\r\n    | git update-ref -z --stdin\r\n  ```\r\n\r\n  기대값이 현재 값과 다르면 git 이 `is at <실제> but expected <기대>` 로 **거부**한다 → \"로컬이 진전됨 — 재판정 필요\" / \"base 가 진전됨 — 트랜잭션 전체 거부\" 로 보고하고 멈춘다.\r\n\r\n  ⚠️ **Windows 함정**: text 모드 subprocess 는 입력의 `\\n` 을 `\\r\\n` 으로 번역해 LF 종단 `--stdin` 형식을 `fatal: … extra input` 으로 깨뜨린다(실측). **NUL 종단(`-z`)을 쓴다.**\r\n- **삭제 조건은 그대로 둘 다 참일 때만**: ① `mergedState` 가 `merged`/`patch-merged`/`merged-deleted` (내용 증명) ② 로컬 tip = 판정 SHA (SHA 증명). `unknown`·`unmerged`·판정 SHA 없음은 전부 금지다. `git branch -d` 는 patch 머지를 판정할 능력이 없으므로 이 자리에서 쓰지 않는다.\r\n- ⚠️ **체크아웃된 브랜치는 건너뛰는 게 아니라 먼저 벗어난다.** `update-ref -d` 는 `git branch -D` 와 달리 현재 체크아웃된 브랜치도 **말없이 지워 HEAD 를 깨뜨린다**(git 2.53 실측) — 그건 사실이므로 가드는 유지한다. 그런데 **건너뛰면 더 나쁜 일이 생긴다**: `/cc` 직후 `/cp done` 은 **최빈 경로**이고 그때 task 브랜치는 당연히 체크아웃 상태다. 건너뛰면 이후 완료 기록(history 작성·task 삭제)이 **이미 머지됐고 원격 ref 도 지워진 그 브랜치 위에서** 커밋되어 **base 에 영영 도달하지 못한 채 고립된다.**\r\n  - 순서: **① dirty 검사**(비어 있지 않으면 멈춘다 — 변경을 base 로 끌고 가지 않는다) → **② base 로 checkout** → ③ 원격 lease 삭제 → ④ 로컬 삭제.\r\n  - **이동 검사는 원격 삭제보다 먼저** 한다. 그래야 dirty 로 멈출 때 \"원격만 지워진\" 어중간한 상태가 안 생긴다.\r\n  - 이동 실패(dirty·checkout 실패)는 **fail-closed** — 아카이브에 진입하지 않는다.\r\n- **로컬 ref 가 아예 없으면 \"이미 정리됨\"(성공)** 이다. 다른 머신에서 완료 처리하면 머지된 원격 브랜치는 있는데 `refs/heads/<branch>` 는 없다. 없는 tip 은 판정 SHA 와 같을 수 없으므로, 그대로 두면 **사실이 아닌 \"미푸시 커밋 있음\"** 으로 멈춘다. **ref 존재 + tip ≠ 판정 SHA**(진짜 미푸시 커밋 → 보류)와 명확히 구분한다.\r\n- **PR 상태 조회는 레포를 못 박는다** — `gh pr list --repo <OWNER/REPO>`. remote URL 에서 해석하고, **해석 불가면 조회 불가와 같은 fail-closed**. 이 규칙은 `/cp done` 과 `scripts/prune_branches.py` 와 board 빌더 **세 곳 모두**에 적용된다. 고정하지 않으면 gh 가 제 기본 레포를 골라 **다른 레포의 PR 을 \"성공\" 으로 반환**하고, 동명 PR 이 거짓 증거가 된다(실측 재현).\r\n- 로컬에 아직 push 되지 않은 커밋이 있으면(tip ≠ 판정 SHA) **보류**한다.\r\n- 즉 열린 것은 \"증명이 끝난 브랜치에 대해 중복 조상 검사를 우회하는 것\" 하나뿐이고, **증명 없는 강제 삭제는 열리지 않는다.** 반대로 증명된 브랜치를 `-d` 거부만으로 방치하는 것도 금지다.\r\n- **삭제 자동화 없이 생성 자동화를 켜지 않는다.** 브랜치 자동 생성만 도입하면 이미 실측된 누적 문제(§0.5)를 가속한다. `lens.config.json` 의 `requireTaskBranch` 는 ① 선행 정리 1회 완료 ② `prune_branches.py` 가 이 레포에서 동작 — 두 조건이 충족된 뒤 `true` 로 전환한다. 두 조건 없이 `true` 로 켜는 것도, 조건이 갖춰졌는데 `false` 로 방치하는 것도 금지다(정리 수단을 생성 기능과 같은 릴리즈에 넣는다).\r\n- 열린 PR 점검: 내용이 이미 base 에 반영된 PR 은 닫는다. 방치하면 열린 PR 목록이 남은 작업을 반영하지 못한다.\r\n- 관련 설정 키(`lens.config.json`): `baseBranch`(레포별 명시 맵) / `requireTaskBranch` / `autoDeleteMergedBranch` / `branchPrefixes`.\r\n","truncated":false,"stale":false,"branch":null,"base":null},{"id":"codex-integration","folder":"rules","title":"Codex CLI 연동 규칙","date":"","hasMd":true,"hasHtml":false,"mdPath":"rules/codex-integration.md","htmlPath":null,"mdInline":"# Codex CLI 연동 규칙\r\n\r\nLens v3.1에서 OpenAI Codex CLI를 활용한 pre-mortem 이종 모델 검증의 표준 규칙.\r\n\r\n## 1. 개요\r\n\r\n### Codex CLI란\r\n\r\n- OpenAI가 제공하는 codex 전용 CLI 도구 (모델은 머신의 모델 순위표에서 최상위를 자동 선택 — §4 resolver. 2026-07 현재 1등: `gpt-5.6-sol`)\r\n- 로컬 셸에서 비대화형 호출 가능 (`codex exec`)\r\n- ChatGPT Plus/Pro/Max 구독으로 인증 (별도 API 키 불필요)\r\n\r\n### Lens가 Codex를 사용하는 이유\r\n\r\n- **이종 모델 병렬 검증**: Claude 계열과 다른 아키텍처/학습 데이터의 모델로 교차 검증\r\n- **블라인드 스팟 해소**: 단일 모델 편향(유사한 추론 경로, 동일한 놓침)을 상쇄\r\n- **비용 효율**: Plus/Pro/Max 구독 내에서 추가 과금 없이 활용\r\n\r\n### 사용 지점 (v3.9+)\r\n\r\nCodex 는 단순 \"Claude 결과 검토자\"가 아니라 **공동 조사자·공동 검증자**다. 네 지점에서 이종 모델 더블 검증을 수행한다:\r\n\r\n- `/cp PLAN` **Phase 0.5 — 병렬 독립 조사**: Goal 정의 직후 Codex 가 레포를 스스로 읽고 자기 접근안+리스크를 제시 (Claude 의 Plan A 설계와 병렬). 결과는 Phase 2.4 에서 합성.\r\n- `/cp PLAN` **Phase 2.4 — 듀얼 합성·교차검증**: Claude 안과 Codex 안의 합의/분기 분류 → 분기 재검증.\r\n- `/cp PLAN` **Phase 3 — Pre-mortem**: 통합안의 최종 리스크 점검 (Phase 0.5 에서 Codex 조사가 이미 돌았으면 Opus 단독, 아니면 Codex 병렬).\r\n- `/cc` **Phase 4.5 — 코드리뷰 게이트**: 매 반복의 코드 변경을 Codex 가 독립 리뷰. Supervisor pass + Codex pass 둘 다여야 진행.\r\n\r\n**trivial 작업(오타·변수명·한 줄 수정)은 모든 지점 skip** — 불필요한 호출 회피. Codex 부재/실패는 항상 graceful degrade (Claude/Supervisor 단독 진행 + 플래그 기록, 블로킹 금지). **단 예외 — `/cp deep` S4 교차 협의는 하드 게이트**(Constitution 2조): 미감지/미인증 시 degrade 하지 않고 **정지·보고**한다(사용자가 \"Codex 없이 진행\" 명시 시만 1회 우회). 위 graceful degrade 는 `/cp`·`/cc` 의 듀얼검증 지점에 적용된다.\r\n\r\n## 2. 사전 조건 감지\r\n\r\nClaude Code 세션에서 Codex CLI가 설치·로그인됐는지 3단계 fallback으로 확인한다.\r\n\r\n### 단계 1: PATH 확인\r\n\r\n```bash\r\ncommand -v codex\r\n```\r\n\r\n`/usr/local/bin/codex` 등 경로가 출력되면 사용 가능.\r\n\r\n### 단계 2: VSCode ChatGPT 확장 번들 경로\r\n\r\nPATH에 없을 경우, VSCode ChatGPT 확장에 포함된 바이너리를 탐색한다.\r\n\r\n```bash\r\nls $HOME/.vscode/extensions/openai.chatgpt-*/bin/windows-x86_64/codex.exe 2>/dev/null | head -1\r\n```\r\n\r\n출력된 절대경로를 `CODEX_BIN` 변수에 저장하여 이후 호출에 사용한다.\r\n\r\n### 단계 3: 감지 실패\r\n\r\n위 두 단계 모두 실패하면 `codex_available=false` 로 마킹한다.\r\n\r\n**Fallback 동작**: Pre-mortem은 Opus 단독으로 수행하고, 결과 문서에 다음 문구를 명시한다.\r\n\r\n> Codex 미설치 — 단일 모델 pre-mortem\r\n\r\n## 3. 인증 확인\r\n\r\n```bash\r\ncodex login status\r\n```\r\n\r\n- 정상 응답: `Logged in using ChatGPT`\r\n- 미인증 상태: 사용자에게 `codex login`을 수동 실행하도록 안내\r\n- 로그인 URL이 자동으로 브라우저에 열리므로 대화형 실행 필요\r\n\r\n미인증 상태에서 호출하면 에러가 발생하므로 반드시 선제적으로 확인한다.\r\n\r\n## 4. 표준 호출 패턴\r\n\r\n```bash\r\n# ① 모델 resolver (v3.24+) — 순위표 1등을 매 호출 직전 동적 선택. 이름을 문서에 못박지 않는다.\r\nCODEX_MODEL=$(node -e \"const p=require('path'),os=require('os');const d=require(p.join(os.homedir(),'.codex','models_cache.json'));const m=d.models.filter(x=>x.visibility==='list'&&x.supported_in_api!==false).sort((a,b)=>(a.priority??99)-(b.priority??99))[0];if(!m||!m.slug)process.exit(1);console.log(m.slug)\" 2>/dev/null) || CODEX_MODEL=\"\"\r\nMODEL_ARG=(); if [ -n \"$CODEX_MODEL\" ]; then MODEL_ARG=(-m \"$CODEX_MODEL\"); else echo \"⚠️ 모델 resolver 실패 — codex config 기본 모델로 진행\"; fi\r\n\r\n# ② 표준 호출\r\nOUT=$(mktemp /tmp/codex_XXXXXX.txt)   # 고유 파일명 — 병렬 호출 충돌 방지\r\nDEPTH=xhigh                            # 소규모; 대규모 리뷰·협의는 high (§\"깊이·시간 분기\")\r\nTMO=180                                # 소규모 180 / 중 300 / 대규모 600 (§\"깊이·시간 분기\")\r\ntimeout \"$TMO\" codex exec --skip-git-repo-check \\\r\n  \"${MODEL_ARG[@]}\" \\\r\n  -c model_reasoning_effort=\"$DEPTH\" \\\r\n  -c service_tier=fast \\\r\n  -o \"$OUT\" \\\r\n  \"프롬프트 내용\"\r\nRC=$?                                  # 124 = $TMO 초과 (§7)\r\n# 응답 본문은 \"$OUT\" 에 떨어진다 (§5). RC==124 면 부분 본문 수거 or degrade.\r\n```\r\n\r\n### 플래그 설명\r\n\r\n- `exec` — 비대화형 1회 응답 모드. TUI를 띄우지 않고 결과 출력\r\n- `--skip-git-repo-check` — 현재 디렉토리가 git repo가 아니어도 실행 허용. Pre-mortem은 repo와 무관하므로 필수\r\n- `\"${MODEL_ARG[@]}\"` — **순위표 1등 동적 지정 (v3.24+)**: `~/.codex/models_cache.json`(codex 가 자동 갱신하는 모델 순위표)에서 `visibility=list` + `supported_in_api` 중 `priority` 최소(=1등, 2026-07 현재 `gpt-5.6-sol`) slug 를 매 호출 직전 선택. 특정 모델명을 문서에 못박지 않고, 사용자가 데스크톱 앱에서 바꾼 config 기본값에도 의존하지 않는다. resolver 실패(순위표 부재·스키마 변경·빈 목록) 시 배열이 비어 `-m` 자체가 생략되고(빈 `-m \"\"` 전달 원천 차단) ⚠️ 플래그를 stdout 에 남긴다 — **이 플래그는 호출한 스킬의 결과 보고 상단에 복사 의무** (조용한 강등 금지)\r\n- `timeout \"$TMO\"` — **상한 가드(v3.19+, v3.25 규모 분기)**: codex 가 제한 시간 안에 못 끝내면 강제 종료(exit 124). 무한 동기 대기를 차단한다. **상한은 입력 규모로 분기**한다(소규모 180 / 중 300 / 대규모 600 — §\"깊이·시간 분기\"). 초과 시 §7 — `-o` 부분 본문이 있으면 \"미완\" 표기로 수거, 없으면 degrade. (coreutils `timeout` — git-bash/mac/linux 공통)\r\n- `-c model_reasoning_effort=\"$DEPTH\"` — **깊이 다이얼**: 입력 규모로 분기(§\"깊이 분기\"). 소규모(pre-mortem 200단어·빠른 조사)=`xhigh`, 대규모(전체 diff 리뷰·딥스펙 전량 협의)=`high`. 토큰 비용 비고려 방침은 유지하되, 대규모 xhigh 의 시간 비선형 폭증만 회피.\r\n- `-c service_tier=fast` — **속도 다이얼**: API 부하 시 큐 우선권. *별개 다이얼*이라 깊이와 동시 적용 가능. (현행 codex 0.137+ 정식 키는 `fast`; 과거 `priority` 는 동일 동작의 **레거시 별칭**으로 아직 매핑되나 미래 제거 대비 `fast` 로 통일. 라이브 실측 EXIT 0)\r\n- `-o \"$OUT\"` — 최종 답변 본문만 파일로 출력. 메타(`session id`/`tokens used`) 섞인 stdout을 awk로 파싱할 필요가 없다\r\n\r\n### 깊이·시간 분기 — 소규모 xhigh·180s / 대규모 high·600s (v3.19+, 시간 축 v3.25+)\r\n\r\n깊이와 속도는 **독립 다이얼**이다. `reasoning_effort` 는 추론 토큰량(품질·깊이), `service_tier` 는 큐 우선권(지연)을 조절한다 — 한쪽이 다른 쪽을 깎지 않는다.\r\n\r\n**xhigh 는 입력이 작을 때만 빠르다.** 실측(gpt-5.5; 2026-07-15 gpt-5.6-sol 도 xhigh/high 단계 동일 지원 확인 — 깊이 분기 규칙은 모델 세대 무관 유지): 소규모에서 `low` 는 `xhigh` 보다 토큰 ~6배 + 속도 이득 0 → 소규모는 xhigh 가 오히려 싸고 빠르다. **그러나 입력이 크면(전체 diff 리뷰·딥스펙 전량 협의) xhigh 의 추론 시간은 비선형으로 폭증**한다. `service_tier=fast` 는 raw 속도가 아니라 **혼잡 시 큐 우선권**이라 compute-bound 인 이 폭증을 깎지 못한다. 따라서 깊이를 입력 규모로 분기한다:\r\n\r\n| 호출 지점 | 입력 규모 | DEPTH | TMO | 실행 |\r\n| --- | --- | --- | --- | --- |\r\n| Pre-mortem (200단어 제한) | 작음 | `xhigh` | `180` | 동기 |\r\n| `/cp` P0.5 독립 조사 | 중 (background·비대기) | `xhigh` | `300` | background |\r\n| `/cc` P4.5 코드리뷰 (전체 diff) | **큼** | `high` | `600` | **background 필수** |\r\n| `/cp deep` S4 교차 협의 (딥스펙 전량) | **큼** | `high` | `600` | **background 필수** |\r\n\r\n소규모 xhigh 는 메모리 룰(소규모 xhigh always) 그대로 보존한다. 대규모는 high 로 내려 추론 시간을 잡는다.\r\n\r\n**시간 축을 규모로 분기하는 이유 (v3.25 — 실측 2회)**: 깊이만 분기하고 시간은 180초로 고정했더니, **대규모 협의가 반복적으로 상한에 걸려 죽었다.** ① 2026-07-15 모델정책 작업 — 대형 diff 리뷰가 180s 초과 → Supervisor 단독 게이트로 degrade. ② 2026-07-20 계획엔진 개편 협의 — `high`로도 180s 초과, `-o` 본문 **0바이트**. 두 사례 모두 \"작업이 클수록 교차검증이 사라지는\" 방향이라, 하드게이트가 가장 필요한 순간에 정확히 무력화된다. 깊이만 규모에 맞추고 시간을 안 맞춘 것이 설계 결함이었다.\r\n\r\n**대규모는 background 필수**: `timeout 600` 을 동기로 걸면 Bash 도구 상한(600초)과 정면 충돌하고 사용자를 10분간 붙잡는다. 대규모 호출은 `run_in_background: true` 로 띄우고 Claude 는 자기 작업을 진행하다 완료 알림에서 수거한다(§9와 동일 패턴). 이러면 시간을 늘려도 사용자 대기는 0이다.\r\n\r\n**시간을 늘려도 안 풀리는 것 — 프롬프트가 탐색을 유발할 때**: 위 ②에서 실패의 직접 원인은 시간만이 아니라 프롬프트가 *\"레포를 직접 읽고 답하라\"* 로 codex 에게 무제한 파일 탐색을 시킨 것이었다. 대규모 협의는 **판단에 필요한 사실을 프롬프트에 담아 주고 탐색 범위를 명시적으로 제한**한다(예: \"아래 사실만으로 답하라. 탐색은 최대 3개 파일\"). 시간 상한은 안전망이지 탐색 예산이 아니다.\r\n\r\n`fast`(구 `priority`) 는 큰 작업/혼잡 시 보험이며 해는 없다 → 유지.\r\n\r\n### 모델·티어 드리프트 대비 (버전 무관 fallback)\r\n\r\n동적 지정 모델과 `service_tier` 는 **서버측 검증**이라, OpenAI 가 모델을 폐기/리네임하면 호출이 런타임 400(`invalid_request_error`)으로 죽는다. 머신 하드코딩 금지 원칙에 따라 fallback 은 3단:\r\n\r\n- **resolver 실패** (순위표 부재·스키마 변경·빈 목록): `MODEL_ARG` 가 비어 `-m` 자체가 생략됨(§4 ① — codex config 기본 모델 사용) + ⚠️ 플래그 출력. **플래그는 호출한 스킬의 결과 보고에 복사 의무** — 조용한 강등 금지.\r\n- **모델 400**: 동적 선택된 모델이 400(invalid model)이면 **`MODEL_ARG` 를 비우고 1회 재시도** (codex config 기본 모델 사용). 특정 모델명에 영구 의존하지 않는다.\r\n- **티어**: `service_tier=fast` 가 거부되면 `-c service_tier` 자체를 생략하고 재시도 (기본 티어). `fast`/`priority` 둘 다 미지원인 구버전 대비.\r\n- 이 fallback 은 graceful — 이종검증이 조용히 죽는 대신 기본값으로라도 돈다. 깨짐은 `/crv` 감사가 `codex --version` + `models_cache.json` probe(순위표 스키마·1등 slug 변동)로 선제 감지.\r\n\r\n> 참고: codex 바이너리 절대경로는 `CODEX_BIN=$(ls $HOME/.vscode/extensions/openai.chatgpt-*/bin/windows-x86_64/codex.exe 2>/dev/null | head -1)` 로 잡고 `\"$CODEX_BIN\"` 으로 호출 (PATH 부재 시, §2 단계 2).\r\n\r\n## 5. 응답 수거\r\n\r\n`-o \"$OUT\"` 플래그를 쓰면 codex 가 **최종 답변 본문만** 해당 파일에 쓴다. 메타(`session id`/`tokens used`)가 섞인 stdout 을 파싱할 필요가 없다.\r\n\r\n### 본문 읽기\r\n\r\n```bash\r\nBODY=$(cat \"$OUT\")\r\n```\r\n\r\n읽은 `$BODY` 를 결과 문서에 삽입한다. **고유 파일명 필수** — Phase 0.5·2.4·4.5 가 background 병렬로 동시에 돌 수 있으므로, `mktemp /tmp/codex_XXXXXX.txt` 같은 고유 경로를 호출마다 새로 잡아 덮어쓰기를 막는다.\r\n\r\n### (참고) -o 없이 stdout 만 받은 경우\r\n\r\n구버전 codex 등으로 `-o` 를 못 쓰면 stdout 에 메타가 섞인다. 본문은 `^codex$` 라벨 다음 줄 ~ `^tokens used$` 이전 줄이며, 폴백 추출은:\r\n\r\n```bash\r\nBODY=$(echo \"$OUTPUT\" | awk '/^codex$/{flag=1; next} /^tokens used$/{flag=0} flag')\r\n```\r\n\r\n`-o` 가 동작하는 환경에선 이 awk 폴백을 쓰지 않는다.\r\n\r\n## 6. Pre-mortem 프롬프트 템플릿\r\n\r\n```\r\n다음 작업 계획의 허점을 찾아주세요. 200단어 이내, 순수 텍스트.\r\n\r\n## 계획\r\n{계획 문서의 목표 + 기술적 접근 섹션}\r\n\r\n## 평가 관점\r\n1. 실패할 수 있는 3가지 시나리오 (구체적 트리거 + 결과)\r\n2. 누락된 엣지 케이스\r\n3. 기술적 블라인드 스팟\r\n\r\nJSON 형식 사용하지 말고 한국어로 답변.\r\n```\r\n\r\n### 템플릿 설계 의도\r\n\r\n- **200단어 제한**: 응답 시간 단축, 핵심 허점에 집중\r\n- **순수 텍스트**: 파싱 편의성 (JSON/마크다운 파싱 불필요)\r\n- **3가지 시나리오 강제**: 단일 실패 모드가 아닌 다중 관점 유도\r\n- **한국어 명시**: codex 모델은 영문 응답이 기본값이므로 명시적 지시 필요\r\n\r\n## 7. 에러 처리 — 규모별 상한 + 부분 수집/degrade (v3.19+, 규모 분기 v3.25+)\r\n\r\n모든 codex 호출은 `timeout \"$TMO\"`(§4) 로 감싼다. **상한은 고정 180 이 아니라 입력 규모로 정한다**(180/300/600 — §\"깊이·시간 분기\"). 두 층위의 보호가 있다:\r\n\r\n1. **background 비대기 지점**(`/cp` P0.5 조사, 모든 대규모 호출): Claude 는 애초에 기다리지 않고 자기 작업을 진행하다 gate 에서 ready 면 수거·미완이면 degrade. (기존 동작 — `timeout` 은 orphan 강제 정리 보너스.) **대규모는 상한이 600 이므로 반드시 이 경로로 띄운다** — 동기로 걸면 Bash 도구 상한과 충돌하고 사용자를 10분 붙잡는다.\r\n2. **동기·하드게이트 지점**(`/cp deep` S4, `/cc` P4.5 더블게이트): codex 결과를 받아야 진행하므로 **실제로 대기**한다. 여기서 `timeout` 이 **무한 대기를 끊는 핵심**이다. 상한 초과(exit 124) 시:\r\n   - **`-o $OUT` 자유형**: `$OUT` 에 부분 본문이 있으면 **\"⚠️ Codex 부분 결과($TMO 초과·미완)\"** 로 표기해 수거·반영한다. 비어있으면 degrade.\r\n     > ⚠️ **부분 수거는 실제로는 거의 안 된다 (실측 2026-07-20)**: `-o` 는 최종본을 쓰는 것으로 보인다 — exit 124 시 `$OUT` 이 **0바이트**였다. \"부분 수거\"에 기대지 말고 **애초에 상한을 규모에 맞게 잡는 것**이 1차 방어다. 부분 수거는 best-effort 2차 방어로만 취급한다.\r\n   - **`--json` 구조화 review**: 부분 JSON 은 파싱 불가 → degrade(\"Codex 리뷰 미완 — 단독 게이트\").\r\n\r\ncodex 가 느리든 hang 하든 상한이면 무조건 끊긴다. orphan 프로세스는 `timeout` kill + 세션 종료(Stop 훅)가 정리한다.\r\n\r\n**초과가 반복되면 상한을 올리기 전에 프롬프트를 먼저 의심한다**: 실측 실패 2건 모두 원인이 \"codex 에게 레포 무제한 탐색을 시킨 프롬프트\"였다. 대규모 협의는 판단에 필요한 사실을 프롬프트에 담고 탐색 범위를 명시 제한한다(§\"깊이·시간 분기\").\r\n\r\n| 상황 | 대응 |\r\n|------|------|\r\n| **상한 초과 (exit 124)** | $OUT 부분 본문 있으면 \"미완\" 표기 수거, 없으면 degrade. 같은 지점에서 2회 이상 반복되면 **상한·프롬프트 범위를 재조정**(규칙 개정 사유). **무한 대기 금지.** |\r\n| **gate 시점에 미완 (background)** | 기다리지 않고 degrade — \"Codex 미완 — 단독 진행\" 플래그 기록 |\r\n| **인증 만료 / 호출 실패** | \"Codex 실패: {요약}\" 기록 후 Claude/Opus 단독 진행 |\r\n| **stderr 에러** | 결과 섹션에 \"Codex 에러\" 블록으로 포함 (블로킹 금지) |\r\n\r\n> **하드게이트 예외 주의**: `/cp deep` S4 는 Codex *부재/미인증* 시 degrade 금지(정지·보고)지만, *180초 초과* 는 다르다 — codex 는 응답 중이었으므로 부분 결과를 \"미완 협의\"로 반영하고 진행하되, 커버리지 공백이 남으면 S5 회귀로 보강(§8.5). 무한 대기로 사용자를 잡지 않는다.\r\n\r\n## 8. 비용 및 성능 가이드\r\n\r\n| 항목 | 값 |\r\n|------|-----|\r\n| Pre-mortem 1회당 토큰 사용량 | 가변 — **비용 비고려**(깊이·속도 우선 방침). xhigh 는 소규모에서 오히려 토큰이 적음 |\r\n| 응답 시간 | 소규모 pre-mortem ~5–10초(xhigh). 대규모 리뷰·협의=high + `timeout 180` 상한(§7). 부하 시 fast 가 큐 우선권 |\r\n| 과금 | ChatGPT Plus/Pro/Max 구독 시 별도 과금 없음 |\r\n\r\n### 주의사항\r\n\r\n- 구독 등급에 따라 일일 사용량 제한 존재 (구체 수치는 OpenAI 공식 페이지 참조)\r\n- 연속 호출 시 rate limit 가능 — pre-mortem 1회/계획이면 일반적으로 문제 없음\r\n- 로컬 네트워크 상태에 따라 응답 시간 변동\r\n\r\n## 8.5 듀얼 검증 호출 패턴 (v3.9+)\r\n\r\n§4 표준 호출 + §5 응답 수거 + §7 에러 처리를 그대로 공유한다. 조사·리뷰에 추가되는 규칙:\r\n\r\n### 병렬성 — run_in_background\r\n\r\n조사(Phase 0.5)·코드리뷰(Phase 4.5)는 Claude 의 본 작업과 **진짜 병렬**이어야 한다. Bash tool 의 `run_in_background: true` 로 Codex 를 띄우고, Claude 는 자기 작업(Plan A 설계 / Supervisor 검토)을 진행한 뒤 백그라운드 출력을 수거한다. sleep/폴링 금지 — 완료 알림을 받는다. **gate 도달 시 ready 면 수거, 미완이면 기다리지 않고 degrade**(§7) — 숫자 timeout 없음.\r\n\r\n### 파일 접근 — 프로젝트 루트에서 실행\r\n\r\nPre-mortem 은 repo 무관(`--skip-git-repo-check`)이지만, **조사·코드리뷰는 Codex 가 파일을 읽어야** 한다. 반드시 프로젝트 루트(cwd)에서 `codex exec` 를 호출 — Codex 는 cwd 의 파일에 접근한다.\r\n\r\n### 프롬프트 / 판정\r\n\r\n- **Phase 0.5 독립 조사**: \"이 작업을 직접 조사하고 독립 실행 계획을 제안\" (권장 접근 / 리스크 3 / 관련 파일). 전체 템플릿은 `skills/cp/SKILL.md` Phase 0.5.\r\n- **Phase 4.5 코드리뷰 (구조화·git-aware — v3.13+ 권장)**: 자유형 \"이 diff 를 리뷰\" 프롬프트 + 수동 diff 주입 + 본문 마지막 줄 awk `PASS`/`FAIL` 파싱은 **취약**(diff 잘림·텍스트 휴리스틱). 대신 **`codex exec review`** 가 git 을 직접 읽고 구조화 판정을 낸다 (현행 0.137+ 라이브 실측 확인):\r\n\r\n  ```bash\r\n  # 모델 resolver (§4 ①) 를 먼저 실행해 MODEL_ARG 준비 — 이름 하드코딩 금지\r\n  SCHEMA=$(mktemp /tmp/codex_schema_XXXXXX.json)   # {verdict: pass|fail, high_findings:[...]}\r\n  RES=$(mktemp /tmp/codex_review_XXXXXX.json)\r\n  timeout 180 codex exec review --uncommitted \\\r\n    \"${MODEL_ARG[@]}\" -c model_reasoning_effort=high -c service_tier=fast \\\r\n    --output-schema \"$SCHEMA\" --ephemeral --json > \"$RES\" 2>/dev/null\r\n  # 판정: $RES 의 verdict==fail 또는 high_findings 비어있지 않음 → FAIL\r\n  # 깊이=high (전체 diff 는 대규모 입력 → xhigh 폭증 회피, §\"깊이 분기\").\r\n  # exit 124(180s 초과) → 구조화 JSON 불완전이면 degrade (§7).\r\n  ```\r\n\r\n  - `--uncommitted` (또는 `--base <branch>`) — Codex 가 작업트리 변경을 직접 읽음. **수동 diff 주입 제거**.\r\n  - `--output-schema` — `{verdict, high_findings}` 구조 강제. **awk PASS/FAIL 휴리스틱 제거**.\r\n  - `--ephemeral` — 세션 비영속. orphan 정리(Stop 훅) 의존 완화.\r\n  - ⚠️ **반드시 `codex exec review`** — bare `codex review` 는 `--output-schema`/`--ephemeral` 미노출. `exec review` 만이 review 인자(`--uncommitted/--base`)와 exec 플래그를 동시 노출.\r\n  - **fallback**: `codex exec review` 미지원 구버전이면 기존 자유형 diff 리뷰 + `PASS`/`FAIL`+`[high]` 파싱 (graceful degrade). 전체 템플릿은 `skills/cc/SKILL.md` Phase 4.5.\r\n- **합성/게이트**: 조사 결과는 Claude 가 합의/분기로 분류해 통합 (Phase 2.4). 리뷰 결과는 Supervisor 와 AND 게이트 (둘 다 pass 여야 진행).\r\n\r\n## 9. 관련 파일 / 외부 참조\r\n\r\n### 로컬\r\n\r\n- 스킬: `~/.claude/skills/codex-review/SKILL.md` — Claude Code 안에서 `/codex-review` 호출용 (별도 설치 완료)\r\n- Lens PLAN 모드: `~/.claude/plugins/lens/skills/cp/` — Phase 2.5에서 본 문서 참조\r\n\r\n### 외부\r\n\r\n- 공식 CLI 문서: <https://developers.openai.com/codex/cli/>\r\n- GitHub 저장소: <https://github.com/openai/codex>\r\n- ChatGPT 구독 정책: <https://openai.com/chatgpt/pricing/>\r\n","truncated":false,"stale":false,"branch":null,"base":null},{"id":"document-conventions","folder":"rules","title":"Lens 문서 작성 컨벤션 (Document Writing Conventions)","date":"","hasMd":true,"hasHtml":false,"mdPath":"rules/document-conventions.md","htmlPath":null,"mdInline":"# Lens 문서 작성 컨벤션 (Document Writing Conventions)\r\n\r\n> Lens 플러그인이 생성하는 모든 문서의 작성 규칙 및 표준 정의서\r\n> 버전: 1.0.0 | 작성일: 2026-03-02\r\n\r\n---\r\n\r\n## 적용 범위\r\n\r\n이 컨벤션은 Lens가 **런타임에 생성하는 문서**에 적용된다.\r\n\r\n| 대상 | 생성 주체 | 현재 파일 |\r\n|------|-----------|-----------|\r\n| 작업계획서 (Work Plan) | `/cp` | `docs/YYYY-MM-DD-{slug}.md` |\r\n| 실행 결과 합성 | `/cc` | `.lens/results/synth-YYYY-MM-DD-{slug}.md` (saveSynthesisResults=true 시) |\r\n| Plan 상태 추적 | `plan-manager.js` | `.lens/plan-state.json` |\r\n| Agent 대시보드 | `agent-tracker.js` | `.lens/agent-dashboard.json` |\r\n\r\n프로젝트 자체 문서(`CLAUDE.md`, `README.md`, `CHANGELOG.md`)의 규칙은 `docs/rules/documentation-guide.md`를 따른다.\r\n\r\n---\r\n\r\n## 1. 문서 네이밍 컨벤션\r\n\r\n### 현재 상태\r\n\r\n| 항목 | 현재 규칙 | 문제점 |\r\n|------|-----------|--------|\r\n| 파일명 | `YYYY-MM-DD-{slug}.md` | slug 생성 규칙이 `plan-manager.js`에만 있고 SKILL.md와 중복 정의됨 |\r\n| 폴더 | `docs/` (기본), `.lens/results/` (/cc) | 작업계획서는 `docs/`, /cc 합성 결과는 `.lens/results/` |\r\n| ID | `plan_${timestamp36}_${hex}` | Plan에만 ID 존재. Agent, Session과 ID 형식이 제각각 |\r\n\r\n### 개선된 규칙\r\n\r\n#### 1.1 파일명 형식\r\n\r\n```\r\n{type}-{YYYY-MM-DD}-{slug}.md\r\n```\r\n\r\n| 접두사 (type) | 문서 종류 | 생성 스킬 | 예시 |\r\n|---------------|-----------|-----------|------|\r\n| `plan` | 작업계획서 | `/cp` | `plan-2026-03-02-jwt-auth-login.md` |\r\n| `result` | 실행 결과 합성 | `/cc` | `result-2026-03-02-seo-audit.md` |\r\n| `report` | 분석/리포트 | 향후 확장용 | `report-2026-03-02-perf-analysis.md` |\r\n\r\n> **근거**: 타입 접두사가 있으면 `ls` 한 번으로 종류별 필터링이 가능하다.\r\n> 현재 `YYYY-MM-DD-slug.md` 형식은 날짜순 정렬에는 유리하지만, 작업계획서와 결과 문서가 섞이면 구분이 안 된다.\r\n\r\n#### 1.2 Slug 생성 규칙 (단일 원천: `plan-manager.js`)\r\n\r\n```javascript\r\n// 규칙: plan-manager.js의 generateSlug()이 유일한 slug 생성 함수\r\n// SKILL.md에서는 \"slug는 plan-manager.js가 생성한다\"고만 명시\r\n\r\n// 허용 문자: 모든 Unicode 문자(\\p{L}), 숫자(\\p{N}), 하이픈\r\n// 최대 길이: 50자\r\n// 단어 수: 3~5개 핵심 키워드\r\n// 1글자 단어: 제외 (filter(w => w.length > 1))\r\n// 폴백: slug가 비어있거나 2자 미만이면 plan-{random_hex_6}\r\n```\r\n\r\n#### 1.3 폴더 구조\r\n\r\n```\r\nproject-root/\r\n├── docs/                        # /cp 작업계획서 (기본 저장 위치, planDir로 변경 가능)\r\n│   ├── 2026-03-02-jwt-auth.md\r\n│   └── 2026-03-01-db-migration.md\r\n├── .lens/\r\n│   ├── results/                 # /cc 합성 결과 (saveSynthesisResults=true 시)\r\n│   │   └── synth-2026-03-02-seo-audit.md\r\n│   ├── plan-state.json          # Plan 상태 추적\r\n│   └── agent-dashboard.json     # Agent 라이프사이클\r\n```\r\n\r\n#### 1.4 ID 형식 통일\r\n\r\n| 엔티티 | 현재 형식 | 통일 형식 |\r\n|--------|-----------|-----------|\r\n| Plan | `plan_${ts36}_${hex4}` | `plan_${ts36}_${hex4}` (유지) |\r\n| Session | `sess_${ts36}_${hex6}` | `sess_${ts36}_${hex4}` (hex 길이 통일) |\r\n| Agent | `agent_${ts36}_${hex4}` | `agt_${ts36}_${hex4}` (접두사 축약) |\r\n\r\n```\r\n공통 패턴: {prefix}_{base36_timestamp}_{hex_random_4}\r\n예시: plan_m1abc_f3d2, sess_m1abc_a1b2, agt_m1abc_c4e5\r\n```\r\n\r\n---\r\n\r\n## 2. 문서 헤더/메타데이터 컨벤션\r\n\r\n### 현재 상태\r\n\r\n| 항목 | 현재 규칙 | 문제점 |\r\n|------|-----------|--------|\r\n| 헤더 | `# Work Plan / 작업계획서` + blockquote 메타 | 파싱 불가. 메타데이터가 자유 텍스트 |\r\n| Plan ID | blockquote 안에 인라인 표기 | 프로그래밍적으로 추출 불가 |\r\n| 날짜 | `Generated by Lens Plan on {YYYY-MM-DD HH:mm}` | 형식만 있고 타임존 규칙 없음 |\r\n\r\n### 개선된 규칙\r\n\r\n#### 2.1 YAML 프론트매터 (필수)\r\n\r\n모든 Lens 생성 문서는 YAML 프론트매터로 시작한다.\r\n\r\n```yaml\r\n---\r\nid: plan_m1abc_f3d2\r\ntype: plan                    # plan | result | report\r\nversion: 1                   # 문서 스키마 버전 (수정할 때마다 증가 아님, 포맷 변경 시만)\r\ncreated: 2026-03-02T14:30:00+09:00   # ISO 8601 + 타임존\r\nupdated: 2026-03-02T15:00:00+09:00   # 최종 수정 시각\r\nstatus: draft                 # draft | approved | executing | completed | failed | cancelled\r\ngenerator: /cp                # 생성한 스킬\r\nlanguage: ko                  # 본문 언어 (ISO 639-1)\r\ntags: [jwt, auth, backend]    # 검색/필터용 태그\r\n---\r\n```\r\n\r\n#### 2.2 필수 vs 선택 필드\r\n\r\n| 필드 | 필수 | 타입 | 설명 |\r\n|------|------|------|------|\r\n| `id` | 필수 | string | 고유 식별자 |\r\n| `type` | 필수 | enum | 문서 종류 |\r\n| `version` | 필수 | integer | 프론트매터 스키마 버전 (현재 `1`) |\r\n| `created` | 필수 | ISO 8601 | 생성 시각 (타임존 포함) |\r\n| `updated` | 필수 | ISO 8601 | 최종 수정 시각 |\r\n| `status` | 필수 | enum | 문서/작업 상태 |\r\n| `generator` | 필수 | string | 생성 스킬명 |\r\n| `language` | 필수 | string | ISO 639-1 언어 코드 |\r\n| `tags` | 선택 | string[] | 태그 목록 |\r\n| `parent_id` | 선택 | string | 연결된 상위 문서 ID |\r\n| `related` | 선택 | string[] | 관련 문서 ID 목록 |\r\n\r\n#### 2.3 `plan-state.json` 스키마와의 정합성\r\n\r\n프론트매터의 `status`와 `plan-state.json`의 `status`는 **반드시 동기화**한다.\r\n상태 변경 시 두 곳 모두 업데이트:\r\n\r\n```\r\n1. plan-state.json의 해당 plan ID 엔트리의 status 변경\r\n2. plan 마크다운 파일의 프론트매터 status 변경\r\n→ 둘 다 plan-manager.js가 책임진다\r\n```\r\n\r\n---\r\n\r\n## 3. 다국어 처리 컨벤션\r\n\r\n### 현재 상태\r\n\r\n| 항목 | 현재 규칙 | 문제점 |\r\n|------|-----------|--------|\r\n| 언어 감지 | \"Respond in the user's language\" (SKILL.md) | 구체적 감지 로직 없음 |\r\n| 헤더 | `## Task / 요청사항` (이중 언어 고정) | 사용자가 영어면 한국어 헤더 불필요 |\r\n| 본문 | \"user's language\" | 기본값 규칙 없음 |\r\n| 설정 | `defaultPlanLanguage: null` (lens.config.json) | 사용 방법 미정의 |\r\n\r\n### 개선된 규칙\r\n\r\n#### 3.1 언어 결정 우선순위\r\n\r\n```\r\n1. lens.config.json의 defaultPlanLanguage (명시적 설정) → \"ko\", \"en\", 등\r\n2. 사용자 입력 언어 자동 감지 (요청 텍스트 기반)\r\n3. 폴백: \"en\" (영어)\r\n```\r\n\r\n#### 3.2 헤더 이중 언어 규칙\r\n\r\n| 본문 언어 | 헤더 형식 | 예시 |\r\n|-----------|-----------|------|\r\n| `en` | 영어만 | `## Task` |\r\n| `ko` | 영어 / 한국어 | `## Task / 요청사항` |\r\n| `ja` | 영어 / 일본어 | `## Task / 要件` |\r\n| `zh` | 영어 / 중국어 | `## Task / 任务` |\r\n| 기타 | 영어 / 해당 언어 | `## Task / Tarea` |\r\n\r\n**규칙**: 영어 헤더는 항상 첫 번째. 비영어 언어일 때만 ` / {번역}` 추가.\r\n\r\n#### 3.3 본문 언어 규칙\r\n\r\n| 요소 | 언어 | 이유 |\r\n|------|------|------|\r\n| 프론트매터 키 | 영어 | YAML 키는 코드. 다국어화 불가 |\r\n| 섹션 헤더 | 이중 언어 (3.2 규칙) | 가독성 + 검색성 |\r\n| 본문 텍스트 | 사용자 언어 | 사용자가 읽는 주요 콘텐츠 |\r\n| 코드/명령어 | 영어 | 코드는 원본 유지 |\r\n| 상태 값 | 영어 (enum) | `draft`, `completed` 등 파싱 가능해야 함 |\r\n\r\n#### 3.4 언어 코드 표 (지원 언어)\r\n\r\n| 코드 | 언어 | Lens 지원 상태 |\r\n|------|------|-----------------|\r\n| `en` | English | 기본값 |\r\n| `ko` | 한국어 | 지원 |\r\n| `ja` | 日本語 | 지원 |\r\n| `zh` | 中文 | 지원 |\r\n| `es` | Español | 지원 |\r\n| `fr` | Français | 지원 |\r\n| `de` | Deutsch | 지원 |\r\n| `it` | Italiano | 지원 |\r\n\r\n---\r\n\r\n## 4. 상태 관리 컨벤션\r\n\r\n### 현재 상태\r\n\r\n| 항목 | 현재 규칙 | 문제점 |\r\n|------|-----------|--------|\r\n| Plan 상태 | `Draft` → (실행) → `Completed \\| Partial \\| Failed` | `Approved`, `Executing` 단계 누락 |\r\n| 상태 위치 | 마크다운 본문 하단 `**Status**: Draft` | 프론트매터와 이원화. 파싱 어려움 |\r\n| `/cc` 결과 | 상태 개념 없음 | 성공/실패 이력 없음 |\r\n| Agent | `pending → running → done \\| error` | Plan 상태와 연결 안 됨 |\r\n\r\n### 개선된 규칙\r\n\r\n#### 4.1 문서 상태 머신\r\n\r\n```\r\n                     ┌──────────┐\r\n                     │  draft   │ ← 최초 생성\r\n                     └────┬─────┘\r\n                          │ 사용자 승인\r\n                     ┌────▼─────┐\r\n                     │ approved │\r\n                     └────┬─────┘\r\n                          │ 실행 시작\r\n                   ┌──────▼──────┐\r\n                   │  executing  │\r\n                   └──┬───────┬──┘\r\n                      │       │\r\n               ┌──────▼──┐ ┌──▼───────┐\r\n               │completed│ │  failed  │\r\n               └─────────┘ └──────────┘\r\n\r\n   취소는 어디서든 가능:\r\n   draft ──→ cancelled\r\n   approved ──→ cancelled\r\n```\r\n\r\n#### 4.2 상태 전이 규칙\r\n\r\n| 현재 상태 | 허용 전이 | 전이 조건 |\r\n|-----------|-----------|-----------|\r\n| `draft` | `approved`, `cancelled` | 사용자 응답 |\r\n| `approved` | `executing`, `cancelled` | 실행 시작 또는 취소 |\r\n| `executing` | `completed`, `failed` | 모든 스킬 완료 또는 에러 |\r\n| `completed` | (최종 상태) | - |\r\n| `failed` | (최종 상태) | - |\r\n| `cancelled` | (최종 상태) | - |\r\n\r\n#### 4.3 상태 변경 시 필수 기록\r\n\r\n| 전이 | 기록 사항 | 기록 위치 |\r\n|------|-----------|-----------|\r\n| → `approved` | `approvedAt` 타임스탬프 | 프론트매터 `updated` + `plan-state.json` |\r\n| → `executing` | 실행 시작 시각 | 프론트매터 `updated` |\r\n| → `completed` | `completedAt` + 결과 요약 | 프론트매터 `updated` + 본문 Execution Result 섹션 |\r\n| → `failed` | `failedAt` + 실패 원인 | 프론트매터 `updated` + 본문 Execution Result 섹션 |\r\n| → `cancelled` | `cancelledAt` + 사유 | 프론트매터 `updated` + `plan-state.json` |\r\n\r\n#### 4.4 `/cc` 결과 문서의 상태\r\n\r\n`/cc`는 계획 없이 즉시 실행하므로 상태 머신이 단순하다:\r\n\r\n```\r\nexecuting → completed | failed\r\n```\r\n\r\n`result` 타입 문서의 프론트매터에 `status: completed` 또는 `status: failed`로 기록.\r\n\r\n---\r\n\r\n## 5. 문서 연결 컨벤션\r\n\r\n### 현재 상태\r\n\r\n| 항목 | 현재 규칙 | 문제점 |\r\n|------|-----------|--------|\r\n| Plan → Result | Plan 파일 하단에 Execution Result 섹션 추가 | 한 파일에 계획과 결과가 혼재. 파일이 길어짐 |\r\n| Result → Plan | 없음 | 역참조 불가 |\r\n| Plan → Plan | 없음 | 연속 작업의 흐름 추적 불가 |\r\n| `/cc` → `/cp` | 없음 | `/cc` 결과를 바탕으로 `/cp` 계획을 세울 때 연결 없음 |\r\n\r\n### 개선된 규칙\r\n\r\n#### 5.1 연결 방식: 프론트매터 참조\r\n\r\n```yaml\r\n---\r\nid: plan_m1abc_f3d2\r\nparent_id: plan_m0xyz_a1b2       # 이 문서의 선행 문서\r\nrelated: [result_m1abc_e3f4]     # 관련 문서 목록\r\n---\r\n```\r\n\r\n#### 5.2 연결 시나리오\r\n\r\n| 시나리오 | 연결 방법 |\r\n|----------|-----------|\r\n| Plan 실행 후 결과 기록 | Plan 파일 하단에 `## Execution Result` 섹션 추가 (현재 방식 유지). 결과가 복잡하면 별도 `result` 문서 생성 후 `related`로 연결 |\r\n| 연속 Plan | 후속 Plan의 `parent_id`에 선행 Plan ID 기재 |\r\n| `/cc` 결과 → `/cp` 계획 | Plan의 `parent_id`에 Result 문서 ID 기재 |\r\n| 실패 후 재시도 | 새 Plan의 `parent_id`에 실패한 Plan ID 기재 |\r\n\r\n#### 5.3 본문 내 참조 형식\r\n\r\n문서 본문에서 다른 문서를 참조할 때:\r\n\r\n```markdown\r\n> 이전 계획 [plan_m0xyz_a1b2](../plans/plan-2026-03-01-db-migration.md) 에서 이어지는 작업입니다.\r\n```\r\n\r\n형식: `[{document_id}]({relative_path})`\r\n\r\n#### 5.4 Execution Result 섹션 (Plan 파일 내)\r\n\r\nPlan 파일에 결과를 인라인으로 추가할 때의 표준 형식:\r\n\r\n```markdown\r\n---\r\n\r\n## Execution Result / 실행 결과\r\n\r\n> Completed on {YYYY-MM-DDTHH:mm:ss+TZ}\r\n\r\n### Outcomes / 실행 결과 상세\r\n- [ ] {기대 결과 1} → {실제 결과}\r\n- [x] {기대 결과 2} → {실제 결과}\r\n\r\n### Files Changed / 변경된 파일\r\n| File | Action | Description |\r\n|------|--------|-------------|\r\n| `src/auth.js` | Modified | JWT 검증 로직 추가 |\r\n| `src/middleware.js` | Created | 인증 미들웨어 신규 생성 |\r\n\r\n### Status: {Completed | Failed}\r\n```\r\n\r\n> **기대 결과 항목**: Plan 단계의 `## Expected Outcomes`의 체크리스트와 1:1 매핑. 달성한 항목은 `[x]`, 미달성은 `[ ]`.\r\n\r\n---\r\n\r\n## 6. 품질 기준 컨벤션\r\n\r\n### 현재 상태\r\n\r\n| 항목 | 현재 규칙 | 문제점 |\r\n|------|-----------|--------|\r\n| 필수 섹션 | SKILL.md에 템플릿으로만 정의 | \"이 섹션이 없으면 거부\" 같은 규칙 없음 |\r\n| 구체성 | 없음 | \"JWT 구현\" vs \"Express.js 4.x에서 RS256 JWT 발급/검증 구현\" 구분 안 됨 |\r\n| 검증 | 없음 | AI가 생성한 문서가 품질 기준을 충족하는지 확인 방법 없음 |\r\n\r\n### 개선된 규칙\r\n\r\n#### 6.1 작업계획서 (Plan) 필수 섹션\r\n\r\n| # | 섹션 | 필수 여부 | 최소 요구사항 |\r\n|---|------|-----------|---------------|\r\n| 1 | 프론트매터 | 필수 | 2.1의 모든 필수 필드 |\r\n| 2 | Task / 요청사항 | 필수 | 사용자 원문 + 1줄 이상 컨텍스트 |\r\n| 3 | Matched Skills | 필수 | 1개 이상 매칭된 스킬. Why Selected 칼럼 비어있으면 안 됨 |\r\n| 4 | Execution Plan | 필수 | Step별 Skill + Input + Expected output. 최소 1 Step |\r\n| 5 | Expected Outcomes | 필수 | 체크리스트 형태. 최소 1개. 검증 가능한 구체적 결과물 |\r\n| 6 | Risks & Considerations | 선택 | 복잡한 작업(3 Step 이상)이면 필수 |\r\n| 7 | Execution Mode | 필수 | Single 또는 Parallel 명시 |\r\n\r\n#### 6.2 구체성 수준 기준\r\n\r\n**나쁜 예** vs **좋은 예**:\r\n\r\n| 항목 | 나쁜 예 (거부) | 좋은 예 (승인) |\r\n|------|---------------|---------------|\r\n| Task | \"인증 구현\" | \"Next.js 14 App Router 프로젝트에 Google OAuth 2.0 로그인 추가\" |\r\n| Expected Output | \"코드 생성\" | \"`src/app/api/auth/[...nextauth]/route.ts` 파일 생성, Google provider 설정 포함\" |\r\n| Input | \"사용자 요청\" | \"사용자의 원본 요청 + `package.json`의 현재 의존성 목록\" |\r\n| Risk | \"문제가 생길 수 있음\" | \"기존 session 기반 인증과 충돌 가능 → 마이그레이션 가이드 포함 필요\" |\r\n\r\n#### 6.3 검증 체크리스트 (AI 셀프 체크)\r\n\r\nPlan 생성 후, 사용자에게 제시하기 전에 AI가 내부적으로 확인:\r\n\r\n```\r\n[ ] 프론트매터의 필수 필드 7개 모두 존재하는가?\r\n[ ] 모든 Matched Skill이 실제 세션에 존재하는 스킬인가?\r\n[ ] Expected Outcomes가 검증 가능한 형태인가? (파일명, 동작, 수치 등)\r\n[ ] Execution Plan의 각 Step에 Input과 Expected Output이 있는가?\r\n[ ] 본문 언어가 3.1 우선순위 규칙을 따르는가?\r\n[ ] 상태가 \"draft\"로 설정되어 있는가?\r\n```\r\n\r\n#### 6.4 실행 결과 (Result) 품질 기준\r\n\r\n| # | 항목 | 필수 여부 | 기준 |\r\n|---|------|-----------|------|\r\n| 1 | 완료 타임스탬프 | 필수 | ISO 8601 |\r\n| 2 | Expected Outcomes 매핑 | 필수 | Plan의 체크리스트와 1:1 대응 |\r\n| 3 | 변경 파일 목록 | 필수 | 파일이 변경된 경우 |\r\n| 4 | 최종 상태 | 필수 | Completed / Failed |\r\n| 5 | 실패 원인 | Failed일 때 필수 | 에러 메시지 또는 원인 설명 |\r\n\r\n---\r\n\r\n## 7. 템플릿 분리 컨벤션\r\n\r\n### 현재 상태\r\n\r\n| 항목 | 현재 규칙 | 문제점 |\r\n|------|-----------|--------|\r\n| Plan 템플릿 | `skills/cp/SKILL.md` 안에 마크다운 코드 블록으로 하드코딩 | 템플릿만 수정하려면 SKILL.md 전체를 편집해야 함. 워크플로우 로직과 템플릿이 혼재 |\r\n| `/cc` 합성 포맷 | `skills/cc/SKILL.md` 안에 ASCII art 박스로 하드코딩 | 동일 문제 |\r\n| 확장 | 불가능 | 사용자가 자신만의 템플릿을 정의할 방법 없음 |\r\n\r\n### 개선된 규칙\r\n\r\n#### 7.1 템플릿 파일 분리 원칙\r\n\r\n```\r\n유지: SKILL.md에는 워크플로우 로직만 기술\r\n분리: 템플릿은 별도 파일로 추출\r\n참조: SKILL.md에서 템플릿 파일 경로를 명시\r\n```\r\n\r\n#### 7.2 템플릿 파일 위치\r\n\r\n```\r\nlens/\r\n├── templates/                    # (신규) 템플릿 파일 디렉토리\r\n│   ├── plan.md                   # /cp 작업계획서 템플릿\r\n│   ├── result.md                 # /cc 실행 결과 합성 템플릿\r\n│   └── execution-result.md       # Plan 파일 하단에 추가하는 결과 섹션 템플릿\r\n├── skills/\r\n│   ├── cp/SKILL.md               # 워크플로우만 (템플릿 → templates/plan.md 참조)\r\n│   └── cc/SKILL.md               # 워크플로우만 (템플릿 → templates/result.md 참조)\r\n```\r\n\r\n#### 7.3 SKILL.md에서의 참조 방식\r\n\r\n```markdown\r\n### 3. Generate Plan Document\r\n\r\nCreate a work plan document using the template at `templates/plan.md`.\r\nRead the template file using the Read tool, fill in all `{placeholder}` values,\r\nand save the result to `.lens/plans/` with the standard file naming convention.\r\n```\r\n\r\n#### 7.4 템플릿 변수 규칙\r\n\r\n템플릿 내 변수는 중괄호 `{variable_name}` 형식:\r\n\r\n| 변수 | 타입 | 설명 |\r\n|------|------|------|\r\n| `{id}` | string | 문서 ID (generatePlanId() 결과) |\r\n| `{created}` | ISO 8601 | 생성 시각 |\r\n| `{status}` | enum | 초기 상태 (`draft`) |\r\n| `{language}` | string | ISO 639-1 코드 |\r\n| `{task}` | string | 사용자 원문 요청 |\r\n| `{skill_table}` | markdown table | 매칭된 스킬 테이블 |\r\n| `{execution_steps}` | markdown | Step별 실행 계획 |\r\n| `{expected_outcomes}` | markdown checklist | 기대 결과 체크리스트 |\r\n| `{risks}` | markdown list | 위험 요소 (선택) |\r\n| `{execution_mode}` | string | Single 또는 Parallel |\r\n\r\n#### 7.5 사용자 커스텀 템플릿 (향후)\r\n\r\n`lens.config.json`에서 커스텀 템플릿 경로 지정:\r\n\r\n```json\r\n{\r\n  \"templates\": {\r\n    \"plan\": \"./my-templates/custom-plan.md\",\r\n    \"result\": null\r\n  }\r\n}\r\n```\r\n\r\n- `null`이면 기본 템플릿 사용\r\n- 지정된 경로의 파일이 없으면 기본 템플릿으로 폴백\r\n\r\n---\r\n\r\n## 8. 에러/실패 기록 컨벤션\r\n\r\n### 현재 상태\r\n\r\n| 항목 | 현재 규칙 | 문제점 |\r\n|------|-----------|--------|\r\n| 스킬 실행 실패 | `/cc`에서 \"note it briefly and continue\" | 기록 형식, 위치 미정의 |\r\n| Agent 에러 | `agent-tracker.js`에 `error` 필드 (최대 500자) | 에이전트 단위 에러만. 문서 단위 에러 없음 |\r\n| Plan 실패 | `Status: Failed`만 기록 | 실패 원인, 재시도 가이드 없음 |\r\n| 부분 성공 | `Status: Partial` | \"어디까지 성공했고 어디서 실패했는지\" 구조화 안 됨 |\r\n\r\n### 개선된 규칙\r\n\r\n#### 8.1 에러 기록 3계층\r\n\r\n```\r\nLevel 1: Agent 에러     → agent-dashboard.json (자동, 훅이 기록)\r\nLevel 2: 문서 에러      → Plan/Result 파일 본문 (구조화된 섹션)\r\nLevel 3: 세션 에러 요약  → plan-state.json의 status + failedAt\r\n```\r\n\r\n#### 8.2 실패 시 Plan 파일에 기록할 내용\r\n\r\n```markdown\r\n---\r\n\r\n## Execution Result / 실행 결과\r\n\r\n> Failed on {YYYY-MM-DDTHH:mm:ss+TZ}\r\n\r\n### Outcomes / 실행 결과 상세\r\n- [x] {성공한 기대 결과} → {실제 결과}\r\n- [ ] {실패한 기대 결과} → **FAILED**: {실패 원인}\r\n\r\n### Error Details / 에러 상세\r\n\r\n| Step | Skill | Status | Error |\r\n|------|-------|--------|-------|\r\n| 1 | /skill-a | Completed | - |\r\n| 2 | /skill-b | **Failed** | `TypeError: Cannot read property 'x' of undefined` |\r\n| 3 | /skill-c | Skipped | Step 2 실패로 미실행 |\r\n\r\n### Recovery Suggestion / 복구 제안\r\n- {구체적인 복구 방법}\r\n- {대안 접근법}\r\n\r\n### Status: Failed\r\n```\r\n\r\n#### 8.3 부분 성공 처리\r\n\r\n- Plan에 3개 Step이 있고, Step 1-2는 성공, Step 3은 실패한 경우:\r\n  - **Status**: `failed` (전체 Plan은 실패)\r\n  - **각 Step 상태**: 개별적으로 Completed/Failed/Skipped 표기\r\n  - **Recovery Suggestion**: 실패한 Step부터 재시도하는 방법 기재\r\n\r\n> **`Partial` 상태 폐지**: 기존 `Partial`은 모호하다. 대신 `failed` 상태 + 본문에서 성공/실패 Step을 명시한다.\r\n\r\n#### 8.4 `/cc` 병렬 실행 실패\r\n\r\n```markdown\r\n### Agent Execution Summary / 에이전트 실행 요약\r\n\r\n| # | Skill | Status | Duration | Error |\r\n|---|-------|--------|----------|-------|\r\n| 1 | /skill-a | Done | 3.2s | - |\r\n| 2 | /skill-b | Error | 1.5s | Timeout after 30s |\r\n| 3 | /skill-c | Done | 5.1s | - |\r\n\r\n### Partial Results Available\r\n{성공한 에이전트들의 결과는 정상 표시. 실패한 에이전트는 \"Error\" 표기 후 이유 명시}\r\n```\r\n\r\n#### 8.5 에러 메시지 형식\r\n\r\n```\r\n에러 메시지는 다음 형식을 따른다:\r\n- 첫 줄: 에러 유형 (TypeError, NetworkError, TimeoutError 등)\r\n- 둘째 줄: 발생 위치 (파일명 + 함수명 또는 스킬명)\r\n- 셋째 줄: 원인 요약 (자연어)\r\n- 최대 500자\r\n```\r\n\r\n---\r\n\r\n## 부록: 현재 → 개선 마이그레이션 요약\r\n\r\n| # | 컨벤션 | 영향받는 파일 | 변경 규모 |\r\n|---|--------|--------------|-----------|\r\n| 1 | 문서 네이밍 | `plan-manager.js`, `skills/cp/SKILL.md` | 중 (파일명 형식 변경, 폴더 추가) |\r\n| 2 | 헤더/메타데이터 | `skills/cp/SKILL.md`, `plan-manager.js` | 대 (YAML 프론트매터 도입) |\r\n| 3 | 다국어 | `skills/cp/SKILL.md`, `skills/cc/SKILL.md` | 소 (규칙 명확화) |\r\n| 4 | 상태 관리 | `plan-manager.js`, `skills/cp/SKILL.md` | 중 (상태 머신 확장) |\r\n| 5 | 문서 연결 | `plan-manager.js`, `skills/cp/SKILL.md` | 중 (프론트매터 참조 추가) |\r\n| 6 | 품질 기준 | `skills/cp/SKILL.md` | 소 (셀프 체크 규칙 추가) |\r\n| 7 | 템플릿 분리 | 신규 `templates/` 디렉토리, `skills/cp/SKILL.md`, `skills/cc/SKILL.md` | 대 (구조 변경) |\r\n| 8 | 에러/실패 | `skills/cp/SKILL.md`, `skills/cc/SKILL.md`, `plan-manager.js` | 중 (실패 기록 구조화) |\r\n\r\n### 구현 우선순위\r\n\r\n```\r\nPhase 1 (즉시): 3. 다국어, 6. 품질 기준 — SKILL.md 텍스트 수정만으로 적용 가능\r\nPhase 2 (단기): 2. 메타데이터, 4. 상태 관리, 8. 에러 기록 — SKILL.md + plan-manager.js 수정\r\nPhase 3 (중기): 1. 네이밍, 5. 문서 연결 — 파일명 형식 변경, 기존 파일과의 호환성 고려\r\nPhase 4 (장기): 7. 템플릿 분리 — 디렉토리 구조 변경, config 확장, SKILL.md 대폭 수정\r\n```\r\n","truncated":false,"stale":false,"branch":null,"base":null},{"id":"documentation-guide","folder":"rules","title":"Lens 문서화 가이드","date":"","hasMd":true,"hasHtml":false,"mdPath":"rules/documentation-guide.md","htmlPath":null,"mdInline":"# Lens 문서화 가이드\r\n\r\n> lens 프로젝트의 문서 작성 표준 및 체계 정의서\r\n\r\n---\r\n\r\n## 1. 문서 체계 개요\r\n\r\n### 1.1 원칙\r\n\r\nlens의 문서는 **읽는 대상**에 따라 역할이 분리된다.\r\n\r\n| 문서 | 대상 독자 | 핵심 질문 |\r\n|------|-----------|-----------|\r\n| `CLAUDE.md` | Claude (AI 에이전트) | \"이 프로젝트가 뭐고, 뭐가 어디 있지?\" |\r\n| `README.md` | 외부 사용자 (GitHub) | \"이걸 왜 쓰고, 어떻게 설치하지?\" |\r\n| `CHANGELOG.md` | 개발자 / 기여자 | \"뭐가 바뀌었지?\" |\r\n| `plugin.json` | Claude Code 런타임 | \"이 플러그인의 이름, 버전, 메타데이터는?\" |\r\n\r\n**문서 간 정보 중복 금지.** 한 곳에서 정의하고, 나머지는 링크로 참조한다.\r\n\r\n### 1.2 버전 단일 원천 (Single Source of Truth)\r\n\r\n```\r\nplugin.json의 \"version\" 필드 = 프로젝트의 공식 버전\r\n```\r\n\r\n다른 모든 파일에서 버전을 표기할 때는 `plugin.json`의 값을 따른다.\r\n버전을 하드코딩하는 파일 목록:\r\n\r\n| 파일 | 위치 | 형태 |\r\n|------|------|------|\r\n| `.claude-plugin/plugin.json` | `\"version\"` 필드 | **원천** |\r\n| `hooks/hooks.json` | `\"description\"` 문자열 | 참조 |\r\n| `hooks/session-start.js` | `systemMessage` 문자열 | 참조 |\r\n| `skills/cc/SKILL.md` | frontmatter `description` | 참조 |\r\n| `skills/cc/SKILL.md` | frontmatter `description` | 참조 |\r\n| `skills/cp/SKILL.md` | frontmatter `description` | 참조 |\r\n| `lens.config.json` | `\"version\"` 필드 | 참조 |\r\n\r\n릴리스 시 위 파일들의 버전 문자열을 **일괄 업데이트**한다.\r\n\r\n---\r\n\r\n## 2. CLAUDE.md 작성 규칙\r\n\r\n### 2.1 목적\r\n\r\nClaude가 이 파일 **하나만 읽으면** lens 전체를 파악할 수 있어야 한다.\r\n세션 시작 시 자동으로 로드되므로, 가장 중요한 문서다.\r\n\r\n### 2.2 구조 (필수 섹션, 순서 고정)\r\n\r\n```markdown\r\n# lens — [한 줄 정의]\r\n\r\n## 버전\r\n- 현재: vX.Y.Z\r\n- 마지막 업데이트: YYYY-MM-DD\r\n\r\n## 스킬\r\n| 스킬 | 설명 | 워크플로우 |\r\n(각 스킬의 핵심 동작을 1-2줄로)\r\n\r\n## 훅\r\n| 훅 | 이벤트 | 파일 | 설명 |\r\n(5개 훅 전체, 트리거 조건 포함)\r\n\r\n## 라이브러리 (lib/)\r\n| 모듈 | 파일 | 핵심 함수 | 설명 |\r\n(각 모듈의 주요 export 함수 나열)\r\n\r\n## 폴더 구조\r\n(전체 파일 트리 + 각 파일 한 줄 역할)\r\n\r\n## 설정\r\n| 옵션 | 기본값 | 설명 |\r\n(lens.config.json 옵션 전체)\r\n\r\n## 감지 대상\r\n| 타입 | 감지 방법 | 예시 |\r\n(Skill, MCP, LSP, Hybrid)\r\n\r\n## 알려진 이슈 / TODO\r\n(현재 알려진 버그나 미완성 항목)\r\n\r\n## 변경 이력 요약\r\n(최근 2-3개 버전만 한 줄씩. 상세는 CHANGELOG.md 참조)\r\n```\r\n\r\n### 2.3 작성 규칙\r\n\r\n| 규칙 | 설명 |\r\n|------|------|\r\n| **200줄 이내** | Claude의 자동 메모리 파일은 200줄 이후 잘림. 반드시 지킨다 |\r\n| **코드 블록 금지** | 구현 코드를 넣지 않는다. 파일 경로와 함수명만 표기 |\r\n| **테이블 우선** | 산문보다 테이블이 정보 밀도가 높다. 가능하면 테이블 사용 |\r\n| **링크로 위임** | 상세 내용은 `CHANGELOG.md`, `README.md`, 소스코드로 링크 |\r\n| **현재 상태만** | 과거 히스토리는 CHANGELOG에. CLAUDE.md는 \"지금\" 상태만 기술 |\r\n| **파일 역할 전수 기록** | 새 파일 추가 시 반드시 폴더 구조 섹션에 반영 |\r\n\r\n### 2.4 업데이트 시점\r\n\r\n- 새 파일 추가/삭제 시\r\n- 새 스킬 또는 훅 추가 시\r\n- 버전 릴리스 시\r\n- 설정 옵션 변경 시\r\n\r\n---\r\n\r\n## 3. README.md 작성 규칙\r\n\r\n### 3.1 목적\r\n\r\nGitHub에서 lens을 발견한 **외부 사용자**가 5분 안에 설치하고 사용할 수 있게 한다.\r\n\r\n### 3.2 구조 (필수 섹션, 순서 고정)\r\n\r\n```markdown\r\n# Lens\r\n\r\n[한 줄 소개]\r\n\r\n## The Problem\r\n(왜 이 플러그인이 필요한지)\r\n\r\n## The Solution\r\n(사용 예시 — 코드 블록으로)\r\n\r\n## Installation\r\n(3가지 옵션: GitHub clone, curl, local plugin)\r\n\r\n## Usage\r\n### /c — [설명]\r\n### /cc — [설명]\r\n(사용 예시 테이블)\r\n\r\n## How It Works\r\n(각 스킬의 워크플로우 — 번호 리스트로)\r\n\r\n## Features\r\n(불릿 리스트)\r\n\r\n## Configuration\r\n(lens.config.json 옵션 테이블)\r\n\r\n## Requirements\r\n\r\n## License\r\n```\r\n\r\n### 3.3 작성 규칙\r\n\r\n| 규칙 | 설명 |\r\n|------|------|\r\n| **내부 구현 상세 없음** | 아키텍처, 파일 구조, 함수명 등은 README에 넣지 않는다 |\r\n| **설치가 최우선** | Installation 섹션은 반드시 Usage 전에 온다 |\r\n| **복사-붙여넣기 가능** | 설치 명령어는 그대로 복사해서 터미널에 붙여넣을 수 있어야 한다 |\r\n| **스크린샷/예시 우선** | \"어떻게 보이는지\"를 먼저 보여주고 설명은 뒤에 |\r\n| **버전 하드코딩 금지** | README 본문에 버전 번호를 넣지 않는다 (금방 낡음) |\r\n\r\n### 3.4 README에 넣지 않는 것\r\n\r\n- 파일별 역할 설명 (→ `CLAUDE.md`)\r\n- 버전별 변경 이력 (→ `CHANGELOG.md`)\r\n- 훅 상세 동작 원리 (→ `CLAUDE.md`)\r\n- 라이브러리 모듈 API (→ 소스코드 JSDoc)\r\n\r\n---\r\n\r\n## 4. CHANGELOG.md 작성 규칙\r\n\r\n### 4.1 목적\r\n\r\n모든 버전의 변경사항을 **누락 없이** 기록한다.\r\n코드의 실제 상태와 항상 일치해야 한다.\r\n\r\n### 4.2 형식 (Keep a Changelog 기반)\r\n\r\n```markdown\r\n## [X.Y.Z] - YYYY-MM-DD\r\n\r\n### Added (vX.Y.Z)\r\n- **기능명** — 설명. `관련파일.js`\r\n\r\n### Changed (vX.Y.Z)\r\n- **변경 대상** — 무엇이 어떻게 바뀌었는지. `관련파일.js`\r\n\r\n### Fixed (vX.Y.Z)\r\n- **버그명** — 무엇이 어떻게 고쳐졌는지. `관련파일.js`\r\n\r\n### Removed (vX.Y.Z)\r\n- **제거 대상** — 왜 제거했는지\r\n```\r\n\r\n### 4.3 작성 규칙\r\n\r\n| 규칙 | 설명 |\r\n|------|------|\r\n| **최신 버전이 맨 위** | 역순 시간순 (newest first) |\r\n| **관련 파일 명시** | 각 항목 끝에 백틱으로 파일명 표기 |\r\n| **카테고리 태그** | Added, Changed, Fixed, Removed 중 해당하는 것만 사용 |\r\n| **버전 태그 표기** | 각 카테고리 제목에 `(vX.Y.Z)` 붙여서 접혀도 구분 가능 |\r\n| **커밋과 1:1** | 하나의 릴리스 커밋 = 하나의 CHANGELOG 엔트리 |\r\n\r\n### 4.4 CHANGELOG에 넣지 않는 것\r\n\r\n- 미래 계획 (→ TODO나 Issues)\r\n- 사용법 설명 (→ `README.md`)\r\n- 아키텍처 결정 이유 (→ `CLAUDE.md` 또는 커밋 메시지)\r\n\r\n---\r\n\r\n## 5. plugin.json 작성 규칙\r\n\r\n### 5.1 목적\r\n\r\nClaude Code 런타임이 읽는 메타데이터 + **버전의 단일 원천**.\r\n\r\n### 5.2 필수 필드\r\n\r\n```json\r\n{\r\n  \"name\": \"lens\",\r\n  \"version\": \"X.Y.Z\",\r\n  \"description\": \"[/c와 /cc의 핵심 기능을 포함한 50단어 이내 설명]\",\r\n  \"author\": {\r\n    \"name\": \"Lens\",\r\n    \"email\": \"livevil7@gmail.com\",\r\n    \"url\": \"https://github.com/CreetaCorp/lens\"\r\n  },\r\n  \"repository\": \"https://github.com/CreetaCorp/lens\",\r\n  \"license\": \"MIT\",\r\n  \"keywords\": [...]\r\n}\r\n```\r\n\r\n### 5.3 규칙\r\n\r\n| 규칙 | 설명 |\r\n|------|------|\r\n| **description에 버전 넣지 않음** | description은 기능 설명만. 버전은 version 필드에 |\r\n| **keywords 최신 유지** | 새 기능 추가 시 관련 키워드도 추가 |\r\n\r\n---\r\n\r\n## 6. 소스코드 내 문서화 규칙\r\n\r\n### 6.1 파일 헤더 주석\r\n\r\n모든 `.js` 파일 첫 줄에 역할 설명:\r\n\r\n```javascript\r\n/**\r\n * Lens - [모듈명]\r\n * [한 줄 설명]\r\n */\r\n```\r\n\r\n### 6.2 함수 JSDoc\r\n\r\nexport되는 함수에만 JSDoc 작성:\r\n\r\n```javascript\r\n/**\r\n * [한 줄 설명]\r\n * @param {Type} name - 설명\r\n * @returns {Type} 설명\r\n */\r\n```\r\n\r\n### 6.3 버전 문자열\r\n\r\n소스코드 내 버전 문자열은 `plugin.json`을 런타임에 읽는 것이 이상적이나,\r\n현재는 하드코딩되어 있으므로 릴리스 체크리스트에서 일괄 업데이트한다.\r\n\r\n---\r\n\r\n## 7. 릴리스 체크리스트\r\n\r\n새 버전 릴리스 시 반드시 수행:\r\n\r\n```\r\n[ ] 1. plugin.json \"version\" 업데이트\r\n[ ] 2. hooks.json \"description\" 버전 문자열 업데이트\r\n[ ] 3. session-start.js systemMessage 버전 문자열 업데이트\r\n[ ] 4. skills/cc/SKILL.md description 버전 문자열 업데이트\r\n[ ] 5. skills/cc/SKILL.md description 버전 문자열 업데이트 (해당 시)\r\n[ ] 6. skills/cp/SKILL.md description 버전 문자열 업데이트 (해당 시)\r\n[ ] 7. lens.config.json \"version\" 업데이트\r\n[ ] 8. CHANGELOG.md에 새 버전 엔트리 추가\r\n[ ] 9. CLAUDE.md 버전 + 변경사항 반영\r\n[ ] 10. README.md 변경사항 반영 (사용자에게 영향 있는 경우만)\r\n[ ] 11. git commit + tag + push\r\n[ ] 12. GitHub Release 생성\r\n```\r\n\r\n---\r\n\r\n## 8. 문서 흐름도\r\n\r\n```\r\n                    ┌─────────────────────┐\r\n                    │    plugin.json       │\r\n                    │  (버전 단일 원천)     │\r\n                    └──────────┬──────────┘\r\n                               │\r\n              ┌────────────────┼────────────────┐\r\n              │                │                │\r\n              ▼                ▼                ▼\r\n     ┌────────────┐   ┌──────────────┐   ┌───────────┐\r\n     │  CLAUDE.md  │   │  README.md   │   │ CHANGELOG │\r\n     │ (AI 브리핑) │   │ (사용자 가이드)│   │ (변경 이력)│\r\n     └──────┬─────┘   └──────────────┘   └───────────┘\r\n            │\r\n            │ Claude가 세션 시작 시 읽음\r\n            │\r\n            ▼\r\n     ┌─────────────────────────────┐\r\n     │  소스코드 (필요시만 읽기)     │\r\n     │  hooks/, lib/, scripts/,    │\r\n     │  skills/                    │\r\n     └─────────────────────────────┘\r\n```\r\n\r\n**Claude 읽기 순서**: `CLAUDE.md` (필수) → `CHANGELOG.md` (필요시) → 소스코드 (수정 시)\r\n**사용자 읽기 순서**: `README.md` (필수) → `CHANGELOG.md` (업데이트 확인 시)\r\n","truncated":false,"stale":false,"branch":null,"base":null},{"id":"harness-rules","folder":"rules","title":"하네스 규칙 (Harness Rules)","date":"","hasMd":true,"hasHtml":false,"mdPath":"rules/harness-rules.md","htmlPath":null,"mdInline":"# 하네스 규칙 (Harness Rules)\r\n\r\nLens 스킬 구성원(워커·감독·QA·리서치)의 작업 규율 기준선(SoT). 스킬 본문에 어떤 규칙을 넣고 어떤 규칙을 뺄지 판정할 때, 그리고 워커 디스패치 프롬프트를 설계할 때 이 문서를 기준으로 삼는다.\r\n\r\n**출처와 한계**:\r\n\r\n- 소스: 공개 저장소 asgeirtj/system_prompts_leaks 의 Claude Code 2.1.172 (Fable 5) 시스템 프롬프트 추출본 + claude.ai Fable 추출본 조사 결과.\r\n- **비공식 추출본이므로 정확성·최신성을 보증할 수 없다.** 원문 문구를 복제하지 않고 원칙만 선별해 재서술했다.\r\n- **v3.29 재대조 (2026-08-07, Claude Code 2.1.222 라이브 세션 기준)**: 아래 §2 의 상당수가 이제 **추출본이 아니라 라이브 도구 설명·시스템 프롬프트에서 직접 확인된다.** 확인된 항목은 각 절에 `[네이티브]` 로 표시하고 스킬 인라인을 걷어냈다. 판정 근거와 걷어낸 위치는 §5.\r\n- 재대조 채널: Claude Code 버전업이 감지되면 `/crv` 감사에서 이 문서를 당시 최신 추출본·라이브 도구표와 재대조하고 갱신한다.\r\n\r\n## 1. Additive-only 판정 기준\r\n\r\n스킬 본문에 규칙을 넣기 전에 한 가지를 묻는다: **\"Claude Code 하네스가 이미 강제하는 규칙인가?\"** yes 면 스킬 본문에 재복붙하지 않는다. 호스트가 풀 시스템 프롬프트를 이미 갖고 있으므로 스킬은 additive 규칙만 얹는다 (HouMinXi/fable-prompts 의 Lossless Transformation 교훈).\r\n\r\n재복붙이 허용되는 예외는 두 가지뿐이다:\r\n\r\n1. **워커 디스패치 프롬프트** — 서브에이전트에게 전달되는 프롬프트. 단 아래 단서를 읽을 것.\r\n2. **하네스가 강제하지 못하는 Lens 특화 지점** — 보고 템플릿, Codex 호출, 승인 게이트, 계획 문서 골격.\r\n\r\n> ⚠️ **예외 1 의 근거는 검증된 적이 없다 (v3.29)**. 원 문구는 *\"서브에이전트 컨텍스트에서는 하네스 규칙 준수가 약해진다\"* 였는데, **이 전제를 뒷받침하는 실측이 이 저장소 어디에도 없다.** 그 위에 워커 프롬프트마다 8줄짜리 규율 블록이 얹혀 있었다. v3.29 에서 워커 프롬프트에 남긴 것은 **하네스가 알 수 없는 것**뿐이다 — \"당신의 최종 메시지는 Leader 만 읽는다\"(파이프라인 구조), \"멈추면 병렬 전체가 블로킹된다\"(비용 구조), 그리고 Karpathy 4규칙(사용자 전역 지침이라 서브에이전트가 못 읽음). 전제가 실측으로 확인되기 전까지 예외 1 을 근거로 하네스 규칙을 되살리지 않는다.\r\n>\r\n> **폐지된 예외 3 (\"자주 위반되는 규칙의 3중 반복\")**: 규칙 본문 + self-check + 위반 결과를 각각 다른 위치에 배치하라는 조항이었다. 실제로는 additive-only 를 무력화하는 만능 우회로로 쓰였다 — \"자주 위반된다\"는 판정에 기준이 없어 어떤 규칙이든 3번 복붙할 명분이 됐다. 폐지한다.\r\n\r\n## 2. 규칙 인벤토리\r\n\r\n> **읽는 법 (v3.29)**: `[네이티브]` = Claude Code 2.1.222 세션에서 시스템 프롬프트 또는 도구 설명으로 **직접 확인**됨 → 스킬 본문에 복붙 금지. `[Lens]` = 호스트가 강제하지 않아 Lens 가 계속 책임짐. 표시가 없으면 미확인(추출본 근거만).\r\n\r\n### A. 자율 실행·턴 종료 [네이티브]\r\n\r\n- **자율 운영**: 사용자는 실시간으로 지켜보지 않는다. 작업 도중 \"~할까요?\" 라고 물으면 전체 작업이 블로킹된다. 원래 요청에서 자연히 따라 나오는 되돌릴 수 있는 행동은 묻지 않고 진행한다. 멈춰야 하는 경우는 파괴적 행동과 진짜 스코프 변경뿐. 완료 후 후속 제안은 허용, 작업 전에 허락을 구하는 것은 금지.\r\n- **마지막 문단 검사**: 턴을 끝내기 전 마지막 문단을 본다. 계획, 질문, \"이제 ~하겠습니다\" 류 약속으로 끝난다면 멈추지 말고 지금 도구를 호출해 실행한다. 에러 후 재시도와 누락 정보 수집도 같은 원칙. 세션이 길어졌다는 이유로 멈추지 않는다.\r\n- **진단 예외**: 사용자가 문제를 서술하거나 질문하는 중이면 산출물은 \"평가\"다 — 진단을 보고하고 멈춘다. 요청받기 전에 수정하지 않는다.\r\n- **상태 변경 전 증거 검사**: 재시작·삭제·설정 변경 같은 상태 변경 전에, 확보한 증거가 그 특정 행동을 정말 뒷받침하는지 확인한다. 패턴이 일치해 보여도 원인은 다를 수 있다.\r\n\r\n### B. 검증·정직 보고 [네이티브]\r\n\r\n- **결과 충실 보고**: 실패는 출력과 함께 실패라고, 스킵은 스킵이라고 말한다. 완료·검증 상태는 헤징 없이 단언한다. 결과 미화 금지.\r\n- **완료 마킹 엄격**: 완전히(FULLY) 달성했을 때만 completed. 테스트 실패, 부분 구현, 미해결 에러 상태에서는 절대 completed 로 마킹하지 않는다.\r\n- **침묵은 성공이 아니다**: 감시 필터는 happy path 만이 아니라 가능한 모든 종결 상태를 매치해야 한다. 성공 마커만 grep 하는 모니터는 crashloop 과 행(hang)에 침묵한다. \"프로세스가 지금 죽으면 이 필터가 뭐라도 내보내는가?\" 를 자문한다.\r\n  - **네이티브 `Monitor` 도구 설명의 \"Coverage — silence is not success\" 절이 자문 문장까지 동일하게 강제한다.** Lens 가 감시 프롬프트를 손으로 쓰는 대신 그 도구를 쓰면 규칙이 따라온다.\r\n- **침묵 캡 금지**: top-N 이나 샘플링으로 커버리지를 잘랐다면 무엇이 잘려 나갔는지 명시한다. (네이티브 Workflow 도구 \"No silent caps\".)\r\n- **삭제·덮어쓰기 전 대상 확인**: 대상 실물을 직접 보고, 설명과 모순되거나 내가 만든 것이 아니면 진행하는 대신 표면화한다.\r\n\r\n### C. 오케스트레이션 [네이티브]\r\n\r\n> **v3.29: 이 절 전체가 라이브 도구 설명에 문장 단위로 존재한다.** 스킬 인라인은 전부 제거했다(`/cc` Phase 3.0). 아래는 \"무엇이 어디에 있는지\"의 색인으로만 남긴다.\r\n\r\n| 규칙 | 네이티브 위치 |\r\n|---|---|\r\n| 위임 후 중복 금지 | Agent 도구 — *\"Once you've delegated a search, don't also run it yourself\"* |\r\n| 결과 릴레이 | Agent 도구 — *\"The agent's final report is not shown to the user — relay what matters\"* |\r\n| 에이전트 재사용 | Agent 도구 — *\"Use SendMessage … to continue a previously spawned agent with its context intact\"* |\r\n| pipeline 기본, barrier 는 예외 | Workflow 도구 — *\"DEFAULT TO pipeline(). Only reach for a barrier when…\"* + smell test |\r\n| 하이브리드 스카우팅 | Workflow 도구 — *\"scout inline first … then call Workflow to pipeline over it\"* |\r\n| 요청 규모 스케일링 | Workflow 도구 — *\"Scale to what the user asked for\"* |\r\n| loop-until-dry | Workflow 도구 — Quality patterns `Loop-until-dry` |\r\n\r\n### D. QA 패턴 [네이티브]\r\n\r\n> **v3.29: 이 절도 네이티브 Workflow 도구의 \"Quality patterns\" 와 항목명까지 1:1 이다.** 이 절을 소비하던 `/ccp` 는 v3.29 에서 폐지했다(§5). 색인만 남긴다.\r\n\r\n| 규칙 | 네이티브 위치 |\r\n|---|---|\r\n| Adversarial verify (불확실하면 refuted 기본) | Workflow 도구 — `Adversarial verify` (코드 예제 포함) |\r\n| Perspective-diverse verify | Workflow 도구 — `Perspective-diverse verify` |\r\n| 완결성 비평가 | Workflow 도구 — `Completeness critic` |\r\n| 다안 생성 후 심사 | Workflow 도구 — `Judge panel` |\r\n\r\n**Self-check 배치 규칙은 폐지** — \"규칙 본문과 별도 위치에 반복 배치\"는 §1 예외 3 과 함께 폐지됐다(중복 정당화 우회로).\r\n\r\n### E. 계획 [일부 네이티브]\r\n\r\n- ~~**충분하면 행동**~~ **[네이티브]**: 시스템 프롬프트가 *\"When you have enough information to act, act. Do not re-derive facts already established… give a recommendation, not an exhaustive survey\"* 로 강제한다. 스킬 인라인 제거.\r\n- **Elicitation gate [Lens]**: 질문하기 전에 대화 이력·코드·합리적 기본값에서 스스로 답을 찾는다. **질문은 1개 지향, 3개 상한.** 하네스는 \"루틴한 판단은 스스로\"까지만 말하고 **개수 상한은 주지 않으므로** Lens 가 계속 책임진다.\r\n- **승인은 전용 게이트 [Lens]**: 요구사항 질문은 승인 요청 전에 끝낸다. 승인 질문에 요구사항 질문을 섞지 않는다. 승인 게이트 자체가 Lens 구조물이라 비네이티브.\r\n\r\n### F. 리서치 [Lens]\r\n\r\n> 시스템 프롬프트에 리서치 규율은 없다. `WebSearch`/`WebFetch` 는 도구일 뿐 방법론을 강제하지 않으므로 이 절은 `/cr` 이 계속 책임진다.\r\n\r\n- **Unrecognized Entity Rule**: 모르는 제품·릴리즈·대상은 답하기 전 무조건 검색한다. 판별 테스트: \"답하려면 그게 뭔지 알아야 하는가?\" 부분적으로 들어본 것은 지식이 아니다.\r\n- **Effort scaling**: 단일 사실 1회 / 중간 난도 3~5회 / 심층 5~10회. 단일 검색으로 확정되면 1회로 끝낸다.\r\n- **Snippet 불신**: 검색 스니펫만으로 단정하지 않는다 — 전문을 fetch 한다.\r\n- **출처 위계**: 원출처 > 2차 출처. SEO 오염 영역(제품 추천 등)은 상위 랭크라도 회의적으로 본다. 충돌하는 출처는 충돌한다고 명기한다.\r\n- **\"없음\" 과신 금지**: 검색 결과의 부재를 존재의 부재에 대한 증거로 단정하지 않는다.\r\n\r\n### G. 공통 보고 [일부 네이티브]\r\n\r\n> 시스템 프롬프트가 미사여구·사과·전문 나열을 이미 억제한다. 남는 Lens 몫은 **서브에이전트 → Leader 보고 형식**(Leader 가 파싱해야 하므로)과 **산출물 풀 경로**(사용자 강한 룰)다. 인-컨버세이션 보고는 호스트에 맡긴다.\r\n\r\n- **결론 선행**: 첫 문장 = 무슨 일이 있었나 / 무엇을 발견했나.\r\n- **가독성 > 간결성**: 짧게 만드는 방법은 항목의 선택적 포함이지, 단편·화살표 체인·전문용어 압축이 아니다. 완전한 문장으로 쓴다.\r\n- **최종 메시지 완결성**: 사용자가 필요로 하는 전부(답·요약·결론·산출물 위치)는 마지막 메시지 안에 있어야 한다.\r\n- **내부 기제 내레이션 금지**: \"지침에 따라\", \"모듈을 로드했습니다\" 류 셋업 서술 금지 — 결과만 말한다.\r\n- **postamble 금지**: 산출물 링크 뒤에 긴 후기를 붙이지 않는다.\r\n\r\n## 3. 스킬 매핑\r\n\r\nv3.29 기준. **인라인이 남은 곳만** 적는다 — `[네이티브]` 절은 어느 스킬도 복붙하지 않는다.\r\n\r\n| 규칙 | 인라인 위치 | 비고 |\r\n|------|----------|----------|\r\n| A. 자율 실행·턴 종료 | (없음) | 호스트 강제. `/cc` 워커에는 \"멈추면 병렬 전체가 블로킹된다\"는 **비용 설명 1줄**만 남김 |\r\n| B. 검증·정직 보고 | (없음) | 호스트 강제 |\r\n| B. 침묵은 성공이 아니다 | (없음) | 네이티브 `Monitor` 도구가 자체 강제 — 감시가 필요하면 그 도구를 쓴다 |\r\n| C. 오케스트레이션 | (없음) | Task/Agent·Workflow 도구 설명이 전부 보유 |\r\n| D. QA 패턴 | (없음) | Workflow 도구 Quality patterns. 소비 스킬 `/ccp` 는 v3.29 폐지 |\r\n| E. Elicitation gate·승인 게이트 | `/cp` | 질문 개수 상한 + 승인 게이트 분리는 비네이티브 |\r\n| F. 리서치 | `/cr` | 전량 Lens 책임 |\r\n| G. 워커→Leader 보고 형식 | `/cc` 워커 프롬프트 | Leader 가 파싱하는 계약이라 비네이티브 |\r\n| §4.4 진행보고 | `/cc` `/cp` `/cr` `/cs` | 사용자 룰(VS Code 에 진행창 없음). **폴링 에이전트 없이 본체가 수행** |\r\n\r\n## 4. 충돌 심사 기록\r\n\r\nLens 기존 설계와 원문 원칙이 충돌해 보인 3건의 심사 결과. (4.1 은 v3.24.0 에서 재심사·개정, 4.2·4.3 은 Lens 설계 유지.)\r\n\r\n### 4.1 모델 할당 테이블 vs 모델 오버라이드 절제\r\n\r\n- 충돌: Lens 는 전 워커에 opus 를 고정 할당했다(/cc v3.11 설계). 원문 원칙은 모델 오버라이드를 절제하고 상속을 기본으로 한다.\r\n- 구 해소(v3.23 이하): 품질 우선 케이스로 고정 할당 유지 + \"불확실하면 상속\" 보강.\r\n- **재심사·개정 (v3.24.0, 2026-07-15 사용자 지시)**: 고정 이름 할당 **폐지** — \"최고 모델 무차별 배정 금지, 업무 난이도에 맞춰 배분\"이 원칙. 배분은 **난이도 사다리** — Easy=경량 티어(현재 haiku) / Medium=중간 티어(현재 sonnet) / Hard=**최상위 티어(TOP)**. 각 칸은 이름이 아니라 상대 위치라서 모델 세대와 함께 자동 상승한다.\r\n- **재개정 (v3.25.0, 2026-07-20) — 상속 폐기 + 위험도 기반 승격**: v3.24 의 \"세션이 enum 최상위 이상이면 지정 생략(상속)\" 조항을 **폐지**한다.\r\n  - **모든 spawn 은 모델을 명시한다.** TOP = Task enum 최상위 명시(현재 `fable`, 없으면 `opus`).\r\n  - **폐지 사유 (실측 2026-07-20)**: ① 지정을 생략하면 추적 훅이 실제 모델을 관측할 수 없다(`tool_input.model` = undefined) — 계측 자체가 불가능해진다. ② 이 사용자의 세션은 항상 최상위 모델이라, 상속 조항이 **모든 Hard 역할을 자동으로 최상위로 만들었다.** 정책을 완벽히 지켜도 최상위 소비가 큰 구조였고, 이것이 최상위 티어 사용량 과다의 직접 원인이었다.\r\n  - **원문 원칙과의 관계**: 원문은 \"오버라이드 절제·상속 기본\"을 권한다. 이번 개정은 그와 **의도적으로 갈라선다** — 관측 가능성과 비용 통제를 상속의 편의보다 우선한다. 감수한 대가: 세션이 enum 보다 새로운 모델일 때 한 단계 낮게 잡힐 수 있음(enum 자동 갱신으로 창은 좁다).\r\n  - **Supervisor·QA**: \"최고 사용 Worker 티어와 동급\"(연쇄 승격) **폐지** → **위험도 기반**. 파괴적·비가역 변경 / 파일 5개+ 또는 diff 300줄+ / 보안·권한 경로일 때만 TOP. 리뷰 깊이가 필요한 것은 worker 가 똑똑했을 때가 아니라 **틀렸을 때 손해가 클 때**다.\r\n  - **TOP 상한 (명령 1회 기준)**: `/cc` 3 · `/cp deep` 2. 초과 필요 시 사유와 함께 사용자 확인. (`/ccp` 1 은 v3.29 스킬 폐지로 소멸.)\r\n  - ~~Monitor 는 `haiku` 고정~~ → **v3.29 에서 Monitor 역할 자체를 폐지.** 모델 배정 대상이 아니다(§4.6).\r\n\r\n### 4.2 AskUserQuestion 승인 게이트 vs 되묻기 차단\r\n\r\n- 충돌: Lens 는 승인 게이트에서 AskUserQuestion 으
