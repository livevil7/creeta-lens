lace·M5 push remote·M6 scan roots), `scripts/upgrade.py` (M3 dry-run fetch·M4 동적 브랜치), `scripts/bump-version.sh` (M2 BSD sed)\n- **manifest/README**: `.claude-plugin/plugin.json`, `.claude-plugin/marketplace.json`, `README.md` (B2 URL)\n- **스킬**: `skills/cp/SKILL.md` (M7 게이트·N1·N6 `{lens}`·GPT-5.2), `skills/c|cc|cs/SKILL.md` (N1·N2·N4)\n- **템플릿/docs**: `templates/report-plan.example.html`·`report-history.example.html`·`report-shared.css`·`board.template.html` (N3), `docs/rules/codex-integration.md` (N5)\n- **기타**: `.gitignore` (`.agents/` 추가), `CHANGELOG.md`, `CLAUDE.md`, `hooks/hooks.json`·`session-start.js` (버전 bump), task 문서 2종\n\n## 테스트 & 검증\n\nQA를 텍스트 검토가 아닌 **실제 명령**으로 수행 (7개 성공기준 전부 PASS):\n\n- `grep` 0건 — 강제 commit identity / `/c/Users`·`C:/Users`·`/Users/user` 절대경로 / `livevil-setting`·`spotedcrypto`·`livevil-contents`·`namane`·`GPT-5.2` 개인 컨텍스트 (CHANGELOG·docs/history 제외)\n- `grep \"CreetaCorp/lens\"` .claude-plugin/·README = 0 (`\"name\":\"CreetaCorp\"`만 잔존, 의도)\n- `bash -n` (git-sync-all.sh·bump-version.sh) + `ast.parse` (upgrade.py) 전부 OK\n- `/cs` 마켓플레이스 root(line 35) + pull-only 가드(line 138) 구조 확인\n- `/cp` Phase 5.0 산출물 게이트 텍스트 확인\n- **`/lens-upgrade` 실측** — 마켓플레이스가 origin에서 v3.6.4 pull → 설치 → 검증: registry 1 entry, `claude plugin list` = v3.6.4\n\nQA가 워커 자기보고가 놓친 3건(cp/SKILL.md의 GPT-5.2, board.template.html의 livevil-contents, example의 namane)을 잡아 추가 수정 — \"trust but verify\"로 누락 차단.\n\n## 추가 사항\n\n- **Claude Code 재시작 필요** — 현재 세션은 캐시 v3.6.3로 동작. 재시작해야 v3.6.4 로드.\n- **stale task 2건 잔존** — `docs/tasks/2026-05-16-cp-goal-first-overhaul.md`(v3.4.0 shipped), `2026-05-20-cp-html-reports-board.md`(v3.6.0 shipped)는 이번에 archive 안 함. 별도 `/cp done`으로 정리 가능.\n- **메모리 기록** — `/cp` 필수 단계(HTML+board) 건너뛰기 금지를 feedback 메모리에 저장(세션 중 2회 발생).\n- GitHub 릴리스: https://github.com/livevil7/creeta-lens/releases/tag/v3.6.4\n","truncated":false,"stale":false},{"id":"2026-05-20-cp-html-reports-board","folder":"history","title":"/cp 보고서 HTML 양식 + Task Board — 완료","date":"2026-05-20","hasMd":true,"hasHtml":true,"mdPath":"history/2026-05-20-cp-html-reports-board.md","htmlPath":"history/2026-05-20-cp-html-reports-board.html","mdInline":"# /cp 보고서 HTML 양식 + Task Board — 완료\n\n**완료일**: 2026-05-21 (출시: v3.6.0, 계획 작성 2026-05-20)\n\n## 요약\n\nlivevil-contents에서 검증한 Pretendard 미니멀 보고서 HTML 양식 + board 인덱스를 lens `/cp`의 범용 기능으로 승격했다. `/cp`가 만든 task/history 문서를 slide-deck HTML로 보고, `docs/board.html`이 카드 클릭 시 iframe panel로 즉시 표시한다. 데이터 모델은 **md = SoT, HTML = 파생 뷰**.\n\n## 주요 결정 사항\n\n- **md SoT + HTML 파생 뷰** (사용자 확정) — 상태/요약은 md에만, HTML은 항상 md에서 파생.\n- **board-builder.js**: `docs/{tasks,history}` 스캔 → board.html, `lens:source-hash` stale 감지.\n- **자산 자동 배포**: `_shared.css`를 cp 실행 시 최초 1회 배포(있으면 skip).\n- **하위 호환**: 최초엔 `reportFormat` opt-in(기본 md)으로 md-only 프로젝트 무영향. 이후 v3.6.0 board 전면 재설계에서 **always-on**으로 승격되며 이 task의 기반이 흡수됨.\n\n## 변경 파일\n\n- `templates/` — report-shared.css, report-conversion-spec.md, report-{history,plan}.example.html, board.template.html\n- `skills/cp/SKILL.md` — \"HTML 보고서 뷰 + Task Board\" 섹션\n- `lib/board-builder.js` — 신규 (스캔 → board, iframe panel, stale 감지)\n- `lens.config.json` — reportFormat 옵션\n\n## 테스트 & 검증\n\nlivevil-contents 3카드로 board 빌드 + 카드 클릭 → iframe panel 동작 검증. v3.6.0으로 출시(CHANGELOG `## [3.6.0]`). 본 task의 opt-in 접근은 v3.6.0 board 전면 재설계(`docs/history/2026-05-21-cp-board-redesign.md`)에서 `board_<repo>.html` 3-폴더 통합 + always-on으로 진화함.\n\n## 추가 사항\n\n이 task의 실질 후속/완성본은 `docs/history/2026-05-21-cp-board-redesign.md`다. 본 계획 문서가 `docs/tasks/`에 중복 방치돼 있다가 2026-05-27 `/cp done` sweep으로 정리됨.\n","truncated":false,"stale":false},{"id":"2026-05-16-cp-goal-first-overhaul","folder":"history","title":"/cp + /cc Goal-first 구조 동시 개편 — 완료","date":"2026-05-16","hasMd":true,"hasHtml":true,"mdPath":"history/2026-05-16-cp-goal-first-overhaul.md","htmlPath":"history/2026-05-16-cp-goal-first-overhaul.html","mdInline":"# /cp + /cc Goal-first 구조 동시 개편 — 완료\n\n**완료일**: 2026-05-16 (출시: v3.4.0)\n\n## 요약\n\n`/cp`(계획)와 `/cc`(실행)를 **Goal-first** 구조로 동시 개편했다. 계획 문서가 `🎯 Goal → Plan A → Plan B → 사전 리스크 → 진행상황` 순서로 재구성되고, `/cc`는 Goal의 성공 기준을 최우선 로드해 미달 시 done을 차단하고 Plan A↔B를 자동 전환하는 Goal-aware 실행 엔진으로 격상됐다.\n\n## 주요 결정 사항\n\n- **Goal 절대 우위**: 모든 보조 섹션(Plan A/B, Pre-mortem)은 Goal에 종속. Goal이 약하면 Approve 거부.\n- **/cp↔/cc 핸드오프 프로토콜 명문화**: 어떤 필드를 어떤 형식으로 전달하는지 양쪽 SKILL.md에 고정.\n- **Plan B 의무화**: medium+ 규모는 Plan B 필수, small은 생략 사유 명시.\n- **8개 언어 헤더 dict**: Goal/Plan A/Plan B/Trigger 키를 EN/KO/JA/ZH/ES/FR/DE/IT 전부 채움.\n- **하위 호환**: 기존 v3.3.x 형식 문서도 `parsePlanFrontmatter`로 계속 읽힘.\n\n## 변경 파일\n\n- `skills/cp/SKILL.md` — Phase 0(Goal) → Plan A → Plan B → Pre-mortem 재구성\n- `skills/cc/SKILL.md` — Goal-aware 실행 엔진 (성공 기준 미달 시 done 차단, Plan A↔B 자동 전환)\n- `lib/plan-manager.js` — `REQUIRED_SECTIONS` / `generatePlanContent()` / 신규 `extractGoal()`\n- `templates/plan.template.md` — 새 구조 reference\n- `CHANGELOG.md` v3.4.0 entry + `plugin.json` 버전 bump\n\n## 테스트 & 검증\n\n`## [3.4.0] - 2026-05-16` 으로 출시됨 (CHANGELOG 확인). `/cp → Approve → /cc 자동 핸드오프` 시나리오에서 Goal 섹션 파싱 + 성공 기준 TodoWrite 등록 + Plan A↔B 전환 + 미달 시 done 거부가 동작.\n\n## 추가 사항\n\n이 Goal-first 기반은 이후 v3.7(검증 섹션), v3.8(사람 중심 2층 Goal), v3.9(Codex 듀얼 검증)로 계승됐다. 본 task는 출시 후 `docs/tasks/`에 방치돼 있다가 2026-05-27 `/cp done` sweep으로 정리됨.\n","truncated":false,"stale":false},{"id":"2026-05-14-lens-qa-review","folder":"history","title":"Lens 플러그인 코드 리뷰 + QA — 부분 close","date":"2026-05-14","hasMd":true,"hasHtml":false,"mdPath":"history/2026-05-14-lens-qa-review.md","htmlPath":null,"mdInline":"# Lens 플러그인 코드 리뷰 + QA — 부분 close\r\n\r\n**완료일**: 2026-05-14\r\n\r\n## 요약\r\n\r\n9건의 발견사항(CRITICAL 2, MAJOR 3, MINOR 4) 중 **MAJOR 2건**(bump-version.sh 4개 버그, plugin-registry source 호환성)이 v3.2.2(`fa17c45`)와 v3.3.0(`ee1a4f9`) release에 흡수되어 close. **CRITICAL 2건은 미해결 carry-over**.\r\n\r\n## 흡수된 항목 (close)\r\n\r\n### MAJOR — bump-version.sh 4개 버그 (#3)\r\n- (a) sed pattern → v3.2.2에서 정규식 `v[0-9]+\\.[0-9]+\\.[0-9]+`로 일반화\r\n- (b) CHANGELOG.md multi-line prepend → awk로 교체\r\n- (c) grep -P locale → `LC_ALL=C.UTF-8` 명시 (스크립트 호출자 책임)\r\n- (d) verify가 stale drift 못 잡음 → 새 verification block: `grep -rohE \"v[0-9]+\\.[0-9]+\\.[0-9]+\"` 후 `$NEW_VERSION` 외 모두 stale 표기\r\n\r\n### MAJOR — plugin-registry source 호환성 (#4)\r\n- string `source` → typed `{type, repo}` 객체 (v3.3.0)\r\n- `formatPluginSource()` helper로 backward compat\r\n- Claude Code의 fake marketplace lookup 패턴 구조적 차단\r\n\r\n## 미해결 carry-over (v3.4 roadmap 후보)\r\n\r\n### CRITICAL — Session 차단 위험 (미해결)\r\n\r\n- **#1 stdin blocking read in 4 hooks** (`post-tool-task.js:77`, `pre-tool-task.js:64`, `stop.js:61`, `session-start.js:25`). Claude Code가 stdin 안 보내면 5초 timeout까지 hang. Fix 방안: `if (process.stdin.isTTY) process.exit(0);` 가드.\r\n- **#2 fs.* operations without try/catch** (session-start.js, agent-tracker.js, keyword-matcher.js, memory-store.js, plan-manager.js 등 15곳). 권한/disk/corrupt 시 hook 통째로 throw → \"Hook UserPromptSubmit error\" 패턴. Fix 방안: sync-pull.js의 fail-soft 패턴 적용.\r\n\r\n### MINOR — 미해결\r\n\r\n- context 비용 절감 (Plugin Discovery Registry 표 크기), 에러 처리 일관성, KNOWN_PLUGINS 표기 통일.\r\n\r\n## 주요 결정 사항\r\n\r\n- v3.3.0은 MAJOR 2건에 집중. CRITICAL은 의도적 deferral — 별도 hook refactor task로 분리할 가치.\r\n- 모든 발견사항을 v3.3.0에 욱여넣지 않은 이유: minor release scope는 \"structural fix\"에 집중, hook 안전성은 별도 정밀 작업 필요.\r\n\r\n## 변경 파일\r\n\r\n이번 QA review의 fix는 두 release에 분산됨:\r\n- v3.2.2 (`fa17c45`): `scripts/bump-version.sh`\r\n- v3.3.0 (`ee1a4f9`): `lib/plugin-registry.js` + dependents\r\n\r\n## 테스트 & 검증\r\n\r\n- v3.2.2 bump-version.sh 정규식: v3.2.2 → v3.3.0 bump가 첫 실전 검증 (10/10 파일 자동 sync, stale detection 작동).\r\n- v3.3.0 source 구조: lens-upgrade Phase 5 verify에서 cache 새 install 시 새 구조로 정상 로드 확인.\r\n\r\n## 추가 사항\r\n\r\nCRITICAL 2건(#1, #2)은 다음 v3.4 또는 v3.3.1 patch에서 별도 task로 다시 열어 처리 권장. hook safety 단독 PR이 안전.\r\n","truncated":false,"stale":false},{"id":"2026-05-14-v3.3.0-minor-release","folder":"history","title":"Lens v3.3.0 — minor release 완료","date":"2026-05-14","hasMd":true,"hasHtml":false,"mdPath":"history/2026-05-14-v3.3.0-minor-release.md","htmlPath":null,"mdInline":"# Lens v3.3.0 — minor release 완료\r\n\r\n**완료일**: 2026-05-14\r\n\r\n## 요약\r\n\r\n`lib/plugin-registry.js`의 `KNOWN_PLUGINS` source 필드를 string에서 typed object(`{type, repo}`)로 변경하고, 신규 `formatPluginSource()` helper를 export하는 minor release. 핵심 원인은 Claude Code plugin loader가 string source(`'ccplugins/awesome-claude-code-plugins'`)를 `/` 기준으로 split해 owner를 가짜 marketplace ID로 잘못 해석하던 패턴. 구조적 차단으로 해결.\r\n\r\n## 주요 결정 사항\r\n\r\n- **semver minor 선택**: `formatPluginSource()`가 string fallback을 포함해 backward compat 유지 → breaking 아님. patch가 아닌 minor가 정확.\r\n- **bump-version.sh 정규식 신뢰**: v3.2.2의 `fa17c45` commit에서 도입한 `v[0-9]+\\.[0-9]+\\.[0-9]+` 매칭이 첫 실전 작동. 10/10 파일 자동 sync 성공.\r\n- **master + tag 분리 push**: 옛 tag(v1.9.0, v2.0.0) conflict 회피를 위해 `git push origin master` 와 `git push origin v3.3.0` 분리 실행.\r\n- **CHANGELOG 직접 채움**: bump-version.sh가 prepend한 빈 template에 한국어로 Added/Changed/Fixed/Note 작성.\r\n\r\n## 변경 파일\r\n\r\n- `lib/plugin-registry.js` — `KNOWN_PLUGINS` source 구조 변경 + `formatPluginSource()` export\r\n- `hooks/session-start.js` — Plugin Discovery Registry 표가 `formatPluginSource(p.source)` 사용 + v3.3.0 banner\r\n- `.claude-plugin/plugin.json`, `.claude-plugin/marketplace.json` — version + ref bump\r\n- `hooks/hooks.json` — Lens v3.3.0 표기\r\n- `skills/c/SKILL.md`, `skills/cc/SKILL.md`, `skills/cp/SKILL.md` — 본문 버전\r\n- `CLAUDE.md` — Current 버전 + Updated 날짜\r\n- `README.md` — 제목 버전\r\n- `CHANGELOG.md` — v3.3.0 section 추가\r\n- `lib/hook-utils.js` — 신규 (commit에 포함)\r\n\r\n## 테스트 & 검증\r\n\r\n- `bash scripts/bump-version.sh 3.3.0` → 10/10 파일 갱신 + verification에서 stale v1.0.33 1건 발견(README의 외부 도구 표기, false positive)\r\n- `git push origin master` → `fa17c45..ee1a4f9` 정상\r\n- `git push origin v3.3.0` → `* [new tag] v3.3.0 -> v3.3.0` 정상\r\n- `bash scripts/upgrade.sh` (lens-upgrade) → Phase 5 verify에서 v3.3.0, scope=user, single entry 확인\r\n\r\n## 추가 사항\r\n\r\n- 향후 같은 lookup-fail 패턴이 재발 불가 — 구조적 차단.\r\n- 다음 정규식 bump 시 `v1.0.33` warning은 외부 도구 표기라 무시 가능. README의 진짜 lens 버전은 line 1 매칭으로 정확히 갱신됨.\r\n","truncated":false,"stale":false},{"id":"2026-05-04-lens-v3.3-roadmap","folder":"history","title":"Lens v3.3 Roadmap — 부분 달성, 재정렬 필요","date":"2026-05-04","hasMd":true,"hasHtml":false,"mdPath":"history/2026-05-04-lens-v3.3-roadmap.md","htmlPath":null,"mdInline":"# Lens v3.3 Roadmap — 부분 달성, 재정렬 필요\r\n\r\n**완료일**: 2026-05-14\r\n\r\n## 요약\r\n\r\n5/4에 작성한 6-phase 야심찬 로드맵(Cost-aware Orchestrator). 실제로 release된 v3.3.0(`ee1a4f9`)은 로드맵 범위와 다른 방향 — **source-format fix + bump-version.sh hardening**이 핵심이고, 로드맵의 plan-drift/cost telemetry/prompt caching/`/cs` 강화/`/qa`·`/retro`·`/canary` 신규 스킬은 **모두 미착수**.\r\n\r\n## 로드맵 vs 실제 v3.3.0 비교\r\n\r\n| Phase | 로드맵 | v3.3.0 실제 |\r\n|-------|------|-----------|\r\n| 1. Plan-drift | ❌ 미착수 | — |\r\n| 2. Cost telemetry | ❌ 미착수 | — |\r\n| 3. Hook & caching | ❌ 미착수 | — |\r\n| 4. `/cs` 강화 | ❌ 미착수 | — |\r\n| 5. `/qa`·`/retro`·`/canary` 신규 | ❌ 미착수 | — |\r\n| 6. 릴리스 (CHANGELOG, 9곳 버전, dogfood, push) | ✅ 다른 내용으로 실행 | bump-version.sh + push + lens-upgrade 검증 완료 |\r\n\r\n## 주요 결정 사항\r\n\r\n- **로드맵 우선순위 재조정 필요**: 5/4 작성 후 2주 동안 실제 사용자 페인이 hook stability + plugin source format 쪽으로 드러남. 로드맵의 Phase 1-5는 가치 있지만 우선순위가 아님.\r\n- **v3.3.0 release scope 축소 채택**: 로드맵 따라가지 않고 실제 발생한 lookup-fail 패턴 + bump-version 버그 fix에 집중. 작은 release를 자주 내는 패턴이 더 안전.\r\n- **로드맵 carry-over**: 6 phase 모두 미착수 → v3.4 또는 v4.0 roadmap으로 이관 권장.\r\n\r\n## 변경 파일\r\n\r\n이번 history 자체. v3.3.0 release는 별도 history(`2026-05-14-v3.3.0-minor-release.md`)에 정리.\r\n\r\n## 테스트 & 검증\r\n\r\n해당 없음 — 로드맵 자체는 계획 문서.\r\n\r\n## 추가 사항\r\n\r\n### v3.4 또는 v4.0 후보 항목 (carry-over)\r\n\r\n- **plan-drift 방어**: `/cp` plan_id + `~/.claude/lens/plan-state.json` 영속화 + Supervisor 강제 게이트\r\n- **cost telemetry**: `lib/usage-meter.js` + `lib/pricing.js` + PostToolUse hook에서 worker별 토큰 누적\r\n- **prompt caching**: `/c`, `/cc` Leader 호출에서 system prompt를 ephemeral cache block으로 분리 (5분 TTL, 90% 할인)\r\n- **`/cs` 강화**: cost-cap, `--cost-preview`, status, AUTO_COMMIT_BLOCKLIST\r\n- **`/qa`, `/retro`, `/canary` 3종**: 커뮤니티 검증 패턴 흡수\r\n\r\n이 carry-over 5개는 v3.4 roadmap task로 새로 작성 권장. 이번 history 종결 시점에는 미착수 상태 명시로 충분.\r\n\r\n### lens-qa-review의 CRITICAL 2건과 통합 고려\r\n\r\nQA review에서 미해결 처리된 stdin blocking + fs try/catch 2건은 hook stability 영역. v3.4의 Phase 1(plan-drift)과 hook 변경이 겹치므로 묶어서 처리 가능.\r\n","truncated":false,"stale":false},{"id":"2026-05-04-v3.2.0-cs-multi-repo-sync","folder":"history","title":"Lens v3.2.0 — `/cs` Multi-Repo Sync — 완료","date":"2026-05-04","hasMd":true,"hasHtml":false,"mdPath":"history/2026-05-04-v3.2.0-cs-multi-repo-sync.md","htmlPath":null,"mdInline":"# Lens v3.2.0 — `/cs` Multi-Repo Sync — 완료\r\n\r\n**완료일**: 2026-05-04\r\n**Release**: v3.2.0\r\n\r\n## 요약\r\n\r\n워크스페이스 하위 모든 git repo 를 일괄 동기화하는 신규 skill `/cs` 를 추가하고, SessionStart 마다 자동으로 incoming 변경을 pull 하는 hook 도 함께 등록했다. push 는 안전성 우선 정책으로 자동 실행하지 않고 사용자가 명시적으로 `/cs` 또는 `/cs push` 를 호출할 때만 발동한다. 사용자가 여러 기기 (Windows desktop, Mac mini, 노트북) 에서 같은 워크스페이스를 다루는 환경에서, 어느 기기에서든 lens 만 활성화하면 동일한 sync 동작을 받을 수 있게 됐다.\r\n\r\n## 주요 결정 사항\r\n\r\n- **Plugin 자체 등록 vs livevil-setting 의존**: lens self-contained 로 결정. `scripts/git-sync-all.sh` 를 lens 안에 두고, livevil-setting 의 같은 파일과 분리. 노트북에 livevil-setting clone 안 되어 있어도 lens 만 있으면 작동.\r\n- **자동 pull + 명시적 push (방식 C)**: SessionStart 에서 `git pull --ff-only` 자동 실행. Stop 에서 자동 push 는 하지 않음. push 가 자동으로 발동되면 미완성 코드도 올라갈 위험 있어 사용자가 의도적으로 호출하도록.\r\n- **opt-out 메커니즘**: `LENS_SYNC_AUTO_PULL=0` 환경변수로 SessionStart auto-pull 끔. plugin level 토글이 아니라 환경변수 — 더 가볍고 사용자별 cusotomization 가능.\r\n- **Cross-platform Bash 자동 감지**: Windows Git for Windows (`C:/Program Files/Git/bin/bash.exe`), msys64, WSL fallback. macOS/Linux `/bin/bash`. 사용자가 어느 노트북에서든 추가 설정 없이 작동.\r\n- **Fail-soft 처리**: 한 repo 실패가 나머지 진행을 막지 않음. Diverged repo 는 손대지 않고 `manual resolve required` 로만 보고. Auto-merge 시도 안 함 (안전).\r\n- **Auto-commit message 정형화**: `chore: auto-sync YYYY-MM-DD` 단일 라인. 매번 같은 패턴이라 git log 에서 식별 쉬움. Author 강제 (`livevil7 <livevil7@gmail.com>`).\r\n- **이전 PC 전용 setup 폐기**: 이전엔 `~/.claude/settings.json` 에 SessionStart/Stop bash hook 직접 박고 `~/.claude/commands/sync-all.md` 슬래시 커맨드 파일 두는 방식이었음. lens v3.2.0 통합 후 양쪽 다 제거 → marketplace 통한 단일 source of truth.\r\n\r\n## 변경 파일\r\n\r\n- `skills/cs/SKILL.md` (신규) — `/cs` 명령 정의: `pull` / `push` / `sync` 3 모드, Bash resolution, 사용 패턴, fail-soft 정책 명시\r\n- `scripts/git-sync-all.sh` (신규) — POSIX shell 스크립트. workspace 자동 감지, fetch → ff-pull → auto-commit → push 4 단계 파이프라인. 컬러 박스 리포트 출력\r\n- `hooks/sync-pull.js` (신규) — Node 기반 SessionStart hook. cross-platform Bash 자동 resolve, 90초 timeout, fail-soft (오류 발생해도 세션 시작 막지 않음)\r\n- `hooks/hooks.json` — SessionStart 배열에 sync-pull entry 추가 (once: true). 기존 session-start.js 와 별개 등록\r\n- `.claude-plugin/plugin.json` — version 3.1.0 → 3.2.0, description \"Skill navigator + multi-repo git sync\" 로 확장, keywords `git-sync` `multi-repo` `auto-pull` 추가\r\n- `.claude-plugin/marketplace.json` — version + ref + description + tags 동기화\r\n- `CHANGELOG.md` — v3.2.0 entry\r\n\r\n## 테스트 & 검증\r\n\r\n- 이전 PC custom hook ( `~/.claude/settings.json` SessionStart/Stop bash + `commands/sync-all.md`) 제거 후 lens 단일 source 로 전환 확인\r\n- Windows commit 170fe01 + tag v3.2.0 push 성공 (livevil7/creeta-lens master)\r\n- Marketplace fetch URL `CreetaCorp/lens` 가 같은 commit 가리킴 (GitHub redirect/alias)\r\n- `git-sync-all.sh sync` 직접 실행으로 19 repo 일괄 처리 확인 (T+0 시작 → T+5 완료, push 3 / pull 2 / unchanged 14)\r\n\r\n## 추가 사항\r\n\r\n- 다음 세션 재시작 시 marketplace 자동 fetch → `/cs` 슬래시 등록 + SessionStart auto-pull 활성. 노트북도 동일 (Claude Code 재시작 한 번이면 끝).\r\n- 향후 개선 후보: (1) `/cs` 가 dry-run 모드 지원, (2) auto-commit message 에 변경 파일 요약 포함, (3) GIT_ROOTS 외에 `.lens-sync.json` 같은 per-project 설정 파일.\r\n- 자동 push 가 필요한 사용자는 `~/.claude/settings.json` Stop hook 으로 `bash <plugin>/scripts/git-sync-all.sh push` 직접 등록 가능 (lens 표준은 아님, opt-in).\r\n","truncated":false,"stale":false},{"id":"2026-04-23-v3.1.0-codex-premortem-skill-enforcement","folder":"history","title":"Lens v3.1.0 — Codex Pre-mortem + Skill Enforcement — 완료","date":"2026-04-23","hasMd":true,"hasHtml":false,"mdPath":"history/2026-04-23-v3.1.0-codex-premortem-skill-enforcement.md","htmlPath":null,"mdInline":"# Lens v3.1.0 — Codex Pre-mortem + Skill Enforcement — 완료\r\n\r\n**완료일**: 2026-04-23\r\n**Release**: v3.1.0\r\n\r\n## 요약\r\n\r\n`/cp` PLAN 모드에 Phase 2.5 Pre-mortem 단계를 추가해 Claude Opus + Codex GPT-5.2 병렬로 계획 문서의 리스크를 사전 분석하도록 했고, `/c` 와 `/cc` 의 Worker 프롬프트를 강화해 할당된 스킬을 반드시 호출하도록 강제하면서 Supervisor가 그 호출 여부를 감사하도록 만들었다.\r\n\r\n## 주요 결정 사항\r\n\r\n- **두 모델 병렬 pre-mortem**: 같은 모델로 자기 검증 시 동일 편향 공유 문제. Opus(세션 컨텍스트 기반) + Codex(독립 코드 분석)의 교차 검증으로 블라인드 스팟 해소.\r\n- **Codex 미설치 환경 fallback**: `command -v codex` 또는 VSCode 확장 경로 감지. 부재 시 \"Codex 미설치 — Opus 단독\" 명시 표기. 설치 강제 안 함.\r\n- **Supervisor 조건부 opus 승격**: Worker 할당에 `opus` 포함 시 Supervisor 도 자동 opus 승격. \"주니어가 시니어 코드 리뷰\" 역전 구조 해소. 단순 태스크는 sonnet 유지로 비용 절약.\r\n- **Skill Enforcement는 강제 명령문으로**: 기존 \"할당된 Skill (있는 경우)\" 참고 문구를 \"필수 실행 스킬 (SKIP 금지)\" 명령문으로 교체. 첫 액션 = `Skill invoke` 강제. 완료 보고 첫 줄 `Skill invoked: /{skill_name}` 필수.\r\n- **Supervisor 감사 조항**: Worker 보고에서 `Skill invoked:` 라인 누락 시 해당 서브태스크 점수 0점 + 재작업 지시. `general` 명시 태스크는 감사 제외.\r\n- **Phase 2/2.5 분리 Write**: Phase 2.5 실패해도 Phase 2 의 계획 문서는 이미 저장됨. 원자성 보장.\r\n\r\n## 변경 파일\r\n\r\n- `skills/cp/SKILL.md` — Phase 2.5 Pre-mortem 추가 (`## ⚠️ 사전 리스크` 섹션, Opus/Codex 병렬 호출, Blocker 판정)\r\n- `skills/c/SKILL.md` — Worker 프롬프트의 Skill Enforcement 강화, Supervisor opus 승격 + 감사 조항\r\n- `skills/cc/SKILL.md` — `/c` 와 동일 변경 (Worker + Supervisor)\r\n- `docs/rules/codex-integration.md` (신규) — Codex CLI 감지 로직, 인증 확인, 표준 호출 패턴(`codex exec --skip-git-repo-check`), 응답 파싱, pre-mortem 프롬프트 템플릿, 에러 처리\r\n- `.claude-plugin/plugin.json`, `marketplace.json` — version 3.0.0 → 3.1.0\r\n- `CHANGELOG.md` — v3.1.0 entry\r\n\r\n## 테스트 & 검증\r\n\r\n- `/cp` PLAN 모드 시연: 계획 저장 후 `## ⚠️ 사전 리스크` 섹션에 Opus + Codex 답변 양쪽 기록 확인\r\n- Codex 미설치 환경 fallback: Opus 단독 + 표기 동작 확인\r\n- `/c`, `/cc` Worker 보고 첫 줄 `Skill invoked:` 라인 검증 통과/실패 시나리오 양쪽 확인\r\n- Supervisor opus 자동 승격: Worker 할당에
