<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lens — Documentation Board</title>
<link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">

<style>
/* ════ Light design tokens ════ */
:root {
  --bg: #fafafa;
  --card: #ffffff;
  --fg: #18181b;
  --fg-2: #3f3f46;
  --fg-mute: #71717a;
  --line: #e4e4e7;
  --line-soft: #f1f1f3;
  --accent: #2563eb;
  --accent-soft: rgba(37, 99, 235, 0.08);
  --warn: #b91c1c;
  --stale: #b45309;
  --stale-soft: rgba(180, 83, 9, 0.12);
  --good: #16a34a;
  --rules: #7c3aed;
  --rules-soft: rgba(124, 58, 237, 0.10);
}

* { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
html, body { margin: 0; padding: 0; min-height: 100%; background: var(--bg); color: var(--fg); }

body {
  font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
  font-size: 14px;
  line-height: 1.55;
  font-feature-settings: "tnum";
}

::selection { background: var(--accent-soft); }

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

button {
  font: inherit; cursor: pointer;
  background: var(--card); color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 6px 12px;
  letter-spacing: -0.005em;
  transition: border-color 120ms, background 120ms, color 120ms;
}
button:hover { border-color: var(--fg-mute); }
button:active { transform: translateY(1px); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 500; }
button.primary:hover { background: #1d4fd4; border-color: #1d4fd4; }
button.ghost { border-color: transparent; color: var(--fg-mute); }
button.ghost:hover { color: var(--fg); background: var(--line-soft); }

code, .mono {
  font-family: "Pretendard Variable", monospace;
  font-variant-numeric: tabular-nums;
}
code {
  font-size: 0.92em;
  background: var(--line-soft);
  padding: 1px 5px;
  border-radius: 3px;
  color: var(--accent);
}

/* ════ Top bar ════ */
.topbar {
  position: sticky; top: 0; z-index: 30;
  background: rgba(250, 250, 250, 0.9);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  padding: 12px 24px;
  display: flex; align-items: center; gap: 16px;
}
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand .repo { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
.brand .repo .dim { color: var(--fg-mute); font-weight: 400; }
.brand .title { font-size: 12px; color: var(--fg-mute); }

.topbar .grow { flex: 1; }
.topbar .stats {
  display: flex; gap: 14px;
  font-size: 11px; color: var(--fg-mute);
  font-variant-numeric: tabular-nums;
}
.topbar .stats b { color: var(--fg); font-weight: 500; }
.topbar .stats .sep { color: var(--line); }

.search input {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 6px 12px;
  width: 240px;
  font: inherit;
  color: var(--fg);
}
.search input:focus { outline: none; border-color: var(--accent); }

/* ════ Board grid ════ */
.board {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  padding: 12px;
  min-height: calc(100vh - 53px);
}
.column {
  display: flex; flex-direction: column;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 6px;
  min-width: 0;
}
.col-head {
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
}
.col-head .label {
  display: flex; align-items: center; gap: 8px;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--fg-mute);
  font-weight: 500;
}
.col-head .label .pip { width: 6px; height: 6px; border-radius: 50%; }
.column[data-column="tasks"]   .pip { background: var(--accent); }
.column[data-column="history"] .pip { background: var(--good); }
.column[data-column="rules"]   .pip { background: var(--rules); }
/* Rules column reads as "reference docs" — muted purple header accent. */
.column[data-column="rules"] .col-head { background: var(--rules-soft); }
.column[data-column="rules"] .col-head .label { color: var(--rules); }
.col-head .count {
  font-size: 11px;
  color: var(--fg-mute);
  font-variant-numeric: tabular-nums;
}

.cards {
  flex: 1;
  overflow-y: auto;
  display: flex; flex-direction: column;
  gap: 8px;
  padding: 10px;
}

/* ════ Card ════ */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 14px 16px;
  cursor: pointer;
  user-select: none;
  transition: border-color 120ms;
}
.card:hover { border-color: var(--fg-mute); }

.card h3.tt {
  font-size: 13.5px;
  font-weight: 600;
  line-height: 1.4;
  letter-spacing: -0.01em;
  margin: 0;
  color: var(--fg);
  text-wrap: balance;
  word-break: break-word;
}

.card .meta-row {
  display: flex; flex-wrap: wrap; gap: 7px; align-items: center;
  margin-top: 9px;
  font-size: 11px;
  color: var(--fg-mute);
  font-variant-numeric: tabular-nums;
}
.card .meta-row .date { color: var(--fg-mute); }
.badge {
  font-size: 9.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 1.5px 6px;
  border-radius: 3px;
  font-weight: 600;
  line-height: 1.6;
}
.badge.html  { background: var(--accent-soft); color: var(--accent); }
.badge.md    { background: var(--line-soft); color: var(--fg-mute); }
.badge.stale { background: var(--stale-soft); color: var(--stale); }

.empty {
  padding: 32px 16px;
  text-align: center;
  color: var(--fg-mute);
  font-size: 12px;
  font-style: italic;
}

/* ════ Slide-over panel (cloned from reference) ════ */
.scrim {
  position: fixed; inset: 0; z-index: 90;
  background: rgba(24, 24, 27, 0.4);
  opacity: 0; pointer-events: none;
  transition: opacity 200ms;
}
.scrim.open { opacity: 1; pointer-events: auto; }

.panel {
  position: fixed; top: 0; right: 0; bottom: 0;
  width: min(860px, 62vw);
  background: var(--bg);
  border-left: 1px solid var(--line);
  z-index: 100;
  transform: translateX(100%);
  transition: transform 240ms cubic-bezier(0.22, 1, 0.36, 1);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.panel.open { transform: translateX(0); }

.panel header {
  padding: 18px 28px 14px;
  border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between; align-items: flex-start; gap: 14px;
  background: var(--card);
}
.panel header .info { min-width: 0; }
.panel header .id-row {
  font-size: 11px;
  color: var(--fg-mute);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.04em;
  margin-bottom: 4px;
}
.panel header h2 {
  margin: 0;
  font-size: 22px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--fg);
  text-wrap: balance;
  max-width: 56ch;
  word-break: break-word;
}
.panel header .top-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; }

.panel .notes {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  padding: 10px 28px;
  font-size: 11.5px;
  border-bottom: 1px solid var(--line);
  background: var(--card);
}
.panel .notes:empty { display: none; }
.panel .notes .trunc { color: var(--warn); }
.panel .notes .trunc a { color: var(--warn); text-decoration: underline; }

.panel .scroll { flex: 1; overflow: hidden; position: relative; }

.report-frame {
  width: 100%; height: 100%;
  border: 0; display: block;
  background: #fff;
}

.md-scroll { width: 100%; height: 100%; overflow: auto; }
.md-pre {
  margin: 0;
  padding: 24px 28px 48px;
  font-family: "Pretendard Variable", ui-monospace, monospace;
  font-size: 12.5px;
  line-height: 1.7;
  color: var(--fg-2);
  white-space: pre-wrap;
  word-break: break-word;
  tab-size: 2;
}

/* ════ Toast ════ */
.toast {
  position: fixed;
  bottom: 24px; left: 50%; transform: translateX(-50%) translateY(12px);
  background: var(--fg);
  color: var(--card);
  border-radius: 4px;
  padding: 11px 18px;
  font-size: 12.5px;
  line-height: 1.5;
  z-index: 300;
  opacity: 0;
  transition: all 200ms;
  pointer-events: none;
  max-width: 520px;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
}
.toast .cmd {
  font-family: "Pretendard Variable", ui-monospace, monospace;
  font-size: 11.5px;
  color: #93c5fd;
  word-break: break-all;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ════ Modal (clipboard fallback) ════ */
.modal-scrim {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(24, 24, 27, 0.45);
  display: none;
  align-items: center; justify-content: center;
  padding: 24px;
}
.modal-scrim.open { display: flex; }
.modal {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 22px 24px 20px;
  width: min(560px, 100%);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
}
.modal h3 {
  margin: 0 0 6px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.modal p {
  margin: 0 0 14px;
  font-size: 12.5px;
  color: var(--fg-mute);
  line-height: 1.55;
}
.modal textarea {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 10px 12px;
  color: var(--fg);
  font-family: "Pretendard Variable", ui-monospace, monospace;
  font-size: 12.5px;
  resize: none;
  min-height: 64px;
}
.modal textarea:focus { outline: none; border-color: var(--accent); }
.modal .modal-actions {
  display: flex; justify-content: flex-end; gap: 8px;
  margin-top: 16px;
}

/* ════ Print ════ */
@media print {
  .topbar, .scrim, .toast, .modal-scrim { display: none !important; }
  .panel { position: static; transform: none; width: 100%; }
  body { background: #fff; }
}

/* ════ Responsive ════ */
@media (max-width: 980px) {
  .board { grid-template-columns: 1fr; }
  .panel { width: 100vw; }
  .topbar { flex-wrap: wrap; }
  .search input { width: 180px; }
}
</style>
<style>
/* ════ In Review column ════ */
.board { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.column[data-column="review"] .pip { background: var(--stale); }
.column[data-column="review"] .col-head { background: var(--stale-soft); }
.column[data-column="review"] .col-head .label { color: var(--stale); }
.badge.pr { background: var(--accent-soft); color: var(--accent); text-decoration: none; }
.badge.pr:hover { text-decoration: underline; }
@media (max-width: 980px) { .board { grid-template-columns: 1fr; } }
</style>
</head>

<script>
(() => {
  "use strict";

  const BOARD = {"schemaVersion":3,"repo":"creeta-lens","generatedAt":"2026-08-14T14:23:13.792Z","groups":{"tasks":[{"id":"2026-08-14-cs-mirror-invariant","folder":"tasks","title":"/cs 미러 개편 — \"런이 끝나면 클라우드가 곧 최신\"을 불변식으로","date":"2026-08-14","hasMd":true,"hasHtml":true,"mdPath":"tasks/2026-08-14-cs-mirror-invariant.md","htmlPath":"tasks/2026-08-14-cs-mirror-invariant.html","mdInline":"---\nplan_id: 2026-08-14-cs-mirror-invariant\nplanner: cp\ngrade: deep\ncreated: 2026-08-14\nstatus: planned\nrepo: creeta-lens\nbase: master\nbranch: feat/cs-mirror-invariant\npr: null\nrefs:\n  - docs/rules/branch-lifecycle.md\n  - docs/history/2026-07-20-lens-plan-engine-overhaul.md\n---\n\n# /cs 미러 개편 — \"런이 끝나면 클라우드가 곧 최신\"을 불변식으로\n\n## 🎯 What — 목표 (무엇이 가능해지는가, 사람 언어)\n\n- **어느 컴퓨터에서든 `/cs` 한 번이면, 내 작업 전부가 클라우드(GitHub)에 올라가 있고 다른 컴퓨터는 받기만 하면 되는 상태가 된다.**\n- `/cs`가 스스로 만든 찌꺼기(열린 자동 PR, 병합 끝난 브랜치)를 **다음 실행이 알아서 치운다** — 몇 주씩 쌓여 사람이 청소하러 들어가는 일이 없어진다.\n- \"성공 32/32\" 같은 보고가 **진짜 깨끗함을 의미한다** — 올라가다 만 작업이 성공으로 집계되는 일이 없다.\n\n**완료의 정의 (Done = ?):**\n\n> 아무 레포나 지저분하게 만들어 놓고 `/cs`를 한 번 돌린 뒤, 다른 컴퓨터에서 pull만 했을 때 그 작업이 그대로 보이고 — GitHub에는 열린 자동 PR도, 병합 끝난 잔여 브랜치도 남아 있지 않다.\n\n## 🎬 사용 장면\n\n대표가 Windows에서 작업을 끝내고 `/cs`를 친다. 보고에 \"✅ 깨끗함 30 · 📤 미러 2 · ⚠️ 확인 필요 1(ERP — 배포 게이트라 사람 결정)\"이 뜬다. Mac Mini에서 `/cs pull`을 치면 방금 작업이 전부 내려온다. 어디에도 열린 auto-sync PR이 없다.\n\n## 🚧 비목표 (Non-Goals)\n\n- **`prune_branches.py`의 /cs 통합·흡수** — prune은 전 접두사 대상 판정 도구로 남는다. /cs는 **자기 소유(`sync/`) 잔여물만** 회수한다. 남의 브랜치 정리는 계속 prune+사람 몫 (소유권 분리 원칙 유지)\n- **task 브랜치(feat/fix/ops/docs)·agent/ 브랜치의 자동 머지** — 내용을 모르는 작업을 자동으로 base에 넣지 않는다. 보고·에스컬레이션까지만\n- **SessionStart 자동 pull 정책 변경** — 30분 가드 그대로\n- **`/cp done`·`/cc`의 브랜치 라이프사이클 변경** — 그쪽 판정 로직(lib/git-branch.js)은 건드리지 않는다\n\n## ❓ Why — 왜 해야 하는가\n\n- **푸는 문제**: 소유자의 목적은 처음부터 \"미러\"였다 — *\"병합을 하던 뭘 하던 그건 모르겠고, 깔끔하게 클라우드에 올려놓고 다른 컴에서 그대로 받아 작업\"* (2026-08-14 대표 발언). 그런데 현행 /cs는 PR 의식(儀式)을 거치며 **실패 지점마다 잔여물을 남기고, 그 잔여물을 어떤 런도 회수하지 않는다.** 실측: auto-sync PR 13~21일 방치 3건 + agent PR 10~28일 3건 + 병합 끝난 브랜치 14개(금일 수동 정리). base 밖에 있는 커밋은 다른 머신에 **도달하지 않으므로**, 잔여물 방치 = 동기화 실패다.\n- **설계 이력이 증명하는 방향**: v3.25가 \"PR 보장\"을 도입할 때조차 사용자 원선택은 \"PR+자동머지\"였고(Codex 반박이 뒤집음 → v3.27 CHANGELOG가 \"그 반박 채택이 잘못\"이라고 자인), 이번 발언으로 **\"PR 기록\" 요구 자체가 철회**됐다. 남은 것은 미러 결과뿐이다.\n- **안 하면**: 사고 기전이 현행 코드에 살아 있다 — **머지 실패 시 `reset --hard`가 여전히 실행돼 로컬에서 변경이 사라진 것처럼 보인다**(2026-08-02 메모리 17개 소실과 동일 기전, 원격 PR에만 잔존). 미병합이 \"성공\"으로 집계돼 겉보기 32/32 뒤에 유실이 숨는다. 잔여물은 계속 쌓인다.\n\n## 🧰 실행 전략 & 자원\n\n- **난이도**: medium-large — 셸 스크립트 1개 중심이지만 멀티머신·데이터 유실 리스크가 크고 테스트가 0개인 영역\n- **권장 모델**: 구현 Worker=중간 티어(sonnet) · 리뷰/사고분석=TOP(**fable**) 1기 — 셸 로직은 Medium, lease·경합 검증은 Hard\n- **병렬 실행**: T1~T3 [P] 병렬 가능(같은 파일이므로 실제로는 순차 커밋 권장), T7 테스트는 T1-T5 후\n- **활용 스킬**: 없음(순수 셸+git). 검증은 bash 테스트 하네스\n- **기존 자원**: `lib/git-branch.js`의 판정 원칙(재사용은 원칙만 — /cs는 \"No Node\" 유지가 기본, 검토된 대안 참조) · `prune_branches.py`의 atomic lease 패턴(§7.1) · 기존 `LENS_SYNC_PR=0` 직push 코드 경로(:181-195, 이미 실재)\n\n## 🚫 DO NOT CHANGE\n\n- `lib/git-branch.js` — `/cp done`·`/cc`가 소비하는 판정 로직. 이번 범위 밖\n- `scripts/prune_branches.py` — 독립 도구로 유지. 원칙 동기화만 확인\n- `hooks/sync-pull.js`의 30분 간격 가드·기본 OFF — 헤드리스 폭주 방지 실측 픽스\n- `docs/rules/branch-lifecycle.md`의 §7.1 atomic lease 계약 본문 — 개정은 §3.2·§8의 /cs 관련 조항만\n- 각 레포의 `.gitignore` 신뢰 원칙 — /cs는 시크릿 필터를 추가하지 않는다(사용자가 의도적으로 시크릿을 버전관리하는 레포 존재)\n\n## 🛠 How — 어떻게\n\n### Plan A — 미러 기본 + 자기 잔여물 회수 + 불변식 보고\n\n#### 왜 이게 1순위인가\n실패가 잔여물을 만드는 구조(PR 의식) 자체를 제거하면 회수 대상이 원천 감소한다. 직push(미러)는 실패 시 **로컬에 커밋이 그대로 남아** 다음 런이 재시도한다 — 자기치유. PR 경로는 이미 죽은 요구(\"PR 보장\")를 위해 gh 의존·왕복 API·reset --hard·잔여물 리스크를 지불하고 있다. 기존 `LENS_SYNC_PR=0` 코드가 이미 있어 전환 비용이 낮다.\n\n#### 단계 (빌드레디 태스크)\n\n- [ ] **T1 미러 기본 전환 + 직push 경로 강화**\n      파일: `scripts/git-sync-all.sh:181` (기본값), `:183-195` (직push 경로), `:201-205` (wf 감지 이식)\n      변경: `${LENS_SYNC_PR:-1}` → `${LENS_SYNC_PR:-0}` (env 명시 시 기존 우선 존중). 직push 경로에 ① `.github/workflows` 사전 감지(현재 PR 경로에만 있는 :201-205 로직 이식 — 실패 시 사유 명시) ② push는 ff 전제(`git push` 기본 — force 계열 금지, 원격이 앞서면 거부→failed 보고) ③ 성공 시 `pushed+=(\"$name (+N, mirror)\")`\n      검증: 테스트 레포에서 dirty 상태로 실행 → base 직커밋·push, sync/ 브랜치 0개 생성, 로컬==원격 → pass\n      의존: 없음\n- [ ] **T2 config 인식 — base 대조 가드 + 레포별 정책**\n      파일: `scripts/git-sync-all.sh` (push 케이스 진입부, :164 직후), `lens.config.json` (+`syncPolicy` 키)\n      변경: `lens.config.json`에서 `baseBranch.<repo>`·`syncPolicy.<repo>` 를 셸 파싱(sed/grep — Node 불사용 원칙 유지, 키 구조 단순). ① config baseBranch가 있는데 현재 브랜치와 다르면 push skip + `⚠️ base 불일치` 보고(예: ERP에서 main 체크아웃 상태) ② `syncPolicy: \"pr-manual\"` 레포(초기값: Returns_ERP_v20)는 미러 금지 — 기존 PR 경로로 PR 생성까지만, 머지는 사람(현행 branch-lifecycle §1.2 준수)\n      검증: ERP 모의 레포(config에 pr-manual)에서 dirty 실행 → 직push 0회, sync/ PR 생성, 머지 시도 0회 → pass\n      의존: 없음\n- [ ] **T3 task 브랜치 가드를 스크립트로 이관**\n      파일: `scripts/git-sync-all.sh` (push 케이스 진입부)\n      변경: 현재 브랜치가 `feat/|fix/|ops/|docs/|agent/|claude/|codex/|task/|feature/|backup/` 접두사면 commit·push 전체 skip, `task-branch` 버킷으로 보고(ff pull은 수행). 현재 이 가드는 SKILL.md prose(에이전트 지시)에만 존재 — 스크립트가 단독 실행돼도 지켜지게\n      검증: feat/x 체크아웃+dirty 레포 실행 → 커밋 0·push 0·보고에 \"task 브랜치 — 건너뜀\" → pass\n      의존: 없음\n- [ ] **T4 reconcile — 자기 잔여물 회수 단계 신설**\n      파일: `scripts/git-sync-all.sh` (push 케이스, dirty 계산 :174 이전) + 배열 선언부(:82 부근) `reclaimed=()`\n      변경: 레포당 ① `gh pr list --state open` 중 `headRefName`이 `sync/`로 시작하는 PR: `pr-manual` 레포면 보고만, 그 외엔 `gh pr merge --merge --delete-branch` 시도 → 성공 `reclaimed+=`, 실패(충돌 등) `⚠️ 회수 불가` 보고 ② 원격 `sync/*` 브랜치 중 PR 없는 것: base 포함 여부를 `git merge-base --is-ancestor`→`git cherry` 2단으로 판정, **증명된 것만** atomic 이중 lease(`--force-with-lease=base:SHA --force-with-lease=branch:SHA`)로 삭제. 미증명·미머지 CLOSED PR의 브랜치는 절대 자동 삭제 금지(branch-lifecycle §3.2:213). gh 부재 시 이 단계 skip+보고(회수만 gh 의존, 미러는 무의존)\n      검증: 열린 sync PR 1 + 병합증명 잔여 sync 브랜치 1 + 미증명 1을 심은 모의 원격 → 런 후 PR 0·증명 브랜치 삭제·미증명 잔존 → pass\n      의존: T1 (버킷·보고 구조)\n- [ ] **T5 불변식 보고 — 성공의 재정의 + 유실 기전 제거**\n      파일: `scripts/git-sync-all.sh:245-255` (미병합 분류), `:270-277` (reset 조건), `:297-` (리포트), `:336-356` (--json)\n      변경: ① 레포 \"성공\" 판정 = `로컬 base==origin/base && dirty 0 && 열린 sync PR 0` — 미충족은 ✅에 세지 않고 사유 버킷으로 ② pr-manual 경로에서 `gh pr merge` 실패 시 `repo_err` 세팅(현재 else 없음 — 조용히 pushed 집계) ③ **`reset --hard`를 `$merged=true`일 때만 실행** — 미병합 시 로컬 워킹트리 되감기 금지(사고 기전 제거; 미러 경로엔 reset 자체가 없음) ④ `--json`의 stray `\\n` 인자 버그 수정(:356 — 현재 무효 JSON 2줄 출력, 실측) + `reclaimed`·`task_branch`·`policy_hold` 필드 추가(기존 필드 유지 — additive)\n      검증: 머지 실패 모의 → failed 버킷+로컬 커밋 보존 확인. `--json` 출력 마지막 줄 `python -m json.tool` 통과 → pass\n      의존: T1, T4\n- [ ] **T6 비-base 작업 가시화 — 방치 에스컬레이션**\n      파일: `scripts/git-sync-all.sh` (리포트 단계), `skills/cs/SKILL.md` (5개 초과 경고 절 대체)\n      변경: 런 말미 레포별 원격 비-base 브랜치를 마지막 커밋 날짜와 함께 나열(`ls-remote`+`git log -1 --format=%cr`), 7일 초과는 `⚠️ N일째 base 밖` 표시. 현재 \"5개 초과 카운트\"(에이전트 수동 수행)를 스크립트 출력으로 흡수 — 나이 기반이라 방치를 직접 가리킨다\n      검증: 오래된 브랜치가 있는 레포 실행 → 보고에 나이 표시 → pass\n      의존: 없음\n- [ ] **T7 시나리오 테스트 신설 (현재 0개)**\n      파일: `tests/test_git_sync.sh` (신규), `tests/fixtures/` (모의 gh 스텁)\n      변경: 로컬 bare 원격 fixture로 6시나리오 — 미러 push / task 브랜치 skip / pr-manual 정책 / reconcile 회수·미증명 보존 / 미병합 시 로컬 보존(reset 금지) / --json 유효성. gh는 PATH 앞에 스텁 셸 함수로 주입\n      검증: `bash tests/test_git_sync.sh` exit 0, 6/6 → pass\n      의존: T1~T5\n- [ ] **T8 문서·버전 동기화**\n      파일: `skills/cs/SKILL.md` (전면 개정 — 모드 표·불변식·정책·플래그 의미 반전 명시), `docs/rules/branch-lifecycle.md` §3.2·§8 (/cs 조항 개정 + **2026-08-14 대표 결정으로 \"PR 보장\" 전제 철회 이력 병기**), `CHANGELOG.md` (v3.31.0 breaking), `skills/cc/SKILL.md:203` (git-sync 주석 인용 갱신 확인), `.claude-plugin/plugin.json` (버전)\n      변경: 위 내용. LENS_SYNC_PR 의미가 반전됨(1=레거시 PR 모드 opt-in)을 breaking으로 명시\n      검증: 문서 3곳 grep으로 \"직접 push 로 우회하지 않음\" 류 구조항 잔존 0 → pass\n      의존: T1~T6\n- [ ] **T9 배포 + 현존 부채 일소 (1회성 운영)**\n      파일: 없음(운영). 대상: 이 머신+Mac Mini `/lens-upgrade`, 열린 PR 6개, ops/task 잔여 브랜치 4개\n      변경: ① 양 머신 업그레이드(버전 라벨≠배포 실측 있으므로 스크립트 해시로 확인) ② 새 /cs 1회 실행 → sync/ PR 3건 자동 회수 확인(ERP 2건은 pr-manual이라 보고로 남음 → 내용 확인 후 대표 결정) ③ agent/ PR 3건·ops/task 브랜치 4건: 내용 요약 보고 후 개별 결정(자동 처리 금지) ④ snapholo `docs/` PR #6(금일, 타 세션 소유)은 건드리지 않음\n      검증: 전 레포 `gh pr list` sync/ 0건 · 불변식 보고 ✅ 판정 → pass\n      의존: T8\n\n#### 막힐 수 있는 지점 (→ Plan B 트리거)\n- T2 셸 JSON 파싱이 config 구조 변화에 취약 → 파싱 실패 실측 시\n- T4 reconcile의 gh 의존이 무인 환경에서 매번 skip → 회수가 실질 동작 안 하면\n- T7 gh 스텁이 실제 gh 동작과 괴리 → 테스트 통과·실환경 실패 발생 시\n\n### Plan B — Fallback\n\n#### Trigger\nT2에서 셸 파싱이 config 확장(중첩 키)에 깨지거나, T4/T7에서 gh 스텁 괴리로 실환경 회귀가 2회 이상 발생 시.\n\n#### 왜 이 대안인가\n\"No Node\" 원칙을 접고 `node -e`로 `lib/git-branch.js`·JSON.parse를 직접 쓰면 파싱·판정이 견고해진다. 대가: /cs가 Node 런타임에 의존(Claude Code 플러그인 환경엔 항상 있으므로 실질 비용 낮음 — 원칙 개정을 CHANGELOG에 명시).\n\n#### 단계\n- [ ] B1: config 읽기를 `node -e \"JSON.parse\"` 원라이너로 교체\n- [ ] B2: reconcile 병합증명을 `lib/git-branch.js mergedState()` 호출로 교체(판정 로직 단일화)\n- [ ] B3: SKILL.md \"No Node, no Python\" 조항 개정 + CHANGELOG 기록\n\n### 🔀 듀얼 합성 (Claude ‖ Codex)\n\n**합의 (고신뢰):**\n- 진단 일치 — \"생성은 자동, 회수는 수동\" 비대칭이 근본 원인. 병합 실패가 success로 집계되고 reset --hard가 유실감을 만든다는 코드 지점(:245-250, :277)까지 동일 특정\n- 부채 일소(1회) → 불변식 중심 재설계 → 같은 런에서 잔여물 정리, 의 3단 구조\n- 안전장치(atomic 이중 lease·ERP staging 게이트·내용 기반 병합 증명) 유지\n\n**분기 → 해소:**\n- Codex \"mirror는 현재 브랜치를 그대로 push(task 브랜치 포함)\" vs branch-lifecycle §2 \"/cs는 task 브랜치를 소유하지 않는다\" → **후자 채택**(T3): task 브랜치 push는 /cc·사람 소유. 무관 작업이 섞인 chore PR 실측 사고가 근거\n- Codex \"mirror/integrate 2단 명령 분리\" vs Claude \"한 런 내 단계화\" → **후자 채택**: integrate(완료 작업의 base 병합)는 이미 `/cp done`의 소관 — /cs에 새 명령을 만들면 소유권이 중복된다\n\n### ⚠️ 사전 리스크 (Pre-mortem — Claude TOP)\n\n1. 미러 직push 경합: 두 머신이 동시에 push → ff 거부로 한쪽 failed(안전) — force 계열 절대 금지로 담보\n2. dirty 스윕에 의도치 않은 파일 — 기존과 동일 리스크(gitignore 신뢰), 변화 없음을 명시\n3. reconcile이 타 머신이 검토 중인 PR을 삼킴 → sync/ 접두사 한정 + pr-manual 제외로 차단\n4. ERP: config 미배포 머신에서 syncPolicy 미인식 → T2가 config **부재 시 보수 동작**(pr-manual로 폴백 아님 — upstream==staging 감지 시 미러 금지 하드코드 이중화)\n5. --json 소비 자동화가 새 필드에 놀람 → additive만, 기존 키 불변\n6. Mac Mini 배포 시차(버전 라벨≠실배포 실측) → T9가 스크립트 해시 대조\n7. 테스트의 gh 스텁 괴리 → Plan B 트리거로 연결\n8. LENS_SYNC_PR 의미 반전을 모르는 과거 문서·습관 → T8 breaking 명시+구 조항 grep 제거\n9. sync/ 미머지 CLOSED PR 브랜치 오삭제 → §3.2:213 규칙을 T4 판정에 명시 반영(증명 없으면 보존)\n10. diverged 영구 방치(기존 결함) — 이번 범위선 보고 강화(T6)까지, 자동 해소는 비목표\n\n## 🔀 검토된 대안 (Alternatives Considered)\n\n**대안 A — PR-and-merge 유지 + reconcile만 추가**\n- *Good, because* 변경 최소, \"fail-closed PR 보장\" 조항 무수정\n- *Bad, because* 실패 지점마다 잔여물 생성 구조가 그대로(회수로 뒷청소만), reset --hard 유실 기전 존속, gh 없으면 동기화 불능, 그리고 **그 PR 보장이라는 전제 자체가 사용자 발언으로 철회됨**\n- **기각** — 목적(미러)에 의식(PR)을 계속 종속시키는 안\n\n**대안 B — 전면 직push (예외 없음)**\n- *Good, because* 가장 단순\n- *Bad, because* ERP staging 직push=배포 사고(branch-lifecycle이 \"현재 유일한 배포 사고 경로\"로 명시)\n- **기각** — 안전 조항 위반\n\n**대안 C — 미러 기본 + 레포별 pr-manual 예외 + reconcile + 불변식 (채택)**\n- *Good, because* 목적 직결·자기치유·ERP 게이트 유지·기존 직push 코드 재사용\n- *Bad, because* LENS_SYNC_PR 의미 반전이라는 breaking, 문서 동기화 부담\n- **채택**\n\n## 💡 시사점 · ⚠️ 주의점 · 🔀 Side Effect\n\n- **💡 시사점**: \"성공\"의 정의가 문서가 아니라 스크립트 출력에 박힌다 — 이후 어떤 머신·버전에서 돌려도 불변식 미충족은 숨을 수 없다. agent/ 브랜치처럼 오너십 밖 이물질도 나이와 함께 매 런 노출된다\n- **⚠️ 주의점**: T9 부채 일소에서 ERP sync PR 2건은 **머지=배포**다 — 내용(변경 파일) 보고 후 대표 결정 없이 절대 머지하지 않는다. agent/ PR 3건도 동일(내용 미상 작업)\n- **🔀 Side Effect**: `/cs` 보고 포맷 변경 → 이를 파싱하는 쪽은 --json뿐(additive 유지로 무영향). branch-lifecycle §3.2의 \"sync/는 PR로 제안\" 서술 개정 필요(T8). SessionStart pull 훅은 pull 전용이라 무영향\n\n## ⚠️ 리스크 레지스터\n\n| ID | 리스크 | 트리거 | 영향 | 대응 | 중단 조건 |\n|---|---|---|---|---|---|\n| R1 | ERP에 미러 직push되어 배포 사고 | syncPolicy 미인식(config 부재/파싱 실패) | 높음 | T2 이중 방어(config+upstream 이름 staging 하드가드)+T7 테스트 | 테스트에서 ERP 모의 직push 1회라도 관측되면 T2 재설계 전까지 배포 중단 |\n| R2 | reconcile이 미증명 브랜치 삭제 | 2단 판정 버그 | 높음 | 증명 실패=보존 기본값, atomic 이중 lease, §3.2:213 준수 | 모의 테스트에서 미증명 삭제 1건이라도 발생 시 T4 롤백 |\n| R3 | 머지 실패 유실 기전 잔존 | reset 조건 수정 누락 | 높음 | T5 ③ + T7 \"로컬 보존\" 시나리오 고정 | 테스트 실패 시 배포 금지 |\n| R4 | 멀티머신 구버전 혼재로 동작 상이 | 한쪽만 업그레이드 | 중간 | T9 해시 대조 배포 확인 | Mac Mini 해시 불일치 방치 시 T9 미완료 처리 |\n| R5 | --json 스키마 회귀 | 필드 삭제/개명 | 낮음 | additive-only + json.tool 검증 | — |\n\n## ❓ 미해결 질문\n\n**차단 (답이 없으면 실행 불가)**\n- (없음) — 메커니즘은 대표가 명시 위임(\"병합을 하던 뭘 하던\"), 안전 예외(ERP)는 기존 규칙 준용\n\n**비차단 (가정을 두고 진행)**\n- agent/ 열린 PR 3건과 ops/task 브랜치 4건의 생사 — **가정**: T9에서 내용 요약 후 개별 결정(자동 처리 안 함) · **확인 시점**: T9\n- ERP sync PR 2건(13·21일 전 chore)의 머지 여부 — **가정**: 변경 파일 목록 보고 후 대표 결정 · **확인 시점**: T9\n- 레거시 PR 모드(LENS_SYNC_PR=1)를 쓰는 곳이 남아 있나 — **가정**: 없음(문서 grep으로 확인) · **확인 시점**: T8\n\n## ✅ Review — 검증 (EARS)\n\n**검증 전략**: 로컬 bare-remote fixture 기반 자동 테스트(T7)가 1차, 실워크스페이스 32레포 1회 실행+`gh pr list` 전수 조회가 2차. 결과는 명령 출력으로 대화에 남긴다.\n\n| # | EARS | 확인 방법 | 통과 판정 | 종류 |\n|---|---|---|---|---|\n| 1 | WHEN base 브랜치가 dirty인 레포에서 /cs 실행, THEN 스크립트 SHALL base에 커밋 후 직push하고 sync/ 브랜치를 만들지 않는다 | T7 시나리오1 + 실레포 1회 | sync/ 생성 0·로컬==원격 | auto |\n| 2 | WHEN push·머지 실패, THEN 스크립트 SHALL 로컬 커밋을 보존하고(reset 금지) failed로 보고한다 | T7 시나리오5 | 로컬 log에 커밋 잔존+failed 집계 | auto |\n| 3 | WHEN 열린 sync/ PR이 있는 레포에서 실행, THEN 스크립트 SHALL 회수(머지+lease 삭제)하거나 사유와 함께 보고한다 | T7 시나리오4 + 실환경 T9 | 런 후 sync PR 0 또는 사유 표기 | auto |\n| 4 | WHEN Returns_ERP_v20이 dirty, THEN 스크립트 SHALL 직push하지 않고 PR 생성까지만 수행한다 | T7 시나리오3 | 직push 0회 관측 | auto |\n| 5 | WHEN task/agent 접두사 브랜치가 체크아웃된 레포, THEN 스크립트 SHALL commit·push 없이 건너뛰고 보고한다 | T7 시나리오2 | 커밋 0·버킷 보고 | auto |\n| 6 | WHEN --json 실행, THEN 마지막 stdout 줄 SHALL 유효한 JSON이다 | `... --json \\| tail -1 \\| python -m json.tool` | exit 0 | auto |\n| 7 | WHEN 전 태스크 완료 후 실워크스페이스에서 /cs 1회, THEN 보고 SHALL 불변식 기준 ✅/사유를 레포별로 표시하고 열린 sync PR 0이다 | T9 실행 로그 | 대표 육안+gh 전수 0건 | manual |\n\n## 진행상황\n- **마지막 업데이트**: 2026-08-14\n- **현재 경로**: Plan A — 계획 수립 완료, 승인 대기\n- **재개 포인트**: 승인 → T1~T3 병렬 착수\n","truncated":false,"stale":false,"branch":"feat/cs-mirror-invariant","base":"master"},{"id":"2026-08-08-multimachine-identity-architecture","folder":"tasks","title":"멀티머신 정체성 아키텍처 — 기록이 섞이고 사라지는 구조를 끊는다","date":"2026-08-08","hasMd":true,"hasHtml":true,"mdPath":"tasks/2026-08-08-multimachine-identity-architecture.md","htmlPath":"tasks/2026-08-08-multimachine-identity-architecture.html","mdInline":"---\r\nplanner: cp\r\ngrade: deep\r\ndate: 2026-08-08\r\nslug: multimachine-identity-architecture\r\nscope: creeta-lens + livevil-setting + agentmemory\r\nrefs:\r\n  - docs/rules/coding-principles.md (livevil-setting)\r\n  - claude-code/bootstrap-sjrog.ps1 (livevil-setting)\r\n  - skills/cs/SKILL.md, skills/ci/SKILL.md, skills/cu/SKILL.md\r\n---\r\n\r\n# 멀티머신 정체성 아키텍처 — 기록이 섞이고 사라지는 구조를 끊는다\r\n\r\n## 🎯 What — 목표 (무엇이 가능해지는가)\r\n\r\n**이 작업이 끝나면 가능해지는 것:**\r\n\r\n- 어느 컴퓨터에서 물어봐도, 그 컴퓨터의 사실과 다른 컴퓨터의 사실이 **섞이지 않고** 구분되어 나온다.\r\n- 한 컴퓨터에서 정리한 내용이 다른 컴퓨터에서도 **그대로 보인다.** 지금처럼 한쪽에만 있고 다른 쪽엔 아예 없는 일이 없어진다.\r\n- 지운 것이 되살아나지 않는다. \"이 플러그인 지웠다\"고 하면 어느 컴퓨터에서 무슨 명령을 돌려도 다시 안 깔린다.\r\n- 동기화 작업이 기록을 지워버리는 일이 없어진다.\r\n- 에이전트가 \"설정 X가 되어 있습니다\"라고 말할 때, 그 말이 실제 파일과 일치한다.\r\n\r\n**완료의 정의 (Done = ?):**\r\n\r\n> 네 대(ADMIN·user·livev 윈도우 3대 + Mac Mini) 중 아무 두 대를 골라 같은 질문을 던졌을 때, 공통 사실은 양쪽에서 똑같이 나오고 머신 고유 사실은 각자 자기 것만 나온다.\r\n\r\n## 🎬 사용 장면 (이게 되면 실제로 이런 장면이 나온다)\r\n\r\n사용자가 **Mac Mini에 접속해** Claude Code 세션을 연다. 세션 시작 배너에 메모리 267개가 로드되고, 색인에 윈도우 PC에서 정리한 프로젝트 허브가 그대로 보인다. \"Returns ERP 배포 어떻게 하지?\"라고 물으면 **공통 규칙**(staging 먼저 → promote)이 나온다. 이어서 \"이 컴퓨터 디스크 상태는?\"이라고 물으면 **`machine: macmini` 태그가 붙은 메모리만** 근거로 쓰여서 SJ-OMEN의 디스크 이야기가 섞이지 않는다. 그리고 `/ci`를 돌리면 \"이미 목록과 일치 — 설치 0건, 제거 0건\"이 뜬다. `ponytail`이 다시 설치 후보로 올라오지 않는다.\r\n\r\n## 🚧 비목표 (Non-Goals)\r\n\r\n- **agentmemory 플러그인 자체를 포크하거나 고치는 것** — 남의 레포(rohitg00/agentmemory)다. 이번엔 공식 환경변수 스위치만 쓴다. 포크하면 업스트림 업데이트마다 재작업이 생긴다.\r\n- **9,725건 관측 기록의 완전 재분류** — 사후 복원이 불가능한 구간이 있다(아래 함정 참조). 이번엔 \"앞으로 안 섞이게\" + \"과거는 출처 표시\"까지다.\r\n- **Lens 스킬의 기능 개편** — `/cp`·`/cc`의 계획·실행 로직은 건드리지 않는다. 정체성·동기화 배선만 손댄다.\r\n- **Mac Mini의 서비스 운영 구조 변경** — agentmemory 서버가 Mac Mini 한 대에 있는 단일 장애점 문제는 인지하되 이번 범위 밖.\r\n- **비밀키·인증 재설계** — `AGENTMEMORY_SECRET` 등은 현행 유지.\r\n\r\n## ❓ Why — 왜 해야 하는가\r\n\r\n**푸는 문제 / 동기 (6하원칙)**\r\n\r\n| | |\r\n|---|---|\r\n| **왜 지금** | 오늘 하루만에도 네 가지가 실제로 터졌다 — ① agentmemory 가 서로 다른 PC 두 대를 한 네임스페이스로 합쳐 놓았다(192세션) ② `/cu`가 winget 21건을 통째로 놓치고 \"다 최신\"처럼 보고했다 ③ `/ci`의 설치 목록에 사용자가 영구 제거한 플러그인 2개가 아직 살아 있어 실행하면 되살아난다 ④ **조사 중 나 자신이 \"Mac Mini 메모리 0건\"이라 오판**했다 — 메모리 색인이 머신별 실태를 구분하지 않고 서술한 탓이다. 넷 다 \"기록이 현실과 다르거나, 어느 머신 것인지 모른다\"는 같은 병이다. |\r\n| **무엇을** | 프로젝트와 머신을 식별하는 **단일 규격**을 정하고, 그 규격을 메모리 2층(agentmemory·파일메모리)과 설치목록 4곳에 강제한다. |\r\n| **어떻게** | 새 코드를 최소로. agentmemory는 이미 있는 공식 환경변수 스위치를 쓰고, 파일메모리는 이미 있는 설정 키를 실제로 켜고, 설치목록은 4개 중 1개만 남긴다. |\r\n| **누구를 위해** | 사용자 본인. 그리고 이 기록을 읽고 일하는 모든 에이전트 세션. |\r\n| **어디서** | 윈도우 3대(ADMIN·user·livev) + Mac Mini 1대. 배선의 SoT는 `livevil-setting`, 스킬 코드의 SoT는 `creeta-lens`. |\r\n| **언제** | 지금. 관측 기록이 하루 수십 건씩 잘못된 네임스페이스에 계속 쌓이고 있어, 늦어질수록 마이그레이션 대상만 커진다. |\r\n\r\n**안 하면 생기는 비용**\r\n\r\n- 에이전트가 다른 컴퓨터의 경로·설치상태·서비스 상태를 이 컴퓨터 것으로 착각해 단언한다. 사용자는 그걸 검증하느라 매번 시간을 쓴다. (오늘 실제로 발생)\r\n- 정리·삭제한 것이 되살아난다. 같은 결정을 반복해서 내려야 한다.\r\n- 머신 고유 사실 130개가 무태그로 섞여 있어, 이 PC에서 물어도 Mac Mini의 디스크·서비스 상태가 근거로 딸려 나온다. 반대도 마찬가지다.\r\n- `/cs` 동기화가 메모리 폴더를 되돌려 기록이 사라진다. (2026-08-02 실제로 17건 소실)\r\n\r\n---\r\n\r\n## 🔬 조사 보고 (실측)\r\n\r\n> **조사 방식 고지**: 이 조사는 서브에이전트 fan-out 없이 **현 세션에서 직접 수행**했다(하네스 정책상 Agent 도구 미사용). Windows 로컬 파일·`~/.claude` 실물·agentmemory 서버 API·Mac Mini SSH 실측을 근거로 한다. 아래 숫자는 전부 오늘(2026-08-08) 측정값이다.\r\n\r\n### ① agentmemory — 프로젝트 네임스페이스가 뒤엉켰다 (근본 증거)\r\n\r\n프로젝트 키 산출 로직 (`session-start.mjs` `resolveProject()`):\r\n\r\n```\r\n1순위: 환경변수 AGENTMEMORY_PROJECT_NAME\r\n2순위: git rev-parse --show-toplevel 의 마지막 폴더명\r\n3순위: cwd 의 마지막 폴더명\r\n```\r\n\r\n**머신 차원이 없고, 대소문자 정규화가 없고, 워크스페이스 루트 개념이 없다.** 결과(전체 331세션 / 9,725 관측 전수):\r\n\r\n| project 키 | 세션 수 | 실제 cwd | 무슨 일이 벌어졌나 |\r\n|---|---:|---|---|\r\n| `Git` | 119 | `c:\\Users\\user\\Documents\\Git` | ← **user PC** |\r\n| `Git` | 61 | `c:\\Users\\livev\\Documents\\Git` | ← **livev PC** — 위와 **같은 네임스페이스로 병합됨** |\r\n| `Git` | 11 | `C:\\Users\\livev\\Documents\\Git` | 대문자 드라이브 표기만 다른 같은 곳 |\r\n| `Git` | 1 | `C:\\Users\\user\\Documents\\Git` | 〃 |\r\n| `GIT` | 70 | `c:\\Users\\ADMIN\\Documents\\GIT` | ← **ADMIN PC(이 컴퓨터)** — 폴더명 대소문자 하나 차이로 **혼자 분리됨** |\r\n| `GIT` | 6 | `C:\\Users\\ADMIN\\Documents\\GIT` | 〃 |\r\n| `ADMIN` | 19 | `C:\\Users\\ADMIN` | cwd가 홈이라 **사용자명이 프로젝트명**이 됨 |\r\n| `user` | 11 | `C:\\Users\\user` | 〃 |\r\n| `livev` | 4 | `C:\\Users\\livev` | 〃 |\r\n| `Returns_ERP_v20` | 4 | `C:\\Users\\user\\Documents\\Git\\Returns_ERP_v20` | 하위 레포로 진입하면 또 갈라짐 |\r\n| `Returns_ERP_v20` | 1 | `C:\\Users\\livev\\Documents\\Git\\Returns_ERP_v20` | 같은 레포인데 머신 구분 없이 섞임 |\r\n| `livevil-research` | 4 | `C:\\Users\\ADMIN\\Documents\\GIT\\livevil-research` | 〃 |\r\n| `livevil-research` | 2 | `C:\\Users\\user\\Documents\\Git\\livevil-research` | 〃 |\r\n| `livevil-contents` | 2 + 1 | user PC / ADMIN PC | 〃 |\r\n| `livevil-boost` | 2 | user PC | 〃 |\r\n| `Stage` | 4 | livev PC | 〃 |\r\n| `Returns-Finance` | 1 | user PC | 〃 |\r\n| `creeta-lens` | 1 | ADMIN PC | 〃 |\r\n| `06. 계약서` | 1 | `c:\\Users\\user\\Dropbox\\01. Document\\07. Returns\\06. 계약서` | **Dropbox 계약서 폴더가 프로젝트로 등록** |\r\n| `undefined` | 6 | (없음) | cwd 미기록 |\r\n\r\n**두 가지 정반대 고장이 동시에 일어난다.**\r\n- **잘못 합쳐짐**: 물리적으로 다른 컴퓨터 두 대(user·livev)가 `Git` 하나로 병합. 한쪽의 경로·설치상태·SSH 사실이 다른 쪽 회상에 그대로 나온다.\r\n- **잘못 갈라짐**: 같은 논리 워크스페이스인데 `GIT`(ADMIN)과 `Git`(나머지)로 분리. 같은 주제를 물어도 어느 컴퓨터냐에 따라 다른 과거가 나온다.\r\n\r\n### ② 파일 메모리 — 내용은 멀쩡, 배선이 머신마다 다르고 머신 구분이 없다\r\n\r\n> ⚠️ **이 절은 최초 조사에서 오판했다가 실측으로 정정한 내용이다.** 처음에 `~/.claude/projects/<key>/memory` 를 세어 \"Mac Mini 메모리 0건\"이라 판단했으나, **그 경로는 `autoMemoryDirectory` 가 대체하는 바로 그 경로**였다. 0건은 고장이 아니라 설정이 정상 동작한 결과다. 정정 근거는 아래 실측표.\r\n\r\n| 항목 | 실측 (2026-08-08) |\r\n|---|---|\r\n| 메모리 파일 수 | **267개** — sj-omen · Mac Mini **양쪽 동일** |\r\n| 그중 머신 고유 사실 포함 | **130개 (49%)** — SSH 서버·디스크·launchd·경로·머신명 |\r\n| 메모리 본문의 절대경로 하드코딩 | **0개** ← 걱정과 달리 깨끗하다 |\r\n| Mac Mini `autoMemoryDirectory` | ✅ `\"/Users/user/livevil-setting/claude-memory\"` — **설정돼 있고 정상 동작** |\r\n| Mac Mini 동기화 | ✅ cron `*/30` `claude-memory-pull.sh`. 18:00 로그: `Already up to date · c8fbc30 · 메모리 267개` |\r\n| **sj-omen `autoMemoryDirectory`** | ❌ **없음** — 이 PC만 구식 `<JUNCTION>` 배선 (`memory` → `livevil-setting\\claude-memory`, 2026-05-04 생성) |\r\n| 머신 구분 태그 | ❌ **없음** — 130개 머신 고유 사실이 무태그로 공유 풀에 섞여 있다 |\r\n\r\n**따라서 파일 메모리의 실제 문제는 두 가지로 좁혀진다.**\r\n\r\n1. **배선 불일치** — Mac Mini·SJ_X1 은 정식 설정(`autoMemoryDirectory`), sj-omen 만 정션. 둘 다 같은 폴더를 가리켜 *결과는 같지만*, 어느 것이 진짜 배선인지 알 수 없고 정션은 `/cs` 의 `reset --hard` 사고 경로에 그대로 노출돼 있다.\r\n2. **머신 구분 부재** — 이게 진짜 아픈 곳이다. 130개(49%)가 \"이 머신에서만 참\"인 사실인데 태그가 없어, sj-omen에서 물어도 Mac Mini의 디스크·launchd 사실이 근거로 딸려 나온다.\r\n\r\n`MEMORY.md` 헤더가 *\"정션 불필요\"* 라고 단정했던 것도 절반만 맞았다 — Mac Mini·SJ_X1 기준으로는 맞고, **sj-omen 기준으로는 틀렸다.** 머신별 실태를 구분하지 않은 서술이 오해를 만들었다. (이번에 실태 기준으로 수정 완료)\r\n\r\n### ③ 플러그인 설치 목록 — SoT가 4개로 갈라졌다\r\n\r\n| # | 파일 | 성격 | 현재 내용 |\r\n|---|---|---|---|\r\n| 1 | `livevil-setting/claude-code/skills.json` | 부트스트랩 설치기가 읽음, git 동기화 | lens·context7·playwright·**ui-ux-pro-max**·**watch@claude-video**·agentmemory·insane-search |\r\n| 2 | `livevil-setting/claude-code/settings.json` → `enabledPlugins` | 새 PC에 그대로 복사됨 | lens·context7·playwright·**ui-ux-pro-max**·**watch**·agentmemory (insane-search 없음) |\r\n| 3 | `~/.claude/lens/manifest.json` | `/ci` 전용, **머신 로컬·비동기화** | lens 없음 / agentmemory·context7·insane-search·playwright·**ponytail**·**understand-anything** |\r\n| 4 | `~/.claude/plugins/installed_plugins.json` | 실제 설치 상태 | lens·context7·playwright·agentmemory·insane-search |\r\n\r\n**넷이 전부 다르다.** 그리고 3번에는 오늘 사용자 지시로 삭제한 `ponytail`과 2026-07-17에 \"재설치·재추천 금지\"로 영구 제거한 `understand-anything`이 **아직 살아 있다.** 지금 어느 컴퓨터에서든 `/ci`를 돌리면 둘 다 설치 후보로 올라온다. 제거 경로(`claude plugin uninstall`·`/lens-upgrade`·수동 삭제) 어느 것도 이 파일을 갱신하지 않는다.\r\n\r\n### ④ settings.json — 배포본과 실물이 5곳 어긋남\r\n\r\n| 키 | 실물(`~/.claude`) | 배포본(`livevil-setting`) |\r\n|---|---|---|\r\n| `env.CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC` | **없음** | `\"1\"` |\r\n| `hooks.SessionStart` | gptaku 업데이트 체크 (절대경로 하드코딩) | **없음** |\r\n| `enabledPlugins` | insane-search **있음**, ui-ux-pro-max·watch **없음** | 정반대 |\r\n| `extraKnownMarketplaces` | CreetaCorp·agentmemory·gptaku-plugins | CreetaCorp만 |\r\n| `switchModelsOnFlag` | `true` | **없음** |\r\n\r\n새 컴퓨터를 배포본으로 세팅하면 **지금 이 컴퓨터와 다른 환경이 만들어진다.** 또한 실물의 SessionStart 훅은 `C:\\Users\\ADMIN\\...` 절대경로를 박고 있어 그대로 배포하면 다른 사용자명 머신에서 깨진다.\r\n\r\n### ⑤ `/cs` — Mac Mini의 진짜 레포를 못 본다 + 메모리를 되돌린다\r\n\r\n스캔 루트 (`git-sync-all.sh`, `GIT_ROOTS` 미설정 시):\r\n\r\n```\r\n$HOME/Documents/Git · $HOME/Documents/GIT · $HOME/projects · $HOME/Projects · $HOME/git · $HOME/.claude/plugins/marketplaces\r\n```\r\n\r\nMac Mini 실측: `GIT_ROOTS` 미설정. `~/Documents/GIT`는 존재하지만 안에 든 것은 2026-02월에 멈춘 옛 클론들(`ReturnERP-V1.1`·`Auction`·`ReturnsERP` 등)이다. **실제 작업 레포 4개는 홈 바로 아래**에 있다:\r\n\r\n```\r\n~/livevil-setting  (master, c8fbc30 — 오늘자 커밋까지 최신)\r\n~/livevil-research\r\n~/creeta-homepage\r\n~/namane-mkt\r\n```\r\n\r\n`$HOME` 자체가 스캔 루트 후보에 없으므로 **`/cs`는 Mac Mini의 실제 작업 레포를 한 개도 못 본다.** 대신 옛 클론 더미를 훑는다.\r\n\r\n그리고 `/cs`는 sync 브랜치 정리 과정에서 base 브랜치로 돌아가 `reset --hard origin/<base>`를 한다(`skills/cs/SKILL.md:49`). 그 대상에 `livevil-setting`이 포함되는데, 이 레포가 곧 **메모리 junction의 타깃**이다. 2026-08-02에 라이브 메모리 17개가 이 경로로 소실됐다(기록 있음).\r\n\r\n### ⑥ Lens 버전 어긋남\r\n\r\n| 머신 | Lens 버전 |\r\n|---|---|\r\n| ADMIN (이 PC) | **3.29.0** (오늘 업그레이드) |\r\n| Mac Mini | **3.28.0** |\r\n| user / livev | 미확인 (원격 접속 미시도) |\r\n\r\n버전이 다르면 스킬 본문이 다르고, 규칙이 다르고, `/cu`·`/cs`의 동작이 다르다.\r\n\r\n### ⑦ 하드코딩 — 예상과 다른 결과\r\n\r\n- **creeta-lens 스킬 소스**: 하드코딩 **없음**. `${CLAUDE_PLUGIN_ROOT}` 치환을 쓴다(cp 20곳·ci 9곳·cs 6곳·cu 5곳). 세션에 보이는 `C:/Users/ADMIN/...` 경로는 런타임 치환 결과지 소스에 박힌 값이 아니다.\r\n- **메모리 본문**: 절대경로 하드코딩 **0건**.\r\n- **실제 하드코딩 지점**: ① `~/.claude/settings.json`의 SessionStart 훅 명령 ② `livevil-setting/claude-code/manifest.json`의 `workspaceDefault`가 `%USERPROFILE%\\Documents\\GIT`인데 프로젝트 `CLAUDE.md`는 `D:\\GIT\\`라고 적어 서로 모순.\r\n\r\n---\r\n\r\n## 🧰 실행 전략 & 자원\r\n\r\n- **난이도**: **large** — 4대 머신 × 3개 레포(creeta-lens·livevil-setting·agentmemory 설정) × 2개 메모리 계층. 되돌리기 어려운 데이터 이동 포함.\r\n- **권장 모델**: 설계·마이그레이션 판정은 **TOP**(현재 `fable`, 없으면 `opus`). 파일 편집·스크립트 작성 같은 기계적 단계는 **sonnet**. 단순 확인은 **haiku**.\r\n- **병렬 실행**: **금지 구간 있음.** 메모리·설치목록을 만지는 단계는 **반드시 단일 직렬**. 과거에 `/cc` 병렬 워커가 git 인덱스를 공유해 서로의 미커밋분을 날린 실측 사고가 있다. 머신별 배포(P3)만 머신 단위 병렬 허용.\r\n- **활용 스킬**: `/cs`(배포 후 동기화 검증) · `/cu`(버전 정렬 확인) · `/ci`(설치목록 수렴 검증). Playwright·context7 불필요.\r\n- **기존 자원 재사용**:\r\n  - `AGENTMEMORY_PROJECT_NAME` — agentmemory가 **이미 지원하는 공식 환경변수.** 포크 불필요. 이번 해법의 핵심 지렛대.\r\n  - `autoMemoryDirectory` — Claude Code가 이미 지원하는 설정 키. 켜기만 하면 된다.\r\n  - `livevil-setting/claude-code/install-skills.{ps1,sh}` — 양 OS 설치기가 이미 있다. `skills.json` 하나만 고치면 양쪽 반영.\r\n  - `GIT_ROOTS` — `/cs`가 이미 지원하는 오버라이드. Mac Mini는 이것만 설정하면 해결.\r\n\r\n## 🚫 DO NOT CHANGE\r\n\r\n| 대상 | 왜 |\r\n|---|---|\r\n| `~/.claude/plugins/cache/agentmemory/**` | 남의 플러그인 소스. 고치면 업데이트마다 날아간다. 환경변수로만 제어. |\r\n| `creeta-lens/skills/cp/**`, `skills/cc/**`의 계획·실행 로직 | 이번 작업은 정체성·동기화 배선 문제다. 계획 엔진은 정상 동작 중. |\r\n| `AGENTMEMORY_SECRET` / `AGENTMEMORY_URL` 값 | 인증·서버 주소는 현행 유지. 이번 범위 밖. |\r\n| 기존 267개 메모리 **본문** | 프론트매터에 필드 1개 추가만. 본문 재작성 금지 — 재작성은 사실 왜곡 위험. |\r\n| `~/.claude/projects/**/*.jsonl` (트랜스크립트) | 470MB지만 정리는 별건. 이번 작업에서 건드리면 원인 분석이 불가능해진다. |\r\n| Mac Mini `~/Documents/GIT` 옛 클론 더미 | 안 쓰는 건 맞지만 삭제는 별도 승인 사안. 이번엔 스캔 대상에서 빼기만 한다. |\r\n\r\n---\r\n\r\n## 🛠 How — 어떻게\r\n\r\n### 핵심 설계 — 정체성 2축 규격\r\n\r\n지금 고장난 이유는 **\"어느 프로젝트인가\"와 \"어느 컴퓨터인가\"를 한 개의 문자열로 표현하려 했기 때문**이다. 두 축을 분리한다.\r\n\r\n```\r\nworkspace_id  = 논리 워크스페이스 (경로·대소문자·사용자명과 무관)\r\nmachine_id    = 물리 컴퓨터 (안정적 고정 식별자)\r\nscope         = global | workspace | machine   ← 이 사실이 어디까지 참인가\r\n```\r\n\r\n**machine_id 표준 (신규 제정 — 이게 없어서 전부 어긋났다)**\r\n\r\n| machine_id | 정체 | 사용자명 | 워크스페이스 경로 |\r\n|---|---|---|---|\r\n| `sj-omen` | 이 PC (Windows 11 Pro) | ADMIN | `C:\\Users\\ADMIN\\Documents\\GIT` |\r\n| `sj-rog` | Windows 노트북 | user | `C:\\Users\\user\\Documents\\Git` |\r\n| `sj-x1` | Windows 노트북 | livev | `C:\\Users\\livev\\Documents\\Git` |\r\n| `macmini` | Mac Mini (중앙 서버) | user | `/Users/user` (홈 직속) |\r\n\r\n**workspace_id 표준**: `livevil` 하나. 네 머신 모두 같은 레포 군을 다루므로 논리 워크스페이스는 하나다.\r\n\r\n**두 메모리 계층에 역할을 다르게 준다** — 이게 이번 설계의 결정이다.\r\n\r\n| 계층 | 역할 | 키 | 왜 |\r\n|---|---|---|---|\r\n| **agentmemory** | 머신별 **작업 로그** (자동 수집·양 많음·정제 안 됨) | `livevil@<machine_id>` | 머신을 키에 넣어 **섞임을 원천 차단**. 자동 수집분은 대부분 그 머신에서만 참이다. |\r\n| **파일 메모리** | 머신 공통 **정제된 사실** (수동 큐레이션·양 적음) | 단일 풀 + `machine` 프론트매터 태그 | 공통 지식은 공유하되 머신 고유분은 태그로 필터. 이쪽이 진짜 SoT. |\r\n\r\nCodex 교차 협의에서 나온 두 대안(A=키에 머신 포함 / B=키는 논리, 머신은 태그)을 **계층별로 나눠 적용**한 것이다. 양쪽 단점을 서로가 메운다 — agentmemory는 태그 누락 위험이 없고(키라서 강제됨), 파일 메모리는 공통 지식 중복이 없다(단일 풀이라서).\r\n\r\n### Plan A — 권장 경로\r\n\r\n#### 왜 이게 1순위인가\r\n\r\n새로 만드는 코드가 거의 없다. `AGENTMEMORY_PROJECT_NAME`·`autoMemoryDirectory`·`GIT_ROOTS`는 **전부 이미 존재하는 스위치**다. 지금 상태는 \"기능이 없어서\"가 아니라 **\"있는 스위치를 안 켜고 부트스트랩 스크립트로 우회했기 때문에\"** 고장났다. 우회를 걷어내고 정식 스위치로 옮기는 것이 최소 변경이면서 플랫폼 중립이다.\r\n\r\n#### 단계\r\n\r\n**P0 — 동결 및 백업 (되돌릴 수 없는 것부터 보호)**\r\n\r\n- [ ] P0-1: 네 머신 모두에서 마이그레이션 중 **새 세션 시작 금지** 공지. agentmemory 쓰기가 계속되면 건수 대조가 불가능해진다. (Codex 지적)\r\n- [ ] P0-2: `livevil-setting/claude-memory` 267개를 타임스탬프 폴더로 통째 백업. junction 타깃이므로 **복사본은 반드시 junction 밖 경로**에 둔다.\r\n- [ ] P0-3: agentmemory 서버 DB 스냅샷 (Mac Mini). 건수 기록: 331세션 / 9,725관측.\r\n- [ ] P0-4: 네 머신의 `~/.claude/settings.json` · `~/.claude/lens/manifest.json` · `installed_plugins.json` 백업.\r\n- [ ] 검증: 백업 폴더에서 파일 수 267 / 세션 331 / 관측 9,725 재확인.\r\n\r\n**P1 — 규격 문서화 (SoT 먼저, 코드 나중)**\r\n\r\n- [ ] P1-1: `livevil-setting/docs/rules/machine-identity.md` 신규 작성. 위 machine_id 표 + workspace_id + scope 3값 + \"새 머신 추가 절차\"를 담는다. 이 문서가 이후 모든 배선의 근거.\r\n- [ ] P1-2: `MEMORY.md` 헤더의 거짓 문장 정정 — \"`autoMemoryDirectory`가 가리키고 정션 불필요\"를 실제 배선으로 교체.\r\n- [ ] P1-3: 메모리 `claude-memory-multimachine-sync.md`를 실측 기준으로 재작성 (현재 내용이 미실현 설계를 실현된 것처럼 기술).\r\n- [ ] 검증: 두 문서를 처음 보는 사람이 읽고 \"내 컴퓨터의 machine_id는 무엇인가\"에 답할 수 있는가 (수동).\r\n\r\n**P2 — agentmemory 네임스페이스 정상화**\r\n\r\n- [ ] P2-1: 각 머신 `~/.claude/settings.json`의 `env`에 `AGENTMEMORY_PROJECT_NAME` 추가. 값은 머신별로 다름: `livevil@sj-omen` / `livevil@sj-rog` / `livevil@sj-x1` / `livevil@macmini`.\r\n- [ ] P2-2: 이 머신(sj-omen)에서 새 세션 1회 시작 → `memory_sessions`로 새 project 키가 `livevil@sj-omen`으로 찍히는지 확인.\r\n- [ ] P2-3: 과거 331세션은 **재키잉하지 않는다.** 대신 서버에 `legacy-namespace` 표시를 남기고, 회상 시 \"구 네임스페이스(신뢰도 낮음)\"로 구분되게 한다. (재키잉 불가 이유는 아래 함정 참조)\r\n- [ ] 검증: 네 머신에서 각 1세션 시작 후 project 키 4종이 각각 정확히 찍히는가 (auto).\r\n\r\n**P3 — 파일 메모리 정식 배선 전환 (정션 → autoMemoryDirectory)**\r\n\r\n> **범위 축소 (실측 반영)**: Mac Mini·SJ_X1 은 2026-08-05 에 이미 `autoMemoryDirectory` 로 전환돼 정상 동작 중이다(Mac Mini 267개 실측·cron pull 정상). **남은 것은 sj-omen 한 대**와 미확정 Windows 1대뿐이다. 즉 이 단계는 \"새 방식 도입\"이 아니라 **\"이미 검증된 방식으로 뒤처진 1대를 따라붙이기\"** 다 — 리스크가 크게 낮다.\r\n\r\n- [ ] P3-1: **sj-omen** `~/.claude/settings.json` 에 `autoMemoryDirectory` 추가 — 값 `C:\\Users\\ADMIN\\Documents\\GIT\\livevil-setting\\claude-memory`.\r\n- [ ] P3-2: 새 세션에서 메모리 267개가 잡히는지 **확인한 뒤에만** sj-omen 의 `<JUNCTION>` 제거. **순서 엄수** — 정션을 먼저 지우면 그 순간 메모리가 사라진다. (인접한 `memory.backup` 폴더는 건드리지 않는다)\r\n- [ ] P3-3: `bootstrap-sjrog.ps1` Phase 5(junction) 삭제하고 settings.json 주입으로 대체. mac/linux 설치기에도 동등 로직 추가 — 새 머신이 다시 정션으로 세팅되는 것을 막는다.\r\n- [ ] P3-4: 미확정 Windows 1대(`user`)가 온라인이 되면 동일 적용. 그 전까지는 현행 유지.\r\n- [ ] 검증: **sj-omen 새 세션에서 메모리 파일 수 = 267** 이고 정션이 사라졌는가 (auto).\r\n\r\n**P4 — 메모리에 머신 태그 부여**\r\n\r\n- [ ] P4-1: 267개 프론트매터에 `metadata.machine` 필드 추가. 기본값 `global`.\r\n- [ ] P4-2: 머신 고유 130개를 분류. **자동 분류 금지** — Codex 지적대로 오분류 위험이 크다. 파일명·제목에 머신명이 명시된 것(`ssh-server-sj-omen`·`ssh-server-sj-rog`·`ssh-server-sj-x1`·`macmini-*` 등)만 기계적으로 태깅하고, **애매한 것은 `unknown`으로 격리**한 뒤 사용 시점에 하나씩 판정한다.\r\n- [ ] P4-3: `MEMORY.md` 색인 줄에 머신 태그 표기 규칙 반영.\r\n- [ ] 검증: `machine: global` + `machine: <id>` + `machine: unknown` 합계 = 267, 본문 변경 0바이트 (auto — 해시 대조).\r\n\r\n**P5 — 설치 목록 SoT 단일화**\r\n\r\n- [ ] P5-1: `livevil-setting/claude-code/skills.json`을 **유일한 SoT**로 선언. 현 실제 설치 상태(lens·context7·playwright·agentmemory·insane-search)로 갱신하고 ui-ux-pro-max·watch@claude-video는 실제 사용 여부를 사용자에게 확인 후 반영.\r\n- [ ] P5-2: `settings.json`의 `enabledPlugins`를 `skills.json`에서 **생성**하도록 변경 (수기 관리 중단).\r\n- [ ] P5-3: `~/.claude/lens/manifest.json`을 `skills.json`에서 생성되는 **파생물**로 강등. 즉시 `ponytail`·`understand-anything` 제거하고 `excluded`로 이동(재설치 차단).\r\n- [ ] P5-4: `/ci` 스킬에 \"manifest가 skills.json보다 오래되면 경고\" 가드 추가.\r\n- [ ] 검증: 네 머신에서 `/ci` 드라이런 시 `toInstall`·`toRemove` 모두 0 (auto).\r\n\r\n**P6 — `/cs` 안전화 및 커버리지 수정**\r\n\r\n- [ ] P6-1: `/cs`에 **메모리 타깃 보호 가드** 추가 — `autoMemoryDirectory`가 가리키는 레포는 `reset --hard` 대상에서 제외하거나, 실행 전 해당 폴더를 별도 백업.\r\n- [ ] P6-2: Mac Mini에 `GIT_ROOTS=\"/Users/user\"` 설정하거나, `git-sync-all.sh`의 후보 목록에 `$HOME` 1레벨 스캔 추가.\r\n- [ ] P6-3: Mac Mini `~/Documents/GIT` 옛 클론 더미를 스캔 대상에서 제외 (삭제 아님).\r\n- [ ] 검증: Mac Mini `/cs` 실행 시 `livevil-setting`·`livevil-research`·`creeta-homepage`·`namane-mkt` 4개가 목록에 나오는가 (auto).\r\n\r\n**P7 — 배포본·실물 수렴 및 버전 정렬**\r\n\r\n- [ ] P7-1: `livevil-setting/claude-code/settings.json`을 실물 기준으로 갱신하되, **머신 의존 값은 렌더 시 치환되는 토큰으로** (메모리 디렉터리 절대경로 · agentmemory 프로젝트명 · SessionStart 훅 경로 3개). 토큰 표기는 `%%NAME%%` 형식을 쓴다.\r\n- [ ] P7-2: SessionStart 훅의 `C:\\Users\\ADMIN` 절대경로를 `$HOME` 기반으로 교체.\r\n- [ ] P7-3: `manifest.json`의 `workspaceDefault`와 프로젝트 `CLAUDE.md`의 `D:\\GIT\\` 모순 해소.\r\n- [ ] P7-4: 네 머신 Lens를 동일 버전으로 정렬 (현재 sj-omen 3.29.0 / macmini 3.28.0).\r\n- [ ] 검증: 배포본으로 신규 세팅한 환경과 현 sj-omen의 settings.json 차이가 템플릿 변수 항목뿐인가 (수동 diff).\r\n\r\n#### 막힐 수 있는 지점 (→ Plan B 트리거)\r\n\r\n| 지점 | 증상 | 대응 |\r\n|---|---|---|\r\n| P3-1 | `autoMemoryDirectory`를 넣어도 Claude Code가 무시하고 기존 기본 경로를 계속 씀 | → Plan B-1 |\r\n| P3-4 | sj-omen 정션 제거 후 메모리 267개가 안 잡힘 | → Plan B-1 (정션 원복) |\r\n| P2-1 | `AGENTMEMORY_PROJECT_NAME`이 SessionStart 훅에 전달 안 됨 (settings.json env가 훅 환경에 미주입) | → Plan B-2 |\r\n| P4-2 | 머신 고유 130개 중 자동 판정 불가분이 절반 넘음 | → Plan B-3 |\r\n| P0-1 | 다른 머신 사용자가 동결을 못 지켜 마이그레이션 중 쓰기 발생 | → 즉시 중단, P0 백업에서 재시작 |\r\n\r\n### Plan B — Fallback 경로\r\n\r\n#### Trigger\r\n\r\n**P3-1 또는 P3-4에서 `autoMemoryDirectory`가 실제로 동작하지 않을 때** 즉시 전환. 판정 기준: 설정 주입 + 재시작 후 새 세션에서 메모리 파일 수가 267이 아니면 실패로 본다.\r\n\r\n#### 왜 이 대안인가\r\n\r\n`autoMemoryDirectory`는 Claude Code 2.1.74+ 에서만 동작한다. Mac Mini·SJ_X1 에서는 **이미 프로덕션 검증됐지만**, sj-omen 의 CLI 가 조건을 못 맞추거나 Windows 경로 표기에서 걸릴 가능성은 남는다. 정션은 검증된 동작이지만 Windows 전용이라 4대 통일이 불가능하고 `/cs` 사고 경로에 노출된다 — 그래서 1순위가 아니다.\r\n\r\n#### 단계 (Plan B-1: 정션 유지 + mac 심링크)\r\n\r\n- [ ] B1-1: Windows 3대는 현행 junction 유지.\r\n- [ ] B1-2: Mac Mini는 `ln -s ~/livevil-setting/claude-memory ~/.claude/projects/<key>/memory` 심링크로 동등 배선. 키는 그 머신의 실제 프로젝트 키를 실측해서 정한다.\r\n- [ ] B1-3: 머신마다 프로젝트 키가 다르므로 **머신별 심링크 목록**을 `machine-identity.md`에 명시.\r\n- [ ] B1-4: `/cs` 보호 가드(P6-1)는 **필수** — 정션 방식에서는 reset --hard 사고가 이미 실증됐다.\r\n- 트레이드오프: 플랫폼별 배선이 갈라지고, 워크스페이스 경로가 바뀌면 매번 다시 걸어야 한다. 자동화 유지비가 계속 든다.\r\n\r\n#### 단계 (Plan B-2: 환경변수가 훅에 안 먹을 때)\r\n\r\n- [ ] B2-1: `AGENTMEMORY_PROJECT_NAME`을 OS 사용자 환경변수(`setx` / `~/.zshrc`)로 승격.\r\n- 트레이드오프: settings.json 한 곳에서 안 보이고, 새 머신 세팅 절차가 한 단계 늘어난다.\r\n\r\n#### 단계 (Plan B-3: 머신 태그 자동 분류 실패 시)\r\n\r\n- [ ] B3-1: 130개 전부 `machine: unknown`으로 두고, **회상 시점에 판정**하는 방식으로 전환. 판정된 것만 확정 태그로 승격.\r\n- 트레이드오프: 완전 정리가 늦어지지만, 오분류로 잘못된 사실이 굳는 것보다 안전하다.\r\n\r\n## 🔀 검토된 대안 (Alternatives Considered)\r\n\r\n**대안 A — agentmemory를 포크해서 project key 로직 자체를 고친다**\r\n- *Good, because* 환경변수 설정 누락 위험이 없다. 로직으로 강제되므로 새 머신에서도 자동으로 옳게 동작한다.\r\n- *Bad, because* 남의 레포다. 업스트림이 업데이트될 때마다 재적용해야 하고, `/cu`가 업데이트를 자동 실행하므로 **조용히 원복된다.** 유지비가 무한하다.\r\n- **기각** — `AGENTMEMORY_PROJECT_NAME`이라는 공식 스위치가 이미 있는데 포크할 이유가 없다.\r\n\r\n**대안 B — agentmemory를 버리고 파일 메모리 한 층으로 통합한다**\r\n- *Good, because* 계층이 하나면 정체성 문제도 하나다. 가장 단순하다.\r\n- *Bad, because* agentmemory의 자동 수집(9,725건)이 사라진다. 파일 메모리는 수동 큐레이션이라 \"무엇을 했는지\" 로그 역할을 못 한다. 그리고 Mac Mini 서버·MCP 도구 20여 개가 이미 배선돼 있어 철거 비용이 크다.\r\n- **기각** — 두 계층의 역할이 실제로 다르다(로그 vs 정제된 사실). 문제는 계층 수가 아니라 정체성 규격 부재다.\r\n\r\n**대안 C — project key에 전체 경로를 그대로 쓴다 (agentmemory도 파일 메모리처럼)**\r\n- *Good, because* 절대 안 섞인다. 구현이 가장 쉽다.\r\n- *Bad, because* 지금 파일 메모리가 겪는 문제를 agentmemory에도 복제한다 — 머신마다 완전 격리되어 공통 지식 공유가 0이 된다. 대소문자·사용자명 문제도 그대로 남는다.\r\n- **기각** — 한쪽 고장을 다른 쪽에 옮기는 것.\r\n\r\n**대안 D — workspace_id를 레포 단위로 잘게 나눈다 (`livevil-contents@sj-omen` 등)**\r\n- *Good, because* 회상 정밀도가 올라간다. 레포별로 깔끔히 분리된다.\r\n- *Bad, because* 지금 이미 그렇게 되어 있고(하위 레포 진입 시 자동 분리), **그게 문제의 일부**다 — 같은 작업이 루트에서 열었냐 하위에서 열었냐에 따라 갈린다. 그리고 레포 개수 × 머신 개수 = 100개 넘는 네임스페이스가 생긴다.\r\n- **기각** — 정밀도보다 일관성이 먼저다. 레포 구분은 태그·검색으로 충분하다.\r\n\r\n### 🔀 Codex 교차 협의 (S4 — 하드 게이트, 통과)\r\n\r\n호출: `codex exec`, 모델 = 순위표 1등 동적 선택, `reasoning_effort=high`, `service_tier=fast`, 상한 600초, 백그라운드. **RC=0, 본문 3,011바이트 정상 수거.**\r\n\r\n**합의 (고신뢰 — 그대로 lock):**\r\n\r\n- **근본 결함 지목이 일치했다.** Codex: *\"프로젝트·머신 정체성에 대한 단일 규격과 SoT가 없다는 점. agentmemory는 basename만 사용해 서로 다른 머신을 합치거나 대소문자로 분리하고, 파일 메모리는 전체 경로로 머신별 분리된다. 동일한 사실을 두 계층이 서로 다른 범위로 해석하므로 혼합·유실·오귀속이 구조적으로 발생한다.\"*\r\n- 대안 A(키에 머신 포함) / 대안 B(키는 논리 + 머신 태그)의 trade-off 분석이 일치.\r\n- ⚠️ *\"Mac의 메모리 0건은 Windows 전용 배선에 따른 플랫폼별 동작 불일치\"* — Codex 는 **내가 준 잘못된 전제(0건)를 그대로 받아 추론**했다. 실측 결과 Mac Mini 는 267개 정상. Codex 의 잘못이 아니라 **입력 사실이 틀렸던 것**이며, 이는 \"협의 상대에게 검증 안 된 사실을 주면 그 위에 정교한 오답이 쌓인다\"는 교훈으로 남긴다. 나머지 지적은 전제와 무관하게 유효.\r\n- *\"네 SoT 중 어느 것이 생성·삭제 권한을 갖는지 정하지 않으면 제거한 플러그인이 계속 부활한다\"* — P5 설계 근거 강화.\r\n\r\n**분기 → 해소:**\r\n\r\n- Codex는 A/B 중 **하나를 고르라**는 전제로 답했다. 이 계획은 **계층별로 나눠 적용**(agentmemory=A, 파일메모리=B)한다. 근거: Codex가 지적한 각 대안의 단점이 계층 특성과 정확히 상보적이다 — A의 단점(\"공통 지식 중복\")은 자동 수집 로그에서는 문제가 아니고, B의 단점(\"태그 누락 한 번으로 재오염\")은 수동 큐레이션 267건에서는 관리 가능한 규모다. 채택.\r\n\r\n**Codex가 추가로 제기한 리스크 (이 계획에 반영됨):**\r\n\r\n| Codex 지적 | 반영 위치 |\r\n|---|---|\r\n| 마이그레이션 중 쓰기 허용하면 누락·중복 발생. 쓰기 동결·원본 보존·건수/해시 대조·롤백 지점 필요 | P0 전체 |\r\n| junction 타깃을 git 정리 대상에 둔 채 작업하면 다시 삭제될 수 있음 | P0-2(백업은 junction 밖), P6-1 |\r\n| 태그 없는 머신 고유 130개 자동 분류는 위험. 수동 검토 또는 \"출처 불명\" 격리 필요 | P4-2, Plan B-3 |\r\n| `Git`/`GIT`을 무조건 합치면 논리적으로 다른 작업까지 섞임 | P2-3 (재키잉 안 함) |\r\n| 기존 키만으로 원래 머신을 항상 복원 불가 — 홈디렉터리 키·undefined는 확정 분리 불가 | 아래 \"마이그레이션 함정\" |\r\n| 중복 observation 병합 시 시점 다른 사실·수정 기록·상충 기록이 하나로 합쳐져 이력 손실 | 비목표 (관측 병합 안 함) |\r\n| 중앙 agentmemory 장애 시 네 머신이 동시에 기억 상실 — 단일 장애점 | 비목표에 명시, 후속 과제 |\r\n| 동시 기록의 순서·충돌 해결 규칙 부재 → 최신 사실 판정이 비결정적 | ⚠️ 리스크 R6 |\r\n| 경로 이동·repo rename·worktree·동일 basename 저장소가 새 분리/충돌 유발 | ⚠️ 리스크 R7 |\r\n| 삭제·오염이 백업·동기화를 통해 전파될 수 있음 | ⚠️ 리스크 R3 |\r\n\r\n### ⚠️ 사전 리스크 (Pre-mortem — Claude TOP)\r\n\r\n**가장 크게 실패할 지점: P3(정션 → autoMemoryDirectory 전환) 순서 사고.**\r\n정션을 먼저 지우고 설정이 안 먹으면 267개가 그 순간 사라진다. P0-2 백업이 junction **밖**에 있어야 하는 이유가 이것이다. 백업을 `livevil-setting` 안에 두면 백업과 원본이 같은 운명을 맞는다.\r\n\r\n**두 번째: P5에서 `enabledPlugins` 생성으로 바꾸는 순간 현재 쓰는 플러그인이 빠질 수 있다.**\r\n`skills.json`에 ui-ux-pro-max·watch가 있는데 실제로는 안 깔려 있다. 생성 방향을 잘못 잡으면(skills.json → 실물) 안 쓰는 플러그인 2개가 네 머신에 설치된다. **먼저 skills.json을 실물 기준으로 정정**한 뒤 생성으로 전환해야 한다.\r\n\r\n**세 번째: 동결(P0-1)이 현실적으로 안 지켜진다.** 사용자가 네 머신을 동시에 쓰는 습관이면 마이그레이션 중 쓰기가 반드시 발생한다. 그래서 P2-3에서 과거 재키잉을 포기하는 설계가 오히려 안전하다 — 과거를 안 건드리면 동시 쓰기가 과거를 오염시킬 수 없다.\r\n\r\n**Plan B 트리거 매핑**: 위 3개 모두 Plan A의 \"막힐 수 있는 지점\" 표와 매칭됨. 신규 트리거 추가 불필요.\r\n\r\n### 마이그레이션 함정 (P2-3에서 과거를 재키잉하지 않는 이유)\r\n\r\n| 대상 | 세션 | 복원 가능? | 판정 |\r\n|---|---:|---|---|\r\n| `Git` 192건 | user PC + livev PC 혼재 | cwd로 분리 **가능** (`\\user\\` vs `\\livev\\`) | 분리 가능하지만 안 함 — 아래 참조 |\r\n| `GIT` 76건 | ADMIN PC | 단일 머신, **명확** | 〃 |\r\n| `ADMIN`/`user`/`livev` 34건 | 홈디렉터리 세션 | 머신은 알지만 **어느 프로젝트인지 불명** | **복원 불가** |\r\n| `undefined` 6건 | cwd 미기록 | **아무것도 모름** | **복원 불가** |\r\n| `06. 계약서` 1건 | Dropbox | 프로젝트 아님 | 폐기 대상 |\r\n\r\n40건(12%)이 원리적으로 복원 불가다. 그리고 재키잉은 9,725건 관측의 외래키를 전부 다시 쓰는 작업이라 실패 시 되돌리기가 매우 어렵다. **얻는 것(과거 회상 정밀도 소폭 향상) 대비 잃을 수 있는 것(9,725건 전체)이 비대칭이다.** 과거는 `legacy` 표시만 하고 신뢰도를 낮춰 다루는 것이 합리적이다.\r\n\r\n---\r\n\r\n## 💡 시사점 · ⚠️ 주의점 · 🔀 Side Effect\r\n\r\n**💡 시사점**\r\n\r\n- 이 문제의 본질은 \"동기화가 안 된다\"가 아니라 **\"무엇이 같은 것이고 무엇이 다른 것인지 정의한 적이 없다\"** 이다. 규격(`machine-identity.md`)이 생기면 이후 새 머신 추가·새 도구 배선이 전부 이 문서 하나를 참조하면 된다.\r\n- `AGENTMEMORY_PROJECT_NAME`·`autoMemoryDirectory`·`GIT_ROOTS` 세 스위치가 **이미 다 있었다.** 즉 이 고장은 도구의 한계가 아니라 배선 선택의 결과다. 앞으로도 \"우회 스크립트를 짜기 전에 정식 스위치가 있는지 먼저 본다\"가 원칙이 된다.\r\n- 두 메모리 계층에 **다른 역할**을 명시적으로 준 것이 이번 설계의 핵심이다. 지금까지는 둘 다 \"메모리\"라고만 불러서 어느 쪽에 무엇을 넣을지 규칙이 없었다.\r\n- **이번 조사 자체가 문제의 실례를 만들었다.** 나는 `~/.claude/projects/<key>/memory` 를 세어 \"Mac Mini 0건\"이라 단언했는데, 그 경로는 `autoMemoryDirectory` 가 대체하는 바로 그 경로였다. 머신별 실태를 구분하지 않은 색인 서술 + 검증 경로를 잘못 고른 조합이다. **\"메모리 유무는 설정값이 가리키는 실제 폴더에서 센다\"** 를 규격 문서에 못박았다.\r\n\r\n**⚠️ 주의점**\r\n\r\n- P3-2(정션 제거)는 **되돌리기 어려운 단계**다. P3-1 검증이 통과하기 전에는 절대 실행하지 않는다.\r\n- P0-1 동결이 안 지켜지면 건수 대조가 무의미해진다. 지킬 수 없다면 P2-3(과거 미변경) 설계 덕분에 치명상은 아니지만, P4(태그 부여) 중 쓰기는 충돌을 만든다.\r\n- 네 머신의 Claude Code 버전이 다르면 `autoMemoryDirectory` 지원 여부가 갈린다. P7-4(버전 정렬)를 P3보다 **먼저** 하는 것이 안전하다.\r\n- 마이그레이션 전 구간에서 `/cs`를 돌리지 않는다. reset --hard 가드(P6-1)가 들어가기 전까지는 위험 구간이다.\r\n\r\n**🔀 Side Effect (파급 범위)**\r\n\r\n| 건드리면 영향받는 것 |\r\n|---|\r\n| **네 머신 전부의 `~/.claude/settings.json`** — 세션 시작 동작이 바뀐다 |\r\n| **agentmemory 서버의 project 네임스페이스** — 기존 MCP 도구 20여 개의 회상 결과가 달라진다 |\r\n| **267개 메모리의 프론트매터** — recall 필터링 동작이 바뀐다 |\r\n| **`/ci`·`/cs`·`/cu` 세 스킬의 동작** — 기존 습관대로 돌리면 다른 결과가 나온다 |\r\n| **`bootstrap-sjrog.ps1`** — 새 PC 세팅 절차가 바뀐다. 문서 갱신 필수 |\r\n| **`livevil-setting` 레포** — 4대가 공유하므로 커밋 하나가 전 머신에 퍼진다 |\r\n\r\n## ⚠️ 리스크 레지스터\r\n\r\n| ID | 리스크 | 트리거 | 영향 | 대응 | 중단 조건 |\r\n|---|---|---|---|---|---|\r\n| R1 | 정션 제거 순서 사고로 메모리 267개 소실 | P3-2를 P3-1 검증 전에 실행 | **높음** (되돌리기 불가) | P0-2 백업을 junction 밖에 이중 보관 + P3-1 검증 통과를 하드 게이트로 | 백업 위치가 junction 안이면 즉시 중단 |\r\n| R2 | `skills.json` 정정 전에 생성 전환 → 안 쓰는 플러그인 4대에 설치 | P5-2를 P5-1 전에 실행 | 중간 | P5 단계 순서 엄수, 드라이런 필수 | 드라이런 `toInstall`에 ui-ux-pro-max/watch가 뜨면 중단 |\r\n| R3 | 오염된 메모리가 git 동기화로 4대에 전파 | P4 태그 오분류 후 커밋·푸시 | 중간 | 태그 변경은 별도 브랜치 → diff 검토 → 머지 | diff에 본문 변경이 1바이트라도 있으면 중단 |\r\n| R4 | 마이그레이션 중 다른 머신에서 쓰기 발생 | 동결 미준수 | 중간 | P2-3 설계로 과거 오염 차단. P4 구간만 재시도 | 건수 대조 불일치 시 P0 백업에서 재시작 |\r\n| R5 | `autoMemoryDirectory`가 특정 머신 CLI 버전에서 미지원 | P3-1 후 검증 실패 | 중간 | Plan B-1(정션·심링크)로 전환 | 두 머신 이상에서 실패하면 Plan A 전체 재검토 |\r\n| R6 | 동시 기록 충돌 규칙 부재 → 최신 사실 판정 비결정적 (Codex 지적) | 두 머신이 같은 메모리 파일을 동시 수정 | 중간 | 메모리 수정은 git 머지로 해소. `/cs`의 PR 경로 강제 | 충돌 해소 없이 force push가 발생하면 중단 |\r\n| R7 | repo rename·worktree·동일 basename이 새 분리/충돌 유발 (Codex 지적) | 향후 레포 이름 변경 시 | 낮음 | `machine-identity.md`에 \"workspace_id는 경로·레포명과 무관하게 고정\" 명시 | — |\r\n| R8 | agentmemory 서버(Mac Mini) 장애 시 4대 동시 기억 상실 (Codex 지적) | 서버 다운 | 중간 | 이번 범위 밖 — **후속 과제로 등록**. 파일 메모리가 git에 있어 SoT는 살아남음 | — |\r\n\r\n## ❓ 미해결 질문\r\n\r\n**차단 (답이 없으면 실행 불가)**\r\n\r\n- (없음) — 조사로 전부 해소됨.\r\n\r\n**비차단 (가정을 두고 진행)**\r\n\r\n- **ui-ux-pro-max와 watch@claude-video를 계속 쓸 것인가?** `skills.json`에는 있고 실제 설치는 안 돼 있다. **가정**: 안 쓰는 것으로 보고 `skills.json`에서 뺀다. **확인 시점**: P5-1 직전에 사용자에게 1회 확인.\r\n- **sj-rog·sj-x1의 실제 상태는?** 원격 접속을 시도하지 않아 Lens 버전·설정·메모리 상태 미확인. **가정**: sj-omen과 유사하되 버전은 더 낮을 수 있다. **확인 시점**: P7-4 착수 시 SSH로 실측.\r\n- **Mac Mini `~/Documents/GIT`의 옛 클론 더미(20개)를 삭제할 것인가?** **가정**: 이번엔 스캔 제외만 하고 보존. **확인 시점**: 이 계획 완료 후 별건으로 제안.\r\n- **`06. 계약서` 등 Dropbox 폴더에서 세션을 여는 습관이 계속될 것인가?** **가정**: 드문 일. **확인 시점**: P2 이후 새 네임스페이스에 잡폴더가 다시 등장하면 재검토.\r\n\r\n## ✅ Review — 검증\r\n\r\n**검증 전략 (어디까지 · 어떻게 · 보고)**\r\n\r\n- **범위**: 네 머신 전부. sj-omen은 로컬 직접, macmini는 SSH 원격, sj-rog·sj-x1은 SSH 원격(접속 가능 시) 또는 사용자 대행.\r\n- **수단**: ① 파일 존재·내용은 로컬/SSH 셸 명령 ② agentmemory는 MCP `memory_sessions` 실호출 ③ 메모리 수는 파일 카운트 ④ 설치 목록은 `/ci --dry-run --json` ⑤ 본문 무변경은 sha256 대조.\r\n- **보고**: 각 단계 통과/실패를 대화에 남긴다. 실패는 숫자와 함께 그대로 보고하고, 실패를 통과로 반올림하지 않는다.\r\n- **금지**: 코드를 읽고 \"됐을 것\"으로 판정하지 않는다. 반드시 실행 결과로 판정한다.\r\n\r\n| # | EARS (WHEN 트리거, THEN 주체 SHALL 응답) | 확인 방법 | 통과 판정 | 종류 |\r\n|---|---|---|---|---|\r\n| 1 | WHEN 네 머신 각각에서 새 세션을 시작하면, THEN agentmemory SHALL 서로 다른 4개의 project 키(`livevil@sj-omen`/`@sj-rog`/`@sj-x1`/`@macmini`)를 기록한다 | MCP `memory_sessions` 호출 후 최근 4세션의 project 필드 확인 | 4개 키가 정확히 일치, 중복 0 | auto |\r\n| 2 | WHEN sj-omen 이 정식 배선으로 전환되면, THEN 파일 메모리 SHALL 267개 전부 로드되고 정션은 남지 않는다 | 새 세션 후 메모리 수 + `dir /AL` 로 정션 부재 확인 | `267` · JUNCTION 0개 | auto |\r\n| 3 | WHEN 메모리 태깅(P4)이 끝나면, THEN 267개 파일의 본문 SHALL 단 1바이트도 변하지 않는다 | 태깅 전후 본문(프론트매터 제외) sha256 대조 | 불일치 0건 | auto |\r\n| 4 | WHEN 어느 머신에서든 `/ci` 드라이런을 실행하면, THEN 결과 SHALL `toInstall` 0건 · `toRemove` 0건이다 | `node lib/install-sync.js --dry-run --json` | `toInstall:[] , toRemove:[]` | auto |\r\n| 5 | WHEN `/ci` 드라이런을 실행하면, THEN 결과 SHALL `ponytail`·`understand-anything`을 설치 후보로 제시하지 않는다 | 위 JSON에서 두 이름 grep | 0건 | auto |\r\n| 6 | WHEN Mac Mini에서 `/cs`를 실행하면, THEN 스캔 목록 SHALL 실제 작업 레포 4개(livevil-setting·livevil-research·creeta-homepage·namane-mkt)를 포함한다 | `/cs` 출력 또는 `--json` | 4개 모두 존재 | auto |\r\n| 7 | WHEN `/cs`가 base 브랜치를 정리하면, THEN 메모리 디렉터리 SHALL 파일 수가 줄지 않는다 | 실행 전후 메모리 파일 수 비교 | 실행후 ≥ 실행전 | auto |\r\n| 8 | WHEN 새 PC를 배포본으로 세팅하면, THEN 생성된 settings.json SHALL 현 sj-omen과 머신 의존 3개 항목만 다르다 | 배포본 렌더 결과 vs 실물 diff | 차이가 `%%NAME%%` 치환 항목 3개뿐 | manual |\r\n| 9 | WHEN sj-omen에서 \"Mac Mini의 SSH 설정\"을 물으면, THEN 회상 SHALL `machine: macmini` 태그가 붙은 메모리만 머신 고유 사실로 제시한다 | 실제 질문 후 응답 내 출처 확인 | 다른 머신 사실이 macmini 것으로 단언되지 않음 | manual |\r\n| 10 | WHEN 네 머신의 Lens 버전을 조회하면, THEN 전부 SHALL 동일 버전이다 | 각 머신 `claude plugin list` | 4개 버전 문자열 일치 | auto |\r\n\r\n## 진행상황\r\n\r\n- **마지막 업데이트**: 2026-08-08\r\n- **현재 경로**: Plan A\r\n- **완료**: P0(백업) · P1(규격 SoT) · P2(네임스페이스, 접속 가능 2대) · P3-1/P3-3 · P4(머신 태그 253개) · P5(설치목록 SoT 단일화) · P6 · P7\r\n- **재개 포인트**: **P3-2 — sj-omen 정션 제거.** Claude Code 재시작 후 ① agentmemory project 키가 `livevil@sj-omen` 으로 찍히는지 ② 메모리 267개가 그대로 잡히는지 확인하고, **둘 다 통과해야만** 정션을 지운다.\r\n- **설계 변경 (사용자 지시)**: machine_id 중앙 명단 폐기 → 각 머신이 자기 호스트명에서 스스로 도출. 접속 불가 머신 2대는 할 일이 아니라 현황으로만 기록.\r\n- **범위에서 빠진 것**: P6-1(`/cs` reset 가드)은 v3.29.0 소스 실측 결과 **이미 안전**해서 불필요로 판정. P2-3(과거 331세션 재키잉)은 설계상 하지 않는다.\r\n","truncated":false,"stale":false,"branch":null,"base":null},{"id":"2026-07-25-branch-lifecycle-in-task-lifecycle","folder":"tasks","title":"브랜치 생명주기를 작업 생명주기에 붙이기 — /cp · /cc · /cp done · /cs 재배치","date":"2026-07-25","hasMd":true,"hasHtml":true,"mdPath":"tasks/2026-07-25-branch-lifecycle-in-task-lifecycle.md","htmlPath":"tasks/2026-07-25-branch-lifecycle-in-task-lifecycle.html","mdInline":"---\r\nplan_id: 2026-07-25-branch-lifecycle-in-task-lifecycle\r\nplanner: cp\r\ngrade: standard\r\ncreated: 2026-07-25\r\nstatus: in-progress\r\nrefs: []\r\nrepo: creeta-lens\r\nbase: master\r\nbranch: feat/branch-lifecycle\r\npr: 2\r\n---\r\n\r\n# 브랜치 생명주기를 작업 생명주기에 붙이기 — /cp · /cc · /cp done · /cs 재배치\r\n\r\n## 결정 요약 (관리자용)\r\n\r\n**1 task = 1 문서 = 1 브랜치 = 1 PR.** 지금 Lens 는 \"작업의 완료\"를 문서 위치(`docs/tasks/` → `docs/history/`)로만 정의하고, git 의 완료(브랜치 → PR → 머지 → 삭제)와 전혀 연결하지 않는다. 그래서 브랜치는 작업이 *끝난 뒤* `/cs` 가 `sync/<날짜>` 로 급조하고, `/cp done` 은 머지 여부를 모른 채 문서만 옮긴다.\r\n\r\n브랜치 생명주기의 소유권을 세 스킬에 나눠 배치한다 — **`/cp` 가 이름을 정하고(문서에 기록), `/cc` 가 만들어 그 위에서만 커밋하고, `/cp done` 이 PR·머지·삭제로 닫는다.** `/cs` 는 task 브랜치를 소유하지 않고 계획 밖 변경만 쓸어담는다.\r\n\r\n단계는 **2단**이다: `feat/x` → 테스트 → 그 레포의 base 병합 → 브랜치 삭제. staging 을 새로 만들지 않는다 — 실제 staging 배포 환경이 있는 레포가 `Returns_ERP_v20` 하나뿐이고, 환경 없는 staging 브랜치는 main 과 항상 동일해져 머지를 두 번 하는 절차만 남기 때문이다.\r\n\r\n## 🎯 What — 목표 (무엇이 가능해지는가)\r\n\r\n**이 작업이 끝나면 가능해지는 것:**\r\n\r\n- 새 작업을 시작하면 그 작업만의 브랜치에서 코드가 바뀐다 — 통합 브랜치(main·master·staging)가 작업 중간 상태로 오염되지 않는다.\r\n- 작업을 완료 처리하면 그 변경이 리뷰 가능한 상태로 올라가고, 병합이 확인된 뒤에야 완료 기록으로 내려간다 — \"문서상 완료인데 코드는 어디 있는지 모르는\" 상태가 사라진다.\r\n- 병합이 끝난 브랜치는 자동으로 없어진다 — 브랜치 목록을 열면 지금 진행 중인 작업만 보인다.\r\n- 배포 환경이 있는 레포에서는 작업이 실수로 배포를 트리거하지 않는다 — 지금은 막혀 있지 않다.\r\n- 여러 작업자(병렬 worker)가 동시에 같은 레포를 고쳐도 서로의 변경을 지우지 않는다.\r\n\r\n**완료의 정의 (Done = ?):**\r\n\r\n> 아무 레포에서나 새 작업을 계획하고 실행한 뒤 완료 처리했을 때, 그 작업의 코드가 자기 브랜치에서 리뷰를 거쳐 통합 브랜치에 들어가 있고, 그 브랜치는 지워져 있고, 완료 기록 문서가 남아 있다.\r\n\r\n## 🚧 비목표 (Non-Goals)\r\n\r\n- **staging 브랜치를 새로 만드는 것** — 배포 환경이 뒤에 없는 staging 은 리뷰 가치가 0이고 머지 절차만 늘린다. 사용자 확정(2026-07-25): \"staging조차 배포환경이 있는 것이나 하는 거지.\"\r\n- **staging 배포 환경 구축(26개 레포)** — 인프라·비용 과제로 이 계획과 분리한다.\r\n- **`master` → `main` 이름 통일(13개 레포)** — 원격 default 변경·다른 머신 재동기화·배포 훅 점검이 레포마다 따라온다. Lens 가 base 를 감지하면 문제가 해소되므로 이번 범위에서 뺀다.\r\n- **`Returns_ERP_v20` 의 staging→main 승격 절차 대체** — `promote-to-main.sh` 는 그 레포의 배포 절차다. Lens 는 staging 을 base 로 인식만 하고 승격에 관여하지 않는다.\r\n- **PR 리뷰 프로세스(승인자·CODEOWNERS·CI 필수화) 설계** — 1인 개발이라 리뷰어가 본인이다. PR 은 \"변경을 한 덩어리로 보이게 하는 장치\"로만 쓴다.\r\n- **기존 원격 브랜치 대청소를 이 작업에 포함** — 도입 전 1회 정리는 선행 조건(T0)으로 분리해 실행한다.\r\n\r\n## ❓ Why — 왜 해야 하는가\r\n\r\n- **푸는 문제 / 동기 (왜 지금·무엇을·누구를 위해·어디서)**: 사용자가 27개 레포를 혼자 개발하면서 Lens 로 계획→실행→완료를 돌리는데, 그 흐름에 브랜치 개념이 아예 없다. 실측 결과 **26개 레포 중 25개가 통합 브랜치 위에서 직접 작업**하고 있다(`creeta-lens`=master, `livevil-contents`=main, `Returns_ERP_v20`=staging …). 그래서 세 가지가 동시에 깨진다. ① 작업 중간 상태가 통합 브랜치에 바로 쌓여 \"지금 main 이 배포 가능한가\"를 알 수 없다. ② `/cc` 의 자동 커밋 보호가 `main|master` 문자 비교라서 **`staging` 체크아웃인 `Returns_ERP_v20` 은 보호에서 빠진다** — staging 은 배포 트리거다. ③ `/cp done` 이 머지와 무관하게 문서만 옮기므로 브랜치가 계속 쌓인다(`livevil-research` 실측: 원격 브랜치 10개 중 살아 있는 작업 1개, 접두사 9종 혼재).\r\n- **안 하면 (방치 시 비용)**: 브랜치 누적은 이미 발생한 사고다 — `livevil-research` 는 지금도 `agent/research-workspace-features-20260725` 에 체크아웃된 채 main 과 갈라져 있고(main 전용 7커밋 / 브랜치 전용 3커밋), 그 브랜치가 자기 자신을 upstream 으로 가져 `/cs` 규칙상 **사실상 base 로 승격**돼 버렸다. 즉 3커밋이 main 에 못 들어간 채 고립됐고, `/cs` 는 그걸 정상으로 본다. 이 구조를 고치지 않으면 \"어느 계보가 살아 있는지\" 판단 비용이 계속 커지고, `Returns_ERP_v20` 에서는 판단 실수 한 번이 운영 배포 사고가 된다.\r\n- **언제**: 지금이 적기다. `livevil-research` 에서 이 문제를 부분적으로 푼 자산(`docs/rules/branch-hygiene.md`, `scripts/prune_branches.py`, PR #4)이 이미 존재하므로, 그 실측 결론을 Lens 규칙으로 승격하면 재발명 없이 전 레포로 확장된다.\r\n\r\n## 🧰 실행 전략 & 자원\r\n\r\n- **난이도**: medium — 코드량은 크지 않지만(신규 lib 1개 + 스킬 문서 3곳 + config) 27개 레포의 git 상태를 건드리는 판정 로직이라 정확성 요구가 높다. 파일 수 9개, 되돌리기는 쉬움(전부 버전관리 + 기본값 off 시작).\r\n- **권장 모델**: `fable` (Task enum 최상위 티어) — base 판정·머지 판정은 \"틀리면 배포 사고\" 경로다. 문서 편집 태스크(T1·T4·T6)는 `sonnet` 으로 충분.\r\n- **병렬 실행**: T1·T2·T3 은 서로 독립이라 3-way 병렬 가능. T4·T5·T6 은 T2·T3 완료 후(의존). T7·T8·T9 는 독립. 단일 세션 순차로도 무리 없는 규모 — `/cc` 로 넘길 때 wave 2개로 묶는다.\r\n- **활용 스킬**: `/cc`(실행·병렬 worker), `/ccp`(도입 후 27개 레포 대상 실동작 검증), Codex(base·머지 판정 로직 교차검증 — 이미 P0.5 에서 1회 수행). 브라우저 검증 불필요(CLI 레이어).\r\n- **기존 자원·시스템 (재사용)**:\r\n  - `livevil-research/docs/rules/branch-hygiene.md` — 접두사 4종·patch-id 머지 판정·태그 아카이브 원칙. **실측으로 확립된 결론**이라 Lens 규칙의 기반으로 삼는다.\r\n  - `livevil-research/scripts/prune_branches.py` + `tests/test_prune_branches.py` — rebase·squash 머지 판정이 이미 구현·테스트됨. Lens 로 승격(복제) 대상.\r\n  - `creeta-lens/scripts/git-sync-all.sh` — 브랜치 생성→커밋→push→PR→복귀 순서와 fail-closed 원칙이 이미 검증됨. task 브랜치 흐름이 이 순서를 그대로 재사용한다.\r\n  - `creeta-lens/lib/plan-manager.js` — frontmatter 생성·파싱·상태갱신 진입점 존재. 필드 추가로 확장.\r\n  - `creeta-lens/lib/hook-utils.js` — 파일 lock 존재(Codex 지적). 병렬 worker 직렬 통합 lock 에 재사용.\r\n  - `creeta-lens/lib/board-builder.js` — board 생성기. In Review 칼럼 추가 지점.\r\n  - `Returns_ERP_v20/promote-to-main.sh` — staging→main 승격. 그대로 둔다.\r\n\r\n## 🚫 DO NOT CHANGE\r\n\r\n- `creeta-lens/scripts/git-sync-all.sh` 의 **PR-only fail-closed 원칙과 \"브랜치를 커밋보다 먼저 자른다\" 순서** — 주석에 실측 근거가 박혀 있다(\"Order is the whole trick\"). task 브랜치 도입과 무관하게 유지.\r\n- `git-sync-all.sh` 의 **base = 그 브랜치의 upstream** 규칙 — `Returns_ERP_v20` 이 staging 에 있는 이유가 여기 걸려 있다. 판정 소스를 추가할 뿐, 이 규칙을 뒤집지 않는다.\r\n- **`.gitignore` 존중 / 시크릿 임의 제외 금지** (`/cc` Phase 7.4 rule 1) — 사용자 강한 룰. 브랜치 로직이 이 규칙에 손대지 않는다.\r\n- `Returns_ERP_v20` 의 `staging` → `main` 승격 절차 및 `promote-to-main.sh` — Lens 가 대체·자동화하지 않는다.\r\n- `livevil-research/docs/rules/branch-hygiene.md` **원본 파일** — 그 레포 소유 문서다. Lens 규칙으로는 **복제·참조**하고 원본을 수정하지 않는다.\r\n- `livevil-research` 의 열린 PR #4 / #5 — 진행 중인 작업이다. 이 계획이 건드리지 않는다.\r\n- `lens.config.json` 의 기존 키(`autoCommitOnComplete` 등)의 **의미** — 새 키를 추가할 뿐 기존 동작을 재정의하지 않는다.\r\n\r\n## 🛠 How — 어떻게 (Plan A / Plan B)\r\n\r\n### Plan A — 권장 경로\r\n\r\n#### 왜 이게 1순위인가\r\n\r\n세 가지 근거다. ① **생성 자동화보다 삭제 자동화가 먼저다** — 브랜치 자동 생성만 넣으면 이미 실측된 누적 문제(원격 10개 중 살아있는 것 1개)를 가속한다. 그래서 T0(1회 정리)·T8(prune 승격)을 같은 릴리즈에 묶고, 정리 수단이 없으면 생성 기능을 기본 off 로 둔다. ② **base 판정을 문자 비교에서 감지로 바꾸는 것이 최우선 안전 항목이다** — `main|master` 하드코딩이 `staging` 을 놓치는 것이 현재 유일한 배포 사고 경로다. ③ **판정 로직을 lib 한 곳에 모은다** — 지금 브랜치 지식이 `git-sync-all.sh`(bash)에만 있고 스킬 문서에는 산문으로만 있어서, 스킬이 저마다 다르게 판단한다. `lib/git-branch.js` 하나가 SoT 가 되면 `/cp`·`/cc`·`/cp done`·board 가 같은 답을 본다.\r\n\r\n#### 브랜치 모델 (2단 — 확정)\r\n\r\n```\r\nfeat/<slug>  ──PR──▶  그 레포의 base ──▶ 브랜치 삭제\r\n                       (main | master | staging — 레포마다 감지)\r\n\r\n예외 1개: Returns_ERP_v20\r\nfeat/<slug>  ──PR──▶  staging ──[배포·검증]──▶ promote-to-main.sh ──▶ main\r\n                                                (그 레포 고유 절차 — Lens 관여 X)\r\n```\r\n\r\n- 접두사는 **`feat/` `fix/` `ops/` `docs/` 4종만.** `agent/` `claude/` `codex/` `task/` `feature/` `backup/` 금지(현재 `livevil-research` 누적의 원인). `sync/` 는 `/cs` 전용 임시 접두사로 **예외 인정**하되 \"머지 즉시 삭제\"를 규칙에 명시한다.\r\n- 이름은 `feat/<무엇을-하는지>`. 날짜를 붙이지 않는다(커밋이 이미 갖고 있다).\r\n- base 판정 우선순위: ① `lens.config.json` 의 `baseBranch.<repo>` 명시값 → ② 현재 브랜치의 upstream (`git for-each-ref --format='%(upstream:short)'`) → ③ `origin/HEAD`. **`main|master` 문자 추정 금지.**\r\n\r\n#### 소유권 재배치 (설계의 핵심)\r\n\r\n| 시점 | 스킬 | 지금 | 바뀌는 것 |\r\n|---|---|---|---|\r\n| 계획 승인 | `/cp` Phase 2.5·5 | 브랜치 개념 없음 | frontmatter 에 `repo` / `base`(감지값) / `branch: feat/<slug>` 기록. **브랜치를 만들지는 않는다**(`/cp` 는 문서만) |\r\n| 실행 진입 | `/cc` Phase 0 | 현재 브랜치 그대로 작업 | base fetch·최신화 → `checkout -b <plan.branch>`. dirty·diverged·upstream 부재면 **실행 차단**(fail-closed) |\r\n| 병렬 worker | `/cc` Phase 3 | 같은 작업트리 공유 | 같은 파일을 건드리는 worker 2개 이상이면 worktree 격리 + Leader 만 task 브랜치에 직렬 통합(lock) |\r\n| 실행 완료 | `/cc` Phase 7.4 | `main\\|master` 면 분기 후 커밋 | **커밋 허용 조건 = 현재 브랜치가 `plan.branch` 와 같을 때만.** 그 외(감지된 base 포함)는 커밋 거부·보고 |\r\n| 완료 처리 | `/cp done` | 문서만 이동 | ① PR 생성/확인 ② 머지 판정 ③ 머지됐으면 history 기록 + 브랜치 삭제 ④ **미머지면 history 로 내리지 않고 \"In Review\" 보고** |\r\n| 스윕 | `/cs` | 모든 dirty 를 `sync/` 로 | task 브랜치는 **건너뛴다**(재포장·reset 금지). `sync/` 는 계획 밖 dirty 전용 |\r\n\r\n#### 머지 판정 (틀리면 코드가 사라지는 지점)\r\n\r\n`ahead` 커밋 수를 근거로 쓰지 않는다. GitHub 의 rebase·squash 머지는 커밋을 새로 쓰므로 조상 관계만 보면 이미 병합된 브랜치가 영원히 미병합으로 보인다(`livevil-research` PR #4 실측).\r\n\r\n```sh\r\n# ① 빠른 경로 — 팁이 base 의 조상\r\ngit merge-base --is-ancestor origin/<branch> origin/<base>\r\n# ② 실패 시 — base 에 없는 patch 가 있는지 (rebase·squash 대응)\r\ngit cherry origin/<base> origin/<branch> | grep '^+'\r\n```\r\n\r\n둘 다 통과 못 하면 **자동 삭제하지 않는다**(리베이스 중 충돌 해결로 patch-id 가 바뀐 경우 — 도구가 병합을 증명할 수 없다는 뜻).\r\n\r\n#### 단계\r\n\r\n- [ ] **T0 선행 정리 (1회, 도입 전)** — `livevil-research` 원격 브랜치 10개 상태를 `prune_branches.py` 로 판정하고, 병합된 것 삭제 / 계보 다른 것 태그 아카이브 / 열린 PR(#4·#5) 처리. 체크아웃을 `main` 으로 복귀. `creeta-lens`·`livevil-research` 의 로컬 `sync/2026-07-25-*` 잔여 브랜치 정리.\r\n      검증: `git branch -a` 에 `agent/`·`sync/` 잔여 0, 27개 레포 전부 base 체크아웃 → 상태표 출력\r\n- [ ] **T1 `docs/rules/branch-lifecycle.md` 신설** — Lens 워크스페이스 브랜치 규칙 SoT. 내용: 2단 모델 / 접두사 4종+`sync/` 예외 / base 판정 3단 우선순위 / 1task=1브랜치=1PR / 머지 판정 2단 / 태그 아카이브 / `Returns_ERP_v20` 예외 / `namane-cms`(main+master 공존) 처리. `livevil-research/docs/rules/branch-hygiene.md` 를 출처로 명기.\r\n      검증: 문서 존재 + `/cp`·`/cc`·`/cs` 세 스킬이 이 문서를 참조 링크로 걸었는지 grep\r\n- [ ] **T2 `lib/git-branch.js` 신설** — `resolveBase(repoPath)`(config→upstream→origin/HEAD), `canCommitTo(repoPath, planBranch)`, `mergedState(repoPath, branch, base)`(ancestor→cherry 2단), `branchName(prefix, slug)`(접두사 검증·날짜 금지), `preflight(repoPath)`(dirty·diverged·upstream 검사).\r\n      검증: 27개 레포 전체에 `resolveBase` 를 돌려 `Returns_ERP_v20`=staging, `creeta-lens`=master, `livevil-contents`=main 이 나오는지 표로 출력 + `mergedState` 를 `livevil-research` 의 실제 머지된 브랜치에 돌려 `MERGED(patch 동일)` 판정 재현\r\n- [ ] **T3 `lib/plan-manager.js` frontmatter 확장** — `repo` / `base` / `branch` / `pr` 4필드를 생성(`createPlan`)·파싱(`parseFrontmatter`)·갱신(`updatePlanStatus`)에 추가. 기존 필드·기존 문서 하위호환 유지(필드 없으면 null).\r\n      검증: 기존 task 문서 3건 파싱 시 에러 0(필드 없음 → null) + 신규 생성 문서에 4필드 존재\r\n- [ ] **T4 `skills/cp/SKILL.md` — PLAN 모드** — Phase 2.5 문서 템플릿에 브랜치 필드 추가, Phase 5.0 게이트에 \"base 감지 결과 표시\" 추가(사용자가 승인 화면에서 `staging` 을 눈으로 확인), 핸드오프 페이로드에 `[BRANCH]` 블록(`repo`/`base`/`branch`) 추가.\r\n      검증: `/cp` 로 새 계획 1건 생성 → frontmatter 4필드 + 승인 게이트 출력에 base 표시 + 핸드오프 페이로드에 `[BRANCH]` 존재\r\n- [ ] **T5 `skills/cc/SKILL.md` — 실행** — Phase 0 에 브랜치 preflight+생성 단계 신설. Phase 7.4 rule 2 의 `main|master` 문자 비교를 `canCommitTo(plan.branch)` 로 교체. Phase 3 에 worktree 격리 조건(같은 파일 건드리는 worker 2+) 명시.\r\n      검증: `Returns_ERP_v20`(staging 체크아웃)에서 dry-run → \"staging 직접 커밋 거부 + feat/ 브랜치 생성 필요\" 로 판정되는지 확인 (현재는 통과해버림)\r\n- [ ] **T6 `skills/cp/SKILL.md` — DONE 모드** — Phase 1.5 신설(task 문서의 `branch` 로 git 상태 판정: 미푸시 / PR 없음 / PR 열림 / 머지됨). Phase 4 에 브랜치 삭제(로컬+원격) 추가. **미머지 task 는 history 이동 금지** 규칙 명시 + \"In Review\" 보고 형식 추가.\r\n      검증: 머지 안 된 브랜치를 가진 task 로 `/cp done` → history 미생성 + \"In Review\" 보고. 머지된 브랜치 → history 생성 + 브랜치 삭제 확인\r\n- [ ] **T7 `lib/board-builder.js` — In Review 칼럼** — `gh pr list --json` 조인으로 To do / Doing / **In Review** / Done 4칼럼. `gh` 부재·인증 실패 시 3칼럼으로 graceful degrade(조용한 실패 금지 — 사유 표시).\r\n      검증: `creeta-lens` board 재빌드 → In Review 칼럼 렌더 + `gh` 없는 환경 시뮬레이션에서 3칼럼 + 사유 표시\r\n- [ ] **T8 `scripts/prune_branches.py` 승격 + `/cs` 통합** — `livevil-research` 에서 `creeta-lens/scripts/` 로 복제(원본 유지), 멀티레포 지원(`--repo-root`), `/cs` 종료 시 \"브랜치 5개 초과 레포\" 경고 + prune 안내. `--apply` 는 두 `삭제` 판정만.\r\n      검증: 27개 레포 전체 판정 실행(`--apply` 없이) → 레포별 삭제/아카이브/유지 집계 출력. 테스트 `tests/test_prune_branches.py` 동반 이식 후 통과\r\n- [ ] **T9 `lens.config.json` 확장** — `baseBranch`(레포별 명시 맵, 기본 `{}`), `requireTaskBranch`(기본 **false** — T0·T8 완료 후 true 로 전환), `autoDeleteMergedBranch`(기본 true), `branchPrefixes`(기본 `[\"feat\",\"fix\",\"ops\",\"docs\"]`).\r\n      검증: config 파싱 + `requireTaskBranch:false` 에서 기존 동작 100% 보존(회귀) → true 로 켠 뒤 T5 검증 재실행\r\n- [ ] **T10 Lens 2분 진행보고 완전 강제** (사용자 지시 2026-07-25: \"cc를 할 때 반드시 2분마다 진행사항 보고하는 걸 완전 강제하도록 해\") — `docs/rules/harness-rules.md`(SoT) + `skills/{cc,cp,c,ccp,cr,cs}/SKILL.md` 의 주기 5분 → **2분**. 매 보고 3요소 필수(① 생존확인 실측 — 확인 없이 \"진행 중\" 금지 ② 끝난 것/남은 것 N/M ③ 부분 산출물 먼저 제출), \"아직입니다\"만 적는 보고는 위반. **강제 수단 = Lens 훅**(`PostToolUse` 경과시간 추적 → 2분 초과 시 보고 요구 주입). 산문 규칙만으로는 조용히 스킵된다는 것이 실측 이력(2026-07-20 워크플로 조용한 사망 오보).\r\n      ⚠️ `ScheduleWakeup` 은 강제 수단이 아니다 — `/loop` 전용 페이서이고 \"백그라운드 폴링용 짧은 주기 예약 금지\"가 스키마에 명시(조사 중 확인).\r\n      검증: 6개 스킬+SoT 에 \"5분\" 잔존 0건 / 훅을 2분 경과 상태와 미경과 상태 양쪽에서 실행해 리마인더 발화·침묵 대조 / `hooks.json` 파싱 + 기존 훅 5개 문법 검사\r\n- [ ] **T11 기본 agent 규칙에도 2분보고 강제** (사용자 지시: \"렌즈에도 강제하고, 기본 agent 규칙에도 강제해\") — `C:/Users/ADMIN/.claude/CLAUDE.md`(전역, 모든 세션 자동 로드) + SoT `livevil-setting/docs/rules/coding-principles.md` 양쪽에 동일 규칙 추가. `scripts/sync-karpathy-rules.ps1` 의 동기화 범위가 새 규칙을 커버하는지 확인하고, 커버하지 않으면 최소 수정(⚠️ `.ps1` 은 UTF-8 BOM 필수 — 없으면 한글 깨짐).\r\n      검증: 양쪽 파일에 규칙 존재 + 내용 일치 대조 + `sync-karpathy-rules.ps1 -Verify` 출력 / `livevil-setting` 의 무관한 미커밋 변경(`claude-memory/`)이 그대로 남아있는지\r\n- [ ] **T12 모델 사다리 4단 개정** (사용자 지적 2026-07-25: \"왜 opus는 안써? 사고과정이 들어가는 건 다 상위 모델로 하고, 단순 개발·반복은 sonnet 으로 배정해야 하는 거 아니야?\") — **실제 결함: Task 도구 enum 에는 티어가 4개(`haiku`/`sonnet`/`opus`/`fable`)인데 Lens 사다리는 3칸(Easy=haiku / Medium=sonnet / Hard=TOP=fable)만 써서 `opus` 칸이 비어 있다.** 그래서 \"사고과정은 필요하지만 최고난도는 아닌\" 작업이 전부 sonnet 으로 떨어진다. `skills/{cc,c,ccp}/SKILL.md` 의 사다리를 4단으로 개정하고 판정 기준을 한 줄로 명문화: **\"사고과정(트레이드오프 판단)이 들어가면 상위 티어 이상, 정형 반복이면 중간 티어 이하.\"** 각 칸은 이름이 아니라 상대 위치(세대와 함께 자동 상승)라는 기존 서술과 \"모든 spawn 모델 명시(상속 금지)\" 규칙은 유지. TOP 상한(3)에 `opus` 는 포함되지 않음을 명시.\r\n      검증: 3개 스킬에 `opus` 칸 실재 + 기존 예시의 모델 배정이 4단 기준으로 갱신됐는지\r\n\r\n#### 막힐 수 있는 지점 (→ Plan B 트리거)\r\n\r\n- **T5 검증**: `gh` 인증·`workflow` 스코프 문제로 PR 생성이 실패하는 레포가 3개 이상 → PR 필수 전제가 깨진다.\r\n- **T2 검증**: `resolveBase` 가 `docs` 레포(원격에 main·master 둘 다 없음, upstream 조회 결과가 정상 형태가 아닌 이상 상태)나 `namane-cms`(main+master 공존)에서 판정 불가.\r\n- **T0**: `livevil-research` 의 `task/community-insight-surface-v3` 처럼 patch-id 가 달라 머지를 증명할 수 없는 브랜치가 다수 → 자동 정리 불가, 수동 확인 부담이 커짐.\r\n- **T6**: 사용자가 혼자 개발하므로 \"PR 열림 = 미완\" 규칙이 완료 처리를 계속 막는 마찰로 체감될 수 있다.\r\n- **T9 기본값 정책 (Pre-mortem 2)**: `requireTaskBranch:false` 로 배포하는 것이 사용자 룰(dormant 스캐폴딩 금지)과 충돌한다 → 사용자가 \"기본 off 배포 금지\"를 확인하면 T0·T8 완료 없이는 **릴리즈 자체를 하지 않는** 순서로 재배치.\r\n- **`/c` 누락 (Pre-mortem 3)**: T5 검증 후 `/c` 로 실행했을 때 base 직접 커밋이 재현되면 → 범위를 넓혀 `/c` 도 같은 게이트에 포함(T5 확장 또는 T10 신설).\r\n- **`Returns_ERP_v20` 완료=배포 (Pre-mortem 4)**: T6 검증에서 staging PR 머지가 배포를 트리거하는 것이 확인되면 → 그 레포는 \"PR 생성까지만\" 으로 `/cp done` 동작을 분기.\r\n- **로컬 브랜치 머지 판정 (Pre-mortem 9)**: `mergedState` 를 push 전 로컬 브랜치에 돌려 판정이 달라지면 → 로컬/원격 구분 처리를 T2 에 추가하고 \"미푸시\" 를 독립 상태로 둔다.\r\n- **멀티레포 전제 위반 (Pre-mortem 11)**: T0(`livevil-research` 정리)가 `creeta-lens` 작업과 한 task 로 묶여 진행 추적이 꼬이면 → T0 를 **별도 task 문서로 분리**해 먼저 완결.\r\n\r\n### Plan B — Fallback 경로\r\n\r\n#### Trigger\r\n\r\nPlan A 의 **T5 검증에서 PR 생성 실패 레포가 3개 이상**이거나, **T6 도입 후 \"PR 열림 때문에 완료 처리 불가\" 가 한 세션에 2회 이상 발생**하면 즉시 전환.\r\n\r\n#### 왜 이 대안인가\r\n\r\nPR 을 필수로 두는 이유는 \"변경을 한 덩어리로 리뷰 가능하게\" 만드는 것뿐이다. 1인 개발에서 리뷰어가 본인이면 PR 은 마찰만 남는다. Plan B 는 **브랜치는 유지하되 PR 을 생략**하고 로컬에서 base 로 병합한다. 잃는 것: 변경 이력이 GitHub PR 페이지에 남지 않고, 다른 머신(Mac Mini)에서 리뷰할 수단이 없어진다. 얻는 것: `gh` 의존 제거, 완료 처리 즉시성.\r\n\r\n#### 단계\r\n\r\n- [ ] B1 `lens.config.json` 에 `mergeMode: \"local\" | \"pr\"` 추가 (기본 `pr`, 트리거 시 `local`)\r\n- [ ] B2 `/cp done` Phase 1.5 판정에서 `local` 모드면 PR 상태 대신 \"base 에 patch 포함 여부\"만 본다\r\n      검증: 머지 안 된 브랜치 → `--no-ff` 로 base 병합 → `mergedState` 가 `MERGED` 로 바뀌는지 확인\r\n- [ ] B3 `/cp done` Phase 4 는 동일(브랜치 삭제) — 삭제 판정은 그대로 patch-id 기반\r\n      검증: 병합 후 브랜치 삭제 + `git log base` 에 커밋 존재\r\n- [ ] B4 `gh` 가 있는 레포는 `pr` 모드로 개별 복귀 가능하게 레포별 오버라이드 허용\r\n\r\n## 🔀 검토된 대안 (Alternatives Considered)\r\n\r\n**대안 A — 네이티브 worktree(`EnterWorktree`)를 task 단위 격리 수단으로 사용**\r\n- *Good, because* 하네스가 이미 제공한다(`.claude/worktrees/` 자동 생성·브랜치 생성·정리 프롬프트). Lens 가 git 조작 코드를 안 써도 된다.\r\n- *Bad, because* `docs/rules/capability-assumptions.json` 이 네이티브 worktree 를 **단일 레포 한정**으로 명시하고(Codex 교차조사에서 확인), 이 워크스페이스는 `C:\\Users\\ADMIN\\Documents\\GIT` 아래 27개 독립 레포가 병렬로 있는 멀티레포다. 또 `EnterWorktree` 툴 설명이 \"사용자나 CLAUDE.md 가 명시적으로 worktree 를 요구할 때만\" 사용하도록 못 박고 있어 기본 경로로 삼을 수 없다.\r\n- **기각** — 단, `/cc` 병렬 worker 가 같은 파일을 건드릴 때의 충돌 방지에는 **국소적으로 채택**(T5). 전체 task 격리 수단으로는 쓰지 않는다.\r\n\r\n**대안 B — `/cs` 를 확장해 브랜치를 전부 `/cs` 가 관리**\r\n- *Good, because* 브랜치 지식이 이미 `git-sync-all.sh` 한 곳에 모여 있어 추가 lib 없이 확장 가능. 멀티레포 순회 로직도 완성돼 있다.\r\n- *Bad, because* `/cs` 는 \"워크스페이스 전체 스윕\"이라 **\"지금 이 작업\"이라는 개념이 없다.** 그래서 지금도 `sync/` PR 하나에 무관한 레포·무관한 변경이 뒤섞여 `chore: auto-sync` 로 올라간다(PR #5 실측). 사후 스윕으로 task 브랜치를 만들려는 시도가 이미 실패한 것이 현재 상태다.\r\n- **기각** — `/cs` 는 계획 밖 dirty 전용으로 **범위를 좁힌다**(Plan A T5·소유권 표).\r\n\r\n**대안 C — git hook(`pre-commit`)으로 base 브랜치 커밋을 차단**\r\n- *Good, because* Lens 를 거치지 않는 수동 커밋까지 막는다. 방어선이 가장 낮은 층에 생긴다.\r\n- *Bad, because* 27개 레포에 hook 을 설치·동기화해야 하고(hook 은 clone 에 안 따라온다), 다른 머신(Mac Mini)까지 배포 대상이 된다. 그리고 hook 은 \"왜 막혔는지\"를 사용자에게 설명하지 못한다 — Lens 는 스킬 레이어에서 판단해야 base·PR 상태를 보고에 실을 수 있다.\r\n- **기각** — 다만 `requireTaskBranch:true` 가 안정화된 뒤 보조 방어선으로 재검토 가치 있음(후속 과제).\r\n\r\n**대안 D — 사용자 최초 제안대로 전 레포 3단(`feat` → `staging` → `main`)**\r\n- *Good, because* 흐름이 하나로 통일돼 예외를 기억할 필요가 없다.\r\n- *Bad, because* staging 배포 환경이 있는 레포가 `Returns_ERP_v20` 하나뿐이라(실측), 나머지 26개에서 staging 은 main 과 항상 동일해지고 머지를 두 번 하는 절차만 남는다.\r\n- **기각** — 사용자 확정(2026-07-25): \"3단을 할 필요가 전혀 없어 / staging조차 배포환경이 있는 것이나 하는 거지.\"\r\n\r\n### 🔀 듀얼 합성 (Claude ‖ Codex)\r\n\r\n**합의 (고신뢰 — 그대로 lock):**\r\n- 브랜치 생명주기 소유권 배치: `/cp`=이름 확정, `/cc`=생성·커밋, `/cp done`=PR·머지 확인, `/cs`=예외 동기화. (양쪽 독립 도출)\r\n- `main|master` 추정 금지, base 는 설정 우선 + upstream 감지. `Returns_ERP_v20` staging 우회가 최대 운영 리스크.\r\n- `/cc` 병렬 worker 는 같은 작업트리를 공유하면 안 되고, worktree 격리 + Leader 직렬 통합이 필요.\r\n- `/cp done` 은 PR·머지 검증 실패 시 **task 문서를 삭제하지 않는다**(fail-closed).\r\n- `/cs` 의 `sync/` 는 계획 밖 dirty 전용으로 축소하고, Lens task 브랜치는 재포장·reset 하지 않는다.\r\n\r\n**분기 → 해소:**\r\n- **브랜치 이름 규칙**: Claude=`feat/ fix/ ops/ docs/` 4종(레포 기존 `branch-hygiene.md` 승격) / Codex=`lens/<plan-id>-<slug>` → **채택: Claude 안.** 근거: `livevil-research/docs/rules/branch-hygiene.md` 가 \"도구·에이전트 이름을 접두사에 넣지 않는다\"를 명시적 규칙으로 두고 `claude/`·`codex/`·`agent/` 접두사 누적을 실측 사고로 기록했다. `lens/` 는 같은 실수의 반복이다. 또 `<plan-id>` 는 날짜를 포함하는데 같은 문서가 \"날짜는 커밋이 이미 갖고 있다\"며 금지한다.\r\n- **PR 을 누가 만드나**: Claude=`/cp done` 시점 / Codex=`/cp done` 시점(동일) + \"자동 머지는 명시 승인+CI 통과 시에만\" → **채택: 양쪽 병합.** 자동 머지는 이번 범위에서 제외하고(비목표: PR 리뷰 프로세스 설계) 머지는 사람이 한다. Codex 의 \"CI 통과 조건\" 은 CI 가 있는 레포가 소수라 후속 과제로 남긴다.\r\n- **부분 실패 처리**: Codex 가 \"27개 레포 중 일부만 성공 → 잘못된 history\" 리스크와 **레포별 상태 manifest + 재개 가능한 fail-closed** 를 제안 → **채택.** Claude 안에 없던 항목이라 R1·리스크 레지스터에 반영. 단 이번 계획은 \"1 task = 1 레포\" 를 기본 전제로 두므로(멀티레포 단일 task 는 드묾) manifest 는 `/cp done` 의 판정 결과 표로 최소 구현한다.\r\n- **`docs/rules/capability-assumptions.json`(네이티브 worktree 단일레포 한정)**: Codex 단독 발견 → 대안 A 기각 근거로 채택.\r\n\r\n### ⚠️ 사전 리스크 (Pre-mortem)\r\n\r\n#### Claude TOP 관점 (세션 컨텍스트 + 프로젝트 규칙 기반)\r\n\r\n1. **사용자 강한 룰과 정면 충돌 — 원격 머신 동기화**: `feedback_always_commit_and_sync`(\"커밋은 무조건 + Mac Mini 등 운영 머신까지 동기화\")는 이 설계와 상충한다. task 브랜치는 **머지 전까지 다른 머신에 도달하지 않는다.** 운영 머신에서 바로 필요한 변경(cron·서비스 코드)은 별도 경로가 필요하다. → **T5 착수 전 사용자 확인 필수 항목.**\r\n2. **사용자 강한 룰과 충돌 — dormant 스캐폴딩 금지**: `feedback_no_dormant_scaffolding`(\"옵트인·dry-run 금지, 라이브 가동까지가 완료\")과 T9 의 `requireTaskBranch: false` 기본값이 상충한다. R1(누적 가속) 완화책이 곧 룰 위반 구조다. → T0·T8 을 **같은 릴리즈에 넣고 즉시 true 로 전환**하는 것을 완료 조건으로 못 박아야 한다(\"기본 off 로 배포하고 나중에 켠다\"는 금지).\r\n3. **`/c` 누락 = 실제 구멍**: `/c`(단일 worker)도 같은 자동커밋 규칙을 참조하는데 이번 범위에서 빠졌다. v3.25 가 실행 진입 게이트를 `/c`·`/cc` **둘 다**에 붙였으므로, 도입 직후 `/c` 로 실행하면 base 직접 커밋 경로가 그대로 남는다. → T5 에 `/c` 를 포함하거나 T10 으로 분리.\r\n4. **`Returns_ERP_v20` 은 \"완료 처리 = 배포\"가 된다**: base 가 `staging` 이므로 `/cp done` 이 여는 PR 의 머지가 곧 staging 배포다. 완료의 의미가 레포마다 달라진다. → 이 레포만 **\"PR 생성까지만, 머지는 사람\"** 으로 T1·T6 에 명시.\r\n5. **`/cc` SKILL.md 에 `#### 7.4` 가 두 개** (자동 커밋 / plan 진행상황 갱신). T5 가 \"Phase 7.4 rule 2 교체\"로 지시하면 실행자가 어느 쪽인지 헷갈린다. → 태스크에 **원문 문구 인용**으로 앵커를 고정.\r\n6. **규칙 SoT 상충**: T1 이 `sync/` 를 \"예외 인정\"하면, 승격 원본(`livevil-research/docs/rules/branch-hygiene.md`)이 **명시적으로 금지한 항목**을 Lens 규칙이 뒤집는다. 두 문서가 같은 워크스페이스에 공존하므로 어느 쪽이 상위인지 T1 에 명시해야 한다.\r\n7. **board 의 오프라인 성질이 깨진다**: T7 이 `gh pr list` 를 board 빌드마다 호출하면 27개 레포 × API 호출이 생긴다. 지금 board-builder 는 네트워크 의존 0(오프라인 동작)이다. → 캐시 + 짧은 타임아웃 + 실패 시 3칼럼 강등.\r\n8. **config 사본이 둘**: `lens.config.json` 은 레포본과 **플러그인 캐시 설치본**이 따로 있다. `resolveBase` 가 어느 것을 읽는지 모호하면 머신·레포마다 다른 답이 나온다. → 읽기 경로를 T2 에 명시.\r\n9. **`git cherry` 는 원격 기준**: T5 가 만든 브랜치는 첫 push 전엔 로컬 전용이라 `mergedState` 판정이 달라진다. → 로컬/원격 브랜치를 구분해 처리.\r\n10. **fetch 27회 중복**: T2 검증의 판정표는 레포별 `git fetch` 를 요구하고, 이는 `/cs` 가 이미 하는 일과 중복이다. 네트워크 실패 시 stale base 로 판정이 떨어진다. → `/cs` 의 fetch 결과 재사용 또는 \"fetch 없이 판정 + stale 표시\".\r\n11. **이 계획 자체가 전제를 위반**: \"1 task = 1 레포\"를 기본 전제로 뒀지만, 이 작업은 `creeta-lens`(주) + `livevil-research`(T0 정리·T8 원본) **2개 레포**를 건드린다. 첫 실행부터 멀티레포다. → T0 를 별도 task 로 분리하는 편이 전제와 정합.\r\n12. **`/cp done` 이중 게이트**: T6 의 \"미머지면 history 금지\"가 기존 Phase 1.2 완료추정(체크리스트 ≥80%)과 겹친다. 체크리스트 100% + PR 미머지인 task 는 영구히 `tasks/` 에 남는다. → 두 판정의 우선순위를 T6 에 명시.\r\n\r\n#### Codex 관점\r\n\r\nPhase 0.5 에서 Codex 독립 조사가 이미 수행됐고 리스크 시각은 `🔀 듀얼 합성` 에 통합됨 (부분 실패 manifest·worktree 격리·staging 우회). 중복 호출 회피 규칙에 따라 별도 Codex pre-mortem 은 생략.\r\n\r\n#### Trigger 매핑 (Pre-mortem → Plan B / 신규 트리거)\r\n\r\n- 이미 매핑됨: 1(→R4·Side Effect), 7(→T7 degrade), 12(→R7 마찰)\r\n- **신규 트리거로 승격** (아래 \"막힐 수 있는 지점\"에 추가): 2(룰 충돌 → 기본값 정책 재결정), 3(`/c` 누락), 4(완료=배포), 9(로컬 브랜치 판정), 11(멀티레포 전제)\r\n\r\n## 💡 시사점 · ⚠️ 주의점 · 🔀 Side Effect\r\n\r\n- **💡 시사점**: Lens 가 지금까지 \"문서 상태\"만 관리했다는 것이 이 작업으로 드러난다 — `docs/tasks/` 유무가 곧 진행 상태라는 원칙(`폴더 = 상태`)은 문서 세계에서만 참이었고, 코드 세계의 진행 상태(브랜치·PR·머지)와 이중장부였다. 이걸 붙이면 board 가 처음으로 **실제 개발 상태판**이 된다(In Review 칼럼). 이후 열리는 방향: PR 상태를 근거로 `/cp done` 의 완료 추정 정확도가 올라가고(체크박스 휴리스틱 의존 감소), `/ccp` 가 \"PR diff 를 대상으로\" 검증하는 경로가 열린다.\r\n- **⚠️ 주의점**:\r\n  - **삭제 자동화 없이 생성 자동화를 배포하면 안 된다.** T8(prune) 미완 상태로 `requireTaskBranch:true` 를 켜면 브랜치 누적이 가속된다. 그래서 T9 기본값을 false 로 두고 T0·T8 완료를 전환 조건으로 명시했다.\r\n  - **`Returns_ERP_v20` 을 첫 검증 대상으로 삼는다.** 가장 위험한 레포에서 먼저 통과해야 나머지에 켤 수 있다. staging 커밋이 곧 배포다.\r\n  - **머지 판정을 `ahead` 로 하지 않는다.** 계보가 다르면(orphan) ahead 가 수백으로 보이지만 병합할 것은 없다 — 이미 실측된 오판 사례가 있다.\r\n  - `livevil-research` 는 지금 base 가 아닌 브랜치에 체크아웃돼 있고 그 브랜치가 upstream 을 갖고 있다. T0 정리 없이 T2 를 돌리면 `resolveBase` 가 그 피처 브랜치를 base 로 판정한다.\r\n- **🔀 Side Effect (blast radius)**:\r\n  - `/cs` 동작이 바뀐다 → task 브랜치를 건너뛰므로, 그 변경은 PR 머지 전까지 **다른 머신(Mac Mini)에 도달하지 않는다.** 지금은 `sync/` PR 로라도 원격에 올라갔다. 운영 머신에서 바로 필요한 변경은 `/cs push` 로 별도 처리해야 한다.\r\n  - `autoCommitOnComplete:true` 의 의미가 바뀐다 → \"base 에 커밋\"이 아니라 \"task 브랜치에 커밋\". 기존 세션 흐름을 기억하는 사용자에게는 동작 변화로 체감된다.\r\n  - `board_*.html` 스키마가 바뀐다(칼럼 4개) → 기존 board 파일은 재빌드 필요. `gh` 없는 머신에서는 3칼럼으로 떨어진다.\r\n  - `lib/plan-manager.js` frontmatter 변경 → v3.3.x 호환 주석이 달린 코드다. 기존 task 문서 27개 이상이 새 필드 없이 존재하므로 파싱 하위호환이 필수.\r\n  - `/c`(단일 worker) 는 이 계획 범위 밖이지만 같은 자동커밋 규칙을 참조한다 → T5 변경 후 `/c` 문서와 불일치가 생길 수 있다(후속 정합 필요, 이번엔 언급만).\r\n\r\n## ⚠️ 리스크 레지스터\r\n\r\n| ID | 리스크 | 트리거 | 영향 | 대응 | 중단 조건 |\r\n|---|---|---|---|---|---|\r\n| R1 | 브랜치 자동 생성이 누적 문제를 가속 | `requireTaskBranch:true` 전환 후 임의 레포의 원격 브랜치가 5개 초과 | 높음 | T8(prune)을 같은 릴리즈에 묶고, T0 선행 정리를 완료 조건으로. `/cs` 종료 시 5개 초과 경고 | T8 미완이면 `requireTaskBranch` 를 true 로 올리지 않는다 |\r\n| R2 | `Returns_ERP_v20` staging 오배포 | base 판정이 staging 을 못 잡아 main 을 base 로 PR, 또는 staging 에 직접 커밋 | 높음 (운영 사고) | `lens.config.baseBranch[\"Returns_ERP_v20\"]=\"staging\"` 명시값 우선. 이 레포를 T2·T5 첫 검증 대상으로 | 감지된 base 가 config 명시값과 불일치하면 그 레포에서 실행 차단 |\r\n| R3 | 병렬 worker 가 같은 파일 동시 수정 → 변경 유실 | 같은 파일을 대상으로 하는 worker 2개 이상 배포 | 중간 | worktree 격리 + `hook-utils.js` lock 으로 Leader 직렬 통합 | 충돌이 1회라도 감지되면 그 task 는 순차 실행으로 강등 |\r\n| R4 | `gh` 부재·`workflow` 스코프로 PR 생성 실패 | T5 검증에서 실패 레포 3개 이상 | 중간 | Plan B(로컬 머지 모드)로 전환, 레포별 오버라이드 | PR 실패가 3레포 이상이면 `mergeMode:\"local\"` 로 전환 |\r\n| R5 | 기존 stale 브랜치·열린 PR 이 새 규칙과 충돌 | T0 없이 T2~T6 도입 | 중간 | T0 를 선행 필수로. `livevil-research` 체크아웃 복귀 + PR #4·#5 처리 | T0 미완이면 T2 검증을 실행하지 않는다 |\r\n| R6 | patch-id 로 머지를 증명 못 하는 브랜치 다수 | 리베이스 충돌 해결 이력이 있는 브랜치(`task/community-insight-surface-v3` 등) | 낮음 | 자동 삭제 대상에서 제외하고 `유지` 로 남겨 사람이 확인 | 추측 삭제 금지 — `--apply` 는 두 `삭제` 판정만 |\r\n| R7 | 완료 처리 마찰(PR 열림 = 미완) | 한 세션에 2회 이상 완료 차단 | 낮음 | Plan B 로 전환하거나 `/cp done` 에 \"PR 열림 상태로 history 기록\" 명시 옵션 추가 | 사용자가 마찰을 지적하면 즉시 Plan B 검토 |\r\n\r\n## ❓ 미해결 질문\r\n\r\n**차단 (답이 없으면 실행 불가)**\r\n- (없음)\r\n\r\n**비차단 (가정을 두고 진행)**\r\n- `master` → `main` 이름 통일을 할 것인가 — **가정**: 하지 않는다. Lens 가 base 를 감지하므로 기능상 불필요하고, rename 은 원격 default·다른 머신·배포 훅까지 파급된다. · **확인 시점**: T1 문서 작성 시 사용자에게 한 줄 확인, 원하면 별도 task 로 분리\r\n- `namane-cms` 는 원격에 `main` 과 `master` 가 **둘 다** 있다 — **가정**: 체크아웃된 `master`(upstream 존재)를 base 로 본다. · **확인 시점**: T2 의 27개 레포 판정표 출력 시 이 레포를 명시 표시해 사용자 확인\r\n- `docs` 레포는 원격에 `main`·`master` 둘 다 없고, upstream 조회 결과가 정상 형태(`origin/main`)가 아
